# ADR-0031 / IADR-0121 決定 2: フロントエンドのパッケージ管理は pnpm workspace（npm workspaces から移行）。
# - '*/frontend' は src/<unit>/frontend を自動認識する（FR-14 / IADR-0056 決定 6。ユニットを submodule で
#   追加しても本ファイルの編集が要らない性質を npm workspaces から引き継ぐ）。
# - 'packages/*' はユニットに属さない共有ワークスペースパッケージ（@platform/ui）。IADR-0121 決定 4。
# - '../templates/*/frontend' は追加可変機能ユニットの**雛形**（templates/unit-template/frontend）を
#   workspace メンバに含める。雛形は本体のビルド対象ではないが、メンバにしないと
#   `pnpm -r run typecheck` の射程から外れ、**現行スタックからずれても誰も気付かない**。
#   実際、雛形のフロントは旧ルータ契約（#490 以前）と依存宣言なし（#591 以前）のまま取り残されていた。
#   バックエンド側は ci.yml が同じ理由で templates/ を走査対象に含めており、これはそのフロント版である。
packages:
  - '*/frontend'
  - 'packages/*'
  - '../templates/*/frontend'
  # FR-20 / ADR-0037 決定 1 / IADR-0331 決定 2: 自作 Obsidian プラグイン（社内配布）。
  #   アプリ（*/frontend）でもユニットが共用するライブラリ（packages/*）でもない**第 3 の成果物**なので、
  #   どちらのグロブにも入れず名指しで置く。メンバにするのは typecheck / lint / format / 単体テストの
  #   横断ゲート（frontend.yml / frontend-tests.yml）に乗せるためで、SPA には import されない
  #   （BFF も経由せず、DocumentService の同期プロトコルを同期トークンで直接呼ぶ）。
  - 'obsidian-plugin'
