# NFR, IADR-0708: 第三者のイメージの走査（.github/workflows/third-party-image-scan.yml）で受け入れる脆弱性。
#
# 書き方（Trivy の YAML の ignore ファイル）。1 件ごとに、理由（statement）と期限（expired_at。最長 90 日先）を必ず書く。
# 期限が過ぎると Trivy は再び数えるので、週次の走査が赤に戻る（受け入れを黙って恒久化しない）。
# 書いてよいのは公開の脆弱性の ID（CVE）だけ。手順は docs/operations/third-party-image-scan-runbook.md。
#
#   vulnerabilities:
#     - id: CVE-0000-00000
#       statement: 届かない経路の理由（例: その機能をこの配備では使わない）。追跡の issue 番号
#       expired_at: 2026-12-31
#
# 項目の書式（id・statement・expired_at の有無と期限の上限）は scripts/scripts.repo.test.js が固定する。
vulnerabilities: []
