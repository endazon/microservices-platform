# Issue #126: フロントエンド SPA の CI（typecheck / lint / build / e2e スモーク）。
# FR-14, IADR-0056: フロントエンドは src/<unit>/frontend（workspaces ルート = src/）。
# 各ユニットの frontend 変更で起動する。バックエンド（.NET）CI とは独立。
# 単体テスト＝品質ゲートは frontend-tests.yml（pnpm run test:coverage）が担うため、
# 本ワークフローではテストを実行しない（同一スイートの二重実行を避ける。IADR-0034）。
name: Frontend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "src/*/frontend/**"
      - "src/packages/**"
      # FR-20 / ADR-0037 決定 1 / IADR-0338 決定 2: 自作 Obsidian プラグイン（pnpm workspace メンバ）。
      # "src/*/frontend/**" にも "src/packages/**" にも一致しない第 3 の成果物なので名指しで足す。
      - "src/obsidian-plugin/**"
      - "src/package.json"
      - "src/pnpm-lock.yaml"
      - "src/pnpm-workspace.yaml"
      - "src/vitest.config.ts"
      - "src/orval.config.ts"
      - "src/orval-bff-only.cjs"
      - "docs/api/openapi.yaml"
      - "src/eslint.config.js"
      # Issue #562: 整形ゲートの設定と**対象範囲の単一情報源**。これらを単独で変えても
      # CI が走らないと、範囲を広げすぎ／狭めすぎる変更を検出できない（eslint.config.js と同じ理由）。
      - "src/.prettierrc.json"
      - "src/.prettierignore"
      # NFR / issue #493 / IADR-0211: 未使用検出（Knip）の**走査スコープの単一情報源**。
      # 除外・entry を単独で広げ／狭めても CI が走らないと、検査を骨抜きにする変更を検出できない
      # （.prettierignore と同じ理由）。
      - "src/knip.jsonc"
      # NFR / IADR-0214: **本ワークフローで走るゲートが読む入力**（検査器本体・床・突合先）。
      # ci.yml の scripts-tests は各検査器の `--self-test`（**構造検査のみ**——純関数の振る舞いと
      # 設定同士の突合）しか走らせず、**床と実測値の突合は本ワークフローの 1 箇所だけ**である。
      # したがってこれらが paths: に無いと、**床だけを緩める PR でゲートが 1 度も起動しない**
      # （実測: 床 counts.exports を 18 → 60 にすると scripts-tests は 636 件通過して EXIT=0、
      # `node scripts/check-knip.js --require` だけが EXIT=1 になる）。
      # **列挙は手で書くが、腐りは機械が見る** —— scripts/scripts.repo.test.js の IADR-0214 節が
      # 各ゲートのソースから `path.join` 定数を静的に導き、push / pull_request の両方と突合する。
      - ".gitmodules"
      - "scripts/check-knip.js"
      - "scripts/knip-baseline.json"
      - "scripts/check-chunk-budget.js"
      - "scripts/chunk-budget-baseline.json"
      - "scripts/check-static-egress.js"
      - "scripts/check-i18n-catalogs.js"
      # IADR-0125: ロケール追加など lingui.config.ts 単独の変更でも i18n 検査を走らせる
      # （単独で変わることは稀だが、走らない経路を残すと「検査したつもり」になる）。
      - "src/lingui.config.ts"
      # NFR / issue #747: AST（可変ユニット）submodule のポインタ。SPA は @ai-stock-trading/features を
      # **静的 import** しており AST のコードは初期ロードへ入るが、bump で変わるのは gitlink 1 エントリ
      # （src/ai-stock-trading）だけで、src/*/frontend/** には一致しない。従前これが無く、**3 回の bump が
      # build も check-chunk-budget も通らず素通りし、+35.51 kB が無関係な PR で表面化した**。
      # 末尾に /** を付けない（gitlink そのものを指すため。src/ai-stock-trading/** では一致しない）。
      # **src/ 配下へ submodule を足したらここへも足すこと**（checkout 側は .gitmodules を総なめする
      # 汎用形だが、paths: は glob で gitlink を表現できない。scripts.repo.test.js が突合する）。
      - "src/ai-stock-trading"
      # FR-14 / IADR-0060: 追加可変機能ユニットの雛形。src/ の外にあるため上の "src/*/frontend/**" に
      # 一致せず、従前は**雛形をどう壊しても本 CI が起動しなかった**。実際、雛形のフロントは
      # 旧ルータ契約（#490 以前）と依存宣言なし（#591 以前）のまま取り残されていた。
      # 雛形は pnpm workspace メンバなので typecheck は既存ジョブが拾い、lint / format は下の専用ステップが見る。
      - "templates/*/frontend/**"
      - "src/eslint.templates.config.js"
      - ".github/workflows/frontend.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/*/frontend/**"
      - "src/packages/**"
      # FR-20 / ADR-0037 決定 1 / IADR-0338 決定 2: 自作 Obsidian プラグイン（pnpm workspace メンバ）。
      # "src/*/frontend/**" にも "src/packages/**" にも一致しない第 3 の成果物なので名指しで足す。
      - "src/obsidian-plugin/**"
      - "src/package.json"
      - "src/pnpm-lock.yaml"
      - "src/pnpm-workspace.yaml"
      - "src/vitest.config.ts"
      - "src/orval.config.ts"
      - "src/orval-bff-only.cjs"
      - "docs/api/openapi.yaml"
      - "src/eslint.config.js"
      # Issue #562: 整形ゲートの設定と**対象範囲の単一情報源**。これらを単独で変えても
      # CI が走らないと、範囲を広げすぎ／狭めすぎる変更を検出できない（eslint.config.js と同じ理由）。
      - "src/.prettierrc.json"
      - "src/.prettierignore"
      # NFR / issue #493 / IADR-0211: 未使用検出（Knip）の**走査スコープの単一情報源**。
      # 除外・entry を単独で広げ／狭めても CI が走らないと、検査を骨抜きにする変更を検出できない
      # （.prettierignore と同じ理由）。
      - "src/knip.jsonc"
      # NFR / IADR-0214: 本ワークフローで走るゲートが読む入力（push 側と同じ理由）。
      # scripts-tests が走らせる `--self-test` は構造検査のみで、床と実測値の突合はここだけである。
      - ".gitmodules"
      - "scripts/check-knip.js"
      - "scripts/knip-baseline.json"
      - "scripts/check-chunk-budget.js"
      - "scripts/chunk-budget-baseline.json"
      - "scripts/check-static-egress.js"
      - "scripts/check-i18n-catalogs.js"
      # IADR-0125: ロケール追加など lingui.config.ts 単独の変更でも i18n 検査を走らせる
      # （単独で変わることは稀だが、走らない経路を残すと「検査したつもり」になる）。
      - "src/lingui.config.ts"
      # NFR / issue #747: AST submodule のポインタ（push 側と同じ理由。末尾に /** を付けない）。
      - "src/ai-stock-trading"
      # FR-14 / IADR-0060: 追加可変機能ユニットの雛形（push 側と同じ理由）。
      - "templates/*/frontend/**"
      - "src/eslint.templates.config.js"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: src

# NFR / IADR-0232 決定 1: 連続 push で古い実行を捨てる（PR のみ）。
# develop / main への push は完走させる。
concurrency:
  group: frontend-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #283, IADR-0070: 可変ユニット（src/*）の submodule を取得する。SPA は @ai-stock-trading を
      # 合成し pnpm workspace メンバでもあるため、未取得だと pnpm install / build / typecheck が解決不能になる。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        working-directory: ${{ github.workspace }}
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # IADR-0121 決定 2: パッケージ管理は pnpm workspace。CI では Volta を使わず pnpm/action-setup で
      # 版を解決する（版の単一情報源は src/package.json の packageManager フィールド）。
      # package_json_file を明示するのは、action の既定がリポジトリ直下の package.json であり、
      # 本リポジトリの workspace ルートは src/ のため既定では版を解決できず
      # 「Error: No pnpm version is specified.」で落ちるからである（PR #489 の CI で実測）。
      # version: を直書きしないのは、版の単一情報源を src/package.json の packageManager に保つため。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 雛形（templates/*/frontend）もここで検査される——pnpm workspace のメンバであり
      # `pnpm run typecheck` が `pnpm -r` で回るため（src/pnpm-workspace.yaml）。
      # 旧契約へ戻すと TS2305 で赤くなることを実測済み（#591 以前の形は解決できない）。
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      # FR-14 / IADR-0060: 雛形の lint。ESLint の flat config は設定ファイルのあるディレクトリの外を
      # 検査しないため、上の `pnpm run lint`（src/ が基準）は templates/ へ到達できない。
      # 雛形専用の入口で検査する（禁止リストは eslint.config.js から import する＝単一情報源）。
      - name: Lint (unit template)
        run: pnpm run lint:templates
      # 同上。prettier は各ファイルの位置から上へ設定を探すため、src/.prettierrc.json を
      # 見つけられない（設定なしの既定で整形され、--check が自己矛盾なく通ってしまう）。--config で明示する。
      - name: Format check (unit template)
        run: pnpm run format:templates
      # NFR / issue #562: 整形ゲート。バックエンドは ci.yml の lint ジョブが
      # `dotnet format --verify-no-changes` で整形を強制しているのに対し、フロントには
      # 同等のゲートが無く、整形揺れは AI レビューの目でしか拾えなかった。
      # 対象範囲の単一情報源は src/.prettierignore（グロブをここへ複写しない）。
      # 上の「Format check (unit template)」は例外である —— 雛形は src/ の外にあり .prettierignore の
      # 射程に構造的に入らない。例外を許す 3 条件は IADR-0203 決定 3 の 2026-08-16 追記（#802）が定める。
      - name: Format check (prettier)
        run: pnpm run format:check
      # NFR / ADR-0031（13_frontend-stack §採用技術一覧「Dead Code 検出 = Knip」）/ IADR-0121 決定 1 /
      # IADR-0211 / issue #493: 未使用のファイル・export・依存の**ラチェット**。
      # **素の `pnpm run knip` はゲートにしない** —— 着手時点の残件 41 件で必ず exit 1 になり常時赤になる。
      # 区分ごとの件数を scripts/knip-baseline.json の床と突き合わせ、**増加も減少も fail** させる。
      # --require は Knip が未インストールなら fail する（「入っていないから素通り」で検査が静かに
      # 失効するのを防ぐ。check-chunk-budget.js / check-static-egress.js と同じ段階ポリシー）。
      # 位置が Build の**前**なのは、Knip がソースの静的解析であり dist を要らないためである。
      - name: Unused code and dependencies (knip ratchet)
        working-directory: ${{ github.workspace }}
        run: node scripts/check-knip.js --require
      # ADR-0031 / IADR-0121 決定 3: BFF OpenAPI から生成した API クライアントはコミットしている。
      # 再生成して差分が出るなら、OpenAPI と生成物が乖離している（＝手で触ったか、更新し忘れた）。
      - name: Codegen is up to date (orval)
        run: |
          pnpm run codegen
          git diff --exit-code -- platform/frontend/src/lib/api/generated
      # ADR-0031 / IADR-0125 決定 4: Lingui のカタログもコミットしている。検出は 3 段で、
      # 互いを置換しない（同決定の実測表）。ここは 1 段目——ソースに msg を足してカタログを
      # 更新し忘れた場合を止める。extract は未訳を msgstr "" として書き出す正常動作のため、
      # 差分検査だけでは「訳が空」を検出できない（それは次のステップが担う）。
      - name: i18n catalogs are up to date (lingui)
        run: |
          pnpm run i18n
          git diff --exit-code -- platform/frontend/src/locales
      # 2 段目——カタログは最新だが msgstr が空（＝未翻訳）のキーを止める。sourceLocale も見る
      # （lingui compile --strict は sourceLocale を見ないため、これが無いと ja の未訳が素通りする）。
      - name: i18n catalogs have no untranslated keys
        working-directory: ${{ github.workspace }}
        run: node scripts/check-i18n-catalogs.js
      # 単体テストは frontend-tests.yml（pnpm run test:coverage）へ集約（二重実行回避・IADR-0034）。
      - name: Build
        run: pnpm run build
      # NFR / ADR-0031 / IADR-0134 / issue #556: manualChunks の規則構成と初期ロード量の検査。
      # **dist が在るジョブはここだけ**（ci.yml の scripts-tests には無い）なので、実成果物に対する
      # 検査はこの位置へ結線する。--require は dist が無ければ fail する
      # （「成果物が無いから素通り」で検査が静かに失効するのを防ぐ）。
      # 規則を 1 つ外すと落ちることは実ビルドの変異試験で実測済み（#556 の作業仕様書）。
      - name: manualChunks rules and initial-load budget
        working-directory: ${{ github.workspace }}
        run: node scripts/check-chunk-budget.js --require
      # ADR-0031 / IADR-0125: 共有 UI パッケージのカタログ。ビルドが通ることの確認と、
      # 次のステップの走査対象を作ることを兼ねる。
      - name: Build Storybook (catalog)
        run: pnpm --filter @platform/ui run build-storybook
      # FR-20 / ADR-0037 決定 1 / IADR-0338 決定 3: 自作 Obsidian プラグインの成果物（dist/main.js・manifest.json・
      # cli.mjs）。ビルドが通ることの確認と、次のステップの走査対象を作ることを兼ねる（Storybook と同じ位置づけ）。
      - name: Build Obsidian plugin
        run: pnpm --filter @platform/obsidian-plugin run build
      # 08_data-egress-policy / IADR-0125 決定 5: 外部 CDN・Web フォント・analytics を使わない。
      # 設定（disableTelemetry 等）だけでは「設定したつもり」を検出できないため、**成果物を走査**する。
      # --require は対象が存在しなければ fail する（走査 0 件を成功と誤らせない）。
      - name: No external egress in build artifacts
        working-directory: ${{ github.workspace }}
        run: >
          node scripts/check-static-egress.js
          --require src/packages/ui/storybook-static
          --require src/platform/frontend/dist
          --require src/obsidian-plugin/dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #283, IADR-0070: 可変ユニット（src/*）の submodule を取得する（@ai-stock-trading 合成のため）。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        working-directory: ${{ github.workspace }}
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # IADR-0121 決定 2: パッケージ管理は pnpm workspace。CI では Volta を使わず pnpm/action-setup で
      # 版を解決する（版の単一情報源は src/package.json の packageManager フィールド）。
      # package_json_file を明示するのは、action の既定がリポジトリ直下の package.json であり、
      # 本リポジトリの workspace ルートは src/ のため既定では版を解決できず
      # 「Error: No pnpm version is specified.」で落ちるからである（PR #489 の CI で実測）。
      # version: を直書きしないのは、版の単一情報源を src/package.json の packageManager に保つため。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # スクリーンレベル・スモーク（バックエンド不要。ログイン画面到達を検証）。
      # --filter で platform/frontend の文脈を指定する。@playwright/test は workspace ルート（src/）では
      # なく platform/frontend の devDependency であり、pnpm は npm と違って各パッケージの .bin しか
      # 見せないため、src/ での素の `pnpm exec playwright` はバイナリを解決できず
      # 「ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL Command "playwright" not found」で落ちる（PR #489 の CI で実測）。
      # 後続の Build / E2E も同じく src/ から --filter でパッケージへ委譲する（ルートの package.json の
      # スクリプト経由）ため、working-directory は src/ のまま揃える。
      # NFR / IADR-0232: Playwright のブラウザをキャッシュする。--with-deps は apt-get も叩くため、
      # 未キャッシュ時は 1〜2 分掛かる（AST 側の同じステップは実測 31 秒）。
      # キーは pnpm-lock.yaml のハッシュ（= @playwright/test の版が変われば取り直す）。
      - uses: actions/cache@v6
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('src/pnpm-lock.yaml') }}
      # ヒット時もシステム依存（apt）の導入だけは要るため --with-deps は落とさない。
      # ブラウザ本体はキャッシュから復元され、ダウンロードが省かれる。
      - name: Install Playwright browser
        run: pnpm --filter @platform/frontend exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
      - name: E2E smoke
        run: pnpm run test:e2e
