# Issue #126: フロントエンド SPA の CI（typecheck / lint / build / e2e スモーク）。
# FR-14, IADR-0056: フロントエンドは src/<unit>/frontend（workspaces ルート = src/）。
# 各ユニットの frontend 変更で起動する。バックエンド（.NET）CI とは独立。
# 単体テスト＝品質ゲートは frontend-tests.yml（pnpm run test:coverage）が担うため、
# 本ワークフローではテストを実行しない（同一スイートの二重実行を避ける。IADR-0034）。
name: Frontend CI

on:
  push:
    branches: [develop, main]
    paths:
      - "src/*/frontend/**"
      - "src/packages/**"
      - "src/package.json"
      - "src/pnpm-lock.yaml"
      - "src/pnpm-workspace.yaml"
      - "src/vitest.config.ts"
      - "src/orval.config.ts"
      - "src/orval-bff-only.cjs"
      - "docs/api/openapi.yaml"
      - "src/eslint.config.js"
      # Issue #562: 整形ゲートの設定と**対象範囲の単一情報源**。これらを単独で変えても
      # CI が走らないと、範囲を広げすぎ／狭めすぎる変更を検出できない（eslint.config.js と同じ理由）。
      - "src/.prettierrc.json"
      - "src/.prettierignore"
      # IADR-0125: ロケール追加など lingui.config.ts 単独の変更でも i18n 検査を走らせる
      # （単独で変わることは稀だが、走らない経路を残すと「検査したつもり」になる）。
      - "src/lingui.config.ts"
      - ".github/workflows/frontend.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/*/frontend/**"
      - "src/packages/**"
      - "src/package.json"
      - "src/pnpm-lock.yaml"
      - "src/pnpm-workspace.yaml"
      - "src/vitest.config.ts"
      - "src/orval.config.ts"
      - "src/orval-bff-only.cjs"
      - "docs/api/openapi.yaml"
      - "src/eslint.config.js"
      # Issue #562: 整形ゲートの設定と**対象範囲の単一情報源**。これらを単独で変えても
      # CI が走らないと、範囲を広げすぎ／狭めすぎる変更を検出できない（eslint.config.js と同じ理由）。
      - "src/.prettierrc.json"
      - "src/.prettierignore"
      # IADR-0125: ロケール追加など lingui.config.ts 単独の変更でも i18n 検査を走らせる
      # （単独で変わることは稀だが、走らない経路を残すと「検査したつもり」になる）。
      - "src/lingui.config.ts"
      - ".github/workflows/frontend.yml"

defaults:
  run:
    working-directory: src

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #283, IADR-0070: 可変ユニット（src/*）の submodule を取得する。SPA は @ai-stock-trading を
      # 合成し pnpm workspace メンバでもあるため、未取得だと pnpm install / build / typecheck が解決不能になる。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        working-directory: ${{ github.workspace }}
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # IADR-0121 決定 2: パッケージ管理は pnpm workspace。CI では Volta を使わず pnpm/action-setup で
      # 版を解決する（版の単一情報源は src/package.json の packageManager フィールド）。
      # package_json_file を明示するのは、action の既定がリポジトリ直下の package.json であり、
      # 本リポジトリの workspace ルートは src/ のため既定では版を解決できず
      # 「Error: No pnpm version is specified.」で落ちるからである（PR #489 の CI で実測）。
      # version: を直書きしないのは、版の単一情報源を src/package.json の packageManager に保つため。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Typecheck
        run: pnpm run typecheck
      - name: Lint
        run: pnpm run lint
      # NFR / issue #562: 整形ゲート。バックエンドは ci.yml の lint ジョブが
      # `dotnet format --verify-no-changes` で整形を強制しているのに対し、フロントには
      # 同等のゲートが無く、整形揺れは AI レビューの目でしか拾えなかった。
      # 対象範囲の単一情報源は src/.prettierignore（グロブをここへ複写しない）。
      - name: Format check (prettier)
        run: pnpm run format:check
      # ADR-0031 / IADR-0121 決定 3: BFF OpenAPI から生成した API クライアントはコミットしている。
      # 再生成して差分が出るなら、OpenAPI と生成物が乖離している（＝手で触ったか、更新し忘れた）。
      - name: Codegen is up to date (orval)
        run: |
          pnpm run codegen
          git diff --exit-code -- platform/frontend/src/foundation/api/generated
      # ADR-0031 / IADR-0125 決定 4: Lingui のカタログもコミットしている。検出は 3 段で、
      # 互いを置換しない（同決定の実測表）。ここは 1 段目——ソースに msg を足してカタログを
      # 更新し忘れた場合を止める。extract は未訳を msgstr "" として書き出す正常動作のため、
      # 差分検査だけでは「訳が空」を検出できない（それは次のステップが担う）。
      - name: i18n catalogs are up to date (lingui)
        run: |
          pnpm run i18n
          git diff --exit-code -- platform/frontend/src/foundation/i18n/locales
      # 2 段目——カタログは最新だが msgstr が空（＝未翻訳）のキーを止める。sourceLocale も見る
      # （lingui compile --strict は sourceLocale を見ないため、これが無いと ja の未訳が素通りする）。
      - name: i18n catalogs have no untranslated keys
        working-directory: ${{ github.workspace }}
        run: node scripts/check-i18n-catalogs.js
      # 単体テストは frontend-tests.yml（pnpm run test:coverage）へ集約（二重実行回避・IADR-0034）。
      - name: Build
        run: pnpm run build
      # ADR-0031 / IADR-0125: 共有 UI パッケージのカタログ。ビルドが通ることの確認と、
      # 次のステップの走査対象を作ることを兼ねる。
      - name: Build Storybook (catalog)
        run: pnpm --filter @platform/ui run build-storybook
      # 08_data-egress-policy / IADR-0125 決定 5: 外部 CDN・Web フォント・analytics を使わない。
      # 設定（disableTelemetry 等）だけでは「設定したつもり」を検出できないため、**成果物を走査**する。
      # --require は対象が存在しなければ fail する（走査 0 件を成功と誤らせない）。
      - name: No external egress in build artifacts
        working-directory: ${{ github.workspace }}
        run: >
          node scripts/check-static-egress.js
          --require src/packages/ui/storybook-static
          --require src/platform/frontend/dist

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #283, IADR-0070: 可変ユニット（src/*）の submodule を取得する（@ai-stock-trading 合成のため）。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        working-directory: ${{ github.workspace }}
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # IADR-0121 決定 2: パッケージ管理は pnpm workspace。CI では Volta を使わず pnpm/action-setup で
      # 版を解決する（版の単一情報源は src/package.json の packageManager フィールド）。
      # package_json_file を明示するのは、action の既定がリポジトリ直下の package.json であり、
      # 本リポジトリの workspace ルートは src/ のため既定では版を解決できず
      # 「Error: No pnpm version is specified.」で落ちるからである（PR #489 の CI で実測）。
      # version: を直書きしないのは、版の単一情報源を src/package.json の packageManager に保つため。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # スクリーンレベル・スモーク（バックエンド不要。ログイン画面到達を検証）。
      # --filter で platform/frontend の文脈を指定する。@playwright/test は workspace ルート（src/）では
      # なく platform/frontend の devDependency であり、pnpm は npm と違って各パッケージの .bin しか
      # 見せないため、src/ での素の `pnpm exec playwright` はバイナリを解決できず
      # 「ERR_PNPM_RECURSIVE_EXEC_FIRST_FAIL Command "playwright" not found」で落ちる（PR #489 の CI で実測）。
      # 後続の Build / E2E も同じく src/ から --filter でパッケージへ委譲する（ルートの package.json の
      # スクリプト経由）ため、working-directory は src/ のまま揃える。
      - name: Install Playwright browser
        run: pnpm --filter @platform/frontend exec playwright install --with-deps chromium
      - name: Build
        run: pnpm run build
      - name: E2E smoke
        run: pnpm run test:e2e
