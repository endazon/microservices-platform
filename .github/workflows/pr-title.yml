# PR タイトル（＝スカッシュマージ後件名）の規約チェック。
#
# 背景: ci.yml の commit-messages ジョブは PR コミット（base..HEAD）を検査するが、スカッシュ
# マージで統合ブランチに載る件名は「PR タイトル + 半角スペース + (#番号)」であり、その範囲に
# 含まれず未検査になる。中間コミットは force push 禁止のため事後修正できないため、PR タイトル
# 検査が最後の砦にあたる。本ワークフローは PR タイトルを規約 `種別(起点ID): 要約` に照合し、
# 違反ならマージ前に CI を失敗させる。
#
# 検査ロジックは scripts/check-commit-messages.js の単一件名モード（--title 引数 / PR_TITLE
# 環境変数 → validateSubject を再利用）に実装済みで、scripts/scripts.test.js に単体テストもある。
# 本ファイルはその呼び出し配線のみを担う（規約の単一情報源を二重実装しない）。
#
# edited を含めることで、PR タイトルを後から編集した場合にも再検査する。
#
# bot 作成 PR（dependabot 等）の除外は **スクリプト側（BOT_AUTHORS への完全一致）** が担う。
# ジョブ条件で `user.type != 'Bot'` により弾いてはならない —— GitHub App（`claude[bot]` 等）が
# 作成した PR も `user.type == 'Bot'` になるため、**AI に実装を委ねる運用（本キットが前提と
# する主要な経路）でだけ「最後の砦」が skipped になる**（planning#202）。除外の規約は
# BOT_AUTHORS を単一情報源とし、ここで二重実装しない。
#
# このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効。

name: PR Title

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

# タイトル編集の連打時は古い実行をキャンセルする。
concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pr-title:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check PR title (squash subject)
        # タイトル・作成者は環境変数経由で渡し、シェル展開による注入を避ける。
        # bot の除外・Revert / [skip ci] の除外・空タイトル時の fail-open はスクリプト側が担う。
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/check-commit-messages.js
