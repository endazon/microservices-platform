# 実コンテナ統合テスト（IADR-0232 決定 3。AST の integration.yml / IADR-0049 と同型）
#
# ■ なぜ分離したか
# 着手前の実測（2026-08-21・run 32487460689）で、ci.yml の build-and-test は 7 分 42 秒掛かり
# CI 全体（8 分 03 秒）のクリティカルパスを 1 本で占めていた。その中身は 2 ユニットの直列ループと、
# Testcontainers で実 RabbitMQ / Postgres / MinIO を起動する統合テストの同居である。
# 既定 CI（ci.yml）は --filter "Category!=Integration" で同トレイトを除外し、本ワークフローが全件を回す。
#
# ■ 🔴 ここが「PR から外した分の担保」である（IADR-0232 決定 1・利用者裁定 2026-08-21）
# 「毎 PR の精度は下がってよいが、develop マージ時か日次実行でどこかで担保する。
# そこで失敗したら自動で issue を起票する」。したがって:
#   - push: [develop]  … マージした瞬間に回す（退行の混入を当日中に知る）
#   - schedule         … 日次で回す（マージが無い日も担保する）
#   - report-failure   … 落ちたら issue を立てる。これが無ければ「外した」は「やめた」と同義になる。
#
# ■ 除外の射程
# 外すのは Category=Integration だけである。同じ Knowledge.IntegrationTests に居る
# Category=Deployment（helm manifest 検証）と Category=EndpointRouting（インプロセス）は
# Docker を使わず速いため PR に残してある。「遅いから外す」のであって「同じディレクトリに
# 居るから外す」のではない。
#
# GitHub の ubuntu ランナーは Docker 同梱のため Testcontainers が動作する。
name: Integration

on:
  push:
    branches: [develop]
  schedule:
    # 毎日 UTC 18:00（JST 03:00）。AST の integration.yml と同じ時刻に揃えてある。
    - cron: "0 18 * * *"
  workflow_dispatch:
    inputs:
      force_failure:
        description: "自動起票の動作確認用に、テストを走らせず必ず失敗させる（IADR-0232 残余リスク）"
        type: boolean
        required: false
        default: false

# 同時実行は 1 本に制限（ランナー上の Docker リソース競合回避）。
# 🔴 cancel-in-progress: false。ここは担保そのものなので、後続の push で捨ててはならない
# （ci.yml の PR 側とは意図が逆である）。
concurrency:
  group: integration-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  integration:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # FR-14, IADR-0060 / IADR-0065, Issue #245: ユニット（src/*）の submodule のみ非再帰で取得する。
      # 未取得だと追加ユニットが src/*/backend/backend.slnx 自動発見に現れず対象外になる。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # NFR / IADR-0232: NuGet のグローバルパッケージをキャッシュする（ci.yml と同じキー）。
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # 自動起票が本当に動くかを実測するための入口（IADR-0232 残余リスク）。
      # 自動起票は失敗時にしか走らないため、平時は常に skip で緑になる ——
      # 意図的に失敗させない限り「壊れていること」に永久に気付けない。
      - name: Force failure (自動起票の動作確認用)
        if: ${{ inputs.force_failure }}
        run: |
          echo "::error::force_failure=true が指定された。自動起票の経路を確認するための意図的な失敗である。"
          exit 1
      # ユニットは ci.yml と同じく src/*/backend/backend.slnx から自動発見する
      # （ユニット名をここへ書かない。書くと次にユニットが増えたとき静かに対象から外れる）。
      - name: Integration tests (real containers, all units)
        run: |
          set -euo pipefail
          shopt -s nullglob
          found=0
          for slnx in src/*/backend/backend.slnx; do
            found=$((found + 1))
            echo "::group::$slnx"
            dotnet restore "$slnx"
            dotnet build "$slnx" --no-restore --configuration Release
            dotnet test "$slnx" --no-build --configuration Release \
              --filter "Category=Integration" --verbosity normal
            echo "::endgroup::"
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::src/*/backend/backend.slnx が 1 件も無い。glob が空振りしている。"
            exit 1
          fi

  # 🔴 PR から外した分の担保が落ちたことを issue として残す（IADR-0232 決定 1）。
  # これが無ければ「PR から外した」は「やめた」と同義になる。
  report-failure:
    needs: [integration]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/ci-failure-issue.yml
    permissions:
      contents: read
      issues: write
