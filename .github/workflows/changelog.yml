# CHANGELOG / リリースノートの自動生成
#
# - main への push: コミット履歴から CHANGELOG.md を再生成し、変更があればコミットする。
# - タグ push: 直近タグからのコミットでリリースノートを生成し、GitHub Release に反映する。
#
# このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効。
#
# 注意（ブランチ保護との両立）:
#   develop/main にブランチ保護（PR 必須・署名必須コミット・必須ステータスチェック）を
#   かけているため、github-actions[bot] による直接 push は拒否される。そのため
#   peter-evans/create-pull-request で更新用ブランチを切って PR を作成する方式に
#   している（GitHub がマージ時に生成するコミットは検証済み署名を持つため、
#   署名必須の制約にも抵触しない）。

name: Changelog

on:
  push:
    branches: [develop, main]
    tags: ["v*"]

# NFR, IADR-0232 (#1581): ワークフロー単位は読むだけにし、書き込みは changelog ジョブにだけ置く。
permissions:
  contents: read

jobs:
  changelog:
    # PR マージ由来の push による無限ループを避ける（PR ブランチは automation/ 配下）
    if: "!startsWith(github.event.head_commit.message, 'docs(NFR): CHANGELOG を自動更新')"
    runs-on: ubuntu-latest
    # 更新ブランチの push と GitHub Release の作成・更新（contents: write）、更新 PR の作成とラベル付け（pull-requests: write）。
    # AUTOMATION_PR_TOKEN が設定されていれば PR はそちらで作られるが、未設定時は GITHUB_TOKEN が両方を担う。
    # 🔴 develop / main / タグへの push でしか走らないので、PR の CI では確かめられない（従前と同じ権限をジョブへ移しただけ）。
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "20"

      - name: Generate CHANGELOG.md
        run: node scripts/gen-changelog.js --out CHANGELOG.md

      # 【既知の制約・重要】GITHUB_TOKEN で作成した PR では、GitHub の仕様により
      # ワークフローが自動起動しない（再帰実行の防止）。必須チェックを設定していると、
      # この PR は CI・Security・PR Title・AI レビュー等がすべて `action_required`
      # （承認待ち）のまま滞留し、**永久にマージできない**。実運用で 2 週間以上滞留し、
      # AI レビューの実行キューの 28% を無駄に占有した実績がある。
      #
      # 回避策（いずれか）:
      #   a) `token:` に PAT（例 `secrets.AUTOMATION_PR_TOKEN`。Contents: write /
      #      Pull requests: write を持つ fine-grained PAT）を設定する。PAT で作成した
      #      PR にはワークフローが通常どおり起動する。← 必須チェック運用ではこちらを推奨
      #   b) CHANGELOG 更新を PR にせず develop へ直接 push する（ブランチ保護と要調整）。
      #   c) 現状のまま運用し、当該 PR のチェックを手動承認する（毎回の手作業が必要）。
      - name: Create PR with CHANGELOG update
        if: startsWith(github.ref, 'refs/heads/')
        uses: peter-evans/create-pull-request@v8
        with:
          token: ${{ secrets.AUTOMATION_PR_TOKEN || secrets.GITHUB_TOKEN }}
          add-paths: CHANGELOG.md
          commit-message: "docs(NFR): CHANGELOG を自動更新"
          branch: automation/changelog-update-${{ github.ref_name }}
          delete-branch: true
          base: ${{ github.ref_name }}
          title: "docs(NFR): CHANGELOG を自動更新"
          body: |
            コミット履歴から CHANGELOG.md を自動再生成しました。
            ブランチ保護（PR 必須・署名必須コミット）のため直接 push ではなく本 PR で反映します。
          labels: automation

      - name: Build release notes (tag)
        if: startsWith(github.ref, 'refs/tags/')
        run: node scripts/gen-changelog.js --out RELEASE_NOTES.md

      - name: Create / update GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          body_path: RELEASE_NOTES.md
