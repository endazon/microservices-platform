# CI（検証ゲート）雛形 — 技術非依存の骨格
#
# このファイルは「例示」であり、そのままでは有効化されない（拡張子が .example.yml のため）。
# 自プロジェクトのスタックに合わせて各ステップを書き換え、ci.yml にリネームして使うこと。
# build / test / coverage / lint ステップは C#/.NET を例示している。
#
# ── スタック別 --allowedTools（claude-coding / claude-code-review の claude_args を書き換える） ──
# このファイルの build/test ステップを変更したら、claude-coding.example.yml と
# claude-code-review.example.yml の claude_args（スタック別ツール）を使用スタックに合わせて
# 書き換えること。**両方**を同じ内容に保つ（レビュー側から実行系を落とすと、AI レビューは
# 検証できず静的読解へ退行し、毎回「Bash が承認待ちでブロックされた」と報告するだけになる）。
# .claude/settings.json の permissions.allow にも同じコマンドを追記すること（3 系統を揃える）。
# 記法誤りと複製漏れ（レビュー側に一部/全部の実行ツールが無い）は ai-workflow-config ジョブが
# 機械検出する。比較対象はスタック別の実行ツール（dotnet / node・npm / python・pytest / go /
# mvn・gradle）であり、setup-* を書いていないもの（node のようにランナー既定で入るランタイム）も
# 含む。設計上の差（Edit / Write / 書き込み系 git がレビュー側に無いこと）は対象外である。
#
# 注: claude_args の --allowedTools は「二重引用符でくくった 1 引数・カンマ区切り」で書く。
# 1 ツール 1 行に戻すと空白で割れて全指定が無効になる（各ワークフローの記法コメントを参照）。
#
# スタック別の対応コマンド例:
#   C#/.NET : Bash(dotnet build:*), Bash(dotnet test:*), Bash(dotnet format:*), Bash(dotnet restore:*)
#   Node.js : Bash(npm run:*), Bash(npm ci:*), Bash(npx:*)
#   Python  : Bash(pytest:*), Bash(pip install:*), Bash(ruff:*)
#   Go      : Bash(go build:*), Bash(go test:*), Bash(go vet:*)
#   Java    : Bash(mvn:*) または Bash(gradle:*)
# ─────────────────────────────────────────────────────────────────────────────────
#
# 推奨運用（README「全自動化のための推奨ツール・運用」も参照）:
#   - main へのマージ前に lint → build → test → coverage を必須ステータスチェックにする
#   - ブランチ保護で「マージ前に必須チェックの成功」と「レビュー承認」を要求する
#   これにより AI が作成した PR も、人手の検証なしに最低限の品質を機械で担保できる。

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

# NFR / IADR-0232 決定 1: 連続 push で古い実行を捨てる。実測（2026-08-21）では PR ブランチへ
# 5〜10 分間隔の push が続き、キャンセルされない旧 run が約 40 ランナーを占有し続けていた。
#
# 🔴 develop / main への push はキャンセルしない。PR から外した検証（統合テスト・全量 CodeQL・
# vulnerable-scan）の担保がそちらに載るため、途中で捨てると担保そのものが失われる（IADR-0232 決定 1）。
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # コミットメッセージ規約（種別(起点ID): 要約）の機械チェック（Issue #60・再発防止）。
  # PR で追加されるコミット（base..HEAD）のみ検査し、bot・マージ・[skip ci] は除外する。
  # fetch-depth: 0 は base..HEAD の範囲解決に必須。
  commit-messages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check commit messages
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-commit-messages.js

  # スタック非依存: scripts/ 配下の単体テスト（外部依存ゼロ・Node 標準 assert のみ）。
  #
  # 個別の検証器（validate-pipeline-config / check-ai-workflow-config）は下のジョブで
  # --self-test を走らせるが、それらは検証器**単体**の試験である。scripts.test.js は
  # 横断的なテストであり、両者は重複しない。
  # 【重要】このジョブが無いと、scripts.test.js は「誰かが手で叩いたときだけ走るテスト」になる。
  # 実際に、CHANGELOG 生成が全面的に壊れる回帰が、PR の CI をすべて green のまま通り抜けた
  # ことがある（changelog.yml は push でしか起動しないため、壊れるのはマージ後）。
  # fetch-depth: 0 は allowlist の到達可能性検査と gen-changelog の実行に必要
  # （浅いクローンでは当該テストが best-effort で skip されるため、検査が実効しない）。
  scripts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run scripts unit tests
        # 【固有テストを持つリポジトリ向け】scripts/scripts.repo.test.js を置いているため有効化する。
        # companion が消失（誤削除・リネーム・キット同期での上書き）したときに失敗するようになる。
        # 未設定だとテスト件数が静かに減るだけで CI は green のまま（planning#114 の実測: 101 → 53 件）。
        env:
          REQUIRE_REPO_TESTS: "1"
        run: node scripts/scripts.test.js

  # NFR / IADR-0232 決定 6: 依存ゼロの Node 検査を 1 ジョブへ束ねる（統合前は 12 の独立ジョブ）。
  #
  # 束ねた理由は「ジョブが多いと遅いから」ではない。ci.yml は needs: を 1 つも持たず全並列なので
  # 待ち時間はほとんど作っていなかった（実測: 各ジョブ 10〜17 秒）。問題は 2 つある。
  #   - 1 ジョブあたり約 13 秒（checkout 2s ＋ setup-node 5s ＋ 起動 3s）が実処理 1 秒未満の検査に掛かる
  #   - 同時実行スロットを 12 個占有し、本命の backend-build の開始を遅らせる
  #     （実測: run 作成から最大 53 秒後に開始したジョブがあった）
  #
  # 🔴 検査は 1 本も減らしていない。ジョブが減っただけで、走る検査器の本数と対象は統合前と同一である。
  #
  # 🔴 各ステップに `if: ${{ !cancelled() }}` を付けてある。これが無いと最初の失敗で以降が走らず、
  # 1 回の CI で 1 件しか分からなくなって往復が増える（束ねたことで可読性が落ちる形）。
  # 付けてあるので、落ちた検査が複数あれば一度に全部出る。ジョブの合否は従来どおり
  # 「どれか 1 つでも失敗すれば赤」である。
  #
  # 🔴 各検査の直前のコメントは統合前のジョブのものをそのまま移した。ADR 番号・事故の経緯・
  # 「これを外すと検査が空回りする」という設計要点を持つため、1 行も捨てない。
  #
  # submodule は取得しない。取得が要る検査は下の static-checks-units にある。
  static-checks:
    runs-on: ubuntu-latest
    env:
      PIPELINE_CONFIG: "deploy/helm/microservices-platform/files/pipeline.json"
    steps:
      - uses: actions/checkout@v7
        with:
          # check-action-versions の --compare-with-ref が統合ブランチ時点のワークフローを
          # 読むため、履歴が要る（shallow だと当該検査が warn で skip される）。
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # スタック非依存: docs/ と .ai-context/ 配下 Markdown の相対リンク切れを検査（Issue #59 再発防止）。
      # scripts/check-doc-links.js は Node 標準モジュールのみで動作し、依存インストール不要。
      # 本リポジトリは planning に依存しない（ADR-0048 決定 2）。未取得の submodule（src/ai-stock-trading）
      # 配下のリンクは submodule 未取得のため本ジョブでは検査対象外。
      #
      # 計画 ADR-0048 決定 4（trace ブロック）: docs/ の trace / trace-table ブロックの文法・値域は
      # check-trace-blocks.js が、ナレッジグラフのエッジ先実在は gen-knowledge-graph.js --check が
      # 検査する。いずれも fs のみで走査するため（git を呼ばない）checkout に fetch-depth や
      # submodule 取得は要らない。本ジョブに寄せるのは「docs/ 系ジョブ」を 1 本にまとめる既存方針に
      # 合わせるためであり、ワークフロー自体に paths: フィルタは無く（on: が push/pull_request の
      # イベント種別のみを絞る既定構成）scripts/ の変更も含め毎回全ジョブが走るため、
      # 「docs/** ・.ai-context/** ・scripts/ の変更時に走ること」は自動的に満たされている。
      # 検査器自体の自己試験を先に走らせる（planning#167）。拡張子の追加漏れ・検出経路の退行を
      # 「OK: n 件」の陰に隠さないための歯止め（他の check-*.js の --self-test と同じ運用）。
      - name: Self-test doc links checker
        if: ${{ !cancelled() }}
        run: node scripts/check-doc-links.js --self-test
      - name: Check doc links
        if: ${{ !cancelled() }}
        run: node scripts/check-doc-links.js
      - name: Self-test trace blocks checker
        if: ${{ !cancelled() }}
        run: node scripts/check-trace-blocks.js --self-test
      - name: Check trace blocks (ADR-0048 決定 4)
        if: ${{ !cancelled() }}
        run: node scripts/check-trace-blocks.js

      # NFR / #975 / IADR-0254: 新規記録と docs 改稿の同居で、trace ブロックへの追随を見る。
      # 🔴 **warn であってゲートではない。** 違反があっても EXIT=0 で、CI は赤くならない。
      #    偽陽性のとき人ができるのは「無関係な ID を trace ブロックへ足す」ことだけで、
      #    それは守ろうとしているメタデータそのものを汚す。除外の手段を設計するまで赤にしない。
      #    赤くならないので、**このステップが消されても誰も気づかない**。README の表と対で残す。
      - name: Self-test trace follow-through checker
        if: ${{ !cancelled() }}
        run: node scripts/check-trace-followthrough.js --self-test
      - name: Check trace follow-through (#975・warn)
        if: ${{ !cancelled() }}
        run: node scripts/check-trace-followthrough.js
      - name: Self-test knowledge graph generator
        if: ${{ !cancelled() }}
        run: node scripts/gen-knowledge-graph.js --self-test
      - name: Check knowledge graph edge existence
        if: ${{ !cancelled() }}
        run: node scripts/gen-knowledge-graph.js --check

      # NFR / #755 / IADR-0200（裁定 planning#364）: 毎セッション必読の規約の総量予算。
      # 母集合はエージェントごと（Claude Code = CLAUDE.md ＋ .claude/rules/*.md ／ AGENTS.md 系 ／ Copilot）に分けて
      # 測り、合算しない。予算値 51,200 の正本は project-planning の docs/ai-implementation-workflow-guide.md §8（検査器は出典つきの複製を持つ）。
      # 100% 超で fail、90% 以上で warn（warn は失敗にしない）。AGENTS.md 系は実測が無いため観測のみ。
      - name: Self-test reading budget checker
        if: ${{ !cancelled() }}
        run: node scripts/check-reading-budget.js --self-test
      - name: Check reading budget
        if: ${{ !cancelled() }}
        run: node scripts/check-reading-budget.js

      # NFR, Issue #956, IADR-0247: 追跡下ファイルへの生の NUL バイト混入を検査する。
      # 生の NUL が入ると git と grep がファイルをバイナリ扱いする（git diff が中身を出さず、
      # grep が行番号を出さない）ため、混入したまま気付かずマージされ得る（実際に 4 回起きた）。
      # 検査範囲は「追跡下すべて」で拡張子の許可リストにしない（新しいテキスト拡張子が黙って
      # 対象から外れる無音の失敗を避けるため。IADR-0247 決定 1）。git を呼ぶため fetch-depth や
      # submodule 取得は要らない（git ls-files で足りる）。scripts.repo.test.js の companion 経由
      # でも自己試験・実データ走査・変異試験を回すが、専用ステップにすると失敗がジョブ名で見える
      # （check-test-spec-coverage.js と同じ理由）。
      - name: Self-test NUL byte checker
        if: ${{ !cancelled() }}
        run: node scripts/check-nul-bytes.js --self-test
      - name: Check for raw NUL bytes
        if: ${{ !cancelled() }}
        run: node scripts/check-nul-bytes.js

      # FR-14, ADR-0018, IADR-0028: 宣言的パイプライン構成のスキーマ検証（安全弁）。
      # 本リポジトリはこの任意コンポーネントを**採用する**（ADR-0018 で確定）。
      # 検証を通らない構成は適用不可（必須チェック）。--self-test で検証器自体も毎回試験する。
      # 検証器自体の試験。構成ファイルの有無に関わらず毎回走らせ、検証ロジックの退行を防ぐ。
      - name: Validate pipeline config (self-test)
        if: ${{ !cancelled() }}
        run: node scripts/validate-pipeline-config.js --self-test
      - name: Validate pipeline config
        if: ${{ !cancelled() && (env.PIPELINE_CONFIG != '') }}
        run: node scripts/validate-pipeline-config.js "$PIPELINE_CONFIG"

      # Claude 系ワークフローのツール許可設定を検査する（安全弁）。
      # claude_args の記法誤りは CI を失敗させずに「AI が検証できない」状態を作るため、
      # 人間にもジョブ結果にも現れない。ここで機械的に止める。
      - name: Check AI workflow config (self-test)
        if: ${{ !cancelled() }}
        run: node scripts/check-ai-workflow-config.js --self-test
      # 警告（検査そのものが成立していない状態）は GitHub のアノテーションとして出るため、
      # ジョブログを開かなくても PR の Checks 画面で気付ける。
      #
      # 本リポジトリはファイル名・ワークフロー構成が固まっており（claude-coding.yml /
      # claude-code-review.yml の 2 本・現在 warn ゼロ）、厳格モードを有効化する。
      # claude_args のキー名やインデントが崩れて検査が丸ごと無効になる状態を失敗として止める
      # （scripts-tests の REQUIRE_REPO_TESTS と同じ opt-in 方式。planning#136）。
      - name: Check AI workflow config
        if: ${{ !cancelled() }}
        env:
          STRICT_AI_WORKFLOW_CONFIG: "1"
        run: node scripts/check-ai-workflow-config.js

      # Actions のバージョン退行を止める（planning#152）。
      #
      # **巻き戻りが実際に起きるのはここ（キットを同期した実装リポ）である。** 配布元
      # （project-planning）にも同じ検査があるが、それが守るのは「テンプレートが取り残されて
      # いないか」であり、実装リポがキットのファイルをコピーした瞬間の退行は守らない。
      # 実測: キットが upload-artifact@v4 のとき本リポジトリは既に @v7 で、素直にコピーしていれば
      # 3 メジャー分の退行を持ち込んでいた（避けられたのは手作業の走査によるものだった）。
      #
      # 2 つの基準で検査する。
      #   - scripts/action-versions.json の下限（キット既定 ＋ action-versions.repo.json の追記）
      #   - --compare-with-ref: **統合ブランチ時点の同じファイル**より下がっていないか
      # 後者が要るのは、本リポジトリが Dependabot で下限より先へ進んだあとにキットをコピーすると、
      # 本リポジトリにとっては退行なのに表の上では合格してしまうためである（表 v7 / 本リポ v8 /
      # キット v7）。この形は同期前後の比較でしか捉えられない。
      #
      # 本リポジトリの統合ブランチは develop（キット既定の origin/main から置換）。
      # ref を読めない場合（shallow clone 等）は warn を出して素通りする（fail-open）。
      - name: Check action versions
        if: ${{ !cancelled() }}
        run: |
          node scripts/check-action-versions.js \
            --dir .github/workflows \
            --compare-with-ref origin/develop

      # NFR / ADR-0030, Issue #455: バックエンドアプリケーション層のライブラリ標準を機械強制する。
      # 不採用ライブラリ（MediatR / AutoMapper / MassTransit / FluentAssertions / Serilog 等）の
      # PackageReference・using の新規混入を止め、Domain 層の依存規律と共有カーネルの許可リストを検査する。
      # Domain の「外部依存ゼロ」は計画 ADR-0041 が「Kernel 経由で名指しの 1 つ」へ改定した（#500 / IADR-0196）。
      # 既知の残件は scripts/backend-library-baseline.json で ratchet 管理（新規混入と減らし忘れは fail、
      # baseline 内は warn）。ai-stock-trading は別プロジェクトのため検査対象外。
      # submodule は取得しない（対象は platform / knowledge のみで、いずれも本リポジトリの実体）。
      - name: Self-test backend library checker
        if: ${{ !cancelled() }}
        run: node scripts/check-backend-libraries.js --self-test
      - name: Check backend application library standard
        if: ${{ !cancelled() }}
        run: node scripts/check-backend-libraries.js

      # NFR, Issue #467: CPM（Central Package Management）のバージョン直書き禁止を機械強制する。
      # CLAUDE.md の「バージョンは src/Directory.Packages.props に集約し、.csproj の PackageReference には
      # バージョンを書かない」を検査する。着手時点の実測が違反 0 件のため ratchet / baseline を持たず
      # 最初から fail で強制する。VersionOverride は CPM 公式の回避口のため許可し、使用箇所のみ
      # 実行サマリへ警告として出す（終了コードは変えない）。templates/ も走査する（雛形の直書きは
      # 全新規サービスへ伝播する。上の build-and-test は src/*/backend/backend.slnx を glob するため
      # 雛形に当たらない）。**［2026-08-18 追記 / #830］「他で捕まらない」ではなくなった** ——
      # 下の template-backend-build が雛形を複製してビルドするため、直書きは NU1008 でも落ちる（実測）。
      # それでも本検査は残す: 落ちるのは復元段であり、どのファイルのどの行が違反かを名指しするのは
      # 本検査だけである。
      # backend-libraries（#455）とは関心が異なるため別スクリプト（どのライブラリか / 版をどこに書くか）。
      # submodule は取得しない（対象は platform / knowledge / templates で、いずれも本リポジトリの実体）。
      - name: Self-test CPM version checker
        if: ${{ !cancelled() }}
        run: node scripts/check-cpm-versions.js --self-test
      - name: Check CPM version pinning
        if: ${{ !cancelled() }}
        run: node scripts/check-cpm-versions.js

      # NFR, Issue #465: サービス間契約（Shared.Contracts のイベント/API スキーマ）の後方互換を検査する。
      # 全面再実装（#454）で 11 サービスを作り直す間、契約は両側同時更新で気付かれずに壊れ得る
      # （発行側と購読側を同じ PR で直せばコンパイルもテストも通る）。C# ソースを構文解析して
      # 正規化スナップショット（scripts/contract-schema-baseline.json）と突き合わせ、後方互換を壊す
      # 変更を止める。抽出方式にリフレクション（.NET SDK 依存）・OpenAPI（イベント 0 件）・
      # proto（.proto 0 件）を採らない理由は IADR-0122。破壊的変更は
      # scripts/contract-breaking-allowlist.json の承認エントリで通す（手順は scripts/README.md）。
      # submodule は取得しない（対象は platform / knowledge の Shared.Contracts で本リポジトリの実体）。
      - name: Self-test contract schema checker
        if: ${{ !cancelled() }}
        run: node scripts/check-contract-schema.js --self-test
      - name: Check contract backward compatibility
        if: ${{ !cancelled() }}
        run: node scripts/check-contract-schema.js

      # NFR, Issue #453: 受け入れ基準 → テストの写像を機械検査する（退行防止テスト基盤）。
      # docs/tests/ に仕様書がある FR/SC が src/ のテストから参照されているかを見る。
      # 着手時点の実測が 27/27 写像済みだったため warn 開始ではなく fail で強制する。
      # 「仕様書が先・テストは次の PR」という段取りは scripts/test-traceability-allowlist.json で明示する
      # （ratchet: allowlist に無い未写像と、写像済みなのに allowlist に残る行の双方を fail にする）。
      - name: Self-test traceability checker
        if: ${{ !cancelled() }}
        run: node scripts/check-test-traceability.js --self-test
      - name: Check acceptance-criteria to test mapping
        if: ${{ !cancelled() }}
        run: node scripts/check-test-traceability.js
      # Issue #510, IADR-0130: 「実在するテストがテスト仕様書に載っているか」を ratchet で検査する。
      # #503 の「全面改訂」が SC-05〜07 のバックエンド試験の節を落とし、テスト自体は残っているのに
      # 記載だけが消えた——レビューでも CI でも捕まらなかった。check-test-traceability.js とは
      # 突合の単位が違う（あちらは起点 ID の集合、こちらはテストの実体）ため別の検査器にしている。
      # scripts.repo.test.js からも呼ばれるが、専用ステップにすると失敗がジョブ名で見える。
      - name: Self-test test-spec coverage checker
        if: ${{ !cancelled() }}
        run: node scripts/check-test-spec-coverage.js --self-test
      - name: Check tests are covered by test specs
        if: ${{ !cancelled() }}
        run: node scripts/check-test-spec-coverage.js

      # Issue #18 再発防止: Keycloak realm export の文字列フィールド長が import 先 RDB の
      # varchar(255) を超えていないかを機械検査する（#307 で description が 364 文字となり import が
      # SQLSTATE 22001 で失敗し pod がクラッシュした）。外部依存ゼロ。--self-test で検査器も毎回試験する。
      - name: Self-test realm constraint checker
        if: ${{ !cancelled() }}
        run: node scripts/check-realm-constraints.js --self-test
      - name: Check realm field lengths
        if: ${{ !cancelled() }}
        run: node scripts/check-realm-constraints.js

      # NFR, ADR-0027 / ADR-0030, Issue #455（子 C・Wolverine 移行 手順 1。手順 6 は check-backend-libraries の規則 4）:
      # イベント型 → 発行元 / 購読先の対応表を baseline と突き合わせる。
      #
      # **移行より先に要る検査である。** 計画は Wolverine 移行の 8 手順のうち
      # 「2 つの退行はビルド・ユニットテスト・トポロジ検査をすべて通過したまま、例外もログも出さずに
      # 業務イベントを失う」と警告している。**赤で分からない種類の退行**なので、移行前に正解表を
      # 凍結しておかないと、移行後に「これで合っているのか」を判定する基準が無い。
      #
      # 最重要の固定対象は **DocumentUpdated の購読が 2 件である**こと（IngestionService + WikiService）。
      # 手順 3（キュー名にサービス名を前置する）を誤ると 2 つの購読者が同一キューを競合し、
      # 片方だけがメッセージを受け取る。本検査はその減少を exit 1 で止める。
      - name: Self-test event topology checker
        if: ${{ !cancelled() }}
        run: node scripts/check-event-topology.js --self-test
      - name: Check event topology against baseline
        if: ${{ !cancelled() }}
        run: node scripts/check-event-topology.js

      # NFR（運用性/信頼性）, IADR-0087, Issue #334: scripts/k8s-local-up.sh の opt-in ゲート
      # （PERSIST / OBSERVABILITY / VAULT / ARGOCD / HEADLAMP / LOCALEDGE / ESO）を横断で固定する
      # smoke test。IADR-0105（#399）以降は「どの env でも apiserver 引数・ドロップインを書かない」ことも
      # 回帰として固定する（旧ゲート HEADLAMP_OIDC_APISERVER は除去済み・指定しても no-op）。
      # 外部バイナリ（k3d/kubectl/helm/docker）を PATH 上の記録スタブへ差し替え、副作用ゼロで
      # スクリプトを実行し発行コマンド列へアサートする（実クラスタは作らない）。外部依存ゼロ（Node + bash のみ）。
      # submodule は取得しない（AST 分岐が決定的に skip され、テストの前提と一致する。IADR-0087 参照）。
      - name: Smoke-test k8s-local-up opt-in gates (stub-on-PATH, no cluster)
        if: ${{ !cancelled() }}
        run: node scripts/k8s-local-up.test.js

      # FR-01/FR-02 ほか, IADR-0089, Issue #342 再発防止: BFF が集約する各 downstream の「実効の上流 URL」
      # （Program.cs のコード既定 ?? デプロイ manifest の Services__<Name> 上書き）が、メッシュ規約のポート
      # （:8080）に解決されることを機械検査する。DataSourceService の :8080 上書き漏れがコード既定 5002 のまま
      # live へ出て 21 秒タイムアウト→502 を起こした（#342）。同種の上書き漏れ・ポート違いを止める。
      # in-repo ファイル（Program.cs / values.yaml / docker-compose.yml）のみ参照＝submodule 取得不要。
      # 外部依存ゼロ（Node のみ）。--self-test で検査器自体も毎回試験する。
      - name: Self-test BFF downstream port checker
        if: ${{ !cancelled() }}
        run: node scripts/check-bff-downstreams.js --self-test
      - name: Check BFF downstream upstream ports
        if: ${{ !cancelled() }}
        run: node scripts/check-bff-downstreams.js

  # NFR / IADR-0232 決定 6: submodule（src/*）の取得が要る検査を 1 ジョブへ束ねる。
  # static-checks と分けてあるのは、submodule 取得と helm / kubectl の導入がここだけに要るためで、
  # 全部を 1 ジョブにすると取得の要らない検査までその時間を待つことになる。
  # 検査の本数と対象は統合前と同一（各ステップの `if: ${{ !cancelled() }}` の意図は static-checks と同じ）。
  static-checks-units:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # FR-14, IADR-0060 / IADR-0065, Issue #245: ユニット（src/*）の submodule のみ非再帰で取得する。
      # 既定 checkout は submodule 未取得で、追加ユニット（AST 等）の csproj 依存方向が
      # 検査対象外＝pin 更新時に platform 直参照の混入を見落とすため（未取得だと空の gitlink となる）。
      # public ユニットはトークン不要（private ユニットは別途 IADR-0058 型トークンが要る）。
      # 詳細は docs/how-to/adding-a-unit-submodule.md。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - uses: azure/setup-helm@v4
      - uses: azure/setup-kubectl@v4
      # NFR, IADR-0240, Issue #783（#442 子 5）: kubeconform を導入する（chart / overlay の
      # スキーマ突合に要る）。latest には追従しない —— 版を pin し、公式リリースの CHECKSUMS と
      # 突合してから導入する（本リポジトリは latest 追従を問題として扱っている。
      # k8s-local-up.test.js の ESO helm install --version 検査と同じ方針）。
      - name: Install kubeconform (pinned, checksum-verified)
        run: |
          set -euo pipefail
          KUBECONFORM_VERSION=v0.8.0
          KUBECONFORM_SHA256=9bc2bffbf71f261128533edaf912153948b7ff238f9a531ae6d34466ec287883
          curl -fsSL -o kubeconform.tar.gz \
            "https://github.com/yannh/kubeconform/releases/download/${KUBECONFORM_VERSION}/kubeconform-linux-amd64.tar.gz"
          echo "${KUBECONFORM_SHA256}  kubeconform.tar.gz" | sha256sum -c -
          tar -xzf kubeconform.tar.gz kubeconform
          sudo install -m 0755 kubeconform /usr/local/bin/kubeconform
          rm -f kubeconform.tar.gz kubeconform
          kubeconform -v

      # FR-14, IADR-0027 / IADR-0056 / IADR-0057, Issue #231: ユニット依存方向の機械検査。
      # csproj の ProjectReference（ユニット外参照）と Foundation→Composable の using を静的走査する。
      # 外部依存ゼロの Node スクリプト。--self-test で検査器自体も毎回試験する。
      - name: Self-test unit dependency checker
        if: ${{ !cancelled() }}
        run: node scripts/check-unit-dependencies.js --self-test
      - name: Check unit dependency direction
        if: ${{ !cancelled() }}
        run: node scripts/check-unit-dependencies.js

      # NFR, ADR-0007 / ADR-0021, Issue #783（#442 子 5）: deploy/ の chart と overlay が
      # レンダリングできること、および Kubernetes のスキーマに適合すること（IADR-0240）を検査する。
      # CI に helm / kustomize / kubeconform の検証が 1 つも無く、chart や overlay が壊れても
      # マージまで気づけなかった。
      #
      # **overlay 名をここへ書かないこと。** 検査器が deploy/ を走査して発見する。書くと次に
      # overlay が増えたとき静かに検査対象から外れる（`paths:` の片側取りこぼしを 4 回踏んでいる。
      # #558 / #562 / #747 / #801）。実測でも、事前調査が 6 件と数えた overlay は実際には 8 件だった。
      #
      # **DEPLOY_MANIFESTS_ALLOW_MISSING_TOOLS をここで立てないこと。** 立てると helm / kubectl /
      # kubeconform の導入が失敗しても検査が notice を出して素通りする。scripts/scripts.repo.test.js
      # が突合する。
      - name: Self-test deploy manifest checker
        if: ${{ !cancelled() }}
        run: node scripts/check-deploy-manifests.js --self-test
      - name: Check charts and overlays render
        if: ${{ !cancelled() }}
        run: node scripts/check-deploy-manifests.js

      # FR-14, IADR-0107, Issue #407 再発防止: 可変ユニット（AST）が所有するサービスを MSP 側の values でも
      # 有効化する「重複デプロイ」を機械検査する。経路B で risk-management / market-monitor が 2 namespace に
      # 並び、ExternalName 経由で同一の platform-infra RabbitMQ を共有した結果、同名キュー TradeDecisionMade を
      # consumers=4 で奪い合い、取引判断（OrderApproved/OrderRejected）を無言で取りこぼした。
      # AST 所有サービス一覧は submodule の chart values から読み、未取得なら既知の一覧へ縮退する（fail-safe）。
      # ここでは submodule を取得して実 chart で突合する（pin 更新で AST にサービスが増えても追随できる）。
      # 外部依存ゼロ（Node のみ）。--self-test で検査器自体も毎回試験する。
      - name: Self-test unit service ownership checker
        if: ${{ !cancelled() }}
        run: node scripts/check-unit-service-ownership.js --self-test
      - name: Check unit service ownership (no duplicate deployment)
        if: ${{ !cancelled() }}
        run: node scripts/check-unit-service-ownership.js


  # ───────────────────────────────────────────────────────────────────────────────
  # NFR / IADR-0232 決定 2: バックエンドのビルド・テスト・整形。
  #
  # 🔴 **matrix のジョブと、必須チェック名を持つ集約ジョブを分けてある。** ブランチ保護の
  # 必須 check 名はジョブ ID そのものであり、matrix 化すると `build-and-test (platform)` へ
  # 改名されて **PR が恒久的にマージ不能**になる。そこで matrix は別 ID（backend-build /
  # backend-format）へ切り出し、build-and-test / lint は needs: ＋ if: always() で結果を
  # 判定するだけの集約ジョブとして名前を維持する。
  #
  # この形は本リポジトリの images.yml が先に実装している（changes → build（16 並列 matrix）→
  # image-build（集約）。IADR-0067）。**新しい発明ではなく既存パターンの横展開**であり、
  # ブランチ保護の手動更新は発生しない。必須 check 名の正本は docs/ai-workflow.md の表。
  # ───────────────────────────────────────────────────────────────────────────────

  # FR-14, IADR-0056 / IADR-0060, Issue #230: 全バックエンドユニットを restore → build → test する。
  # 統合前は 1 ジョブで `for slnx in src/*/backend/backend.slnx` の **直列ループ**だったため、
  # ユニットが増えるほど線形に伸びていた（実測 462 秒）。ユニットを matrix の軸にして並列化する。
  #
  # FR-14, IADR-0056 / IADR-0060, Issue #230: ルート集約ソリューションは置かず、全バックエンドユニット
  # （src/*/backend/backend.slnx）を自動発見して restore → build → test する。ユニット追加時に CI の
  # 編集は不要。この性質は分割後も維持する —— matrix の値は下の discover-units ジョブが同じ glob で
  # 導出するため、ここへユニット名を書かない。
  # （**ユニット名をここへ書かないこと。** 書くと次にユニットが増えたとき静かに検査対象から
  # 外れる。deploy-manifests の overlay 名と同じ型の事故である。）
  discover-units:
    runs-on: ubuntu-latest
    outputs:
      units: ${{ steps.discover.outputs.units }}
    steps:
      - uses: actions/checkout@v7
      - name: Discover backend units from src/*/backend/backend.slnx
        id: discover
        run: |
          set -euo pipefail
          shopt -s nullglob
          units=()
          for slnx in src/*/backend/backend.slnx; do
            units+=("$(basename "$(dirname "$(dirname "$slnx")")")")
          done
          if [ ${#units[@]} -eq 0 ]; then
            echo "::error::src/*/backend/backend.slnx が 1 件も無い。glob が空振りしている。"
            exit 1
          fi
          json="$(printf '%s\n' "${units[@]}" | sort | jq -R . | jq -sc .)"
          echo "units=${json}" >> "$GITHUB_OUTPUT"
          echo "discovered: ${json}"

  backend-build:
    runs-on: ubuntu-latest
    # 実インフラの Testcontainer 起動を含むため、既定 6 時間ではなく明示的に上限を置く。
    timeout-minutes: 30
    needs: discover-units
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.discover-units.outputs.units) }}
    steps:
      - uses: actions/checkout@v7
      # FR-14, IADR-0060 / IADR-0065, Issue #245: ユニット（src/*）の submodule のみ非再帰で取得する。
      # 既定 checkout は submodule 未取得で、追加ユニットは src/*/backend/backend.slnx 自動発見に現れず
      # restore/build/test の対象外になる。public ユニットはトークン不要（private ユニットは別途
      # IADR-0058 型トークンが要る）。詳細は docs/how-to/adding-a-unit-submodule.md。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # 🔴 キャッシュは**ブランチ単位でスコープされる**（実測 2026-08-21）。
      # ブランチは**自分の base ブランチのキャッシュを読める**ので、develop が温まっていれば
      # **新規 PR ブランチは初回からヒットする**。逆に **develop へマージ直後の初回 run は miss** する
      # （PR ブランチが書いたキャッシュは develop から見えない）。**miss を見たら壊れたと決めつけず、
      # どのブランチのスコープを見ているかを先に確かめること。**
      #
      # NFR / IADR-0232: NuGet のグローバルパッケージをキャッシュする。着手前の実測では
      # setup-dotnet が本リポジトリで 8 箇所使われて 1 つも cache: を設定しておらず、毎 run
      # 全パッケージを取り直していた。packages.lock.json を持たないため setup-dotnet の
      # cache: true は使えない（ロックファイルのハッシュをキーにする実装のため）。
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # --- スタック別に書き換え（例: C#/.NET） ---
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # 🔴 Testcontainers（実 RabbitMQ / Postgres / MinIO）を起動するテストは PR から外す
      # （IADR-0232 決定 3・改定 3。利用者裁定 2026-08-22「PR の精度低下は、どこかで回収できるなら
      # ある程度許容する。AI コーディング→PR→CI→AI コーディングのループ効率を上げよ」）。
      #
      # 着手前の実測で、このジョブの knowledge 脚 2 分 44 秒の大半がコンテナ起動だった。
      # ループ 1 周の待ち時間に最も効くのがここである。
      #
      # 🔴 **回収先は integration.yml**（push: develop ＋ 日次 ＋ 手動）。**全量（--filter 無し）で
      # 走らせ、カバレッジ床もそちらで強制する。** 落ちたら ci-failure-issue.yml が自動起票する。
      # 回収先が無ければ「PR から外した」は「やめた」と同義になる。
      #
      # 🔴 除外されるのは Category=Integration だけである。同じ Knowledge.IntegrationTests に居る
      # Category=Deployment（helm manifest 検証）と Category=EndpointRouting（インプロセス）は
      # Docker を使わず速いため、ここで走る。
      #
      # 🔴 Trait の付け忘れは fail-safe に倒れる —— 付け忘れたテストは除外されず**ここに残る**
      # （PR が少し遅くなるだけで、検証は 1 件も失われない）。回収先が --filter を使わないのは
      # このためでもある（あちらでフィルタすると、付け忘れがどこでも走らない形に倒れる）。
      - name: Restore, build and test (${{ matrix.unit }}, unit tests only, with coverage)
        run: |
          set -euo pipefail
          slnx="src/${{ matrix.unit }}/backend/backend.slnx"
          dotnet restore "$slnx"
          dotnet build "$slnx" --no-restore --configuration Release
          dotnet test "$slnx" --no-build --configuration Release \
            --filter "Category!=Integration" \
            --collect:"XPlat Code Coverage" --verbosity normal
      # カバレッジ床は全ユニット横断で 1 回だけ集計する（IADR-0123 決定 3〜5 の前提）。
      # matrix の各脚では集計せず、Cobertura を artifact で集約ジョブへ渡す。
      - name: Upload coverage reports
        uses: actions/upload-artifact@v7
        with:
          name: coverage-${{ matrix.unit }}
          path: "**/coverage.cobertura.xml"
          retention-days: 1
          if-no-files-found: error

  # 🔴 必須チェック名を維持する集約ジョブ（上のブロックコメント参照）。ここを改名・削除しないこと。
  # NFR, Issue #453: カバレッジ床の強制。上のステップが出力する Cobertura を直接集計するため
  # reportgenerator のインストールを要さない（CI が速く、オフラインでも動く）。
  # 床は src/coverage-floor.json。未設定（null）の間は集計と報告のみ行う。
  # フロント側の同等ゲートは frontend-tests.yml（vitest thresholds・IADR-0034）。
  build-and-test:
    runs-on: ubuntu-latest
    needs: [discover-units, backend-build]
    if: always()
    steps:
      - name: Report build/test result
        env:
          DISCOVER_RESULT: ${{ needs.discover-units.result }}
          BUILD_RESULT: ${{ needs.backend-build.result }}
        run: |
          echo "discover-units=$DISCOVER_RESULT / backend-build=$BUILD_RESULT"
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "::error::ビルド対象ユニットの導出に失敗した。"
            exit 1
          fi
          if [ "$BUILD_RESULT" != "success" ]; then
            echo "::error::いずれかのユニットで restore / build / test が失敗した（backend-build の各脚を見ること）。"
            exit 1
          fi
          echo "✓ 全ユニットの restore / build / 単体テストが成立した（統合テストは integration.yml が回す）。"
      - uses: actions/checkout@v7
      - name: Download coverage reports from all units
        uses: actions/download-artifact@v8
        with:
          pattern: coverage-*
          merge-multiple: true
          path: .
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test coverage floor checker
        run: node scripts/check-coverage-floor.js --self-test
      # 🔴 PR では床を強制しない（--report-only。IADR-0232 改定 3）。
      #
      # 床 line 88 / branch 68 は**統合テストを含む全量の実測**から置かれている
      # （src/coverage-floor.json の根拠欄）。統合テストを PR から外した以上、この床を PR へ
      # 当てると**必ず割れる**。かといって PR 用に低い床を別に置くと、床が 2 つ並んで
      # **どちらが本物か分からなくなる**。
      #
      # したがって PR は**数値を報告するだけ**にし、**門は回収先（integration.yml）に 1 つだけ置く**。
      # 集計値はログに出るので、退行の傾向は PR でも読める。
      #
      # 🔴 --report-only を外すな。外すと PR が床割れで恒久的に赤くなる。
      - name: Report backend coverage (床の強制は integration.yml が行う)
        run: node scripts/check-coverage-floor.js --report-only

  # FR-14, IADR-0056 / IADR-0060, Issue #230: 全バックエンドユニット（src/*/backend/backend.slnx）を
  # 自動発見して検査する。ユニット追加時に CI の編集は不要（discover-units が導出する）。
  # 統合前は 1 ジョブの直列ループで 2 分 42 秒掛かっていた（実測）。ユニットを matrix の軸にする。
  backend-format:
    runs-on: ubuntu-latest
    needs: discover-units
    strategy:
      fail-fast: false
      matrix:
        unit: ${{ fromJSON(needs.discover-units.outputs.units) }}
    steps:
      - uses: actions/checkout@v7
      # FR-14, IADR-0060 / IADR-0065, Issue #245: ユニット（src/*）の submodule のみ非再帰で取得する。
      # 既定 checkout は submodule 未取得で、追加ユニットは src/*/backend/backend.slnx 自動発見に現れず
      # 検査対象外になる。public ユニットはトークン不要（private ユニットは別途 IADR-0058 型トークンが
      # 要る）。詳細は docs/how-to/adding-a-unit-submodule.md。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # dotnet format は内部で MSBuild ワークスペースをロードするため、NuGet キャッシュが効く。
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      # --- スタック別に書き換え（例: C#/.NET） ---
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Format check (${{ matrix.unit }})
        run: dotnet format "src/${{ matrix.unit }}/backend/backend.slnx" --verify-no-changes

  # 🔴 必須チェック名を維持する集約ジョブ。ここを改名・削除しないこと。
  lint:
    runs-on: ubuntu-latest
    needs: [discover-units, backend-format]
    if: always()
    steps:
      - name: Report format result
        env:
          DISCOVER_RESULT: ${{ needs.discover-units.result }}
          FORMAT_RESULT: ${{ needs.backend-format.result }}
        run: |
          echo "discover-units=$DISCOVER_RESULT / backend-format=$FORMAT_RESULT"
          if [ "$DISCOVER_RESULT" != "success" ]; then
            echo "::error::検査対象ユニットの導出に失敗した。"
            exit 1
          fi
          if [ "$FORMAT_RESULT" != "success" ]; then
            echo "::error::いずれかのユニットで dotnet format --verify-no-changes が失敗した（backend-format の各脚を見ること）。"
            exit 1
          fi
          echo "✓ 全ユニットの整形検査が成立した。"

  # 参考: 他スタックの例
  # Node.js:
  #   - uses: actions/setup-node@v7
  #     with: { node-version: "20" }
  #   - run: npm ci
  #   - run: npm run lint --if-present
  #   - run: npm run build --if-present
  #   - run: npm test -- --coverage
  # Python:
  #   - uses: actions/setup-python@v7
  #     with: { python-version: "3.12" }
  #   - run: pip install -e .[test]
  #   - run: ruff check .
  #   - run: pytest --cov

  # NFR, Issue #830: 雛形（templates/*/backend）を CI で実際にコンパイルし、テストを走らせる。
  #
  # 経緯: 雛形のテストプロジェクトに GlobalUsings.cs が無く（ImplicitUsings は Xunit を含まない）、
  # **配布中の雛形が一度もコンパイルできない状態のまま出荷されていた**（#830。[Fact] / IClassFixture<>
  # が CS0246 で落ちる）。誰も気付けなかったのは、雛形 backend をコンパイルするジョブが 1 つも
  # 無かったためである: 上の lint / build-and-test は src/*/backend/backend.slnx を glob するため
  # templates/ に当たらず、codeql.yml のビルド手順も同じ glob、security.yml と
  # copilot-setup-steps.yml は -not -path './templates/*' で明示除外している。
  # **雛形を触る PR は ci.yml が起動するのに、コンパイルする経路が無かった。**
  #
  # #801（雛形 frontend）と違い「paths: へ 1 行足す」では直らない。雛形はテンプレート位置のままでは
  # ビルドできない（IADR-0060 決定 3 / 決定 4・IADR-0064。実測は
  # .ai-context/specs/20260818_issue-830_template-backend-ci-build.md）:
  #   - SampleService.Api.csproj の platform Shared への相対参照（..\ × 6）は **配置後**の
  #     src/<unit>/backend/... を前提とする。templates/ 位置では templates/platform/... を探して
  #     見つからず、restore が MSB4181 で失敗する。
  #   - 共通 props は .sample 付きで配布される（配置時は src/Directory.Build.props / .Packages.props
  #     を継承させ、ユニット側に常設の props を置かないため。IADR-0060 決定 4）。
  # したがって **配置後の位置（src/<一時ユニット>/backend/）へ複製してからビルドする**。
  #
  # 設計の要点（いずれも外すと検査が空回りする）:
  #   - .sample は複製先へ置かない。置くと src/ の単一情報源より近い階層で発見され上書きしてしまう。
  #   - --artifacts-path で obj/bin を作業ツリーの外へ逃がす。これが無いと ProjectReference 先の
  #     src/platform/backend/Shared/*/{bin,obj} まで作業ツリーへ生えて src/ が汚れる（#830 受け入れ基準）。
  #   - trap で複製を必ず片付け、後段ステップ（if: always()）が git status で残骸ゼロを実測する。
  #   - dotnet test は --verbosity normal で **実行されたテスト名**をログへ出し、実行件数が
  #     [Fact]/[Theory] の数を下回ったら fail する（「1 件だけ動いて 1 件が拾われない」を捕まえる。
  #     [Theory] は InlineData で件数が増えうるため下限で判定する）。
  #
  # templates/ 自体は依然としてどの slnx にも登録しない（IADR-0060 決定 3 は不変）。ビルドするのは
  # 一時的な複製であって templates/ ではない。
  #
  # dotnet format はここで走らせない。--artifacts-path を解さず（--no-restore を付けても）
  # src/platform/backend/Shared/*/obj を作業ツリーへ書き出し、上の「src/ を汚さない」を破るためである
  # （実測は上記仕様書。lint 側の同型の穴は別 issue へ回す）。
  #
  # submodule は取得しない（複製先が参照するのは src/platform/backend/Shared/ で本リポジトリの実体）。
  # 本ジョブは新設のジョブ ID であり、既存の必須チェック名（build-and-test / lint / commit-messages）
  # は 1 つも変えていない（docs/ai-workflow.md の表）。
  template-backend-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # NFR / IADR-0232: NuGet のグローバルパッケージをキャッシュする（backend-build と同じキー）。
      - uses: actions/cache@v6
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('src/Directory.Packages.props', '**/*.csproj') }}
          restore-keys: nuget-${{ runner.os }}-
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Stage, build and test unit templates (as placed under src/)
        run: |
          set -euo pipefail
          artifacts="$(mktemp -d)"
          stages=""
          cleanup() {
            for s in ${stages}; do
              if [ -d "$s" ]; then rm -r "$s"; fi
            done
            if [ -d "$artifacts" ]; then rm -r "$artifacts"; fi
            return 0
          }
          trap cleanup EXIT
          shopt -s nullglob
          found=0
          for slnx in templates/*/backend/backend.slnx; do
            found=$((found + 1))
            name="$(basename "$(dirname "$(dirname "$slnx")")")"
            stage="src/.template-buildcheck-${name}"
            stages="${stages} ${stage}"

            echo "::group::stage ${slnx} -> ${stage}/backend"
            if [ -e "$stage" ]; then
              echo "::error::${stage} が既に在る。前回の後片付けが効いていない。"
              exit 1
            fi
            mkdir -p "$stage"
            cp -R "$(dirname "$slnx")" "${stage}/backend"
            # 作業ツリーに残っていたビルド生成物を複製へ持ち込まない。
            find "$stage" -type d \( -name bin -o -name obj \) -prune -exec rm -r {} +
            # .sample は「単独リポジトリでビルドするときだけ」置くもの（IADR-0060 決定 4）。
            # 配置後を模す本ジョブでは置かない —— 置くと src/ の単一情報源を上書きする。
            find "$stage" -name '*.sample' -type f -delete
            echo "::endgroup::"

            echo "::group::dotnet build ${stage}/backend/backend.slnx"
            dotnet build "${stage}/backend/backend.slnx" --configuration Release \
              --artifacts-path "$artifacts"
            echo "::endgroup::"

            echo "::group::dotnet test ${stage}/backend/backend.slnx"
            log="${artifacts}/test-${name}.log"
            dotnet test "${stage}/backend/backend.slnx" --no-build --configuration Release \
              --artifacts-path "$artifacts" --verbosity normal | tee "$log"
            echo "::endgroup::"

            # 実行件数の下限を [Fact]/[Theory] の数で押さえる。「Test Run Successful」だけを見ると
            # 0 件実行や 1 件取りこぼしを緑と読む。属性は行頭（インデントのみ）に限って数え、
            # 注釈中の [Fact] という文字列を拾わない。
            expected=$(grep -rhE '^[[:space:]]*\[(Fact|Theory)' "$stage" --include='*.cs' | wc -l)
            executed=$(grep -cE '^[[:space:]]+Passed[[:space:]]+[A-Za-z]' "$log" || true)
            echo "template=${name} expected_test_attributes=${expected} executed_passed=${executed}"
            if [ "$expected" -eq 0 ]; then
              echo "::error::${slnx} に [Fact]/[Theory] が 1 件も無い。雛形のテストが消えている。"
              exit 1
            fi
            if [ "$executed" -lt "$expected" ]; then
              echo "::error::${slnx} の実行件数 ${executed} が [Fact]/[Theory] の ${expected} を下回った。"
              exit 1
            fi
          done
          if [ "$found" -eq 0 ]; then
            echo "::error::templates/*/backend/backend.slnx が 1 件も無い。glob が空振りしている。"
            exit 1
          fi
          echo "OK: ${found} 件の雛形をビルド・テストした。"
      # 後片付けの取りこぼしを実測する（#830 受け入れ基準）。ビルドが落ちても走らせる。
      - name: Verify the staged copies left nothing behind under src/
        if: always()
        run: |
          set -euo pipefail
          leftovers="$(git status --short --ignored -- src/)"
          if [ -n "$leftovers" ]; then
            echo "::error::複製ビルドの後片付けが効いていない:"
            echo "$leftovers"
            exit 1
          fi
          echo "OK: src/ に残骸なし（git status --short --ignored -- src/ が空）。"
