# CI（検証ゲート）雛形 — 技術非依存の骨格
#
# このファイルは「例示」であり、そのままでは有効化されない（拡張子が .example.yml のため）。
# 自プロジェクトのスタックに合わせて各ステップを書き換え、ci.yml にリネームして使うこと。
# build / test / coverage / lint ステップは C#/.NET を例示している。
#
# ── スタック別 --allowedTools（claude-coding / claude-code-review の claude_args を書き換える） ──
# このファイルの build/test ステップを変更したら、claude-coding.example.yml と
# claude-code-review.example.yml の claude_args（スタック別ツール）を使用スタックに合わせて
# 書き換えること。**両方**を同じ内容に保つ（レビュー側から実行系を落とすと、AI レビューは
# 検証できず静的読解へ退行し、毎回「Bash が承認待ちでブロックされた」と報告するだけになる）。
# .claude/settings.json の permissions.allow にも同じコマンドを追記すること（3 系統を揃える）。
# 記法誤りと複製漏れ（レビュー側に一部/全部の実行ツールが無い）は ai-workflow-config ジョブが
# 機械検出する。比較対象はスタック別の実行ツール（dotnet / node・npm / python・pytest / go /
# mvn・gradle）であり、setup-* を書いていないもの（node のようにランナー既定で入るランタイム）も
# 含む。設計上の差（Edit / Write / 書き込み系 git がレビュー側に無いこと）は対象外である。
#
# 注: claude_args の --allowedTools は「二重引用符でくくった 1 引数・カンマ区切り」で書く。
# 1 ツール 1 行に戻すと空白で割れて全指定が無効になる（各ワークフローの記法コメントを参照）。
#
# スタック別の対応コマンド例:
#   C#/.NET : Bash(dotnet build:*), Bash(dotnet test:*), Bash(dotnet format:*), Bash(dotnet restore:*)
#   Node.js : Bash(npm run:*), Bash(npm ci:*), Bash(npx:*)
#   Python  : Bash(pytest:*), Bash(pip install:*), Bash(ruff:*)
#   Go      : Bash(go build:*), Bash(go test:*), Bash(go vet:*)
#   Java    : Bash(mvn:*) または Bash(gradle:*)
# ─────────────────────────────────────────────────────────────────────────────────
#
# 推奨運用（README「全自動化のための推奨ツール・運用」も参照）:
#   - main へのマージ前に lint → build → test → coverage を必須ステータスチェックにする
#   - ブランチ保護で「マージ前に必須チェックの成功」と「レビュー承認」を要求する
#   これにより AI が作成した PR も、人手の検証なしに最低限の品質を機械で担保できる。

name: CI

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  # コミットメッセージ規約（種別(起点ID): 要約）の機械チェック（Issue #60・再発防止）。
  # PR で追加されるコミット（base..HEAD）のみ検査し、bot・マージ・[skip ci] は除外する。
  # fetch-depth: 0 は base..HEAD の範囲解決に必須。
  commit-messages:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check commit messages
        env:
          GITHUB_BASE_REF: ${{ github.base_ref }}
        run: node scripts/check-commit-messages.js

  # スタック非依存: scripts/ 配下の単体テスト（外部依存ゼロ・Node 標準 assert のみ）。
  #
  # 個別の検証器（validate-pipeline-config / check-ai-workflow-config）は下のジョブで
  # --self-test を走らせるが、それらは検証器**単体**の試験である。scripts.test.js は
  # 横断的なテストであり、両者は重複しない。
  # 【重要】このジョブが無いと、scripts.test.js は「誰かが手で叩いたときだけ走るテスト」になる。
  # 実際に、CHANGELOG 生成が全面的に壊れる回帰が、PR の CI をすべて green のまま通り抜けた
  # ことがある（changelog.yml は push でしか起動しないため、壊れるのはマージ後）。
  # fetch-depth: 0 は allowlist の到達可能性検査と gen-changelog の実行に必要
  # （浅いクローンでは当該テストが best-effort で skip されるため、検査が実効しない）。
  scripts-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Run scripts unit tests
        # 【固有テストを持つリポジトリ向け】scripts/scripts.repo.test.js を置いているため有効化する。
        # companion が消失（誤削除・リネーム・キット同期での上書き）したときに失敗するようになる。
        # 未設定だとテスト件数が静かに減るだけで CI は green のまま（planning#114 の実測: 101 → 53 件）。
        env:
          REQUIRE_REPO_TESTS: "1"
        run: node scripts/scripts.test.js

  # スタック非依存: docs/ 配下 Markdown の相対リンク切れを検査（Issue #59 再発防止）。
  # scripts/check-doc-links.js は Node 標準モジュールのみで動作し、依存インストール不要。
  # 注: private な planning サブモジュール配下のリンクは submodule 未取得のため本ジョブでは検査対象外。
  #     planning 込みの検査は doc-links-planning.yml（夜間・トークン付き）が担う（Issue #232 / IADR-0058）。
  doc-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check doc links
        run: node scripts/check-doc-links.js

  # FR-14, ADR-0018, IADR-0028: 宣言的パイプライン構成のスキーマ検証（安全弁）。
  # 本リポジトリはこの任意コンポーネントを**採用する**（ADR-0018 で確定）。
  # 検証を通らない構成は適用不可（必須チェック）。--self-test で検証器自体も毎回試験する。
  pipeline-config:
    runs-on: ubuntu-latest
    env:
      PIPELINE_CONFIG: "deploy/helm/microservices-platform/files/pipeline.json"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # 検証器自体の試験。構成ファイルの有無に関わらず毎回走らせ、検証ロジックの退行を防ぐ。
      - name: Validate pipeline config (self-test)
        run: node scripts/validate-pipeline-config.js --self-test
      - name: Validate pipeline config
        if: env.PIPELINE_CONFIG != ''
        run: node scripts/validate-pipeline-config.js "$PIPELINE_CONFIG"

  # Claude 系ワークフローのツール許可設定を検査する（安全弁）。
  # claude_args の記法誤りは CI を失敗させずに「AI が検証できない」状態を作るため、
  # 人間にもジョブ結果にも現れない。ここで機械的に止める。
  ai-workflow-config:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Check AI workflow config (self-test)
        run: node scripts/check-ai-workflow-config.js --self-test
      # 警告（検査そのものが成立していない状態）は GitHub のアノテーションとして出るため、
      # ジョブログを開かなくても PR の Checks 画面で気付ける。
      #
      # 本リポジトリはファイル名・ワークフロー構成が固まっており（claude-coding.yml /
      # claude-code-review.yml の 2 本・現在 warn ゼロ）、厳格モードを有効化する。
      # claude_args のキー名やインデントが崩れて検査が丸ごと無効になる状態を失敗として止める
      # （scripts-tests の REQUIRE_REPO_TESTS と同じ opt-in 方式。planning#136）。
      - name: Check AI workflow config
        env:
          STRICT_AI_WORKFLOW_CONFIG: "1"
        run: node scripts/check-ai-workflow-config.js

  # FR-14, IADR-0027 / IADR-0056 / IADR-0057, Issue #231: ユニット依存方向の機械検査。
  # csproj の ProjectReference（ユニット外参照）と Foundation→Composable の using を静的走査する。
  # 外部依存ゼロの Node スクリプト。--self-test で検査器自体も毎回試験する。
  unit-dependencies:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # FR-14, IADR-0060 / IADR-0065, Issue #245: ユニット（src/*）の submodule を非再帰で取得し、
      # 追加ユニット（AST 等）の csproj 依存方向も継続的に機械検査する（未取得だと空の gitlink となり
      # 検査対象外＝pin 更新時に platform 直参照の混入を見落とすため）。private planning は巻き込まない。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test unit dependency checker
        run: node scripts/check-unit-dependencies.js --self-test
      - name: Check unit dependency direction
        run: node scripts/check-unit-dependencies.js

  # Issue #18 再発防止: Keycloak realm export の文字列フィールド長が import 先 RDB の
  # varchar(255) を超えていないかを機械検査する（#307 で description が 364 文字となり import が
  # SQLSTATE 22001 で失敗し pod がクラッシュした）。外部依存ゼロ。--self-test で検査器も毎回試験する。
  realm-constraints:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test realm constraint checker
        run: node scripts/check-realm-constraints.js --self-test
      - name: Check realm field lengths
        run: node scripts/check-realm-constraints.js

  # NFR（運用性/信頼性）, IADR-0087, Issue #334: scripts/k8s-local-up.sh の opt-in ゲート
  # （PERSIST / OBSERVABILITY / VAULT / ARGOCD / HEADLAMP / LOCALEDGE / ESO）を横断で固定する
  # smoke test。IADR-0105（#399）以降は「どの env でも apiserver 引数・ドロップインを書かない」ことも
  # 回帰として固定する（旧ゲート HEADLAMP_OIDC_APISERVER は除去済み・指定しても no-op）。
  # 外部バイナリ（k3d/kubectl/helm/docker）を PATH 上の記録スタブへ差し替え、副作用ゼロで
  # スクリプトを実行し発行コマンド列へアサートする（実クラスタは作らない）。外部依存ゼロ（Node + bash のみ）。
  # submodule は取得しない（AST 分岐が決定的に skip され、テストの前提と一致する。IADR-0087 参照）。
  k8s-local-up-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Smoke-test k8s-local-up opt-in gates (stub-on-PATH, no cluster)
        run: node scripts/k8s-local-up.test.js

  # FR-01/FR-02 ほか, IADR-0089, Issue #342 再発防止: BFF が集約する各 downstream の「実効の上流 URL」
  # （Program.cs のコード既定 ?? デプロイ manifest の Services__<Name> 上書き）が、メッシュ規約のポート
  # （:8080）に解決されることを機械検査する。DataSourceService の :8080 上書き漏れがコード既定 5002 のまま
  # live へ出て 21 秒タイムアウト→502 を起こした（#342）。同種の上書き漏れ・ポート違いを止める。
  # in-repo ファイル（Program.cs / values.yaml / docker-compose.yml）のみ参照＝submodule 取得不要。
  # 外部依存ゼロ（Node のみ）。--self-test で検査器自体も毎回試験する。
  bff-downstreams:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test BFF downstream port checker
        run: node scripts/check-bff-downstreams.js --self-test
      - name: Check BFF downstream upstream ports
        run: node scripts/check-bff-downstreams.js

  # FR-14, IADR-0107, Issue #407 再発防止: 可変ユニット（AST）が所有するサービスを MSP 側の values でも
  # 有効化する「重複デプロイ」を機械検査する。経路B で risk-management / market-monitor が 2 namespace に
  # 並び、ExternalName 経由で同一の platform-infra RabbitMQ を共有した結果、同名キュー TradeDecisionMade を
  # consumers=4 で奪い合い、取引判断（OrderApproved/OrderRejected）を無言で取りこぼした。
  # AST 所有サービス一覧は submodule の chart values から読み、未取得なら既知の一覧へ縮退する（fail-safe）。
  # ここでは submodule を取得して実 chart で突合する（pin 更新で AST にサービスが増えても追随できる）。
  # 外部依存ゼロ（Node のみ）。--self-test で検査器自体も毎回試験する。
  unit-service-ownership:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # public な src/* ユニットのみ非再帰で取得する（private planning を巻き込まない。lint ジョブと同型）。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      - name: Self-test unit service ownership checker
        run: node scripts/check-unit-service-ownership.js --self-test
      - name: Check unit service ownership (no duplicate deployment)
        run: node scripts/check-unit-service-ownership.js

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # FR-14, IADR-0060 / IADR-0065, Issue #245: ユニット（src/*）の submodule のみ非再帰で取得する。
      # 既定 checkout は submodule 未取得で、追加ユニットは src/*/backend/backend.slnx 自動発見に現れず
      # 検査対象外になる。checkout の submodules: recursive/true は private な planning（IADR-0058）まで
      # 取得しようとして失敗するため使わない。public ユニットはトークン不要（private ユニットは別途
      # IADR-0058 型トークンが要る）。詳細は docs/how-to/adding-a-unit-submodule.md。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # --- スタック別に書き換え（例: C#/.NET） ---
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # FR-14, IADR-0056 / IADR-0060, Issue #230: 全バックエンドユニット（src/*/backend/backend.slnx）を
      # 自動発見して検査する。ユニット追加時に CI の編集は不要（チェックアウト済みなら自動的に対象になる）。
      - name: Format check (all backend units)
        run: |
          for slnx in src/*/backend/backend.slnx; do
            echo "::group::dotnet format $slnx"
            dotnet format "$slnx" --verify-no-changes
            echo "::endgroup::"
          done

  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # FR-14, IADR-0060 / IADR-0065, Issue #245: ユニット（src/*）の submodule のみ非再帰で取得する。
      # 既定 checkout は submodule 未取得で、追加ユニットは src/*/backend/backend.slnx 自動発見に現れず
      # restore/build/test の対象外になる。checkout の submodules: recursive/true は private な planning
      # （IADR-0058）まで取得しようとして失敗するため使わない。public ユニットはトークン不要（private
      # ユニットは別途 IADR-0058 型トークンが要る）。詳細は docs/how-to/adding-a-unit-submodule.md。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # --- スタック別に書き換え（例: C#/.NET） ---
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      # FR-14, IADR-0056 / IADR-0060, Issue #230: ルート集約ソリューションは置かず、全バックエンドユニット
      # （src/*/backend/backend.slnx）を自動発見して restore → build → test する。ユニット追加時に CI の
      # 編集は不要。bash -eo pipefail 既定によりいずれか失敗で job も失敗する。
      - name: Restore, build and test (all backend units, with coverage)
        run: |
          for slnx in src/*/backend/backend.slnx; do
            echo "::group::$slnx"
            dotnet restore "$slnx"
            dotnet build "$slnx" --no-restore --configuration Release
            dotnet test "$slnx" --no-build --configuration Release --collect:"XPlat Code Coverage" --verbosity normal
            echo "::endgroup::"
          done
      # カバレッジ閾値を強制する場合の例（ツールは任意）:
      #   - run: dotnet tool install --global dotnet-reportgenerator-globaltool
      #   - run: reportgenerator -reports:'**/coverage.cobertura.xml' -targetdir:coverage -reporttypes:TextSummary
      #   - run: cat coverage/Summary.txt

      # 参考: 他スタックの例
      # Node.js:
      #   - uses: actions/setup-node@v7
      #     with: { node-version: "20" }
      #   - run: npm ci
      #   - run: npm run lint --if-present
      #   - run: npm run build --if-present
      #   - run: npm test -- --coverage
      # Python:
      #   - uses: actions/setup-python@v7
      #     with: { python-version: "3.12" }
      #   - run: pip install -e .[test]
      #   - run: ruff check .
      #   - run: pytest --cov
