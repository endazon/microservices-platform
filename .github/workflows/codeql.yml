# CodeQL（SAST）雛形 — 言語に依存するため .example（コピー後に codeql.yml にリネーム）。
# matrix.language を使用スタックに合わせて変更する:
#   csharp / java-kotlin / javascript-typescript / python / go / ruby / swift / c-cpp
# 既定は C#（csharp）。

name: CodeQL

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  schedule:
    - cron: "0 3 * * 1"

permissions:
  security-events: write
  contents: read
  actions: read

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ["csharp"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
      # FR-14, IADR-0056 / IADR-0060, Issue #230: autobuild はリポジトリ全体を走査し templates/（src/ 外・
      # 共通 props 非継承のためビルド不可の雛形）まで拾って失敗する。ci.yml と同じく実ユニット
      # （src/*/backend/backend.slnx）のみを明示ビルドして CodeQL のトレーサに載せる。ユニット追加時も編集不要。
      - name: Build backend units (traced)
        run: |
          for slnx in src/*/backend/backend.slnx; do
            echo "::group::$slnx"
            dotnet build "$slnx" --configuration Release
            echo "::endgroup::"
          done
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
