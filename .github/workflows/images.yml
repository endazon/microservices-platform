# Issue #268, IADR-0067: サービス Dockerfile のイメージビルドを CI で検証する（push はしない）。
#
# 背景: ci.yml はユニット単位（src/*/backend/backend.slnx）の restore/build/test/format しか行わず、
# 配布物であるコンテナイメージ（ADR-0007）のビルドは未検証だった。このため #266 のローカル k8s 起動で
# 初めて LlmGateway（MSB1009）・BFF（CS0246・IADR-0063 の合成点参照）のビルド不能が露見した。
# 本ワークフローは同種の破綻をマージ前に落とす。
#
# 設計（詳細は .ai-context/adr/IADR-0067_service-image-build-ci-gate.md）:
#   - 対象は deploy/docker-compose.yml の build 定義から動的に導出する（単一情報源。サービス追加時に
#     本ファイルの編集は不要）。compose 自身をパーサに使うため、補間・既定値の解釈が実ビルドと一致する。
#   - サービスごとに 1 ジョブのマトリクス（fail-fast: false）。赤の所在がサービス単位で分かる。
#   - パスフィルタは「トリガ」ではなく「ジョブ内判定」で行う。トリガ側 paths でワークフローごと
#     スキップすると、必須チェックが永久 pending となり対象外 PR がマージ不能になるため（GitHub 仕様）。
#     安定名の集約ジョブ image-build が常に結果を報告し、これをブランチ保護の必須チェックにする。
name: Images

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

# 連続 push 時は古い実行をキャンセルする（イメージビルドは重い）。
concurrency:
  group: images-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # 変更パス判定（重いビルドを走らせるか）と、ビルド対象サービスの導出をまとめて行う。
  changes:
    runs-on: ubuntu-latest
    outputs:
      build: ${{ steps.filter.outputs.build }}
      matrix: ${{ steps.discover.outputs.matrix }}
    steps:
      # fetch-depth: 0 は origin/<base>...HEAD の差分解決に必須（ci.yml の commit-messages と同方針）。
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Detect relevant changes
        id: filter
        env:
          BASE_REF: ${{ github.base_ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          # push（develop/main）は常にビルドする。マージ後の破綻を早期に検出するため。
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "push イベントのため全サービスをビルドする。"
            exit 0
          fi
          if ! git rev-parse --verify --quiet "origin/$BASE_REF" >/dev/null; then
            # 差分を確定できない場合は安全側に倒してビルドする（検査漏れを作らない）。
            echo "build=true" >> "$GITHUB_OUTPUT"
            echo "origin/$BASE_REF を解決できないため安全側でビルドする。"
            exit 0
          fi
          changed="$(git diff --name-only "origin/$BASE_REF...HEAD")"
          echo "::group::changed files"
          echo "$changed"
          echo "::endgroup::"
          # src/**（サービス実装・Dockerfile）／compose の build 定義／.dockerignore（コンテキスト）／
          # 本ワークフロー自身のいずれかが変われば、イメージのビルド成立に影響し得る。
          if printf '%s\n' "$changed" | grep -Eq '^src/|^deploy/docker-compose\.yml$|^\.dockerignore$|Dockerfile|^\.github/workflows/images\.yml$'; then
            echo "build=true" >> "$GITHUB_OUTPUT"
          else
            echo "build=false" >> "$GITHUB_OUTPUT"
            echo "イメージのビルドに影響する変更が無いため、ビルドジョブはスキップする。"
          fi
      - name: Discover build targets from compose
        id: discover
        # ビルドしない PR では導出も行わない。compose 側の一時的な問題（当該 PR と無関係な原因）で
        # image-build を赤くし、docs だけの PR を巻き込むことを避ける（PR #274 レビュー指摘）。
        # compose 自体の変更はパス判定に含まれるため、compose が壊れれば build=true 側で必ず捕まる。
        if: steps.filter.outputs.build == 'true'
        run: |
          # compose の build 定義（= ビルドコンテキストと dockerfile の単一情報源）を対象とする。
          matrix="$(docker compose -f deploy/docker-compose.yml config --format json \
            | jq -c '[.services | to_entries[] | select(.value.build) | .key] | sort')"
          count="$(printf '%s' "$matrix" | jq 'length')"
          # 導出が壊れて空マトリクスになると「何も検査せず緑」になる。それを失敗として顕在化させる。
          if [ "$count" -eq 0 ]; then
            echo "::error::deploy/docker-compose.yml から build 定義を導出できなかった（導出ロジックまたは compose の破綻）。"
            exit 1
          fi
          echo "ビルド対象 $count 件: $matrix"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"

  build:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    name: build (${{ matrix.service }})
    strategy:
      # 1 サービスの失敗で他を巻き込まない（壊れているサービスを一度に洗い出す）。
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.changes.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      # Issue #283, IADR-0070: 可変ユニット（src/*）の submodule を取得してからビルドする。frontend は
      # @ai-stock-trading を合成し、configuration-service は AST バックエンドを build context にするため、
      # 未取得だとビルドできない（ci.yml と同型。public ユニットはトークン不要）。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # ビルド成立の検証のみを行い、レジストリへ push はしない（配布は ADR-0007 のリリース経路）。
      - name: Build image
        env:
          SERVICE: ${{ matrix.service }}
        run: docker compose -f deploy/docker-compose.yml build --progress plain "$SERVICE"

  # ブランチ保護の必須チェックに指定する安定名のジョブ。マトリクスのジョブ名は対象が増減すると
  # 変わるため必須チェックに使えない。スキップ時も含めて常に結果を報告する。
  # NFR-21, IADR-0471 決定 3 (#1564): compose に載らない deploy/local 専用のイメージ（scripts/k8s-local-images.sh の
  # LOCAL_ONLY_IMAGES）。上の build は compose の build 定義しか見ないので、ここでビルド可否と中身を確かめる。
  # 🔴 age は版・チェックサム・署名で固定しており、Alpine が -rN を上げると取得が失敗する。**ここが赤くなるのが正しい**
  #    （稼働クラスタでの起動器の実行より先に知らせる）。上げ方は docs/operations/platform-infra-backup-runbook.md。
  # 実行は --network none（中身の確認にネットワークは要らない。バックアップの回も実行時に何も取りに行かない）。
  build-local:
    needs: changes
    if: needs.changes.outputs.build == 'true'
    runs-on: ubuntu-latest
    name: build-local (platform-backup)
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Build image
        run: docker build --progress plain -f deploy/local/platform-backup/image/Dockerfile -t platform-backup:ci deploy/local/platform-backup/image
      - name: Check bundled tools (offline)
        run: |
          docker run --rm --network none --entrypoint age platform-backup:ci --version
          docker run --rm --network none --entrypoint pg_dump platform-backup:ci --version
          docker run --rm --network none --entrypoint bash platform-backup:ci -c 'command -v age-keygen tar gzip sha256sum >/dev/null'

  image-build:
    runs-on: ubuntu-latest
    needs: [changes, build, build-local]
    if: always()
    steps:
      - name: Report result
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          BUILD_RESULT: ${{ needs.build.result }}
          BUILD_LOCAL_RESULT: ${{ needs.build-local.result }}
          SHOULD_BUILD: ${{ needs.changes.outputs.build }}
        run: |
          echo "changes=$CHANGES_RESULT / build=$BUILD_RESULT / build-local=$BUILD_LOCAL_RESULT / should-build=$SHOULD_BUILD"
          if [ "$CHANGES_RESULT" != "success" ]; then
            echo "::error::ビルド対象の導出に失敗した。"
            exit 1
          fi
          # #1564: deploy/local 専用のイメージ。build と同じ条件で走り、同じく skipped は変更なしを意味する。
          case "$BUILD_LOCAL_RESULT" in
            success | skipped) ;;
            *)
              echo "::error::deploy/local 専用イメージのビルドに失敗した（build-local (platform-backup) ジョブのログを参照）。"
              exit 1
              ;;
          esac
          case "$BUILD_RESULT" in
            success)
              echo "✓ 全サービスのイメージビルドが成立した。"
              ;;
            skipped)
              echo "✓ イメージのビルドに影響する変更が無いためスキップした。"
              ;;
            *)
              echo "::error::イメージのビルドに失敗したサービスがある（build (<service>) ジョブのログを参照）。"
              exit 1
              ;;
          esac
