# Claude Code — @claude メンションで Issue / PR に応答する対話ワークフロー
#
# 有効化（このファイルは .example。AI_SETUP.md のプロファイルに従って有効化する）:
#   - 拡張子から .example を外す（git mv claude-coding.example.yml claude-coding.yml）。
#     scripts/apply-profile.sh claude-code / api でも自動化できる。
#   - 認証シークレットを「どちらか一方のみ」登録する
#     （GitHub → Settings → Secrets and variables → Actions → New repository secret）:
#       * Claude Code サブスクリプション（Pro/Max）: ローカルで `claude setup-token` を実行し
#         OAuth トークン（sk-ant-oat01-...）を発行して CLAUDE_CODE_OAUTH_TOKEN に登録する。
#         利用は購読プランのクォータに計上され、API キーは不要。
#       * Anthropic API: ANTHROPIC_API_KEY（sk-ant-api03-...）を登録する（従量課金）。
#     両方を設定しないこと（静的クレデンシャルが競合する）。未設定の方は空文字となり無視される。
#   - Issue / PR のコメント、PR レビューコメント、Issue 本文で「@claude ...」と書くと起動する
#   - このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効
#
# モデル:
#   既定は最新の claude-opus-5。メンションで「@claude opus / sonnet / haiku」と
#   書くと、そのモデルで起動する（"Select model from mention" ステップが解析）。
#   既定値を変えたい場合は同ステップの MODEL="..." を書き換える。

name: Claude Coding

on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]
  issues:
    types: [opened, assigned]
  pull_request_review:
    types: [submitted]

# 同一 issue / PR への連続メンションで多重起動しないようにする。
# レビュー用（claude-code-review）と違い cancel-in-progress は false にする。
# 実装途中のセッションを打ち切ると、コミット前の変更が失われるため。
concurrency:
  group: claude-coding-${{ github.event.issue.number || github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  claude:
    # @claude を含むイベントのみ起動する
    if: |
      (github.event_name == 'issue_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review_comment' && contains(github.event.comment.body, '@claude')) ||
      (github.event_name == 'pull_request_review' && contains(github.event.review.body, '@claude')) ||
      (github.event_name == 'issues' && (contains(github.event.issue.body, '@claude') || contains(github.event.issue.title, '@claude')))
    runs-on: ubuntu-latest
    # ハングした実装セッションが上限まで回り続けるのを防ぐ。
    # レビュー（20 分）より長めに取る（実装はビルド・テストを伴うため）。
    timeout-minutes: 45
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      # claude-code-review.example.yml と同じ理由（mcp__github_ci__* サーバーの導入条件）。
      # 実装セッションでは、自分が出した PR の CI 失敗を自分で読んで直すために要る。
      # 注: ツール許可に additional_permissions は使わない（あれはアプリトークンのスコープ用）。
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 実装リポの checkout / push には既定の GITHUB_TOKEN を使う（上の
          # permissions: contents: write が push を許可する）。ここで token を
          # 上書きしないこと。上書きすると checkout がその資格情報を永続化し、
          # 後段の git push もそのトークンで実行されるため、実装リポへの書き込み
          # 権限が無い PAT だと 403（Permission denied）になる。

      # 計画リポジトリ(project-planning)を submodule 参照している場合のみ有効。
      # PLANNING_REPO_TOKEN は organization の secret に登録した fine-grained PAT で、
      # project-planning への Contents: Read 権限のみを付与する。実装リポの push 認証
      # (GITHUB_TOKEN) とは分離するため、submodule 取得の間だけ一時的に PAT を使い、
      # 直後に解除して push へ漏れないようにする（.gitmodules が無ければ何もしない）。
      - name: Fetch planning submodule (read-only PAT)
        env:
          SUBMODULE_PAT: ${{ secrets.PLANNING_REPO_TOKEN }}
        run: |
          if [ -f .gitmodules ]; then
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule sync --recursive
            git submodule update --init --recursive
            git config --global --unset-all url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf
          fi

      # 検証(build/test)を @claude セッション内で実走するための SDK 準備。
      # 技術スタックに合わせて書き換える（既定は C#/.NET 10。ci.example.yml と揃える。
      # 他スタックは actions/setup-node / actions/setup-python 等に置き換える）。
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # @claude メンションでモデルを選択する。既定は claude-opus-5。
      # 「@claude opus / sonnet / haiku」と書くとそのモデルで起動する。
      # 本文はコマンドインジェクション防止のため env 経由で受け取り、run へ直接展開しない。
      - name: Select model from mention
        id: model
        env:
          COMMENT_BODY: ${{ github.event.comment.body }}
          REVIEW_BODY: ${{ github.event.review.body }}
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: |
          BODY="${COMMENT_BODY}
          ${REVIEW_BODY}
          ${ISSUE_BODY}
          ${ISSUE_TITLE}"
          MODEL="claude-opus-5"
          if   printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+fable';  then MODEL="claude-fable-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+opus';   then MODEL="claude-opus-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+sonnet'; then MODEL="claude-sonnet-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+haiku';  then MODEL="claude-haiku-4-5-20251001"
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Selected model: $MODEL"

      - name: Run Claude Code
        id: claude
        uses: anthropics/claude-code-action@v1
        # gh CLI（Issue 発行等）を既定トークンで認証する。gh は GH_TOKEN/GITHUB_TOKEN を参照する。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 認証はどちらか一方のみ設定する（未設定の方は空文字で無視される）:
          #   サブスク = CLAUDE_CODE_OAUTH_TOKEN / API = ANTHROPIC_API_KEY
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub API アクセス用トークン（MCP GitHub ツール・スティッキーコメント投稿に必要）
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # 既定モデル: 変更可（レビュー用途は claude-sonnet-5 も可）
          #
          # --allowedTools: CI での権限はここ（claude_args）で決まる。アクションは
          #   リポジトリの .claude/settings.json を自動では読み込まないため、ローカル用
          #   settings.json とは別に、CI で使うツールはこの一覧に明示する。
          #   ローカル（.claude/settings.json）と内容を揃えておくと運用が分かりやすい。
          #   ・ユニバーサルツールと GitHub MCP は固定。
          #   ・スタック別ツール（一覧末尾の node / dotnet 系）は ci.example.yml 先頭コメントの
          #     対照表を参考に使用スタックのコマンドへ書き換えること（例: npm run:* / pytest:* / go test:*）。
          # 【記法・最重要】claude_args は**空白区切りで argv へトークン化**される。
          # 1 ツール 1 行で書くと `Bash(dotnet test:*)` が `Bash(dotnet` と `test:*)` に割れ、
          # 空白を含む指定（git 系・dotnet 系・gh 系）が**すべて無効**になる。正しい記法は
          # 「二重引用符でくくった 1 引数・カンマ区切り」（公式ドキュメント準拠）。
          # 検証: ジョブログの `SDK options:` の allowedTools 配列が割れていないか目視する。
          #
          # 末尾のビルド/テスト系（node / dotnet）がスタック別の可変部分である。
          # claude-code-review.example.yml の対応箇所と**同じ内容**に保つこと。
          #
          # 【暫定デルタ・issue 番号の修飾】以下のコメント中の計画リポ issue 参照は、キットでは
          # 裸の `#NNN` で書かれているが本リポでは `planning#NNN` へ修飾してある。planning#146 / planning#149 / planning#155 / planning#160 / planning#163 / planning#168
          # は**同じ番号の無関係な PR / issue が本リポジトリにも実在する**ため、裸で書くとそちらへ
          # 自動リンクしてしまう（`.claude/rules/traceability.md`「クロスリポジトリの issue / PR
          # 番号の修飾」）。キット側の是正を環流したら本デルタは撤去する。
          #
          # 【読み取り専用ツールの対称性（planning#160 / planning#163）】head / tail / cmp / diff /
          # git ls-tree / git submodule status / git fetch / git show / grep / sort / which は
          # レビュー用と揃えてある（実装用にも同じ作業＝キット同期時のバイト一致確認・
          # submodule pin の確認・実走前の SDK 在否確認がある）。planning#155 → planning#160 → planning#163 と同型の
          # 片落ちが 3 度続いたため、この種の非対称は check-ai-workflow-config.js が
          # **ERROR で機械検出する**（意図的な非対称＝実装専用の Edit / Write / 書き込み系 git /
          # find / mkdir と、レビュー専用の gh issue view / gh pr view / gh run list は
          # 同スクリプトの除外リストに宣言してある。増減するときは除外リストも更新すること）。
          #
          # 【git -C の列挙（planning#163）】`.gitmodules` にあるパスごとに 4 サブコマンド
          # （log / show / diff / ls-tree）を列挙する。入れ子の submodule も別パスとして列挙が
          # 要る（前方一致のため親パスの許可は入れ子パスに当たらない）。`Bash(git -C:*)` の
          # 一括許可は採らない（前方一致で書き込み系サブコマンドまで通る）。
          #
          # 【実走の周辺権限（planning#168）】`Bash(which:*)` / `Bash(dotnet --version)` /
          # `Bash(dotnet --info)` / `mcp__github__list_workflow_runs` / `mcp__github__actions_list`
          # は、実走（ビルド・テスト・自分が出した PR の CI 失敗の読解）に必然的に伴う周辺操作で
          # ある。`dotnet` は**引数を固定した形**で足す（裸の `Bash(dotnet:*)` は
          # `dotnet nuget push` 等まで通すため採らない）。CI 結果参照の MCP 名はサーバの版に
          # 依存するので新旧を併記する。`rm` は足さない（生成物の後片付けは責務ではない）。
          # `for` 等のシェル構文と環境変数の前置き形（`VAR=1 cmd`）は許可リストで表現できない
          # ため、いずれも --append-system-prompt 側で作業手順を狭めて塞ぐ。
          #
          # 【GitHub MCP のツール名はサーバの版に依存する（planning#163）】claude-code-action v1 は
          # github-mcp-server を **v0.17.1** に pin しており、この版に在るのは `get_issue` /
          # `get_pull_request` / `list_sub_issues`、統合名 `issue_read` / `pull_request_read` /
          # `pull_request_review_write` は**存在しない**（統合名は v1.x 系）。存在しないツールは
          # AI へ提示されないため拒否も出ず、当たらないエントリのまま気付けない。よって**新旧の
          # 両方を列挙**する。詳細は claude-code-review.example.yml の同名コメントを参照。
          #
          # 【--append-system-prompt: サブエージェント禁止】レビュー用は同じ制約を prompt:
          # 入力に書いているが、本ファイルは `@claude` メンション本文で駆動する構造のため
          # prompt: を持たず、置き場所がここしか無い（planning#149）。
          # 制約が無いと次の形で**成果物が正しくてもジョブが赤くなる**:
          #   AI が Task（サブエージェント）を試みる → 許可リストにも既定にも無いので拒否
          #   → Task 抜きで実装を完遂しコミット・PR も正しく出せる
          #   → 末尾の Check permission denials が拒否 1 件を検出して exit 1
          # Task を許可する選択もあるが採らない。CI ではサブエージェントの起動が完了せず
          # 停止する不具合が出ており（HOWTO 付録3）、レビュー用と同じ (b) に揃える。
          # 【--append-system-prompt: 使える Bash コマンドの正の一覧（planning#168）】拒否の実測は
          # 「拒否される形」の負の列挙では塞げない型（一覧に全く無いコマンドの試行）を示した。
          # そのため**許可済みコマンドの正の一覧**と一覧外の代替手順を先に示す。一覧は
          # **このファイル自身の許可ツール指定から書き起こす**こと（レビュー用とは中身が違い、
          # 機械的に対称化すると存在しない許可を宣言して新たな拒否を生む）。なお prompt 本文へ
          # 「--allowedTools」という文字列を書いてはならない（この値は claude_args ブロック内に
          # あるため、check-ai-workflow-config.js がフラグ名として拾い誤検出で fail する。MSP 実測。
          # 「許可ツール一覧」等と言い換える。claude_args の外にあるコメントは対象外）。
          # 【記法】この値も空白区切りでトークン化される。**1 行・二重引用符でくくる**こと
          # （改行して書くと後続行が別の引数になり、指示が壊れる）。
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --append-system-prompt "この実行は単一セッション内で完結させること。サブエージェント（Task ツールによる spawn。.claude/agents/ 定義の起動を含む）は使用しない。CI では Task が許可されておらず、呼び出しは必ず拒否されるうえ、拒否が 1 件でも記録されるとジョブは失敗する。作業の分割は自分の作業順序として扱い、Read / Grep / Glob / Bash / GitHub MCP ツールで自分自身が順に実施すること。子 issue の一覧は mcp__github__list_sub_issues で取ること（CI が固定する github-mcp-server v0.17.1 に統合名 mcp__github__issue_read は存在しない。統合名は将来の版のために併記して許可してある）。使える Bash コマンドは次で全部であり、一覧に無いコマンドは必ず拒否されるので試さないこと。これは本ワークフローの許可ツール一覧の写しであって、レビュー用ワークフロー（claude-code-review.yml）とは中身が違うため、レビュー用の記憶で判断しないこと。git は読み取り系（git diff / git log / git show / git status / git ls-tree / git submodule status / git fetch、および submodule 変種として git -C planning と git -C src/ai-stock-trading（同 /planning も）の log / show / diff / ls-tree）に加え、実装用にのみ書き込み系の git add / git commit / git push / git switch / git checkout / git branch が使える。閲覧・検索・ファイル操作は ls / find / rg / grep / sort / cat / head / tail / cmp / diff / echo / which / mkdir。gh は gh issue create だけである（gh auth status / gh api / gh run list / gh pr view などは一切許可されていない）。実行系は node / dotnet restore / dotnet build / dotnet test / dotnet format / dotnet --version / dotnet --info。Bash 以外では Read / Grep / Glob / Edit / Write と GitHub MCP ツールが使える。python3 は許可されていないので、YAML や JSON の構文確認を python3 -c でやろうとしないこと。構文を見るだけなら Read で読み、機械的な確認が要るなら許可済みの node で行う（YAML パーサはこのワークスペースに用意されていない前提で考えること）。gh auth status は不要であり許可もされていない。認証は環境側で構成済みであり、GitHub の情報は GitHub MCP ツールで取ること。curl / wget / pip / jq / sed / awk / wc / xargs / env / chmod / rm / mv / cp / touch / tee も一覧に無いので拒否される。件数を数えるときは grep -c / rg -c（総マッチ数なら rg --count-matches）を単体で使うこと。… | wc -l や … | awk によるパイプ集計は wc / awk が一覧に無いため必ず拒否され、鎖全体が実行されない（前段の結果も得られない）。CI の結果は mcp__github__list_workflow_runs（新しいサーバ版では mcp__github__actions_list の list_workflow_runs メソッド）で参照し、ローカル再現を始める前にまず CI を見ること。ただし CI の結果を読む手段には粒度の制限がある。GitHub MCP の Actions 系はこの 2 つだけが許可されており、get_workflow_run / list_workflow_jobs / get_job_logs は拒否される。gh run 系（gh run list / gh run view など）も一切許可されていない。ジョブ単位のログを取得する手段は無いので、それ以上の裏付けが要る主張は未検証（ジョブログの取得手段が無い）と書くこと。SDK の在否は dotnet --version / dotnet --info / which で確認できる（dotnet はこの 2 つと restore / build / test / format のみ許可されている）。ビルド・テストを複数プロジェクトへ回すときは for ループを組まず、src/<unit>/backend/backend.slnx 単位の 1 コマンドで実行すること（シェルの for / while / リダイレクト / コマンド置換は許可リストで表現できず必ず拒否される）。環境変数の前置き形（VAR=1 cmd）も同じ理由で必ず拒否される。Node のスクリプトに環境変数が要るときは node の 1 コマンドに閉じた形を使うが、形は 2 つあり対象スクリプトの作りで使い分けること。node -e で process.env を設定してから require する形が通用するのは require.main === module ガードを持たないスクリプトだけであり、使う前に対象スクリプトの末尾を Read してガードの有無を自分で確認すること。ガード付きのスクリプトへ require 形を使うと main が呼ばれず、出力ゼロのまま exit 0 になる（何も検査していないのに成功に見える）ため使ってはならない。その場合は node -e の中で require('child_process').spawnSync を呼び、その status を process.exit へ伝播する子プロセス形を使うこと。どちらの形でも、出力が 1 行も出なかったときは実行できたと見なさず、子プロセス形で取り直すこと。単独の変数代入（VAR=… のように値を変数へ置くだけのコマンド）も先頭トークンの前方一致判定で必ず拒否されるため、必要な文字列は各コマンドへ直接書くこと。3 段以上のパイプ連鎖も組まないこと（各コマンドが個別には許可済みでも拒否された実測がある）。比較は git show <ref>:<path> | diff - <path> の 2 段に収め、絞り込みが要るときは段を増やさずコマンドを分けて 2 回実行すること。テスト実行が生成した成果物（TestResults やカバレッジ XML）は削除しないこと。ワークスペースはジョブ終了で破棄される使い捨てであり、後片付けは責務ではない（rm は許可されておらず、試みれば拒否として記録されるだけである）。"
            --allowedTools "Read,Grep,Glob,Edit,Write,Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git ls-tree:*),Bash(git submodule status:*),Bash(git fetch:*),Bash(git -C planning log:*),Bash(git -C planning show:*),Bash(git -C planning diff:*),Bash(git -C planning ls-tree:*),Bash(git -C src/ai-stock-trading log:*),Bash(git -C src/ai-stock-trading show:*),Bash(git -C src/ai-stock-trading diff:*),Bash(git -C src/ai-stock-trading ls-tree:*),Bash(git -C src/ai-stock-trading/planning log:*),Bash(git -C src/ai-stock-trading/planning show:*),Bash(git -C src/ai-stock-trading/planning diff:*),Bash(git -C src/ai-stock-trading/planning ls-tree:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(git switch:*),Bash(git checkout:*),Bash(git branch:*),Bash(ls:*),Bash(find:*),Bash(rg:*),Bash(grep:*),Bash(sort:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(cmp:*),Bash(diff:*),Bash(echo:*),Bash(which:*),Bash(mkdir:*),Bash(gh issue create:*),mcp__github__pull_request_read,mcp__github__get_file_contents,mcp__github__issue_read,mcp__github__get_issue,mcp__github__get_pull_request,mcp__github__list_sub_issues,mcp__github__list_workflow_runs,mcp__github__actions_list,mcp__github__pull_request_review_write,mcp__github__add_comment_to_pending_review,mcp__github__add_issue_comment,mcp__github__push_files,Bash(node:*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*),Bash(dotnet --version),Bash(dotnet --info)"

      # 権限拒否の可視化（安全弁）。claude-code-review.example.yml と同じ内容に保つこと。
      #
      # claude-code-action は、AI がツールを 1 つも実行できなくても
      # `"subtype": "success", "is_error": false` で終わる。実装側では「実装したつもりで
      # 何もコミットされていない」形になり、ジョブは緑のままである。
      # CI には承認する人間が居ないため、権限拒否は「待たされた」ではなく
      # **「その作業は永久に実行されない」**を意味する。ここで止める。
      #
      # if: always() が必須である（上の step が失敗した場合こそ内訳を知りたい）。
      # 実行ログを読めない構成では warn を出して exit 0（fail-open）。
      - name: Check permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/check-permission-denials.js "$EXECUTION_FILE"

