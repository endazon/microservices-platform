# Issue #275, IADR-0068: k8s-local-images.sh の MAPPING と deploy/docker-compose.yml の build 定義の
# ドリフトを機械検査する（外部依存ゼロの Node スクリプト）。
#
# 背景: images.yml（#268 / IADR-0067）は compose を単一情報源にイメージ「ビルド可否」を担保するが、
# k8s-local-images.sh の MAPPING は別のビルド対象リストで、両者のドリフトは未検査だった。本ワークフローは
# 対応表の整合をマージ前に落とす。設計は .ai-context/adr/IADR-0068_image-mapping-drift-check.md を参照。
#
# ci.yml には足さない（共有ファイルの競合回避。images.yml / frontend*.yml と同じ独立ワークフロー方針）。
# 検査は軽量（Node のみ・docker 不要）なため paths フィルタを使わず全 PR/push で常に結果を報告する
# （必須チェックにしても永久 pending にならない。IADR-0067 の教訓）。
name: Image Mapping

on:
  push:
    branches: [develop, main]
  pull_request:
    types: [opened, synchronize, reopened]

# NFR / IADR-0232 決定 1: 連続 push で古い実行を捨てる（PR のみ）。
# develop / main への push は完走させる。
concurrency:
  group: image-mapping-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  image-mapping:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #1182, IADR-0372: 可変ユニット（src/*）の submodule を取得する。SERVICE_PROJECT /
      # dockerfile が **pin されたツリーに実在するか**を見るのに実体が要る（ci.yml / images.yml と
      # 同型のイディオム。public ユニットはトークン不要）。取得できなければ次のステップが
      # --require-submodule で赤くなる（「何も検査せず緑」にしない）。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
      # --self-test で検査器自体を毎回試験する（check-unit-dependencies.js / validate-pipeline-config.js と同型）。
      - name: Self-test image-mapping checker
        run: node scripts/check-image-mapping.js --self-test
      # #1182: 同値（ドリフト）に加え、submodule ツリーへのパス実在も見る。--require-submodule は
      # 未 populate を notice ではなく赤にする（上の取得ステップが壊れたら黙って緑にならない）。
      - name: Check MAPPING ↔ compose drift and submodule path existence
        run: node scripts/check-image-mapping.js --require-submodule
