# planning pin の鮮度検知 — 計画側の裁定が反映されたことに気づく経路（issue #589 / IADR-0170）
#
# 背景:
#   IADR-0119 決定 2 の着手条件には「前提 ADR が Accepted になること」が含まれる。計画側で裁定が反映されても、
#   本リポの pin を進めるまで実装側には何も伝わらない。**待ち時間の実体は「回答待ち」ではなく
#   「回答に気づいていない時間」だった**（#572 施策 7 が施策 5 の結論を訂正した）。
#   同型は #548 / #560 / #589 の 3 回とも「人が気づいて起票」で処理されている。
#   **自動化するのは検知ではなく、その手作業（起票）そのものである。**
#
# なぜ別ワークフローなのか:
#   planning を populate できるのはトークン付きジョブだけで、既存の該当ジョブは
#   doc-links-planning.yml（`name: doc-links (planning)`）である。そこへ相乗りすると
#   **ジョブ名と中身が食い違い**、かつ doc-links の失敗に引きずられて pin 検査が走らなくなる。
#   `.github/workflows/` は編集できる（IADR-0169 が「編集不可」という前提の誤りを是正した）ため、
#   目的ごとに分ける。
#
# なぜ「赤」ではなく issue なのか:
#   #589 は「判定は警告であって失敗ではない（赤にすると pin が古い間ずっと CI が止まる）」と
#   指定した。正しい。**だが夜間ジョブで警告を出すだけなら、それは誰も読まないログである** ——
#   doc-links-planning.yml 自身が「導線が無いと『誰も見ない赤』が常態化する」と警告している。
#   **通知手段を「赤」ではなく「issue」にする。** ジョブは緑のまま終わる。
#
# 前提（メンテナ設定）:
#   Secret `PLANNING_REPO_TOKEN`（本リポと endazon/project-planning 双方へ read 権限を持つ PAT）。
#   doc-links-planning.yml と同じシークレットを使う。未登録なら submodule 取得に失敗し、
#   検査器は「未 populate のため検査していません」と出して exit 0 する（fail-open）。
name: planning pin freshness

on:
  schedule:
    - cron: "30 17 * * *" # 毎日 17:30 UTC（≈ 02:30 JST）。doc-links (planning) の 30 分後
  workflow_dispatch:

permissions:
  contents: read
  issues: write # 乖離を検知したら tracking issue を起票するため

concurrency:
  group: planning-pin-freshness
  cancel-in-progress: true

jobs:
  planning-pin-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          token: ${{ secrets.PLANNING_REPO_TOKEN }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"

      # 検査器は落とさない（fail-open）。乖離の有無を stdout と GITHUB_OUTPUT へ出す。
      # PIN_REPORT_PATH には**素のテキスト**が書かれる。stdout は Actions 上では
      # `::warning::…`（注釈の書式）なので、そのまま issue へ貼ると読めない。
      - name: Check planning pin freshness
        id: check
        env:
          PIN_REPORT_PATH: ${{ runner.temp }}/pin-freshness.txt
        run: node scripts/check-planning-pin-freshness.js

      # 気付き導線。**赤にせず issue で知らせる。** 既に open の検知 issue があれば
      # 起票せず comment する（doc-links-planning.yml と同じ型）。
      - name: Notify on drift (open a tracking issue)
        if: steps.check.outputs.drifted == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="chore(NFR): 計画 pin が古く、着手可否に効く変更が計画側に入っている"
          BODY="$(printf '%s\n\n実行ログ: %s\n\n`node scripts/check-planning-pin-freshness.js` をローカルで実行して内容を確認し、pin を進めるか判断すること（本検査は CI を落とさない）。\n' "$(cat "$RUNNER_TEMP/pin-freshness.txt")" "$RUN_URL")"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label enhancement --body "$BODY"
          fi

      # 比較そのものが壊れているとき（#749 / IADR-0202）。**乖離の有無は分からない。**
      # 警告注釈は緑のジョブに埋もれるため、乖離と同じく issue で知らせる。
      # **タイトルは分ける** ——「pin が古い」と「比較できていない」は別の事象であり、
      # 同じ issue へ混ぜると対処が分からなくなる。
      - name: Notify on broken comparison (open a tracking issue)
        if: steps.check.outputs.comparison == 'reverse' || steps.check.outputs.comparison == 'diverged'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          TITLE="fix(NFR): 計画 pin の鮮度検知が比較できていない（比較元が pin より後ろ／分岐）"
          BODY="$(printf '%s\n\n実行ログ: %s\n\n比較元（submodule の origin）が pin より後ろにあるため、乖離の有無は判定できていない。**「効く変更が無い」ことを意味しない**（#749）。\n' "$(cat "$RUNNER_TEMP/pin-freshness.txt")" "$RUN_URL")"
          EXISTING=$(gh issue list --state open --search "\"$TITLE\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --body "$BODY"
          else
            gh issue create --title "$TITLE" --label bug --body "$BODY"
          fi
