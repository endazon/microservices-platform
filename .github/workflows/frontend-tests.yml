# IADR-0033: フロントエンド単体テスト＋カバレッジの専用 CI。
# frontend.yml（typecheck/lint/build/e2e を含む複合 CI）とは別に、
# テスト＝品質ゲートを独立させ、カバレッジのレポート生成としきい値ゲートを担う。
# FR-14, IADR-0056: フロントエンドは src/<unit>/frontend（workspaces ルート = src/）。
# 各ユニットの frontend 変更で起動する（バックエンド .NET CI とは独立）。
name: Frontend Tests

on:
  push:
    branches: [develop, main]
    paths:
      - "src/*/frontend/**"
      - "src/packages/**"
      - "src/package.json"
      - "src/pnpm-lock.yaml"
      - "src/pnpm-workspace.yaml"
      - "src/vitest.config.ts"
      - "src/eslint.config.js"
      # Issue #558: **契約と生成の設定**。これらだけを変える PR（`required` の追加のみ等）でも
      # 生成型が変わり、テスト対象のコードがその型で書かれている。従前 frontend.yml にだけ
      # あり、**契約だけを直す PR ではカバレッジ床の検査が起動しなかった**。
      # **確認は「success か」ではなく「skipped になっていないか」で見ること**（#524 の先例）。
      - "docs/api/openapi.yaml"
      - "src/orval.config.ts"
      - "src/orval-bff-only.cjs"
      # NFR / issue #747: AST（可変ユニット）submodule のポインタ。横断 vitest は AST の feature テストも
      # 収集する（下の checkout コメント参照）のに、bump で変わる gitlink 1 エントリ（src/ai-stock-trading）は
      # src/*/frontend/** に一致せず、**カバレッジ床の検査が素通りしていた**（frontend.yml と同型）。
      # 末尾に /** を付けない（gitlink そのものを指すため）。
      # **src/ 配下へ submodule を足したらここへも足すこと**（scripts.repo.test.js が .gitmodules と突合する）。
      - "src/ai-stock-trading"
      # NFR / issue #801: 追加可変機能ユニットの**雛形**（FR-14 / IADR-0060）。src/ の外にあるため
      # 上の "src/*/frontend/**" に一致しない。**src/vitest.config.ts の test.include は
      # '../templates/*/frontend/src/**/*.{test,spec}.{ts,tsx}' を収集する**のに、それを実際に走らせる
      # 唯一の CI（本ファイル。pnpm run test:coverage）が起動しなかった——すなわち
      # **雛形のテストだけを壊す変更が素通りする**（include・frontend.yml の paths:・雛形のテスト本体は
      # すべて #777 の 1 コミットで入り、本ファイルだけ取り残された）。
      # 「paths: の取りこぼしで検査が静かに素通りする」型は**着地日順に 4 件目**である
      # （1: #562 / 2: #558 / 3: #747 / 4: 本件）。
      # **push 側と pull_request 側の両方に置くこと**（片方だけでは片側の経路が素通りする）。
      # scripts.repo.test.js が「test.include ⊆ 本ファイルの paths:」を機械で突合する。
      - "templates/*/frontend/**"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/*/frontend/**"
      - "src/packages/**"
      - "src/package.json"
      - "src/pnpm-lock.yaml"
      - "src/pnpm-workspace.yaml"
      - "src/vitest.config.ts"
      - "src/eslint.config.js"
      # Issue #558: **契約と生成の設定**。これらだけを変える PR（`required` の追加のみ等）でも
      # 生成型が変わり、テスト対象のコードがその型で書かれている。従前 frontend.yml にだけ
      # あり、**契約だけを直す PR ではカバレッジ床の検査が起動しなかった**。
      # **確認は「success か」ではなく「skipped になっていないか」で見ること**（#524 の先例）。
      - "docs/api/openapi.yaml"
      - "src/orval.config.ts"
      - "src/orval-bff-only.cjs"
      # NFR / issue #747: AST submodule のポインタ（push 側と同じ理由。末尾に /** を付けない）。
      - "src/ai-stock-trading"
      # NFR / issue #801: 追加可変機能ユニットの雛形（FR-14 / IADR-0060。push 側と同じ理由）。
      # **push 側と対で置くこと**——片方だけだとその経路が素通りする。
      - "templates/*/frontend/**"
      - ".github/workflows/frontend-tests.yml"

defaults:
  run:
    working-directory: src

# NFR / IADR-0232 決定 1: 連続 push で古い実行を捨てる（PR のみ）。
# develop / main への push は完走させる。
concurrency:
  group: frontend-tests-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #283, IADR-0070: 可変ユニット（src/*）の submodule を取得する。横断 vitest は AST の feature
      # テストも収集するため、未取得だと pnpm install / test:coverage が解決不能になる（ci.yml と同型・トークン不要）。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        working-directory: ${{ github.workspace }}
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # IADR-0121 決定 2: パッケージ管理は pnpm workspace。CI では Volta を使わず pnpm/action-setup で
      # 版を解決する（版の単一情報源は src/package.json の packageManager フィールド）。
      # package_json_file を明示するのは、action の既定がリポジトリ直下の package.json であり、
      # 本リポジトリの workspace ルートは src/ のため既定では版を解決できず
      # 「Error: No pnpm version is specified.」で落ちるからである（PR #489 の CI で実測）。
      # version: を直書きしないのは、版の単一情報源を src/package.json の packageManager に保つため。
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: src/package.json
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 単体テスト（Vitest）をカバレッジ付きで実行する。
      # src/vitest.config.ts の coverage.thresholds を下回ると失敗する（回帰防止ゲート）。
      - name: Unit tests with coverage
        run: pnpm run test:coverage
      # カバレッジレポート（lcov / html / text-summary）を成果物として保存する。
      # しきい値未達でも診断できるよう、失敗時も常にアップロードする。
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/coverage
          if-no-files-found: warn
          retention-days: 14
