# IADR-0033: フロントエンド単体テスト＋カバレッジの専用 CI。
# frontend.yml（typecheck/lint/build/e2e を含む複合 CI）とは別に、
# テスト＝品質ゲートを独立させ、カバレッジのレポート生成としきい値ゲートを担う。
# FR-14, IADR-0056: フロントエンドは src/<unit>/frontend（workspaces ルート = src/）。
# 各ユニットの frontend 変更で起動する（バックエンド .NET CI とは独立）。
name: Frontend Tests

on:
  push:
    branches: [develop, main]
    paths:
      - "src/*/frontend/**"
      - "src/package.json"
      - "src/pnpm-lock.yaml"
      - "src/pnpm-workspace.yaml"
      - "src/vitest.config.ts"
      - "src/eslint.config.js"
      - ".github/workflows/frontend-tests.yml"
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/*/frontend/**"
      - "src/package.json"
      - "src/pnpm-lock.yaml"
      - "src/pnpm-workspace.yaml"
      - "src/vitest.config.ts"
      - "src/eslint.config.js"
      - ".github/workflows/frontend-tests.yml"

defaults:
  run:
    working-directory: src

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # Issue #283, IADR-0070: 可変ユニット（src/*）の submodule を取得する。横断 vitest は AST の feature
      # テストも収集するため、未取得だと pnpm install / test:coverage が解決不能になる（ci.yml と同型・トークン不要）。
      - name: Fetch unit submodules (src/*, public, non-recursive)
        working-directory: ${{ github.workspace }}
        run: |
          git config --file .gitmodules --get-regexp '^submodule\..*\.path$' \
            | awk '$2 ~ /^src\// { print $2 }' \
            | xargs -r -n1 git submodule update --init
      # IADR-0121 決定 2: パッケージ管理は pnpm workspace。CI では Volta を使わず pnpm/action-setup で
      # 版を解決する（版の単一情報源は src/package.json の packageManager フィールド）。
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: src/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 単体テスト（Vitest）をカバレッジ付きで実行する。
      # src/vitest.config.ts の coverage.thresholds を下回ると失敗する（回帰防止ゲート）。
      - name: Unit tests with coverage
        run: pnpm run test:coverage
      # カバレッジレポート（lcov / html / text-summary）を成果物として保存する。
      # しきい値未達でも診断できるよう、失敗時も常にアップロードする。
      - name: Upload coverage report
        if: ${{ always() }}
        uses: actions/upload-artifact@v7
        with:
          name: frontend-coverage
          path: src/coverage
          if-no-files-found: warn
          retention-days: 14
