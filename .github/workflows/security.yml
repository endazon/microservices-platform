# セキュリティ自動化: 秘密情報スキャン ＋ 依存関係レビュー
#
# - gitleaks: コミット/履歴に秘密情報が混入していないか検査（AI が誤って鍵を混入するリスクに対処）。
# - dependency-review: PR で導入される依存に既知の重大脆弱性が無いか検査。
#
# このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効。

name: Security

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-review:
    name: Dependency review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Dependency Review
        uses: actions/dependency-review-action@v5
        with:
          fail-on-severity: high
