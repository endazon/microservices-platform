# NFR, IADR-0708: 配備する第三者のイメージ（deploy/ の digest 固定の参照）の既知の脆弱性を週次で走査する。
#
# images.yml の Trivy は自製のイメージ（compose の build 定義）だけを走査する。RabbitMQ・Prometheus・Alertmanager・
# collector・OpenBao・Keycloak など、上流のイメージを digest で固定して使うものは、固定の性質上、上流の修正が
# 自動では入らない。ここで走査し、修正版のある CRITICAL / HIGH が見つかれば知らせる（更新の通知は dependabot.yml の docker）。
#
# 対象: `node scripts/check-image-digests.js --scan-targets`（deploy/ の第三者・digest 固定・重複なし）。
#       対象の選び方は同スクリプトの scanTargets と自己試験が固定する。
#
# 赤の扱い（手順は docs/operations/third-party-image-scan-runbook.md）:
#   - 週次 schedule・workflow_dispatch: 修正版のある CRITICAL / HIGH が 1 件でもあるイメージの脚を落とす。
#     落ちたら report-failure が issue を起票する（同じワークフローの失敗は 1 本の issue へ集まる）。
#     結果の詳細は Security タブ（code scanning。書き込みの権限を持つ人だけが見る）へ SARIF で載せ、ログには件数だけを出す。
#   - pull_request（deploy/ のイメージの参照・本ファイル・対象の選び方を触る PR）: 件数を注記するだけで落とさない。
#     既存の古い版で、関係の無い PR を赤くしないためである。**必須チェックにしない**（paths を持つので、必須にすると恒久 pending になる）。
#   - 受け入れる脆弱性は .github/image-scan.trivyignore.yaml に、理由（statement）と期限（expired_at）つきで書く（期限が来ると再び赤になる）。
name: Third-party Image Scan

on:
  schedule:
    - cron: "17 4 * * 2"
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "deploy/**"
      - "scripts/check-image-digests.js"
      - ".github/image-scan.trivyignore.yaml"
      - ".github/workflows/third-party-image-scan.yml"

# PR の連続 push では古い実行を捨てる。schedule・dispatch は捨てない（結果を Security タブへ残す経路のため）。
concurrency:
  group: third-party-image-scan-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  targets:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: List scan targets
        id: list
        run: |
          set -euo pipefail
          matrix="$(node scripts/check-image-digests.js --scan-targets)"
          echo "matrix=$matrix" >> "$GITHUB_OUTPUT"
          echo "走査の対象: $(printf '%s' "$matrix" | jq 'length') 件"

  scan:
    needs: targets
    runs-on: ubuntu-latest
    timeout-minutes: 20
    name: scan (${{ matrix.image }})
    # SARIF を code scanning へ上げる（security-events: write）。codeql-action の upload-sarif が実行中の run を読む（actions: read）。
    permissions:
      contents: read
      security-events: write
      actions: read
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        image: ${{ fromJSON(needs.targets.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # code scanning の category は、参照から digest を落とし、英数字と `. _ / -` だけにした短い名前にする
      # （`:` `@` と 64 桁の digest を入れない。同じ repo:tag が別の digest で並ぶことは check-image-digests.js の [digest-mismatch] が止める）。
      - name: Category
        id: cat
        env:
          IMAGE: ${{ matrix.image }}
        run: |
          set -euo pipefail
          name="$(printf '%s' "${IMAGE%%@sha256:*}" | sed 's/[^A-Za-z0-9._/-]/-/g')"
          echo "category=third-party-image/${name}" >> "$GITHUB_OUTPUT"
      - name: Scan image (Trivy)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          # 本アクションの版の既定と同じ値を明示する。YAML の ignore ファイルはアクションがそのまま TRIVY_IGNOREFILE に渡し、
          # Trivy がこの版で拡張子から YAML として読む（expired_at を過ぎた項目は外し、statement を無視の理由に残す）。
          version: v0.70.0
          image-ref: ${{ matrix.image }}
          scanners: vuln
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          trivyignores: .github/image-scan.trivyignore.yaml
          format: sarif
          # 既定の SARIF は重大度の絞りを外して全件を出す。件数の判定を CRITICAL / HIGH に合わせるため絞る。
          limit-severities-for-sarif: true
          output: trivy.sarif
          exit-code: "0"
      - name: Upload to code scanning
        if: github.event_name != 'pull_request'
        uses: github/codeql-action/upload-sarif@1fc58d04a4d4374f921bdac573c3811c240f9c26 # v4.39.2
        with:
          sarif_file: trivy.sarif
          category: ${{ steps.cat.outputs.category }}
      # 件数だけを出す（詳細は Security タブ）。走査の結果が無いのは合格ではないので落とす。
      - name: Judge
        env:
          IMAGE: ${{ matrix.image }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ ! -s trivy.sarif ]; then
            echo "::error::$IMAGE の走査の結果が無い（走査が失敗した。合格ではない）。"
            exit 1
          fi
          n="$(jq '[.runs[].results[]] | length' trivy.sarif)"
          echo "### ${IMAGE}: 修正版のある CRITICAL / HIGH ${n} 件" >> "$GITHUB_STEP_SUMMARY"
          if [ "$n" -eq 0 ]; then exit 0; fi
          if [ "$EVENT_NAME" = "pull_request" ]; then
            echo "::warning::$IMAGE に修正版のある CRITICAL / HIGH が ${n} 件ある（PR では落とさない。週次の走査で落ちる）。"
            exit 0
          fi
          echo "::error::$IMAGE に修正版のある CRITICAL / HIGH が ${n} 件ある。詳細は Security タブ。扱いは docs/operations/third-party-image-scan-runbook.md。"
          exit 1

  # 週次・dispatch の走査が落ちたことを issue に残す（IADR-0232 決定 1 と同じ形）。PR では起票しない。
  report-failure:
    needs: [targets, scan]
    if: always() && github.event_name != 'pull_request' && contains(needs.*.result, 'failure')
    uses: ./.github/workflows/ci-failure-issue.yml
    permissions:
      contents: read
      issues: write
      actions: read
