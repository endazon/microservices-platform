# Claude Code — PR の自動 AI レビュー
#
# PR がオープン/更新されたときに、計画書との整合・トレーサビリティの観点で AI レビューを行う。
#
# 有効化（このファイルは .example。AI_SETUP.md のプロファイルに従って有効化する）:
#   - 拡張子から .example を外す（git mv claude-code-review.example.yml claude-code-review.yml）。
#   - 認証シークレットを「どちらか一方のみ」登録する:
#       * Claude Code サブスクリプション: CLAUDE_CODE_OAUTH_TOKEN（`claude setup-token` で発行）
#       * Anthropic API: ANTHROPIC_API_KEY（従量課金）
#   - このファイルは実装リポジトリ直下の .github/workflows/ に配置されたときのみ有効
#
# モデル:
#   レビューは速度・コストを優先し既定で claude-sonnet-5 を使う。
#   PR 本文/タイトルに「@claude opus / sonnet / haiku」と書くとそのモデルで起動する
#   （"Select model from mention" ステップが解析）。既定は同ステップの MODEL="..." で変更。
#
# 権限（GitHub MCP ツール）について:
#   GitHub MCP ツール（mcp__github__pull_request_review_write 等）は
#   claude_args の --allowedTools で許可する（これが CI での正しい指定方法）。
#   アクションはリポジトリの .claude/settings.json を自動では読み込まないため、
#   settings.json の allow リストに頼らないこと。
#   注意: additional_permissions は MCP ツール名の列挙ではなく `actions: read` 等の
#   スコープ指定用なので、ツール許可には使わない（CI ログ参照を許可したい場合のみ使う）。
#   追加保護: use_sticky_comment: true でアクション自身が出力を投稿（ツール拒否時のフォールバック）。
#
# 【重要】レビュー用と実装用でツール許可を食い違わせないこと:
#   claude-coding.example.yml のスタック別コマンド（build / test / format）は、**必ず同じ内容を
#   本ファイルの --allowedTools にも複製する**。下の setup ステップで SDK を用意しているのに
#   実行を許可しないと、レビューは検証できず静的読解へ退行し、毎回「Bash が承認待ちでブロック
#   されたため実行結果は検証できていません」という無価値な指摘を 1 枠消費する（CI には承認する
#   人間がいないため、この待ちは必ず失敗に終わる）。実運用でこの退行が 2 週間継続した実績がある。

name: Claude Code Review

on:
  pull_request:
    # reopened を含めるのは、この check を required status check に指定できるようにするため
    # （#705 / IADR-0182 決定 3）。再オープンされた PR で report されないと、必須指定した
    # 瞬間にその PR が永久 pending になる。本リポの他 8 ワークフローはすべて reopened を持ち、
    # 本ファイルだけが例外だった（キットの .example から継承した欠陥。planning#313 として起票済み）。
    types: [opened, synchronize, reopened]

# 連続 push でレビューが多重起動するのを防ぐ（古い実行はキャンセルする）。
# 未設定だと 1 PR で 3〜4 本が並走し、サブスク枠を消費したうえ陳腐化した結果で
# スティッキーコメントを上書きし合う。
concurrency:
  group: claude-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  claude-review:
    # dependabot に加え、bot が自動生成する PR（CHANGELOG 更新等）も除外する。
    # GITHUB_TOKEN で作られた PR はワークフローが `action_required`（承認待ち）で
    # 止まるため、対象に含めても実行されずキューを汚すだけである（changelog.yml 参照）。
    if: ${{ github.actor != 'dependabot[bot]' && !startsWith(github.head_ref, 'automation/') }}
    runs-on: ubuntu-latest
    # ハングした実行が上限まで回り続けるのを防ぐ。
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
      # CI の状態・ログを参照するために必要。2 か所が同時にこれへ依存する:
      #   1. アクションが注入する mcp__github_ci__* サーバー。導入前にワークフロートークンが
      #      actions: read を持つか実際に検証し、無ければ「Skipping CI server installation」と
      #      警告して導入を取り止める（許可済みのはずのツールが存在しない状態になる）。
      #   2. --allowedTools の `Bash(gh run list:*)`。gh CLI 側が actions: read を要求するため、
      #      権限が無いと許可されていても実行時に失敗する。
      # 注: ツール許可に additional_permissions は使わない（あれはアプリトークンのスコープ用）。
      actions: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # 実装リポの checkout / push には既定の GITHUB_TOKEN を使う（上の
          # permissions: contents: write が push を許可する）。ここで token を
          # 上書きしないこと。上書きすると checkout がその資格情報を永続化し、
          # 後段の git push もそのトークンで実行されるため、実装リポへの書き込み
          # 権限が無い PAT だと 403（Permission denied）になる。

      # 計画リポジトリ(project-planning)を submodule 参照している場合のみ有効。
      # PLANNING_REPO_TOKEN は organization の secret に登録した fine-grained PAT で、
      # project-planning への Contents: Read 権限のみを付与する。実装リポの push 認証
      # (GITHUB_TOKEN) とは分離するため、submodule 取得の間だけ一時的に PAT を使い、
      # 直後に解除して push へ漏れないようにする（.gitmodules が無ければ何もしない）。
      - name: Fetch planning submodule (read-only PAT)
        env:
          SUBMODULE_PAT: ${{ secrets.PLANNING_REPO_TOKEN }}
        run: |
          if [ -f .gitmodules ]; then
            git config --global url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf "https://github.com/"
            git submodule sync --recursive
            git submodule update --init --recursive
            git config --global --unset-all url."https://x-access-token:${SUBMODULE_PAT}@github.com/".insteadOf
          fi

      # 検証(build/test)を @claude セッション内で実走するための SDK 準備。
      # 技術スタックに合わせて書き換える（既定は C#/.NET 10。ci.example.yml と揃える。
      # 他スタックは actions/setup-node / actions/setup-python 等に置き換える）。
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      # レビューは PR オープン/更新で自動起動するため、モデル指定は PR 本文/タイトルの
      # 「@claude opus / sonnet / haiku」で切り替える。未指定時は既定 claude-sonnet-5。
      # 本文はコマンドインジェクション防止のため env 経由で受け取り、run へ直接展開しない。
      - name: Select model from mention
        id: model
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          BODY="${PR_BODY}
          ${PR_TITLE}"
          MODEL="claude-sonnet-5"
          if   printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+fable';  then MODEL="claude-fable-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+opus';   then MODEL="claude-opus-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+sonnet'; then MODEL="claude-sonnet-5"
          elif printf '%s' "$BODY" | grep -qiE '@claude[[:space:]]+haiku';  then MODEL="claude-haiku-4-5-20251001"
          fi
          echo "model=$MODEL" >> "$GITHUB_OUTPUT"
          echo "Selected model: $MODEL"

      - name: Run Claude Code Review
        id: claude
        uses: anthropics/claude-code-action@v1
        # gh CLI（Issue 発行等）を既定トークンで認証する。gh は GH_TOKEN/GITHUB_TOKEN を参照する。
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          # 認証はどちらか一方のみ設定する（未設定の方は空文字で無視される）:
          #   サブスク = CLAUDE_CODE_OAUTH_TOKEN / API = ANTHROPIC_API_KEY
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          # GitHub API アクセス用トークン（MCP GitHub ツール・スティッキーコメント投稿に必要）
          github_token: ${{ secrets.GITHUB_TOKEN }}
          # Bot（GitHub App の Claude 等）が開いた PR もレビュー対象にする。
          # 注意: 公開リポジトリで '*' を指定すると外部 App からも起動され得る（公式警告）。
          #   公開リポジトリでは 'claude,dependabot[bot]' など特定ボット名に絞ること。
          #   再帰ループが心配な場合も同様に絞る。
          allowed_bots: '*'
          # レビュー結果を PR スティッキーコメントとして投稿する（use_sticky_comment: true が重要）。
          # アクション自身が必ず PR にスティッキーコメントを投稿する（ツールの成否に関わらず保証される）。
          use_sticky_comment: true
          # CI ログにもレビュー本文を出力する（デバッグ・監査用）
          display_report: true
          # レビュー進捗コメントを PR に表示する
          track_progress: true
          # 既定モデル: 変更可（厳密さ優先なら claude-opus-5）。
          # GitHub MCP ツールはここで許可する（mcp__github__pull_request_review_write 等の
          # 権限拒否はこれで解消する。additional_permissions は使わない）。
          # Read は計画書（../project-planning）の参照に必要。
          # 安全性の注記: 下のビルド/テスト許可は PR のコードを**実行**する。fork からの
          # pull_request では secrets が渡らずアクションの認証自体が成立しない（＝実質
          # 同一リポの PR のみが対象）ため既定では許容範囲だが、公開リポジトリで fork の
          # レビューまで走らせる運用にする場合は、実行系（dotnet test / node 等）を外すか
          # pull_request_target を使わない構成を維持すること。
          # 書き込み系の git（commit / push / reset 等）はレビューには不要なので入れない。
          #
          # 【読み取り系 git は必須】アクション自身の組み込みプロンプトが差分の取得手段を
          # 指示している（`git diff origin/main...HEAD` / `git log origin/main..HEAD` /
          # `git status`）。許可しないと差分の内容と無関係に**毎回必ず拒否が出る**
          # （planning 側で同じ欠落により全 PR の CI が赤くなった。planning#146）。
          #
          # 【整形パイプと submodule 確認（planning#155）】拒否の実測から 2 つの穴が判った。
          #   - `cat` / `head` / `tail` が 1 つも無かった。パイプは**各コマンドが個別に判定される**
          #     ため、`node scripts/x.js | tail -5` は先頭が許可済みでも tail で拒否される。
          #     報告に出るのは先頭コマンド名なので、原因が判りにくい形で毎回落ちる。
          #     実装用には `cat` があり、レビュー用にだけ無いのも非対称であった。
          #   - `git -C planning ls-tree` は許可済みなのに、直下の `git ls-tree` と
          #     `git submodule status` が無かった。submodule の pin を確認する最も自然な手段であり、
          #     キット同期 PR のレビューでは毎回要る。いずれも読み取り専用である。
          # `git submodule` を丸ごと許可しないこと（前方一致で `update` / `add` まで通る）。
          # なお `VAR=1 cmd` 形（環境変数の前置き）は**許可リストでは解決できない**。先頭トークンが
          # `VAR=1` になり前方一致しないためである。`Bash(env:*)` を許すと任意コマンドが通るので
          # 危険であり、プロンプト側で「実行できない。未検証と明記せよ」と指示してある。
          #
          # 【前方一致の落とし穴】Bash の許可は**コマンド文字列の前方一致**である。したがって
          # `Bash(git log:*)` を許可しても `git -C planning log` には当たらない。planning を
          # submodule 参照する構成では、pin の進み方・差分・「変更が無いこと」といった
          # **履歴に関する主張だけ検証できない**状態になる（ファイル内容は Read/Grep で読める）。
          # そのため読み取り専用サブコマンドを個別に列挙してある。
          # `Bash(git -C:*)` と一括で許可してはならない（前方一致で `git -C planning push` /
          # `commit` / `reset` まで通り、書き込み系を外した設計が崩れる）。
          # 【暫定デルタ・issue 番号の修飾】以下のコメント中の計画リポ issue 参照は、キットでは
          # 裸の `#NNN` で書かれているが本リポでは `planning#NNN` へ修飾してある。planning#146 / planning#149 / planning#155 / planning#160 / planning#163 / planning#168
          # は**同じ番号の無関係な PR / issue が本リポジトリにも実在する**ため、裸で書くとそちらへ
          # 自動リンクしてしまう（`.claude/rules/traceability.md`「クロスリポジトリの issue / PR
          # 番号の修飾」）。キット側の是正を環流したら本デルタは撤去する。
          #
          # 【置換点】`git -C` は **`.gitmodules` にあるパスごと**に 4 サブコマンド
          # （log / show / diff / ls-tree）を列挙する（planning#163）。submodule が 1 つなら
          # `planning` の 4 エントリを書き換えるだけでよいが、複数ある構成では**書き換えではなく
          # パスごとの追加**が要る。入れ子の submodule も別パスとして列挙が要る
          # （ワークフローは `git submodule update --init --recursive` で入れ子まで populate する
          # ため、読める範囲と許可の範囲が食い違う。前方一致のため
          # `Bash(git -C src/foo log:*)` は `git -C src/foo/planning log` には**当たらない**）。
          #
          # 【grep / sort は rg があっても必須（planning#163）】AI は `git show <ref>:<path> | grep -n …`
          # のように**前段が git のときは自然に `grep` を選ぶ**。件数の集約に `sort` を使うのも同様。
          # パイプは各コマンドが個別判定されるため、後段の `grep` が未許可だと鎖全体が実行されず
          # 前段の結果も得られない。planning#155 の cat/head/tail、planning#160 の cmp/diff に続く 3 度目の同型で
          # あり、以後この種の非対称は check-ai-workflow-config.js が ERROR で検出する。
          #
          # 【実走の周辺権限（planning#168）】プロンプトが「PR の主張は自分で実走して確認せよ」と
          # 求める以上、実走に必然的に伴う周辺操作も許可する（許可しないと個別ツール名の後追い
          # 追加では追いつかない設計上の非対称になる）。
          #   - `Bash(which:*)` — 読み取りのみ。`which dotnet` で SDK の在否を確認する。
          #   - `Bash(dotnet --version)` / `Bash(dotnet --info)` — **引数を固定した形**で足す。
          #     裸の `Bash(dotnet:*)` は `dotnet nuget push` 等まで通すため不可（スタック別の
          #     可変部分。他スタックでは `Bash(node --version)` 等に置き換える）。
          #   - `mcp__github__list_workflow_runs` / `mcp__github__actions_list` — CI 結果の参照は
          #     レビューの主業務である。名前はサーバの版に依存するため**新旧を併記**する。
          # `rm` は**足さない**。生成物（TestResults 等）の後片付けはレビューの責務ではなく、
          # プロンプト側で「消さなくてよい」と明示して使わせない方向で塞ぐ。シェル構文
          # （`for` / リダイレクト / `$(…)` / 環境変数の前置き）も許可リストで表現できないため、
          # 同じくプロンプト側で作業手順を狭める。
          #
          # 【GitHub MCP のツール名は**サーバの版に依存する**（planning#163・MSP 実測）】
          # claude-code-action v1 は github-mcp-server を **v0.17.1** に pin しており、この版に
          # 在るのは `get_issue` / `get_pull_request` / `list_sub_issues`。統合名 `issue_read` /
          # `pull_request_read` / `pull_request_review_write` は**この版には存在しない**
          # （統合名は v1.x 系で導入）。存在しないツールは AI へ提示されないため拒否も出ず、
          # 当たらないエントリのまま気付けない。よって**新旧の両方を列挙**し、アクションが
          # サーバを更新しても壊れないようにする。
          #
          # 【記法・最重要】claude_args は**空白区切りで argv へトークン化**される。
          # したがって `--allowedTools Bash(dotnet test:*)` のように 1 ツール 1 行で書くと、
          # 空白を含む指定が `Bash(dotnet` と `test:*)` に割れて**すべて無効**になる。
          # 正しい記法は公式ドキュメントどおり「二重引用符でくくった 1 引数・カンマ区切り」。
          #   誤: --allowedTools Bash(gh issue create:*)
          #   正: --allowedTools "Read,Bash(gh issue create:*)"
          # 検証方法: ジョブログの `SDK options:` にある allowedTools 配列を目視する。
          # `"Bash(gh", "issue", "create:*)"` のように割れていたら記法が誤っている。
          #
          # 末尾のビルド/テスト系（node / dotnet）が**スタック別**の可変部分である。
          # claude-coding.example.yml の対応箇所と同じ内容に保つこと（既定は C#/.NET）。
          # 他スタック例: Bash(npm run:*) / Bash(npx vitest:*) / Bash(pytest:*) / Bash(go test:*)
          claude_args: |
            --model ${{ steps.model.outputs.model }}
            --allowedTools "Read,Grep,Glob,Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git status:*),Bash(git ls-tree:*),Bash(git submodule status:*),Bash(git fetch:*),Bash(git -C planning log:*),Bash(git -C planning show:*),Bash(git -C planning diff:*),Bash(git -C planning ls-tree:*),Bash(git -C src/ai-stock-trading log:*),Bash(git -C src/ai-stock-trading show:*),Bash(git -C src/ai-stock-trading diff:*),Bash(git -C src/ai-stock-trading ls-tree:*),Bash(git -C src/ai-stock-trading/planning log:*),Bash(git -C src/ai-stock-trading/planning show:*),Bash(git -C src/ai-stock-trading/planning diff:*),Bash(git -C src/ai-stock-trading/planning ls-tree:*),Bash(ls:*),Bash(rg:*),Bash(grep:*),Bash(sort:*),Bash(cat:*),Bash(head:*),Bash(tail:*),Bash(cmp:*),Bash(diff:*),Bash(echo:*),Bash(which:*),Bash(gh issue create:*),Bash(gh issue view:*),Bash(gh pr view:*),Bash(gh run list:*),mcp__github__pull_request_read,mcp__github__get_file_contents,mcp__github__issue_read,mcp__github__get_issue,mcp__github__get_pull_request,mcp__github__list_sub_issues,mcp__github__list_workflow_runs,mcp__github__actions_list,mcp__github__pull_request_review_write,mcp__github__add_comment_to_pending_review,mcp__github__add_issue_comment,mcp__github__push_files,Bash(node:*),Bash(dotnet restore:*),Bash(dotnet build:*),Bash(dotnet test:*),Bash(dotnet format:*),Bash(dotnet --version),Bash(dotnet --info)"
          prompt: |
            このリポジトリは、上流工程リポジトリ project-planning の計画書を実装する作業リポジトリである。
            CLAUDE.md と AGENTS.md の方針に従い、この PR を以下の観点でレビューし、
            指摘を「重大 / 推奨 / 軽微」に分類してコメントせよ。

            【実行制約・最重要】
            - このレビューは必ず単一セッション内で完結させること。サブエージェント（Task ツールに
              よる spawn。`adr-guardian` / `traceability-auditor` / `general-purpose` などの
              `.claude/agents/` 定義の起動を含む）を一切使用してはならない。CI 環境ではサブ
              エージェントの起動が完了せず停止（ハング）し、レビュー本文が投稿されないまま
              ジョブが終わる不具合が発生するためである。
            - 「ADR 制約チェック」「トレーサビリティ監査」を含む全観点は、サブエージェントに委譲
              せず、このセッション内で自分自身が Read / Bash(gh) 等の直接ツールで実施すること。
            - レビューの最後に、下記フォーマットのサマリコメントを必ず自分で投稿してから終了する
              こと。サブエージェントの結果待ちで停止したり、監査を委譲したまま終了してはならない。

            【使える Bash コマンドの一覧（正の一覧）・最重要】
            このレビューで実行できる Bash コマンドは**次で全部**である。**一覧に無いコマンドは
            必ず拒否される**ので、試さずに「未検証（許可されていない）」と書くこと。
            以下は本ワークフローの --allowedTools の写しであり、実装用ワークフロー
            （claude-coding.yml）とは中身が違う。**実装用の記憶で判断しないこと。**
            - **git（読み取りのみ）**: `git diff` / `git log` / `git show` / `git status` /
              `git ls-tree` / `git submodule status` / `git fetch`。submodule 変種として
              `git -C planning` と `git -C src/ai-stock-trading`（および同 `/planning`）の
              `log` / `show` / `diff` / `ls-tree` も使える。
              **書き込み系の git（`add` / `commit` / `push` / `switch` / `checkout` / `branch`）は
              許可されていない**（レビューは読むだけである）。
            - **閲覧・検索**: `ls` / `rg` / `grep` / `sort` / `cat` / `head` / `tail` / `cmp` /
              `diff` / `echo` / `which`。**`find` は許可されていない**（ファイル探索は Glob か
              `rg --files` か `ls` で行う）。
            - **gh**: `gh issue create` / `gh issue view` / `gh pr view` / `gh run list` の
              **この 4 形だけ**である。他の `gh`（`gh auth status` / `gh api` / `gh run view` 等）は
              すべて拒否される。
            - **実行系**: `node` / `dotnet restore` / `dotnet build` / `dotnet test` /
              `dotnet format` / `dotnet --version` / `dotnet --info`。
            - Bash 以外では Read / Grep / Glob と GitHub MCP ツールが使える。
            よくある誤りと正しい手順:
            - **`python3` は許可されていない。** YAML / JSON の構文確認を `python3 -c` で
              やろうとしないこと。**構文を見るだけなら Read で読む**のが最短であり、機械的な
              確認が要るなら許可済みの `node` で行う（YAML パーサはこのワークスペースに
              用意されていない前提で考える）。
            - **`gh auth status` は不要であり、許可もされていない。** 認証は環境側で構成済みである。
              GitHub の情報は GitHub MCP ツールで取ること。
            - `curl` / `wget` / `python3` / `pip` / `jq` / `sed` / `awk` / `wc` / `xargs` / `env` /
              `chmod` / `rm` / `mv` / `cp` / `touch` / `tee` も**一覧に無いので拒否される**。
            - **件数を数えるときは `grep -c` / `rg -c`（総マッチ数なら `rg --count-matches`）を
              単体で使う。** `… | wc -l` や `… | awk` によるパイプ集計は `wc` / `awk` が
              一覧に無いため**必ず拒否され、鎖全体が実行されない**（前段の結果も得られない）。

            【検証の誠実性・最重要】
            実運用で、レビューが**自分が実行できなかった検証を「実測した」として ✅ で報告した**
            事例がある（権限拒否 12 件が発生していたが、本文に言及が 1 行も無かった）。
            読み手にはこれを見分ける手段が無い。以下を厳守すること。
            - 「実測」「確認済み」「✅」と書けるのは、**このセッション内で実際にコマンドを実行し、
              その出力を自分の目で見た項目だけ**である。
            - 実行できなかった項目を、推測・PR 本文の引き写し・「そうなっているはず」で
              埋めてはならない。**「未検証（理由）」と明記する**こと。未検証と書くことは減点ではない。
              嘘の ✅ だけが問題である。
            - **次は原理的に実行できない。試みる必要はなく、必要なら未検証と書くこと**:
              - 環境変数を前置きする形（`VAR=1 cmd` / `export VAR=1`）。ツール許可はコマンド文字列の
                前方一致で判定されるため、先頭が `VAR=1` になるこの形は**必ず拒否される**。
                （例: `STRICT_AI_WORKFLOW_CONFIG=1 node …` は実行できない）
                Node のスクリプトに環境変数が要るときは**`node` の 1 コマンドに閉じた形**を使う
                （先頭が `node` になるため許可される）。ただし**形は 2 つあり、対象スクリプトの
                作りで使い分ける**。取り違えると「検査していないのに成功に見える」ため注意すること。
                - `require` 形（`node -e "process.env.X='1'; require('./scripts/foo.js');"`）が
                  通用するのは、**`require.main === module` ガードを持たないスクリプトだけ**である。
                  ガードの有無はスクリプトごとに異なるため、**使う前に対象スクリプトの末尾を
                  Read してガードの有無を自分で確認すること**。
                - **ガード付きスクリプトへ `require` 形を使ってはならない。** `main` が呼ばれず、
                  **出力ゼロのまま exit 0 になる**（何も検査していないのに成功に見える）。この場合は
                  **子プロセス形**を使うこと（終了コードも伝播する）:
                  `node -e "const r=require('child_process').spawnSync('node',['scripts/foo.js'],{env:Object.assign({},process.env,{X:'1'}),stdio:'inherit'});process.exit(r.status===null?1:r.status);"`
                - どちらの形でも、**出力が 1 行も出なかったときは「実測した」と書かない**。
                  検査が走っていない可能性を疑い、子プロセス形で取り直すこと。
              - **単独の変数代入**（`VAR="…"` のように、値を変数へ置くだけのコマンド）。これも
                先頭トークンが `VAR=…` になるため、上と同じ前方一致判定で**必ず拒否される**。
                値を変数へ置いて後段で使い回す作法は採らず、必要な文字列は各コマンドへ直接書くこと。
              - **ファイルを書き換える検証**（変異テスト・設定を壊して再実行する類）。レビュー用の
                ツールに書き込み手段は無く、これは設計どおりである。PR 本文がそうした検証結果を
                主張していても、**追試はできない**ので「未検証（書き込み不可）」と書く。
              - **シェルのループ・複合形**（`for` / `while` / `if … then … fi`）。先頭トークンが
                `for` 等になるため許可リストで表現できず、必ず拒否される。複数ファイルを調べる
                ときは**1 ファイルずつ個別のコマンドで**実行すること。ビルド・テストを複数
                プロジェクトへ回すときも `for` を組まず、**`src/<unit>/backend/backend.slnx`
                単位の 1 コマンド**（例: `dotnet test src/platform/backend/backend.slnx`）で
                実行すること。フロントエンドも同様に `src` のワークスペース単位で 1 コマンドにする。
            - **パイプは各コマンドが個別に許可判定される。** `git show X | cmp - Y` は `cmp` が
              未許可なら拒否される（前段が許可済みでも通らない）。バイト一致の確認には
              `cmp` / `diff` を許可してあるので、**2 段まで**ならそのまま使ってよい。
            - **3 段以上のパイプ連鎖を組まないこと。** `git show | grep | diff` のような 3 段形は、
              **各コマンドが個別には許可済みでも**拒否された実測がある（MSP 実測・原因未特定）。
              比較は `git show <ref>:<path> | diff - <path>` の**2 段**に収め、絞り込みが要るときは
              段を増やさず、**コマンドを分けて 2 回実行する**こと。
            - **CI の結果を読む手段には粒度の制限がある**（Bash は前方一致、MCP はツール名単位）。
              - `gh run` で許可されているのは **`gh run list` のみ**である。`gh run view` /
                `gh run view --log` 等は前方一致しないため拒否される。
              - GitHub MCP の Actions 系で許可されているのは
                **`mcp__github__list_workflow_runs` と `mcp__github__actions_list` のみ**である。
                `get_workflow_run` / `list_workflow_jobs` / `get_job_logs` は許可されていない。
              - よって**ジョブ単位のログを取得する手段は無い**。実行の一覧と結論までしか読めないため、
                それ以上の裏付けが要る主張は「未検証（ジョブログの取得手段が無い）」と書くこと。
              - なお `permission_denials_count`（このレビュー自身の拒否件数）は、ジョブ末尾の
                `Check permission denials` ステップが**権威**である。レビュー側で実行ログを
                取り直して再検証する必要は無い。
            - **出力をファイルへリダイレクトしない**（`> /tmp/a` に加え **`> /dev/null` も**）。
              レビュー用は書き込み手段を持たないため、宛先に関わらず拒否される。
              出力はそのまま読むこと（捨てたい出力は最初から生成しない）。
            - **プロセス置換 `<(…)`・コマンド置換 `$(…)` も実行できない**。ツール許可はコマンド
              文字列を解析して判定するため、これらの構文は**中のコマンドが許可済みでも**拒否される。
              2 つの版を比べるときは `diff <(git show A) <(git show B)` ではなく、
              `git show <ref>:<path> | diff - <path>` の形（パイプ + 標準入力）を使う。
            - **長い連鎖のワンライナーを作らない。** `… | head -20 | echo "exit:$?"` のように
              `|` `&&` でつなぐほど、鎖のどこかに未許可コマンドが混ざる確率が上がり、拒否されると
              **鎖全体が実行されない**（前段の結果も得られない）。1 コマンドずつ実行すること。
              なお `$?` はパイプの後では直前の 1 コマンドの結果しか表さないため、判定にも使えない。
            - レビュー本文の末尾に **「実行できなかったこと」節を必ず設ける**。拒否された、または
              実行を諦めたツール／コマンドと、**それによって裏付けが取れていない主張**を列挙する。
              何も無かった場合は「なし」と 1 行書く（節自体を省略しない）。

            【出力必須ルール】
            - 指摘が 0 件であっても、必ず以下のサマリ形式でコメントを出力すること。
            - 無言終了・出力なし終了は禁止。レビューが完了したら必ずサマリを出力せよ。

            出力フォーマット（Markdown）:
            ## AI コードレビュー結果

            ### 🔴 重大
            - （指摘なし）または具体的な指摘内容

            ### 🟡 推奨
            - （指摘なし）または具体的な指摘内容

            ### 🟢 軽微
            - （指摘なし）または具体的な指摘内容

            ### 🔍 実行できなかったこと
            - なし / または「`<コマンド>` は権限拒否（このため <どの主張> は未検証）」の形で列挙

            ---
            *レビュー観点: トレーサビリティ / 受け入れ基準 / ADR 制約 / 品質 / AI 固有リスク*

            レビュー観点の詳細:
            1. トレーサビリティ: PR 本文・コミット・コードに起点 ID（FR-xx / UC-xx / SC-xx）が
               残されているか。実装が対象の計画書（要求・ユースケース・画面）に忠実か。
            2. 受け入れ基準: 計画書の受け入れ基準を満たし、基本/代替/例外フローを網羅しているか。
               対応するテストがあるか。
            3. ADR 制約: 関連 ADR（07_adr/ の Accepted）で確定した制約に違反していないか。
            4. 一般的な品質: 不具合・抜け漏れがないか。
            5. AI 実装に特有のリスク（重点）:
               - 過剰実装（計画外の機能追加・不要な抽象化・起こり得ないケースへの防御）。
               - 存在しない API/ライブラリ/設定の使用（幻覚）。
               - エッジケース・例外フローの取りこぼし。
               - 仕様の表面的充足（テストを通すためだけの空実装・空テスト）。
               - 秘密情報のハードコードや不適切な扱い。

            【計画書の場所】この順で探すこと:
            1. `planning/projects/<name>/` — **CI ではこちら**。checkout 直後のステップで
               submodule を populate 済みであり、ワークスペース内なので Read が届く。
            2. `../project-planning/projects/<name>/` — 隣接クローン運用のローカル環境のみ。
               CI ではワークスペース外のため Read が届かない。
            **1 を試さずに「計画リポジトリは参照不可」と結論してはならない。**
            両方とも存在しない場合に限り、その旨を明記したうえで PR 内の情報のみでレビューする。

            【他リポジトリ・issue 参照の扱い】
            - GitHub の issue / PR を読む MCP ツール名は**サーバの版に依存する**。CI が固定する
              github-mcp-server v0.17.1 では `mcp__github__get_issue` /
              `mcp__github__get_pull_request` であり、統合名 `mcp__github__issue_read` /
              `mcp__github__pull_request_read`（v1.x 系で導入）は**この版には存在しない**。
              両方を許可してあるので、提示されている側を使うこと。提示されていない名前を試して
              「権限がない」と結論しないこと（存在しないツールは権限の問題ではない）。
            - **子 issue の一覧は `mcp__github__list_sub_issues` で取る**（v0.17.1 に統合名
              `issue_read` は存在しない。統合名は将来の版のために併記して許可してある）。
            - `github_token` は本リポジトリにスコープされるため、**他リポジトリの issue / PR は
              参照できない**。これは設定不備ではないので「未検証」と書かず、「他リポジトリの
              参照は本セッションの対象外」と明記して先へ進むこと。

            【検証の実行】
            ビルド・テスト・フォーマットの実行は許可されている。PR 本文が「テストが通る」と
            主張している場合は、可能な限り**自分で実走して確認**し、結果を報告に含めること。
            SDK の在否は `dotnet --version` / `dotnet --info` / `which dotnet` で確認できる
            （いずれも許可済み。`dotnet` の他のサブコマンドは `restore` / `build` / `test` /
            `format` のみ許可されている）。
            **実走で生成された成果物（`dotnet test` の `TestResults/` やカバレッジ XML）は
            削除しないこと。** ワークスペースはジョブ終了で破棄される使い捨てであり、後片付けは
            レビューの責務ではない（`rm` は許可されておらず、試みれば拒否として記録されるだけである）。
            PR の CI ジョブの結果は `mcp__github__list_workflow_runs`（新しいサーバ版では
            `mcp__github__actions_list` の `list_workflow_runs` メソッド）と `Bash(gh run list:*)` で
            参照できる。**ローカル再現を始める前に、まず CI の結果を見ること。**
            計画書 submodule の**履歴**（pin の進み方・その差分・「変更が無いこと」）についても
            `git -C planning log / show / diff / ls-tree` で検証できる。PR が submodule の pin に
            言及している場合は、その主張を実際に確かめること。

            【.claude / CLAUDE.md を変更する PR での注意】
            アクションはセキュリティ上、`.claude` / `CLAUDE.md` / `.mcp.json` 等を統合ブランチ版へ
            復元し、PR 版を `.claude-pr/` へ退避する（PR head は untrusted 扱いのため）。
            そのため作業ツリーに「直近コミットを打ち消す未コミット差分」が見えるのは**正常**であり、
            異常として報告しないこと。これらのファイルをレビューするときは `.claude-pr/` または
            `git show HEAD:<path>` を参照すること。

      # 権限拒否の可視化（安全弁）。
      #
      # claude-code-action は、AI がツールを 1 つも実行できなくても
      # `"subtype": "success", "is_error": false` で終わる。ジョブは緑になり、PR には
      # 進行中コメントだけが残る。「CI が緑 ＝ レビューが通った」ではなく
      # 「エラー無く終了した」に過ぎない状態であり、レビュー未実施が誰にも見えない。
      # CI には承認する人間が居ないため、権限拒否は「待たされた」ではなく
      # **「その作業は永久に実行されない」**を意味する。ここで止める。
      #
      # if: always() が必須である（上の step が失敗した場合こそ内訳を知りたい）。
      # 実行ログを読めない構成では warn を出して exit 0（fail-open）。
      - name: Check permission denials
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/check-permission-denials.js "$EXECUTION_FILE"

      # AI レビューの判定投稿チェック（キット配布・planning#333 / 本リポ採用は #516 の前段の pin 更新・[[IADR-0198]]）。
      #
      # claude-code-action は AI が判定（🔴 / 🟡 / 🟢）を投稿しないままターンを終えても
      # success で終わる。ジョブは緑になり「レビュー済み・指摘なし」と読まれるが、
      # **実際には何も判定されていない**。上の check-permission-denials.js では捕まらない
      # ——あちらは「ツールを 1 つも実行できなかった」形を見る。ここはツールが動いており
      # **最後の投稿だけが無い**形を見る。2 本セットで配布される。
      - name: Check review verdict
        if: always()
        env:
          EXECUTION_FILE: ${{ steps.claude.outputs.execution_file }}
        run: node scripts/check-review-verdict.js "$EXECUTION_FILE"
