# Dependabot: 依存関係の自動更新（セキュリティ修正を含む）。
# github-actions は技術非依存のため常時有効。使用言語のエコシステムを有効化する。

version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # NFR / #2469: CodeQL は同じ workflow 内の codeql-action（init / analyze）が同じ版であることを要求する。
    # サブアクションごとの別 PR では、どちらも単独で CI が赤になるため、1 本の PR にまとめて上げる。
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action*"

  # NFR: submodule の pin 自動更新（gitlink を追跡先の先端へ前進させる更新 PR を生成する）。
  # 既定は自動マージしない（人手レビュー必須）。root .gitmodules の全 submodule が対象
  # （src/ai-stock-trading）。本リポジトリは planning に依存しない（ADR-0048 決定 2）ため、
  # private submodule 用のトークン付き registries は不要。
  # 特定 submodule だけ除外するなら ignore の dependency-name にそのパスを指定する。
  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # NFR, 非公開の指摘（MSP） / IADR-0581: 使用スタックのエコシステムを有効化する（多層防御。依存の更新とセキュリティ修正の取り込み）。
  # - nuget: src/Directory.Packages.props（Central Package Management）を単一情報源として更新する。
  # - npm:   src/ の pnpm workspace（src/pnpm-lock.yaml）を更新する。
  # 既定は自動マージしない（人手レビュー必須）。同時に開く PR は各 5 本まで。
  # github-actions は SHA 固定の行（`@<sha> # vX.Y.Z`）の SHA と注記を対で更新する。
  - package-ecosystem: "nuget"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  - package-ecosystem: "npm"
    directory: "/src"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5

  # NFR, IADR-0708: クラウドで配備する第三者のイメージ（deploy/cloud の k8s マニフェスト・helm values の `image:`。
  # `<repo>:<tag>@sha256:<digest>` で固定）の更新の通知。Dependabot の docker は k8s マニフェストの `image:` を読む。
  # - 同じイメージは deploy/local・deploy/docker-compose.yml にも在り、片側だけの更新は scripts/check-image-digests.js の
  #   [digest-mismatch] が止める。残りは手で揃える（docs/operations/third-party-image-scan-runbook.md §更新の PR を仕上げる）。
  # - 既知の脆弱性の走査は .github/workflows/third-party-image-scan.yml（週次）。
  # 既定は自動マージしない（人手レビュー必須）。
  # NFR, IADR-0711（MSP#2523 を閉じた理由の是正）: 壊れたときに切り分けて戻せる形にする。
  # - 大版（semver-major）は出させない。大版の移行は手順書 §大版の移行で、検証の項目を揃えてから人が上げる。
  # - 0.x の製品（collector・Alertmanager）は小版でも互換が崩れるので小版も出させない。ESO は helm chart
  #   （scripts/lib/pinned-artifacts.sh）と CRD を対で上げるので小版も出させない。
  # - collector は全部の更新を止める。上流は `<版>-386`（i386）のように数字だけのアーキテクチャ接尾辞の tag を出し、
  #   Dependabot は `-386` を版の続きと読んで選んだ（MSP#2523）。docker では versioning-strategy が使えず、
  #   ignore の versions は Bundler の版の書式（接尾辞の型は書けない）なので、名指しで止めるのが文書で確かめられる唯一の形。
  # - dependency-name は registry の host を除いた名前（MSP#2523 の本文の表記: `external-secrets/external-secrets`・`keycloak/keycloak`）。
  # - cooldown は書かない。MSP#2523 で Dependabot は「registry に公開日が無いので cooldown を当てられない」と警告した（効かない統制を書かない）。
  # - 1 イメージ 1 本の PR（group-by: dependency-name）。修正版と小版は別の group（PR の題で区別する）。
  - package-ecosystem: "docker"
    directories:
      - "/deploy/cloud/**"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "otel/opentelemetry-collector-contrib"
      - dependency-name: "prom/alertmanager"
        update-types: ["version-update:semver-minor"]
      - dependency-name: "external-secrets/external-secrets"
        update-types: ["version-update:semver-minor"]
    groups:
      cloud-image-patch:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "patch"
      cloud-image-minor:
        applies-to: version-updates
        group-by: dependency-name
        patterns:
          - "*"
        update-types:
          - "minor"
