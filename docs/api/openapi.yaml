openapi: "3.1.0"
info:
  title: Platform API
  description: |
    社内ナレッジ活用プラットフォーム — BFF + マイクロサービス統合仕様書
    FR-01, FR-03, FR-04, FR-05, FR-06, FR-07, FR-08, FR-09, FR-10, FR-11, FR-13, FR-22,
    UC-01, UC-02, UC-05, UC-11
  version: "0.1.0"
  contact:
    name: Platform Team
servers:
  - url: http://localhost:5000
    description: BFF (ローカル開発)
  - url: http://localhost:5001
    description: DocumentService (直接)
  - url: http://localhost:5003
    description: RetrievalService (直接)
  - url: http://localhost:5004
    description: AiAnalysisService (直接)
  - url: http://localhost:5005
    description: AuthorizationService (直接)
  - url: http://localhost:5007
    description: "LlmGateway — IADR-0017: 内部 API。通常は host 非公開でサービス間呼び出し専用（compose では expose のみ）。この URL は個別に dotnet run した場合のみ到達可能"

tags:
  - name: Analysis
    description: "FR-04, FR-07, UC-01, UC-02: AI 質問回答 (RAG) / 指定データ範囲の分析・比較・抽出"
  - name: Search
    description: "FR-03, UC-01: ベクトル検索"
  - name: Documents
    description: "FR-06, UC-03: ドキュメント管理"
  - name: DataSources
    description: "FR-01, UC-04: データソース管理"
  - name: Conversion
    description: "FR-12, UC-06, SC-07, IADR-0042: 変換ジョブの状況照会と人手補正（再変換）。IADR-0017: 内部 API（BFF 経由で到達）"
  - name: Authorization
    description: "FR-05, ADR-0004: ABAC 認可"
  - name: Wiki
    description: "FR-13: Wiki ページ"
  - name: Feedback
    description: "FR-08, UC-01: 回答へのフィードバック（👍/👎・コメント）収集。IADR-0017: 内部 API（BFF 経由で到達）"
  - name: Dashboard
    description: "FR-10, UC-05: 利用状況・検索傾向・回答品質の可視化。IADR-0017: 内部 API（BFF 経由で到達）"
  - name: Completions
    description: "FR-04, FR-11, ADR-0010: LLM テキスト生成ゲートウェイ。機密区分・用途で呼び出し先を切替。IADR-0017: サービス間呼び出し専用"
  - name: Embeddings
    description: "FR-02, FR-05, ADR-0016, ADR-0017, IADR-0025: 埋め込み生成ゲートウェイ。機密区分でティア（セルフホスト/外部）を切替、高機密は fail-closed。IADR-0017: サービス間呼び出し専用"
  - name: Config
    description: "FR-15, SC-11, ADR-0018, IADR-0029/IADR-0030: 構成情報 API（読み取り専用）。実効構成とドリフトを管理者・運用者（ConfigViewer ポリシー）へ返す"
  - name: Auth
    description: "NFR, SC-16, ADR-0032, IADR-0251: BFF セッション（Token Handler）。トークンはブラウザへ出さず BFF 側の Redis セッションにのみ保持する"
  - name: McpClients
    description: "FR-16, UC-09, SC-12, ADR-0024: MCP クライアント登録管理（管理者限定）。登録・無効化・無人アカウントの ABAC 属性割当と、実効ツール一覧（許可リストの参照）。**公開ツールの変更口は置かない** —— 公開範囲は Git 経由の構成変更で行う（GitOps）"
  - name: Notifications
    description: "FR-22, UC-11, ADR-0037, ADR-0045, IADR-0215: 利用者本人へのアプリ内通知。**本文は件数と期限のみ**で、資料のタイトル・本文を含めない（スキーマに自由文の項目を置かない）"
  - name: UserAdmin
    description: "FR-05, FR-09, UC-05, SC-17, ADR-0026: 利用者アカウント管理（管理者限定）。ロール割当・ABAC 属性割当・無効化（全セッション失効）。**新規作成の口は置かない** —— アカウントは人事システム連携で自動プロビジョニングされる"

paths:
  # ── BFF ──────────────────────────────────────────
  /bff/auth/login:
    get:
      x-roles: []
      tags: [Auth]
      summary: "NFR, ADR-0032: ログイン開始（BFF セッション）"
      description: |
        認可サーバへ Authorization Code + PKCE のフローを開始させる。
        **本端点は意図的に無認証である**（ログインするために認証を要求できない）。
        トークンはブラウザへ出さず、BFF 側のセッション（Redis）にのみ保持する。
      operationId: bff-auth-login
      parameters:
        - name: returnUrl
          in: query
          required: false
          schema: { type: string }
          description: "ログイン後の戻り先。**自サイト内のパスに限る**（オープンリダイレクト防止）"
      responses:
        "302": { description: 認可サーバへのリダイレクト }
  /bff/auth/logout:
    get:
      x-roles: []
      tags: [Auth]
      summary: "NFR, ADR-0032: ログアウト（ブラウザと認可サーバの双方）"
      description: |
        トップレベルナビゲーションで呼ぶ（認可サーバの end-session への往復は fetch では完結しない）。
        CSRF（強制ログアウト）対策として、**セッションの sid と一致する `sid` クエリを要求する**。
        sid は `/bff/auth/me` の `logoutUrl` だけが配る（攻撃者は HttpOnly セッションの sid を知り得ない）。
      operationId: bff-auth-logout
      parameters:
        - name: sid
          in: query
          required: true
          schema: { type: string }
          description: "セッションの sid。`/bff/auth/me` の `logoutUrl` が持つ値をそのまま使う"
        - name: returnUrl
          in: query
          required: false
          schema: { type: string }
          description: "ログアウト後の戻り先。**自サイト内のパスに限る**"
      responses:
        "302": { description: 認可サーバのログアウト経路へのリダイレクト }
        "400": { description: sid 不一致・欠落（ログアウトは起きない） }
        "401": { description: 未認証 }
  /bff/auth/me:
    get:
      x-roles: []
      tags: [Auth]
      summary: "SC-16, ADR-0032: 現在の身元（**トークンは返さない**）"
      description: |
        SPA が「誰としてログインしているか」を知る唯一の口。
        **アクセストークン・リフレッシュトークンは一切含めない**（含めた時点で
        ADR-0032 の「ブラウザにトークンを出さない」が崩れる）。
      operationId: bff-auth-me
      responses:
        "200":
          description: 現在の身元
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BffIdentityDto"
        "401": { description: 未認証 }
  /bff/search:
    post:
      x-roles: []
      tags: [Search]
      summary: "FR-03: ベクトル検索（BFF 集約）"
      description: |
        Issue #118 監査: 実装パスは `/bff/search`（旧記載 `/search` は誤り）。
        ABAC 許可スコープをサーバ側で解決（AuthorizationService・FR-05）し、解決済みスコープで
        RetrievalService の `/search`（内部 API・IADR-0017）へ委譲する本実装（`SearchBffEndpoints`）。
        クライアント指定の Scope は信頼しない（権限昇格の防止）。deny-by-default: 許可ポリシーが無い／
        認可サービス不調／検索サービス不調は空応答へ縮退し、権限外の存在を示さない（IADR-0009 と整合）。
      operationId: bff-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"
        "401": { description: 未認証（#656） }
  /bff/attribute-values:
    post:
      x-roles: []
      tags: [Search]
      summary: "FR-04, FR-05, SC-01, SC-08: 権限内属性値の照会（BFF 集約）"
      description: |
        計画 **ADR-0043**（裁定 Q2）。SC-01 / SC-08 の対象範囲フィルタ
        「**権限内のタグ／部門／プロジェクトのみ選択可**」を満たすための候補一覧であり、
        **一般利用者が呼べる**（従前は `/bff/admin/authz` の管理者限定の辞書しか無かった）。

        **返す範囲に強い制限がある。外すと存在秘匿（ADR-0004 の 404 原則）が実質的に破れる。**

        - **辞書を丸ごと返さない**（決定 1）。返すのは「**到達できる文書に実際に付与された値**」だけ。
        - **件数を返さない**（決定 2）。「12 件だが自分の検索では 8 件」＝**見えない文書が 4 件ある**
          ことが分かるため、**件数は値集合そのものより漏洩力が強い**。
        - ABAC スコープは**サーバ側で解決**し、クライアント指定は信頼しない（権限昇格の防止）。
        - **スコープが解決できないときは空配列**（IADR-0151 決定 5）。**404 にも 403 にもしない** ——
          候補が無いことと権限が無いことを区別させない。

        実装は検索段と**同じ ABAC フィルタ**で Qdrant の facet を呼び、**件数を捨ててから**返す
        （IADR-0151 決定 1・2）。**#542 が同じ口へシステム管理者スコープを足す**（ADR-0043 決定 4）。
      operationId: bff-attribute-values
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AttributeValuesRequest"
      responses:
        "200":
          description: 権限内の属性値（**件数は含まない**）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeValuesResponse"
        "401": { description: 未認証（#656） }
  # ── SC-09, FR-09, UC-05: タグ辞書 BFF（#640）─────────
  # IADR-0152 / IADR-0153: 辞書は DocumentService（knowledge ユニット）が所有する。
  # **読み取りは platform-admin / platform-operator**（裁定 Q18）、
  # **書き込み（追加・改名・削除）は platform-admin のみ**（SC-09 のアクセス制御）。
  # 後段 `/tags` にも同じ制限があり両層で効かせる（IADR-0044 の多層防御）。
  # **後段の応答は本文ごと透過する** —— 削除拒否の 409 に載る `usageCount` を画面が表示するため
  # （SC-09「削除前に使用件数を示す」）。BFF で数え直すと一覧と削除拒否で件数が割れる。
  /bff/tags:
    get:
      x-roles: [platform-admin, platform-operator]
      tags: [Tags]
      summary: "FR-09, SC-09: タグ辞書の一覧（値集合 ＋ 使用件数。管理者・運用者）"
      operationId: bff-tag-list
      responses:
        "200":
          description: タグ辞書（使用件数つき）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDictionaryResponse"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "502": { description: DocumentService へ到達できない }
    post:
      x-roles: [platform-admin]
      tags: [Tags]
      summary: "FR-09, SC-09: タグ辞書へ追加（管理者のみ。#640）"
      description: |
        **名前の重複は 409**（SC-09「新しい名前は既存値と重複しない」）。
        正規化後の名前で判定するため、前後の空白だけが違う 2 つは別物にならない。
      operationId: bff-tag-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTagRequest"
      responses:
        "201":
          description: 追加したタグ（使用件数は 0）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagDto"
        "400": { description: タグ名が空 }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly。運用者も不可） }
        "409": { description: 同名のタグが既に辞書にある }
        "502": { description: DocumentService へ到達できない }

  /bff/tags/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    put:
      x-roles: [platform-admin]
      tags: [Tags]
      summary: "FR-09, SC-09: タグ辞書の改名（管理者のみ。#640）"
      description: |
        **文書は 1 件も書き換えない** —— 正本が識別子を参照しているので追随は表示の解決だけで起こる
        （IADR-0153 決定 1）。**版も増えない**（改名は文書の内容変更ではない。同 決定 3）。
        射影（Qdrant / Wiki.js）は表示名を焼き込んだ複写なので `DocumentUpdated` を再発行して作り直す。
        応答の `republishedDocuments` は**その再発行件数**であり、使用件数と同じ値になる。
        **反映は非同期なので、この件数が無いと「0 件だった」と「まだ届いていない」を区別できない。**
      operationId: bff-tag-rename
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RenameTagRequest"
      responses:
        "200":
          description: 改名後のタグと再発行件数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RenameTagResponse"
        "400": { description: タグ名が空 }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly。運用者も不可） }
        "404": { description: 見つからない }
        "409": { description: 同名のタグが既に辞書にある（自分自身は除く） }
        "502": { description: DocumentService へ到達できない }
    delete:
      x-roles: [platform-admin]
      tags: [Tags]
      summary: "FR-09, SC-09: タグ辞書から削除（管理者のみ。#640）"
      description: |
        **使用件数が 0 件のときだけ許す**（SC-09「参照が 1 件でもあるタグは削除拒否」。IADR-0153 決定 6）。
        **拒否は 409 に `usageCount` を添える** —— SC-09 が「削除前に使用件数を示す」と定めており、
        件数があれば「まず 3 件を外してから消す」と管理者が行動できる。
      operationId: bff-tag-delete
      responses:
        "204": { description: 削除した }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly。運用者も不可） }
        "404": { description: 見つからない }
        "409":
          description: 使用中のため削除できない（`usageCount` つき）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TagInUseProblem"
        "502": { description: DocumentService へ到達できない }

  /bff/analysis/ask:
    post:
      x-roles: []
      tags: [Analysis]
      summary: "FR-04, UC-01: RAG 質問回答（BFF 集約）"
      description: |
        Issue #118 監査: 実装パスは `/bff/analysis/ask`（旧記載 `/analysis/ask` は誤り。
        `/analysis/ask` は AiAnalysisService 直接の内部パス）。ABAC 権限解決のため
        Authorization ヘッダを後段へ伝播する。
      operationId: bff-analysis-ask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: AI 回答 + 出典
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswerDto"
        "401": { description: 未認証（#656） }
  /bff/analysis/analyze:
    post:
      x-roles: []
      tags: [Analysis]
      summary: "FR-07, UC-02: 指定データ範囲での分析・比較・抽出（BFF 集約）"
      description: |
        Issue #118 監査: 実装パスは `/bff/analysis/analyze`（旧記載 `/analysis/analyze` は誤り。
        `/analysis/analyze` は AiAnalysisService 直接の内部パス）。
        指定データ範囲（attributeFilters / query）は ABAC 許可スコープと交差し、権限を一切広げない
        （narrowing-only, IADR-0005）。範囲が権限外を指す場合は空回答へ縮退する。
      operationId: bff-analysis-analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisTaskRequest"
      responses:
        "200":
          description: 分析・比較・抽出の結果 + 出典
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswerDto"
        "400":
          description: instruction 未指定
        "401": { description: 未認証（#656） }
  /bff/analysis/ask/stream:
    post:
      x-roles: []
      tags: [Analysis]
      summary: "FR-04, UC-01, SC-01: RAG 質問回答の SSE ストリーミング（BFF パススルー）"
      description: |
        IADR-0037: AiAnalysisService の `/analysis/ask/stream` を `text/event-stream` のまま逐次中継する。

        **orval の生成対象外である（載せ忘れではない）。** 本パスの応答は `text/event-stream` であり、
        orval は SSE を扱えない（TanStack Query のフックは 1 回の応答を前提とする）。SPA はここだけ
        `foundation/api` の **`apiStream`** を使う（ADR-0031 / IADR-0121 決定 3 が許す 2 経路のうちの後者）。
        生成対象／対象外の一覧は docs/api/BFF_bff-surface.md を参照。

        上流不達・非 2xx でも HTTP ステータスは変えられない（既にヘッダを送出済み）。
        BFF は `event: error` の SSE イベントで中立に伝える（権限の有無を示さない。IADR-0009）。
      operationId: bff-analysis-ask-stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: |
            SSE ストリーム。後段（AiAnalysisService）が `event: citations`（出典・**先行**）→
            `event: token`（本文増分）* → `event: done`（回答 ID / モデル / トークン数）の順で送出し、
            BFF はこれをそのまま中継する。BFF は上流不達・非 2xx のときのみ `event: error` を自ら送出する。
          content:
            text/event-stream:
              schema:
                type: string
        "401": { description: 未認証（#656） }
  # ［2026-08-10 / #521］**是正済み。** 従前ここには「responses に 401 が無いのは計画と食い違う。
  # 是正は #521」という予告コメントが置かれていた。計画 FR-08（2026-08-07 確定・裁定依頼
  # planning#236 案 2）の「投稿には認証を要する（匿名投稿は許さない）」に合わせ、
  # 実装へ `RequireAuthorization()` を足し、ここに 401 を記した。
  /bff/feedback:
    post:
      # 認証は要るがロールは問わない（計画は「認証を要する」までしか定めていない）。
      x-roles: []
      tags: [Feedback]
      summary: "FR-08, UC-01: 回答へのフィードバック送信（BFF 集約）"
      description: |
        チャット画面からの 👍/👎・コメント送信を FeedbackService へ委譲する。
        送信者を後段で特定できるよう Authorization ヘッダを伝播する。
        後段の 201（新規）/ 200（更新・upsert）ステータスをそのまま透過する。
      operationId: bff-submit-feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: 既存フィードバックの更新（upsert）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "201":
          description: 新規フィードバックの作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "401": { description: 未認証（匿名投稿は許さない。FR-08 確定 2026-08-07） }

  # ［2026-08-10 / #521］**是正済み。** 従前ここには「responses に 403 が無いのは計画と食い違う。
  # 是正は #521」という予告コメントが置かれていた。計画 SC-10（`05_screens:431`）の
  # 「統計は運用者・管理者に限る」に合わせ、実装へ RequireRole を足し、ここに 401 / 403 を記した。
  /bff/feedback/stats:
    get:
      x-roles: [platform-admin, platform-operator]
      tags: [Feedback]
      summary: "FR-08: 満足率の集計取得（BFF 集約・品質可視化）"
      operationId: bff-feedback-stats
      parameters:
        - name: answerId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "指定時はその回答に絞って集計する"
      responses:
        "200":
          description: フィードバック集計
          content:
            application/json:
              schema:
