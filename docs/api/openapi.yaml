        "403":
          description: 管理系ロール以外（admin ＋ operator 以外。#544）

  # ── LlmGateway（直接・内部 API / IADR-0017）─────────
  /complete:
    post:
      tags: [Completions]
      summary: "FR-04, FR-11, ADR-0010: LLM テキスト生成"
      description: |
        AiAnalysisService が呼び出す。FR-11: 入力の機密区分（confidentiality）・用途（purpose）に応じて
        呼び出し先（ティア/エンドポイント/モデル）を越境マトリクスで判定し切り替える。
        機密区分による送信拒否・呼び出し先不調時も 500 を伝播せず、sent=false の縮退応答を 200 で返す
        （呼び出し側が出典のみ返す等の縮退へ切り替えられるようにする）。
        ADR-0025 / IADR-0104: 送信が成立した場合はモデル側の終了理由を stopReason で返す。
        `stopReason="refusal"`（モデルが拒否）は HTTP 200・sent=true・text 空で到着するため、
        呼び出し側は text の空だけを見ず stopReason を確認する。
      operationId: complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionApiRequest"
      responses:
        "200":
          description: 生成結果（送信拒否・縮退時は sent=false）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionApiResponse"

  /embed:
    post:
      tags: [Embeddings]
      summary: "FR-02, FR-05, ADR-0016/0017, IADR-0025: 埋め込み生成"
      description: |
        IngestionService（purpose=index）/ RetrievalService（purpose=query）が呼び出す。
        機密区分（confidentiality）で送信先ティアを切替: confidential/restricted はティアA
        （セルフホスト Ruri v3/768 次元）固定で外部送信しない（未構成時は fail-closed で
        embedded=false）。それ以外はティアB（Voyage voyage-3.5/1024 次元）。検索クエリ
        （purpose=query）は検索対象コレクションと次元を一致させるため既定外部経路へ固定する。
        送信拒否・不調時も 500 を伝播せず embedded=false の縮退応答を 200 で返す
        （retryable=true は一時障害で呼び出し側が再試行、false は恒久理由でスキップ）。
      operationId: embed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedApiRequest"
      responses:
        "200":
          description: 埋め込み結果（送信拒否・縮退時は embedded=false）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedApiResponse"

  /bff/graph/edge-types:
    get:
      # NFR-09: 認証のみ・ロール不問。
      # 🔴 **後段は /graph/edge-types/catalog（認証のみ・使用件数なし）であって、
      # /graph/edge-types（admin / operator 限定・使用件数つき）ではない。**
      # 後者へ向けると一般利用者が 403 になり、かつ ABAC で絞られていない集計値が漏れる。
      x-roles: []
      tags: [Graph]
      summary: "FR-17, SC-18: 辺の型カタログ（描画用）"
      description: |
        FR-17, SC-18, ADR-0033, ADR-0039: 辺の型の識別子・名前・層・対称性を返す。

        グラフ読み取りの応答が返すのは `edgeTypeId` だけなので、**辺の描き分けと型フィルタには
        このカタログが要る**（表示名は辞書側で解決する。改名に追随させるため。ADR-0033 決定 9）。

        **使用件数は含まない。** 件数は全辺を数えており ABAC で絞られていないため、
        一般利用者へ返すと権限外の辺を含む総量が漏れる。件数が要る管理用途（SC-09 / SC-10）は
        admin / operator 限定の別口が担う。
      operationId: bff-graph-edge-types
      responses:
        "200":
          description: 辺の型カタログ
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/EdgeTypeCatalogItem" }
        "403": { description: 後段が拒否した（そのまま透過する） }

  /bff/graph/{documentId}:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      # NFR-09: 認証のみ・ロール不問。**可視性はロールではなく ABAC が決める** ——
      # GraphService が JWT から解決したスコープでホップごとに判定する（ADR-0034 決定 1）。
      x-roles: []
      tags: [Graph]
      summary: "FR-17, UC-10: 起点ノード 1 件（グラフ読み取り）"
      description: |
        FR-17, UC-10, ADR-0034: 起点となる文書のノードを 1 件返す。

        **権限外・複製未到達・不存在はすべて 404 に倒す**（ADR-0034 決定 2）。
        利用者は「リンク切れ」と「権限不足」を区別できない —— これは受け入れ済みの副作用である。
        403 は返さない（403 は「権限が無いだけで存在はする」ことを漏らす）。
      operationId: bff-graph-node
      responses:
        "200":
          description: グラフ（ノード 1 件）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphView" }
        "404": { description: 権限外・不存在（区別しない） }

  /bff/graph/{documentId}/neighbors:
    parameters:
      - { name: documentId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      # クエリ引数は **操作（get）の下**へ置く。path レベルへ置くと orval が
      # 空の分解代入を含む URL 組み立てを生成し、noUnusedLocals（TS6198）で型検査が落ちる（実測）。
      parameters:
        - name: hops
          in: query
          required: false
          description: "探索の深さ。既定 2 / 上限 3（ADR-0034 決定 3）。上限超過は 400 で拒否し、黙って切り詰めない"
          schema: { type: integer, minimum: 1, maximum: 3 }
        - name: by
          in: query
          required: false
          description: |
            間引きの基準（ADR-0049 決定 4）。表示上限（ノード 200）を超えた候補集合から何を残すか。
            **未知の値・未指定は既定（distance）へ縮退する** —— 例外にしない。
          schema: { type: string, enum: [distance, updated, degree] }
        - name: types
          in: query
          required: false
          description: |
            SC-18 (#917): 辺の型フィルタ（型 ID のカンマ区切り。未指定・空 = 絞らない）。
            🔴 **絞りはサーバ側で探索の入口に適用される**（planning#446）——クライアントで
            打ち切り後に絞ると「上位 200 件のうち一致したもの」になり範囲が意図せず狭まる。
            総数（totalNodes / totalEdges）もフィルタ後の母集合で数え直される。
            GUID として読めない要素は 400（`edge_type_filter_invalid`）。**実在しない型 ID は
            エラーにならず、単に 1 本も一致しない**（型辞書は公開済みの語彙であり秘匿対象ではない）。
          schema: { type: string }
      # NFR-09: 認証のみ・ロール不問（上と同じ。可視性は ABAC が決める）。
      x-roles: []
      tags: [Graph]
      summary: "FR-17, UC-10: 近傍探索（ホップごとに権限を判定する）"
      description: |
        FR-17, UC-10, ADR-0034: 起点から関係を辿った近傍グラフを返す。

        **判定はホップごとに行い、権限外ノードは展開の前に刈る**（決定 1）。
        したがって権限外ノードが「橋」となって権限外の隣接文書が浮上することはない。
        **表示上限（ノード 200 / 辺 500）の計数は権限判定を通過した品目に対してのみ行う**ため、
        件数から権限外文書の存在が漏れることもない（決定 4）。
      operationId: bff-graph-neighbors
      responses:
        "200":
          description: 近傍グラフ
          content:
            application/json:
              schema: { $ref: "#/components/schemas/GraphView" }
        "400": { description: hops が範囲外（1〜3） }
        "404": { description: 権限外・不存在（区別しない） }

  /bff/graph/suggestions:
    get:
      parameters:
        - name: state
          in: query
          required: false
          description: |
            SC-21 (#918): 状態フィルタ。**未指定は `pending`（既定）**であり、`all` は絞りを外す。
            🔴 **`all` は状態の値ではない** —— 永続層に `all` という状態は存在しない。
            未知の値は 400（`invalid_state`）。**既定の補完も値域の検査も後段が一箇所で持つ**
            （BFF は透過するだけである）。
          schema: { type: string, enum: [pending, approved, rejected, all] }
        - name: kind
          in: query
          required: false
          description: |
            SC-21 (#918): 種類フィルタ。未指定は絞らない（＝すべて）。
            🔴 **リンク提案とタグ提案は同一の一覧に同居させる。画面を分けない**（FR-18）。
            未知の値は 400（`invalid_kind`）。
          schema: { type: string, enum: [link, tag] }
        - name: documentId
          in: query
          required: false
          description: |
            文書フィルタ。**その文書を両端のいずれかに持つ提案だけ**を返す
            （タグ提案は対象文書 1 件を見る）。未指定は絞らない（＝権限内の全件）。
            🔴 **絞りは可視性の判定より前段に入る。** 判定そのものは端点の文書属性で行われ、
            **この絞りは転送量を減らすだけで秘匿の実施点ではない**。
            🔴 **権限外・不存在の文書 ID でも 404 にはならない** —— 200 と空配列を返す。
            「その文書は無い」と「その文書の提案は 0 件」を区別させないためである。
            形式不正（UUID でない）のときだけ 400。
          schema: { type: string, format: uuid }
      # NFR-09: 認証のみ・ロール不問。**可視性はロールではなく ABAC が決める** ——
      # 権限のない文書に関する提案は一覧にも件数にも現れない（05_screens §SC-21 アクセス制御）。
      x-roles: []
      tags: [Graph]
      summary: "FR-18, UC-10, SC-21, SC-03: AI 提案の一覧（読み取りのみ）"
      description: |
        FR-18, UC-10, SC-21, ADR-0033 決定 7・10: AI が提案したリンク候補・タグ候補を一覧で返す。

        ［2026-08-31 追記 / #1104］**`documentId` を足した。** SC-21（棚卸し）は送らず全件を引き、
        SC-03（文書詳細の承認欄）は当該文書で絞る。従前 SC-03 は権限内の全件を引いて
        ブラウザ側で間引いており、**転送量と後段の N+1 が無関係な提案の総量に律速されていた**。

        🔴 **この口は読み取りである。**［2026-08-29 追記］承認・却下は
        `/bff/graph/suggestions/{id}/approve` / `/reject` として別に開いた（SC-03 の承認欄が呼ぶ）。
        従前ここには「承認・却下の口は BFF に無い」と書いてあったが、その記述は失効している。
        承認の主導線は SC-03（文書詳細）であり、SC-21 は棚卸し用の**従**で、
        **SC-21 の画面からは書き込みを一切行わない**（画面の位置づけは変わっていない）。
        **一括承認の手段は画面・API のいずれにも設けない**（FR-18。一覧の 1 行に収まる情報では
        承認を判断できず、タイトルだけを見て機械的に承認する運用に落ちるためである）。

        **権限のない文書に関する提案は、件数を含め一切現れない**（存在秘匿）。
        後段が引けないときは 502 であり、**空配列へ縮退しない** ——
        「提案が 1 件も無い」と「一覧が引けない」は利用者にとって別の意味である。
      operationId: bff-graph-suggestions
      responses:
        "200":
          description: AI 提案の一覧（権限内のもののみ）
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/AiSuggestion" }
        "400": { description: state / kind が値域外（そのまま透過する） }

  # ── FR-18, UC-10, SC-03: AI 提案の承認・却下（#450）───────────────────────────────
  # **承認の実行はここだけである**（SC-21 は棚卸しの従であり、書き込みを一切しない）。
  #
  # 認可（2 口に共通）:
  #   - **認証のみ・ロール不問**（`x-roles: []`）。計画は承認欄を SC-03 に置き、ロールで絞っていない。
  #   - 判定は後段（GraphService）が 4 段で行う —— Read スコープ → 提案の存在 → **両端の文書が
  #     可視**（`AuthorizedNode.Authorize`）→ **Write スコープ ＋ 起点文書が書き込み可**。
  #     **BFF は前段の門を置かない**（後段が要求ごとに ABAC を解決する型であり、BFF に置ける門は
  #     その真部分集合にしかならない。判断点を 2 つにすると片方が腐っても気付けない）。
  #   - 🔴 **拒否はすべて 404 に倒る。** 「権限が無い」と「存在しない」を区別しない
  #     （ADR-0034 決定 2）。**BFF は状態コードも本文も作り替えない** —— 403 や 200 へ変換すると
  #     存在秘匿が BFF 層で破れる。
  #
  # 🔴 **一括承認の口はどの層にも設けない**（FR-18・SC-21「描いてはいけないもの」）。承認は 1 件ずつ
  # であり、両端の文書の内容を見て判断する。**不在は BFF のルート表の走査で機械的に固定している。**
  #
  # **生成（`/graph/suggestions/generate/{documentId}`）は公開しない** —— 計画に生成を起動する
  # 導線が無く、消費者の無い書き込み口を公開面へ出さないためである。
  /bff/graph/suggestions/{id}/approve:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      x-roles: []
      tags: [Graph]
      summary: "FR-18, UC-10, SC-03: AI 提案を承認する（1 件ずつ）"
      description: |
        FR-18, SC-03, ADR-0033 決定 7: 提案を承認する。**`pending` からのみ遷移できる。**

        **リンク提案の承認は辺を作る**（`EdgeProvenance.AiApproved`。ADR-0033 決定 7
        「承認済みの提案だけが辺になる」）。既に同じ辺があるときは二重に作らない。

        **タグ提案の承認は対象文書のタグへ反映する**（ADR-0063 決定 1）。後段は承認者本人の資格で
        文書サービスへ書き（サービスアカウントが代わりに書く形は採らない。決定 3）、
        **反映が確定してから状態を `approved` にする**。既に付いていれば二重には付かない（冪等）。

        **反映できる値は SC-09 のタグ辞書に定義済みのタグに限る**（決定 2）。辞書に無い値を持つ提案は
        400 `unknown_tag` で承認できず、**却下だけができる**。

        **承認の資格**は「①対象文書への `write`（所有者） **または** ②管理者ロール」の選言である
        （決定 3。②が無いと取り込み文書〔`owner=system`〕の提案は誰も承認できない）。
        資格の有無は一覧の `canDecide` が行ごとに運ぶ（画面はそれで表示を分ける。決定 5）。

        応答は遷移後の提案（一覧と同じ `AiSuggestion`）である。
      operationId: bff-graph-suggestion-approve
      responses:
        "200":
          description: 承認後の提案
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSuggestion" }
        "400":
          description: >-
            `unknown_edge_type`（提案が指す辺の型が辞書に無い〔削除・改番された〕）／
            `unknown_tag`（タグ提案の値が SC-09 のタグ辞書に無い。承認できず却下のみ）。
            **本文ごと透過する** —— 画面は「もう承認済み」と区別して文言を出す
        "404": { description: "権限外・不存在・書き込み権限なし（**区別しない**）" }
        "409":
          description: >-
            `invalid_transition`。`pending` 以外からの承認である（既に承認済み／却下済み）。
            本文に現在の `state` が入る
        "502":
          description: >-
            後段へ到達できない。タグ提案では**文書サービスへ反映できなかった**ときもこれである
            （承認できていないのに承認済みと見せない。状態は `pending` のまま）
  /bff/graph/suggestions/{id}/reject:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      x-roles: []
      tags: [Graph]
      summary: "FR-18, UC-10, SC-03: AI 提案を却下する（1 件ずつ）"
      description: |
        FR-18, SC-03, ADR-0033 決定 7・10: 提案を却下する。**`pending` からのみ遷移できる。**

        **却下も書き込みである** —— 提案は端点が見える利用者に共有される行であり、却下すると
        他の利用者の `pending` 一覧からも消える。読み取り権限しか持たない主体は 404 になる。
        **承認と却下は同じ資格に従う**（ADR-0063 決定 4。①対象文書への `write` または ②管理者ロール）。

        **却下は再提示の抑止に用いる**（ADR-0033 決定 10）。却下回数は累積し、
        **両端いずれかの文書の本文が変更された時点で自動的に解除される**（文書更新イベントの購読）。
        解除の判定は本文指紋であり、**属性・タグだけの更新では解除されない**（ADR-0050）。

        🔴 **要求本文を持たない。** 後段は却下時点の本文指紋を任意で受けるが、
        **指紋は公開面に出さない内部状態**であり（応答スキーマにも無い）、SPA も BFF も持たない。
      operationId: bff-graph-suggestion-reject
      responses:
        "200":
          description: 却下後の提案
          content:
            application/json:
              schema: { $ref: "#/components/schemas/AiSuggestion" }
        "404": { description: "権限外・不存在・書き込み権限なし（**区別しない**）" }
        "409":
          description: >-
            `invalid_transition`。`pending` 以外からの却下である。本文に現在の `state` が入る

  # ── SC-19 / SC-20, FR-19/FR-20, UC-11: 個人資料（private-note）と Obsidian 連携設定（#451）─────
  # 後段は DocumentService の `/private-notes*` 群。**リソース名は計画が確定させた `private-notes`**
  # （ADR-0054 決定 4）。
  #
  # 認可（全 11 口に共通）:
  #   - **認証のみ・ロール不問**。計画 05_screens は SC-19 / SC-20 を「全利用者が利用でき、表示範囲は
  #     本人が所有する個人資料に限る」と定め、**管理者が他利用者の個人資料・同期設定を扱う導線を
  #     明示的に禁じている**。したがってロールでは絞らない。
  #   - **本人性の判定は後段が持つ**。後段は主体を JWT からしか採らず、台帳の所有者で絞り、
  #     **他者の資料・端末は 404 で存在ごと秘匿する**（403 にすると他人の ID の実在が漏れる）。
  #     BFF はこの判定を複製せず、利用者の資格情報を後段へ転送する。
  #   - **書き込みだけ** ABAC の `write` スコープで前段を絞る（ADR-0036 D-07・#1010）。
  #     write 許可ポリシーが無い主体は 403。**読み取りには前段を置かない**（返すのは呼び出し者自身の
  #     資料だけで秘匿する相手が居らず、文書属性フィルタは台帳の投影に適用できない）。
  #   - **端末・トークンの口にも前段を置かない**。個別失効は SC-20 が「端末紛失時の唯一の防御線」と
  #     定めており、文書 ABAC の整備状況に依存させない。
  #
  # **後段の本文は詰め替えず透過する** —— 507（容量上限）の本文が SC-19 の固定文言の根拠であり、
  # 409（`vault_path_conflict` / `not_deleted`）も同様である。
  #
  # 載せていない後段の口: `/private-notes/quotas/{ownerId}`（管理者の上限変更。**載せる画面が計画に無い**）と
  # `/private-notes/sync/*`（Obsidian プラグイン向け。**資格情報が別系統の同期トークン**であり SPA は呼ばない）。
  /bff/private-notes:
    get:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-19, UC-11, SC-19: 個人資料の一覧＋容量（本人のもののみ）"
      description: |
        削除済みも同じ一覧に載る（SC-19 の「削除済み」タブは同じ応答を絞って描く）。
        容量の内訳「うち削除済み」は**画面が削除済み行の `bytes` を合算して出す** ——
        後段が持つのは台帳の行だけであり、内訳という項目を持たない（数え方を 2 つにしない）。
        **他人の資料は 1 件も現れない**（件数も示さない。SC-19「描いてはいけないもの」）。
      operationId: bff-private-note-list
      responses:
        "200":
          description: 本人の個人資料と容量
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateNoteListResponse" }
        "401": { description: 未認証 }
    post:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-19, UC-11, SC-19: 個人資料を作成する（タイトルのみ・本文は受け取らない）"
      description: |
        本文編集は Obsidian 経路のみである（ADR-0046 D-02。本画面はリッチエディタを描かない）。
        既定は**非公開（共有 0 件）・機密区分 `restricted`・露出 3 トグル OFF** で作られる。
        **容量 100% では新規作成だけが 507 で拒まれる**（既存資料の更新は通る。ADR-0037 決定 17）。
      operationId: bff-private-note-create
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreatePrivateNoteRequest" }
      responses:
        "201":
          description: 作成された個人資料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateNoteDto" }
        "400": { description: タイトル未指定（RFC7807 ValidationProblem） }
        "401": { description: 未認証 }
        "403": { description: write 許可ポリシーが無い（deny-by-default） }
        "409": { description: 同じ Vault パスの資料が既にある（`vault_path_conflict`） }
        "507":
          description: |
            保存容量の上限に達している（**新規作成のみ拒否**）。本文には使用量・上限・
            容量を空ける手段（完全削除・上限引き上げの依頼）が入る。**BFF は詰め替えない。**
          content:
            application/problem+json:
              schema: { $ref: "#/components/schemas/ProblemDetails" }

  /bff/private-notes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    delete:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-19, UC-11, SC-19: 個人資料を論理削除する（90 日は復元可）"
      description: |
        **容量は空かない。** 応答の `capacityFreed=false` が、SC-19 の確認ダイアログの固定文言
        「削除しても容量は空きません（90 日間保管されます）」の根拠である。
        他人の資料・不在はいずれも 404（存在秘匿）。
      operationId: bff-private-note-soft-delete
      responses:
        "200":
          description: 論理削除の結果（完全削除の期限つき）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateNoteDeletedResponse" }
        "401": { description: 未認証 }
        "403": { description: write 許可ポリシーが無い }
        "404": { description: 不在または他人の資料（区別しない） }

  /bff/private-notes/{id}/restore:
    post:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-19, UC-11, SC-19: 論理削除された個人資料を復元する（90 日以内）"
      description: |
        90 日を過ぎた資料は台帳ごと消えており **404**（＝復元不可）。削除されていない資料は 409。
      operationId: bff-private-note-restore
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 復元された個人資料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateNoteDto" }
        "401": { description: 未認証 }
        "403": { description: write 許可ポリシーが無い }
        "404": { description: 不在・他人の資料・完全削除済み（区別しない） }
        "409": { description: 削除されていない（`not_deleted`） }

  /bff/private-notes/{id}/exposure:
    put:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-19, FR-20, SC-20: 露出 3 トグル（横断検索 / グラフ / AI 入力）を設定する"
      description: |
        3 つは**独立に設定でき、既定はいずれも OFF** である。
        🔴 現時点の後段は**保存するだけ**であり、ON にしても検索・グラフ・AI へは流れない
        （消費側を安全に絞る基盤が未了のため deny 側に倒してある）。
      operationId: bff-private-note-exposure
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/UpdateExposureRequest" }
      responses:
        "200":
          description: 更新後の個人資料
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PrivateNoteDto" }
        "401": { description: 未認証 }
        "403": { description: write 許可ポリシーが無い }
        "404": { description: 不在または他人の資料（区別しない） }

  /bff/private-notes/purge:
    post:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-19, UC-11, SC-19: 個人資料を完全削除する（即時・復元不可。単票／一括共用）"
      description: |
        **単票も一括も同じ口**である（`ids` の要素数の差でしかない。SC-19 は「1 件ずつでは
        実用に耐えない」として複数選択の一括を必須にしている）。対象は**削除済みのみ**。
        応答の `freedBytes` が、確認ダイアログで示した「解放される容量」の確定値である。
        `ids` に他人の資料・不在の ID が 1 つでも混じれば **404**（部分適用しない）。
      operationId: bff-private-note-purge
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/PurgePrivateNotesRequest" }
      responses:
        "200":
          description: 完全削除の結果（件数と解放された容量）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/PurgePrivateNotesResponse" }
        "400": { description: ids が空（RFC7807 ValidationProblem） }
        "401": { description: 未認証 }
        "403": { description: write 許可ポリシーが無い }
        "404": { description: 不在または他人の資料が混じっている（区別しない） }
        "409": { description: 削除済みでない資料が混じっている（`not_deleted`） }

  /bff/private-notes/devices:
    get:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-20, UC-11, SC-20: 同期端末の一覧（本人のもののみ）"
      description: |
        **トークンは平文もハッシュも載らない。** 画面は `expiresAt` と `active` から
        「有効（残り日数）／期限切れ間近（残り 7 日以内）／期限切れ／失効」を描き分ける。
      operationId: bff-sync-device-list
      responses:
        "200":
          description: 本人の同期端末
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/SyncDeviceDto" }
        "401": { description: 未認証 }
    post:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-20, UC-11, SC-20: 同期端末を登録しトークンを発行する（有効期限 30 日）"
      description: |
        🔴 **平文トークンはこの応答で一度だけ返る。再表示はできない**（再発行のみ）。
        **管理者承認を挟まない**（私物端末を認めるため本人管理とする）。
        **自動更新（リフレッシュ）の口は存在しない** —— 更新は手動再発行だけである
        （有効期限は、失効操作を忘れた場合の最終的な歯止めであるため）。
      operationId: bff-sync-device-issue
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/CreateSyncDeviceRequest" }
      responses:
        "201":
          description: 発行された同期トークン（平文はこの応答のみ）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncTokenIssuedResponse" }
        "400": { description: 端末名が空（RFC7807 ValidationProblem） }
        "401": { description: 未認証 }

  /bff/private-notes/devices/{id}:
    delete:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-20, SC-20: 同期端末を個別に失効させる（端末紛失時の唯一の防御線）"
      description: |
        **書き込みだが ABAC の前段を置かない。** 失効を文書 ABAC ポリシーの有無に依存させると、
        ポリシー未整備の環境で紛失端末を失効できなくなる（安全側は「失効は通す」である）。
        他人の端末・不在はいずれも 404。
      operationId: bff-sync-device-revoke
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204": { description: 失効した }
        "401": { description: 未認証 }
        "404": { description: 不在または他人の端末（区別しない） }

  /bff/private-notes/devices/{id}/reissue:
    post:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-20, SC-20: 同期トークンを手動で再発行する（旧トークンは即時無効）"
      description: |
        期限切れ・失効済みの端末に対しても本人操作として再発行できる（**回復経路はこれだけである**）。
        再発行後のトークンは新規発行と同じ扱い（一度だけ表示・再表示不可・有効期限 30 日）である。
        ⚠️ 旧トークンは**プラグインの設定に残ったまま**であり、入れ直しが要る。
      operationId: bff-sync-device-reissue
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 再発行された同期トークン（平文はこの応答のみ）
          content:
            application/json:
              schema: { $ref: "#/components/schemas/SyncTokenIssuedResponse" }
        "401": { description: 未認証 }
        "404": { description: 不在または他人の端末（区別しない） }

  /bff/private-notes/devices/revoke-all:
    post:
      x-roles: []
      tags: [PrivateNotes]
      summary: "FR-20, SC-20: 全端末の同期トークンを一括失効させる"
      description: |
        どの端末を失ったか特定できない場面のための操作である。**復元できない**旨を明示した
        確認ダイアログを画面側で伴わせる（SC-20）。
      operationId: bff-sync-device-revoke-all
      responses:
        "200":
          description: 失効した端末数
          content:
            application/json:
              schema: { $ref: "#/components/schemas/RevokeAllSyncDevicesResponse" }
        "401": { description: 未認証 }

  # ── SC-17, FR-05, FR-09, UC-05, ADR-0026: 利用者アカウント管理 BFF ─
  # 管理者限定（05_screens §共通シェル「SC-09・SC-12・SC-17 = システム管理者」。運用者も不可）。
  # BFF は AuthorizationService の /authz/users* へ**透過中継**する。後段の 400（検証エラー）・
  # 404（不在）はそのまま返る。後段不達は 502。
  # 🔴 **`POST /bff/admin/users`（新規作成）は宣言しない** —— 計画 §SC-17 アクションが
  # 「本画面から新規作成はしない」と定めており、アカウントは人事システム連携で自動作成される。
  /bff/admin/users:
    get:
      x-roles: [platform-admin]
      tags: [UserAdmin]
      summary: "FR-05, FR-09, UC-05, SC-17: 利用者一覧（部門・ロール・ABAC 属性・状態）"
      description: |
        部門は ABAC 属性 `department` そのものであり、独立した項目を持たない
        （複写すると属性を更新したのに列が追随しない形が作れる）。
      operationId: bff-user-admin-list-users
      responses:
        "200":
          description: 利用者一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/PlatformUserDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: AuthorizationService へ到達できない }

  # 割当可能ロールの値域。literal な `/assignable-roles` は 1 段、下の `{userId}` を含む経路は
  # 2 段なので衝突しない（`/bff/admin/mcp-clients/tools` と同じ形）。
  /bff/admin/users/assignable-roles:
    get:
      x-roles: [platform-admin]
      tags: [UserAdmin]
      summary: "FR-09, SC-17: 割当可能なロールの一覧（入力規則「定義済みロールのみ」の値域）"
      description: |
        **画面はこの一覧から選択肢を作る。** 値集合を画面へ焼き込むと、認可基盤にロールを
        足しても選べず、消えたロールを選べてしまう。
      operationId: bff-user-admin-list-assignable-roles
      responses:
        "200":
          description: 割当可能なロール名の一覧
          content:
            application/json:
              schema:
                type: array
                items: { type: string }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: AuthorizationService へ到達できない }

  /bff/admin/users/{userId}/attributes:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      x-roles: [platform-admin]
      tags: [UserAdmin]
      summary: "FR-05, FR-09, SC-17: 利用者の ABAC 属性の割当（差し替え）"
      description: |
        差し替えである（部分更新ではない）。送らなかったキーは消える。

        **部門と機密区分上限は必須、タグは任意**である。値は属性辞書（利用者スコープ）に
        定義済みのものだけを受け付け、**辞書に無いキーも拒否する** —— 受け付けて無視すると
        「割り当てたのに認可が変わらない」が黙って作れるためである。
      operationId: bff-user-admin-replace-user-attributes
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceUserAttributesRequest"
      responses:
        "200":
          description: 差し替え後の利用者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUserDto"
        "400":
          description: 検証エラー（RFC7807 ValidationProblem。必須欠落・辞書外の値／キー）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }

  /bff/admin/users/{userId}/roles:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    put:
      x-roles: [platform-admin]
      tags: [UserAdmin]
      summary: "FR-09, SC-17: 利用者のロール割当（差し替え・併任可）"
      description: |
        差し替えである。送った集合が、その利用者のロールの全体になる。

        **必須である**（空集合は 400）。権限を剥がしたいときは無効化を使う ——
        「ロールが 0 件の有効なアカウント」と「無効化されたアカウント」は別の状態である。
        定義済みでないロールも 400 で拒否する。
      operationId: bff-user-admin-replace-user-roles
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReplaceUserRolesRequest"
      responses:
        "200":
          description: 差し替え後の利用者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUserDto"
        "400":
          description: 検証エラー（RFC7807 ValidationProblem。空集合・定義外ロール・重複）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }

  /bff/admin/users/{userId}/disable:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      x-roles: [platform-admin]
      tags: [UserAdmin]
      summary: "FR-09, SC-17: アカウントの無効化（全セッション失効を伴う）"
      description: |
        **無効化と全セッション失効は 1 つの操作である。** 無効化だけでは既存のセッションが
        生き残るため、口を分けない。失効は認可サーバーのバックチャネルログアウトを起こし、
        BFF 側のセッションが subject 単位で削除される。
      operationId: bff-user-admin-disable-user
      responses:
        "200":
          description: 無効化後の利用者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUserDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }

  /bff/admin/users/{userId}/enable:
    parameters:
      - { name: userId, in: path, required: true, schema: { type: string } }
    post:
      x-roles: [platform-admin]
      tags: [UserAdmin]
      summary: "FR-09, SC-17: アカウントの再有効化"
      description: |
        **セッションは復活しない。** 本人が改めてログインする。
      operationId: bff-user-admin-enable-user
      responses:
        "200":
          description: 再有効化後の利用者
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PlatformUserDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }

components:
  schemas:
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, example: "ナレッジ管理とは" }
        topK: { type: integer, default: 10 }
        attributeFilters:
          type: object
          additionalProperties: { type: string }
        # FR-03, SC-02, #531: 検索モード（**3 値**・既定 hybrid）。利用者裁定 Q4（planning#197）。
        # enum にはしない（IADR-0131 決定 5）——閉じた enum は後段の値追加を SPA 側で破壊的にする。
        # 未知の値・未指定は RetrievalService が hybrid へ縮退させる。
        mode:
          type: string
          default: hybrid
          description: >-
            hybrid（既定・ベクトル＋全文の RRF 融合）/ keyword（全文のみ）/ semantic（ベクトルのみ）。
            未知の値は hybrid として扱う。
          example: hybrid
        # FR-03, SC-02, #532: 並び順（**2 値**・既定 relevance）。利用者裁定 Q5（planning#197）。
        # enum にはしない（IADR-0131 決定 5・mode と同じ理由）。
        # 未知の値・未指定は RetrievalService が relevance へ縮退させる。
        sortBy:
          type: string
          default: relevance
          description: >-
            relevance（既定・関連度順）/ updated（更新日時の新しい順）。未知の値は relevance として扱う。
            **updated は取得後に並べ替える**（IADR-0150 決定 1）——関連度が候補を決め、並び順は表示順だけを
            決める。したがって候補（関連度上位）の外にある、より新しい関連文書は現れない。
            **更新日時を持たないチャンク（未再索引・IADR-0149 決定 3）は末尾**に置く。
          example: relevance

    AttributeValuesRequest:
      type: object
      required: [key]
      properties:
        key:
          type: string
          description: >-
            引きたい属性の種別。`tags`（タグ）または ABAC 属性キー（`department` 等）。
            未知・空は空集合へ縮退する。
          example: tags
      description: |
        FR-04, FR-05, SC-01, SC-08（ADR-0043 / #540）: 権限内属性値の照会。
        **`scope` は受け取らない** —— BFF がサーバ側で解決した値だけを後段へ渡す（権限昇格の防止）。

    AttributeValuesResponse:
      type: object
      description: |
        FR-04, SC-01, SC-08（ADR-0043 決定 2 / #540）: 権限内の属性値。
        **`values` は件数を持たない。** 件数は値集合そのものより漏洩力が強いため一般利用者へ返さない。
        **［#634］管理者スコープの辞書は `dictionary` として足した**（IADR-0151 決定 4 が用意した拡張点。
        IADR-0152 決定 3）。**一般利用者には常に `null`** で、`values` の形は #540 から変わらない。
        件数が載るのは `dictionary` の中だけである —— ADR-0043 決定 2 の制限は**一般利用者に対するもの**で、
        辞書の全体を見てよい管理者には当たらない。
      required: [values]
      properties:
        values:
          type: array
          items: { type: string }
        dictionary:
          allOf: [{ $ref: "#/components/schemas/TagDictionaryResponse" }]
          nullable: true
          description: >-
            FR-09, SC-05, SC-09（#634）: タグ辞書。管理者・運用者かつ `key` が `tags` のときだけ入る。

    TagDto:
      type: object
      description: |
        FR-09, SC-05, SC-09（#634 / IADR-0152 決定 2）: 辞書のタグ 1 件。
        `usageCount` は**現行版の文書の件数**である。**版履歴は数えない**（append-only で付け替えられず、
        数えると一度でも使われたタグを永久に削除できなくなる）。**アーカイブ済みの文書は数える**
        （アーカイブ済みでもタグは付け替えられる）。
        **［#635］件数は識別子の一致で数える**（#634 の表示名一致は暫定だった）。
        文書がタグの識別子を参照するようになったので、**改名しても件数は変わらない**。
      required: [id, name, usageCount]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            識別子。**改名で変わらない**（SC-09 の「改名は既存文書へ追随する」の土台）。
            **［#635］文書はこの識別子を参照して保持する**（表示名を複写しない。IADR-0153 決定 1）。
            **［#640］改名・削除は `/bff/tags/{id}` から操作する**（`PUT` / `DELETE`。
            後段 DocumentService の `/tags/{id}` へ中継する。書き込みはシステム管理者限定）。
        name: { type: string, description: 表示名。改名で変わるのはこちらだけである。 }
        usageCount: { type: integer, format: int32 }

    GraphNodeItem:
      type: object
      description: |
        FR-17: グラフのノード（文書単位）。
        `isPrivateNote` は SC-18 の描き分け（組織文書＝円＋📄 / 個人資料＝角丸四角＋👤）のための
        1 bit（ADR-0054 / #917）。値が付くのは ABAC 判定を通過した可視ノードだけであり、
        **doc_scope を持たない文書は組織文書（false）として返る**（ADR-0054 決定 5）。
      required: [documentId, title]
      properties:
        documentId: { type: string, format: uuid }
        title: { type: string }
        isPrivateNote: { type: boolean, default: false }

    GraphEdgeItem:
      type: object
      description: |
        FR-17, ADR-0033 決定 4: グラフの辺。**辺の型は識別子で返す**（表示名は辞書側で解決する。
        改名に追随するため）。`provenance` は出所（auto / user / ai-approved）。
      required: [id, sourceDocumentId, targetDocumentId, edgeTypeId, provenance]
      properties:
        id: { type: string, format: uuid }
        sourceDocumentId: { type: string, format: uuid }
        targetDocumentId: { type: string, format: uuid }
        edgeTypeId: { type: string, format: uuid }
        provenance: { type: string, enum: [auto, user, ai-approved] }

    EdgeTypeCatalogItem:
      type: object
      description: |
        FR-17, SC-18: 辺の型（描画用）。**使用件数を持たない** —— 意図した除外である
        （件数は ABAC で絞られておらず、一般利用者へ返すと総量が漏れる）。
      required: [id, name, layer, isSymmetric]
      properties:
        id: { type: string, format: uuid }
        name: { type: string, description: "表示名。改名されても id は変わらない" }
        layer: { type: string, description: "型の層（core / domain / user 等）" }
        isSymmetric: { type: boolean, description: "対称な関係か（向きを持たないか）" }

    AiSuggestion:
      type: object
      description: |
        FR-18, SC-21, ADR-0033 決定 7・10: AI 提案（リンク候補・タグ候補）。

        **リンク提案とタグ提案を 1 つの型で表す** —— SC-21 が同一の一覧を求めており、
        型を分けるとクライアント側で 2 経路に割れる。種別固有の欄は省略可である。

        🔴 **本文指紋（却下解除の判定に使う内部状態）は公開面に出さない。**

        🔴 **辺の型の表示名を持たない。** 名前は辞書（`/bff/graph/edge-types`）で解決し、
        改名に追随させる（ADR-0033 決定 9）。ここへ焼き込むと改名後も古い名前を出し続ける。
      required:
        [id, kind, sourceDocumentId, rationale, state, rejectedCount, sourceDocumentTitle]
      properties:
        id: { type: string, format: uuid }
        kind:
          type: string
          description: "link（リンク候補）/ tag（タグ候補）"
        sourceDocumentId:
          type: string
          format: uuid
          description: "リンク提案では起点、タグ提案では対象文書。**どちらの種別でも必ず入る**"
        targetDocumentId:
          type: string
          format: uuid
          nullable: true
          description: "リンク提案のみ"
        edgeTypeId:
          type: string
          format: uuid
          nullable: true
          description: "リンク提案のみ。表示名は辺の型カタログで解決する"
        tagValue:
          type: string
          nullable: true
          description: "タグ提案のみ。SC-09 のタグ辞書に整合する値であること"
        rationale: { type: string, description: "なぜ関連と判断したか（SC-21 主要素 6）" }
        state:
          type: string
          description: "pending（承認待ち）/ approved（承認済み）/ rejected（却下）"
        rejectedCount: { type: integer, description: "累積の却下回数" }
        reinstatedReason:
          type: string
          nullable: true
          description: >-
            再提示の理由。source / target / both のいずれか。**非 null なら再提示であり、
            画面は固定文言を必ず添える**（ADR-0033 決定 10。理由の無い再提示を起こさない）
        sourceDocumentTitle:
          type: string
          description: "起点（タグ提案では対象）の文書名。SC-21 の「提案の内容」列が要る"
        targetDocumentTitle:
          type: string
          nullable: true
          description: "終点の文書名。タグ提案では終点が無いため null である"
        canDecide:
          type: boolean
          default: false
          description: >-
            FR-18, SC-03, ADR-0063 決定 3〜5: **この利用者がこの提案を承認・却下できるか**
            （①起点文書への `write` **または** ②管理者ロール）。サーバ側で判定した値であり、
            画面は辞書もポリシーも引かず、この値だけで「承認できる／この文書のタグを編集する
            権限が無い」を分けて描く。**承認と却下は同じ権限に従う**（決定 4）ので 1 つの値で
            両方を表す。旧版の後段は載せないので既定は false（deny 側）

    GraphView:
      type: object
      description: |
        FR-17, UC-10, ADR-0034 決定 4: 近傍グラフ。`truncated` は表示上限で打ち切ったかを表す。
        **上限の計数は権限判定を通過した品目に対してのみ行われる**ため、この値が権限外文書の
        存在を漏らすことはない。
      required: [nodes, edges, truncated]
      properties:
        nodes:
          type: array
          items: { $ref: "#/components/schemas/GraphNodeItem" }
        edges:
          type: array
          items: { $ref: "#/components/schemas/GraphEdgeItem" }
        totalNodes:
          type: integer
          description: |
            FR-17, ADR-0049 決定 1・3: **許可済み**ノードの総数。表示上限（200）を超えて数えた値。
            🔴 **権限外は 1 件も含まない** —— 数えてよいのは ABAC 判定を通過した品目だけである。
        totalEdges:
          type: integer
          description: "許可済みの辺の総数（同上）"
        totalIsLowerBound:
          type: boolean
          description: |
            ADR-0049 決定 3: 算出用の上限（ノード 2,000 / 辺 5,000）に達したか。
            **立っていれば総数は「以上」の意味である**（例:「2,000 件以上」）。
            ⚠️ このとき `updated` / `degree` の並びは**厳密な上位 200 件ではない**（同 決定 4）。
        truncated: { type: boolean }

    TagDictionaryResponse:
      type: object
      description: |
        FR-09, SC-05, SC-09（#634）: タグ辞書の値集合。**一般利用者へは返さない** ——
        辞書を丸ごと返すと権限外の文書に固有の値からその存在が推測できる（ADR-0043 決定 1）。
      required: [tags]
      properties:
        tags:
          type: array
          items: { $ref: "#/components/schemas/TagDto" }

    CreateTagRequest:
      type: object
      description: >-
        FR-09, SC-09（#640）: 辞書へタグを追加する。
        **識別子は辞書が採番する**（呼び出し側から与えない。改名で変わらない値を外から決めさせない）。
      required: [name]
      properties:
        name: { type: string, description: 表示名。前後の空白は正規化される。 }

    RenameTagRequest:
      type: object
      description: >-
        FR-09, SC-09（#640）: 辞書のタグを改名する。**識別子は変えない** ——
        文書は識別子を参照しているので追随は自動である（IADR-0153 決定 1）。
      required: [name]
      properties:
        name: { type: string, description: 新しい表示名。既存値と重複してはならない（自分自身は除く）。 }

    RenameTagResponse:
      type: object
      description: |
        FR-09, SC-09（#640 / IADR-0153 決定 3）: 改名の結果。
        `republishedDocuments` は**射影を作り直すために `DocumentUpdated` を再発行した文書の数**であり、
        `tag.usageCount` と同じ値になる（どちらも「現行版でこのタグを持つ文書の数」。2 通りの数え方を持たない）。
      required: [tag, republishedDocuments]
      properties:
        tag: { $ref: "#/components/schemas/TagDto" }
        republishedDocuments: { type: integer, format: int32 }

    TagInUseProblem:
      type: object
      description: |
        FR-09, SC-09（#640 / IADR-0153 決定 6）: 使用中のタグの削除を拒否したときの本文。
        **`usageCount` は SC-09 の「削除前に使用件数を示す」を満たすために要る** ——
        件数が無いと管理者は「なぜ消えないか」しか分からず、外す作業に着手できない。
        **BFF は本文を詰め替えず透過する**（数え方を 2 つ持つと一覧と削除拒否で件数が割れる）。
      required: [error, message, usageCount]
      properties:
        error: { type: string, enum: [tag_in_use] }
        message: { type: string }
        usageCount: { type: integer, format: int32 }

    # ── #520 / IADR-0132: 応答スキーマの `required` は C# の**非 null 性**から起こす。
    # `?` の付かないメンバー（値型・コレクションを含む）だけを required に入れる。
    # required が無いと orval は全プロパティを省略可（`?`）で生成し、生成型が型検査の網にならない
    # （#506 の変異試験 M2 で実測）。
    SearchResponse:
      type: object
      description: "FR-03: 検索応答（`Knowledge.Contracts/Dtos/SearchDto.cs` の `SearchResponse`）"
      required: [results, totalHits, elapsedMs]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultDto"
        totalHits: { type: integer }
        elapsedMs: { type: integer }

    SearchResultDto:
      type: object
      description: "FR-03, FR-04: 検索結果 1 件（`Knowledge.Contracts/Dtos/SearchResultDto.cs`）"
      required: [chunkId, documentId, documentTitle, text, score, attributes, tags, hasBody]
      properties:
        chunkId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        text: { type: string }
        score: { type: number, format: float }
        markdownUri: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        updatedAt:
          type: string
          format: date-time
          nullable: true
          description: |
            FR-03, SC-02（裁定 Q6 / #536）: 文書の更新日時。**`null` は「索引がまだ日時を持たない」を表す**
            （IADR-0149 決定 3）。本項目は索引（Qdrant のペイロード）へ日時を取り込むところから必要であり、
            **本項目より前に索引されたチャンクは日時を持たない**。再索引が済むまでの縮退であって障害ではない
            —— 画面は `—` を描く。**`0001-01-01` のような既定値で埋めない**（「知らない」が「とても古い」に化ける）。
        hasBody:
          type: boolean
          description: |
            FR-02, FR-03, SC-02（ADR-0070 決定 4 / #1193）: この結果が**本文由来か**。
            `false` は「本文を持たない文書（テキスト層の無い PDF 等）を**メタデータだけで索引した点**」であり、
            **`text` は空文字列**になる（索引テキストは題名由来なので、本文の抜粋としては出さない）。
            画面は抜粋の位置へ「本文なし（原本を参照）」を示し、**結果から除外しない**。
            RAG（`/bff/ask`）の文脈と出典にも入らない —— 根拠に使える本文が無いためである。
            **既定は `true`（本文あり）**: 本項目を持たない旧発行者の応答は従来どおり抜粋が描かれる。

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, example: "プロジェクト憲章の承認フローを教えて" }
        scope:
          type: string
          nullable: true
          description: "呼び出し側が付す任意の絞り込み識別子（`AnalysisRequest.Scope`）。省略可"
        attributeFilters:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: |
            FR-04, FR-05, SC-01, SC-08（裁定 Q1・Q3 / #539）: **対象範囲**（属性キー → 許可値集合）。
            計画は「`SearchRequest` は既に `AttributeFilters` を持つのに `AnalysisRequest` だけが
            持たない非対称を解消する」と定めた。**軸はタグ・部門（`department`）・
            プロジェクト（`project`）である。`folder` は用いない**（裁定 Q9。ABAC 属性体系に
            `folder` が存在せず、フォルダは取り込み時に属性へ写像されて消える）。

            **多値である**——画面はチップを**複数**選ぶ。`AnalysisDataRange.attributeFilters` と同じ形で、
            `SearchRequest.attributeFilters`（単値）とは違う（あちらは後方互換のために残る口である）。

            **タグは `tags` をキーに指定する**（値集合の照会 `POST /bff/attribute-values` と同じキー）。
            **候補に出る値と絞れる値は同じ写像を通る**（#539 で 1 つの関数へ寄せた）。

            **narrowing-only である。** ABAC 許可スコープと交差し、**権限を一切広げない**。
            権限の外だけを指す範囲は全体 deny へ倒れる（結果は空になる）。
            **ABAC スコープ自体はクライアントから受け取らない**（受け取っても使わない＝権限昇格の防止）。
          example: { tags: ["経理", "規程"], department: ["finance"] }

    AnalysisTaskRequest:
      type: object
      required: [instruction]
      properties:
        instruction:
          type: string
          example: "2025 年度の経費規程の変更点を比較して"
        taskType:
          type: string
          enum: [Analyze, Compare, Extract]
          default: Analyze
          description: "分析 / 比較 / 抽出"
        range:
          $ref: "#/components/schemas/AnalysisDataRange"

    AnalysisDataRange:
      type: object
      description: "指定データ範囲。ABAC 許可スコープと交差し権限を広げない（narrowing-only）。"
      properties:
        query:
          type: string
          nullable: true
          description: "範囲内で関連箇所を絞る検索クエリ（省略時は instruction を流用）"
        attributeFilters:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: "属性キー → 許可値集合（例: department: [sales]）"
        topK: { type: integer, default: 8 }

    AiAnswerDto:
      type: object
      description: |
        FR-04: RAG 回答（回答本文＋番号付き出典）。
        Issue #506 監査: `citations` の型は **`CitationDto[]`** である（旧記載の `SearchResultDto[]` は誤り。
        実体は `Knowledge.Contracts/Dtos/SearchResultDto.cs` の `AiAnswerDto`）。両者に共通するのは
        `documentId` / `documentTitle` / `chunkId` / `score` の 4 つだけで、`number` / `snippet` /
        `sourceUri` は `CitationDto` にしか無い。
      required: [answer, citations, model, inputTokens, outputTokens, answerId]
      properties:
        answer: { type: string }
        citations:
          type: array
          items:
            $ref: "#/components/schemas/CitationDto"
        model: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        answerId:
          type: string
          format: uuid
          description: |
            FR-08, UC-01: この回答の識別子。フィードバック（👍/👎・コメント）の紐付け先で、
            回答生成ごとに自動採番される（`FeedbackRequest.answerId` へ渡す）。

    CitationDto:
      type: object
      description: |
        FR-04: 出典（番号付き＋元文書へのリンク）。AI 回答中の [1][2] と対応する根拠で、
        利用者は `sourceUri` から元文書へ辿れる。
      required: [number, documentId, documentTitle, chunkId, score, snippet, confidentiality]
      properties:
        number: { type: integer, description: "回答本文中の [n] と対応する番号" }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        chunkId: { type: string, format: uuid }
        sourceUri: { type: string, nullable: true }
        score: { type: number, format: float }
        snippet: { type: string, description: "根拠箇所の抜粋" }
        confidentiality:
          type: string
          description: |
            FR-04, SC-01, #541: この出典の文書の機密区分（ABAC 文書属性 `confidentiality`）。
            利用者が AI 回答を社外資料へ引用してよいか判断する手掛かり（利用者裁定 Q10 / planning#200）。
            値集合は `public` / `internal` / `confidential` / `restricted`。
            **`enum` にしない**（IADR-0131 決定 5。後段の値追加を SPA 側の破壊的変更にしない）。
            発行側が値を持たない場合は安全側の `restricted` へ縮退する。`default` は書かない
            ——`required` と同居すると「欠けてよい」と読め、契約が自己矛盾する（IADR-0132 決定 2 系）。
            **表示名（公開 / 社内限 / 秘 / 取扱制限）は契約に載せない。** 正は計画リポジトリの用語集。

    AccessScopeRequest:
      type: object
      required: [userId, userAttributes]
      properties:
        userId: { type: string }
        userAttributes:
          type: object
          additionalProperties: { type: string }
        action:
          type: string
          description: >-
            ［2026-08-23 / #989］解決したいアクション（`read` / `analyze` / `manage` / `write`。
            `enum` にしない——値域の正は `PolicyAction`）。省略時は `read`（旧クライアントは無改修で
            従来どおり読み取りスコープを得る）。従前はサーバ側が `read` をハードコードしており、
            書き込みの認可スコープをこの経路で出せなかった。値域外は 400（呼び出し側は非 2xx を
            deny へ縮退させる）。

    AccessScopeResponse:
      type: object
      description: |
        FR-05, ADR-0004: ABAC スコープ解決結果（`Platform.Shared.Contracts/Dtos/AccessScopeDto.cs`）。

        **`granted` と `allowedFilters` は組で読む。** 計画 `06_technical/07_abac-attribute-model.md`
        §ポリシー評価モデル の具体判定規則を、そのまま契約の 2 状態へ写したものである。

        | `granted` | `allowedFilters` | 意味 |
        | --- | --- | --- |
        | `false` | `[]` | **全件遮断**（利用者にマッチするポリシーが 1 件も無い＝deny-by-default） |
        | `true` | `[]` | **条件なしで全件許可**（マッチしたポリシーに文書条件が無い） |
        | `true` | 1 件以上 | 各フィルタを満たす文書だけ許可（フィルタ間は AND・値集合内は OR） |

        **`allowedFilters` が空であることだけでは 1 行目と 2 行目を区別できない。**
        `granted` を読まずに「フィルタが無い＝制限なし」と解釈すると **deny-by-default が全件開放へ反転する**。
        `granted` は既定値つきメンバー（`bool Granted = false`）だが**応答本文には必ず出る**ため
        `required` に含める（IADR-0132 論点 B の B1）。

        ［2026-08-10 / #525］`granted` はこの版で追加した。それ以前の本スキーマは
        `userId` と `allowedFilters` しか持たず、上表の 1 行目と 2 行目が同一の応答になっていた。

        ［2026-08-22 / #989］`branches` をこの版で追加した。**上表は `branches` が空／未指定のときの
        読み方であり、それは従来と変わらない。** 計画の `read` 規則は「静的属性ベース ∨ 所有者ベース ∨
        共有先ベース」の**選言**だが、`allowedFilters` は**単一の連言しか表せない**ため所有者ベースの
        判定が成立しなかった（`ADR-0046` D-06 部品 3）。`branches` はその選言を運ぶ。

        | `branches` | 読み方 |
        | --- | --- |
        | 空 / 未指定 | **従来どおり `allowedFilters` で評価する**（後方互換） |
        | 1 件以上 | **いずれかの分岐のフィルタをすべて満たす文書が可視**（分岐内 AND・分岐間 OR） |

        🔴 **`allowedFilters` は算出アルゴリズムごと据え置いてある。** 未移行の消費側は挙動が
        1 ビットも変わらない。**`allowedFilters`（分岐の積に相当）は `branches`（分岐の和）の
        部分集合であるため、未移行側が余分に見せることは構造上あり得ない** —— 移行中の乖離は
        常に deny 側へ倒れる。
      required: [userId, allowedFilters, granted]
      properties:
        userId: { type: string }
        granted:
          type: boolean
          description: >-
            許可ポリシーが 1 つでも一致したか。`false` は「閲覧可能な文書が無い」を意味し、
            `allowedFilters` が空でも**全件開放ではない**。
        allowedFilters:
          type: array
          items:
            type: object
            description: "FR-05: 1 つの属性キーに対する許可値集合（`AttributeFilter`）"
            required: [key, allowedValues]
            properties:
              key: { type: string }
              allowedValues:
                type: array
                items: { type: string }
        branches:
          type: array
          nullable: true
          description: >-
            FR-19, ADR-0036, ADR-0046 D-06: `read` の選言を運ぶ名前つき分岐（`AccessScopeBranch`）。
            **分岐内のフィルタは AND、分岐どうしは OR。** 空／未指定なら `allowedFilters` で評価する。
            `name` は監査・デバッグ用の識別子（`attribute` / `owner` / `shared`）であり、
            **どの分岐で可視になったかを言えるようにするために持たせている。**
          items:
            type: object
            required: [name, filters]
            properties:
              name: { type: string }
              filters:
                type: array
                items:
                  type: object
                  required: [key, allowedValues]
                  properties:
                    key: { type: string }
                    allowedValues:
                      type: array
                      items: { type: string }

    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        originalUri: { type: string, nullable: true }
        contentType: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }

    UpdateDocumentRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        expectedVersion: { type: integer, nullable: true, description: "楽観的並行制御。現在版と不一致なら 409" }
        changeNote: { type: string, nullable: true }

    UpdateMetadataRequest:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        expectedVersion: { type: integer, nullable: true, description: "楽観的並行制御。現在版と不一致なら 409" }
        changeNote: { type: string, nullable: true }

    # ── FR-06, SC-03/SC-05: 文書（BFF ↔ SPA 契約）─────
    # 状態・種別を表す文字列は **enum にしない**。C# 側は `string` であり、値集合は
    # `DocumentStatus` 等の const 群にすぎない。閉じた enum にすると、後段が値を増やしたときに
    # SPA が既存の値を解釈できなくなる（既存画面は「未知の値も受け取る」を明示的な仕様としている）。
    DocumentDto:
      type: object
      description: "FR-06: 文書 1 件（`Knowledge.Contracts/Dtos/DocumentDto.cs`）"
      required: [id, title, status, version, attributes, tags, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status:
          type: string
          description: "公開ライフサイクル（`draft` / `normalized` / `published` / `archived`）。**変換結果ではない**"
        markdownUri: { type: string, nullable: true }
        version: { type: integer, description: "FR-06, UC-03: 現在の版番号（楽観ロックの `expectedVersion` に渡す）" }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentContentDto:
      type: object
      description: |
        SC-03, FR-06: 文書本文（正規化 Markdown）。BFF が ABAC 判定後にオブジェクトストレージ
        （`storage://`）から読み取り、閲覧を許可された呼び出し元にのみ払い出す。
      required: [id, title, markdown]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        markdown: { type: string }
        sourceUri: { type: string, nullable: true }

    DocumentVersionDto:
      type: object
      description: |
        FR-06, UC-03: 文書の版スナップショット（**メタデータのみ**）。
        **本文の参照（`markdownUri`）は持たない**（#1011）。本文のオブジェクトキーは文書 ID だけで
        決まり再投入が上書きするうえ、参照 URI は versionId を持たないため、
        「その版の本文」を指せる値が存在しない。現行版の本文は `DocumentContentDto` で取る。
      required: [documentId, version, title, status, attributes, tags, createdAt]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer }
        title: { type: string }
        status: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        changeNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    VersionConflictDto:
      type: object
      description: |
        FR-06, UC-03: 楽観的並行制御の競合（409）。**RFC7807 ではない素の JSON** である
        （`Results.Conflict(new { error, expectedVersion, currentVersion })`）。
      required: [error, expectedVersion, currentVersion]
      properties:
        error: { type: string, example: "version_conflict" }
        expectedVersion: { type: integer }
        currentVersion: { type: integer }

    InvalidTransitionDto:
      type: object
      description: |
        FR-06, UC-03, SC-05: 不正な状態遷移（409）。**RFC7807 ではない素の JSON** である
        （`Results.Conflict(new { error, from, to })`）。
      required: [error, from, to]
      properties:
        error: { type: string, example: "invalid_transition" }
        from: { type: string, example: "archived" }
        to: { type: string, example: "published" }

    # ── FR-01/FR-02, SC-06: データソース ──────────────
    DataSourceDto:
      type: object
      description: |
        FR-01, UC-04, SC-06: データソース 1 件（`Knowledge.Contracts/Dtos/DataSourceDto.cs`）。
        IADR-0053: `config` の**秘密キー（token / password / secret / credential を含むキー）は
        後段が `***` へマスク済み**である。SPA から秘密を埋め込むことはしない。
        SC-06（planning#200 / 裁定 Q15）: `nextSyncAt` は**共通間隔の次回実行時刻**であり
        **全ソースで同じ値**になる。ソース別スケジュールは持たない（IADR-0136）。
        SC-06（同 裁定 Q14 / #537）: 同期健全性（`consecutiveFailureCount` / `retryLimit` /
        `lastSyncError`）を持つ。`status` は健全性を表さない（`active` / `disabled` の設定状態のみ）。
      required:
        [
          id,
          name,
          sourceType,
          connectionUri,
          status,
          config,
          defaultAttributes,
          createdAt,
          consecutiveFailureCount,
          retryLimit,
        ]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sourceType: { type: string, description: "コネクタ種別（`filesystem` / `wiki` / `saas` / `db` ほか）" }
        connectionUri: { type: string }
        status: { type: string, description: "`active` / `disabled`。**同期の健全性は表さない**" }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        config:
          type: object
          additionalProperties: { type: string }
          description: "コネクタ設定（秘密キーはマスク済み）"
        defaultAttributes:
          type: object
          additionalProperties: { type: string }
          description: "FR-05: 原本へ付与する既定 ABAC 文書属性（`confidentiality` 等）"
        createdAt: { type: string, format: date-time }
        nextSyncAt:
          type: string
          format: date-time
          nullable: true
          description: |
            SC-06: 定期同期（全ソース共通の間隔）の**次回実行時刻**。**全ソースで同じ値**を返す。
            定期同期が無効なとき（`DataSourceSync:Enabled=false`。compose / dev の既定）は `null`。
        consecutiveFailureCount:
          type: integer
          description: |
            SC-06（裁定 Q14 / #537）: UC-04 例外フローの**連続同期失敗回数**。完全成功で 0 へ戻る。
            `retryLimit` に達した時点が「継続失敗」であり、アラート（構造化ログ `Alert=true`）が出る。
            画面はこの値と `retryLimit` から**琥珀（警告）**を描く。
        retryLimit:
          type: integer
          description: |
            SC-06（裁定 Q14 / #537）: 再試行上限。**継続失敗のしきい値そのもの**である
            （計画「「継続失敗」のしきい値は再試行上限に達した時点とする」）。
            画面が「3/5」の分母を契約から得るために返す（画面へ定数を複写させない）。
        lastSyncError:
          type: string
          nullable: true
          description: |
            SC-06（裁定 Q14 / #537）: 直近の同期エラー。**後段が保存時点でマスク済み**である
            （接続文字列・資格情報つき URI・`Bearer` トークンを伏せる。IADR-0053 と同じ守り）。
        lastSyncErrorAt:
          type: string
          format: date-time
          nullable: true
          description: "SC-06（裁定 Q14 / #537）: 直近の同期エラーの発生時刻。"
        ownerMappings:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: |
            FR-05, SC-06（ADR-0074 決定 1 / #1194）: `owner` の**写像表**（データソース単位）。
            キーが**ソース側の利用者識別子**、値が**基盤の利用者識別子**（ログイン名）である。
            **既定属性（`defaultAttributes`）とは別の器**であり、片方の更新はもう片方を消さない。
            **マスクしない**（対の両側とも識別子であり秘密ではない）。

    CreateDataSourceRequest:
      type: object
      required: [name, sourceType, connectionUri]
      properties:
        name: { type: string }
        sourceType: { type: string }
        connectionUri: { type: string }
        config:
          type: object
          nullable: true
          additionalProperties: { type: string }
        defaultAttributes:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: "未指定時は後段が必須属性のフェイルセーフを通る（confidentiality=internal / owner=system / department=unassigned / lifecycle=active）。明示指定は上書きしない"
        ownerMappings:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: |
            FR-05, SC-06（ADR-0074 決定 1・4 / #1194）: `owner` の写像表。未指定は空。
            🔴 **写像先の実在は後段が検証する。実在しない値を含む要求は 400 で拒否され、1 対も保存されない**
            （誤った写像は偽の所有者を作り、ADR-0036 の裁量制御が意図しない相手に開く）。
            名簿を引けなかったときは **502**（「存在しない」と報告しない）。

    UpdateDataSourceRequest:
      type: object
      description: |
        FR-01, UC-04, SC-06（裁定 Q16 / #534）: データソース更新（全置換）。
        **`id` / `createdAt` / `lastSyncedAt` / 同期健全性は含まない**（更新で履歴を巻き戻さない）。
        **`config` / `defaultAttributes` は必須である**（#627 の AI レビュー 🟡）——
        省略を許すと「送り忘れ」で秘密が黙って消える。消すときは `{}` を明示する。
      required: [name, sourceType, connectionUri, config, defaultAttributes]
      properties:
        name: { type: string }
        sourceType: { type: string }
        connectionUri: { type: string }
        config:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: |
            コネクタ設定。**必須**（省略は 400）。消すときは `{}` を送る。
            **秘密キーの値が `***`（応答のマスク）のときは保存されず既存値が保たれる**
            （IADR-0148 決定 6）。読んで書き戻す往復が資格情報を壊さない。
        defaultAttributes:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: "未指定時は後段が必須属性のフェイルセーフを通る（confidentiality=internal / owner=system / department=unassigned / lifecycle=active）。明示指定は上書きしない"
        ownerMappings:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: |
            FR-05, SC-06（ADR-0074 決定 1 / #1194）: `owner` の写像表。
            🔴 **`config` / `defaultAttributes` と違い、省略は 400 ではなく現状維持である。**
            全置換の必須指定は契約の初期からある規約であり、後から足した項目を必須にすると
            既存の PUT クライアントが一斉に 400 になる。空にするときは `{}` を送る。

    PatchDataSourceRequest:
      type: object
      description: |
        FR-01, UC-04, SC-06（裁定 Q16 / #534）: データソース部分更新。
        **省略した項目は現状維持**である（`null` は「変更しない」を意味する）。
      properties:
        name: { type: string, nullable: true }
        sourceType: { type: string, nullable: true }
        connectionUri: { type: string, nullable: true }
        config:
          type: object
          nullable: true
          additionalProperties: { type: string }
        defaultAttributes:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: "指定したときのみ差し替える。差し替え時も必須属性のフェイルセーフを通す（confidentiality / owner / department / lifecycle）"
        ownerMappings:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: |
            FR-05, SC-06（ADR-0074 決定 1・4 / #1194）: `owner` の写像表。**`null` は現状維持**。
            指定したときは全置換であり、**既定属性とは独立**である（片方だけ送っても他方は消えない）。
            写像先の実在は後段が検証する（実在しない値は 400・名簿を引けなければ 502。いずれも保存しない）。

    DataSourceSyncResultDto:
      type: object
      description: |
        FR-01, UC-04: 手動同期の結果（202 の本文）。契約 record を持たず、
        `DataSourceEndpoints` の匿名型がそのまま JSON になる。
      required: [fetched, failed, connectorAvailable]
      properties:
        fetched: { type: integer, description: "取得できた原本の件数" }
        failed: { type: integer, description: "取得に失敗した件数" }
        connectorAvailable:
          type: boolean
          description: "IADR-0051: 当該 sourceType のコネクタが DI 登録されているか。false は縮退（5xx にしない）"
        message: { type: string, nullable: true }

    # ── FR-12, SC-07: 変換ジョブ ──────────────────────
    ConversionJobDto:
      type: object
      description: "FR-12, UC-06, SC-07: 変換ジョブの状況（`Knowledge.Contracts/Dtos/ConversionJobDto.cs`）"
      required:
        [
          id,
          sourceId,
          sourceType,
          originalPath,
          status,
          attempts,
          deadLettered,
          maxAttempts,
          createdAt,
          updatedAt,
          diagramsCoded,
          diagramsRetained,
          hasCorrection,
          bodyAbsent,
        ]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        sourceType: { type: string }
        originalPath: { type: string }
        status:
          type: string
          description: "`queued` / `processing` / `succeeded` / `failed`。**`failed` のみ再変換できる**（「本文なしで完了」は `succeeded` の内訳 `bodyAbsent` であり、再変換の対象に並ばない）"
        error: { type: string, nullable: true, description: "失敗ジョブの理由" }
        documentId: { type: string, format: uuid, nullable: true }
        markdownUri: { type: string, nullable: true }
        attempts: { type: integer, description: "変換試行の累計。**手動再変換をまたいで累積する**ため `maxAttempts` を超え得る" }
        deadLettered:
          type: boolean
          description: |
            **デッドレター標識**（05_screens §SC-07・裁定 Q13）。自動再試行を使い切って
            `<queue>_error` へ送られた失敗か。**`status` の 5 値目ではない**——同節は
            「ジョブ状態モデルは 4 値である…デッドレターの表示は `failed` の内訳として扱う」と定める。
            `true` は「人が原本に手を入れるまで自動では直らない」信号であり、`status` が `failed` の
            ときだけ真になる（再変換を受け付けた時点で `false` へ戻る）。
        maxAttempts:
          type: integer
          description: |
            **試行上限**（同上）。1 回の配信で行う自動再試行の上限（初回 ＋ 再試行）。
            **手動再変換の回数上限ではない**（同節「手動再変換の回数上限は設けない」）。
            全ジョブで同じ値を返す（実体は変換サービスの再試行設定）。
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        diagramsCoded:
          type: integer
          description: "図のうち LLM がコード化できた件数（hi-fi:422「Mermaid 2図」の導出元）"
        diagramsRetained:
          type: integer
          description: |
            図のうち**画像保持へ縮退した件数**（＝人手補正 Phase 1 の対象数）。
            hi-fi:420「✕ 図コード化失敗（画像保持へ縮退済み）」は**ここから導出する表示**であり、
            **`status` の 5 値目ではない**——縮退はジョブの失敗ではなく、`status` は `succeeded` である
            （05_screens:320「ジョブ状態モデルは 4 値である」。`deadLettered` と同じ扱い）。
        hasCorrection:
          type: boolean
          description: |
            **「補正あり」の標識**（hi-fi:422。05_screens:313）。人手補正が入った図があるか。
            `true` のジョブを再変換すると補正は失われるため、`retry` は 409
            `corrections_would_be_lost` で明示確認を求める（IADR-0154 決定 4）。
        bodyAbsent:
          type: boolean
          description: |
            **「本文なしで完了」の標識**（ADR-0070 決定 3）。テキスト層を持たない PDF（スキャン等）は
            本文が存在しないため、`failed` にせず **`succeeded` の内訳**として理由つきで表示する。
            **`status` の 5 値目ではない**（`deadLettered` / `diagramsRetained` と同じ扱い）。
            `true` のジョブは再試行してもデッドレターへ送っても結果が変わらないため、再変換の対象に並ばない。
            `markdownUri` は空の本文を指す（原本参照のみの文書）。`status` が `succeeded` のときだけ真。

    ConversionFigureDto:
      type: object
      description: "FR-12, UC-06, SC-07: 変換ジョブが抽出した図（`Knowledge.Contracts/Dtos/ConversionFigureDto.cs`）"
      required: [figureId, coded, corrected]
      properties:
        figureId: { type: string, description: "ジョブ内で一意。本文の埋め込み位置を突き止める鍵でもある" }
        coded:
          type: boolean
          description: "LLM がコード化できたか。**`false` が人手補正 Phase 1 の対象**である"
        language: { type: string, nullable: true, description: "`plantuml` / `mermaid`" }
        code: { type: string, nullable: true, description: "コード片（自動コード化または人手補正の結果）" }
        imageUri: { type: string, nullable: true, description: "縮退した図の画像参照。コード化済みの図は null" }
        imageContentType: { type: string, nullable: true }
        caption: { type: string, nullable: true, description: "キャプション・近傍テキスト（補正の手がかり）" }
        corrected:
          type: boolean
          description: "**人手補正で `code` が入ったか**（自動コード化と区別する）"
        correctedAt: { type: string, format: date-time, nullable: true }

    FigureCorrectionRequest:
      type: object
      description: "FR-12, UC-06, SC-07: 人手補正の投稿（Phase 1 は図のコード片のみ）"
      required: [language, code]
      properties:
        language: { type: string, description: "`plantuml` / `mermaid`" }
        code: { type: string, description: "図のコード片。**Markdown 全体ではない**（Phase 2 の範囲）" }

    FigureCorrectionResultDto:
      type: object
      description: "FR-12, UC-06, SC-07: 人手補正の結果"
      required: [figureId, markdownUri, correctedFigures]
      properties:
        figureId: { type: string }
        markdownUri: { type: string, description: "差し替え後の本文（画面が SC-03 への導線を張れるように返す）" }
        correctedFigures: { type: integer, description: "このジョブで補正済みの図の件数" }

    ConversionRetryConflictDto:
      type: object
      description: "FR-12, SC-07: 再変換の 409 本文。**BFF が透過する**（IADR-0154 決定 4）"
      required: [error]
      properties:
        error: { type: string, description: "`not_retryable` / `corrections_would_be_lost`" }
        status: { type: string, nullable: true, description: "拒否時点のジョブ状態" }
        correctedFigures:
          type: integer
          nullable: true
          description: "`corrections_would_be_lost` のとき、再変換で失われる補正の件数"

    ConversionCorrectionConflictDto:
      type: object
      description: "FR-12, SC-07: 人手補正の 409 本文"
      required: [error]
      properties:
        error:
          type: string
          description: "`figure_not_correctable` / `job_busy` / `body_unavailable`"

    # ── FR-09, SC-09: ABAC 管理（属性辞書・ポリシー）───
    AbacPolicyDto:
      type: object
      description: "FR-09: ABAC ポリシー（利用者属性 × 文書属性 → 許可アクション）"
      required: [id, name, action, userConditions, documentConditions, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        action: { type: string, description: "`read` / `analyze` / `manage` / `write`（`enum` にしない。値域の正は `PolicyAction`）" }
        userConditions:
          $ref: "#/components/schemas/AbacConditionMap"
        documentConditions:
          $ref: "#/components/schemas/AbacConditionMap"
        isActive: { type: boolean, description: "削除せず一時停止できるようにするための有効フラグ" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AbacConditionMap:
      type: object
      description: |
        FR-09: 属性キー → 許可値の集合（例 `{"department": ["sales","hr"]}`）。
        契約が表現するのは**集合への所属**だけであり、比較演算子・包含などの式は表現しない。
        #520: **`required` を入れない**——`properties` を持たない写像（`additionalProperties` のみ）で、
        `required` は `properties` のキーを指すため適用できない。本スキーマは唯一「要求と応答の両方」で
        使われるが、この理由で要求側への波及も起こらない。
      additionalProperties:
        type: array
        items: { type: string }

    AttributeDefinitionDto:
      type: object
      description: "FR-09: 属性辞書エントリ（管理者が定義する取りうる値）"
      required: [id, key, label, allowedValues, required, scope, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: "confidentiality" }
        label: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        required: { type: boolean }
        scope: { type: string, description: "`document` / `user`。**Key と併せて一意**で、登録後は不変" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    ValidatePolicyResponse:
      type: object
      description: |
        FR-05, FR-09, SC-09（裁定 Q23 / #535）: ポリシーの dry-run 検証の結果。
        **保存していない。** `valid: false` でも HTTP は 200 である
        （矛盾が見つかったことは要求の失敗ではない）。
        `errors` の内容は保存時の 400（`errors.errors`）と**同じ検証から出る**。
      required: [valid, errors]
      properties:
        valid: { type: boolean, description: 矛盾が無ければ true }
        errors:
          type: array
          items: { type: string }
          description: "矛盾の理由（日本語）。`valid: true` のときは空配列。"

    CreatePolicyRequest:
      type: object
      required: [name, action, userConditions, documentConditions]
      description: "FR-09, UC-05: ポリシーの登録・更新（更新も同じ型を用いる）"
      properties:
        name: { type: string }
        action: { type: string, description: "`read` / `analyze` / `manage` / `write`（`enum` にしない。値域の正は `PolicyAction`）" }
        userConditions:
          $ref: "#/components/schemas/AbacConditionMap"
        documentConditions:
          $ref: "#/components/schemas/AbacConditionMap"

    SetActiveRequest:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }

    CreateAttributeRequest:
      type: object
      required: [key, label, allowedValues, required]
      properties:
        key: { type: string }
        label: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        required: { type: boolean }
        scope:
          type: string
          nullable: true
          description: "`document` / `user`。未指定は `document`"

    UpdateAttributeRequest:
      type: object
      required: [label, allowedValues, required]
      description: "FR-09: 属性辞書の更新。**Key / Scope は同一性・一意制約の基礎のため不変で、受け取らない**"
      properties:
        label: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        required: { type: boolean }

    # ── RFC7807（Problem Details）──────────────────────
    ProblemDetails:
      type: object
      description: |
        RFC7807。`Results.Problem(title, detail, statusCode)` が返す形。
        #520: **`required` を入れない**——RFC7807 はどのメンバーも省略され得る（指定しなかった項目は
        出力されない）。ここで必須化すると、実在しない保証を生成型に持たせることになる。
      properties:
        type: { type: string, nullable: true }
        title: { type: string, nullable: true }
        status: { type: integer, nullable: true }
        detail: { type: string, nullable: true }
        instance: { type: string, nullable: true }

    ValidationProblemDetails:
      type: object
      description: |
        RFC7807 の検証エラー。`Results.ValidationProblem` が返す形で、
        AuthorizationService は `errors.errors` に**メッセージの配列**を束ねる
        （キーごとの配列という一般形に載せた運用。`apiClient.parseProblemDetails` がこれを平坦化する）。
        #520: **`required` を入れない**（理由は `ProblemDetails` と同じ）。
      properties:
        type: { type: string, nullable: true }
        title: { type: string, nullable: true }
        status: { type: integer, nullable: true }
        detail: { type: string, nullable: true }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    # ── FR-08: Feedback ───────────────────────────────
    FeedbackRequest:
      type: object
      required: [answerId, rating]
      properties:
        answerId:
          type: string
          format: uuid
          description: "対象 AI 回答の ID（AiAnswerDto 由来）。空 Guid は不可"
        rating:
          type: string
          enum: [up, down]
          description: "👍（up）/ 👎（down）"
        comment:
          type: string
          nullable: true
          maxLength: 2000
          description: "自由記述（任意、最大 2000 文字）"
        question:
          type: string
          nullable: true
          maxLength: 1000
          description: "回答の元となった質問（品質レビュー用の文脈。任意、最大 1000 文字）。超過分は拒否せず黙って切り詰める"

    FeedbackDto:
      type: object
      description: "FR-08: 保存済みフィードバック（`Knowledge.Contracts/Dtos/FeedbackDto.cs`）"
      required: [id, answerId, rating, userId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        answerId: { type: string, format: uuid }
        rating: { type: string, enum: [up, down] }
        comment: { type: string, nullable: true }
        question: { type: string, nullable: true }
        userId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    BffIdentityDto:
      type: object
      description: |
        SC-16: 現在ログインしている利用者。**トークンを含めない**（ADR-0032）。
      required: [name, subject, roles]
      properties:
        name:
          type: string
          description: "表示名（Keycloak の preferred_username）"
        subject:
          type: string
          description: "認可サーバ上の一意な識別子（sub）"
        roles:
          type: array
          items: { type: string }
          description: "実効ロール"
        logoutUrl:
          type: string
          nullable: true
          description: "ログアウト先（セッションの sid を含む）。sid を持たないセッションでは null"
    FeedbackStatsDto:
      type: object
      description: "フィードバック集計（satisfactionRate = up / total、total=0 のとき 0）"
      required: [up, down, total, satisfactionRate]
      properties:
        up: { type: integer }
        down: { type: integer }
        total: { type: integer }
        satisfactionRate: { type: number, format: double }

    # ── FR-22 / UC-11: Notifications（IADR-0215）────────
    #
    # ★ **タイトル・本文に相当する項目を 1 つも持たない。** 種別・件数・閾値・期限・発生時刻・既読だけで
    # 構成し、表示文言はフロントが Lingui カタログから組み立てる（IADR-0215 決定 2）。
    # 契約テストがこの項目集合そのものを固定するので、`title` / `body` 等を足すと CI が落ちる。
    NotificationDto:
      type: object
      description: |
        FR-22: 利用者本人へのアプリ内通知 1 件。**本文は件数と期限のみ**で構成され、資料のタイトル・
        本文・検索語・回答内容を含まない（ADR-0037 決定 6）。宛先は所有者本人のみである。
        nullable な 3 項目（count / thresholdPercent / deadline）は種別によって現れ方が違う
        （IADR-0132: nullable は required に入れない）。
      required: [id, kind, occurredAt, read]
      properties:
        id: { type: string, format: uuid }
        kind:
          # ★ **閉じた enum にしない**（BFF_bff-surface.md §横断の規約 4）。閉じると、後段が種別を
          #   増やした瞬間に、まだ再デプロイされていない SPA が**既存の値も解釈できなくなる**。
          #   値集合はこの description が持ち、画面側の対応づけは notificationMessages.ts の
          #   純関数（既定枝つき）が持って単体テストで固定する —— 規約 4 が指示する置き方である。
          type: string
          description: |
            通知の種別。①個人資料の削除通知（週次 / 7 日前 / 事後。ADR-0037 決定 6）
            ②保存容量の警告（80% / 95% で各 1 回。ADR-0037 決定 17）
            ③同期トークンの期限予告（7 日前。ADR-0037 決定 18）
        count:
          type: integer
          nullable: true
          minimum: 0
          description: "件数。①では対象資料の件数、③では対象トークンの件数。②は持たない"
        thresholdPercent:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: "②で到達した閾値（80 または 95）。①③は持たない"
        deadline:
          type: string
          format: date-time
          nullable: true
          description: "期限。①-a / ①-b は完全削除の実行時刻、③はトークンの失効時刻。①-c と②は持たない"
        occurredAt: { type: string, format: date-time, description: "通知が発生した時刻" }
        read: { type: boolean, description: "既読フラグ" }

    NotificationListDto:
      type: object
      description: "FR-22: 本人宛の通知一覧と未読件数。未読件数は limit / unreadOnly の影響を受けない全体値である"
      required: [items, unreadCount]
      properties:
        items:
          type: array
          items: { $ref: "#/components/schemas/NotificationDto" }
        unreadCount: { type: integer, minimum: 0, description: "本人宛の未読通知の総数（絞り込みに影響されない）" }

    NotificationReadResultDto:
      type: object
      description: "FR-22: 既読化の結果。更新後の未読件数を返す。ただし本文（read フラグ）も同時に変わるため、既定のクライアントは一覧を取り直す（この値はバッジだけを更新したい呼び出し元のための補助である）"
      required: [id, unreadCount]
      properties:
        id: { type: string, format: uuid, description: "既読にした通知の識別子" }
        unreadCount: { type: integer, minimum: 0, description: "更新後の未読件数" }

    # ── FR-13, UC-07, SC-04: Wiki（前段ゲートウェイの応答。#1199 / ADR-0073 決定 2）────
    #
    # 🔴 **対応する C# 契約 record は置かない。** これらの形は WikiService の内部 record
    # （`WikiPageSummary` / `WikiSearchHit` / `WikiPageView`）であり、BFF は本文を**そのまま透過**
    # するので型を通さない。`Shared.Contracts` へ持ち上げると、使う側が居ないまま
    # `check-contract-schema.js` の baseline だけが動く。
    # **すべて非 null**（後段は `System.Text.Json` で必ず出力する）ため required に全項目を挙げる。
    WikiPageSummary:
      type: object
      description: "FR-13: 一覧・ツリー表示用の軽量サマリ。本文と認可属性は含まない"
      required: [id, documentId, title, slug, wikiPath, status, syncedAt]
      properties:
        id: { type: string, format: uuid, description: "台帳（WikiPage）の識別子" }
        documentId: { type: string, format: uuid, description: "対応する文書の識別子" }
        title: { type: string, description: "表題。**台帳を正とする**（Wiki.js 側の写しではない）" }
        slug: { type: string, description: "ページのスラッグ" }
        wikiPath: { type: string, description: "Wiki.js 上の正準パス（doc/<documentId>）" }
        status: { type: string, description: "ページの状態。一覧に現れるのは Active のみ" }
        syncedAt: { type: string, format: date-time, description: "Wiki.js へ同期した時刻" }

    WikiSearchHit:
      type: object
      description: "FR-13, UC-07: 検索結果の 1 件。本文は含まない（本文は個別取得が ABAC 通過後にプロキシする）"
      required: [id, documentId, title, slug, wikiPath, syncedAt]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        title: { type: string, description: "表題。**台帳を正とする**（IADR-0021 と同じ分界）" }
        slug: { type: string }
        wikiPath: { type: string }
        syncedAt: { type: string, format: date-time }

    WikiPageView:
      type: object
      description: "FR-13, UC-07: 個別取得の応答。メタデータ ＋ **Wiki.js が描画した本文**（ゲートウェイは本文を自前で保持しない。IADR-0020）"
      required: [id, documentId, title, slug, wikiPath, status, syncedAt, content]
      properties:
        id: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        title: { type: string }
        slug: { type: string }
        wikiPath: { type: string }
        status: { type: string }
        syncedAt: { type: string, format: date-time }
        content: { type: string, description: "Wiki.js が描画した本文（HTML）。ABAC 通過時のみ返る" }

    # ── FR-10: Dashboard ──────────────────────────────
    UsageEventRequest:
      type: object
      required: [eventType]
      properties:
        eventType:
          type: string
          enum: [search, answer]
          description: "検索実行（search）/ AI 回答生成（answer）"
        query:
          type: string
          nullable: true
          description: "検索語（種別が search のとき任意。検索傾向の集計に用いる）"

    UsageEventCreatedDto:
      type: object
      description: |
        FR-10: 記録された利用イベントの ID。契約 record を持たず、`DashboardEndpoints` の匿名型
        （`new { ev.Id }`）がそのまま JSON になる。`UsageEvent.Id` は非 null の `Guid`。
      required: [id]
      properties:
        id: { type: string, format: uuid }

    UsagePointDto:
      type: object
      description: "日次利用状況の 1 点（日付 × 種別の件数）"
      required: [date, eventType, count]
      properties:
        date: { type: string, format: date }
        eventType: { type: string, enum: [search, answer] }
        count: { type: integer }

    SearchTrendDto:
      type: object
      description: "検索傾向の 1 点（検索語 × 件数）"
      required: [term, count]
      properties:
        term: { type: string }
        count: { type: integer }

    DashboardUsageDto:
      type: object
      description: "DashboardService が返す利用側サマリ（回答品質は含まない）"
      required: [totalSearches, totalAnswers, usageTrend, topSearchTerms, searchTermMinCount]
      properties:
        totalSearches: { type: integer }
        totalAnswers: { type: integer }
        usageTrend:
          type: array
          items:
            $ref: "#/components/schemas/UsagePointDto"
        topSearchTerms:
          type: array
          description: "出現件数が searchTermMinCount 以上の語だけを含む"
          items:
            $ref: "#/components/schemas/SearchTrendDto"
        searchTermMinCount:
          type: integer
          description: |
            検索傾向に出す最小の出現件数。これ未満の語は落とす（「その他 M 件」も出さない）。
            構成キー `SearchTrend:MinimumCount`（既定 3）。不正値は既定へ倒し、本項目も倒した後の値を返す。

    DashboardSummaryDto:
      type: object
      description: "BFF が組み立てるダッシュボードサマリ（利用状況・検索傾向・回答品質を集約）"
      required: [totalSearches, totalAnswers, usageTrend, topSearchTerms, quality, searchTermMinCount]
      properties:
        totalSearches: { type: integer }
        totalAnswers: { type: integer }
        usageTrend:
          type: array
          items:
            $ref: "#/components/schemas/UsagePointDto"
        topSearchTerms:
          type: array
          description: "出現件数が searchTermMinCount 以上の語だけを含む"
          items:
            $ref: "#/components/schemas/SearchTrendDto"
        quality:
          $ref: "#/components/schemas/FeedbackStatsDto"
        searchTermMinCount:
          type: integer
          description: "検索傾向の出現件数の下限。後段（DashboardService）の値をそのまま透過する"

    # ── FR-11: LlmGateway completion ──────────────────
    CompletionApiRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        maxTokens:
          type: integer
          default: 4096
          description: >-
            出力トークン上限。thinking（拡張思考）が既定で有効なモデル（Opus 5 / Sonnet 5 等）では
            思考トークンと本文の合算上限になるため、既定は本文想定長＋思考の作業領域を見込んだ
            4096 とする（IADR-0101）。小さすぎると本文が空または途中で切れる。
        model:
          type: string
          nullable: true
          description: "明示要求モデル。null の場合はゲートウェイが用途（purpose）に応じて選択する"
        confidentiality:
          type: string
          nullable: true
          enum: [public, internal, confidential, restricted]
          description: |
            入力文書の最高機密区分（大文字小文字は無視）。越境マトリクスで呼び出し先を判定する。
            未指定（null/空）・未知の値は安全側の restricted に倒す（fail-safe, deny-by-default）。
        purpose:
          type: string
          nullable: true
          description: "用途。null/空は default 扱い"

    CompletionApiResponse:
      type: object
      description: |
        sent=false は機密区分による送信拒否（縮退）または呼び出し先不調を示す。
        IADR-0104: sent（越境させたか）と stopReason（モデル側の終了理由）は独立した軸である。
      required: [text, model, inputTokens, outputTokens, sent]
      properties:
        text: { type: string }
        model: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        sent: { type: boolean }
        endpoint:
          type: string
          nullable: true
          description: "選択・拒否した呼び出し先（監査・縮退表示用）"
        routingReason:
          type: string
          nullable: true
          description: "選択・拒否の理由（監査・縮退表示用）"
        stopReason:
          type: string
          nullable: true
          example: "refusal"
          description: |
            ADR-0025, IADR-0104: 送信が成立した場合のモデル側の終了理由。
            未送信（sent=false）・`finish_reason` を返さないプロバイダでは null。既知の語彙は
            `end_turn` / `max_tokens` / `refusal` / `stop_sequence` / `tool_use` だが、**閉じた enum にはしない**。
            語彙が増えたときに未知の値を弾かず、そのまま透過してログ・監査に残すためである。
            IADR-0109 (#394): この語彙は**プロバイダ横断の正準語彙**（Anthropic の stop_reason 由来）である。
            OpenAI 互換 API を呼ぶプロバイダ（セルフホスト＝ティアA / Copilot＝ティアC）は
            `choices[].finish_reason` をゲートウェイ側で正規化して返す
            （`stop`→`end_turn` / `length`→`max_tokens` / `content_filter`→`refusal` /
            `tool_calls`・`function_call`→`tool_use`。未知値は原文のまま透過し warn ログに残る）。
            呼び出し側がプロバイダごとに語彙を出し分ける必要はない。
            - `refusal`: モデルが拒否した（安全性分類器による停止。OpenAI 互換の `content_filter` を含む）。
              **text は空**で返す（拒否直前の断片を下流の判断材料にしないため、ゲートウェイが破棄する）。
              「送信したが空応答」と混同してはならない。
            - `max_tokens`: 出力上限に到達した。thinking が既定で有効なモデルでは本文が空または
              途中で切れる（IADR-0101）。断片は破棄せずそのまま返す。
            - `end_turn`: 正常終了。

    # ── FR-15, IADR-0029: 構成情報 API（/bff/admin/config）─────
    EffectiveConfigDto:
      type: object
      description: "FR-15: 現在有効な実効構成（各サービスの自己申告を BFF が集約）"
      required: [version, pipeline, eventBindings, ports, connectors]
      properties:
        version:
          $ref: "#/components/schemas/ConfigVersionDto"
        pipeline:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStageDto"
        eventBindings:
          type: array
          items:
            $ref: "#/components/schemas/EventBindingDto"
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortSelectionDto"
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorDto"

    ConfigVersionDto:
      type: object
      description: |
        構成バージョン（適用中の構成定義の Git コミット・適用日時・適用者。GitOps 注入。未注入時は空）。
        #520: **`required` を入れない**——C# の 3 メンバーがすべて nullable である
        （`ConfigInfoDto.cs` の `ConfigVersionDto(string? GitCommit, DateTimeOffset? AppliedAt, string? AppliedBy)`）。
      properties:
        gitCommit: { type: string, nullable: true }
        appliedAt: { type: string, format: date-time, nullable: true }
        appliedBy: { type: string, nullable: true }

    ConfigVersionEntryDto:
      type: object
      description: |
        FR-15 (#139), IADR-0046: 構成バージョン履歴の 1 エントリ。正データ源は GitOps 層（Git / ArgoCD の
        適用履歴）で、API は永続化せず注入されたスライスを返す。`hadDrift` はその時点のドリフト有無
        （注入時に判明していれば設定、不明なら null＝画面は「—」と表示する）。
        #520: **`required` を入れない**——C# の 4 メンバーがすべて nullable である（#518 の判断を再確認した）。
      properties:
        gitCommit: { type: string, nullable: true }
        appliedAt: { type: string, format: date-time, nullable: true }
        appliedBy: { type: string, nullable: true }
        hadDrift: { type: boolean, nullable: true }

    PipelineStageDto:
      type: object
      description: "有効なパイプライン段（宣言と照合された実効値）"
      required: [name, service, consumer, input, outputs, enabled]
      properties:
        name: { type: string, example: "catalog" }
        service: { type: string, example: "document-service" }
        consumer: { type: string, description: "コンシューマ型完全名" }
        input: { type: string, example: "DocumentNormalized" }
        outputs:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    EventBindingDto:
      type: object
      description: "イベント接続（イベント型ごとの発行者・購読者）"
      required: [event, publishers, subscribers]
      properties:
        event: { type: string, example: "DocumentUpdated" }
        publishers:
          type: array
          items: { type: string }
        subscribers:
          type: array
          items: { type: string }

    PortSelectionDto:
      type: object
      description: "ポート（LLM・埋め込み・ベクトルDB・ストレージ・Wiki 同期等）で選択中の実装と接続先識別子"
      required: [port, implementation]
      properties:
        port: { type: string }
        implementation: { type: string }
        target: { type: string, nullable: true }

    ConnectorDto:
      type: object
      description: "データソースコネクタと有効・無効状態"
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }

    DriftReportDto:
      type: object
      description: "FR-15: 宣言（Git 上の pipeline.json）と実効構成のドリフト検出結果"
      required: [hasDrift, checkedAt, findings]
      properties:
        hasDrift: { type: boolean }
        checkedAt: { type: string, format: date-time }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DriftFindingDto"

    DriftFindingDto:
      type: object
      description: "個々の不一致（自己申告到達不能は Unverifiable として縮退報告）"
      required: [kind, severity, target, detail]
      properties:
        kind: { type: string, example: "UndeclaredSubscription" }
        severity: { type: string, example: "Warning" }
        target: { type: string }
        detail: { type: string }

    # ── IADR-0025: 埋め込みゲートウェイ（/embed）─────
    EmbedApiRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "埋め込み対象テキスト（取り込みは本文全量を送るため機密区分で越境判定）" }
        confidentiality:
          type: string
          nullable: true
          enum: [public, internal, confidential, restricted]
          description: "機密区分（大文字小文字は無視）。confidential/restricted はティアA固定・外部送信しない"
        purpose:
          type: string
          enum: [index, query]
          default: index
          description: "用途。query は検索対象コレクションと次元を一致させるため既定外部経路へ固定"

    EmbedApiResponse:
      type: object
      description: "embedded=false は機密区分による送信拒否（fail-closed）・次元不整合・呼び出し失敗を示す"
      required: [vector, dimensions, model, collection, embedded, retryable]
      properties:
        vector:
          type: array
          items: { type: number, format: float }
        dimensions: { type: integer, example: 1024 }
        model: { type: string, example: "voyage-3.5" }
        collection: { type: string, example: "knowledge_chunks_voyage_3_5", description: "モデル別コレクション名" }
        embedded: { type: boolean }
        endpoint: { type: string, nullable: true, description: "選択・拒否した送信先（監査・縮退表示用）" }
        routingReason: { type: string, nullable: true, description: "選択・拒否の理由（監査・縮退表示用）" }
        retryable:
          type: boolean
          description: "true は一時障害（呼び出し側は再試行）。false は恒久理由（呼び出し側はスキップ）"

    # ── FR-19 / FR-20, SC-19 / SC-20, UC-11（#451）: 個人資料と同期端末 ────────────────
    # C# 側の正本は `Knowledge.Contracts/Dtos/PrivateNoteDto.cs`。
    # プロパティ集合の一致は `scripts/check-openapi-dto-drift.js` が保つ。
    PrivateNoteDto:
      type: object
      description: |
        FR-19, SC-19: 個人資料 1 件（台帳の投影）。**本文は含まない** ——
        本文編集は Obsidian 経路のみである（ADR-0046）。
        `bytes` は**最新版のバイト数**であり、版履歴は容量に算入しない（ADR-0037 決定 16）。
        `deleted` が真のとき `purgeAt` が完全削除の期限であり、SC-19 の「残り日数」と
        警告色（残り 7 日以内）の根拠になる。
        🔴 **所有者を運ぶ項目を持たない。** 誰の資料かは主体（JWT）で決まり、要求側が指定できない。
      required:
        [
          id,
          title,
          vaultPath,
          version,
          bytes,
          includeInSearch,
          includeInGraph,
          includeInAi,
          deleted,
          createdAt,
          updatedAt,
        ]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        vaultPath: { type: string, description: "Obsidian Vault 内の相対パス（例 設計メモ.md）" }
        version: { type: integer, format: int32, description: "版番号。1 編集 = 1 版で進む" }
        bytes: { type: integer, format: int64, description: "最新版のバイト数（版履歴は算入しない）" }
        contentHash: { type: string, nullable: true, description: "本文指紋。未同期の資料では null" }
        includeInSearch: { type: boolean, description: "横断検索に含める（既定 false）" }
        includeInGraph: { type: boolean, description: "ナレッジグラフに表示する（既定 false）" }
        includeInAi: { type: boolean, description: "AI の入力に含める（既定 false）" }
        deleted: { type: boolean, description: "論理削除済み（90 日は復元可）" }
        deletedAt: { type: string, format: date-time, nullable: true }
        purgeAt: { type: string, format: date-time, nullable: true, description: "完全削除の期限" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    PrivateNoteUsageDto:
      type: object
      description: |
        FR-19, SC-19, ADR-0037 決定 16・17: 保存容量の使用状況。
        **算入するのは最新版と論理削除済み（90 日保管中）**であり、版履歴は算入しない。
        `percent` は 80 / 95 / 100 の段階警告の判定に画面が使う。
      required: [usedBytes, limitBytes, percent]
      properties:
        usedBytes: { type: integer, format: int64 }
        limitBytes: { type: integer, format: int64, description: "既定 1 GB。管理者が最大 1 TB まで引き上げ可" }
        percent: { type: integer, format: int32 }

    PrivateNoteListResponse:
      type: object
      description: >-
        FR-19, SC-19: 一覧（削除済みを含む）と容量表示を 1 応答で返す。
        「うち削除済み」の内訳は画面が削除済み行の bytes を合算して出す（数え方を 2 つ持たない）。
      required: [usage, notes]
      properties:
        usage: { $ref: "#/components/schemas/PrivateNoteUsageDto" }
        notes:
          type: array
          items: { $ref: "#/components/schemas/PrivateNoteDto" }

    CreatePrivateNoteRequest:
      type: object
      description: >-
        FR-19, SC-19: 個人資料の新規作成。**タイトルのみで本文を受け取らない**
        （本画面にリッチエディタを描かない。ADR-0046 D-02）。
      required: [title]
      properties:
        title: { type: string }
        vaultPath:
          type: string
          nullable: true
          description: "Obsidian Vault 内の相対パス。省略時は `<タイトル>.md` を後段が採る"

    PurgePrivateNotesRequest:
      type: object
      description: >-
        FR-19, SC-19, ADR-0037 決定 20: 完全削除（即時・復元不可）。
        **単票も一括も同じ口**である（要素数の差でしかない）。
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string, format: uuid }

    PurgePrivateNotesResponse:
      type: object
      description: >-
        FR-19, SC-19: 完全削除の結果。`freedBytes` は確認ダイアログで示した
        「解放される容量」の確定値である。
      required: [purgedCount, freedBytes]
      properties:
        purgedCount: { type: integer, format: int32 }
        freedBytes: { type: integer, format: int64 }

    PrivateNoteDeletedResponse:
      type: object
      description: |
        FR-19, SC-19, ADR-0037 決定 19・20: 論理削除の結果。
        🔴 `capacityFreed` は**常に false** である —— 「削除しても容量は空きません
        （90 日間保管されます）」という SC-19 の固定文言の根拠を、散文ではなく機械可読な形で渡す。
      required: [capacityFreed]
      properties:
        deletedAt: { type: string, format: date-time, nullable: true }
        purgeAt: { type: string, format: date-time, nullable: true, description: "完全削除の期限" }
        capacityFreed: { type: boolean }

    UpdateExposureRequest:
      type: object
      description: >-
        FR-19, FR-20, SC-20: 露出 3 トグル（横断検索 / ナレッジグラフ / AI 入力）。
        **既定はいずれも OFF・3 つは独立**である。
      required: [includeInSearch, includeInGraph, includeInAi]
      properties:
        includeInSearch: { type: boolean }
        includeInGraph: { type: boolean }
        includeInAi: { type: boolean }

    # ── SC-12, FR-16, UC-09, ADR-0024: MCP クライアント登録管理 ──
    McpClientView:
      type: object
      description: |
        FR-16, UC-09, SC-12: 登録済み MCP クライアント 1 件。
        `kind` は `interactive`（有人）/ `service-account`（無人）の 2 値である。
        `attributes` は**無人アカウントにだけ意味がある** —— 有人は利用者本人の属性で解決される。
        `egressTier` はクライアント側 LLM のデータ保護水準であり、**未申告は最も低い水準へ倒れる**。
      required: [id, clientId, displayName, kind, enabled, attributes, egressTier, registeredAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        clientId: { type: string, description: "認可サーバーのクライアント ID（トークンの azp / client_id）" }
        displayName: { type: string }
        kind: { type: string, enum: [interactive, service-account] }
        enabled: { type: boolean, description: "false は次の呼び出しから即座に接続拒否" }
        attributes:
          type: object
          additionalProperties: { type: string }
          description: "無人アカウントへ明示的に割り当てる ABAC 属性（機密区分上限・アクセス可能タグ等）"
        egressTier: { type: string, enum: [self-hosted, protected-external, standard-external] }
        registeredAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    RegisterMcpClientRequest:
      type: object
      description: |
        FR-16, UC-09, SC-12: クライアント登録。`attributes` は**無人時に必須**であり、
        個人資料を読ませる割当は後段が 400 で拒否する。`egressTier` の未指定は
        最も低い保護水準（`standard-external`）として扱われる。
      required: [clientId, displayName, kind]
      properties:
        clientId: { type: string }
        displayName: { type: string }
        kind: { type: string, enum: [interactive, service-account] }
        attributes:
          type: object
          additionalProperties: { type: string }
          nullable: true
        egressTier:
          type: string
          enum: [self-hosted, protected-external, standard-external]
          nullable: true

    ReplaceMcpClientAttributesRequest:
      type: object
      description: "FR-16, UC-09, SC-12: 無人アカウントの ABAC 属性割当の**差し替え**（部分更新ではない）。"
      required: [attributes]
      properties:
        attributes:
          type: object
          additionalProperties: { type: string }

    PublishedToolView:
      type: object
      description: "FR-16, SC-12, ADR-0024 §5: 実効ツール 1 件（許可リスト ∩ 自己申告）。"
      required: [name, service, description, requiredScope, egressClass]
      properties:
        name: { type: string, description: "公開名" }
        service: { type: string, description: "供給元サービス" }
        description: { type: string }
        requiredScope: { type: string }
        egressClass: { type: string }

    ToolDriftView:
      type: object
      description: "FR-16, SC-12, ADR-0024 §5: 許可リストと自己申告の食い違い 1 件。"
      required: [kind, target, detail]
      properties:
        kind: { type: string }
        target: { type: string }
        detail: { type: string }

    EffectiveToolsView:
      type: object
      description: |
        FR-16, SC-12, ADR-0024 §5: 実効ツール一覧と構成ドリフト。
        **書き込みの口は無い** —— 公開範囲の変更は Git 経由の公開構成変更で行う（GitOps）。
      required: [version, tools, drifts]
      properties:
        version: { type: integer, description: "収集した公開構成の版" }
        tools:
          type: array
          items: { $ref: "#/components/schemas/PublishedToolView" }
        drifts:
          type: array
          items: { $ref: "#/components/schemas/ToolDriftView" }

    SyncDeviceDto:
      type: object
      description: |
        FR-20, SC-20: 同期端末 1 件。**トークンは平文もハッシュも載らない。**
        `active` は「未失効かつ期限内」であり、`expiresAt` との差から画面が
        「有効（残り日数）／期限切れ間近（残り 7 日以内）／期限切れ／失効」を描き分ける。
      required: [id, deviceName, issuedAt, expiresAt, revoked, active]
      properties:
        id: { type: string, format: uuid }
        deviceName: { type: string }
        issuedAt: { type: string, format: date-time }
        expiresAt: { type: string, format: date-time, description: "発行から 30 日" }
        revoked: { type: boolean }
        lastSyncAt: { type: string, format: date-time, nullable: true, description: "未同期なら null" }
        active: { type: boolean }

    CreateSyncDeviceRequest:
      type: object
      description: "FR-20, SC-20, ADR-0037 決定 11: 端末登録（同期トークンの発行）。管理者承認を挟まない。"
      required: [deviceName]
      properties:
        deviceName: { type: string }

    SyncTokenIssuedResponse:
      type: object
      description: |
        FR-20, SC-20, ADR-0037 決定 12・15: 発行・再発行の応答。
        🔴 **`token`（平文）が現れるのはこの型だけである。** 保存されるのはハッシュのみで、
        一覧にも他のどの応答にも平文は載らない（発行直後に一度だけ表示・再表示不可）。
        **自動更新（リフレッシュ）の口は存在しない** —— 更新は手動再発行だけである。
      required: [deviceId, deviceName, token, expiresAt]
      properties:
        deviceId: { type: string, format: uuid }
        deviceName: { type: string }
        token: { type: string, description: "平文の同期トークン。この応答でしか返らない" }
        expiresAt: { type: string, format: date-time, description: "発行から 30 日" }

    RevokeAllSyncDevicesResponse:
      type: object
      description: "FR-20, SC-20, ADR-0037 決定 13: 全端末の一括失効の結果（端末紛失時の防御）。"
      required: [revokedCount]
      properties:
        revokedCount: { type: integer, format: int32 }

    # ── SC-17, FR-05, FR-09, UC-05, ADR-0026: 利用者アカウント管理 ─
    PlatformUserDto:
      type: object
      description: |
        SC-17 主要素 1: 利用者一覧の 1 行（部門・ロール・ABAC 属性・状態）。
        **部門は `attributes.department` である** —— 独立した項目として複写しない。
      required: [id, username, displayName, enabled, roles, attributes]
      properties:
        id: { type: string, description: "認可サーバーにおける利用者 ID" }
        username: { type: string }
        displayName: { type: string }
        enabled: { type: boolean, description: "false は無効（全セッション失効済み）" }
        roles:
          type: array
          items: { type: string }
          description: "割り当て済みのロール（併任可）"
        attributes:
          type: object
          additionalProperties: { type: string }
          description: "ABAC 属性（部門・機密区分上限・タグ）。1 キー 1 値"

    ReplaceUserAttributesRequest:
      type: object
      description: |
        SC-17: ABAC 属性の割当（**差し替え**。部分更新ではない）。
        部門と機密区分上限は必須、タグは任意。値・キーとも属性辞書（利用者スコープ）に
        定義済みのものだけを受け付ける。
      required: [attributes]
      properties:
        attributes:
          type: object
          additionalProperties: { type: string }

    ReplaceUserRolesRequest:
      type: object
      description: |
        SC-17: ロール割当（**差し替え**。併任可）。空集合は 400 ——
        権限を剥がすのではなく無効化を使う。
      required: [roles]
      properties:
        roles:
          type: array
          items: { type: string }
