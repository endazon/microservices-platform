        許可リスト（宣言的公開構成）と各サービスの自己申告の**積**が実効ツールである。
        申告と構成の食い違いは `drifts` に出る。

        **本経路に書き込みは無い。** 公開範囲の変更は Git 経由の公開構成変更で行う
        （許可リスト方式・GitOps）。画面もこの経路の結果を参照するだけである。
      operationId: bff-mcp-list-tools
      responses:
