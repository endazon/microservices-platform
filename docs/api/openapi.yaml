openapi: "3.1.0"
info:
  title: Platform API
  description: |
    社内ナレッジ活用プラットフォーム — BFF + マイクロサービス統合仕様書
    FR-01, FR-03, FR-04, FR-05, FR-06, FR-07, FR-08, FR-09, FR-10, FR-11, FR-13,
    UC-01, UC-02, UC-05
  version: "0.1.0"
  contact:
    name: Platform Team
servers:
  - url: http://localhost:5000
    description: BFF (ローカル開発)
  - url: http://localhost:5001
    description: DocumentService (直接)
  - url: http://localhost:5003
    description: RetrievalService (直接)
  - url: http://localhost:5004
    description: AiAnalysisService (直接)
  - url: http://localhost:5005
    description: AuthorizationService (直接)
  - url: http://localhost:5007
    description: "LlmGateway — IADR-0017: 内部 API。通常は host 非公開でサービス間呼び出し専用（compose では expose のみ）。この URL は個別に dotnet run した場合のみ到達可能"

tags:
  - name: Analysis
    description: "FR-04, FR-07, UC-01, UC-02: AI 質問回答 (RAG) / 指定データ範囲の分析・比較・抽出"
  - name: Search
    description: "FR-03, UC-01: ベクトル検索"
  - name: Documents
    description: "FR-06, UC-03: ドキュメント管理"
  - name: DataSources
    description: "FR-01, UC-04: データソース管理"
  - name: Authorization
    description: "FR-05, ADR-0004: ABAC 認可"
  - name: Wiki
    description: "FR-13: Wiki ページ"
  - name: Feedback
    description: "FR-08, UC-01: 回答へのフィードバック（👍/👎・コメント）収集。IADR-0017: 内部 API（BFF 経由で到達）"
  - name: Dashboard
    description: "FR-10, UC-05: 利用状況・検索傾向・回答品質の可視化。IADR-0017: 内部 API（BFF 経由で到達）"
  - name: Completions
    description: "FR-04, FR-11, ADR-0010: LLM テキスト生成ゲートウェイ。機密区分・用途で呼び出し先を切替。IADR-0017: サービス間呼び出し専用"
  - name: Embeddings
    description: "FR-02, FR-05, ADR-0016, ADR-0017, IADR-0025: 埋め込み生成ゲートウェイ。機密区分でティア（セルフホスト/外部）を切替、高機密は fail-closed。IADR-0017: サービス間呼び出し専用"
  - name: Config
    description: "FR-15, SC-11, ADR-0018, IADR-0029/IADR-0030: 構成情報 API（読み取り専用）。実効構成とドリフトを管理者・運用者（ConfigViewer ポリシー）へ返す"

paths:
  # ── BFF ──────────────────────────────────────────
  /bff/search:
    post:
      tags: [Search]
      summary: "FR-03: ベクトル検索（BFF 集約）"
      description: |
        Issue #118 監査: 実装パスは `/bff/search`（旧記載 `/search` は誤り）。
        ABAC 許可スコープをサーバ側で解決（AuthorizationService・FR-05）し、解決済みスコープで
        RetrievalService の `/search`（内部 API・IADR-0017）へ委譲する本実装（`SearchBffEndpoints`）。
        クライアント指定の Scope は信頼しない（権限昇格の防止）。deny-by-default: 許可ポリシーが無い／
        認可サービス不調／検索サービス不調は空応答へ縮退し、権限外の存在を示さない（IADR-0009 と整合）。
      operationId: bff-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /bff/analysis/ask:
    post:
      tags: [Analysis]
      summary: "FR-04, UC-01: RAG 質問回答（BFF 集約）"
      description: |
        Issue #118 監査: 実装パスは `/bff/analysis/ask`（旧記載 `/analysis/ask` は誤り。
        `/analysis/ask` は AiAnalysisService 直接の内部パス）。ABAC 権限解決のため
        Authorization ヘッダを後段へ伝播する。
      operationId: analysis-ask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: AI 回答 + 出典
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswerDto"

  /bff/analysis/analyze:
    post:
      tags: [Analysis]
      summary: "FR-07, UC-02: 指定データ範囲での分析・比較・抽出（BFF 集約）"
      description: |
        Issue #118 監査: 実装パスは `/bff/analysis/analyze`（旧記載 `/analysis/analyze` は誤り。
        `/analysis/analyze` は AiAnalysisService 直接の内部パス）。
        指定データ範囲（attributeFilters / query）は ABAC 許可スコープと交差し、権限を一切広げない
        （narrowing-only, IADR-0005）。範囲が権限外を指す場合は空回答へ縮退する。
      operationId: analysis-analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisTaskRequest"
      responses:
        "200":
          description: 分析・比較・抽出の結果 + 出典
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswerDto"
        "400":
          description: instruction 未指定

  /bff/feedback:
    post:
      tags: [Feedback]
      summary: "FR-08, UC-01: 回答へのフィードバック送信（BFF 集約）"
      description: |
        チャット画面からの 👍/👎・コメント送信を FeedbackService へ委譲する。
        送信者を後段で特定できるよう Authorization ヘッダを伝播する。
        後段の 201（新規）/ 200（更新・upsert）ステータスをそのまま透過する。
      operationId: bff-submit-feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: 既存フィードバックの更新（upsert）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "201":
          description: 新規フィードバックの作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"

  /bff/feedback/stats:
    get:
      tags: [Feedback]
      summary: "FR-08: 満足率の集計取得（BFF 集約・品質可視化）"
      operationId: bff-feedback-stats
      parameters:
        - name: answerId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "指定時はその回答に絞って集計する"
      responses:
        "200":
          description: フィードバック集計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStatsDto"

  /bff/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: "FR-10, UC-05: ダッシュボードサマリ（BFF 集約）"
      description: |
        DashboardService（利用状況・検索傾向）と FeedbackService（回答品質）を 1 応答へ集約する。
        利用状況と満足率の期間の起点を揃えるため、有効な days を BFF で確定し双方へ同じ値を渡す。
        管理者ロール（AdminOnly）に限定する。
      operationId: bff-dashboard-summary
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
          description: "集計期間（日数）。既定 7 日、上限 90 日にクランプ"
        - name: top
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
          description: "検索傾向で返す上位件数。既定 10、上限 50"
      responses:
        "200":
          description: 利用状況・検索傾向・回答品質を集約したサマリ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  /bff/admin/config:
    get:
      tags: [Config]
      summary: "FR-15, SC-11: 現在有効な実効構成の取得"
      description: |
        現在有効なシステム構成（パイプライン段構成・イベント接続・ポート実装選択・コネクタ一覧）と
        構成バージョン（Git コミット）を返す。IADR-0029: 独立サービス化せず BFF 配下の管理 API として同居。
        IADR-0030: 閲覧は ConfigViewer ポリシー（platform-admin / platform-operator）に限定。
        非権限（無認証を含む）には 404 で応答自体を秘匿する（IADR-0009 の存在秘匿と整合。401/403 は返さない）。
        取得は許可・拒否ともに監査ログへ記録する。
      operationId: bff-config-effective
      responses:
        "200":
          description: 実効構成（段・接続・ポート選択・コネクタ・構成バージョン）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfigDto"
        "404":
          description: 非権限（存在秘匿。無認証・一般利用者を含む）

  /bff/admin/config/drift:
    get:
      tags: [Config]
      summary: "FR-15, SC-11: 宣言（Git）と実効構成のドリフト検出"
      description: |
        宣言的構成（pipeline.json）と実行時の実効構成の不一致（ドリフト）を検出して返す。
        認可・秘匿の挙動は `/bff/admin/config` と同一（ConfigViewer / 非権限は 404）。
      operationId: bff-config-drift
      responses:
        "200":
          description: ドリフト検出結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftReportDto"
        "404":
          description: 非権限（存在秘匿。無認証・一般利用者を含む）

  # ── DocumentService ───────────────────────────────
  /documents:
    get:
      tags: [Documents]
      summary: "FR-06: ドキュメント一覧"
      operationId: list-documents
      responses:
        "200":
          description: ドキュメントリスト
    post:
      tags: [Documents]
      summary: "FR-06, UC-03: ドキュメント作成"
      operationId: create-document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: 作成されたドキュメント

  /documents/{id}:
    get:
      tags: [Documents]
      operationId: get-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: ドキュメント
        "404":
          description: 見つからない
    put:
      tags: [Documents]
      operationId: update-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: 更新成功
    delete:
      tags: [Documents]
      summary: "FR-06, UC-03, Issue #88: ドキュメントを削除する（DocumentDeleted を発行し Wiki.js 実体も撤去）"
      operationId: delete-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: 削除成功

  /documents/{id}/metadata:
    patch:
      tags: [Documents]
      summary: "FR-06, UC-03: メタデータ（属性・タグ）のみ更新"
      operationId: update-document-metadata
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMetadataRequest"
      responses:
        "200":
          description: 更新成功
        "404":
          description: 見つからない
        "409":
          description: 版競合（楽観的並行制御）

  /documents/{id}/publish:
    post:
      tags: [Documents]
      summary: "FR-06, UC-03: ドキュメントを公開する"
      operationId: publish-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 公開成功
        "404":
          description: 見つからない

  /documents/{id}/archive:
    post:
      tags: [Documents]
      summary: "FR-06, UC-03, Issue #88: ドキュメントをアーカイブ（非公開化）する"
      operationId: archive-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: アーカイブ成功（status=archived の DocumentUpdated を発行）
        "404":
          description: 見つからない

  /documents/{id}/versions:
    get:
      tags: [Documents]
      summary: "FR-06, UC-03: 版履歴一覧（新しい順）"
      operationId: list-document-versions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 版履歴
        "404":
          description: 見つからない

  /documents/{id}/versions/{version}:
    get:
      tags: [Documents]
      summary: "FR-06, UC-03: 特定版の取得"
      operationId: get-document-version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: 版スナップショット
        "404":
          description: 見つからない

  # ── DataSourceService ─────────────────────────────
  /datasources:
    get:
      tags: [DataSources]
      operationId: list-datasources
      responses:
        "200":
          description: データソースリスト
    post:
      tags: [DataSources]
      summary: "FR-01: データソース登録"
      operationId: create-datasource
      responses:
        "201":
          description: 登録成功

  /datasources/{id}/sync:
    post:
      tags: [DataSources]
      summary: "FR-01: 手動同期トリガー"
      operationId: trigger-sync
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: 同期キューに追加

  # ── AuthorizationService ──────────────────────────
  /authz/scope:
    post:
      tags: [Authorization]
      summary: "FR-05, ADR-0004: ABAC スコープ解決"
      operationId: resolve-scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessScopeRequest"
      responses:
        "200":
          description: 許可されたフィルター
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessScopeResponse"

  /authz/policies:
    get:
      tags: [Authorization]
      summary: "FR-09: ABAC ポリシー一覧"
      operationId: list-policies
      responses:
        "200":
          description: ポリシー一覧
    post:
      tags: [Authorization]
      summary: "FR-09, UC-05: ABAC ポリシー登録（保存前に矛盾検証）"
      operationId: create-policy
      responses:
        "201":
          description: 作成成功
        "400":
          description: バリデーションエラー（RFC7807）

  /authz/policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Authorization]
      summary: "FR-09: ポリシー個別取得"
      operationId: get-policy
      responses:
        "200": { description: ポリシー }
        "404": { description: 見つからない }
    put:
      tags: [Authorization]
      summary: "FR-09, UC-05: ポリシー更新（保存前に矛盾検証）"
      operationId: update-policy
      responses:
        "200": { description: 更新成功 }
        "400": { description: バリデーションエラー（RFC7807） }
        "404": { description: 見つからない }
    delete:
      tags: [Authorization]
      summary: "FR-09: ポリシー削除"
      operationId: delete-policy
      responses:
        "204": { description: 削除成功 }
        "404": { description: 見つからない }

  /authz/policies/{id}/active:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Authorization]
      summary: "FR-09: ポリシー有効／無効の切替"
      operationId: set-policy-active
      responses:
        "200": { description: 切替成功 }
        "404": { description: 見つからない }

  /authz/attributes:
    get:
      tags: [Authorization]
      summary: "FR-09: 属性辞書一覧"
      operationId: list-attributes
      responses:
        "200": { description: 属性辞書一覧 }
    post:
      tags: [Authorization]
      summary: "FR-09, UC-05: 属性辞書登録（キー重複・許可値検証）"
      operationId: create-attribute
      responses:
        "201": { description: 作成成功 }
        "400": { description: バリデーションエラー（RFC7807） }

  /authz/attributes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Authorization]
      summary: "FR-09: 属性辞書個別取得"
      operationId: get-attribute
      responses:
        "200": { description: 属性辞書 }
        "404": { description: 見つからない }
    put:
      tags: [Authorization]
      summary: "FR-09, UC-05: 属性辞書更新（Key/Scope は不変）"
      operationId: update-attribute
      responses:
        "200": { description: 更新成功 }
        "400": { description: バリデーションエラー（RFC7807） }
        "404": { description: 見つからない }
    delete:
      tags: [Authorization]
      summary: "FR-09: 属性辞書削除"
      operationId: delete-attribute
      responses:
        "204": { description: 削除成功 }
        "404": { description: 見つからない }

  /authz/attributes/validate:
    post:
      tags: [Authorization]
      summary: "FR-09, UC-05: 文書属性の辞書整合バリデーション（副作用なし）"
      operationId: validate-document-attributes
      responses:
        "200":
          description: "検証結果 { valid, errors }"

  # ── WikiService ───────────────────────────────────
  /wiki/pages:
    get:
      tags: [Wiki]
      summary: "FR-13: Wiki ページ一覧"
      operationId: list-wiki-pages
      responses:
        "200":
          description: ページリスト

  /wiki/pages/{slug}:
    get:
      tags: [Wiki]
      operationId: get-wiki-page
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Wiki ページ
        "404":
          description: 見つからない

  # ── FeedbackService（直接・内部 API / IADR-0017）─────
  /feedback:
    post:
      tags: [Feedback]
      summary: "FR-08, UC-01: フィードバック送信（upsert・冪等）"
      description: |
        新規は 201、既存 (answerId, userId) の更新は 200（upsert）。
        利用者は JWT から特定する（テスト・開発環境では anonymous）。
        同一 (answerId, userId) は二重計上しない（IADR-0010）。
      operationId: submit-feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: 既存フィードバックの更新（upsert）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "201":
          description: 新規フィードバックの作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "400":
          description: "バリデーションエラー（answerId 未指定 / rating 不正 / comment 長超過）"
    get:
      tags: [Feedback]
      summary: "FR-08: フィードバック一覧（品質レビュー用）"
      description: |
        NFR（認可）: 自由記述 Comment と UserId（個人特定情報）を返すため、管理者ロール（AdminOnly）のみ許可する。
        全件無制限返却を防ぐページング（skip>=0 / 1<=take<=500）。
      operationId: list-feedback
      parameters:
        - name: rating
          in: query
          required: false
          schema: { type: string, enum: [up, down] }
          description: "評価で絞り込む（低評価回答のレビュー等）"
        - name: answerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: skip
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
        - name: take
          in: query
          required: false
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: フィードバック一覧（更新日時の新しい順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  /feedback/stats:
    get:
      tags: [Feedback]
      summary: "FR-08, FR-10: フィードバック集計（👍/👎 件数・満足率）"
      description: |
        集計値のみで PII を含まないため AdminOnly は課さない（BFF が集約して画面へ）。
        FR-10 ダッシュボードの回答品質の入力となる。
      operationId: feedback-stats
      parameters:
        - name: answerId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "指定時はその回答に絞って集計する"
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90 }
          description: "期間指定（日数、[1,90] にクランプ）。未指定は全期間（後方互換）"
      responses:
        "200":
          description: フィードバック集計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStatsDto"

  # ── DashboardService（直接・内部 API / IADR-0017）────
  /dashboard/events:
    post:
      tags: [Dashboard]
      summary: "FR-10: 利用イベント（検索・回答）を記録する"
      description: |
        集計の入力となるため、認証済みなら誰でも記録できる（認証は必須）。
        利用者は JWT から特定する（テスト・開発環境では anonymous）。
      operationId: record-usage-event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageEventRequest"
      responses:
        "201":
          description: 記録された利用イベント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageEventCreatedDto"
        "400":
          description: "eventType 不正（search / answer 以外）"
        "401":
          description: 未認証

  /dashboard/usage:
    get:
      tags: [Dashboard]
      summary: "FR-10: 日次利用状況（日付 × 種別の件数）"
      description: "利用傾向は運用情報のため管理者ロール（AdminOnly）に限定する。"
      operationId: dashboard-usage
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
      responses:
        "200":
          description: 日次利用状況
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsagePointDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  /dashboard/trends:
    get:
      tags: [Dashboard]
      summary: "FR-10: 検索傾向（よく検索される語の上位）"
      operationId: dashboard-trends
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
        - name: top
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 検索傾向（件数降順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchTrendDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: "FR-10: 利用側サマリ（総件数・利用状況・検索傾向）"
      description: |
        回答品質は含まず、BFF が FeedbackService から付加して DashboardSummaryDto を組み立てる。
        管理者ロール（AdminOnly）に限定する。
      operationId: dashboard-usage-summary
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
        - name: top
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 利用側サマリ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUsageDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  # ── LlmGateway（直接・内部 API / IADR-0017）─────────
  /complete:
    post:
      tags: [Completions]
      summary: "FR-04, FR-11, ADR-0010: LLM テキスト生成"
      description: |
        AiAnalysisService が呼び出す。FR-11: 入力の機密区分（confidentiality）・用途（purpose）に応じて
        呼び出し先（ティア/エンドポイント/モデル）を越境マトリクスで判定し切り替える。
        機密区分による送信拒否・呼び出し先不調時も 500 を伝播せず、sent=false の縮退応答を 200 で返す
        （呼び出し側が出典のみ返す等の縮退へ切り替えられるようにする）。
        ADR-0025 / IADR-0104: 送信が成立した場合はモデル側の終了理由を stopReason で返す。
        `stopReason="refusal"`（モデルが拒否）は HTTP 200・sent=true・text 空で到着するため、
        呼び出し側は text の空だけを見ず stopReason を確認する。
      operationId: complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionApiRequest"
      responses:
        "200":
          description: 生成結果（送信拒否・縮退時は sent=false）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionApiResponse"

  /embed:
    post:
      tags: [Embeddings]
      summary: "FR-02, FR-05, ADR-0016/0017, IADR-0025: 埋め込み生成"
      description: |
        IngestionService（purpose=index）/ RetrievalService（purpose=query）が呼び出す。
        機密区分（confidentiality）で送信先ティアを切替: confidential/restricted はティアA
        （セルフホスト Ruri v3/768 次元）固定で外部送信しない（未構成時は fail-closed で
        embedded=false）。それ以外はティアB（Voyage voyage-3.5/1024 次元）。検索クエリ
        （purpose=query）は検索対象コレクションと次元を一致させるため既定外部経路へ固定する。
        送信拒否・不調時も 500 を伝播せず embedded=false の縮退応答を 200 で返す
        （retryable=true は一時障害で呼び出し側が再試行、false は恒久理由でスキップ）。
      operationId: embed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedApiRequest"
      responses:
        "200":
          description: 埋め込み結果（送信拒否・縮退時は embedded=false）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedApiResponse"

components:
  schemas:
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, example: "ナレッジ管理とは" }
        topK: { type: integer, default: 10 }
        attributeFilters:
          type: object
          additionalProperties: { type: string }

    SearchResponse:
      type: object
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultDto"
        totalHits: { type: integer }
        elapsedMs: { type: integer }

    SearchResultDto:
      type: object
      properties:
        chunkId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        text: { type: string }
        score: { type: number, format: float }
        markdownUri: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, example: "プロジェクト憲章の承認フローを教えて" }

    AnalysisTaskRequest:
      type: object
      required: [instruction]
      properties:
        instruction:
          type: string
          example: "2025 年度の経費規程の変更点を比較して"
        taskType:
          type: string
          enum: [Analyze, Compare, Extract]
          default: Analyze
          description: "分析 / 比較 / 抽出"
        range:
          $ref: "#/components/schemas/AnalysisDataRange"

    AnalysisDataRange:
      type: object
      description: "指定データ範囲。ABAC 許可スコープと交差し権限を広げない（narrowing-only）。"
      properties:
        query:
          type: string
          nullable: true
          description: "範囲内で関連箇所を絞る検索クエリ（省略時は instruction を流用）"
        attributeFilters:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: "属性キー → 許可値集合（例: department: [sales]）"
        topK: { type: integer, default: 8 }

    AiAnswerDto:
      type: object
      properties:
        answer: { type: string }
        citations:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultDto"
        model: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }

    AccessScopeRequest:
      type: object
      required: [userId, userAttributes]
      properties:
        userId: { type: string }
        userAttributes:
          type: object
          additionalProperties: { type: string }

    AccessScopeResponse:
      type: object
      properties:
        userId: { type: string }
        allowedFilters:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              allowedValues:
                type: array
                items: { type: string }

    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        originalUri: { type: string, nullable: true }
        contentType: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }

    UpdateDocumentRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        expectedVersion: { type: integer, nullable: true, description: "楽観的並行制御。現在版と不一致なら 409" }
        changeNote: { type: string, nullable: true }

    UpdateMetadataRequest:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        expectedVersion: { type: integer, nullable: true, description: "楽観的並行制御。現在版と不一致なら 409" }
        changeNote: { type: string, nullable: true }

    # ── FR-08: Feedback ───────────────────────────────
    FeedbackRequest:
      type: object
      required: [answerId, rating]
      properties:
        answerId:
          type: string
          format: uuid
          description: "対象 AI 回答の ID（AiAnswerDto 由来）。空 Guid は不可"
        rating:
          type: string
          enum: [up, down]
          description: "👍（up）/ 👎（down）"
        comment:
          type: string
          nullable: true
          maxLength: 2000
          description: "自由記述（任意、最大 2000 文字）"
        question:
          type: string
          nullable: true
          maxLength: 1000
          description: "回答の元となった質問（品質レビュー用の文脈。任意、最大 1000 文字）。超過分は拒否せず黙って切り詰める"

    FeedbackDto:
      type: object
      properties:
        id: { type: string, format: uuid }
        answerId: { type: string, format: uuid }
        rating: { type: string, enum: [up, down] }
        comment: { type: string, nullable: true }
        question: { type: string, nullable: true }
        userId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FeedbackStatsDto:
      type: object
      description: "フィードバック集計（satisfactionRate = up / total、total=0 のとき 0）"
      properties:
        up: { type: integer }
        down: { type: integer }
        total: { type: integer }
        satisfactionRate: { type: number, format: double }

    # ── FR-10: Dashboard ──────────────────────────────
    UsageEventRequest:
      type: object
      required: [eventType]
      properties:
        eventType:
          type: string
          enum: [search, answer]
          description: "検索実行（search）/ AI 回答生成（answer）"
        query:
          type: string
          nullable: true
          description: "検索語（種別が search のとき任意。検索傾向の集計に用いる）"

    UsageEventCreatedDto:
      type: object
      properties:
        id: { type: string, format: uuid }

    UsagePointDto:
      type: object
      description: "日次利用状況の 1 点（日付 × 種別の件数）"
      properties:
        date: { type: string, format: date }
        eventType: { type: string, enum: [search, answer] }
        count: { type: integer }

    SearchTrendDto:
      type: object
      description: "検索傾向の 1 点（検索語 × 件数）"
      properties:
        term: { type: string }
        count: { type: integer }

    DashboardUsageDto:
      type: object
      description: "DashboardService が返す利用側サマリ（回答品質は含まない）"
      properties:
        totalSearches: { type: integer }
        totalAnswers: { type: integer }
        usageTrend:
          type: array
          items:
            $ref: "#/components/schemas/UsagePointDto"
        topSearchTerms:
          type: array
          items:
            $ref: "#/components/schemas/SearchTrendDto"

    DashboardSummaryDto:
      type: object
      description: "BFF が組み立てるダッシュボードサマリ（利用状況・検索傾向・回答品質を集約）"
      properties:
        totalSearches: { type: integer }
        totalAnswers: { type: integer }
        usageTrend:
          type: array
          items:
            $ref: "#/components/schemas/UsagePointDto"
        topSearchTerms:
          type: array
          items:
            $ref: "#/components/schemas/SearchTrendDto"
        quality:
          $ref: "#/components/schemas/FeedbackStatsDto"

    # ── FR-11: LlmGateway completion ──────────────────
    CompletionApiRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        maxTokens:
          type: integer
          default: 4096
          description: >-
            出力トークン上限。thinking（拡張思考）が既定で有効なモデル（Opus 5 / Sonnet 5 等）では
            思考トークンと本文の合算上限になるため、既定は本文想定長＋思考の作業領域を見込んだ
            4096 とする（IADR-0101）。小さすぎると本文が空または途中で切れる。
        model:
          type: string
          nullable: true
          description: "明示要求モデル。null の場合はゲートウェイが用途（purpose）に応じて選択する"
        confidentiality:
          type: string
          nullable: true
          enum: [public, internal, confidential, restricted]
          description: |
            入力文書の最高機密区分（大文字小文字は無視）。越境マトリクスで呼び出し先を判定する。
            未指定（null/空）・未知の値は安全側の restricted に倒す（fail-safe, deny-by-default）。
        purpose:
          type: string
          nullable: true
          description: "用途。null/空は default 扱い"

    CompletionApiResponse:
      type: object
      description: |
        sent=false は機密区分による送信拒否（縮退）または呼び出し先不調を示す。
        IADR-0104: sent（越境させたか）と stopReason（モデル側の終了理由）は独立した軸である。
      properties:
        text: { type: string }
        model: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        sent: { type: boolean, default: true }
        endpoint:
          type: string
          nullable: true
          description: "選択・拒否した呼び出し先（監査・縮退表示用）"
        routingReason:
          type: string
          nullable: true
          description: "選択・拒否の理由（監査・縮退表示用）"
        stopReason:
          type: string
          nullable: true
          example: "refusal"
          description: |
            ADR-0025, IADR-0104: 送信が成立した場合のモデル側の終了理由（Anthropic の stop_reason）。
            未送信（sent=false）・未対応プロバイダでは null。既知の語彙は `end_turn` / `max_tokens` /
            `refusal` / `stop_sequence` / `tool_use` だが、**閉じた enum にはしない**。
            語彙が増えたときに未知の値を弾かず、そのまま透過してログ・監査に残すためである。
            - `refusal`: モデルが拒否した（安全性分類器による停止）。**text は空**で返す
              （拒否直前の断片を下流の判断材料にしないため、ゲートウェイが破棄する）。
              「送信したが空応答」と混同してはならない。
            - `max_tokens`: 出力上限に到達した。thinking が既定で有効なモデルでは本文が空または
              途中で切れる（IADR-0101）。断片は破棄せずそのまま返す。
            - `end_turn`: 正常終了。

    # ── FR-15, IADR-0029: 構成情報 API（/bff/admin/config）─────
    EffectiveConfigDto:
      type: object
      description: "FR-15: 現在有効な実効構成（各サービスの自己申告を BFF が集約）"
      properties:
        version:
          $ref: "#/components/schemas/ConfigVersionDto"
        pipeline:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStageDto"
        eventBindings:
          type: array
          items:
            $ref: "#/components/schemas/EventBindingDto"
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortSelectionDto"
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorDto"

    ConfigVersionDto:
      type: object
      description: "構成バージョン（適用中の構成定義の Git コミット・適用日時・適用者。GitOps 注入。未注入時は空）"
      properties:
        gitCommit: { type: string, nullable: true }
        appliedAt: { type: string, format: date-time, nullable: true }
        appliedBy: { type: string, nullable: true }

    PipelineStageDto:
      type: object
      description: "有効なパイプライン段（宣言と照合された実効値）"
      properties:
        name: { type: string, example: "catalog" }
        service: { type: string, example: "document-service" }
        consumer: { type: string, description: "コンシューマ型完全名" }
        input: { type: string, example: "DocumentNormalized" }
        outputs:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    EventBindingDto:
      type: object
      description: "イベント接続（イベント型ごとの発行者・購読者）"
      properties:
        event: { type: string, example: "DocumentUpdated" }
        publishers:
          type: array
          items: { type: string }
        subscribers:
          type: array
          items: { type: string }

    PortSelectionDto:
      type: object
      description: "ポート（LLM・埋め込み・ベクトルDB・ストレージ・Wiki 同期等）で選択中の実装と接続先識別子"
      properties:
        port: { type: string }
        implementation: { type: string }
        target: { type: string, nullable: true }

    ConnectorDto:
      type: object
      description: "データソースコネクタと有効・無効状態"
      properties:
        name: { type: string }
        enabled: { type: boolean }

    DriftReportDto:
      type: object
      description: "FR-15: 宣言（Git 上の pipeline.json）と実効構成のドリフト検出結果"
      properties:
        hasDrift: { type: boolean }
        checkedAt: { type: string, format: date-time }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DriftFindingDto"

    DriftFindingDto:
      type: object
      description: "個々の不一致（自己申告到達不能は Unverifiable として縮退報告）"
      properties:
        kind: { type: string, example: "UndeclaredSubscription" }
        severity: { type: string, example: "Warning" }
        target: { type: string }
        detail: { type: string }

    # ── IADR-0025: 埋め込みゲートウェイ（/embed）─────
    EmbedApiRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "埋め込み対象テキスト（取り込みは本文全量を送るため機密区分で越境判定）" }
        confidentiality:
          type: string
          nullable: true
          enum: [public, internal, confidential, restricted]
          description: "機密区分（大文字小文字は無視）。confidential/restricted はティアA固定・外部送信しない"
        purpose:
          type: string
          enum: [index, query]
          default: index
          description: "用途。query は検索対象コレクションと次元を一致させるため既定外部経路へ固定"

    EmbedApiResponse:
      type: object
      description: "embedded=false は機密区分による送信拒否（fail-closed）・次元不整合・呼び出し失敗を示す"
      properties:
        vector:
          type: array
          items: { type: number, format: float }
        dimensions: { type: integer, example: 1024 }
        model: { type: string, example: "voyage-3.5" }
        collection: { type: string, example: "knowledge_chunks_voyage_3_5", description: "モデル別コレクション名" }
        embedded: { type: boolean, default: true }
        endpoint: { type: string, nullable: true, description: "選択・拒否した送信先（監査・縮退表示用）" }
        routingReason: { type: string, nullable: true, description: "選択・拒否の理由（監査・縮退表示用）" }
        retryable:
          type: boolean
          default: false
          description: "true は一時障害（呼び出し側は再試行）。false は恒久理由（呼び出し側はスキップ）"
