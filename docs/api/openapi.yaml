                $ref: "#/components/schemas/EffectiveToolsView"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: McpServer へ到達できない }

  /bff/admin/mcp-clients/{clientId}/disable:
