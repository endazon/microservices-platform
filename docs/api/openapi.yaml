  # ── Wiki 閲覧の BFF 集約（FR-13 / UC-07 / SC-04。ADR-0073 決定 2・4 / #1199）─────────
  #
  # ADR-0073 決定 1 は「利用者が Wiki の内容へ到達する経路は WikiService（/wiki/*）の 1 本とする」と
  # 定め、決定 2 は「SC-04 は基盤 SPA のルートとし、ページツリー・本文・検索結果を BFF 経由で取得して
  # SPA が描く」と確定させた。以下の 4 本はその口である（後段の 4 経路と 1 対 1 に対応する）。
  #
  # 🔴 **どれも認証は要るがロールは問わない**（x-roles: []）。計画 05_screens は利用者グループ
  # （SC-01〜04）を「ABAC の権限内で全利用者が利用できる」と定めており、可視性を決めるのは
  # 役割ではなく ABAC である。ロールを足すと一般利用者が Wiki を 1 ページも開けなくなる。
  #
  # 🔴 **BFF は後段の応答をそのまま返す（状態・Content-Type・本文）。** 後段は「権限外・不存在・
  # アーカイブ済み」を区別せず 404、「権限が無い・該当が無い」を区別せず 200 ＋ 空を返す
  # （存在秘匿。IADR-0009 / ADR-0011）。BFF がこれを作り替えると秘匿が BFF 層で破れる。
  # **未認証は BFF で 401**（NFR-09 の暫定運用＝エッジで認証を担保する。ADR-0032）——
  # 後段が未認証に対して固定した「一覧・検索は 200 ＋ 空、個別は 404」（IADR-0335 決定 4）は
  # mesh 内の契約であり、要求は BFF で止まって後段へ到達しないため食い違わない。
  /bff/wiki/pages:
    get:
      x-roles: []
      tags: [Wiki]
      summary: "FR-13, UC-07, SC-04: 権限内の Wiki ページ一覧（BFF 集約）"
      description: |
        後段 WikiService の `/wiki/pages` へ中継する。deny-by-default の属性フィルタで
        **権限内のメタデータだけ**が並ぶ。許可ポリシーが無ければ **200 ＋ 空配列**。
        本文は含まない（本文は個別取得が ABAC 通過後に Wiki.js からプロキシする）。
        アーカイブ済みページは権限があっても現れない。
      operationId: bff-wiki-page-list
      responses:
        "200":
          description: 権限内のページ一覧（表題順。空配列を含む）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiPageSummary"
        "401": { description: 未認証 }
        "502": { description: 後段（WikiService）へ到達できない }

  /bff/wiki/search:
    get:
      x-roles: []
      tags: [Wiki]
      summary: "FR-13, UC-07, SC-04: Wiki ページの検索（ABAC 適用済み。BFF 集約）"
      description: |
        後段 WikiService の `/wiki/search` へ中継する。全文検索は Wiki.js へ委譲され、
        **前段が台帳と突き合わせて ABAC で絞り直した**結果が返る（IADR-0335）。
        並びは Wiki.js の関連度順を保つ。本文は含まない。

        - **`q` / `limit` は指定されたときだけ後段へ載せる。** 既定 20 / 上限 50 のクランプは
          後段が唯一の情報源であり、BFF は 2 つ目のクランプを持たない。
        - 許可ポリシーが無い／検索語が空白のみ → **200 ＋ 空配列**（後段が Wiki.js を呼ばない）。
        - 🔴 Wiki.js へ到達できない場合は後段が **502** を返し、BFF はそれを透過する
          （200 ＋ 空で隠さない。「権限が無い」と「壊れている」は別の軸である）。
      operationId: bff-wiki-search
      parameters:
        - name: q
          in: query
          required: false
          schema: { type: string }
          description: "検索語。空白のみなら 200 ＋ 空（後段が判定する）"
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 20, minimum: 1, maximum: 50 }
          description: "取得件数。既定 20、上限 50 へ後段がクランプする"
      responses:
        "200":
          description: 権限内の検索結果（関連度順。空配列を含む）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/WikiSearchHit"
        "401": { description: 未認証 }
        "502": { description: Wiki.js が応答しない／後段へ到達できない }

