        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: McpServer へ到達できない }

  # ── SC-03/SC-05, FR-06, UC-01/UC-03/UC-07: 文書 BFF ─
  # IADR-0041 / IADR-0009: 読み取りはロールで塞がず、ABAC スコープ解決の結果でのみ絞る。
  # スコープ外・不在はいずれも 404 で応答し存在を秘匿する（「拒否」と「不在」を区別しない）。
  # 書き込みは **platform-admin のみ**（#629。グループ既定は「閲覧の下限」として
  # platform-admin / platform-operator を残し、各書き込み口へ AdminOnly を積んで AND 合成する）。
  # 対象がスコープ内であることを先に確かめる（閲覧できない文書は変更もできない）。
  # 後段の検証 400・競合 409・不在 404 は透過する。
  /bff/documents:
    get:
      x-roles: [platform-admin, platform-operator]
      tags: [Documents]
      summary: "FR-06, SC-05: 文書一覧（ABAC スコープ内のみ。管理者・運用者。#656）"
      description: |
        利用者の ABAC 許可スコープに合致する文書だけを返す（deny-by-default。権限外文書は列挙しない）。
        許可ポリシーが無い／認可サービス不調のときは**空配列**へ縮退し、権限外の存在を示さない。

        ［2026-08-10 / #656］**閲覧を管理者・運用者へ絞った。** 計画 `05_screens`（2026-08-05 の裁定）が
        「**SC-05/06/07 = 閲覧は管理者・運用者／破壊的操作は管理者限定**」と定めており、
        **本口の呼び出し元は SC-05 の管理画面ただ 1 つ**である（実測）。画面側は既に
        `RequireRole anyOf={[Admin, Operator]}` で絞られていたが、**API は無認証でも通っていた**。
        **同じ `/bff/documents` でも `{id}` 以下（SC-03 の文書詳細）は認証のみ**である ——
        あちらは SC-01 の出典クリックから一般利用者が遷移する。
      operationId: bff-document-list
      responses:
        "200":
          description: 文書一覧（スコープ内のみ）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentDto"
        "401":
          description: 未認証（#656）
        "403":
          description: 管理者・運用者以外（#656）
    post:
      x-roles: [platform-admin]
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書作成（管理者のみ。#629）"
      description: |
        IADR-0047: 後段は機密区分（必須属性）を検証し、欠落・未知値を 400 で拒否する（最終防衛線）。
        タイトル未指定も 400。許可ポリシーが無い呼び出し元は **403**（deny-by-default で作成不可）。
      operationId: bff-document-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: 作成されたドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "400":
          description: タイトル未指定／機密区分の欠落・未知値（RFC7807 ValidationProblem）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly。運用者も不可）、または許可ポリシーが無い }

  /bff/documents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      x-roles: []
      tags: [Documents]
      summary: "FR-06, SC-03: 文書詳細（スコープ外・不在は同じ 404）"
      operationId: bff-document-detail
      responses:
        "200":
          description: ドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "401": { description: 未認証（#656） }
        "404": { description: 不在またはスコープ外（存在秘匿。区別しない） }
    put:
      x-roles: [platform-admin]
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書更新（楽観ロック。管理者のみ。#629）"
      description: |
        `expectedVersion` が現在版と異なれば lost update を防ぐため **409** で拒否する。
        409 の本文は RFC7807 ではなく `{ error: "version_conflict", expectedVersion, currentVersion }`。
      operationId: bff-document-update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: 更新されたドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "400":
          description: タイトル未指定／機密区分の欠落・未知値（RFC7807 ValidationProblem）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly。運用者も不可） }
        "404": { description: 不在またはスコープ外（存在秘匿） }
        "409":
          description: 版競合（楽観的並行制御）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionConflictDto"
    delete:
      x-roles: [platform-admin]
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書削除（管理者のみ。#629）"
      description: "削除は下流（Wiki.js 同期）へ伝播し、外部システムの実体も撤去する。"
      operationId: bff-document-delete
      responses:
        "204": { description: 削除成功 }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly。運用者も不可） }
        "404": { description: 不在またはスコープ外（存在秘匿） }

  /bff/documents/{id}/content:
    get:
      x-roles: []
      tags: [Documents]
      summary: "FR-06, SC-03: 文書本文（正規化 Markdown）"
      description: |
        ABAC 判定後にオブジェクトストレージ（`storage://`）からサーバサイドで読み取る。
        ストレージ未配備・URI 未設定時はプレースホルダ本文へ縮退する（500 にしない）。
      operationId: bff-document-content
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 本文（正規化 Markdown）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContentDto"
        "401": { description: 未認証（#656） }
        "404": { description: 不在またはスコープ外（存在秘匿） }
  /bff/documents/{id}/versions:
    get:
      x-roles: []
      tags: [Documents]
      summary: "FR-06, UC-03, SC-03: 版履歴一覧（新しい順）"
      operationId: bff-document-versions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 版履歴（新しい順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentVersionDto"
        "401": { description: 未認証（#656） }
        "404": { description: 不在またはスコープ外（存在秘匿） }
  /bff/documents/{id}/versions/{version}:
    get:
      x-roles: []
      tags: [Documents]
      summary: "FR-06, UC-03, SC-03: 特定版の取得（#449）"
      description: |
        FR-06 の射程は「版の作成・一覧・**取得**」までであり、**版の復元（過去版へ戻す操作）は含まない**
        （計画 ［2026-08-23 明確化］・環流 planning#473）。

        **応答は本文を含まない。本文の参照（`markdownUri`）も含まない。** 返るのはタイトル・状態・
        属性・タグ・変更メモ・作成日時の**メタデータのスナップショット**だけである。
        本文の実体は版ごとに保持されておらず（オブジェクトキーは文書 ID から固定で決まり、
        再投入は同じキーを上書きする。参照 URI は versionId を持たない）、
        **「その版の本文」を指せる値が存在しない**。現行版の本文は `GET /bff/documents/{id}/content` で取る。
      operationId: bff-document-version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: 版スナップショット（メタデータのみ）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentVersionDto"
        "401": { description: 未認証（#656） }
        "404": { description: 不在・スコープ外（存在秘匿）・当該版なし }
  /bff/documents/{id}/publish:
    post:
      x-roles: [platform-admin]
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書を公開する（取り込み・Wiki 同期をトリガ。管理者のみ。#629）"
      description: |
        アーカイブ済みからの再公開は不正遷移として **409** で拒否する。
        409 の本文は RFC7807 ではなく `{ error: "invalid_transition", from, to }`。
      operationId: bff-document-publish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 公開されたドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly。運用者も不可） }
        "404": { description: 不在またはスコープ外（存在秘匿） }
        "409":
          description: "不正な状態遷移（例 archived → published）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidTransitionDto"

  /bff/documents/{id}/archive:
    post:
      x-roles: [platform-admin]
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書をアーカイブ（非公開化）する（管理者のみ。#629）"
      description: "status=archived の DocumentUpdated を発行し、下流の Wiki.js 同期がページを非公開化する。"
      operationId: bff-document-archive
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: アーカイブされたドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly。運用者も不可） }
        "404": { description: 不在またはスコープ外（存在秘匿） }

  # ── SC-06, FR-01/FR-02, UC-04: データソース BFF ─────
  # IADR-0039: データソースは文書 ABAC のスコープ対象ではなくシステム運用資産のため、
  # 閲覧を platform-admin / platform-operator に限定する（グループ全体に RequireRole）。
  # **［#628］登録・更新・無効化・削除は platform-admin のみ**（各口へ AdminOnly を積んで AND 合成する。
  # 手動同期〔`POST /{id}/sync`〕は破壊的操作に含めないので admin ＋ operator のままである。planning#299）。
  # 一覧は後段障害を空一覧へ縮退させない——「未登録」と誤認させ重複登録を誘発するため。
  /bff/datasources:
    get:
      x-roles: [platform-admin, platform-operator]
      tags: [DataSources]
      summary: "FR-01, SC-06: データソース一覧（管理者・運用者のみ）"
      description: |
        後段不達は **502** で可視化する（空一覧へ縮退させない）。後段の非 2xx はそのまま伝播する。
      operationId: bff-data-source-list
      responses:
        "200":
          description: データソース一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSourceDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "502": { description: DataSourceService へ到達できない }
    post:
      x-roles: [platform-admin]
      tags: [DataSources]
      summary: "FR-01, UC-04, SC-06: データソース登録（**管理者のみ**）"
      description: |
        FR-05, #516: `defaultAttributes` は後段が必須属性のフェイルセーフを通る（`confidentiality`→`internal` / `owner`→`system` / `department`→`unassigned` / `lifecycle`→`active`）。明示指定は上書きしない。
        **登録は破壊的操作であり管理者限定である**（計画 §SC-06・裁定 Q19。#628 で是正。
        従前は運用者にも開いていた）。
      operationId: bff-data-source-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDataSourceRequest"
      responses:
        "201":
          description: 登録されたデータソース
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（運用者も不可） }
        "502": { description: DataSourceService の応答が空 }

  /bff/datasources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      x-roles: [platform-admin, platform-operator]
      tags: [DataSources]
      summary: "FR-01, SC-06: データソース個別取得"
      operationId: bff-data-source-get
      responses:
        "200":
          description: データソース
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 見つからない }
    put:
      x-roles: [platform-admin]
      tags: [DataSources]
      summary: "FR-01, UC-04, SC-06: データソース更新（全置換・**管理者のみ**）"
      description: |
        裁定 Q16（#534）: 従前は更新の口が無く、登録済みソースの変更が「削除→再登録」でしかできなかった。
        **削除→再登録は ID と履歴を切る**（認証情報のローテーションのたびに文書の出所の追跡が切れる）。
        **`id` / `createdAt` / `lastSyncedAt` / 同期健全性は更新の対象外**である（履歴を巻き戻さない）。
        FR-05, #516: `defaultAttributes` は後段が必須属性のフェイルセーフを通る（`confidentiality`→`internal` / `owner`→`system` / `department`→`unassigned` / `lifecycle`→`active`）。明示指定は上書きしない。
        **無効（`disabled`）なソースも更新できる**（認証情報のローテーションは無効中にも起こる）。
        **`config` / `defaultAttributes` の省略は 400 で拒否する**（#627 の AI レビュー 🟡）——
        PUT は全置換なので、省略を受理すると「送り忘れ」で秘密（`apiToken` 等）が黙って消える。
        **消したいときは `{}` を明示する。一部だけ変えるなら `PATCH` を使う。**
      operationId: bff-data-source-update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDataSourceRequest"
      responses:
        "200":
          description: 更新後のデータソース
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceDto"
        "400": { description: "`config` / `defaultAttributes` が省略された（全置換なので明示が要る）" }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（運用者も不可） }
        "404": { description: 見つからない }
    patch:
      x-roles: [platform-admin]
      tags: [DataSources]
      summary: "FR-01, UC-04, SC-06: データソース部分更新（**管理者のみ**）"
      description: |
        裁定 Q16（#534）: **`null`（省略）の項目は現状維持**である。接続先だけ・認証情報だけの
        差し替えを、他項目を読んで書き戻す往復なしに行える。
        **マスク済みの値（`***`）を書き戻しても秘密は壊れない** —— 秘密キーの値がマスクそのものなら
        保存せず既存値を保つ（IADR-0148 決定 6）。GET の応答をそのまま編集して送り返してよい。
      operationId: bff-data-source-patch
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PatchDataSourceRequest"
      responses:
        "200":
          description: 更新後のデータソース
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（運用者も不可） }
        "404": { description: 見つからない }
    delete:
      x-roles: [platform-admin]
      tags: [DataSources]
      summary: "FR-01, SC-06: データソースの無効化（論理削除・**管理者のみ**）"
      description: |
        後段は実体を消さず status を `disabled` にする（`DataSource.Disable()`）。
        **無効化は破壊的操作であり管理者限定である**（計画 §SC-06・裁定 Q19。#628 で是正。
        従前は運用者にも開いていた）。
      operationId: bff-data-source-delete
      responses:
        "204": { description: 無効化成功 }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（運用者も不可） }
        "404": { description: 見つからない }

  /bff/datasources/{id}/sync:
    post:
      x-roles: [platform-admin, platform-operator]
      tags: [DataSources]
      summary: "FR-01, UC-04, SC-06: 手動同期トリガー（管理者・運用者）"
      description: |
        IADR-0051: 実コネクタ経由で原本を取得・格納し `RawDocumentFetched` を発行する。
        未登録の SourceType は縮退する（連携件数 0。5xx にしない）。
        増分 watermark（`lastSyncedAt`）の前進は完全成功時のみ行う（失敗時は進めず次回再試行）。
        **手動同期は破壊的操作に含めない**（planning#299 で裁定・2026-08-09）——外部システムへ接続して
        取り込みを走らせるが既存データを壊さないためであり、**運用者が異常に気づいたその場で
        再同期して一次対応できること**を優先する。**登録・無効化（管理者限定）と同じに扱わないこと。**
      operationId: bff-data-source-sync
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: 同期を実行した（結果の内訳を返す）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceSyncResultDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 見つからない }

  # ── SC-07, FR-12, UC-06: 変換ジョブ BFF ─────────────
  # IADR-0042 決定 3: 運用系のため platform-admin / platform-operator に限定する。
  # IADR-0128 決定 1: **再変換（retry）だけは管理者ロールのみ**（認可メタデータは AND 合成されるため、
  # グループの「admin または operator」と AdminOnly の積＝admin のみが実効要件になる）。
  /bff/conversion/jobs:
    get:
      x-roles: [platform-admin, platform-operator]
      tags: [Conversion]
      summary: "FR-12, UC-06, SC-07: 変換ジョブ一覧（新しい順・状態で絞り込み）"
      description: |
        後段障害を空一覧へ縮退させない（「ジョブ無し」と「サービス障害」を誤認させないため）。
        非 2xx はそのまま伝播し、後段不達は **502** で可視化する。
      operationId: bff-conversion-job-list
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: "状態で絞り込む（`queued` / `processing` / `succeeded` / `failed`。「失敗のみ」フィルタの実体）"
      responses:
        "200":
          description: 変換ジョブ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversionJobDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "502": { description: ConversionService へ到達できない }

  /bff/conversion/jobs/{id}:
    get:
      x-roles: [platform-admin, platform-operator]
      tags: [Conversion]
      summary: "FR-12, UC-06, SC-07: 変換ジョブ個別取得"
      operationId: bff-conversion-job-get
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 変換ジョブ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionJobDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 見つからない }

  /bff/conversion/jobs/{id}/retry:
    post:
      x-roles: [platform-admin]
      tags: [Conversion]
      summary: "FR-12, UC-06, SC-07: **再変換**（人手補正ではない）。**管理者ロールのみ**"
      description: |
        失敗ジョブのみ再変換する（原本イベントを再発行）。**`failed` 以外（`queued` / `processing` /
        `succeeded`）は 409 で拒否する**——UI 制御だけに頼らず API 側で状態を強制し、処理中の二重発行・
        成功済みの不要な再処理を防ぐ。

        **「人手補正」とは別の操作である**（IADR-0154 決定 5）。人手補正は成功ジョブの縮退した図を
        コード化し直すもので、`/figures` 系が担う。

        **［2026-08-10 / #543］409 は本文を伴う。** 従前ここには「409 に本文は無い。BFF は
        `Results.StatusCode` でステータスのみを中継する」と書いていたが、**その中継が欠陥だった**
        （#640 で `usageCount` が画面へ届かなかったのと同型）。IADR-0154 決定 4 で
        **後段の本文をそのまま透過する**よう改めた。画面は `error` で理由を出し分け、
        `corrections_would_be_lost` のときは `correctedFigures` を示して確認を求める。
      operationId: bff-conversion-job-retry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - name: discardCorrections
          in: query
          required: false
          schema: { type: boolean }
          description: |
            **補正版を正とするための明示確認**（05_screens:333。IADR-0154 決定 4）。
            補正のあるジョブは既定で 409 `corrections_would_be_lost` になる。破棄してよい場合だけ
            `true` を付けて再送する。**確認をダイアログだけに置かない**——生成クライアントや
            別経路の呼び出しが素通りするためである。
      responses:
        "202": { description: 再変換を受け付けた（本文なし） }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（IADR-0128 決定 1。運用者も拒否される） }
        "404": { description: 見つからない }
        "409":
          description: |
            再変換できない。本文の `error` が理由を示す。
            `not_retryable`（`failed` 以外のジョブ）／
            **`corrections_would_be_lost`**（人手補正があり、`discardCorrections=true` が無い。
            `correctedFigures` に失われる件数が入る）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversionRetryConflictDto" }

  /bff/conversion/jobs/{id}/figures:
    get:
      x-roles: [platform-admin]
      tags: [Conversion]
      summary: "FR-12, UC-06, SC-07: 人手補正 Phase 1 の本文取得。**管理者ロールのみ**"
      description: |
        ジョブが抽出した図の一覧（SC-07 の 2 ペイン編集の材料）。**`coded: false` の図が補正の対象**である
        （Phase 1 は図のコード化のやり直しに限る。05_screens:330）。

        **画像のバイト列は含まない**——応答が図の枚数だけ膨らむため、`/image` が別途配信する
        （IADR-0154 決定 2）。

        **人手補正は管理者限定**（05_screens:314）。2 ペインを開く操作そのものが人手補正であるため、
        照会（GET）だが運用者は 403 になる。ジョブの照会（`GET /bff/conversion/jobs`）とは実効ロールが違う。
      operationId: bff-conversion-job-figures
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 図の一覧
          content:
            application/json:
              schema:
                type: array
                items: { $ref: "#/components/schemas/ConversionFigureDto" }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（運用者も拒否される。IADR-0154 決定 6） }
        "404": { description: 見つからない }

  /bff/conversion/jobs/{id}/figures/{figureId}/image:
    get:
      x-roles: [platform-admin]
      tags: [Conversion]
      summary: "FR-12, UC-06, SC-07: 縮退した図の元画像（2 ペインの右側）。**管理者ロールのみ**"
      description: |
        **BFF がオブジェクトストレージから解決して返す**（`GET /bff/documents/{id}/content` と同じ形。
        IADR-0154 決定 2）。コード化済みの図は画像を保持しないため 404 になる——
        **未知の図と区別しない**（どちらも「その画像は無い」）。
      operationId: bff-conversion-job-figure-image
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: figureId, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: 画像
          content:
            image/*:
              schema: { type: string, format: binary }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外 }
        "404": { description: 画像が無い（未知の図・コード化済みの図・ストレージ未解決） }

  /bff/conversion/jobs/{id}/figures/{figureId}/correction:
    post:
      x-roles: [platform-admin]
      tags: [Conversion]
      summary: "FR-12, UC-06, SC-07: 人手補正の投稿（Phase 1 = 図のコード化）。**管理者ロールのみ**"
      description: |
        縮退した図へ PlantUML / Mermaid のコード片を与え、**本文の図ブロックを置換して**
        取り込みへ再投入する（05_screens:313）。**原本からの再変換ではない**——やり直すと LLM が
        再び縮退して補正が消えるためである（IADR-0154 決定 3）。

        **変換結果 Markdown 全体の編集は Phase 2** であり、本口は受け付けない（05_screens:330）。
      operationId: bff-conversion-job-figure-correction
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: figureId, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: "#/components/schemas/FigureCorrectionRequest" }
      responses:
        "200":
          description: 補正を適用し、本文を差し替えた
          content:
            application/json:
              schema: { $ref: "#/components/schemas/FigureCorrectionResultDto" }
        "400": { description: "`language` または `code` が空（`invalid_correction`）" }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外 }
        "404": { description: ジョブまたは図が見つからない }
        "409":
          description: |
            補正できない。本文の `error` が理由を示す。
            **`figure_not_correctable`**（コード化済みの図。Phase 1 の対象外）／
            **`job_busy`**（`queued` / `processing`。同一ジョブの直列化。05_screens:319）／
            **`body_unavailable`**（本文を読めない・図の埋め込みが見つからない。**補正は保存していない**）。
          content:
            application/json:
              schema: { $ref: "#/components/schemas/ConversionCorrectionConflictDto" }

