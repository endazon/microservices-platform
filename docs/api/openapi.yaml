    get:
      tags: [Wiki]
      operationId: get-wiki-page
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Wiki ページ
        "404":
          description: 見つからない（権限外・不存在・未認証を区別しない。IADR-0009）

  # ［2026-09-03 追記 / #1199］**4 経路のうち本 1 本だけが契約に載っていなかった。**
  # 実装は `Features/Wiki/GetPageByDocument/` に最初から在り、`/bff/wiki/pages/by-doc/{documentId}` を
