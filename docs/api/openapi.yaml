  # ── FR-22 / UC-11: 利用者本人へのアプリ内通知（IADR-0215）─────────────
  #
  # ★ この 2 本のスキーマには **タイトル・本文に相当する項目が 1 つも無い**。
  # 計画 FR-22 の受け入れ基準「本文が件数と期限のみで構成される。資料のタイトル・本文・検索語・
  # 回答内容を含まない」を、**実装の規律ではなく契約の形**で守らせるためである（IADR-0215 決定 2）。
  # 自由文のフィールドが 1 つでもあれば、いつか誰かがそこへタイトルを入れる。**項目そのものを置かない。**
  # 表示文言はフロントが Lingui カタログ（ja / en）から `kind` と数値だけを使って組み立てる。
  # この不変条件は契約テスト（platform/frontend の notificationContract.test.ts）が固定する。
  #
  # 配信は **SPA からのポーリング**（既定 60 秒）である。SSE は移行第 4 段（#788）の射程なので使わない
  # ——したがってこの 2 本は orval の生成対象になる（orval-bff-only.cjs の SSE 除外規則に当たらない）。
  #
  # **後段（NotificationService）は実装済みだが、BFF 端点はまだである**（IADR-0267 決定 5 / #600）。
  # 後段は同じ形の面（/notifications, /notifications/{id}/read）を持ち、宛先はトークンの主体（sub）
  # だけで絞る —— BFF は主体をパラメータで渡さず、利用者のトークンをそのまま後段へ届けること。
  # BFF 端点が無い間、check-bff-authz-docs.js（実装 → 契約の一方向）はこの 2 本を検査しない。
  /bff/notifications:
    get:
      # 認証は要るがロールは問わない。**通知は主体（JWT の sub）で絞る**——役割ではない。
      x-roles: []
      tags: [Notifications]
      summary: "FR-22, UC-11: 本人宛のアプリ内通知一覧（BFF 集約）"
      description: |
        呼び出した利用者**本人宛**の通知を新しい順に返す。宛先は所有者本人のみであり
        （FR-22 / ADR-0037 決定 6）、他の利用者・管理者の通知は返らない。
        本文は**件数と期限のみ**で構成され、資料のタイトル・本文・検索語・回答内容を含まない。
      operationId: bff-notification-list
      parameters:
        - name: unreadOnly
          in: query
          required: false
          schema: { type: boolean, default: false }
          description: "true のとき未読のみを返す"
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 50, minimum: 1, maximum: 100 }
          description: "取得件数。既定 50、上限 100 にクランプする"
      responses:
        "200":
          description: 本人宛の通知一覧と未読件数
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationListDto"
        "401": { description: 未認証 }

  /bff/notifications/{id}/read:
    post:
      x-roles: []
      tags: [Notifications]
      summary: "FR-22, UC-11: 通知 1 件を既読にする（BFF 集約）"
      description: |
        冪等である（既読のものへもう一度呼んでも 200 を返す）。
        **本人の通知でなければ 404** とし、「存在しない」と「本人のものでない」を区別しない
