          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502": { description: AuthorizationService へ到達できない }

  # ── SC-12, FR-16, UC-09, ADR-0024: MCP クライアント登録管理 BFF ─
  # 管理者限定（05_screens §共通シェル「SC-09・SC-12・SC-17 = システム管理者」。運用者も不可）。
  # BFF は McpServer の /mcp-clients* へ**透過中継**する。後段の 400（属性割当の拒否）・404（不在）・
  # 409（重複）はそのまま返る。後段不達は 502。
  /bff/admin/mcp-clients:
    get:
      x-roles: [platform-admin]
      tags: [McpClients]
      summary: "FR-16, UC-09, SC-12: 登録 MCP クライアント一覧（BFF 集約）"
      operationId: bff-mcp-list-clients
      responses:
        "200":
          description: 登録クライアント一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/McpClientView"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: McpServer へ到達できない }
    post:
      x-roles: [platform-admin]
      tags: [McpClients]
      summary: "FR-16, UC-09, SC-12: MCP クライアント登録（有人 / 無人）"
      description: |
        種別は `interactive`（有人・Authorization Code + PKCE）と `service-account`
        （無人・Client Credentials）の 2 値である。

        **無人アカウントへ個人資料を読ませる属性割当は拒否される**（400 ValidationProblem）。
        登録経路と属性差し替え経路の**両方**が同じ検証を通る。
        既に登録済みのクライアント ID も 400 で拒否される。
      operationId: bff-mcp-register-client
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterMcpClientRequest"
      responses:
        "201":
          description: 登録成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/McpClientView"
        "400":
          description: 検証エラー（RFC7807 ValidationProblem。種別・越境ティアの値域、禁止された属性割当、重複）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: McpServer へ到達できない }

  # 実効ツール一覧。literal な `/tools` と、下の `{clientId}` を含む経路は**セグメント数が違う**ので
  # 衝突しない（`/tools` は 1 段、`{clientId}/disable` 等は 2 段）。
  /bff/admin/mcp-clients/tools:
