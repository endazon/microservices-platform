      responses:
        "200":
          description: ポリシー一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbacPolicyDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: AuthorizationService へ到達できない }
    post:
      x-roles: [platform-admin]
      tags: [Authorization]
      summary: "FR-09, UC-05, SC-09: ABAC ポリシー登録（保存前に矛盾検証）"
      description: |
        後段は保存前に属性辞書との整合を検証し、矛盾があれば **400（RFC7807 ValidationProblem。
