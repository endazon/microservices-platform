          content:
            application/json:
              schema:
                $ref: "#/components/schemas/WikiPageView"
        "401": { description: 未認証 }
        "404": { description: 見つからない（権限外・不存在・アーカイブ済みを区別しない。IADR-0009） }
        "502": { description: 後段（WikiService）へ到達できない }

