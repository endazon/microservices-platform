openapi: "3.1.0"
info:
  title: Platform API
  description: |
    社内ナレッジ活用プラットフォーム — BFF + マイクロサービス統合仕様書
    FR-01, FR-03, FR-04, FR-05, FR-06, FR-07, FR-08, FR-09, FR-10, FR-11, FR-13,
    UC-01, UC-02, UC-05
  version: "0.1.0"
  contact:
    name: Platform Team
servers:
  - url: http://localhost:5000
    description: BFF (ローカル開発)
  - url: http://localhost:5001
    description: DocumentService (直接)
  - url: http://localhost:5003
    description: RetrievalService (直接)
  - url: http://localhost:5004
    description: AiAnalysisService (直接)
  - url: http://localhost:5005
    description: AuthorizationService (直接)
  - url: http://localhost:5007
    description: "LlmGateway — IADR-0017: 内部 API。通常は host 非公開でサービス間呼び出し専用（compose では expose のみ）。この URL は個別に dotnet run した場合のみ到達可能"

tags:
  - name: Analysis
    description: "FR-04, FR-07, UC-01, UC-02: AI 質問回答 (RAG) / 指定データ範囲の分析・比較・抽出"
  - name: Search
    description: "FR-03, UC-01: ベクトル検索"
  - name: Documents
    description: "FR-06, UC-03: ドキュメント管理"
  - name: DataSources
    description: "FR-01, UC-04: データソース管理"
  - name: Conversion
    description: "FR-12, UC-06, SC-07, IADR-0042: 変換ジョブの状況照会と人手補正（再変換）。IADR-0017: 内部 API（BFF 経由で到達）"
  - name: Authorization
    description: "FR-05, ADR-0004: ABAC 認可"
  - name: Wiki
    description: "FR-13: Wiki ページ"
  - name: Feedback
    description: "FR-08, UC-01: 回答へのフィードバック（👍/👎・コメント）収集。IADR-0017: 内部 API（BFF 経由で到達）"
  - name: Dashboard
    description: "FR-10, UC-05: 利用状況・検索傾向・回答品質の可視化。IADR-0017: 内部 API（BFF 経由で到達）"
  - name: Completions
    description: "FR-04, FR-11, ADR-0010: LLM テキスト生成ゲートウェイ。機密区分・用途で呼び出し先を切替。IADR-0017: サービス間呼び出し専用"
  - name: Embeddings
    description: "FR-02, FR-05, ADR-0016, ADR-0017, IADR-0025: 埋め込み生成ゲートウェイ。機密区分でティア（セルフホスト/外部）を切替、高機密は fail-closed。IADR-0017: サービス間呼び出し専用"
  - name: Config
    description: "FR-15, SC-11, ADR-0018, IADR-0029/IADR-0030: 構成情報 API（読み取り専用）。実効構成とドリフトを管理者・運用者（ConfigViewer ポリシー）へ返す"

paths:
  # ── BFF ──────────────────────────────────────────
  /bff/search:
    post:
      tags: [Search]
      summary: "FR-03: ベクトル検索（BFF 集約）"
      description: |
        Issue #118 監査: 実装パスは `/bff/search`（旧記載 `/search` は誤り）。
        ABAC 許可スコープをサーバ側で解決（AuthorizationService・FR-05）し、解決済みスコープで
        RetrievalService の `/search`（内部 API・IADR-0017）へ委譲する本実装（`SearchBffEndpoints`）。
        クライアント指定の Scope は信頼しない（権限昇格の防止）。deny-by-default: 許可ポリシーが無い／
        認可サービス不調／検索サービス不調は空応答へ縮退し、権限外の存在を示さない（IADR-0009 と整合）。
      operationId: bff-search
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SearchRequest"
      responses:
        "200":
          description: 検索結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SearchResponse"

  /bff/analysis/ask:
    post:
      tags: [Analysis]
      summary: "FR-04, UC-01: RAG 質問回答（BFF 集約）"
      description: |
        Issue #118 監査: 実装パスは `/bff/analysis/ask`（旧記載 `/analysis/ask` は誤り。
        `/analysis/ask` は AiAnalysisService 直接の内部パス）。ABAC 権限解決のため
        Authorization ヘッダを後段へ伝播する。
      operationId: bff-analysis-ask
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: AI 回答 + 出典
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswerDto"

  /bff/analysis/analyze:
    post:
      tags: [Analysis]
      summary: "FR-07, UC-02: 指定データ範囲での分析・比較・抽出（BFF 集約）"
      description: |
        Issue #118 監査: 実装パスは `/bff/analysis/analyze`（旧記載 `/analysis/analyze` は誤り。
        `/analysis/analyze` は AiAnalysisService 直接の内部パス）。
        指定データ範囲（attributeFilters / query）は ABAC 許可スコープと交差し、権限を一切広げない
        （narrowing-only, IADR-0005）。範囲が権限外を指す場合は空回答へ縮退する。
      operationId: bff-analysis-analyze
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AnalysisTaskRequest"
      responses:
        "200":
          description: 分析・比較・抽出の結果 + 出典
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AiAnswerDto"
        "400":
          description: instruction 未指定

  /bff/analysis/ask/stream:
    post:
      tags: [Analysis]
      summary: "FR-04, UC-01, SC-01: RAG 質問回答の SSE ストリーミング（BFF パススルー）"
      description: |
        IADR-0037: AiAnalysisService の `/analysis/ask/stream` を `text/event-stream` のまま逐次中継する。

        **orval の生成対象外である（載せ忘れではない）。** 本パスの応答は `text/event-stream` であり、
        orval は SSE を扱えない（TanStack Query のフックは 1 回の応答を前提とする）。SPA はここだけ
        `foundation/api` の **`apiStream`** を使う（ADR-0031 / IADR-0121 決定 3 が許す 2 経路のうちの後者）。
        生成対象／対象外の一覧は docs/api/BFF_bff-surface.md を参照。

        上流不達・非 2xx でも HTTP ステータスは変えられない（既にヘッダを送出済み）。
        BFF は `event: error` の SSE イベントで中立に伝える（権限の有無を示さない。IADR-0009）。
      operationId: bff-analysis-ask-stream
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AskRequest"
      responses:
        "200":
          description: |
            SSE ストリーム。後段（AiAnalysisService）が `event: citations`（出典・**先行**）→
            `event: token`（本文増分）* → `event: done`（回答 ID / モデル / トークン数）の順で送出し、
            BFF はこれをそのまま中継する。BFF は上流不達・非 2xx のときのみ `event: error` を自ら送出する。
          content:
            text/event-stream:
              schema:
                type: string

  /bff/feedback:
    post:
      tags: [Feedback]
      summary: "FR-08, UC-01: 回答へのフィードバック送信（BFF 集約）"
      description: |
        チャット画面からの 👍/👎・コメント送信を FeedbackService へ委譲する。
        送信者を後段で特定できるよう Authorization ヘッダを伝播する。
        後段の 201（新規）/ 200（更新・upsert）ステータスをそのまま透過する。
      operationId: bff-submit-feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: 既存フィードバックの更新（upsert）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "201":
          description: 新規フィードバックの作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"

  /bff/feedback/stats:
    get:
      tags: [Feedback]
      summary: "FR-08: 満足率の集計取得（BFF 集約・品質可視化）"
      operationId: bff-feedback-stats
      parameters:
        - name: answerId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "指定時はその回答に絞って集計する"
      responses:
        "200":
          description: フィードバック集計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStatsDto"

  /bff/dashboard/summary:
    get:
      tags: [Dashboard]
      summary: "FR-10, UC-05: ダッシュボードサマリ（BFF 集約）"
      description: |
        DashboardService（利用状況・検索傾向）と FeedbackService（回答品質）を 1 応答へ集約する。
        利用状況と満足率の期間の起点を揃えるため、有効な days を BFF で確定し双方へ同じ値を渡す。
        管理者ロール（AdminOnly）に限定する。
      operationId: bff-dashboard-summary
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
          description: "集計期間（日数）。既定 7 日、上限 90 日にクランプ"
        - name: top
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
          description: "検索傾向で返す上位件数。既定 10、上限 50"
      responses:
        "200":
          description: 利用状況・検索傾向・回答品質を集約したサマリ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardSummaryDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  /bff/admin/config:
    get:
      tags: [Config]
      summary: "FR-15, SC-11: 現在有効な実効構成の取得"
      description: |
        現在有効なシステム構成（パイプライン段構成・イベント接続・ポート実装選択・コネクタ一覧）と
        構成バージョン（Git コミット）を返す。IADR-0029: 独立サービス化せず BFF 配下の管理 API として同居。
        IADR-0030: 閲覧は ConfigViewer ポリシー（platform-admin / platform-operator）に限定。
        非権限（無認証を含む）には 404 で応答自体を秘匿する（IADR-0009 の存在秘匿と整合。401/403 は返さない）。
        取得は許可・拒否ともに監査ログへ記録する。
      operationId: bff-config-effective
      responses:
        "200":
          description: 実効構成（段・接続・ポート選択・コネクタ・構成バージョン）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EffectiveConfigDto"
        "404":
          description: 非権限（存在秘匿。無認証・一般利用者を含む）

  /bff/admin/config/drift:
    get:
      tags: [Config]
      summary: "FR-15, SC-11: 宣言（Git）と実効構成のドリフト検出"
      description: |
        宣言的構成（pipeline.json）と実行時の実効構成の不一致（ドリフト）を検出して返す。
        認可・秘匿の挙動は `/bff/admin/config` と同一（ConfigViewer / 非権限は 404）。
      operationId: bff-config-drift
      responses:
        "200":
          description: ドリフト検出結果
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DriftReportDto"
        "404":
          description: 非権限（存在秘匿。無認証・一般利用者を含む）

  /bff/admin/config/history:
    get:
      tags: [Config]
      summary: "FR-15, SC-11: 構成バージョンの適用履歴（新しい順）"
      description: |
        IADR-0046: 構成バージョン適用履歴（コミット ID・適用日時・適用者・その時点のドリフト有無）を
        新しい順で返す。**正データ源は GitOps 層**（Git のコミット履歴・ArgoCD のリビジョン履歴）であり、
        API は永続化せず注入されたスライスを返す。保持範囲は GitOps 側が決めるため API・画面は切り詰めない。
        認可・秘匿・監査の挙動は `/bff/admin/config` と同一（ConfigViewer / 非権限は 404）。
      operationId: bff-config-history
      responses:
        "200":
          description: 適用履歴（新しい順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConfigVersionEntryDto"
        "404":
          description: 非権限（存在秘匿。無認証・一般利用者を含む）

  # ── SC-09, FR-09, UC-05: ABAC 管理 BFF（AdminOnly・透過中継）─
  # IADR-0040: AuthorizationService の管理 API へ AdminOnly で中継する。応答は status・content-type・
  # 本文をそのまま返す（passthrough）。保存前検証の 400（RFC7807）・参照競合の 409・不在の 404 を保つ。
  # 全パスに共通する応答: 401（未認証）／403（管理者ロール以外）／502（後段不達）。
  /bff/admin/authz/policies:
    get:
      tags: [Authorization]
      summary: "FR-09, SC-09: ABAC ポリシー一覧（BFF 集約）"
      operationId: bff-authz-list-policies
      responses:
        "200":
          description: ポリシー一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AbacPolicyDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: AuthorizationService へ到達できない }
    post:
      tags: [Authorization]
      summary: "FR-09, UC-05, SC-09: ABAC ポリシー登録（保存前に矛盾検証）"
      description: |
        後段は保存前に属性辞書との整合を検証し、矛盾があれば **400（RFC7807 ValidationProblem。
        `errors.errors` にメッセージ配列）** で拒否する。BFF はこれを透過し、画面が検証結果として表示する。
      operationId: bff-authz-create-policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPolicyDto"
        "400":
          description: 保存前検証エラー（RFC7807 ValidationProblem）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: AuthorizationService へ到達できない }

  /bff/admin/authz/policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Authorization]
      summary: "FR-09, SC-09: ABAC ポリシー個別取得（BFF 集約）"
      operationId: bff-authz-get-policy
      responses:
        "200":
          description: ポリシー
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPolicyDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }
    put:
      tags: [Authorization]
      summary: "FR-09, UC-05, SC-09: ABAC ポリシー更新（保存前に矛盾検証）"
      description: "後段は登録と同じ `CreatePolicyRequest` を受ける（専用の更新型を持たない）。"
      operationId: bff-authz-update-policy
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePolicyRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPolicyDto"
        "400":
          description: 保存前検証エラー（RFC7807 ValidationProblem）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }
    delete:
      tags: [Authorization]
      summary: "FR-09, SC-09: ABAC ポリシー削除（BFF 集約）"
      operationId: bff-authz-delete-policy
      responses:
        "204": { description: 削除成功 }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }

  /bff/admin/authz/policies/{id}/active:
    patch:
      tags: [Authorization]
      summary: "FR-09, SC-09: ポリシー有効／無効の切替（削除せず一時停止）"
      operationId: bff-authz-set-policy-active
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetActiveRequest"
      responses:
        "200":
          description: 切替成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AbacPolicyDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }

  /bff/admin/authz/attributes:
    get:
      tags: [Authorization]
      summary: "FR-09, SC-09: 属性辞書一覧（BFF 集約）"
      operationId: bff-authz-list-attributes
      responses:
        "200":
          description: 属性辞書一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/AttributeDefinitionDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: AuthorizationService へ到達できない }
    post:
      tags: [Authorization]
      summary: "FR-09, UC-05, SC-09: 属性辞書登録（キー重複・許可値検証）"
      operationId: bff-authz-create-attribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateAttributeRequest"
      responses:
        "201":
          description: 作成成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionDto"
        "400":
          description: 保存前検証エラー（RFC7807 ValidationProblem。キー重複を含む）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "502": { description: AuthorizationService へ到達できない }

  /bff/admin/authz/attributes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Authorization]
      summary: "FR-09, SC-09: 属性辞書個別取得（BFF 集約）"
      operationId: bff-authz-get-attribute
      responses:
        "200":
          description: 属性辞書
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionDto"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }
    put:
      tags: [Authorization]
      summary: "FR-09, UC-05, SC-09: 属性辞書更新（Key / Scope は不変のため受け取らない）"
      operationId: bff-authz-update-attribute
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateAttributeRequest"
      responses:
        "200":
          description: 更新成功
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AttributeDefinitionDto"
        "400":
          description: 保存前検証エラー（RFC7807 ValidationProblem）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "502": { description: AuthorizationService へ到達できない }
    delete:
      tags: [Authorization]
      summary: "FR-09, SC-09: 属性辞書削除（参照中は 409）"
      description: |
        FR-09, IADR-0006: 既存ポリシーが当該キーを参照している場合は削除を **409** で拒否する
        （辞書外チェックが効かなくなりポリシー条件の実効的制約が緩むのを防ぐ）。
        本文は RFC7807 の Problem で、**`detail` に参照元ポリシー名が列挙される**
        （「属性 '<key>' (scope=<scope>) は次のポリシーが参照しているため削除できません: <名前, …>」）。
        IADR-0040 決定 2: 画面はこの `detail` を拒否理由として表示する。
      operationId: bff-authz-delete-attribute
      responses:
        "204": { description: 削除成功 }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（AdminOnly） }
        "404": { description: 見つからない }
        "409":
          description: 参照中の属性は削除できない（`detail` に参照元ポリシー名）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ProblemDetails"
        "502": { description: AuthorizationService へ到達できない }

  # ── SC-03/SC-05, FR-06, UC-01/UC-03/UC-07: 文書 BFF ─
  # IADR-0041 / IADR-0009: 読み取りはロールで塞がず、ABAC スコープ解決の結果でのみ絞る。
  # スコープ外・不在はいずれも 404 で応答し存在を秘匿する（「拒否」と「不在」を区別しない）。
  # 書き込みは platform-admin / platform-operator に限定し、対象がスコープ内であることを先に確かめる
  # （閲覧できない文書は変更もできない）。後段の検証 400・競合 409・不在 404 は透過する。
  /bff/documents:
    get:
      tags: [Documents]
      summary: "FR-06, SC-05: 文書一覧（ABAC スコープ内のみ）"
      description: |
        利用者の ABAC 許可スコープに合致する文書だけを返す（deny-by-default。権限外文書は列挙しない）。
        許可ポリシーが無い／認可サービス不調のときは**空配列**へ縮退し、権限外の存在を示さない。
      operationId: bff-document-list
      responses:
        "200":
          description: 文書一覧（スコープ内のみ）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentDto"
    post:
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書作成（管理者・運用者のみ）"
      description: |
        IADR-0047: 後段は機密区分（必須属性）を検証し、欠落・未知値を 400 で拒否する（最終防衛線）。
        タイトル未指定も 400。許可ポリシーが無い呼び出し元は **403**（deny-by-default で作成不可）。
      operationId: bff-document-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: 作成されたドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "400":
          description: タイトル未指定／機密区分の欠落・未知値（RFC7807 ValidationProblem）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外、または許可ポリシーが無い }

  /bff/documents/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Documents]
      summary: "FR-06, SC-03: 文書詳細（スコープ外・不在は同じ 404）"
      operationId: bff-document-detail
      responses:
        "200":
          description: ドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "404": { description: 不在またはスコープ外（存在秘匿。区別しない） }
    put:
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書更新（楽観ロック。管理者・運用者のみ）"
      description: |
        `expectedVersion` が現在版と異なれば lost update を防ぐため **409** で拒否する。
        409 の本文は RFC7807 ではなく `{ error: "version_conflict", expectedVersion, currentVersion }`。
      operationId: bff-document-update
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: 更新されたドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "400":
          description: タイトル未指定／機密区分の欠落・未知値（RFC7807 ValidationProblem）
          content:
            application/problem+json:
              schema:
                $ref: "#/components/schemas/ValidationProblemDetails"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 不在またはスコープ外（存在秘匿） }
        "409":
          description: 版競合（楽観的並行制御）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/VersionConflictDto"
    delete:
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書削除（管理者・運用者のみ）"
      description: "削除は下流（Wiki.js 同期）へ伝播し、外部システムの実体も撤去する。"
      operationId: bff-document-delete
      responses:
        "204": { description: 削除成功 }
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 不在またはスコープ外（存在秘匿） }

  /bff/documents/{id}/content:
    get:
      tags: [Documents]
      summary: "FR-06, SC-03: 文書本文（正規化 Markdown）"
      description: |
        ABAC 判定後にオブジェクトストレージ（`storage://`）からサーバサイドで読み取る。
        ストレージ未配備・URI 未設定時はプレースホルダ本文へ縮退する（500 にしない）。
      operationId: bff-document-content
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 本文（正規化 Markdown）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentContentDto"
        "404": { description: 不在またはスコープ外（存在秘匿） }

  /bff/documents/{id}/versions:
    get:
      tags: [Documents]
      summary: "FR-06, UC-03, SC-03: 版履歴一覧（新しい順）"
      operationId: bff-document-versions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 版履歴（新しい順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DocumentVersionDto"
        "404": { description: 不在またはスコープ外（存在秘匿） }

  /bff/documents/{id}/publish:
    post:
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書を公開する（取り込み・Wiki 同期をトリガ）"
      description: |
        アーカイブ済みからの再公開は不正遷移として **409** で拒否する。
        409 の本文は RFC7807 ではなく `{ error: "invalid_transition", from, to }`。
      operationId: bff-document-publish
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 公開されたドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 不在またはスコープ外（存在秘匿） }
        "409":
          description: "不正な状態遷移（例 archived → published）"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InvalidTransitionDto"

  /bff/documents/{id}/archive:
    post:
      tags: [Documents]
      summary: "FR-06, UC-03, SC-05: 文書をアーカイブ（非公開化）する"
      description: "status=archived の DocumentUpdated を発行し、下流の Wiki.js 同期がページを非公開化する。"
      operationId: bff-document-archive
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: アーカイブされたドキュメント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DocumentDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 不在またはスコープ外（存在秘匿） }

  # ── SC-06, FR-01/FR-02, UC-04: データソース BFF ─────
  # IADR-0039: データソースは文書 ABAC のスコープ対象ではなくシステム運用資産のため、
  # 閲覧・操作を platform-admin / platform-operator に限定する（グループ全体に RequireRole）。
  # 一覧は後段障害を空一覧へ縮退させない——「未登録」と誤認させ重複登録を誘発するため。
  /bff/datasources:
    get:
      tags: [DataSources]
      summary: "FR-01, SC-06: データソース一覧（管理者・運用者のみ）"
      description: |
        後段不達は **502** で可視化する（空一覧へ縮退させない）。後段の非 2xx はそのまま伝播する。
      operationId: bff-data-source-list
      responses:
        "200":
          description: データソース一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DataSourceDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "502": { description: DataSourceService へ到達できない }
    post:
      tags: [DataSources]
      summary: "FR-01, UC-04, SC-06: データソース登録（管理者・運用者のみ）"
      description: |
        FR-05: `defaultAttributes` 未指定時は後段が機密区分 `internal` をフェイルセーフ補完する。
      operationId: bff-data-source-create
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDataSourceRequest"
      responses:
        "201":
          description: 登録されたデータソース
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "502": { description: DataSourceService の応答が空 }

  /bff/datasources/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [DataSources]
      summary: "FR-01, SC-06: データソース個別取得"
      operationId: bff-data-source-get
      responses:
        "200":
          description: データソース
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 見つからない }
    delete:
      tags: [DataSources]
      summary: "FR-01, SC-06: データソースの無効化（論理削除）"
      description: "後段は実体を消さず status を `disabled` にする（`DataSource.Disable()`）。"
      operationId: bff-data-source-delete
      responses:
        "204": { description: 無効化成功 }
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 見つからない }

  /bff/datasources/{id}/sync:
    post:
      tags: [DataSources]
      summary: "FR-01, UC-04, SC-06: 手動同期トリガー"
      description: |
        IADR-0051: 実コネクタ経由で原本を取得・格納し `RawDocumentFetched` を発行する。
        未登録の SourceType は縮退する（連携件数 0。5xx にしない）。
        増分 watermark（`lastSyncedAt`）の前進は完全成功時のみ行う（失敗時は進めず次回再試行）。
      operationId: bff-data-source-sync
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: 同期を実行した（結果の内訳を返す）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DataSourceSyncResultDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 見つからない }

  # ── SC-07, FR-12, UC-06: 変換ジョブ BFF ─────────────
  # IADR-0042 決定 3: 運用系のため platform-admin / platform-operator に限定する。
  # IADR-0128 決定 1: **再変換（retry）だけは管理者ロールのみ**（認可メタデータは AND 合成されるため、
  # グループの「admin または operator」と AdminOnly の積＝admin のみが実効要件になる）。
  /bff/conversion/jobs:
    get:
      tags: [Conversion]
      summary: "FR-12, UC-06, SC-07: 変換ジョブ一覧（新しい順・状態で絞り込み）"
      description: |
        後段障害を空一覧へ縮退させない（「ジョブ無し」と「サービス障害」を誤認させないため）。
        非 2xx はそのまま伝播し、後段不達は **502** で可視化する。
      operationId: bff-conversion-job-list
      parameters:
        - name: status
          in: query
          required: false
          schema: { type: string }
          description: "状態で絞り込む（`queued` / `processing` / `succeeded` / `failed`。「失敗のみ」フィルタの実体）"
      responses:
        "200":
          description: 変換ジョブ一覧
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/ConversionJobDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "502": { description: ConversionService へ到達できない }

  /bff/conversion/jobs/{id}:
    get:
      tags: [Conversion]
      summary: "FR-12, UC-06, SC-07: 変換ジョブ個別取得"
      operationId: bff-conversion-job-get
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 変換ジョブ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ConversionJobDto"
        "401": { description: 未認証 }
        "403": { description: 管理者・運用者ロール以外 }
        "404": { description: 見つからない }

  /bff/conversion/jobs/{id}/retry:
    post:
      tags: [Conversion]
      summary: "FR-12, UC-06, SC-07: 人手補正（再変換）。**管理者ロールのみ**"
      description: |
        失敗ジョブのみ再変換する（原本イベントを再発行）。**`failed` 以外（`queued` / `processing` /
        `succeeded`）は 409 で拒否する**——UI 制御だけに頼らず API 側で状態を強制し、処理中の二重発行・
        成功済みの不要な再処理を防ぐ。

        **409 に本文は無い。** 後段（ConversionService）は `{ error: "not_retryable", status }` を返すが、
        BFF は `Results.StatusCode` で**ステータスのみ**を中継する（本文は落ちる）。画面は 409 という
        ステータスだけを「拒否された」の根拠にする。
      operationId: bff-conversion-job-retry
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202": { description: 再変換を受け付けた（本文なし） }
        "401": { description: 未認証 }
        "403": { description: 管理者ロール以外（IADR-0128 決定 1。運用者も拒否される） }
        "404": { description: 見つからない }
        "409": { description: "`failed` 以外のジョブは再変換できない（本文なし）" }

  # ── DocumentService ───────────────────────────────
  /documents:
    get:
      tags: [Documents]
      summary: "FR-06: ドキュメント一覧"
      operationId: list-documents
      responses:
        "200":
          description: ドキュメントリスト
    post:
      tags: [Documents]
      summary: "FR-06, UC-03: ドキュメント作成"
      operationId: create-document
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateDocumentRequest"
      responses:
        "201":
          description: 作成されたドキュメント

  /documents/{id}:
    get:
      tags: [Documents]
      operationId: get-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: ドキュメント
        "404":
          description: 見つからない
    put:
      tags: [Documents]
      operationId: update-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateDocumentRequest"
      responses:
        "200":
          description: 更新成功
    delete:
      tags: [Documents]
      summary: "FR-06, UC-03, Issue #88: ドキュメントを削除する（DocumentDeleted を発行し Wiki.js 実体も撤去）"
      operationId: delete-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "204":
          description: 削除成功

  /documents/{id}/metadata:
    patch:
      tags: [Documents]
      summary: "FR-06, UC-03: メタデータ（属性・タグ）のみ更新"
      operationId: update-document-metadata
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateMetadataRequest"
      responses:
        "200":
          description: 更新成功
        "404":
          description: 見つからない
        "409":
          description: 版競合（楽観的並行制御）

  /documents/{id}/publish:
    post:
      tags: [Documents]
      summary: "FR-06, UC-03: ドキュメントを公開する"
      operationId: publish-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 公開成功
        "404":
          description: 見つからない

  /documents/{id}/archive:
    post:
      tags: [Documents]
      summary: "FR-06, UC-03, Issue #88: ドキュメントをアーカイブ（非公開化）する"
      operationId: archive-document
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: アーカイブ成功（status=archived の DocumentUpdated を発行）
        "404":
          description: 見つからない

  /documents/{id}/versions:
    get:
      tags: [Documents]
      summary: "FR-06, UC-03: 版履歴一覧（新しい順）"
      operationId: list-document-versions
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "200":
          description: 版履歴
        "404":
          description: 見つからない

  /documents/{id}/versions/{version}:
    get:
      tags: [Documents]
      summary: "FR-06, UC-03: 特定版の取得"
      operationId: get-document-version
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
        - { name: version, in: path, required: true, schema: { type: integer } }
      responses:
        "200":
          description: 版スナップショット
        "404":
          description: 見つからない

  # ── DataSourceService ─────────────────────────────
  /datasources:
    get:
      tags: [DataSources]
      operationId: list-datasources
      responses:
        "200":
          description: データソースリスト
    post:
      tags: [DataSources]
      summary: "FR-01: データソース登録"
      operationId: create-datasource
      responses:
        "201":
          description: 登録成功

  /datasources/{id}/sync:
    post:
      tags: [DataSources]
      summary: "FR-01: 手動同期トリガー"
      operationId: trigger-sync
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        "202":
          description: 同期キューに追加

  # ── AuthorizationService ──────────────────────────
  /authz/scope:
    post:
      tags: [Authorization]
      summary: "FR-05, ADR-0004: ABAC スコープ解決"
      operationId: resolve-scope
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AccessScopeRequest"
      responses:
        "200":
          description: 許可されたフィルター
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AccessScopeResponse"

  /authz/policies:
    get:
      tags: [Authorization]
      summary: "FR-09: ABAC ポリシー一覧"
      operationId: list-policies
      responses:
        "200":
          description: ポリシー一覧
    post:
      tags: [Authorization]
      summary: "FR-09, UC-05: ABAC ポリシー登録（保存前に矛盾検証）"
      operationId: create-policy
      responses:
        "201":
          description: 作成成功
        "400":
          description: バリデーションエラー（RFC7807）

  /authz/policies/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Authorization]
      summary: "FR-09: ポリシー個別取得"
      operationId: get-policy
      responses:
        "200": { description: ポリシー }
        "404": { description: 見つからない }
    put:
      tags: [Authorization]
      summary: "FR-09, UC-05: ポリシー更新（保存前に矛盾検証）"
      operationId: update-policy
      responses:
        "200": { description: 更新成功 }
        "400": { description: バリデーションエラー（RFC7807） }
        "404": { description: 見つからない }
    delete:
      tags: [Authorization]
      summary: "FR-09: ポリシー削除"
      operationId: delete-policy
      responses:
        "204": { description: 削除成功 }
        "404": { description: 見つからない }

  /authz/policies/{id}/active:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    patch:
      tags: [Authorization]
      summary: "FR-09: ポリシー有効／無効の切替"
      operationId: set-policy-active
      responses:
        "200": { description: 切替成功 }
        "404": { description: 見つからない }

  /authz/attributes:
    get:
      tags: [Authorization]
      summary: "FR-09: 属性辞書一覧"
      operationId: list-attributes
      responses:
        "200": { description: 属性辞書一覧 }
    post:
      tags: [Authorization]
      summary: "FR-09, UC-05: 属性辞書登録（キー重複・許可値検証）"
      operationId: create-attribute
      responses:
        "201": { description: 作成成功 }
        "400": { description: バリデーションエラー（RFC7807） }

  /authz/attributes/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Authorization]
      summary: "FR-09: 属性辞書個別取得"
      operationId: get-attribute
      responses:
        "200": { description: 属性辞書 }
        "404": { description: 見つからない }
    put:
      tags: [Authorization]
      summary: "FR-09, UC-05: 属性辞書更新（Key/Scope は不変）"
      operationId: update-attribute
      responses:
        "200": { description: 更新成功 }
        "400": { description: バリデーションエラー（RFC7807） }
        "404": { description: 見つからない }
    delete:
      tags: [Authorization]
      summary: "FR-09: 属性辞書削除"
      operationId: delete-attribute
      responses:
        "204": { description: 削除成功 }
        "404": { description: 見つからない }

  /authz/attributes/validate:
    post:
      tags: [Authorization]
      summary: "FR-09, UC-05: 文書属性の辞書整合バリデーション（副作用なし）"
      operationId: validate-document-attributes
      responses:
        "200":
          description: "検証結果 { valid, errors }"

  # ── WikiService ───────────────────────────────────
  /wiki/pages:
    get:
      tags: [Wiki]
      summary: "FR-13: Wiki ページ一覧"
      operationId: list-wiki-pages
      responses:
        "200":
          description: ページリスト

  /wiki/pages/{slug}:
    get:
      tags: [Wiki]
      operationId: get-wiki-page
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Wiki ページ
        "404":
          description: 見つからない

  # ── FeedbackService（直接・内部 API / IADR-0017）─────
  /feedback:
    post:
      tags: [Feedback]
      summary: "FR-08, UC-01: フィードバック送信（upsert・冪等）"
      description: |
        新規は 201、既存 (answerId, userId) の更新は 200（upsert）。
        利用者は JWT から特定する（テスト・開発環境では anonymous）。
        同一 (answerId, userId) は二重計上しない（IADR-0010）。
      operationId: submit-feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: 既存フィードバックの更新（upsert）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "201":
          description: 新規フィードバックの作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "400":
          description: "バリデーションエラー（answerId 未指定 / rating 不正 / comment 長超過）"
    get:
      tags: [Feedback]
      summary: "FR-08: フィードバック一覧（品質レビュー用）"
      description: |
        NFR（認可）: 自由記述 Comment と UserId（個人特定情報）を返すため、管理者ロール（AdminOnly）のみ許可する。
        全件無制限返却を防ぐページング（skip>=0 / 1<=take<=500）。
      operationId: list-feedback
      parameters:
        - name: rating
          in: query
          required: false
          schema: { type: string, enum: [up, down] }
          description: "評価で絞り込む（低評価回答のレビュー等）"
        - name: answerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: skip
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
        - name: take
          in: query
          required: false
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: フィードバック一覧（更新日時の新しい順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  /feedback/stats:
    get:
      tags: [Feedback]
      summary: "FR-08, FR-10: フィードバック集計（👍/👎 件数・満足率）"
      description: |
        集計値のみで PII を含まないため AdminOnly は課さない（BFF が集約して画面へ）。
        FR-10 ダッシュボードの回答品質の入力となる。
      operationId: feedback-stats
      parameters:
        - name: answerId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "指定時はその回答に絞って集計する"
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90 }
          description: "期間指定（日数、[1,90] にクランプ）。未指定は全期間（後方互換）"
      responses:
        "200":
          description: フィードバック集計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStatsDto"

  # ── DashboardService（直接・内部 API / IADR-0017）────
  /dashboard/events:
    post:
      tags: [Dashboard]
      summary: "FR-10: 利用イベント（検索・回答）を記録する"
      description: |
        集計の入力となるため、認証済みなら誰でも記録できる（認証は必須）。
        利用者は JWT から特定する（テスト・開発環境では anonymous）。
      operationId: record-usage-event
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UsageEventRequest"
      responses:
        "201":
          description: 記録された利用イベント
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UsageEventCreatedDto"
        "400":
          description: "eventType 不正（search / answer 以外）"
        "401":
          description: 未認証

  /dashboard/usage:
    get:
      tags: [Dashboard]
      summary: "FR-10: 日次利用状況（日付 × 種別の件数）"
      description: "利用傾向は運用情報のため管理者ロール（AdminOnly）に限定する。"
      operationId: dashboard-usage
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
      responses:
        "200":
          description: 日次利用状況
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/UsagePointDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  /dashboard/trends:
    get:
      tags: [Dashboard]
      summary: "FR-10: 検索傾向（よく検索される語の上位）"
      operationId: dashboard-trends
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
        - name: top
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 検索傾向（件数降順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/SearchTrendDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  /dashboard/summary:
    get:
      tags: [Dashboard]
      summary: "FR-10: 利用側サマリ（総件数・利用状況・検索傾向）"
      description: |
        回答品質は含まず、BFF が FeedbackService から付加して DashboardSummaryDto を組み立てる。
        管理者ロール（AdminOnly）に限定する。
      operationId: dashboard-usage-summary
      parameters:
        - name: days
          in: query
          required: false
          schema: { type: integer, default: 7, minimum: 1, maximum: 90 }
        - name: top
          in: query
          required: false
          schema: { type: integer, default: 10, minimum: 1, maximum: 50 }
      responses:
        "200":
          description: 利用側サマリ
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DashboardUsageDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  # ── LlmGateway（直接・内部 API / IADR-0017）─────────
  /complete:
    post:
      tags: [Completions]
      summary: "FR-04, FR-11, ADR-0010: LLM テキスト生成"
      description: |
        AiAnalysisService が呼び出す。FR-11: 入力の機密区分（confidentiality）・用途（purpose）に応じて
        呼び出し先（ティア/エンドポイント/モデル）を越境マトリクスで判定し切り替える。
        機密区分による送信拒否・呼び出し先不調時も 500 を伝播せず、sent=false の縮退応答を 200 で返す
        （呼び出し側が出典のみ返す等の縮退へ切り替えられるようにする）。
        ADR-0025 / IADR-0104: 送信が成立した場合はモデル側の終了理由を stopReason で返す。
        `stopReason="refusal"`（モデルが拒否）は HTTP 200・sent=true・text 空で到着するため、
        呼び出し側は text の空だけを見ず stopReason を確認する。
      operationId: complete
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompletionApiRequest"
      responses:
        "200":
          description: 生成結果（送信拒否・縮退時は sent=false）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionApiResponse"

  /embed:
    post:
      tags: [Embeddings]
      summary: "FR-02, FR-05, ADR-0016/0017, IADR-0025: 埋め込み生成"
      description: |
        IngestionService（purpose=index）/ RetrievalService（purpose=query）が呼び出す。
        機密区分（confidentiality）で送信先ティアを切替: confidential/restricted はティアA
        （セルフホスト Ruri v3/768 次元）固定で外部送信しない（未構成時は fail-closed で
        embedded=false）。それ以外はティアB（Voyage voyage-3.5/1024 次元）。検索クエリ
        （purpose=query）は検索対象コレクションと次元を一致させるため既定外部経路へ固定する。
        送信拒否・不調時も 500 を伝播せず embedded=false の縮退応答を 200 で返す
        （retryable=true は一時障害で呼び出し側が再試行、false は恒久理由でスキップ）。
      operationId: embed
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EmbedApiRequest"
      responses:
        "200":
          description: 埋め込み結果（送信拒否・縮退時は embedded=false）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EmbedApiResponse"

components:
  schemas:
    SearchRequest:
      type: object
      required: [query]
      properties:
        query: { type: string, example: "ナレッジ管理とは" }
        topK: { type: integer, default: 10 }
        attributeFilters:
          type: object
          additionalProperties: { type: string }
        # FR-03, SC-02, #531: 検索モード（**3 値**・既定 hybrid）。利用者裁定 Q4（planning#197）。
        # enum にはしない（IADR-0131 決定 5）——閉じた enum は後段の値追加を SPA 側で破壊的にする。
        # 未知の値・未指定は RetrievalService が hybrid へ縮退させる。
        mode:
          type: string
          default: hybrid
          description: >-
            hybrid（既定・ベクトル＋全文の RRF 融合）/ keyword（全文のみ）/ semantic（ベクトルのみ）。
            未知の値は hybrid として扱う。
          example: hybrid

    # ── #520 / IADR-0132: 応答スキーマの `required` は C# の**非 null 性**から起こす。
    # `?` の付かないメンバー（値型・コレクションを含む）だけを required に入れる。
    # required が無いと orval は全プロパティを省略可（`?`）で生成し、生成型が型検査の網にならない
    # （#506 の変異試験 M2 で実測）。
    SearchResponse:
      type: object
      description: "FR-03: 検索応答（`Knowledge.Contracts/Dtos/SearchDto.cs` の `SearchResponse`）"
      required: [results, totalHits, elapsedMs]
      properties:
        results:
          type: array
          items:
            $ref: "#/components/schemas/SearchResultDto"
        totalHits: { type: integer }
        elapsedMs: { type: integer }

    SearchResultDto:
      type: object
      description: "FR-03, FR-04: 検索結果 1 件（`Knowledge.Contracts/Dtos/SearchResultDto.cs`）"
      required: [chunkId, documentId, documentTitle, text, score, attributes, tags]
      properties:
        chunkId: { type: string, format: uuid }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        text: { type: string }
        score: { type: number, format: float }
        markdownUri: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }

    AskRequest:
      type: object
      required: [question]
      properties:
        question: { type: string, example: "プロジェクト憲章の承認フローを教えて" }
        scope:
          type: string
          nullable: true
          description: "呼び出し側が付す任意の絞り込み識別子（`AnalysisRequest.Scope`）。省略可"

    AnalysisTaskRequest:
      type: object
      required: [instruction]
      properties:
        instruction:
          type: string
          example: "2025 年度の経費規程の変更点を比較して"
        taskType:
          type: string
          enum: [Analyze, Compare, Extract]
          default: Analyze
          description: "分析 / 比較 / 抽出"
        range:
          $ref: "#/components/schemas/AnalysisDataRange"

    AnalysisDataRange:
      type: object
      description: "指定データ範囲。ABAC 許可スコープと交差し権限を広げない（narrowing-only）。"
      properties:
        query:
          type: string
          nullable: true
          description: "範囲内で関連箇所を絞る検索クエリ（省略時は instruction を流用）"
        attributeFilters:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
          description: "属性キー → 許可値集合（例: department: [sales]）"
        topK: { type: integer, default: 8 }

    AiAnswerDto:
      type: object
      description: |
        FR-04: RAG 回答（回答本文＋番号付き出典）。
        Issue #506 監査: `citations` の型は **`CitationDto[]`** である（旧記載の `SearchResultDto[]` は誤り。
        実体は `Knowledge.Contracts/Dtos/SearchResultDto.cs` の `AiAnswerDto`）。両者に共通するのは
        `documentId` / `documentTitle` / `chunkId` / `score` の 4 つだけで、`number` / `snippet` /
        `sourceUri` は `CitationDto` にしか無い。
      required: [answer, citations, model, inputTokens, outputTokens, answerId]
      properties:
        answer: { type: string }
        citations:
          type: array
          items:
            $ref: "#/components/schemas/CitationDto"
        model: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        answerId:
          type: string
          format: uuid
          description: |
            FR-08, UC-01: この回答の識別子。フィードバック（👍/👎・コメント）の紐付け先で、
            回答生成ごとに自動採番される（`FeedbackRequest.answerId` へ渡す）。

    CitationDto:
      type: object
      description: |
        FR-04: 出典（番号付き＋元文書へのリンク）。AI 回答中の [1][2] と対応する根拠で、
        利用者は `sourceUri` から元文書へ辿れる。
      required: [number, documentId, documentTitle, chunkId, score, snippet]
      properties:
        number: { type: integer, description: "回答本文中の [n] と対応する番号" }
        documentId: { type: string, format: uuid }
        documentTitle: { type: string }
        chunkId: { type: string, format: uuid }
        sourceUri: { type: string, nullable: true }
        score: { type: number, format: float }
        snippet: { type: string, description: "根拠箇所の抜粋" }

    AccessScopeRequest:
      type: object
      required: [userId, userAttributes]
      properties:
        userId: { type: string }
        userAttributes:
          type: object
          additionalProperties: { type: string }

    AccessScopeResponse:
      type: object
      description: |
        FR-05: ABAC スコープ解決結果（`Platform.Shared.Contracts/Dtos/AccessScopeDto.cs`）。
        #520 監査: C# には `bool Granted = false`（許可ポリシーが 1 つでも一致したか）が在るが、
        本スキーマには対応する `granted` が無い。**フィールドの追加は本 issue の範囲外**
        （`required` を入れる作業と別種の是正）。作業仕様書 #520 §未決事項 1 で申し送る。
      required: [userId, allowedFilters]
      properties:
        userId: { type: string }
        allowedFilters:
          type: array
          items:
            type: object
            description: "FR-05: 1 つの属性キーに対する許可値集合（`AttributeFilter`）"
            required: [key, allowedValues]
            properties:
              key: { type: string }
              allowedValues:
                type: array
                items: { type: string }

    CreateDocumentRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        originalUri: { type: string, nullable: true }
        contentType: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }

    UpdateDocumentRequest:
      type: object
      required: [title]
      properties:
        title: { type: string }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        expectedVersion: { type: integer, nullable: true, description: "楽観的並行制御。現在版と不一致なら 409" }
        changeNote: { type: string, nullable: true }

    UpdateMetadataRequest:
      type: object
      properties:
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        expectedVersion: { type: integer, nullable: true, description: "楽観的並行制御。現在版と不一致なら 409" }
        changeNote: { type: string, nullable: true }

    # ── FR-06, SC-03/SC-05: 文書（BFF ↔ SPA 契約）─────
    # 状態・種別を表す文字列は **enum にしない**。C# 側は `string` であり、値集合は
    # `DocumentStatus` 等の const 群にすぎない。閉じた enum にすると、後段が値を増やしたときに
    # SPA が既存の値を解釈できなくなる（既存画面は「未知の値も受け取る」を明示的な仕様としている）。
    DocumentDto:
      type: object
      description: "FR-06: 文書 1 件（`Knowledge.Contracts/Dtos/DocumentDto.cs`）"
      required: [id, title, status, version, attributes, tags, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        status:
          type: string
          description: "公開ライフサイクル（`draft` / `normalized` / `published` / `archived`）。**変換結果ではない**"
        markdownUri: { type: string, nullable: true }
        version: { type: integer, description: "FR-06, UC-03: 現在の版番号（楽観ロックの `expectedVersion` に渡す）" }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    DocumentContentDto:
      type: object
      description: |
        SC-03, FR-06: 文書本文（正規化 Markdown）。BFF が ABAC 判定後にオブジェクトストレージ
        （`storage://`）から読み取り、閲覧を許可された呼び出し元にのみ払い出す。
      required: [id, title, markdown]
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        markdown: { type: string }
        sourceUri: { type: string, nullable: true }

    DocumentVersionDto:
      type: object
      description: "FR-06, UC-03: 文書の版スナップショット"
      required: [documentId, version, title, status, attributes, tags, createdAt]
      properties:
        documentId: { type: string, format: uuid }
        version: { type: integer }
        title: { type: string }
        status: { type: string }
        markdownUri: { type: string, nullable: true }
        attributes:
          type: object
          additionalProperties: { type: string }
        tags:
          type: array
          items: { type: string }
        changeNote: { type: string, nullable: true }
        createdAt: { type: string, format: date-time }

    VersionConflictDto:
      type: object
      description: |
        FR-06, UC-03: 楽観的並行制御の競合（409）。**RFC7807 ではない素の JSON** である
        （`Results.Conflict(new { error, expectedVersion, currentVersion })`）。
      required: [error, expectedVersion, currentVersion]
      properties:
        error: { type: string, example: "version_conflict" }
        expectedVersion: { type: integer }
        currentVersion: { type: integer }

    InvalidTransitionDto:
      type: object
      description: |
        FR-06, UC-03, SC-05: 不正な状態遷移（409）。**RFC7807 ではない素の JSON** である
        （`Results.Conflict(new { error, from, to })`）。
      required: [error, from, to]
      properties:
        error: { type: string, example: "invalid_transition" }
        from: { type: string, example: "archived" }
        to: { type: string, example: "published" }

    # ── FR-01/FR-02, SC-06: データソース ──────────────
    DataSourceDto:
      type: object
      description: |
        FR-01, UC-04, SC-06: データソース 1 件（`Knowledge.Contracts/Dtos/DataSourceDto.cs`）。
        IADR-0053: `config` の**秘密キー（token / password / secret / credential を含むキー）は
        後段が `***` へマスク済み**である。SPA から秘密を埋め込むことはしない。
      required: [id, name, sourceType, connectionUri, status, config, defaultAttributes, createdAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        sourceType: { type: string, description: "コネクタ種別（`filesystem` / `wiki` / `saas` / `db` ほか）" }
        connectionUri: { type: string }
        status: { type: string, description: "`active` / `disabled`。**同期の健全性は表さない**" }
        lastSyncedAt: { type: string, format: date-time, nullable: true }
        config:
          type: object
          additionalProperties: { type: string }
          description: "コネクタ設定（秘密キーはマスク済み）"
        defaultAttributes:
          type: object
          additionalProperties: { type: string }
          description: "FR-05: 原本へ付与する既定 ABAC 文書属性（`confidentiality` 等）"
        createdAt: { type: string, format: date-time }

    CreateDataSourceRequest:
      type: object
      required: [name, sourceType, connectionUri]
      properties:
        name: { type: string }
        sourceType: { type: string }
        connectionUri: { type: string }
        config:
          type: object
          nullable: true
          additionalProperties: { type: string }
        defaultAttributes:
          type: object
          nullable: true
          additionalProperties: { type: string }
          description: "未指定時は後段が機密区分 `internal` をフェイルセーフ補完する"

    DataSourceSyncResultDto:
      type: object
      description: |
        FR-01, UC-04: 手動同期の結果（202 の本文）。契約 record を持たず、
        `DataSourceEndpoints` の匿名型がそのまま JSON になる。
      required: [fetched, failed, connectorAvailable]
      properties:
        fetched: { type: integer, description: "取得できた原本の件数" }
        failed: { type: integer, description: "取得に失敗した件数" }
        connectorAvailable:
          type: boolean
          description: "IADR-0051: 当該 sourceType のコネクタが DI 登録されているか。false は縮退（5xx にしない）"
        message: { type: string, nullable: true }

    # ── FR-12, SC-07: 変換ジョブ ──────────────────────
    ConversionJobDto:
      type: object
      description: "FR-12, UC-06, SC-07: 変換ジョブの状況（`Knowledge.Contracts/Dtos/ConversionJobDto.cs`）"
      required: [id, sourceId, sourceType, originalPath, status, attempts, deadLettered, maxAttempts, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        sourceId: { type: string, format: uuid }
        sourceType: { type: string }
        originalPath: { type: string }
        status:
          type: string
          description: "`queued` / `processing` / `succeeded` / `failed`。**`failed` のみ再変換できる**"
        error: { type: string, nullable: true, description: "失敗ジョブの理由" }
        documentId: { type: string, format: uuid, nullable: true }
        markdownUri: { type: string, nullable: true }
        attempts: { type: integer, description: "変換試行の累計。**手動再変換をまたいで累積する**ため `maxAttempts` を超え得る" }
        deadLettered:
          type: boolean
          description: |
            **デッドレター標識**（05_screens §SC-07・裁定 Q13）。自動再試行を使い切って
            `<queue>_error` へ送られた失敗か。**`status` の 5 値目ではない**——同節は
            「ジョブ状態モデルは 4 値である…デッドレターの表示は `failed` の内訳として扱う」と定める。
            `true` は「人が原本に手を入れるまで自動では直らない」信号であり、`status` が `failed` の
            ときだけ真になる（再変換を受け付けた時点で `false` へ戻る）。
        maxAttempts:
          type: integer
          description: |
            **試行上限**（同上）。1 回の配信で行う自動再試行の上限（初回 ＋ 再試行）。
            **手動再変換の回数上限ではない**（同節「手動再変換の回数上限は設けない」）。
            全ジョブで同じ値を返す（実体は変換サービスの再試行設定）。
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    # ── FR-09, SC-09: ABAC 管理（属性辞書・ポリシー）───
    AbacPolicyDto:
      type: object
      description: "FR-09: ABAC ポリシー（利用者属性 × 文書属性 → 許可アクション）"
      required: [id, name, action, userConditions, documentConditions, isActive, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        name: { type: string }
        action: { type: string, description: "`read` / `analyze` / `manage`" }
        userConditions:
          $ref: "#/components/schemas/AbacConditionMap"
        documentConditions:
          $ref: "#/components/schemas/AbacConditionMap"
        isActive: { type: boolean, description: "削除せず一時停止できるようにするための有効フラグ" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    AbacConditionMap:
      type: object
      description: |
        FR-09: 属性キー → 許可値の集合（例 `{"department": ["sales","hr"]}`）。
        契約が表現するのは**集合への所属**だけであり、比較演算子・包含などの式は表現しない。
        #520: **`required` を入れない**——`properties` を持たない写像（`additionalProperties` のみ）で、
        `required` は `properties` のキーを指すため適用できない。本スキーマは唯一「要求と応答の両方」で
        使われるが、この理由で要求側への波及も起こらない。
      additionalProperties:
        type: array
        items: { type: string }

    AttributeDefinitionDto:
      type: object
      description: "FR-09: 属性辞書エントリ（管理者が定義する取りうる値）"
      required: [id, key, label, allowedValues, required, scope, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        key: { type: string, example: "confidentiality" }
        label: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        required: { type: boolean }
        scope: { type: string, description: "`document` / `user`。**Key と併せて一意**で、登録後は不変" }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    CreatePolicyRequest:
      type: object
      required: [name, action, userConditions, documentConditions]
      description: "FR-09, UC-05: ポリシーの登録・更新（更新も同じ型を用いる）"
      properties:
        name: { type: string }
        action: { type: string, description: "`read` / `analyze` / `manage`" }
        userConditions:
          $ref: "#/components/schemas/AbacConditionMap"
        documentConditions:
          $ref: "#/components/schemas/AbacConditionMap"

    SetActiveRequest:
      type: object
      required: [isActive]
      properties:
        isActive: { type: boolean }

    CreateAttributeRequest:
      type: object
      required: [key, label, allowedValues, required]
      properties:
        key: { type: string }
        label: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        required: { type: boolean }
        scope:
          type: string
          nullable: true
          description: "`document` / `user`。未指定は `document`"

    UpdateAttributeRequest:
      type: object
      required: [label, allowedValues, required]
      description: "FR-09: 属性辞書の更新。**Key / Scope は同一性・一意制約の基礎のため不変で、受け取らない**"
      properties:
        label: { type: string }
        allowedValues:
          type: array
          items: { type: string }
        required: { type: boolean }

    # ── RFC7807（Problem Details）──────────────────────
    ProblemDetails:
      type: object
      description: |
        RFC7807。`Results.Problem(title, detail, statusCode)` が返す形。
        #520: **`required` を入れない**——RFC7807 はどのメンバーも省略され得る（指定しなかった項目は
        出力されない）。ここで必須化すると、実在しない保証を生成型に持たせることになる。
      properties:
        type: { type: string, nullable: true }
        title: { type: string, nullable: true }
        status: { type: integer, nullable: true }
        detail: { type: string, nullable: true }
        instance: { type: string, nullable: true }

    ValidationProblemDetails:
      type: object
      description: |
        RFC7807 の検証エラー。`Results.ValidationProblem` が返す形で、
        AuthorizationService は `errors.errors` に**メッセージの配列**を束ねる
        （キーごとの配列という一般形に載せた運用。`apiClient.parseProblemDetails` がこれを平坦化する）。
        #520: **`required` を入れない**（理由は `ProblemDetails` と同じ）。
      properties:
        type: { type: string, nullable: true }
        title: { type: string, nullable: true }
        status: { type: integer, nullable: true }
        detail: { type: string, nullable: true }
        errors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }

    # ── FR-08: Feedback ───────────────────────────────
    FeedbackRequest:
      type: object
      required: [answerId, rating]
      properties:
        answerId:
          type: string
          format: uuid
          description: "対象 AI 回答の ID（AiAnswerDto 由来）。空 Guid は不可"
        rating:
          type: string
          enum: [up, down]
          description: "👍（up）/ 👎（down）"
        comment:
          type: string
          nullable: true
          maxLength: 2000
          description: "自由記述（任意、最大 2000 文字）"
        question:
          type: string
          nullable: true
          maxLength: 1000
          description: "回答の元となった質問（品質レビュー用の文脈。任意、最大 1000 文字）。超過分は拒否せず黙って切り詰める"

    FeedbackDto:
      type: object
      description: "FR-08: 保存済みフィードバック（`Knowledge.Contracts/Dtos/FeedbackDto.cs`）"
      required: [id, answerId, rating, userId, createdAt, updatedAt]
      properties:
        id: { type: string, format: uuid }
        answerId: { type: string, format: uuid }
        rating: { type: string, enum: [up, down] }
        comment: { type: string, nullable: true }
        question: { type: string, nullable: true }
        userId: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }

    FeedbackStatsDto:
      type: object
      description: "フィードバック集計（satisfactionRate = up / total、total=0 のとき 0）"
      required: [up, down, total, satisfactionRate]
      properties:
        up: { type: integer }
        down: { type: integer }
        total: { type: integer }
        satisfactionRate: { type: number, format: double }

    # ── FR-10: Dashboard ──────────────────────────────
    UsageEventRequest:
      type: object
      required: [eventType]
      properties:
        eventType:
          type: string
          enum: [search, answer]
          description: "検索実行（search）/ AI 回答生成（answer）"
        query:
          type: string
          nullable: true
          description: "検索語（種別が search のとき任意。検索傾向の集計に用いる）"

    UsageEventCreatedDto:
      type: object
      description: |
        FR-10: 記録された利用イベントの ID。契約 record を持たず、`DashboardEndpoints` の匿名型
        （`new { ev.Id }`）がそのまま JSON になる。`UsageEvent.Id` は非 null の `Guid`。
      required: [id]
      properties:
        id: { type: string, format: uuid }

    UsagePointDto:
      type: object
      description: "日次利用状況の 1 点（日付 × 種別の件数）"
      required: [date, eventType, count]
      properties:
        date: { type: string, format: date }
        eventType: { type: string, enum: [search, answer] }
        count: { type: integer }

    SearchTrendDto:
      type: object
      description: "検索傾向の 1 点（検索語 × 件数）"
      required: [term, count]
      properties:
        term: { type: string }
        count: { type: integer }

    DashboardUsageDto:
      type: object
      description: "DashboardService が返す利用側サマリ（回答品質は含まない）"
      required: [totalSearches, totalAnswers, usageTrend, topSearchTerms]
      properties:
        totalSearches: { type: integer }
        totalAnswers: { type: integer }
        usageTrend:
          type: array
          items:
            $ref: "#/components/schemas/UsagePointDto"
        topSearchTerms:
          type: array
          items:
            $ref: "#/components/schemas/SearchTrendDto"

    DashboardSummaryDto:
      type: object
      description: "BFF が組み立てるダッシュボードサマリ（利用状況・検索傾向・回答品質を集約）"
      required: [totalSearches, totalAnswers, usageTrend, topSearchTerms, quality]
      properties:
        totalSearches: { type: integer }
        totalAnswers: { type: integer }
        usageTrend:
          type: array
          items:
            $ref: "#/components/schemas/UsagePointDto"
        topSearchTerms:
          type: array
          items:
            $ref: "#/components/schemas/SearchTrendDto"
        quality:
          $ref: "#/components/schemas/FeedbackStatsDto"

    # ── FR-11: LlmGateway completion ──────────────────
    CompletionApiRequest:
      type: object
      required: [prompt]
      properties:
        prompt: { type: string }
        maxTokens:
          type: integer
          default: 4096
          description: >-
            出力トークン上限。thinking（拡張思考）が既定で有効なモデル（Opus 5 / Sonnet 5 等）では
            思考トークンと本文の合算上限になるため、既定は本文想定長＋思考の作業領域を見込んだ
            4096 とする（IADR-0101）。小さすぎると本文が空または途中で切れる。
        model:
          type: string
          nullable: true
          description: "明示要求モデル。null の場合はゲートウェイが用途（purpose）に応じて選択する"
        confidentiality:
          type: string
          nullable: true
          enum: [public, internal, confidential, restricted]
          description: |
            入力文書の最高機密区分（大文字小文字は無視）。越境マトリクスで呼び出し先を判定する。
            未指定（null/空）・未知の値は安全側の restricted に倒す（fail-safe, deny-by-default）。
        purpose:
          type: string
          nullable: true
          description: "用途。null/空は default 扱い"

    CompletionApiResponse:
      type: object
      description: |
        sent=false は機密区分による送信拒否（縮退）または呼び出し先不調を示す。
        IADR-0104: sent（越境させたか）と stopReason（モデル側の終了理由）は独立した軸である。
      required: [text, model, inputTokens, outputTokens, sent]
      properties:
        text: { type: string }
        model: { type: string }
        inputTokens: { type: integer }
        outputTokens: { type: integer }
        sent: { type: boolean }
        endpoint:
          type: string
          nullable: true
          description: "選択・拒否した呼び出し先（監査・縮退表示用）"
        routingReason:
          type: string
          nullable: true
          description: "選択・拒否の理由（監査・縮退表示用）"
        stopReason:
          type: string
          nullable: true
          example: "refusal"
          description: |
            ADR-0025, IADR-0104: 送信が成立した場合のモデル側の終了理由。
            未送信（sent=false）・`finish_reason` を返さないプロバイダでは null。既知の語彙は
            `end_turn` / `max_tokens` / `refusal` / `stop_sequence` / `tool_use` だが、**閉じた enum にはしない**。
            語彙が増えたときに未知の値を弾かず、そのまま透過してログ・監査に残すためである。
            IADR-0109 (#394): この語彙は**プロバイダ横断の正準語彙**（Anthropic の stop_reason 由来）である。
            OpenAI 互換 API を呼ぶプロバイダ（セルフホスト＝ティアA / Copilot＝ティアC）は
            `choices[].finish_reason` をゲートウェイ側で正規化して返す
            （`stop`→`end_turn` / `length`→`max_tokens` / `content_filter`→`refusal` /
            `tool_calls`・`function_call`→`tool_use`。未知値は原文のまま透過し warn ログに残る）。
            呼び出し側がプロバイダごとに語彙を出し分ける必要はない。
            - `refusal`: モデルが拒否した（安全性分類器による停止。OpenAI 互換の `content_filter` を含む）。
              **text は空**で返す（拒否直前の断片を下流の判断材料にしないため、ゲートウェイが破棄する）。
              「送信したが空応答」と混同してはならない。
            - `max_tokens`: 出力上限に到達した。thinking が既定で有効なモデルでは本文が空または
              途中で切れる（IADR-0101）。断片は破棄せずそのまま返す。
            - `end_turn`: 正常終了。

    # ── FR-15, IADR-0029: 構成情報 API（/bff/admin/config）─────
    EffectiveConfigDto:
      type: object
      description: "FR-15: 現在有効な実効構成（各サービスの自己申告を BFF が集約）"
      required: [version, pipeline, eventBindings, ports, connectors]
      properties:
        version:
          $ref: "#/components/schemas/ConfigVersionDto"
        pipeline:
          type: array
          items:
            $ref: "#/components/schemas/PipelineStageDto"
        eventBindings:
          type: array
          items:
            $ref: "#/components/schemas/EventBindingDto"
        ports:
          type: array
          items:
            $ref: "#/components/schemas/PortSelectionDto"
        connectors:
          type: array
          items:
            $ref: "#/components/schemas/ConnectorDto"

    ConfigVersionDto:
      type: object
      description: |
        構成バージョン（適用中の構成定義の Git コミット・適用日時・適用者。GitOps 注入。未注入時は空）。
        #520: **`required` を入れない**——C# の 3 メンバーがすべて nullable である
        （`ConfigInfoDto.cs` の `ConfigVersionDto(string? GitCommit, DateTimeOffset? AppliedAt, string? AppliedBy)`）。
      properties:
        gitCommit: { type: string, nullable: true }
        appliedAt: { type: string, format: date-time, nullable: true }
        appliedBy: { type: string, nullable: true }

    ConfigVersionEntryDto:
      type: object
      description: |
        FR-15 (#139), IADR-0046: 構成バージョン履歴の 1 エントリ。正データ源は GitOps 層（Git / ArgoCD の
        適用履歴）で、API は永続化せず注入されたスライスを返す。`hadDrift` はその時点のドリフト有無
        （注入時に判明していれば設定、不明なら null＝画面は「—」と表示する）。
        #520: **`required` を入れない**——C# の 4 メンバーがすべて nullable である（#518 の判断を再確認した）。
      properties:
        gitCommit: { type: string, nullable: true }
        appliedAt: { type: string, format: date-time, nullable: true }
        appliedBy: { type: string, nullable: true }
        hadDrift: { type: boolean, nullable: true }

    PipelineStageDto:
      type: object
      description: "有効なパイプライン段（宣言と照合された実効値）"
      required: [name, service, consumer, input, outputs, enabled]
      properties:
        name: { type: string, example: "catalog" }
        service: { type: string, example: "document-service" }
        consumer: { type: string, description: "コンシューマ型完全名" }
        input: { type: string, example: "DocumentNormalized" }
        outputs:
          type: array
          items: { type: string }
        enabled: { type: boolean }

    EventBindingDto:
      type: object
      description: "イベント接続（イベント型ごとの発行者・購読者）"
      required: [event, publishers, subscribers]
      properties:
        event: { type: string, example: "DocumentUpdated" }
        publishers:
          type: array
          items: { type: string }
        subscribers:
          type: array
          items: { type: string }

    PortSelectionDto:
      type: object
      description: "ポート（LLM・埋め込み・ベクトルDB・ストレージ・Wiki 同期等）で選択中の実装と接続先識別子"
      required: [port, implementation]
      properties:
        port: { type: string }
        implementation: { type: string }
        target: { type: string, nullable: true }

    ConnectorDto:
      type: object
      description: "データソースコネクタと有効・無効状態"
      required: [name, enabled]
      properties:
        name: { type: string }
        enabled: { type: boolean }

    DriftReportDto:
      type: object
      description: "FR-15: 宣言（Git 上の pipeline.json）と実効構成のドリフト検出結果"
      required: [hasDrift, checkedAt, findings]
      properties:
        hasDrift: { type: boolean }
        checkedAt: { type: string, format: date-time }
        findings:
          type: array
          items:
            $ref: "#/components/schemas/DriftFindingDto"

    DriftFindingDto:
      type: object
      description: "個々の不一致（自己申告到達不能は Unverifiable として縮退報告）"
      required: [kind, severity, target, detail]
      properties:
        kind: { type: string, example: "UndeclaredSubscription" }
        severity: { type: string, example: "Warning" }
        target: { type: string }
        detail: { type: string }

    # ── IADR-0025: 埋め込みゲートウェイ（/embed）─────
    EmbedApiRequest:
      type: object
      required: [text]
      properties:
        text: { type: string, description: "埋め込み対象テキスト（取り込みは本文全量を送るため機密区分で越境判定）" }
        confidentiality:
          type: string
          nullable: true
          enum: [public, internal, confidential, restricted]
          description: "機密区分（大文字小文字は無視）。confidential/restricted はティアA固定・外部送信しない"
        purpose:
          type: string
          enum: [index, query]
          default: index
          description: "用途。query は検索対象コレクションと次元を一致させるため既定外部経路へ固定"

    EmbedApiResponse:
      type: object
      description: "embedded=false は機密区分による送信拒否（fail-closed）・次元不整合・呼び出し失敗を示す"
      required: [vector, dimensions, model, collection, embedded, retryable]
      properties:
        vector:
          type: array
          items: { type: number, format: float }
        dimensions: { type: integer, example: 1024 }
        model: { type: string, example: "voyage-3.5" }
        collection: { type: string, example: "knowledge_chunks_voyage_3_5", description: "モデル別コレクション名" }
        embedded: { type: boolean }
        endpoint: { type: string, nullable: true, description: "選択・拒否した送信先（監査・縮退表示用）" }
        routingReason: { type: string, nullable: true, description: "選択・拒否の理由（監査・縮退表示用）" }
        retryable:
          type: boolean
          description: "true は一時障害（呼び出し側は再試行）。false は恒久理由（呼び出し側はスキップ）"
