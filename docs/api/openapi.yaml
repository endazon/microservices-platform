  # ── FeedbackService（直接・内部 API / IADR-0017）─────
  /feedback:
    post:
      tags: [Feedback]
      summary: "FR-08, UC-01: フィードバック送信（upsert・冪等）"
      description: |
        新規は 201、既存 (answerId, userId) の更新は 200（upsert）。
        **投稿には認証を要する（匿名投稿は許さない）。** 利用者は JWT から特定する。
        同一 (answerId, userId) は二重計上しない（IADR-0010）。

        ［2026-08-10 是正 / #521・IADR-0158］**`anonymous` フォールバックを消した。**
        計画 FR-08（2026-08-07 確定・裁定依頼 planning#236 案 2）に合わせて実装へ
        `RequireAuthorization()` を足し、本端点と `/bff/feedback` の**双方**へ `401` を
        記した（#586 の予告どおり）。**害は「無認証で投稿できる」だけではなかった**——
        `(AnswerId, UserId)` のユニーク索引と噛み合い、**無認証の投稿は全員が `anonymous`
        の 1 行を共有して互いに上書きし合っていた**。
      operationId: submit-feedback
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/FeedbackRequest"
      responses:
        "200":
          description: 既存フィードバックの更新（upsert）
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "201":
          description: 新規フィードバックの作成
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackDto"
        "400":
          description: "バリデーションエラー（answerId 未指定 / rating 不正 / comment 長超過）"
        "401": { description: 未認証（匿名投稿は許さない。FR-08 確定 2026-08-07） }
    get:
      tags: [Feedback]
      summary: "FR-08: フィードバック一覧（品質レビュー用）"
      description: |
        NFR（認可）: 自由記述 Comment と UserId（個人特定情報）を返すため、管理者ロール（AdminOnly）のみ許可する。
        全件無制限返却を防ぐページング（skip>=0 / 1<=take<=500）。
      operationId: list-feedback
      parameters:
        - name: rating
          in: query
          required: false
          schema: { type: string, enum: [up, down] }
          description: "評価で絞り込む（低評価回答のレビュー等）"
        - name: answerId
          in: query
          required: false
          schema: { type: string, format: uuid }
        - name: skip
          in: query
          required: false
          schema: { type: integer, default: 0, minimum: 0 }
        - name: take
          in: query
          required: false
          schema: { type: integer, default: 100, minimum: 1, maximum: 500 }
      responses:
        "200":
          description: フィードバック一覧（更新日時の新しい順）
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/FeedbackDto"
        "401":
          description: 未認証
        "403":
          description: 管理者ロール以外（AdminOnly）

  /feedback/stats:
    get:
      tags: [Feedback]
      summary: "FR-08, FR-10: フィードバック集計（👍/👎 件数・満足率）"
      description: |
        **統計の参照は運用者・管理者に限る**（計画 FR-08 / SC-10・2026-08-07 確定）。
        FR-10 ダッシュボードの回答品質の入力となる。

        ［2026-08-10 是正 / #521・IADR-0158］従前の「集計値のみで PII を含まないため
        AdminOnly は課さない」という根拠は**計画側で失効していた**。判断軸は「PII を含むか」
        ではなく「**権限で絞るか**」へ変わっている（裁定依頼 planning#236 案 2）。
        実装へ `RequireRole(Admin, Operator)` を足し、本端点と `/bff/feedback/stats` の
        **双方**へ `401` / `403` を記した（#586 の予告どおり）。閲覧ロールは **SC-10 の画面**
        （#544 で運用者へ開いた）と同じ線で引いている。
      operationId: feedback-stats
      parameters:
        - name: answerId
          in: query
          required: false
          schema: { type: string, format: uuid }
          description: "指定時はその回答に絞って集計する"
        - name: days
          in: query
          required: false
          schema: { type: integer, minimum: 1, maximum: 90 }
          description: "期間指定（日数、[1,90] にクランプ）。未指定は全期間（後方互換）"
      responses:
        "200":
          description: フィードバック集計
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/FeedbackStatsDto"
        "401": { description: 未認証 }
        "403": { description: 運用者・管理者以外（SC-10 の閲覧ロールと揃える） }

