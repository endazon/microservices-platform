# SC-15, FR-05, FR-22, ADR-0045 決定 2-b/5（ADR-0078 決定 2 による部分改定）, IADR-0404 (#1245):
# Keycloak の**近接 MTA（キュー付き）**。環境非依存の base であり、dev と go-live が同じ宣言を使う。
#
# ## なぜ器が Postfix なのか（Mailpit ではない）
#
# ADR-0078 決定 2 は「近接 MTA は**キューを持ち、上流が停止していても投函を受け付けて後送する**」と
# 定めている。**Mailpit の公式文書はキュー・再送・後送を 1 つも記していない**し、`forward-smtp-errors` は
# 上流の SMTP エラーを**送信クライアントへ転送する**選択肢である —— それを立てると上流の失敗が
# Keycloak へ戻り、消したはずの状態 C が戻る。**Mailpit は dev の「上流（捕捉箱）」として残す。**
#
# ## 送出先としての単一情報源
#
# 本ファイルの Service 名 `mail-relay` と port 587 が、次の 2 つの単一情報源である。
#   - realm の smtpServer（deploy/keycloak/microservices-platform-realm.json）
#   - 静的検査（scripts/check-realm-constraints.js の collectMailCaptureGaps）が**この Service を走査して**
#     期待値を組み立てる。**期待値をスクリプトへ書き写さない。**
#
# ## 上流の単一情報源
#
# Secret `keycloak-smtp`（host / port / starttls / from / user / password）。
#   dev     : mailpit.platform-infra.svc.cluster.local:1025（平文・無認証。1 通も外へ出ない）
#   go-live : 組織のメールテナント（587 / STARTTLS 必須 / SASL）
# 値の供給は Vault → ExternalSecret（deploy/local/vault/eso/）と
# docs/operations/keycloak-smtp-relay-setup-runbook.md が持つ。**実値は realm にも本ファイルにも入らない。**
#
# ## 経路の暗号化
#
# 🔴 Keycloak → 本 relay の 1 ホップは**平文**である（クラスタ内の Pod ネットワークに閉じる）。
#    **production でも同じ**であり、これは IADR-0404 決定 3 の受容として記録し、計画へ環流する。
# 🔴 本 relay → 上流は `SMTP_UPSTREAM_STARTTLS=true` のとき `smtp_tls_security_level=encrypt`
#    （**平文フォールバック無し**。ADR-0045 決定 5）。イメージの既定は `may` なので**必ず上書きする**
#    —— 導出は ConfigMap mail-relay-init のスクリプトが行う（env に三項演算が無いため）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: mail-relay
  namespace: platform-infra
  labels: { app: mail-relay }
spec:
  replicas: 1
  # spool（キュー）を 1 つの Pod だけが所有する。RollingUpdate だと 2 つの Postfix が同じ役を持つ瞬間ができる。
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: mail-relay }
  template:
    metadata:
      labels: { app: mail-relay }
    spec:
      containers:
        - name: postfix
          # bokysan/docker-postfix v5.1.0（2026-01-04 リリース）。mailpit.yaml と同じくタグで pin する。
          # manifest list digest: sha256:aafc772384232497bed875e1eb66b4d3e54ba1ebc86e2e185a6dc1dbc48182ef
          # 🔴 digest は Docker Hub の API から読んだ値であり、**本リポジトリの CI / 稼働クラスタで pull して
          #    確かめてはいない**（本作業の実行機にクラスタが無い）。
          image: boky/postfix:v5.1.0
          env:
            # --- 上流（Secret keycloak-smtp）。**非 optional** にする ---------------------------
            # 🔴 optional にしてはならない。RELAYHOST が空だと Postfix は**宛先の MX へ直接配送する**
            #    ＝クラスタ外へ出る（ADR-0045 決定 9 の破れ）。欠けたら起動しないほうが安全である。
            - { name: SMTP_UPSTREAM_HOST, valueFrom: { secretKeyRef: { name: keycloak-smtp, key: host } } }
            - { name: SMTP_UPSTREAM_PORT, valueFrom: { secretKeyRef: { name: keycloak-smtp, key: port } } }
            - { name: SMTP_UPSTREAM_STARTTLS, valueFrom: { secretKeyRef: { name: keycloak-smtp, key: starttls } } }
            # 外向きのエンベロープ差出人。**dev では空**（実値が供給されるまで空。fail-safe）。
            - { name: SMTP_FROM, valueFrom: { secretKeyRef: { name: keycloak-smtp, key: from } } }
            # --- Postfix の設定（イメージの env 契約） -------------------------------------------
            # k8s の $(VAR) 展開は**同じコンテナで先に宣言した env** を参照できる。
            - { name: RELAYHOST, value: "[$(SMTP_UPSTREAM_HOST)]:$(SMTP_UPSTREAM_PORT)" }
            # user / password が空なら SASL は有効化されない（dev の捕捉箱宛はこちら）。
            - { name: RELAYHOST_USERNAME, valueFrom: { secretKeyRef: { name: keycloak-smtp, key: user } } }
            - { name: RELAYHOST_PASSWORD, valueFrom: { secretKeyRef: { name: keycloak-smtp, key: password } } }
            # 差出人ドメインは realm の from（合成値）に固定する。外れた差出人は拒否され、
            # それは**投函できない状態**＝門（#1245 PR-C）が検知して申請を閉じる対象である。
            #
            # ★［2026-09-06 / #1307］🔴 **U11 に上流ソースで答えが出た。反映先は違っていた。**
            #    `bokysan/docker-postfix` v5.1.0 の `scripts/functions.sh:573-592`
            #    （`postfix_setup_sender_domains()`。**本 env を設定したときだけ走る**）:
            #
            #      smtpd_recipient_restrictions=reject_non_fqdn_recipient, reject_unknown_recipient_domain,
            #                                   check_sender_access lmdb:/etc/postfix/allowed_senders, reject
            #      smtpd_relay_restrictions=permit
            #
            #    - 差出人の門は `smtpd_sender_restrictions` ではなく**この `check_sender_access`** である
            #      （同 `functions.sh:337` の `smtpd_sender_restrictions=permit_mynetworks,reject` は
            #      Pod 網（RFC1918）を無条件に通すので、Keycloak からの投函には効かない）。
            #    - 🔴 **同じ 1 行に `reject_unknown_recipient_domain` が入る。** 宛先ドメインの MX / A を
            #      DNS で引き、**null MX（RFC 7505）を 556 5.1.10 で RCPT 時に拒む** ——
            #      `permit_mynetworks` はこの並びに**入っていない**ので、クラスタ内からの投函も検証を受ける。
            #      **本 env を設定したこと自体が宛先の DNS 検証を有効にしていた。**
            #    ⇒ ADR-0078 決定 2（投函を受け付けて後送する）に反するので、init スクリプトの段 (4) が
            #      **このトークンだけを取り除く**（差出人の門は残す）。
            - { name: ALLOWED_SENDER_DOMAINS, value: "platform.localhost" }
            # 🔴 キュー寿命は**リセットリンクの寿命**に合わせる。realm の actionTokenGeneratedByUserLifespan は
            #    1800 秒であり、既定の 5 日では**期限切れのリンクを 5 日間配り続ける**。
            #    期限切れで捨てた通数は qmgr の期限切れカウンタに出る（＝後送の失敗率の分子。観測は #1245 PR-B）。
            #    🔴 値は**マニフェストが与える**（コードは既定を持たない）。正しさは実測で決め、環流する。
            - { name: POSTFIX_maximal_queue_lifetime, value: "30m" }
            # 差出人は noreply（合成値）でありバウンスに意味が無い。溜めない。
            - { name: POSTFIX_bounce_queue_lifetime, value: "0" }
            # 寿命 30m の内側に再送機会を作る。
            - { name: POSTFIX_minimal_backoff_time, value: "60s" }
            - { name: POSTFIX_maximal_backoff_time, value: "300s" }
          ports:
            - { containerPort: 587, name: smtp }
          # 587（submission）はイメージが EXPOSE しており、master.cf の submission は TLS も SASL も
          # 強制しない（`-o` がすべて無効化されている）。投函は smtpd_client_restrictions の
          # permit_mynetworks（既定は RFC1918 全域）で許される ＝ Pod ネットワークから無認証で通る。
          readinessProbe: { tcpSocket: { port: 587 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { tcpSocket: { port: 587 }, initialDelaySeconds: 20, periodSeconds: 20 }
          volumeMounts:
            # イメージの起動スクリプトが `exec supervisord` の直前に走らせる init hook。
            - { name: init, mountPath: /docker-init.d, readOnly: true }
            # SC-10, ADR-0078 決定 3, IADR-0421 (#1245 PR-B): spool を exporter と共有する。
            - { name: spool, mountPath: /var/spool/postfix }
          resources:
            requests: { cpu: 25m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
        # SC-10, FR-05, NFR-09, ADR-0006 / ADR-0045 決定 8 → ADR-0078 決定 3, IADR-0421 (#1245 PR-B):
        # **キュー長・滞留時間を Prometheus 形式で出すサイドカー。**
        #
        # 🔴 **近接 MTA を挟んだ時点で Keycloak 側の観測は上流停止を見なくなった。** relay が 250 を
        #    返した以後の失敗は Keycloak に戻らないため、監査ログだけを見ると上流の停止を見逃す。
        #    ADR-0078 決定 3 が観測点をここへ移した。**移さなければ統制を足したことで観測が失われる。**
        # 🔴 **経路は otel-collector の prometheus receiver である**（deploy/local/infra/otel-collector.yaml /
        #    deploy/local/observability/otel-collector-forward.yaml）。**Prometheus の scrape 対象は
        #    増やさない** —— 「otel-collector が唯一の scrape 対象」は #546 / #1090 が守っている不変条件である。
        # 🔴 **既製の exporter イメージを増やしていない**（IADR-0421 決定 1）。kumina 系はキュー長を
        #    showq ソケット、失敗率を**ログファイル**から採るが、この image はログを rsyslog 経由で
        #    stdout へ出すため後者が読めず、前者は本 exporter と同じ spool 共有が要る。
        #    得る面が同じで**供給網へイメージが 1 つ増える**ので採らない（08_data-egress-policy）。
        - name: queue-exporter
          # 門（reset-gate）と同じイメージ。CI（Node 22）と同じメジャー版・外部依存ゼロ。
          image: node:22-alpine
          command: ["node", "/exporter/mail-queue-exporter.js"]
          env:
            # 🔴 値は**マニフェストが与える**（コードは既定を持たない。reset-gate と同じ作法）。
            - { name: SPOOL_DIR, value: /var/spool/postfix }
            # 9154 は Prometheus の慣行で Postfix exporter に割り当てられている番号である。
            # 🔴 **この 1 行が collector の scrape 先（mail-relay:9154）と Service の単一情報源**である。
            - { name: LISTEN_PORT, value: "9154" }
            # 🔴 `defer` と `bounce` は**メッセージではなく理由ログ**なので数えない。`corrupt` も
            #    上流停止の指標ではないので入れない（増やすなら観測仕様書と同時に増やすこと）。
            - { name: QUEUE_NAMES, value: "incoming,active,deferred,hold,maildrop" }
          ports:
            - { containerPort: 9154, name: metrics }
          volumeMounts:
            # 🔴 **読み取り専用**で同じ spool を見る。exporter は 1 バイトも書かない。
            - { name: spool, mountPath: /var/spool/postfix, readOnly: true }
            - { name: exporter, mountPath: /exporter, readOnly: true }
          # 🔴 **probe を置かない。観測がメールを止めてはならない。**
          #   Pod の Ready は**全コンテナ**の Ready を要求するので、ここに readiness / liveness を置くと
          #   **exporter の不調が Service の endpoint を落とし、Keycloak が投函できなくなる**
          #   ＝ 実在する利用者名だけ 500 になる窓（IADR-0404 の W1）を、観測の都合で開けることになる。
          #   exporter が居ない・答えないことは **MailRelayQueueSeriesAbsent**（系列の不在）が拾う。
          # 🔴 **それでも同居の宿命は残る。** スクリプトの ConfigMap が欠けるなどで**コンテナが起動できない**
          #   場合は CrashLoopBackOff になり、Pod ごと NotReady になる（＝ relay も止まる）。
          #   **静かには壊れない** —— 門（reset-gate）が投函不能を検知して申請を閉じ、存在秘匿は保たれる。
          #   ConfigMap は起動器が apply より前に必ず作る（scripts/k8s-local-up.sh）。
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      volumes:
        - { name: init, configMap: { name: mail-relay-init, defaultMode: 0755 } }
        # exporter 本体は ConfigMap 化する（kustomize は root 外ファイルを参照できないため、
        # 門のスクリプトと同型で起動器が --from-file で作る）。
        - { name: exporter, configMap: { name: mail-queue-exporter-script } }
        # 🔴 **spool（/var/spool/postfix）を emptyDir で共有する。永続性は変わらない** ——
        #    emptyDir の寿命は Pod の寿命であり、従前のコンテナ書き込み層と同じである
        #    （キューは Pod の再作成で失われる。載るのは寿命 30 分のメールだけなので受容する）。
        #    変わるのは**サイドカーから同じ spool を読めること**だけである。
        # 🔴 **空の spool を被せてもイメージが起動時に作り直す**（上流ソースで確認・IADR-0421 V16〜V19）:
        #      run.sh の `reown_folders` が pid/dev/private/public を mkdir し `postfix set-permissions` を打つ
        #      → `postfix_enable_chroot` が etc/ と zoneinfo を毎回コピーする
        #      → supervisord が `postfix start-fg` を起動し、その中の `check-fatal` が欠けたキューを作る
        #    いずれも `execute_post_init_scripts`（= mail-relay-init）**より前**に走る。
        #    🔴 **稼働クラスタでは確かめていない**（本作業機にクラスタが無い。#1245 PR-D で確かめる）。
        - { name: spool, emptyDir: {} }
---
apiVersion: v1
kind: Service
metadata:
  name: mail-relay
  namespace: platform-infra
  labels: { app: mail-relay }
spec:
  selector: { app: mail-relay }
  ports:
    # 🔴 **realm の smtpServer と静的検査の期待値はこの 1 行から導かれる**（書き写さない）。
    - { name: smtp, port: 587, targetPort: 587 }
    # SC-10, ADR-0078 決定 3, IADR-0421 (#1245 PR-B): キューの観測。
    # 🔴 **otel-collector の prometheus receiver がここを取りに来る**（Prometheus は来ない）。
    - { name: metrics, port: 9154, targetPort: 9154 }
---
# 投函できる主体を Keycloak に限る。**egress は縛らない**（上流へ出る経路が relay の役目である）。
# 🔴 NetworkPolicy を強制しないクラスタでは無害な宣言として残るだけである。強制するクラスタでは、
#    #1245 PR-B（観測: otel-collector → :9154）と PR-C（門: reset-gate → :587）が**それぞれの規則を足す**。
#    足し忘れると相手側が静かに繋がらなくなるので、各 PR の受け入れ基準に入れること。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mail-relay-ingress
  namespace: platform-infra
  labels: { app: mail-relay }
spec:
  podSelector: { matchLabels: { app: mail-relay } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: keycloak } }
      ports:
        - { protocol: TCP, port: 587 }
---
# SC-10, ADR-0078 決定 3, IADR-0421 (#1245 PR-B): 観測の取り手（otel-collector）へ :9154 を開く**別宣言**。
#
# 🔴 上の `mail-relay-ingress` を書き換えていない —— NetworkPolicy は**加算的**であり、同じ Pod を
#    選ぶ複数の宣言の ingress は和になる。門（reset-gate.yaml）が :587 を足したのと同じ形である
#    （同ファイルの注記が「PR-B と PR-C がそれぞれの規則を足す」と定めている）。
# 🔴 NetworkPolicy を強制しないクラスタ（dev の k3d 既定）では無害な宣言として残るだけである。
#    強制するクラスタでこれが無いと、**collector は静かに scrape できなくなり、系列が消える**
#    （そのときは MailRelayQueueSeriesAbsent が鳴る ＝ 沈黙にはならない）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mail-relay-ingress-otel-collector
  namespace: platform-infra
  labels: { app: mail-relay }
spec:
  podSelector: { matchLabels: { app: mail-relay } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector: { matchLabels: { app: otel-collector } }
      ports:
        - { protocol: TCP, port: 9154 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: mail-relay-init
  namespace: platform-infra
  labels: { app: mail-relay }
data:
  # イメージの起動スクリプトは `/docker-init.d/*.sh` を **supervisord を exec する直前**に実行する
  # （`/docker-init.db/` は旧名）。この時点で postconf の変更は起動する Postfix に効く。
  10-relay-policy.sh: |
    #!/bin/sh
    # SC-15, ADR-0045 決定 5 / ADR-0078 決定 2, IADR-0404 (#1245):
    # 上流の接続条件を**宛先に結び付けて**導出する。env に三項演算が無いのでここで決める。

    # (1) 上流が無いまま起動しない。RELAYHOST が空だと Postfix は宛先の MX へ**直接**配送する
    #     ＝クラスタ外へ出る。宛先が無いなら起動しないほうが安全である（fail-closed）。
    if [ -z "${SMTP_UPSTREAM_HOST}" ] || [ -z "${SMTP_UPSTREAM_PORT}" ]; then
      echo "mail-relay: 上流（Secret keycloak-smtp の host / port）が空である。直接配送へ落ちるより起動しない。" >&2
      exit 1
    fi

    # (2) STARTTLS の導出。true は encrypt（**平文フォールバック無し**）、false は捕捉箱宛だけに出る値である
    #     （Vault seed は宛先が捕捉用 MTA のときにしか false を出さない）。イメージの既定 `may` へは落とさない。
    case "${SMTP_UPSTREAM_STARTTLS}" in
      true)  postconf -e smtp_tls_security_level=encrypt ;;
      false) postconf -e smtp_tls_security_level=none ;;
      *)
        echo "mail-relay: SMTP_UPSTREAM_STARTTLS は true|false でなければならない（受け取った値: '${SMTP_UPSTREAM_STARTTLS}'）。起動しない。" >&2
        exit 1
        ;;
    esac

    # (3) 外向きのエンベロープ差出人を実値へ写す。realm の from はクラスタ外で意味を持たない合成値である。
    #     🔴 **実値が未供給（空）のときは写像を張らない** —— 空値の inline 写像は壊れる。dev はこちらへ来る。
    if [ -n "${SMTP_FROM}" ]; then
      postconf -e "smtp_generic_maps=inline:{noreply@platform.localhost=${SMTP_FROM}}"
    fi

    # (4) 🔴 宛先ドメインの DNS 検証で「投函そのもの」を拒まない（#1307）。
    #     ALLOWED_SENDER_DOMAINS を設定すると、上流イメージは smtpd_recipient_restrictions の先頭付近へ
    #     reject_unknown_recipient_domain を入れる（v5.1.0 の scripts/functions.sh:589）。これは宛先ドメインの
    #     MX / A を引き、null MX（RFC 7505）を 556 5.1.10 で RCPT 時に拒む。
    #     ⇒ ADR-0078 決定 2 の「上流が停止していても投函を受け付けて後送する」に反する。relay が同期的に
    #       拒めば、切り離したはずの失敗が Keycloak の応答へ戻る（IADR-0404 の状態 C3・窓 W2）。
    #       実在利用者だけが 500 になるので、SC-15 の存在秘匿も同時に破れる（#1307 で実測）。
    #
    #     🔴 **列を書き写さない。** 上流が組み立てた現在値から**当該トークンだけを取り除く** ——
    #        書き写すと、上流が並びを変えたときに差出人の門（check_sender_access）ごと固定してしまう。
    #     🔴 reject_non_fqdn_recipient は残す（宛先の**構文**検査。DNS を引かない）。
    #     🔴 末尾の reject は残す（これが無いとオープンリレーになる）。
    recipient_before="$(postconf -h smtpd_recipient_restrictions)"
    recipient_after="$(printf '%s' "${recipient_before}" | sed 's/reject_unknown_recipient_domain,[[:space:]]*//g; s/,[[:space:]]*reject_unknown_recipient_domain//g')"

    # 取り除けたか・門を消していないかを両方向で確かめる。どちらかが破れたら起動しない（fail-closed）。
    # 黙って通すと「DNS で拒む relay」に戻り、赤くなるのは稼働クラスタの中だけになる。
    if printf '%s' "${recipient_after}" | grep -q 'reject_unknown_recipient_domain'; then
      echo "mail-relay: reject_unknown_recipient_domain を取り除けなかった（現在値: '${recipient_before}'）。起動しない。" >&2
      exit 1
    fi
    if ! printf '%s' "${recipient_after}" | grep -q 'check_sender_access'; then
      echo "mail-relay: 差出人の門（check_sender_access）が消えた（現在値: '${recipient_before}'）。起動しない。" >&2
      exit 1
    fi
    postconf -e "smtpd_recipient_restrictions=${recipient_after}"
