# SC-15, FR-05, FR-22, ADR-0045 決定 2-b/5（ADR-0078 決定 2 による部分改定）, IADR-0404 (#1245):
# Keycloak の**近接 MTA（キュー付き）**。
#
# ADR-0078 決定 2 は go-live の送出経路を「Keycloak → 外部リレー直結」から
# 「**Keycloak → クラスタ内の近接 MTA → 外部リレー**」へ改めた。近接 MTA はキューを持ち、
# 上流が停止していても投函を受け付けて後送するため、**上流停止が Keycloak の応答に現れない**
# （＝実在する利用者名だけ 500 になる状態が消える）。
#
# 🔴 **dev と go-live は同じ宣言を使う。違うのは上流だけ**である（Secret keycloak-smtp）。
#   dev     : Keycloak → mail-relay → mailpit（捕捉用 MTA。1 通も外へ出ない）
#   go-live : Keycloak → mail-relay → 組織のメールテナント（STARTTLS ＋ SASL）
#
# 🔴 **opt-in ゲートに載せない。** 決定 2 は無条件であり、ゲートに載せると
# 「ゲートを立てない人の既定は近接 MTA なし」になる（IADR-0344 決定 1 と同じ理由）。
#
# 参照元:
#   - deploy/local/infra/kustomization.yaml が `../../mail-relay` として取り込む
#   - go-live は Keycloak と同じ namespace へ同じものを apply する
#     （🔴 production の Keycloak マニフェストは本リポジトリに無い。IADR-0404 決定 2）
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - mail-relay.yaml
  # SC-15, ADR-0078 決定 4, IADR-0404 (#1245 PR-C): 近接 MTA へ投函できないときに
  # パスワードリセットの申請を機械で閉じる門。**近接 MTA と同じ配備単位に置く** ——
  # 門が測る相手はこの relay であり、片方だけが配備される形を作らないためである。
  # **opt-in ゲートに載せない**（ADR-0078 決定 4 は無条件。relay と同じ理由）。
  - reset-gate.yaml
  # SC-15, NFR-13, ADR-0094 決定 2, ADR-0097 決定 2, IADR-0432 (#1410 / #1500):
  # リセット申請の**床**（最小応答時間）の器。**既定で取り込む**（ADR-0097 決定 2 が
  # IADR-0432 決定 4 の opt-in を覆した）。値（RESET_FLOOR_MS=150）はここが取り込むマニフェストが与え、
  # コードは既定を持たない。
  # 🔴 **器だけでは効かない。** 経路（リセット申請の POST を床へ向ける route）はエッジが与える ——
  #   ローカルは `scripts/istio-edge-up.sh` が既定（RESET_FLOOR=1）で `deploy/local/edge-istio-reset-floor`
  #   を当てる。RESET_FLOOR=0（経路だけが外れ、器は誰も通らないまま居る）は検証で床の有無を比べる用途に限る。
  #   go-live は同じ経路を go-live のエッジ側で与える（production の Keycloak マニフェストは本リポジトリに無い）。
  # ［2026-09-26 / #1543］ADR-0111: 器は 2 レプリカ ＋ PodDisruptionBudget で取り込まれる（決定 1。go-live も同じ宣言）。
  #   器がすべて落ちたときの 503 は「申請を閉じた状態」として保ち、本番で RESET_FLOOR=0 を退路に使わない（決定 3）。
  - reset-floor
