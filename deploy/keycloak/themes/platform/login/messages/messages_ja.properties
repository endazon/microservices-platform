# SC-13 / SC-14 / SC-15（IADR-0532）: 計画（05_screens §SC-13〜15・hi-fi モック）が文言を定めたものだけを上書きする。
# それ以外は親テーマ（keycloak.v2 → base）の訳をそのまま使う。値は Java の properties（UTF-8）。
#
# ヘッダ: realm の displayName（汎用プラットフォーム。ロケールで差し替えない固有名詞）＋副題。
# span は Keycloak のサニタイザが通す。見た目（accent の角・副題の段）は css/platform.css。
loginTitleHtml=<span class="platform-brand">{0}</span><span class="platform-brand-sub">統合認証</span>
loginTitle={0} にサインイン
loginAccountTitle=サインイン
# SC-13: 識別子は「社員ID またはメールアドレス」。失敗時の文言は固定（存在秘匿。実在・非実在の両側に同じく効く）。
usernameOrEmail=社員ID または メールアドレス
invalidUserMessage=社員ID またはパスワードが正しくありません
# SC-13: 「このデバイスを記憶（30日）」。日数は realm の ssoSessionMaxLifespanRememberMe と一致することを
# scripts/gen-keycloak-theme-tokens.js --check が確かめる。
rememberMe=このデバイスを記憶（30日）
doForgotPassword=パスワードを忘れた
# SC-15: 申請後は登録の有無によらず常に「メールを送信しました」（存在秘匿）。
emailSentMessage=メールを送信しました。届いたメールのリンクからパスワードを再設定してください。
