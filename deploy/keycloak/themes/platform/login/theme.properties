# platform ログインテーマ（SC-13 / SC-14 / SC-15・ADR-0026・ADR-0031。IADR-0261 決定 1 → IADR-0532 で親を改めた）。
#
# 方針（IADR-0261 決定 1 を維持）: テンプレート（.ftl）は複製しない。親テーマを継承し、CSS と最小のメッセージ上書きだけで
# SPA と同じ Nocturne の見た目に揃える。複製すると Keycloak 本体のセキュリティ修正・アクセシビリティ対応・新しい認証フロー
# （WebAuthn・パスキー等）に追随できなくなる。
#
# 🔴 IADR-0532: 親は keycloak.v2（PatternFly 5。Keycloak 26 の既定ログインテーマ）。従前の parent=keycloak は 26 では
#    旧 v1（PatternFly 3）を指し、CSS の上書きが効かない既定の見た目のままだった。版を上げて親が消えると Keycloak は
#    既定テーマへ**黙って**落ちるため、親の実在は scripts/check-realm-constraints.js 検査 4 が版ごとの表で確かめる。
#
# 外部 CDN・Web フォント・analytics は使わない（08_data-egress-policy）。フォントはシステムフォント、アイコンは Lucide の
# SVG を CSS の data URI に同梱する（scripts/check-static-egress.js --require deploy/keycloak/themes が CI で走査する）。
parent=keycloak.v2
import=common/keycloak

# styles は継承ではなく置換。親の css/styles.css を明示的に引き継ぎ、後段で上書きする（後勝ち）。
# tokens.css は生成物（scripts/gen-keycloak-theme-tokens.js。単一情報源は src/packages/ui/src/styles.css）。
styles=css/styles.css css/tokens.css css/platform.css

# 親（keycloak.v2）が prefers-color-scheme を見て <html> に pf-v5-theme-dark を付ける。色の切替そのものは tokens.css の
# メディアクエリで行うので、スクリプトが動かない環境でも配色は OS 設定に従う。
darkMode=true

# 状態表示のアイコンを Font Awesome から Lucide（SPA と同じ図柄）へ差し替える。テンプレートは必ず文言（message.summary）を
# 併記するので「色＋アイコン＋テキスト」が揃う（INDEX 決定 21）。クラスの実体は css/platform.css。
kcFeedbackErrorIcon=platform-icon platform-icon--error
kcFeedbackWarningIcon=platform-icon platform-icon--warning
kcFeedbackSuccessIcon=platform-icon platform-icon--success
kcFeedbackInfoIcon=platform-icon platform-icon--info
kcInputErrorIconClass=platform-icon platform-icon--error
