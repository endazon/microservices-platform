# platform ログインテーマ（IADR-0261 / #438・ADR-0026 決定「認証画面の実現方式」）。
#
# 方針: テンプレート（.ftl）は上書きしない。parent=keycloak を継承し、CSS の追加のみでブランド適用する。
# 理由: テンプレートを丸ごと複製すると、Keycloak 本体側のセキュリティ修正・アクセシビリティ対応・
# 新しい認証フロー（例: WebAuthn 関連画面）に追随できなくなる（複製した瞬間に固定される）。
# realm.json の displayName（"汎用プラットフォーム"）は親テーマ（keycloak）のテンプレートが
# 既定でヘッダに描画するため、テンプレート側の変更は不要。
#
# 外部 CDN・Web フォント・analytics は使わない（計画 08_data-egress-policy）。フォントはシステムフォントのみ。
#
# styles は継承ではなく置換のため、親（keycloak）の login.css を明示的に引き継いだ上で
# 自テーマの css を後段に足す（後勝ちで上書きする）。
parent=keycloak
import=common/keycloak

styles=css/login.css css/platform.css
