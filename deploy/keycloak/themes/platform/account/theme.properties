# platform アカウントコンソールテーマ（IADR-0261 / #438・ADR-0026 決定「認証画面の実現方式」）。
# SC-16（アカウント設定）が Keycloak のアカウントコンソールにテーマを適用して提供する対象。
#
# 方針は login テーマと同一（.ftl は上書きせず、parent=keycloak への CSS 追加のみ）。理由は同テーマの
# theme.properties を参照。
#
# 外部 CDN・Web フォント・analytics は使わない（計画 08_data-egress-policy）。フォントはシステムフォントのみ。
parent=keycloak
import=common/keycloak

styles=css/account.css css/platform.css
