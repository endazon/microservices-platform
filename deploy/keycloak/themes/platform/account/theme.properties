# platform アカウントコンソールテーマ（SC-16・ADR-0026・ADR-0031。IADR-0261 決定 1 → IADR-0532 で親を改めた）。
# SC-16（アカウント設定）は Keycloak のアカウントコンソールにテーマを適用して提供する（共通シェルのユーザーアイコンから遷移）。
#
# 🔴 IADR-0532: 親は keycloak.v3（Keycloak 26 のアカウントコンソール。React ＋ PatternFly 5）。従前の parent=keycloak は
#    26.7.4 に account 型が無く（keycloak-themes jar の META-INF/keycloak-themes.json）、Keycloak は
#    「Failed to find ACCOUNT theme platform, using built-in themes」を出して**素の既定テーマへ黙って落ちていた**
#    （24 → 26 の更新＝IADR-0524 で壊れた。実測）。親の実在は scripts/check-realm-constraints.js 検査 4 が確かめる。
#
# 方針は login と同じ（画面の実体＝React アプリは複製しない。CSS とロゴの差し替えのみ）。
# 外部 CDN・Web フォント・analytics は使わない（08_data-egress-policy）。
parent=keycloak.v3

# keycloak.v3 の index.ftl は styles の各ファイルを親の資源の後に読む。tokens.css は生成物
# （scripts/gen-keycloak-theme-tokens.js。単一情報源は src/packages/ui/src/styles.css）。
styles=css/tokens.css css/platform.css
darkMode=true

# マストヘッドのロゴは resources/logo.svg（親と同名で上書き）。押したときの遷移先は既定（コンソールの先頭）のまま。
# タブの題名はブランド表示名（固有名詞。ロケールで差し替えない＝05_screens §共通シェル）。
title=汎用プラットフォーム
