# NFR-18, NFR-05, IADR-0700: 稼働中の Keycloak の realm に、取り込み元に在って稼働に無い機密クライアントだけを作る Job（手順は add-clients.js）。
#   🔴 kustomize には入れない（Job は作り直さないと流れない）。deploy/cloud/keycloak-clients/keycloak-clients.sh --live <段> が、段（MODE）を差し替えて作り、
#      終わるまで待ち、ログを出し、成功したら消す。新しく作る構成は realm の取り込みが最初から含むので、流しても「在る（触らない）」だけになる。
#   - 在るクライアントの secret・設定は読まず書かない。既定のスコープ（宛先）とサービスアカウントのロールだけを読んで確かめる（足りないロールは足す・スコープの欠けは失敗）。
#   - 取り込み元は Secret keycloak-realm-import（ESO が雛形に OpenBao の値を差し込んだもの。Keycloak の Pod と同じ）。値は Pod の外へ出ない。
#   - 管理者は Secret keycloak-admin（secretKeyRef だけで読む）。宛先は https://keycloak:8443 で、基盤の CA（ConfigMap platform-infra-ca）で検証する。
#   - イメージはローカルの realm の後追いの Job と同じ digest（Node 22。外部依存なし）。到達は Keycloak の 8443 だけ（infra/networkpolicy.yaml の keycloak-ingress-clients）。
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-add-clients
  namespace: platform-infra
  labels: { app: keycloak-add-clients }
spec:
  # 失敗を再試行で上書きしない（手順は冪等なので、理由を直して流し直す）。
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: keycloak-add-clients }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: add-clients
          image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          command: ["node", "/opt/keycloak-add-clients/add-clients.js"]
          env:
            # 段（keycloak-clients.sh が差し替える）
            - name: MODE
              value: "check"
            - name: KC_URL
              value: https://keycloak:8443
            - name: REALM
              value: platform
            - name: REALM_FILE
              value: /import/platform-realm.json
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/platform-infra-ca/ca.crt
            - name: KC_ADMIN_USER
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: script, mountPath: /opt/keycloak-add-clients, readOnly: true }
            - { name: realm, mountPath: /import, readOnly: true }
            - { name: platform-infra-ca, mountPath: /etc/platform-infra-ca, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
      volumes:
        - name: script
          configMap: { name: keycloak-add-clients, defaultMode: 0444 }
        - name: realm
          secret:
            secretName: keycloak-realm-import
            items:
              - { key: platform-realm.json, path: platform-realm.json }
        - name: platform-infra-ca
          configMap:
            name: platform-infra-ca
            items:
              - { key: ca.crt, path: ca.crt }
