# NFR-05, NFR-18, IADR-0689: クラウドの External Secrets Operator（固定の chart 2.8.0。scripts/lib/pinned-artifacts.sh の表）の values。
#
#   helm upgrade --install external-secrets "$(pinned_chart external-secrets 2.8.0 "$PINNED_WORK")" \
#     -n external-secrets -f deploy/cloud/vault/external-secrets-values.yaml
#
# 名前空間は helm に作らせない（--create-namespace を使わない）。deploy/cloud/external-secrets（kubectl apply -k）が
# PSA restricted と到達の制限つきで先に作る（IADR-0705）。
#
# イメージは deploy/local/vault/eso/external-secrets-values.yaml と同じ参照（tag@digest）。片側だけの更新は
# scripts/check-image-digests.js の [digest-mismatch] が止める。
# クラウドでは名前空間ごとの SecretStore だけを使う（IADR-0689 決定 6）。ClusterSecretStore・ClusterExternalSecret・PushSecret は
# 処理しない —— 1 つの名前空間から別の名前空間の値を引く口を、controller の側でも持たない。
image:
  repository: ghcr.io/external-secrets/external-secrets
  tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
webhook:
  image:
    repository: ghcr.io/external-secrets/external-secrets
    tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 96Mi }
certController:
  image:
    repository: ghcr.io/external-secrets/external-secrets
    tag: v2.14.0@sha256:10608eb53e636e744903d5f3657a4d9c44e28d9d9c181b73e07bc7dd2e6884dc
  resources:
    requests: { cpu: 10m, memory: 32Mi }
    limits: { cpu: 200m, memory: 96Mi }
processClusterStore: false
processClusterExternalSecret: false
processPushSecret: false
# chart 2.8.0 は、PushSecret を処理しないなら ClusterPushSecret も処理しないと明示することを求める（無いと描画で止まる）。
processClusterPushSecret: false
resources:
  requests: { cpu: 10m, memory: 48Mi }
  limits: { cpu: 300m, memory: 160Mi }
