# NFR-05, NFR-18, IADR-0689: 基盤の側（microservices-platform）の資格情報を OpenBao から写す（ESO）。
#   - ストアは名前空間ごとの SecretStore openbao（kubernetes 認証。role msp-eso）。読めるのは policy msp-eso の範囲だけ。
#   - 値は OpenBao の中で作る（seed-secrets.sh）。k8s の Secret に作ってから移す形は採らない（ADR-0080 決定 1）。
#   - Secret の名前とキーは従来（IADR-0674）のまま。消費側（postgres・rabbitmq・keycloak・chart）は変えない。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-openbao
  namespace: microservices-platform
  labels: { app: eso-openbao }
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: openbao
  namespace: microservices-platform
spec:
  provider:
    vault:
      # NFR-16, IADR-0696: 受け口は TLS だけ。CA は tls-cert.sh が置く ConfigMap openbao-ca で検証する（検証を外さない）。
      server: https://openbao.openbao.svc:8443
      caProvider: { type: ConfigMap, name: openbao-ca, key: ca.crt }
      path: cloud
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: msp-eso
          # NFR-18, IADR-0585: 受ける側の role は audience=vault を要求する（configure.sh）。名乗る側も明示する。
          serviceAccountRef:
            name: eso-openbao
            audiences:
              - vault
---
# ［2026-11-07 / IADR-0689 決定 11］LLM ゲートウェイの提供元の鍵（anthropic-api-key。voyage-api-key は任意）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llm-provider-credentials
  namespace: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef: { kind: SecretStore, name: openbao }
  target:
    name: llm-provider-credentials
    creationPolicy: Owner
    deletionPolicy: Retain
  # 外から持ち込む値（ADR-0080 決定 1 の区分 1）。オーナーが put-external-secret.sh で書く。キーは Secret のキーと 1 対 1（在るキーを全部写す）。
  dataFrom:
    - extract: { key: msp/llm-provider-credentials }
