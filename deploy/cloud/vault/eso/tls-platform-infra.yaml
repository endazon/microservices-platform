# NFR-05, NFR-18, IADR-0689 決定 4: 基盤との通信の TLS の鍵を、OpenBao の PKI（pki_cloud。CA の鍵は OpenBao の外へ出さない）で発行する。
#   ESO の VaultDynamicSecret が pki_cloud/issue/<role> を呼び、証明書と鍵を Secret に写す。鍵は OpenBao の中で作られ、
#   PKI は発行した証明書を保存しない（role の no_store。configure.sh）。CA の証明書（公開してよい）は configure.sh が ConfigMap platform-infra-ca に置く。
#   SAN は従来（IADR-0674 決定 3）と同じ（短い名前・名前空間つき・.svc・.svc.cluster.local）。
#   postgres-tls は tls.crt・tls.key だけを持つ（従来どおり）。Postgres はクライアントの証明書を検めないので CA を読まない。
#   rabbitmq-tls は ca.crt も持つ（RabbitMQ の ssl_options.cacertfile が読む。従来どおり）。CA の公開の配り先は ConfigMap platform-infra-ca。
#   ［2026-11-07 / IADR-0693］keycloak-tls（認可サーバーの受け口。tls.crt・tls.key だけ）。Keycloak は 1 時間ごとに証明書のファイルを
#   読み直すので、作り直しの後に作り直す（rollout restart）必要は無い（infra/keycloak.yaml の KC_HTTPS_CERTIFICATES_RELOAD_PERIOD）。
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: postgres-tls
  namespace: platform-infra
spec:
  method: POST
  path: pki_cloud/issue/postgres
  parameters:
    common_name: postgres
    alt_names: "postgres.platform-infra,postgres.platform-infra.svc,postgres.platform-infra.svc.cluster.local"
    ttl: 8760h
  resultType: Data
  provider:
    # NFR-16, IADR-0696: 受け口は TLS だけ。CA は tls-cert.sh が置く ConfigMap openbao-ca で検証する（検証を外さない）。
    server: https://openbao.openbao.svc:8443
    caProvider: { type: ConfigMap, name: openbao-ca, key: ca.crt }
    auth:
      kubernetes:
        mountPath: kubernetes
        role: platform-infra-eso
        # NFR-18, IADR-0585: 受ける側の role は audience=vault を要求する（configure.sh）。名乗る側も明示する。
        serviceAccountRef:
          name: eso-openbao
          audiences:
            - vault
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-tls
  namespace: platform-infra
spec:
  # 発行は 1 年（ttl）。半年ごとに作り直す（作り直したら消費側を再起動して読み直させる。README §証明書）。
  refreshInterval: 4380h
  target:
    name: postgres-tls
    creationPolicy: Owner
    deletionPolicy: Retain
    template:
      engineVersion: v2
      type: Opaque
      data:
        tls.crt: "{{ .certificate }}"
        tls.key: "{{ .private_key }}"
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: postgres-tls
---
