# NFR-18, IADR-0705: k3s の API サーバーの監査の方針（ノードの /var/lib/rancher/k3s/server/audit-policy.yaml に置く。README §1-4）。
#   - 記録は Metadata（誰が・いつ・どの資源に・何をしたか）まで。要求・応答の本文は残さない（Secret・ConfigMap・トークンの値を記録に載せない）。
#   - 量の多い読みだけの雑音（健康の確かめ・リース・イベント・ノードと kubelet の定常の読み）は残さない。
#   - Secret・ServiceAccount のトークン・TokenReview・exec / attach / port-forward・RBAC の変更は必ず残す（下の None より先に書く）。
#   置き場は暗号化した領域（/var/lib/rancher は LUKS。README §1-2）。保持は 20-apiserver-audit.yaml の maxage・maxbackup・maxsize。
apiVersion: audit.k8s.io/v1
kind: Policy
omitStages: [RequestReceived]
rules:
  # 必ず残す（本文は残さない）。
  - level: Metadata
    resources:
      - group: ""
        resources: [secrets, serviceaccounts/token, pods/exec, pods/attach, pods/portforward]
      - group: authentication.k8s.io
        resources: [tokenreviews]
      - group: rbac.authorization.k8s.io
  # 雑音（読みだけの定常の呼び出し）。
  - level: None
    nonResourceURLs: ["/healthz*", "/readyz*", "/livez*", "/version", "/metrics", "/openapi*"]
  - level: None
    resources:
      - group: coordination.k8s.io
        resources: [leases]
      - group: ""
        resources: [events]
      - group: events.k8s.io
        resources: [events]
  - level: None
    userGroups: ["system:nodes"]
    verbs: [get, list, watch]
  # ほかは Metadata。
  - level: Metadata
