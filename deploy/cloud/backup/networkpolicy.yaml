# NFR-21, NFR-18, IADR-0675 (#2402): バックアップの Pod の外向きの通信を、名前解決・Postgres・HTTPS（オブジェクトストレージ）に絞る。
# 受けは持たない（Ingress の規則を書かない ＝ policyTypes に Ingress を入れない。受け口を増やさない）。
# 🔴 HTTPS は外向きの中継（egress-proxy）だけを経て出す。中継は名前の許可表に在る宛先の 443 だけへ繋ぐ（IADR-0703）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: platform-backup-egress
  namespace: platform-infra
  labels: { app: platform-backup }
spec:
  podSelector:
    matchLabels: { app: platform-backup }
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    - to:
        - podSelector:
            matchLabels: { app: postgres }
      ports:
        - { protocol: TCP, port: 5432 }
    # IADR-0703: クラスタの外の HTTPS は外向きの中継（egress-proxy。名前の許可表で宛先を絞る）を経る。外の 443 へ直には出さない。
    - to:
        - podSelector:
            matchLabels: { app: egress-proxy }
      ports:
        - { protocol: TCP, port: 3128 }
---
# NFR-21, NFR-18, IADR-0675 (#2402): Postgres への入りを、バックアップの Pod から 5432 だけ許す**別宣言**。
# 🔴 #2401 の postgres-ingress-clients を書き換えない —— NetworkPolicy は加算的で、同じ Pod を選ぶ宣言の ingress は和になる。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: postgres-ingress-backup
  namespace: platform-infra
  labels: { app: postgres }
spec:
  podSelector:
    matchLabels: { app: postgres }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: platform-backup }
      ports:
        - { protocol: TCP, port: 5432 }
