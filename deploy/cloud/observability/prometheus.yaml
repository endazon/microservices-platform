# NFR-21, NFR-03, ADR-0006, IADR-0675 (#2402): クラウドの最小構成の Prometheus（platform-infra）。
# - 8 GB のノード向けに絞る: 保持 7 日・1GB、メモリの上限 768Mi、データは emptyDir（2Gi。再起動で消えるのは受け入れる）。
# - 収集: 自分・Alertmanager・otel-collector の自己テレメトリ（:8888）・証明書の期限の測り・外向きの中継（IADR-0705）。アプリのメトリクスは otel-collector の remote write で受ける。
# - 規則: 下の platform-rules.yml（heartbeat・Discord の到達と失敗・AST の規則の不在・collector の停止）と、AST の PrometheusRule。
#   🔴 AST の PrometheusRule は ConfigMap `ast-prometheus-rules`（kustomize の外。AST の YAML をそのまま入れる）を
#   initContainer が `spec` だけ取り出し、promtool check rules を通してから読む（Prometheus Operator を持ち込まない）。
#   読めない規則があれば起動しない（Watchdog が止まり、外の監視が知らせる）。ConfigMap が無ければ起動し、
#   警報 AstAlertRulesNotLoaded が Discord へ出る。ConfigMap を差し替えたら作り直す（rollout restart）。
# - イメージは経路 B（deploy/local/observability/prometheus.yaml）と同じ digest（試験 T-2402-46）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-cloud-config
  namespace: platform-infra
data:
  prometheus.yml: |
    global:
      scrape_interval: 30s
      evaluation_interval: 30s
    rule_files:
      - /etc/prometheus/config/platform-rules.yml
      - /etc/prometheus/ast-rules/*.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    scrape_configs:
      - job_name: prometheus
        static_configs:
          - targets: ['localhost:9090']
      - job_name: alertmanager
        static_configs:
          - targets: ['alertmanager:9093']
      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector:8888']
      # IADR-0705: サーバ証明書の期限の測り（受け口が出している証明書）と、外向きの中継の判定の件数。
      - job_name: tls-cert-probe
        static_configs:
          - targets: ['tls-cert-probe:9465']
      - job_name: egress-proxy
        static_configs:
          - targets: ['egress-proxy:9464']
  platform-rules.yml: |
    groups:
      # IADR-0675 決定 4: 外の監視（Healthchecks.io）への heartbeat。
      - name: cloud-heartbeat
        rules:
          # 常に鳴る。Alertmanager が heartbeat の receiver へ 5 分ごとに送る。止まったら、Prometheus・Alertmanager・
          #    ノード・外への通信のどれかが止まっている（外の監視がオーナーへ知らせる）。消さない・silence しない。
          - alert: Watchdog
            expr: vector(1)
            labels: { severity: none }
            annotations:
              summary: "常に鳴る警報（外の監視への heartbeat）"
              description: "これが外の監視へ届かなくなったら、警報の経路そのものが止まっている。"
          # Discord へ届いている間だけ鳴る。外の監視の check B へ 5 分ごとに送る（失敗の間は鳴らず、B が下がる）。
          # 系列が無い（Alertmanager を収集できない）ときも鳴らない ＝ B が下がる（黙らない）。
          - alert: DiscordDeliveryHealthy
            expr: sum(increase(alertmanager_notifications_failed_total{integration="discord"}[15m])) == 0
            labels: { severity: none }
            annotations:
              summary: "Discord への通知に失敗が無い（外の監視への heartbeat）"
              description: "これが外の監視へ届かなくなったら、Discord へ警報が届いていない。"
          # Discord へ送れないことを、Discord ではなく外の監視（check B の /fail）へ知らせる。
          - alert: AlertmanagerDiscordFailing
            expr: sum(increase(alertmanager_notifications_failed_total{integration="discord"}[15m])) > 0
            labels: { severity: critical }
            annotations:
              summary: "Discord への通知が失敗している"
              description: "直近 15 分に Discord への送信が失敗した。webhook の URL（Secret alertmanager-discord）か Discord 側を確かめる。"
          # AST の規則（ConfigMap ast-prometheus-rules）が 1 つも読まれていない。読まれていないと AST の警報は永久に鳴らない。
          - alert: AstAlertRulesNotLoaded
            expr: absent(prometheus_rule_group_rules{rule_group=~".*;ai-stock-trading\\..*"})
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "AST の警報の規則が読まれていない"
              description: "ConfigMap ast-prometheus-rules が無いか、AST の規則の群が 1 つも無い。手順は cloud の runbook。"
      - name: cloud-availability
        rules:
          - alert: OtelCollectorDown
            expr: up{job="otel-collector"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "OTel Collector 到達不可（可観測性パイプライン断）"
              description: "otel-collector の scrape が 2 分間失敗。AST のメトリクスが届いていない可能性。"
          # NFR-21, IADR-0697: 受け口が生きていても系列が届かない（黙る）形を、collector の自己テレメトリ（直接の scrape。OTLP の経路を通らない）と
          #   届いた系列の側の両方から見る。collector は受け取りを拒んでも落ちないので、OtelCollectorDown は鳴らない。
          # 受け取りを拒んだ（メモリの上限・1 回の受け取りの上限・送り先の詰まりの逆流）。拒まれた系列は Prometheus に届かない。
          - alert: OtelCollectorRefusingData
            expr: |
              (sum(increase(otelcol_receiver_refused_metric_points[10m])) or vector(0))
                + (sum(increase(otelcol_receiver_refused_spans[10m])) or vector(0))
                + (sum(increase(otelcol_receiver_refused_log_records[10m])) or vector(0))
                > 0
            labels: { severity: critical }
            annotations:
              summary: "otel-collector が受け取りを拒んでいる（系列が届かず、費用・取引の警報が黙り得る）"
              description: "直近 10 分に otel-collector が {{ $value }} 件の受け取りを拒んだ。受け取りの量が上限を超えている（送り手の異常）。手順は cloud の runbook。"
          # Prometheus への remote write が失敗している（collector は受け取れているが、Prometheus に書けない）。
          - alert: OtelCollectorExportFailing
            expr: sum(increase(otelcol_exporter_send_failed_metric_points{exporter="prometheusremotewrite"}[10m])) > 0
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "otel-collector から Prometheus へメトリクスを書けない"
              description: "直近 10 分に remote write が {{ $value }} 件失敗した。アプリのメトリクス（費用・取引）が Prometheus に届いていない。"
          # 受け取る系列が 0 のまま（送り手が全部止まったか、届かない）。collector の scrape は生きているので OtelCollectorDown は鳴らない。
          - alert: OtlpMetricsPipelineSilent
            expr: (sum(rate(otelcol_receiver_accepted_metric_points{receiver="otlp"}[10m])) or vector(0)) == 0
            for: 15m
            labels: { severity: critical }
            annotations:
              summary: "otel-collector がメトリクスを 1 件も受け取っていない"
              description: "直近 10 分に OTLP のメトリクスの受け取りが 0 件。送り手（取引ユニット・LLM ゲートウェイ）が止まっているか、collector へ届いていない。"
          # 系列を送ってくるサービスの数が、送るはずのサービスの数（入りを許した一覧と同じ 12 = 取引ユニットの 11 ＋ LLM ゲートウェイ）を下回る。
          #   target_info は送り手ごとに remote write が作る。一部の送り手だけが途絶えた（止まった・届かない）ことを見る。
          #   IADR-0709 決定 5: 数えるのは送り手の名乗り（job = service.name）ではなく、collector が接続の送り元の Pod から付けた
          #   名前空間と app（k8s_namespace_name・k8s_pod_label_app）。1 つの送り手が他の名を名乗っても、数は増えない。
          #   注: 数は deploy/cloud/infra/networkpolicy.yaml の collector の入りの一覧と同じに保つ（scripts/deploy-cloud.test.js が突き合わせる）。
          - alert: OtlpSendersMissing
            expr: (count(count by (k8s_namespace_name, k8s_pod_label_app) (last_over_time(target_info{k8s_pod_label_app!=""}[10m]))) or vector(0)) < 12
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "メトリクスを送ってくるサービスが {{ $value }} 個（12 個のはず）"
              description: "直近 10 分に系列を送ってきたサービスが 12 個に足りない。止まっているサービスか、collector へ届かないサービスがある（count by (job) (last_over_time(target_info[10m])) で見る）。"
          # IADR-0709 決定 5: 送り元の Pod を引けなかった送り手がいる（collector が API サーバーへ届かない・権限が無い・入りの一覧の外から届いた）。
          #   その系列は送り元の印（otlp_sender_*）を持たないので、印で絞る警報（LLM ゲートウェイの費用・再起動）の元にならない。
          - alert: OtlpSenderUnverified
            expr: count(last_over_time(target_info{k8s_pod_label_app=""}[10m])) > 0
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "送り元の Pod を引けない送り手がいる（{{ $value }} 個）"
              description: "collector が接続の送り元の Pod（名前空間と app）を引けなかった。target_info{k8s_pod_label_app=\"\"} の job で送り手を見る。collector のログ（k8sattributes）と、ServiceAccount otel-collector の権限（名前空間 microservices-platform と ai-stock-trading の Role）、API サーバーへの出（otel-collector-egress-apiserver）を確かめる。"
          # 系列の数が増えすぎた（メモリの上限〔768Mi〕で Prometheus が作り直されると、保持している値〔月次予算の 7 日の窓〕も消える）。
          #   平時の見込み（12 のサービス × 数百 ＋ 自分たち）の 10 倍ほどを閾値にする。
          - alert: PrometheusHeadSeriesHigh
            expr: prometheus_tsdb_head_series{job="prometheus"} > 100000
            for: 15m
            labels: { severity: warning }
            annotations:
              summary: "Prometheus の系列の数が多い（{{ $value }}）"
              description: "Prometheus の head の系列が 100000 を超えた。送り手が想定外の系列を送っている。メモリの上限で再起動すると、保持している値（月次予算の 7 日の窓）が消える。"
      # FR-11, NFR-21, IADR-0466, IADR-0692: LLM 費用の月次予算（用途別）の**進み**の超過（クラウド版）。
      # 注: この ConfigMap の値の中に絵文字を書かない（kustomize が値を引用符の 1 行へ書き換え、試験の読み手が読めなくなる）。
      # 金額も単価も式に無い。上限はゲートウェイのゲージ llm_budget_monthly_limit（Llm:Budget:MonthlyLimits。appsettings.json）。
      # IADR-0709 決定 5: 元の系列は、collector が送り元の Pod から付けた印（otlp_sender_namespace・otlp_sender_app）が LLM ゲートウェイのものだけ
      #   （他の送り手が同じ名の系列を書いても、式に入らない）。
      # 窓は直近 7 日である（30 日ではない）。この Prometheus の保持は 7 日・データは emptyDir なので、30 日の窓は
      #   いつも過小になる（7 日分しか無い）。7 日の費用を、月次予算を 7/30 に按分した値と比べる（月次予算を超える速さで使っている）。
      #   compose・経路 B の LlmMonthlyBudgetExceeded（直近 30 日）とは窓が違うので、名前を分けた。
      # Prometheus の再起動でデータが消えると、7 日に満たない分だけ過小になる（鳴りにくい側）。当日の費用の上限
      #   （values-cloud の Llm__CallLimits__*__DailyCostLimit。送る前に止める）が別にある。
      - name: llm-cost-budget
        rules:
          - alert: LlmMonthlyBudgetPaceExceeded
            expr: |
              sum by (llm_purpose, llm_currency) (increase(llm_cost_total{otlp_sender_namespace="microservices-platform", otlp_sender_app="llmgateway-service"}[7d]))
                > on (llm_purpose, llm_currency)
              max by (llm_purpose, llm_currency) (llm_budget_monthly_limit{otlp_sender_namespace="microservices-platform", otlp_sender_app="llmgateway-service"}) * 7 / 30
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "LLM 費用が用途 {{ $labels.llm_purpose }} の月次予算を超える速さで使われている（直近 7 日）"
              description: "用途 {{ $labels.llm_purpose }} の直近 7 日の LLM 費用が {{ $value }} {{ $labels.llm_currency }} となり、月次予算（Llm:Budget:MonthlyLimits）の 7/30 を超えた。このままの速さでは月次予算を超える。当日の費用の上限で止まった呼び出しは llm_call_limit_exceeded_total で見る。単価を解決できなかった呼び出し（llm_pricing_unpriced_total）が 0 でなければ金額は過小である。"
      # NFR-18, NFR-21, IADR-0698: LLM ゲートウェイの再起動と、当日の費用の枠の置き場の障害。
      # 当日の費用の枠は PVC に残る（再起動で 0 に戻らない）。短い間の再起動の繰り返しは、それでも原因を見る（要求数の窓はプロセス内で戻る）。
      # 起動の回数は起動の時刻のゲージ llm_gateway_start_time_seconds の変わった回数で数える（プロセスごとに大きくなる。ラベルが変わっても max で 1 本になる）。
      # 元の系列は LLM ゲートウェイの Pod から届いたものだけ（IADR-0709 決定 5。上の費用の警報と同じ印）。
      - name: llm-gateway-state
        rules:
          - alert: LlmGatewayRestartLoop
            expr: changes(max(llm_gateway_start_time_seconds{otlp_sender_namespace="microservices-platform", otlp_sender_app="llmgateway-service"})[30m:1m]) >= 3
            labels: { severity: warning }
            annotations:
              summary: "LLM ゲートウェイが短い間に再起動を繰り返している（直近 30 分に 3 回以上）"
              description: "直近 30 分に LLM ゲートウェイが {{ $value }} 回起動し直した。kubectl -n microservices-platform describe pod -l app=llmgateway-service と logs --previous で理由を読む。当日の費用の枠は PVC に残る（IADR-0698）。"
          # 置き場を読めない・書けない間、段 2 は費用の上限を持つ呼び手の呼び出しを送らない（fail-closed）。取引ユニットの LLM の判断が止まる。
          # 右の項は、10 分前に無かった系列（起動の直後の最初の 1 件。0 から現れずに 1 で現れる）を拾う（increase は新しい系列の初回を数えない）。
          - alert: LlmCostStateUnavailable
            expr: (sum(increase(llm_call_limit_exceeded_total{llm_limit_kind="cost_state", otlp_sender_namespace="microservices-platform", otlp_sender_app="llmgateway-service"}[10m])) > 0) or (count(llm_call_limit_exceeded_total{llm_limit_kind="cost_state", otlp_sender_namespace="microservices-platform", otlp_sender_app="llmgateway-service"} unless llm_call_limit_exceeded_total{llm_limit_kind="cost_state", otlp_sender_namespace="microservices-platform", otlp_sender_app="llmgateway-service"} offset 10m) > 0)
            labels: { severity: critical }
            annotations:
              summary: "LLM ゲートウェイが当日の費用の枠の置き場を扱えず、呼び出しを送っていない"
              description: "直近 10 分に、当日の費用の枠を読めない・書けないため送らなかった呼び出しがある。ゲートウェイのログ（当日の費用の枠を置き場で扱えない）と PVC llmgateway-service-state を確かめる。"
      # NFR-16, NFR-21, IADR-0705: サーバ証明書の期限（受け口が出している証明書。deploy/cloud/tls-cert-probe）。
      # ESO は 1 年（8760h）の証明書を半年（4380h）ごとに作り直す。作り直しの後に消費側（Postgres・RabbitMQ・LLM ゲートウェイ）を
      #   作り直せば、出している証明書の残りは 1 年に戻る。残りが 150 日を切るのは、作り直し（ESO の止まり・封印のまま）か消費側の作り直しが
      #   約 1 か月漏れている。30 日を切ったら止まる前に直す（期限が切れると接続は平文へ倒れず止まる）。
      # OpenBao の受け口の証明書（1 年）は、tls-cert.sh が同じ回に 2 年の CA（openbao-ca）と作る（IADR-0696）。受け口は ESO だけが届くので
      #   測りに行かず、最新の CA の notAfter から 365 日を引いて導く（試験が tls-cert.sh の日数と突き合わせる）。作り直しは半年ごと。
      - name: cloud-tls-expiry
        rules:
          - alert: TlsServerCertExpiringSoon
            expr: (min by (target) (tls_probe_cert_not_after_seconds) - time()) < 150 * 86400
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.target }} の受け口の証明書の残りが 150 日を切った"
              description: "{{ $labels.target }} が出している証明書の残りは {{ $value | humanizeDuration }}。ESO の作り直し（unseal の後）か、消費側の作り直し（rollout restart）が漏れている。手順は deploy/cloud/README.md の証明書の更新。"
          - alert: TlsServerCertExpiryCritical
            expr: (min by (target) (tls_probe_cert_not_after_seconds) - time()) < 30 * 86400
            for: 1h
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.target }} の受け口の証明書の残りが 30 日を切った"
              description: "{{ $labels.target }} が出している証明書の残りは {{ $value | humanizeDuration }}。切れると接続が止まる。すぐに作り直す（README の証明書の更新）。"
          # 鎖（基盤の CA）・名前・期限のどれかが合わない、または受け口へ届かない。期限の系列は届けば出る（検証の失敗に隠れない）。
          - alert: TlsServerCertNotVerified
            expr: (min by (target) (tls_probe_verified)) == 0
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "{{ $labels.target }} の受け口の証明書を基盤の CA で確かめられない"
              description: "測りの Pod から {{ $labels.target }} へ届かないか、証明書の鎖・名前・期限が合わない。種類は tls_probe_verify_error の reason（CERT_HAS_EXPIRED・UNABLE_TO_VERIFY_LEAF_SIGNATURE・ERR_TLS_CERT_ALTNAME_INVALID など）。kubectl -n platform-infra logs deploy/tls-cert-probe で理由を読む。"
          # 測りが止まった・4 つの受け口のどれかの系列が無い（黙らない）。
          - alert: TlsServerCertProbeMissing
            expr: (count(tls_probe_up == 1) or vector(0)) < 4
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "サーバ証明書の期限を測れている受け口が {{ $value }} 個（4 個のはず）"
              description: "tls-cert-probe が止まっているか、Postgres・RabbitMQ・Keycloak・LLM ゲートウェイのどれかへ届かない。期限の警報が黙り得る。"
          - alert: PlatformInfraCaExpiringSoon
            expr: (min(tls_ca_cert_not_after_seconds{ca="platform-infra-ca"}) - time()) < 400 * 86400
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "基盤の CA（OpenBao の PKI）の残りが 400 日を切った"
              description: "CA の残りが {{ $value | humanizeDuration }}。1 年のサーバ証明書が CA より長く生きられなくなる。CA の作り直しの手順を決める。"
          - alert: OpenBaoListenerCertExpiringSoon
            expr: (max(tls_ca_cert_not_after_seconds{ca="openbao-ca"}) - 365 * 86400 - time()) < 150 * 86400
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "OpenBao の受け口の証明書の残りが 150 日を切った（CA の notAfter から導いた値）"
              description: "残りは {{ $value | humanizeDuration }}。tls-cert.sh --live renew を流す（手順書 cloud-openbao-tls-runbook の作り直し）。切れると ESO が値を写せなくなる。"
          - alert: TlsCaCertMissing
            expr: absent(tls_ca_cert_not_after_seconds{ca="platform-infra-ca"}) or absent(tls_ca_cert_not_after_seconds{ca="openbao-ca"})
            for: 30m
            labels: { severity: warning }
            annotations:
              summary: "CA の証明書（ConfigMap platform-infra-ca・openbao-ca）の期限を読めない"
              description: "測りの Pod が CA の ConfigMap を読めないか、止まっている。CA と OpenBao の受け口の期限の警報が黙り得る。"
      # NFR-18, IADR-0705: 外向きの中継（deploy/cloud/egress）。enforce の段で表に無い宛先を拒んだ（宛先の追加漏れか、想定外の持ち出し）。
      - name: cloud-egress
        rules:
          - alert: EgressProxyDenied
            expr: sum(increase(egress_proxy_requests_total{decision="deny"}[15m])) > 0
            labels: { severity: warning }
            annotations:
              summary: "外向きの中継が宛先を拒んだ（直近 15 分に {{ $value }} 件）"
              description: "kubectl -n platform-infra logs deploy/egress-proxy | grep deny: で宛先を読む。要る宛先なら手順書（cloud-egress-proxy-runbook）で許可表へ足す。要らない宛先なら呼び手を調べる。"
          # IADR-0709: 全体の表には在るが、その送り元の表に無い宛先への要求（送り元ごとの段が report なら通している。enforce なら拒んで上の警報も鳴る）。
          - alert: EgressProxySourceMismatch
            expr: sum by (source) (increase(egress_proxy_source_mismatch_total[15m])) > 0
            labels: { severity: warning }
            annotations:
              summary: "外向きの中継の送り元 {{ $labels.source }} が、自分の表に無い宛先へ出ようとした（直近 15 分に {{ $value }} 件）"
              description: "kubectl -n platform-infra logs deploy/egress-proxy | grep 'の表に無い' で宛先を読む。その送り元が使う宛先なら、送り元の行として許可表へ足す。使わない宛先なら呼び手を調べる（手順書 cloud-egress-proxy-runbook）。"
          # 14 日は report の段に入った日時（中継が ConfigMap egress-proxy-report-since から出す）から数える。for で数えると、Prometheus
          # （emptyDir・保持 7 日）か中継の再起動で数え直しになり、鳴らないまま残りうる。日時が無い・読めない（0・系列が無い）ときも鳴る。
          - alert: EgressProxyReportMode
            expr: (max(egress_proxy_enforcing) == 0 or on() max(egress_proxy_source_enforcing) == 0) and on() ((time() - max(egress_proxy_report_since_timestamp_seconds)) > 14 * 86400 or on() absent(egress_proxy_report_since_timestamp_seconds))
            for: 1h
            labels: { severity: warning }
            annotations:
              summary: "外向きの中継が report の段（全体か送り元ごと）のまま 14 日を過ぎた（か、report の段に入った日時が無い）"
              description: "移す間の段（deploy/cloud-transition/egress-proxy-report）か、送り元ごとの段（EGRESS_PROXY_SOURCE_MODE=report。IADR-0709）が残っている。report の行を読み、許可表を埋めて enforce へ進める。日時が無いときは ConfigMap platform-infra/egress-proxy-report-since の since を確かめる（手順書 cloud-egress-proxy-runbook）。"
          - alert: EgressProxyDown
            expr: absent(up{job="egress-proxy"} == 1)
            for: 10m
            labels: { severity: critical }
            annotations:
              summary: "外向きの中継を収集できない"
              description: "egress-proxy が止まると、LLM の提供元・バックアップの保管先・Discord・heartbeat へ届かない（heartbeat が止まり、外の監視も知らせる）。"
  # AST の PrometheusRule から spec（= Prometheus の規則ファイルの形）だけを取り出す。initContainer が実行する。
  #   ConfigMap が空・無い → 警告を出して起動する（AstAlertRulesNotLoaded が鳴る）
  #   PrometheusRule でない・spec が無い・promtool が読めない → 起動しない（exit 1）
  extract-ast-rules.sh: |
    #!/bin/sh
    set -eu
    src="${AST_RULES_SRC:?}"
    out="${AST_RULES_OUT:?}"
    promtool="${PROMTOOL:?}"
    n=0
    for f in "$src"/*.yaml "$src"/*.yml; do
      [ -f "$f" ] || continue
      base="$(basename "$f")"
      base="${base%.*}"
      case "$base" in
        *[!A-Za-z0-9._-]*) echo "ast-rules: ERROR: ファイル名が想定外である: $base" >&2; exit 1 ;;
      esac
      if ! grep -q '^kind: PrometheusRule[[:space:]]*$' "$f"; then
        echo "ast-rules: ERROR: $base は PrometheusRule ではない。起動しない。" >&2
        exit 1
      fi
      awk '
        /^---[[:space:]]*$/ { inspec = 0; next }
        /^spec:[[:space:]]*$/ { inspec = 1; next }
        inspec && /^[^[:space:]#]/ { inspec = 0 }
        inspec { sub(/^  /, ""); print }
      ' "$f" > "$out/$base.yml"
      if ! grep -q '^groups:' "$out/$base.yml"; then
        echo "ast-rules: ERROR: $base に spec.groups が無い。起動しない。" >&2
        exit 1
      fi
      if ! "$promtool" check rules "$out/$base.yml" >&2; then
        echo "ast-rules: ERROR: $base の規則を promtool が読めない。起動しない。" >&2
        exit 1
      fi
      n=$((n + 1))
    done
    if [ "$n" -eq 0 ]; then
      echo "ast-rules: WARNING: AST の規則（ConfigMap ast-prometheus-rules）が無い。AstAlertRulesNotLoaded が鳴る。" >&2
    else
      echo "ast-rules: AST の規則を ${n} ファイル読んだ。" >&2
    fi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: platform-infra
  labels: { app: prometheus }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      automountServiceAccountToken: false
      # NFR-18, IADR-0697: 基盤の Pod の権限を最小にする。イメージの利用者（nobody＝uid 65534。名前の利用者は runAsNonRoot で検められないので
      #   数で書く）のまま root でなく、capability を全部落とし（受け口は 9090 で 1024 より上）、権限の昇格を許さず、
      #   ルートのファイルシステムは読み取り専用（書くのは emptyDir だけ）。seccomp は RuntimeDefault。
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        - name: load-ast-rules
          image: prom/prometheus:v2.52.0@sha256:5c435642ca4d8427ca26f4901c11114023004709037880cd7860d5b7176aa731
          command: ["/bin/sh", "/etc/prometheus/config/extract-ast-rules.sh"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          env:
            - { name: AST_RULES_SRC, value: /ast-src }
            - { name: AST_RULES_OUT, value: /etc/prometheus/ast-rules }
            - { name: PROMTOOL, value: /bin/promtool }
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/config, readOnly: true }
            - { name: ast-src, mountPath: /ast-src, readOnly: true }
            - { name: ast-rules, mountPath: /etc/prometheus/ast-rules }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 200m, memory: 128Mi }
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0@sha256:5c435642ca4d8427ca26f4901c11114023004709037880cd7860d5b7176aa731
          args:
            - "--config.file=/etc/prometheus/config/prometheus.yml"
            - "--storage.tsdb.path=/prometheus"
            - "--web.enable-remote-write-receiver"
            - "--storage.tsdb.retention.time=7d"
            - "--storage.tsdb.retention.size=1GB"
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { containerPort: 9090, name: http }
          readinessProbe:
            httpGet: { path: /-/ready, port: 9090 }
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - { name: config, mountPath: /etc/prometheus/config, readOnly: true }
            - { name: ast-rules, mountPath: /etc/prometheus/ast-rules, readOnly: true }
            - { name: data, mountPath: /prometheus }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits: { cpu: 500m, memory: 768Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-cloud-config
        # AST の PrometheusRule（kustomize の外。手順書参照）。無くても起動する（AstAlertRulesNotLoaded が鳴る）。
        - name: ast-src
          configMap:
            name: ast-prometheus-rules
            optional: true
        - name: ast-rules
          emptyDir: {}
        # size(1GB) < sizeLimit(2Gi) で、保持の削除が先に働く（溢れて退かされない）。
        - name: data
          emptyDir:
            sizeLimit: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: platform-infra
  labels: { app: prometheus }
spec:
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
