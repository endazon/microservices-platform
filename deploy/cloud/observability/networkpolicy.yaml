# NFR-21, NFR-18, IADR-0675 (#2402): 警報の Pod の通信を絞る。受け口は増やさない（クラスタの外からは何も届かない）。
# - Alertmanager: 受けは Prometheus からの :9093 だけ。外へは名前解決と HTTPS（Discord・Healthchecks.io）だけ。
# - Prometheus: 受けは otel-collector からの remote write（:9090）だけ。外へは制限しない（クラスタ内を収集する）。
# - otel-collector: Prometheus からの :8888（自己テレメトリの収集）を足す。
# 🔴 HTTPS は外向きの中継（egress-proxy）だけを経て出す。中継は名前の許可表に在る宛先の 443 だけへ繋ぐ（IADR-0704）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: alertmanager-cloud
  namespace: platform-infra
  labels: { app: alertmanager }
spec:
  podSelector:
    matchLabels: { app: alertmanager }
  policyTypes: [Ingress, Egress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: prometheus }
      ports:
        - { protocol: TCP, port: 9093 }
  egress:
    - to:
        - namespaceSelector:
            matchLabels: { kubernetes.io/metadata.name: kube-system }
          podSelector:
            matchLabels: { k8s-app: kube-dns }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
    # IADR-0704: クラスタの外の HTTPS は外向きの中継（egress-proxy。名前の許可表で宛先を絞る）を経る。外の 443 へ直には出さない。
    - to:
        - podSelector:
            matchLabels: { app: egress-proxy }
      ports:
        - { protocol: TCP, port: 3128 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: prometheus-cloud
  namespace: platform-infra
  labels: { app: prometheus }
spec:
  podSelector:
    matchLabels: { app: prometheus }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: otel-collector }
      ports:
        - { protocol: TCP, port: 9090 }
---
# NFR-21, IADR-0675 (#2402): otel-collector の自己テレメトリ（:8888）を Prometheus から収集する入りの**別宣言**。
# 🔴 #2401 の otel-collector-ingress-clients（4317 / 4318）を書き換えない（加算的）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: otel-collector-ingress-prometheus
  namespace: platform-infra
  labels: { app: otel-collector }
spec:
  podSelector:
    matchLabels: { app: otel-collector }
  policyTypes: [Ingress]
  ingress:
    - from:
        - podSelector:
            matchLabels: { app: prometheus }
      ports:
        - { protocol: TCP, port: 8888 }
