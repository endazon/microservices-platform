# NFR-21, NFR-03, ADR-0006, IADR-0675 (#2402): クラウドの最小構成の警報（Prometheus ＋ Alertmanager → Discord）と、
# 外の監視への heartbeat（常に鳴る警報 Watchdog → Healthchecks.io）。Grafana・Loki・Tempo は置かない。
# 🔴 クラウドの最小構成（deploy/cloud/ の infra。#2401）の kustomization の resources へ、このディレクトリを足して使う。
#    otel-collector（Service `otel-collector`。:8888 の自己テレメトリ・Prometheus へ remote write）は infra 側にある前提。
# 手順（Discord の webhook・Healthchecks.io の check・Secret・AST の規則の投入・試験）は
# docs/operations/cloud-backup-alerts-heartbeat-runbook.md。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - prometheus.yaml
  - alertmanager.yaml
  - networkpolicy.yaml
