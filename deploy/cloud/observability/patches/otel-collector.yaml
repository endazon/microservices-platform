# NFR-21, IADR-0675 (#2402): クラウドの最小構成の otel-collector（#2401 の deploy/cloud/infra/otel-collector.yaml）へ、
# **メトリクスの Prometheus への remote write だけ**を足す patch。deploy/cloud/kustomization.yaml が当てる。
# - 足すのは exporters.prometheusremotewrite と、metrics の経路の exporters だけである。traces・logs は #2401 のまま（debug）。
# - ConfigMap の設定は 1 つの文字列なので、patch は config.yaml を丸ごと置き換える。🔴 #2401 の側を変えたら、ここも同じに直す
#   （scripts/cloud-ops.test.js T-2402-51 が、remote write の他は #2401 の設定と同じであることを突き合わせる）。
# - Service へ自己テレメトリの :8888 を足す（Prometheus の収集先 otel-collector:8888。#2401 の Service は 4317 / 4318 だけ）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: platform-infra
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          # IADR-0697: 1 回の受け取りの大きさと、1 つの接続の同時の流れの数に上限を置く（溢れさせて正当な系列を落とさせない）。
          #   超えた分は受け取りを拒み、拒んだ数は自身の計器（otelcol_receiver_refused_*）に出る（警報 OtelCollectorRefusingData）。
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
            max_concurrent_streams: 16
          http:
            endpoint: 0.0.0.0:4318
            max_request_body_size: 4194304
    processors:
      batch:
        timeout: 5s
      # 使う量が上限に近づくと受け取りを拒む（拒んだ数は otelcol_receiver_refused_* に出る）。spike は明示する（既定は上限の 2 割）。
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 32
      # NFR-21, IADR-0709 決定 5: 送り手の名乗り（service.name＝job）とは別に、接続の送り元の Pod から名前空間と app を付ける（警報の元の系列を
      #   他の送り手が偽れないように）。順は「送り手が付けた同じ名の属性を消す → 送り元の Pod から付ける → 各点へ写す」。batch より前に置く
      #   （送り元の接続は batch の後では分からない）。Pod を引けなければ何も付けない（その系列は警報 OtlpSenderUnverified の元になる）。
      transform/otlp-sender-strip:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - delete_matching_keys(attributes, "^k8s.")
          - context: datapoint
            statements:
              - delete_matching_keys(attributes, "^otlp.sender.")
      # 名前空間ごとに 1 つ（Role は名前空間ごと。クラスタ全体の Pod は読まない）。読むのは Pod の名前空間とラベル app だけ。
      k8sattributes/ast:
        auth_type: serviceAccount
        passthrough: false
        filter:
          namespace: ai-stock-trading
        pod_association:
          - sources:
              - from: connection
        extract:
          metadata: [k8s.namespace.name]
          labels:
            - { tag_name: k8s.pod.label.app, key: app, from: pod }
      k8sattributes/msp:
        auth_type: serviceAccount
        passthrough: false
        filter:
          namespace: microservices-platform
        pod_association:
          - sources:
              - from: connection
        extract:
          metadata: [k8s.namespace.name]
          labels:
            - { tag_name: k8s.pod.label.app, key: app, from: pod }
      transform/otlp-sender-identity:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["otlp_sender_namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
              - set(attributes["otlp_sender_app"], resource.attributes["k8s.pod.label.app"]) where resource.attributes["k8s.pod.label.app"] != nil
    exporters:
      debug:
        verbosity: basic
      prometheusremotewrite:
        endpoint: http://prometheus:9090/api/v1/write
    service:
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, transform/otlp-sender-strip, k8sattributes/ast, k8sattributes/msp, transform/otlp-sender-identity, batch]
          exporters: [prometheusremotewrite]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: platform-infra
spec:
  ports:
    - { name: self-metrics, port: 8888, targetPort: 8888 }
