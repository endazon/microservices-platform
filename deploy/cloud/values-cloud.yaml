# NFR-18, IADR-0674 (#2401): クラウドの単一ノード（取引ユニット AST を動かすだけの MSP の最小構成）の chart の値。
#
#   helm upgrade --install msp deploy/helm/microservices-platform -n microservices-platform \
#     -f deploy/cloud/values-cloud.yaml --set-string global.image.tag=<ビルドした sha>
#
# 持ち込むのは LLM ゲートウェイだけ。knowledge ユニットの全サービス・BFF・frontend・認可・MCP・通知・オブジェクトストレージ・
# Wiki.js・エッジ・メッシュは描かない（Web の画面とニュースの RAG を持ち込まない。#2401）。試験が描画で固定する。
# 🔴 資格情報の値を書かない。LLM ゲートウェイの API キーの Secret（llm-provider-credentials）は OpenBao から写す（IADR-0689）。

global:
  image:
    # 手元でビルドしたイメージを SSH でノードへ取り込む（README §イメージ）。レジストリは後の段。
    registry: cloud-local
  # NFR-16, NFR-18, IADR-0693: 認可サーバー（Keycloak）へは HTTPS（8443）で繋ぎ、サーバ証明書を基盤の CA（ConfigMap platform-infra-ca）で検証する。
  #   Keycloak は平文の口を持たない（infra/keycloak.yaml）。https でない取得先はアプリが起動で拒む（Auth__RequireHttpsMetadata=true）。
  #   トークンの発行元（iss）は KC_HOSTNAME と同じ https://keycloak:8443/realms/platform（MSP の名前空間の別名 keycloak で引く）。
  #   稼働中の構成を移す間の旧の発行元の扱いは、手順書 docs/operations/cloud-keycloak-tls-runbook.md の段 3・段 6 に 1 か所で持つ（ここに書かない）。
  auth:
    authority: https://keycloak:8443/realms/platform
    tls:
      enabled: true

namespace:
  # 名前空間は deploy/cloud/infra/namespaces.yaml が作る（基盤の別名と NetworkPolicy を chart より先に置くため）。
  create: false
  istioInjection: false

# メッシュとエッジは持ち込まない（外へ開く口を持たない。到達の制限は NetworkPolicy）。
mesh:
  enabled: false
edge:
  enabled: false

# NetworkPolicy は chart では描かない（入り・出とも deploy/cloud/infra/networkpolicy.yaml が持つ）。
#   - chart の取引ユニットからの入り（fromAst）は networkPolicy.enabled の内側にあり、有効にすると chart の出の既定拒否
#     （クラスタの外への許可を描かない）も外せない。提供元の API へ出る LLM ゲートウェイには、それを当てられない。
networkPolicy:
  enabled: false
  egress:
    enabled: false

# ArgoCD の同期の後の確かめ（BFF を呼ぶ）と、HPA・PDB（単一レプリカ・単一ノード）は持ち込まない。
drift:
  postSyncHook:
    enabled: false
scaling:
  enabled: false

services:
  document: { enabled: false }
  datasource: { enabled: false }
  conversion: { enabled: false }
  ingestion: { enabled: false }
  retrieval: { enabled: false }
  aianalysis: { enabled: false }
  authorization: { enabled: false }
  wiki: { enabled: false }
  dashboard: { enabled: false }
  graph: { enabled: false }
  notification: { enabled: false }
  mcp: { enabled: false }
  feedback: { enabled: false }
  configuration: { enabled: false }
  risk-management: { enabled: false }
  market-monitor: { enabled: false }
  bff: { enabled: false }
  llmgateway:
    enabled: true
    replicas: 1
    # 実測（PoC・経路B の稼働）に合わせた要求。上限は既定のまま（512Mi）。
    resources:
      requests: { cpu: 50m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }
    # NFR-16, IADR-0674: メッシュが無いので、受け口をアプリで TLS にする（基盤の CA が発行した証明書。OpenBao の PKI が発行し ESO が写す。IADR-0689）。
    # 取引ユニットは REST（/complete）だけを使う。gRPC の h2c の受け口は http でしか立たないので外す（平文の受け口を残さない）。
    grpcPort: null
    tls:
      secretName: llmgateway-tls
    # NFR-18, IADR-0674: ルートのファイルシステムを読み取り専用にする（書き込みは /tmp の emptyDir と、下の当日の費用の枠の PVC だけ。IADR-0698）。
    readOnlyRootFilesystem: true
    # NFR-18, IADR-0689 決定 12（2026-11-07）: クラウドでは LLM ゲートウェイの段 2 を強制にする（移行の門の条件。段 1 は報告だけ）。
    #   既定の描画とローカル（values-local）は段 1 のまま（試験が固定する）。
    #   - 経路の設定の不足は起動で止める（IADR-0677）
    #   - 呼び手ごとの許可表に無い用途・モデルは 403（IADR-0684。取引ユニットの呼び手は既定の表に在る）
    #   - 入力の上限と要求数・当日の費用の上限を超えたら送らない（IADR-0678。入力と要求数の上限は既定の値）
    # NFR-18, NFR-21, IADR-0701（2026-11-07）: 埋め込み（gRPC Embed）も同じ許可表と上限を段 2 で通す。クラウドでは埋め込みを使わないので、
    #   許可のある呼び手は描かれず（取り込み・検索はクラウドに無い）、取引ユニットの呼び手には許可が無い＝埋め込みは呼べない。
    #   合成監視の標識は許可集合（AI 分析・検索。クラウドに無い）の呼び手からだけ引き継ぐ（段 2。外の呼び手の標識は費用に計上する）。
    # NFR-18, NFR-21, IADR-0692（2026-11-07 の所有者の裁定）: 当日の費用の上限は、全呼び手の合計で 1 日 20 USD。
    #   - 通貨は単価表の通貨（Llm:Pricing:Currency＝USD）。日の区切りは UTC の 0 時（ゲートウェイの判定器が固定で持つ）。
    #   - 取引ユニットの呼び手が主（18 USD）。既定（0.5 USD）は呼び手の項目が無い呼び手のそれぞれに効く ——
    #     ナレッジの 4 つの呼び手（aianalysis・graph・retrieval・conversion。クラウドでは描かない）で 2 USD。
    #     許可表に無い呼び手は段 2 の許可表（CallerPolicy）が上限の判定より前に 403 で拒む。合計 18 + 0.5 × 4 = 20 USD。
    #   - 状態はレプリカごとなので、1 レプリカ（scaling.enabled: false）が前提（試験が固定する）。
    #   - 段 2 で既定の金額が無ければ、ゲートウェイは起動しない（IADR-0692）。
    # NFR-18, NFR-21, IADR-0698（2026-11-07 の所有者の裁定「再起動しても残るように直す」）: 当日の費用の枠を PVC の上のファイルに残す。
    #   - 再起動の後は前回の値を読み込んでから判定する。読めない・書けない間は、費用の上限を持つ呼び出しを送らない（fail-closed）。
    #   - PVC（ReadWriteOnce）を 1 つの Pod だけが書く: 1 レプリカ・Recreate（chart が描画で止める）。ファイルの排他の鍵が 2 つ目の書き手を止める。
    #   - 置き場のパス（Llm__CallLimits__SpendStore__Path）は mountPath の下（試験が突き合わせる）。
    persistence:
      enabled: true
      mountPath: /var/lib/llm-gateway
      size: 64Mi
    extraEnvAppend:
      - { name: Llm__RouteValidation__Mode, value: "Fail" }
      - { name: Llm__CallerPolicy__Mode, value: "Enforce" }
      - { name: Llm__CallLimits__Mode, value: "Enforce" }
      - { name: Llm__CallerPolicy__EmbeddingMode, value: "Enforce" }
      - { name: Llm__CallLimits__EmbeddingMode, value: "Enforce" }
      - { name: Llm__SyntheticMarker__Mode, value: "Enforce" }
      - { name: Llm__CallLimits__Default__DailyCostLimit, value: "0.5" }
      - { name: Llm__CallLimits__Callers__ai-stock-trading-llm-caller__DailyCostLimit, value: "18" }
      - { name: Llm__CallLimits__SpendStore__Path, value: "/var/lib/llm-gateway/daily-spend.json" }

frontend:
  enabled: false
seaweedfs:
  enabled: false
wikijs:
  enabled: false
embedding:
  enabled: false
syntheticMonitor:
  enabled: false
