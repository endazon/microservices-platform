# NFR-18, IADR-0703: master realm の一時管理者の手順（master-admin.js）を流す Job。
#   🔴 kustomize には入れない（Job は作り直さないと流れない）。deploy/cloud/keycloak-admin/keycloak-admin.sh --live <段> が、段（MODE）を差し替えて作り、
#      終わるまで待ち、ログを出し、成功したら消す。
#   - 管理者は Secret keycloak-admin（secretKeyRef だけで読む）。宛先は https://keycloak:8443 で、基盤の CA（ConfigMap platform-infra-ca）で検証する。
#   - イメージは keycloak-clients の Job と同じ digest。到達は Keycloak の 8443 だけ（infra/networkpolicy.yaml の keycloak-ingress-clients）。
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-master-admin
  namespace: platform-infra
  labels: { app: keycloak-master-admin }
spec:
  backoffLimit: 0
  activeDeadlineSeconds: 300
  ttlSecondsAfterFinished: 86400
  template:
    metadata:
      labels: { app: keycloak-master-admin }
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      containers:
        - name: master-admin
          image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          command: ["node", "/opt/keycloak-master-admin/master-admin.js"]
          env:
            # 段（keycloak-admin.sh が差し替える）
            - name: MODE
              value: "check"
            - name: KC_URL
              value: https://keycloak:8443
            - name: NODE_EXTRA_CA_CERTS
              value: /etc/platform-infra-ca/ca.crt
            - name: KC_ADMIN_USER
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: username } }
            - name: KC_ADMIN_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-admin, key: password } }
          securityContext:
            runAsNonRoot: true
            runAsUser: 1000
            runAsGroup: 1000
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
            seccompProfile: { type: RuntimeDefault }
          volumeMounts:
            - { name: script, mountPath: /opt/keycloak-master-admin, readOnly: true }
            - { name: platform-infra-ca, mountPath: /etc/platform-infra-ca, readOnly: true }
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits: { cpu: 500m, memory: 128Mi }
      volumes:
        - name: script
          configMap: { name: keycloak-master-admin, defaultMode: 0444 }
        - name: platform-infra-ca
          configMap:
            name: platform-infra-ca
            items:
              - { key: ca.crt, path: ca.crt }
