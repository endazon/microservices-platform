# NFR-18, IADR-0674 (#2401): 基盤と MSP の名前空間。MSP の chart は namespace.create=false で入れる（values-cloud.yaml）。
# Pod Security Admission の水準は chart が作るときと同じ（enforce baseline・warn / audit restricted）。メッシュは持ち込まない。
apiVersion: v1
kind: Namespace
metadata:
  name: platform-infra
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: Namespace
metadata:
  name: microservices-platform
  labels:
    pod-security.kubernetes.io/enforce: baseline
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
