# NFR-18, IADR-0674 (#2401): クラウドの単一ノード（取引ユニット AST を動かすだけの MSP の最小構成）の基盤。
# 適用: kubectl apply -k deploy/cloud/infra（手順は deploy/cloud/README.md。Secret は OpenBao から ESO が写す。IADR-0689）
# 🔴 ここに資格情報の値を置かない。Secret は 1 つも描かない（OpenBao の中で作り ESO が写す。試験が固定する）。
# 持ち込まないもの: valkey・qdrant・mailpit・mail-relay・観測の保存先（Web の画面・ニュースの RAG を持ち込まない。#2401）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - namespaces.yaml
  - postgres.yaml
  - postgres-ast-db-users.yaml
  - rabbitmq.yaml
  - rabbitmq-permissions.yaml
  - keycloak.yaml
  - otel-collector.yaml
  - aliases.yaml
  - networkpolicy.yaml
