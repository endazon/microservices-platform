# NFR-18, IADR-0674 (#2401): 観測の受け口（collector）。サービスの OTLP を受けて捨てる（debug へだけ出す）。
# 観測の保存先（Loki・Tempo・Prometheus・Grafana）は最初の稼働では持ち込まない（8 GB のノードに収める。保存先と警報は MSP#2402）。
# deploy/local/infra/otel-collector.yaml の受け口のうち、OTLP だけを残した（メール中継・リセットの床・秘匿管理の監査は持ち込まない）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: platform-infra
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          # IADR-0697: 1 回の受け取りの大きさと、1 つの接続の同時の流れの数に上限を置く（溢れさせて正当な系列を落とさせない）。
          #   超えた分は受け取りを拒み、拒んだ数は自身の計器（otelcol_receiver_refused_*）に出る（警報 OtelCollectorRefusingData）。
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
            max_concurrent_streams: 16
          http:
            endpoint: 0.0.0.0:4318
            max_request_body_size: 4194304
    processors:
      batch:
        timeout: 5s
      # 使う量が上限に近づくと受け取りを拒む（拒んだ数は otelcol_receiver_refused_* に出る）。spike は明示する（既定は上限の 2 割）。
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 32
    exporters:
      debug:
        verbosity: basic
    service:
      # 自身の計器の待ち受けは明示し、ほかの経路と揃える（collector の既定は版で変わる。check-collector-self-telemetry）。届く範囲は NetworkPolicy が絞る。
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: platform-infra
  labels: { app: otel-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      automountServiceAccountToken: false
      # NFR-18, IADR-0697: 基盤の Pod の権限を最小にする。イメージの利用者（uid 10001）のまま root でなく、capability を全部落とし
      #   （受け口は 4317・4318・8888 で 1024 より上）、権限の昇格を許さず、ルートのファイルシステムは読み取り専用（書く物が無い）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.164.0-386@sha256:40392928d2b988b77e7525dbac33e5e3d9bedb40b9ff8c1f9119d92ca3a8a1c3
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol-contrib, readOnly: true }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: platform-infra
  labels: { app: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
