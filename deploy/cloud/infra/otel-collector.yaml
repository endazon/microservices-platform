# NFR-18, IADR-0674 (#2401): 観測の受け口（collector）。サービスの OTLP を受けて捨てる（debug へだけ出す）。
# 観測の保存先（Loki・Tempo・Prometheus・Grafana）は最初の稼働では持ち込まない（8 GB のノードに収める。保存先と警報は MSP#2402）。
# deploy/local/infra/otel-collector.yaml の受け口のうち、OTLP だけを残した（メール中継・リセットの床・秘匿管理の監査は持ち込まない）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: platform-infra
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          # IADR-0697: 1 回の受け取りの大きさと、1 つの接続の同時の流れの数に上限を置く（溢れさせて正当な系列を落とさせない）。
          #   超えた分は受け取りを拒み、拒んだ数は自身の計器（otelcol_receiver_refused_*）に出る（警報 OtelCollectorRefusingData）。
          grpc:
            endpoint: 0.0.0.0:4317
            max_recv_msg_size_mib: 4
            max_concurrent_streams: 16
          http:
            endpoint: 0.0.0.0:4318
            max_request_body_size: 4194304
    processors:
      batch:
        timeout: 5s
      # 使う量が上限に近づくと受け取りを拒む（拒んだ数は otelcol_receiver_refused_* に出る）。spike は明示する（既定は上限の 2 割）。
      memory_limiter:
        check_interval: 1s
        limit_mib: 128
        spike_limit_mib: 32
      # NFR-21, IADR-0709 決定 5: 送り手の名乗り（service.name＝job）とは別に、接続の送り元の Pod から名前空間と app を付ける（警報の元の系列を
      #   他の送り手が偽れないように）。順は「送り手が付けた同じ名の属性を消す → 送り元の Pod から付ける → 各点へ写す」。batch より前に置く
      #   （送り元の接続は batch の後では分からない）。Pod を引けなければ何も付けない（その系列は警報 OtlpSenderUnverified の元になる）。
      #   消す名前の正規表現の . は、どの 1 文字にも当てる（意図して）: k8s.x・k8s_x・k8s-x はどれも Prometheus の名前では k8s_x になり、
      #   印と同じ名前を送り手が作れないようにする（otlp.sender.* も同じ）。
      transform/otlp-sender-strip:
        error_mode: ignore
        metric_statements:
          - context: resource
            statements:
              - delete_matching_keys(attributes, "^k8s.")
          - context: datapoint
            statements:
              - delete_matching_keys(attributes, "^otlp.sender.")
      # 名前空間ごとに 1 つ（Role は名前空間ごと。クラスタ全体の Pod は読まない）。読むのは Pod の名前空間とラベル app だけ。
      k8sattributes/ast:
        auth_type: serviceAccount
        passthrough: false
        filter:
          namespace: ai-stock-trading
        pod_association:
          - sources:
              - from: connection
        extract:
          metadata: [k8s.namespace.name]
          labels:
            - { tag_name: k8s.pod.label.app, key: app, from: pod }
      k8sattributes/msp:
        auth_type: serviceAccount
        passthrough: false
        filter:
          namespace: microservices-platform
        pod_association:
          - sources:
              - from: connection
        extract:
          metadata: [k8s.namespace.name]
          labels:
            - { tag_name: k8s.pod.label.app, key: app, from: pod }
      transform/otlp-sender-identity:
        error_mode: ignore
        metric_statements:
          - context: datapoint
            statements:
              - set(attributes["otlp_sender_namespace"], resource.attributes["k8s.namespace.name"]) where resource.attributes["k8s.namespace.name"] != nil
              - set(attributes["otlp_sender_app"], resource.attributes["k8s.pod.label.app"]) where resource.attributes["k8s.pod.label.app"] != nil
    exporters:
      debug:
        verbosity: basic
    service:
      # 自身の計器の待ち受けは明示し、ほかの経路と揃える（collector の既定は版で変わる。check-collector-self-telemetry）。届く範囲は NetworkPolicy が絞る。
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          receivers: [otlp]
          processors: [memory_limiter, transform/otlp-sender-strip, k8sattributes/ast, k8sattributes/msp, transform/otlp-sender-identity, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: platform-infra
  labels: { app: otel-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      # IADR-0709 決定 5: 送り元の Pod を引く（k8sattributes）ための ServiceAccount。権限は名前空間 microservices-platform・ai-stock-trading の
      #   Pod の読みだけ（下の Role。ai-stock-trading の分は deploy/cloud/otlp-sender-identity-ast）。トークンは既定では載せず、期限 1 時間の明示の
      #   トークンを読み取り専用で載せる（既定の置き場。client-go が読み直す）。
      serviceAccountName: otel-collector
      automountServiceAccountToken: false
      # NFR-18, IADR-0697: 基盤の Pod の権限を最小にする。イメージの利用者（uid 10001）のまま root でなく、capability を全部落とし
      #   （受け口は 4317・4318・8888 で 1024 より上）、権限の昇格を許さず、ルートのファイルシステムは読み取り専用（書く物が無い）。
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile: { type: RuntimeDefault }
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.102.0@sha256:26bce721ca2f83db1c2c4e8873514dfe5b3973401fe88a1208efdc74e32840c1
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
          volumeMounts:
            - { name: config, mountPath: /etc/otelcol-contrib, readOnly: true }
            - { name: kube-api-access, mountPath: /var/run/secrets/kubernetes.io/serviceaccount, readOnly: true }
          resources:
            requests: { cpu: 20m, memory: 64Mi }
            limits: { cpu: 250m, memory: 256Mi }
      volumes:
        - name: config
          configMap: { name: otel-collector-config }
        - name: kube-api-access
          projected:
            defaultMode: 0440
            sources:
              - serviceAccountToken: { path: token, expirationSeconds: 3600 }
              - configMap: { name: kube-root-ca.crt, items: [{ key: ca.crt, path: ca.crt }] }
              - downwardAPI: { items: [{ path: namespace, fieldRef: { fieldPath: metadata.namespace } }] }
---
# IADR-0709 決定 5: collector が送り元の Pod（名前空間とラベル app）を引くための身元。読みだけ・名前空間ごと。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: otel-collector
  namespace: platform-infra
  labels: { app: otel-collector }
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-collector-pod-reader
  namespace: microservices-platform
  labels: { app: otel-collector }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-collector-pod-reader
  namespace: microservices-platform
  labels: { app: otel-collector }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-collector-pod-reader
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: platform-infra
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: platform-infra
  labels: { app: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
