# NFR-18, IADR-0674 (#2401): 共有 Postgres（取引ユニットの DB と、Keycloak の DB）。deploy/local/infra/postgres.yaml を写し、次を変えた:
#   - データは PVC（local-path）に置く（クラウドの単一ノード。ノードのディスクは暗号化した領域に置く。README）。
#   - 初期化は利用者名・パスワードを Secret から env で受け、psql の \getenv で読む（値を SQL・引数・ConfigMap に書かない）。
#   - MSP のサービスの DB と利用者は作らない（クラウドの MSP は LLM ゲートウェイだけで、DB を持たない）。
#   - 管理者の利用者名も Secret から読む（描画に資格情報の字面を置かない）。
# 取引ユニットの DB は src/ai-stock-trading/infra/postgres/init と同じ 7 つ（AST の chart の database と一致）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: platform-infra
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -euo pipefail
    : "${AST_DB_USER:?}" "${AST_DB_PASSWORD:?}" "${KEYCLOAK_DB_USER:?}" "${KEYCLOAK_DB_PASSWORD:?}"
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-'EOSQL'
      \getenv ast_user AST_DB_USER
      \getenv ast_password AST_DB_PASSWORD
      \getenv kc_user KEYCLOAK_DB_USER
      \getenv kc_password KEYCLOAK_DB_PASSWORD
      CREATE USER :"ast_user" WITH PASSWORD :'ast_password';
      CREATE DATABASE audit_svc OWNER :"ast_user";
      CREATE DATABASE configuration_svc OWNER :"ast_user";
      CREATE DATABASE cost_control_svc OWNER :"ast_user";
      CREATE DATABASE market_monitor_svc OWNER :"ast_user";
      CREATE DATABASE order_execution_svc OWNER :"ast_user";
      CREATE DATABASE report_svc OWNER :"ast_user";
      CREATE DATABASE risk_management_svc OWNER :"ast_user";
      CREATE USER :"kc_user" WITH PASSWORD :'kc_password';
      CREATE DATABASE keycloak OWNER :"kc_user";
    EOSQL
---
# 接続の受け入れ（pg_hba）。TCP は TLS（hostssl）だけを受け、平文の TCP（host・hostnossl）は書かない。
# クラウドには平文で繋ぐ利用者がいない（取引ユニット・Keycloak・バックアップとも TLS）。ソケット（local）は初期化と pg_isready が使う。
# 認証はどれも scram-sha-256（trust・password・md5 は書かない）。
# NFR-18, IADR-0706: 超利用者（名前は Secret postgres の username を読み取り専用で置いたファイル。@ で読む）の TCP は既定で拒む（reject）。
#   その手前の include_if_exists は Pod の中のメモリ（emptyDir）のファイルで、在る間だけ超利用者の TCP（TLS・scram）を受ける（ゲート）。
#   ゲートを開け閉めするのは superuser-tcp-gate.sh（オーナーの手元の deploy/cloud/db-users/ast-db-users.sh --live が Job の前後に呼ぶ）だけ。
#   Pod が作り直されれば閉じる（emptyDir）。バックアップは超利用者でなく、専用の利用者（Secret postgres-backup）で入る。
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: platform-infra
  labels: { app: postgres }
data:
  pg_hba.conf: |
    local   all  all                scram-sha-256
    include_if_exists /run/postgres-hba-gate/superuser-tcp.conf
    hostssl all  @/etc/postgres-superuser/username  0.0.0.0/0  reject
    hostssl all  @/etc/postgres-superuser/username  ::/0       reject
    hostssl all  all  0.0.0.0/0     scram-sha-256
    hostssl all  all  ::/0          scram-sha-256
  # NFR-18, IADR-0706: ゲートの開け閉め（Pod の中で uid 70 が走らせる。kubectl exec deploy/postgres -c postgres -- sh <この場所> open|close|status）。
  #   開けると超利用者の TCP（TLS・scram）の行をゲートのファイルへ書き、閉じると消す。どちらも pg_ctl reload で読み直させる（作り直さない）。
  #   開いている時間には上限がある（PG_HBA_GATE_TTL_S。既定 900 秒＝利用者を作る Job の上限 600 秒＋余裕）。開けるときに Pod の中で
  #   閉じ手を切り離して起こし（setsid）、上限を過ぎてもその回のゲートが残っていれば閉じる（入口との通信が切れて close を流せないときの備え）。
  #   回ごとの印（token）で、後から開け直したゲートを前の回の閉じ手が閉じない。Pod が作り直されればファイルは消えて閉じる（emptyDir）。
  #   値は扱わない（行に載るのは超利用者の名前のファイルのパスだけ）。
  superuser-tcp-gate.sh: |
    #!/bin/sh
    set -eu
    GATE="${PG_HBA_GATE:-/run/postgres-hba-gate/superuser-tcp.conf}"
    SU_FILE="${PG_SUPERUSER_FILE:-/etc/postgres-superuser/username}"
    TTL="${PG_HBA_GATE_TTL_S:-900}"
    case "$TTL" in '' | *[!0-9]*) echo "ERROR: PG_HBA_GATE_TTL_S は秒数" >&2; exit 2 ;; esac
    reload() { pg_ctl reload -s -D "$PGDATA"; sleep "${PG_HBA_GATE_SETTLE_S:-2}"; }
    case "${1:-}" in
      open)
        [ -s "$SU_FILE" ] || { echo "ERROR: 超利用者の名前のファイル（$SU_FILE）が無い" >&2; exit 1; }
        umask 077
        token="$(od -An -N8 -tx1 /dev/urandom | tr -d ' \n')"
        until_s=$(( $(date +%s) + TTL ))
        printf '# token=%s until=%s\nhostssl all @%s 0.0.0.0/0 scram-sha-256\nhostssl all @%s ::/0 scram-sha-256\n' "$token" "$until_s" "$SU_FILE" "$SU_FILE" > "$GATE.tmp"
        mv "$GATE.tmp" "$GATE"
        reload
        # 上限の閉じ手（exec の終わりで止まらないよう切り離す）。その回の印のまま残っていれば閉じる。
        setsid sh -c 'sleep "$1"; if grep -q "^# token=$2 " "$3" 2>/dev/null; then rm -f "$3"; pg_ctl reload -s -D "$PGDATA"; fi' \
          gate-closer "$TTL" "$token" "$GATE" </dev/null >/dev/null 2>&1 &
        echo "superuser-tcp: open（上限 ${TTL} 秒）"
        ;;
      close) rm -f "$GATE" "$GATE.tmp"; reload; echo "superuser-tcp: close" ;;
      status)
        if [ -e "$GATE" ]; then
          u="$(sed -n 's/^# token=[0-9a-f]* until=\([0-9]*\)$/\1/p' "$GATE" | head -n 1)"
          echo "superuser-tcp: open（残り $(( ${u:-0} - $(date +%s) )) 秒）"
        else
          echo "superuser-tcp: closed"
        fi
        ;;
      *) echo "ERROR: open・close・status のどれか" >&2; exit 2 ;;
    esac
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: platform-infra
  labels: { app: postgres }
spec:
  accessModes: [ReadWriteOnce]
  resources:
    requests: { storage: 10Gi }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: platform-infra
  labels: { app: postgres }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      automountServiceAccountToken: false
      # NFR-18, IADR-0697: 基盤の Pod の権限を最小にする。どのコンテナも root でなく（postgres＝uid 70）、capability を全部落とし
      #   （足すものは無い）、権限の昇格を許さず、seccomp は RuntimeDefault。名前空間の PSA は restricted（namespaces.yaml）。
      #   🔴 fsGroup は置かない。k3s の local-path の PVC にも fsGroup の所有の付け替えが効き（実測）、データの dir に group の
      #   書き込みと setgid が付くと Postgres は起動を拒む（0700 か 0750 だけを受ける）。鍵は initContainer が gid 0 で読んで写す。
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        seccompProfile: { type: RuntimeDefault }
      initContainers:
        # サーバ証明書（Secret postgres-tls。root の所有・0440）を、postgres（uid 70）の所有・鍵は 0600 の写しにする。
        #   Postgres は鍵が自分の所有なら 0600 以下でなければ起動しない。gid 0 は Secret の 0440 を読むためで、この initContainer だけが持つ
        #   （root の利用者でも capability でもない。所有の付け替え〔chown〕は要らない＝写した物は初めから uid 70 の所有）。
        - name: tls-files
          image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          command:
            - sh
            - -c
            - |
              set -e
              cp /tls-src/tls.crt /tls/tls.crt
              cp /tls-src/tls.key /tls/tls.key
              chmod 0644 /tls/tls.crt
              chmod 0600 /tls/tls.key
          securityContext:
            runAsUser: 70
            runAsGroup: 0
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities: { drop: [ALL] }
          volumeMounts:
            - { name: tls-src, mountPath: /tls-src, readOnly: true }
            - { name: tls, mountPath: /tls }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
            - -c
            - hba_file=/etc/postgres-hba/pg_hba.conf
          # IADR-0697: 公式のイメージの起動器は root でなく起きても動く（PGDATA の所有の付け替えをしない形で initdb・起動する）。
          #   既存のデータは前の起動器が uid 70 の所有にしてある。CHOWN・SETUID・SETGID・DAC_OVERRIDE は要らない（実測）。
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: [ALL] }
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: postgres, key: username } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: postgres, key: password } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: postgres, key: username } }
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
            - name: AST_DB_USER
              valueFrom: { secretKeyRef: { name: ast-db, key: username } }
            - name: AST_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: ast-db, key: password } }
            - name: KEYCLOAK_DB_USER
              valueFrom: { secretKeyRef: { name: keycloak-db, key: username } }
            - name: KEYCLOAK_DB_PASSWORD
              valueFrom: { secretKeyRef: { name: keycloak-db, key: password } }
          ports:
            - containerPort: 5432
          volumeMounts:
            - { name: data, mountPath: /var/lib/postgresql/data }
            - { name: init, mountPath: /docker-entrypoint-initdb.d }
            - { name: tls, mountPath: /etc/postgres-tls, readOnly: true }
            - { name: hba, mountPath: /etc/postgres-hba, readOnly: true }
            # NFR-18, IADR-0706: pg_hba が @ で読む超利用者の名前（username だけ。password は置かない）と、ゲートのファイルの置き場（メモリ）。
            - { name: superuser-name, mountPath: /etc/postgres-superuser, readOnly: true }
            - { name: hba-gate, mountPath: /run/postgres-hba-gate }
            # NFR-18, IADR-0706: 超利用者のパスワードの今の値（Secret postgres の password）。env は起動の時の値のままなので、作り直しを
            #   合わせる手順（deploy/cloud/db-users/superuser-password.sh。Pod の中・ソケット）が新しい値をここから読む。
            - { name: superuser-secret, mountPath: /etc/postgres-superuser-secret, readOnly: true }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U \"$POSTGRES_USER\""]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: postgres-data }
        - name: init
          configMap: { name: postgres-init, defaultMode: 0755 }
        - name: hba
          configMap: { name: postgres-hba, defaultMode: 0444 }
        # 名前だけを写す（Secret の password は Pod の env にだけ在る）。uid 70 が読めるよう 0444（名前は値ではない。描画には載らない）。
        - name: superuser-name
          secret:
            secretName: postgres
            defaultMode: 0444
            items:
              - { key: username, path: username }
        - name: hba-gate
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
        # 0444: uid 70 が読む（fsGroup は置けない。上の注記）。このコンテナの利用者は同じ値を既に env に持つので、読める者は広がらない。
        - name: superuser-secret
          secret:
            secretName: postgres
            defaultMode: 0444
            items:
              - { key: password, path: password }
        - name: tls-src
          secret: { secretName: postgres-tls, defaultMode: 0440 }
        - name: tls
          emptyDir: { medium: Memory, sizeLimit: 1Mi }
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform-infra
  labels: { app: postgres }
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
