# ADR-0008 / IADR-0017 / IADR-0026: Secret ブートストラップ（テンプレート）
#
# ⚠️ 実値をコミットしないこと。このファイルはプレースホルダのみを含むテンプレートである。
#    実 Secret は運用者が deploy/bootstrap/README.md の手順で作成する（Git には載せない）。
#    暫定期のシークレット管理は k8s Secret / 環境変数（ローテーション機構なし）。
#    恒久フェーズでは Sealed Secrets / External Secrets / Vault の導入を検討する。
---
# Wiki.js DB パスワード（values: wikijs.db.existingSecret=wikijs-db, passwordKey=password）
apiVersion: v1
kind: Secret
metadata:
  name: wikijs-db
  namespace: microservices-platform
type: Opaque
stringData:
  password: CHANGE_ME
---
# WikiService → Wiki.js 同期用サービスアカウント API キー（values: wiki.extraEnv WikiJs__ApiKey）
apiVersion: v1
kind: Secret
metadata:
  name: wikijs-sync
  namespace: microservices-platform
type: Opaque
stringData:
  apiKey: CHANGE_ME
---
# LLM Gateway の外部 LLM プロバイダ資格情報（ADR-0010 / IADR-0007 のルーティング先ごと）
apiVersion: v1
kind: Secret
metadata:
  name: llm-provider-credentials
  namespace: microservices-platform
type: Opaque
stringData:
  # プロバイダ別 API キー。使用するルートに応じて設定する。
  anthropic-api-key: CHANGE_ME
  openai-api-key: CHANGE_ME
  # 埋め込み（Voyage AI）。LLM ゲートウェイの Embedding__Voyage__ApiKey へ渡る（#1764。未設定でも起動する＝埋め込みは失敗し索引に入らない）。
  voyage-api-key: CHANGE_ME
