# ADR-0006: Prometheus — metrics backend
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# NFR (#198): SLO ベースのアラートルール。障害検出 5 分以内・MTTR 30 分以内。
rule_files:
  - /etc/prometheus/alerts.yml

# NFR (#198), #546: 通知経路。Alertmanager 本体は deploy/alertmanager/alertmanager.yml が設定を持つ。
# ★ 到達先は在るが、**既定の受信先はどこへも送らない**（同ファイル冒頭の限界の記述）。
#   実環境でメール / チャットの受信先を足すまで、自動で届くのは Alertmanager の画面までである。
alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
