# ADR-0006: Prometheus — metrics backend
global:
  scrape_interval: 15s
  evaluation_interval: 15s

# NFR (#198): SLO ベースのアラートルール。障害検出 5 分以内・MTTR 30 分以内。
rule_files:
  - /etc/prometheus/alerts.yml

# NFR (#198): 通知経路。Alertmanager 経由でメール/チャットへ通知する。
# Alertmanager 本体（受信先・ルーティング・抑制）は運用環境ごとに配備・設定する（docs/operations/operations.md）。
# 未配備でもルール評価は行われ、Prometheus UI / Grafana から発火状況を確認できる。
alerting:
  alertmanagers:
    - static_configs:
        - targets: []  # 例: ['alertmanager:9093']（配備後に設定）

scrape_configs:
  - job_name: otel-collector
    static_configs:
      - targets: ['otel-collector:8888']
