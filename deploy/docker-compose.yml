# ADR-0001, ADR-0002, ADR-0003（Superseded by ADR-0027・注記は #580）, ADR-0004, ADR-0006, ADR-0009
# ローカル開発環境 — インフラ全体 + 全サービスコンテナ
# 起動: docker compose -f deploy/docker-compose.yml up -d
#
# IADR-0017 / #62: mesh(mTLS, ADR-0005) 導入までのサービス間認証は「ネットワーク分離」を第一防御とする。
# 内部サービス API は無認証で到達可能なため host へは公開せず `expose`（コンテナネットワーク内のみ）とする。
# 外部からの入口は BFF（エッジ、5000）に一本化し、BFF が Keycloak JWT で認証する。
# インフラ系（postgres/rabbitmq/keycloak/qdrant/grafana 等）の公開ポートは開発利便のため維持するが、
# 共有・ステージング・本番では公開しない（docs/security/security.md 参照）。

x-common-env: &common-env
  OTLP__ENDPOINT: http://otel-collector:4317
  Auth__Authority: http://keycloak:8080/realms/platform

x-db-env: &db-env
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Username=kp;Password=kp

x-rabbit-env: &rabbit-env
  RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672

# FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: 本文・資産の S3 互換オブジェクトストレージ（MinIO）接続。
# 資格情報は .env（MINIO_ROOT_USER / MINIO_ROOT_PASSWORD）で上書きする（コミットしない。dev 既定のみ）。
x-objectstorage-env: &objectstorage-env
  ObjectStorage__Endpoint: http://minio:9000
  ObjectStorage__AccessKey: ${MINIO_ROOT_USER:-minioadmin}
  ObjectStorage__SecretKey: ${MINIO_ROOT_PASSWORD:-minioadmin}
  ObjectStorage__Bucket: knowledge-normalized

services:
  # ─────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    # ADR-0004, FR-13/UC-07, IADR-0020: realm `platform` を import して起動する。
    # wiki-js クライアント（OIDC）と ABAC 属性クレーム（clearance/department/groups）を含む。
    command: ["start-dev", "--import-realm"]
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      # Issue #88 稼働 PoC: issuer をリクエストホストで揺らさず http://localhost:8080 に固定する。
      # 固定しないと、ブラウザ経路（localhost）で発行されたトークンの iss と、コンテナ内経路
      # （keycloak:8080）の userinfo/JWT 検証が食い違い、Wiki.js の OIDC ログインが失敗する。
      KC_HOSTNAME_URL: http://localhost:8080
      # Issue #118 監査: /health/ready は既定で無効のため有効化する（下記 healthcheck が参照）。
      KC_HEALTH_ENABLED: "true"
      # Issue #282, IADR-0079: 共有 Postgres を外部 DB として利用し、runtime state（ユーザー・
      # シークレット・セッション等）を永続化する。start-dev を維持したまま KC_DB で H2 を上書きする。
      # DB は create-multiple-dbs.sh が作成する `keycloak`（所有者 kp）。wiki-js と同じ kp/kp を流用。
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: kp
      KC_DB_PASSWORD: kp
    volumes:
      - ./keycloak/microservices-platform-realm.json:/opt/keycloak/data/import/microservices-platform-realm.json:ro
    ports:
      - "8080:8080"
    # Issue #118 監査: Keycloak 24 イメージは curl/wget 非搭載で curl 検査は常に unhealthy になる
    # （実測）。/dev/tcp は bash 固有機能のため、qdrant と同様シェルを bash に明示する
    # （CMD-SHELL の暗黙 /bin/sh 解決に依存しない）。bash で /health/ready を検査する。
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 30s
      timeout: 10s
      retries: 5
    # Issue #282, IADR-0079: 外部 DB 化に伴い、Postgres 準備完了後に起動する（wiki-js と同型）。
    depends_on:
      postgres:
        condition: service_healthy

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    # Issue #118 監査: qdrant イメージは curl 非搭載（/bin/sh は dash）で curl 検査は常に
    # unhealthy になる（実測）。bash の /dev/tcp で /healthz を検査する。
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '200 OK' <&3"]
      interval: 10s
      timeout: 5s
      retries: 5

  # FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: 本文・資産の S3 互換オブジェクトストレージ（MinIO）。
  # 資格情報は .env（MINIO_ROOT_USER / MINIO_ROOT_PASSWORD）で上書きする（コミットしない。dev 既定のみ）。
  # IADR-0017/IADR-0024: API(9000) は内部サービス専用のため host 公開しない（expose）。直接公開はせず、
  # ABAC を強制するサービス経由で読み取る。dev 便宜でコンソール(9001)のみ host 公開（stg/prod では公開しない）。
  minio:
    image: minio/minio:RELEASE.2025-04-08T15-41-24Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    expose:
      - "9000"
    ports:
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - prometheus
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.52.0
    # IADR-0210 (#787): 保持期間を args で明示する。経路B（deploy/local/observability/prometheus.yaml）と
    # **同じ 2 引数**を置く —— 現状は両方とも retention 無指定で対称であり、片方だけ入れると新たな
    # パリティ差を作るため。size(4GB) は経路B の PVC 容量(5Gi) 未満に取り、満杯→書き込み不能を形で塞ぐ。
    command:
      [
        "--config.file=/etc/prometheus/prometheus.yml",
        "--web.enable-remote-write-receiver",
        "--storage.tsdb.retention.time=7d",
        "--storage.tsdb.retention.size=4GB",
      ]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      # NFR (#198): SLO アラートルール（rule_files で参照）。
      - ./prometheus/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/config.yaml"]
    # Issue #282, IADR-0079: 空の名前付きボリュームは root 所有で生成されるため、非 root イメージ
    # （uid 10001）でも storage パス配下に index/chunks を作成できるよう root 実行にする（image-user 非依存）。
    user: "0:0"
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
      # Issue #282, IADR-0079: loki-config.yaml の path_prefix(/tmp/loki) と整合させて永続化する。
      - loki-data:/tmp/loki
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/config.yaml"]
    # Issue #282, IADR-0079: loki と同理由。空の名前付きボリューム（root 所有）へ blocks/wal を書けるよう root 実行。
    user: "0:0"
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
      # Issue #282, IADR-0079: tempo.yaml の storage local.path(/tmp/tempo/blocks)・wal.path(/tmp/tempo/wal) の親と整合。
      - tempo-data:/tmp/tempo
    ports:
      - "3200:3200"
      - "4327:4317"

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  # ─────────────────────────────────────────────
  # Application Services
  # ─────────────────────────────────────────────
  document-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/DocumentService/src/DocumentService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（コンテナネットワーク内のみ）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env, *rabbit-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=document_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  datasource-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/DataSourceService/src/DataSourceService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（コンテナネットワーク内のみ）
    expose:
      - "8080"
    environment:
      # FR-01, IADR-0051: 実コネクタが取得した原本を MinIO へ格納する（書き込み側）。未設定時は縮退。
      <<: [*common-env, *db-env, *rabbit-env, *objectstorage-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=datasource_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  conversion-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/ConversionService/src/ConversionService.Worker/Dockerfile
    # FR-15, IADR-0029, IADR-0017: 自己申告（/internal/introspection）用の最小 HTTP サーフェス。
    # host へは公開せずメッシュ内部限定（ingress 非公開）。
    expose:
      - "8080"
    environment:
      # FR-12, ADR-0015: 正規化本文・資産を MinIO へ保管する（書き込み側）。
      <<: [*common-env, *db-env, *rabbit-env, *objectstorage-env]
      # FR-12, UC-06, SC-07, IADR-0043: 変換ジョブ読み取りモデルの永続化（conversion_svc）。
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=conversion_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  ingestion-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/IngestionService/src/IngestionService.Worker/Dockerfile
    # FR-15, IADR-0029, IADR-0017: 自己申告（/internal/introspection）用の最小 HTTP サーフェス。
    # host へは公開せずメッシュ内部限定（ingress 非公開）。
    expose:
      - "8080"
    environment:
      # FR-06: storage:// 本文を MinIO から実取得する（読み取り側）。
      <<: [*common-env, *rabbit-env, *objectstorage-env]
      Qdrant__Host: qdrant
      Qdrant__Port: 6334
      Services__LlmGateway: http://llm-gateway:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      minio:
        condition: service_healthy
      llm-gateway:
        condition: service_started

  retrieval-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/RetrievalService/src/RetrievalService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（/search の ABAC は #55 で別管理）
    expose:
      - "8080"
    environment:
      <<: *common-env
      Qdrant__Host: qdrant
      Qdrant__Port: 6334
      Services__LlmGateway: http://llm-gateway:8080
    depends_on:
      qdrant:
        condition: service_healthy
      llm-gateway:
        condition: service_started

  aianalysis-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/AiAnalysisService/src/AiAnalysisService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（コンテナネットワーク内のみ）
    expose:
      - "8080"
    environment:
      <<: *common-env
      Services__AuthorizationService: http://authorization-service:8080
      Services__RetrievalService: http://retrieval-service:8080
      Services__LlmGateway: http://llm-gateway:8080
    depends_on:
      - authorization-service
      - retrieval-service
      - llm-gateway

  authorization-service:
    build:
      context: ..
      dockerfile: src/platform/backend/Services/AuthorizationService/src/AuthorizationService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（/authz/scope 等はサービス間呼び出し専用）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=authz_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy

  # FR-13, UC-07, ADR-0011, IADR-0020: 閲覧・編集の実体は Wiki.js（下記 wiki-js）に委譲する。
  # WikiService は「同期・統合・ABAC ゲートウェイ」に責務を縮退する（IADR-0020 が IADR-0013 を Supersede）。
  # ABAC は本システムが単一の真実源。WikiService が Wiki.js 前段で deny-by-default の属性フィルタと
  # 404 存在秘匿（IADR-0009）を強制する。同期方式は GraphQL API push（IADR-0021）。
  # 段2（同期コード置換・認可プロキシ化・wiki_svc 縮退）は実装済み。残る稼働検証（OIDC ローカルログイン
  # 無効化・GraphQL スキーマ整合の PoC・API キー投入）は運用時タスク（docs/operations・IADR-0021 フォロー）。
  wiki-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/WikiService/src/WikiService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（コンテナネットワーク内のみ）
    expose:
      - "8080"
    environment:
      # FR-06: storage:// 本文を MinIO から実取得し Wiki.js へ push する（読み取り側）。
      <<: [*common-env, *db-env, *rabbit-env, *objectstorage-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=wiki_svc;Username=kp;Password=kp
      # IADR-0021: Wiki.js への同期先（GraphQL push）。API キーはシークレット経由で注入（コミットしない）。
      Services__WikiJs: http://wiki-js:3000
      # FR-05 / IADR-0089 / #958: ABAC の許可スコープ解決（POST /authz/scope）の宛先。
      # コード既定は :5005 だが authorization-service が開けているのは 8080 だけである。
      Services__AuthorizationService: http://authorization-service:8080
      WikiJs__GraphQlEndpoint: http://wiki-js:3000/graphql
      WikiJs__ApiKey: ${WIKIJS_API_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      minio:
        condition: service_healthy

  # FR-13, UC-07, ADR-0011, IADR-0020: 閲覧・編集 UI の実体。専用 DB `wikijs`（Postgres）で永続化する。
  # 認証は Keycloak(OIDC)。ローカルログインは Wiki.js 管理側で無効化し OIDC 単一経路にする（運用仕様参照）。
  # IADR-0020/IADR-0032 (#124): Wiki.js 直接到達は ABAC ゲートウェイ（WikiService）を迂回する経路。
  #   - dev（この compose）: 管理 UI セットアップの便宜のため host 公開（3001）を残す（IADR-0032 が
  #     IADR-0026 §2「compose は BFF のみ host 公開」を dev 便宜の範囲で改定）。
  #   - 本番系（Helm）: `wikijs.ingress.enabled: false` で公開しない（ClusterIP 限定）。
  # 「本番系構成では 3001 が公開されない」ことは NetworkIsolationTests が回帰ガードする。
  # 注: docker compose の profiles はサービスの起動有無しか制御できず、常時稼働の wiki-js の個別ポート
  # 公開だけを条件化できないため、dev/本番系の公開境界は「dev＝compose／本番系＝Helm」で表現する。
  wiki-js:
    # IADR-0088 (#320): 再現性のため浮動 major タグ `2` を実運用版 `2.5` へ固定する（再デプロイ安全性）。
    image: ghcr.io/requarks/wiki:2.5
    environment:
      DB_TYPE: postgres
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_USER: kp
      DB_PASS: kp
      DB_NAME: wikijs
    # dev 便宜: 管理 UI（http://localhost:3001）へ直接アクセスするため host 公開する（本番系は Helm で非公開）。
    ports:
      - "3001:3000"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/healthz',r=>process.exit(r.statusCode===200?0:1)).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 10
    depends_on:
      postgres:
        condition: service_healthy
      keycloak:
        condition: service_started

  llm-gateway:
    build:
      context: ..
      dockerfile: src/platform/backend/Services/LlmGateway/src/LlmGateway.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（/complete・/embed はサービス間呼び出し専用）
    expose:
      - "8080"
    environment:
      <<: *common-env
      Llm__ApiKey: ${ANTHROPIC_API_KEY:-}
      # ADR-0010 / ADR-0025 / IADR-0022 / IADR-0101: 既定は claude-opus-5
      # （定型 sonnet・haiku は用途別ルーティング）
      # ADR-0038 / #850: 最難関 analysis も claude-opus-5。claude-fable-5 は非 ZDR のため
      # 基盤のいかなる用途でも用いず、利用許可集合（Models）からも外した。
      Llm__Model: claude-opus-5
      # FR-02 / ADR-0016 / IADR-0025: 埋め込み。既定はティアB=Voyage（voyage-3.5/1024次元）。
      # 契約時にゼロ保持（学習利用オプトアウト）を設定してから本番データを流す（運用仕様書 参照）。
      Embedding__Voyage__ApiKey: ${VOYAGE_API_KEY:-}
      # ADR-0017 / IADR-0025: 高機密（confidential/restricted）はティアA=セルフホスト（Ruri v3/768次元）固定。
      # URL 未設定時は fail-closed（高機密は索引せず外部へも送らない）。基盤構築後に設定して有効化する。
      Embedding__SelfHosted__BaseUrl: ${SELFHOSTED_EMBEDDING_URL:-}
      # ⚠️ Issue #98: この上書きは appsettings.json の Embedding:Routing:Endpoints 配列で selfhosted が
      # index 1（voyage が index 0）である前提。エンドポイントの追加・並び替え時はインデックスを見直すこと。
      # 取り違え（例: 誤って Voyage を無効化）は LlmGateway 起動時バリデーション
      # （EmbeddingRoutingOptionsValidator / ValidateOnStart）が fail-fast で検知し、起動に失敗する。
      Embedding__Routing__Endpoints__1__Enabled: ${SELFHOSTED_EMBEDDING_ENABLED:-false}
    depends_on:
      - otel-collector

  # FR-02, FR-03, ADR-0017, IADR-0025, IADR-0085 (#303): セルフホスト埋め込み推論基盤（Ruri v3 / 768 次元）。
  # 高機密（confidential/restricted）はティアA=セルフホスト固定。この基盤が未起動の間は fail-closed（高機密は
  # 索引されない）。案 A のインフラを opt-in で用意する。profiles: ["embedding"] のため既定オフ（`docker compose
  # --profile embedding up` でのみ起動）。build を持たない pull イメージ＝#275／images.yml いずれの検査対象外。
  # 有効化手順: プロファイルを有効化し、llm-gateway へ SELFHOSTED_EMBEDDING_URL=http://embedding:80 と
  #   SELFHOSTED_EMBEDDING_ENABLED=true を .env で与える。
  # ⚠️ 実モデル取得・実埋め込み疎通・nDCG@10 実測は稼働環境依存＝分離（IADR-0085 / #303）。
  # 既定 image tag / モデル ID はプレースホルダ。実運用前に固定する。
  embedding:
    profiles: ["embedding"]
    # TEI（OpenAI 互換 /v1/embeddings）。vLLM 等へ差し替える場合は image/command を上書きする。
    image: ghcr.io/huggingface/text-embeddings-inference:cpu-1.5
    command: ["--model-id", "cl-nagoya/ruri-v3-310m"]
    # 内部 API のため host 公開しない（llm-gateway からサービス間呼び出し）。
    expose:
      - "80"

  # FR-08, UC-01: 回答へのフィードバック（👍/👎・コメント）収集サービス
  feedback-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/FeedbackService/src/FeedbackService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（BFF 経由で到達）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=feedback_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy

  # FR-10, UC-05: 利用状況・検索傾向・回答品質を可視化するダッシュボードサービス
  dashboard-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/DashboardService/src/DashboardService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（BFF 経由で到達）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=dashboard_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy

  # FR-17, UC-10, ADR-0033/ADR-0034 (#908/#957): 知識グラフ（ノード・辺・辺の型辞書）。
  # BFF の /bff/graph/* が http://graph-service:8080 を呼ぶ（#916a）。
  graph-service:
    build:
      context: ..
      dockerfile: src/knowledge/backend/Services/GraphService/src/GraphService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（BFF 経由で到達）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=graph_svc;Username=kp;Password=kp
      # 🔴 IADR-0089 (#342) / #958: ABAC スコープ解決先。appsettings 既定は :5005（ローカル用）で、
      # ここで上書きしないと不達 → GraphAccessResolver が Granted=false へ縮退し、
      # **グラフが常に空になる**（エラーにならないので気付けない）。
      Services__AuthorizationService: http://authorization-service:8080
    depends_on:
      postgres:
        condition: service_healthy

  # Issue #283, AST/FR-17, AST/UC-06, IADR-0070: AST 設定画面（全体前提条件）の BFF 先＝ConfigurationService。
  # AST は全サービスホスト（pin 91d52c2 時点で 11 件）で共有する単一のパラメータ化 Dockerfile
  # （backend/Dockerfile＋build args）を持ち、ビルド context は AST ユニットルート
  # （../src/ai-stock-trading）である（AST/IADR-0048 決定3）。
  # k8s-local-images.sh の MAPPING と #275 ドリフト検査は context/args も突合する（IADR-0070）。
  # そのため SERVICE_PROJECT / SERVICE_DLL は MAPPING と必ず同時に・同値で動かす。
  # Issue #570: AST はホストプロジェクトを *.Worker → *.Api へ一斉改名した（AST/IADR-0128。ホストと
  # 技術詳細の分離で *.Infrastructure を新設）。#564 の pin bump（655e2ed → 91d52c2）で旧名が実在しなく
  # なり restore が MSB1009 で落ちていた。実行時の契約（Web SDK・:8080・/health/live・/health/ready・
  # アセンブリ名＝csproj 名）は改名前後で同一のため、追随したのは名前だけである。
  # IADR-0017: 内部 API のため host 公開しない（BFF 経由で到達）。
  configuration-service:
    build:
      context: ../src/ai-stock-trading
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/ConfigurationService/src/ConfigurationService.Api/ConfigurationService.Api.csproj
        SERVICE_DLL: ConfigurationService.Api.dll
    expose:
      - "8080"
    environment:
      # Auth__Authority は共通（MSP realm）。trading-owner ロールは MSP realm 側で定義する（2e）。
      <<: [*common-env, *db-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=configuration_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy

  # Issue #287, FR-14, IADR-0071: AST リスク設定（AST/SC-02）・統制状態参照（AST/SC-03）の BFF 先＝RiskManagementService。
  # ConfigurationService と同型（単一 Dockerfile＋build args＋AST ユニットルート context）だが、RiskManagementService は
  # 専用 DB（risk_management_svc）に加え RabbitMQ（MassTransit）を使うため *rabbit-env と rabbitmq 依存を併用する。
  # Issue #570: configuration-service と同じく *.Worker → *.Api 改名へ追随した（AST/IADR-0128）。
  # IADR-0017: 内部 API のため host 公開しない（BFF 経由で到達）。
  risk-management-service:
    build:
      context: ../src/ai-stock-trading
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/RiskManagementService/src/RiskManagementService.Api/RiskManagementService.Api.csproj
        SERVICE_DLL: RiskManagementService.Api.dll
    expose:
      - "8080"
    environment:
      # Auth__Authority は共通（MSP realm）。trading-owner ロールは MSP realm 側で定義済み（#283 2e）。
      <<: [*common-env, *db-env, *rabbit-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=risk_management_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  # Issue #288, FR-14, IADR-0072: AST 監視銘柄（AST/SC-02 watchlist）の BFF 先＝MarketMonitorService。
  # RiskManagementService と同型（単一 Dockerfile＋build args＋AST ユニットルート context）。MarketMonitorService は
  # 専用 DB（market_monitor_svc）に加え RabbitMQ（MassTransit：TradeDecisionMade 購読／監視イベント発行）を使うため
  # *rabbit-env と rabbitmq 依存を併用する。
  # Issue #570: configuration-service と同じく *.Worker → *.Api 改名へ追随した（AST/IADR-0128）。
  # IADR-0017: 内部 API のため host 公開しない（BFF 経由で到達）。
  market-monitor-service:
    build:
      context: ../src/ai-stock-trading
      dockerfile: backend/Dockerfile
      args:
        SERVICE_PROJECT: backend/Services/MarketMonitorService/src/MarketMonitorService.Api/MarketMonitorService.Api.csproj
        SERVICE_DLL: MarketMonitorService.Api.dll
    expose:
      - "8080"
    environment:
      # Auth__Authority は共通（MSP realm）。trading-owner ロールは MSP realm 側で定義済み（#283 2e）。
      <<: [*common-env, *db-env, *rabbit-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=market_monitor_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  bff:
    build:
      context: ..
      dockerfile: src/platform/backend/Bff/Platform.Bff/Dockerfile
    ports:
      - "5000:8080"
    environment:
      <<: *common-env
      Redis__ConnectionString: redis:6379
      # FR-15, IADR-0029, #146: 宣言（正の pipeline.json）を BFF にマウントし、ドリフト検出の突合基準にする。
      # これが無いと BFF の宣言が空になり、実効の全購読が UndeclaredSubscription と誤判定される（#118 監査）。
      Pipeline__ConfigPath: /etc/microservices-platform/pipeline/pipeline.json
      # FR-15, IADR-0029 (#144): 構成バージョン。dev は compose 起動時に環境変数で実 Git コミット ID を渡す。
      #   GIT_COMMIT=$(git rev-parse --short HEAD) docker compose -f deploy/docker-compose.yml up -d
      # 未設定時は dev-local にフォールバック（実適用リビジョンではないダミー）。
      # scripts/compose-up.sh が GIT_COMMIT / GIT_COMMIT_DATE を自動注入する。k8s は ArgoCD/CD が上書きする。
      Config__GitCommit: ${GIT_COMMIT:-dev-local}
      Config__AppliedAt: ${GIT_COMMIT_DATE:-}
      Config__AppliedBy: ${GIT_COMMIT_BY:-compose}
      Services__RetrievalService: http://retrieval-service:8080
      Services__AiAnalysisService: http://aianalysis-service:8080
      Services__FeedbackService: http://feedback-service:8080
      Services__DashboardService: http://dashboard-service:8080
      # FR-01/FR-02/FR-06, UC-04, SC-03/SC-06, IADR-0089 (#342): BFF の下流集約先のうち、コード既定が
      # ローカル用ポート（5002/5001/5005）のままで compose の実コンテナポート（:8080）へ未上書きだったもの。
      # 上書きが無いと BFF は :5002/:5001/:5005 を叩き、コンテナは :8080 のみ listen のため到達失敗
      # （datasource は live k8s でも同型の欠落で 502 化＝#342 の主因。document/authorization は compose のみ欠落）。
      Services__DataSourceService: http://datasource-service:8080
      Services__DocumentService: http://document-service:8080
      Services__AuthorizationService: http://authorization-service:8080
      # FR-15, IADR-0029, Issue #118 監査: 構成情報 API の自己申告収集先。appsettings 既定は
      # ローカル実行用ポート（5001/5006）のため、コンテナ実態（8080）をここで上書きする。
      # 上書きが無いと実効構成の集約が常に到達失敗し、ドリフト検出が Unverifiable に縮退する。
      Introspection__Services__document-service: http://document-service:8080
      Introspection__Services__wiki-service: http://wiki-service:8080
      # FR-15, IADR-0029 フォローアップ 1 (#142): conversion/ingestion ワーカーも最小 HTTP サーフェスで
      # 自己申告するようになったため収集先に追加。これで convert/ingest 段が Unverifiable でなくなる。
      Introspection__Services__conversion-service: http://conversion-service:8080
      Introspection__Services__ingestion-service: http://ingestion-service:8080
      # FR-15, IADR-0029 フォローアップ 2 (#143): 全 HTTP サービスへ introspection を横展開したため
      # 収集先へ追加。実効構成が全サービスの段・ポート選択を網羅する。
      Introspection__Services__retrieval-service: http://retrieval-service:8080
      Introspection__Services__aianalysis-service: http://aianalysis-service:8080
      Introspection__Services__authorization-service: http://authorization-service:8080
      Introspection__Services__dashboard-service: http://dashboard-service:8080
      Introspection__Services__datasource-service: http://datasource-service:8080
      Introspection__Services__feedback-service: http://feedback-service:8080
      Introspection__Services__llm-gateway: http://llm-gateway:8080
    # FR-15, #146: 正の pipeline.json をそのまま読み取り専用でマウントする（複製しない・単一の真実源）。
    # ローダは生の pipeline.json を "Pipeline" セクションへ包んで読む（PipelineExtensions）。
    volumes:
      - ./helm/microservices-platform/files/pipeline.json:/etc/microservices-platform/pipeline/pipeline.json:ro
    depends_on:
      redis:
        condition: service_healthy
      feedback-service:
        condition: service_started
      dashboard-service:
        condition: service_started

  # Issue #126: フロントエンド SPA（SC-01..11 の基盤）。nginx が静的配信＋/bff を BFF へプロキシする。
  # 実行時 config（config.js）を環境変数から生成し、接続先を注入する（環境非依存ビルド）。
  # エッジ（ブラウザからの入口）として host 公開する（BFF と並ぶ dev のフロント入口）。
  frontend:
    build:
      context: ..
      dockerfile: src/platform/frontend/Dockerfile
    ports:
      - "3100:8080"
    environment:
      # nginx の /bff プロキシ上流（compose の BFF）。
      BFF_UPSTREAM: http://bff:8080
      # 実行時 config（ブラウザ経路）。BFF は同一オリジンの /bff（nginx プロキシ）、Keycloak は host の 8080。
      BFF_BASE_URL: /bff
      OIDC_AUTHORITY: http://localhost:8080/realms/platform
      OIDC_CLIENT_ID: platform-spa
      # Issue #136 / SC-10: 運用ダッシュボードの外部ツール導線。dev は既に host 公開済みの Grafana(3000) を
      # 注入し、compose 上で「詳細ツール」導線を目視確認できるようにする。Jaeger/Kiali は dev 未配備のため
      # 未設定（空文字）＝画面に導線を出さない（config.js.template / 40-render-config.sh の既定に追随）。
      GRAFANA_URL: http://localhost:3000
    depends_on:
      bff:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  qdrant-data:
  minio-data:
  prometheus-data:
  grafana-data:
  # Issue #282, IADR-0079: 可観測性スタックの永続化（prometheus/grafana と対称化）。
  loki-data:
  tempo-data:
