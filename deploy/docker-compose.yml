# ADR-0001, ADR-0002, ADR-0003, ADR-0004, ADR-0006, ADR-0009
# ローカル開発環境 — インフラ全体 + 全サービスコンテナ
# 起動: docker compose -f deploy/docker-compose.yml up -d
#
# IADR-0017 / #62: mesh(mTLS, ADR-0005) 導入までのサービス間認証は「ネットワーク分離」を第一防御とする。
# 内部サービス API は無認証で到達可能なため host へは公開せず `expose`（コンテナネットワーク内のみ）とする。
# 外部からの入口は BFF（エッジ、5000）に一本化し、BFF が Keycloak JWT で認証する。
# インフラ系（postgres/rabbitmq/keycloak/qdrant/grafana 等）の公開ポートは開発利便のため維持するが、
# 共有・ステージング・本番では公開しない（docs/security/security.md 参照）。

x-common-env: &common-env
  OTLP__ENDPOINT: http://otel-collector:4317
  Auth__Authority: http://keycloak:8080/realms/knowledge-platform

x-db-env: &db-env
  ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Username=kp;Password=kp

x-rabbit-env: &rabbit-env
  RabbitMq__ConnectionString: amqp://guest:guest@rabbitmq:5672

services:
  # ─────────────────────────────────────────────
  # Infrastructure
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./create-multiple-dbs.sh:/docker-entrypoint-initdb.d/create-multiple-dbs.sh:ro
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  keycloak:
    image: quay.io/keycloak/keycloak:24.0
    command: start-dev
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8080/health/ready || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5

  qdrant:
    image: qdrant/qdrant:v1.9.2
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:6333/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.102.0
    command: ["--config=/etc/otelcol-contrib/config.yaml"]
    volumes:
      - ./otel-collector-config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "4317:4317"
      - "4318:4318"
      - "8888:8888"
    depends_on:
      - prometheus
      - tempo
      - loki

  prometheus:
    image: prom/prometheus:v2.52.0
    command: ["--config.file=/etc/prometheus/prometheus.yml", "--web.enable-remote-write-receiver"]
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "9090:9090"

  loki:
    image: grafana/loki:3.0.0
    command: ["-config.file=/etc/loki/config.yaml"]
    volumes:
      - ./loki-config.yaml:/etc/loki/config.yaml:ro
    ports:
      - "3100:3100"

  tempo:
    image: grafana/tempo:2.5.0
    command: ["-config.file=/etc/tempo/config.yaml"]
    volumes:
      - ./tempo.yaml:/etc/tempo/config.yaml:ro
    ports:
      - "3200:3200"
      - "4327:4317"

  grafana:
    image: grafana/grafana:11.0.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Admin
    ports:
      - "3000:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - prometheus
      - loki
      - tempo

  # ─────────────────────────────────────────────
  # Application Services
  # ─────────────────────────────────────────────
  document-service:
    build:
      context: ..
      dockerfile: src/Services/DocumentService/src/DocumentService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（コンテナネットワーク内のみ）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env, *rabbit-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=document_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  datasource-service:
    build:
      context: ..
      dockerfile: src/Services/DataSourceService/src/DataSourceService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（コンテナネットワーク内のみ）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env, *rabbit-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=datasource_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  conversion-service:
    build:
      context: ..
      dockerfile: src/Services/ConversionService/src/ConversionService.Worker/Dockerfile
    environment:
      <<: [*common-env, *rabbit-env]
    depends_on:
      rabbitmq:
        condition: service_healthy

  ingestion-service:
    build:
      context: ..
      dockerfile: src/Services/IngestionService/src/IngestionService.Worker/Dockerfile
    environment:
      <<: [*common-env, *rabbit-env]
      Qdrant__Host: qdrant
      Qdrant__Port: 6334
      Services__LlmGateway: http://llm-gateway:8080
    depends_on:
      rabbitmq:
        condition: service_healthy
      qdrant:
        condition: service_healthy
      llm-gateway:
        condition: service_started

  retrieval-service:
    build:
      context: ..
      dockerfile: src/Services/RetrievalService/src/RetrievalService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（/search の ABAC は #55 で別管理）
    expose:
      - "8080"
    environment:
      <<: *common-env
      Qdrant__Host: qdrant
      Qdrant__Port: 6334
      Services__LlmGateway: http://llm-gateway:8080
    depends_on:
      qdrant:
        condition: service_healthy
      llm-gateway:
        condition: service_started

  aianalysis-service:
    build:
      context: ..
      dockerfile: src/Services/AiAnalysisService/src/AiAnalysisService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（コンテナネットワーク内のみ）
    expose:
      - "8080"
    environment:
      <<: *common-env
      Services__AuthorizationService: http://authorization-service:8080
      Services__RetrievalService: http://retrieval-service:8080
      Services__LlmGateway: http://llm-gateway:8080
    depends_on:
      - authorization-service
      - retrieval-service
      - llm-gateway

  authorization-service:
    build:
      context: ..
      dockerfile: src/Services/AuthorizationService/src/AuthorizationService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（/authz/scope 等はサービス間呼び出し専用）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=authz_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy

  # FR-13, UC-07, IADR-0013: Wiki 閲覧は WikiService の自前軽量読み取り API で提供する。
  # 外部 OSS の Wiki.js は意図的に配備しない（ADR-0011 の Supersede を計画へ提案済み。
  # 認可の二重管理回避・要件=閲覧のみへの適合のため。docs/adr/IADR-0013 参照）。
  wiki-service:
    build:
      context: ..
      dockerfile: src/Services/WikiService/src/WikiService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（コンテナネットワーク内のみ）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env, *rabbit-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=wiki_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  llm-gateway:
    build:
      context: ..
      dockerfile: src/Services/LlmGateway/src/LlmGateway.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（/complete・/embed はサービス間呼び出し専用）
    expose:
      - "8080"
    environment:
      <<: *common-env
      Llm__ApiKey: ${ANTHROPIC_API_KEY:-}
      Llm__Model: claude-sonnet-4-6
    depends_on:
      - otel-collector

  # FR-08, UC-01: 回答へのフィードバック（👍/👎・コメント）収集サービス
  feedback-service:
    build:
      context: ..
      dockerfile: src/Services/FeedbackService/src/FeedbackService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（BFF 経由で到達）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=feedback_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy

  # FR-10, UC-05: 利用状況・検索傾向・回答品質を可視化するダッシュボードサービス
  dashboard-service:
    build:
      context: ..
      dockerfile: src/Services/DashboardService/src/DashboardService.Api/Dockerfile
    # IADR-0017: 内部 API のため host 公開しない（BFF 経由で到達）
    expose:
      - "8080"
    environment:
      <<: [*common-env, *db-env]
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=dashboard_svc;Username=kp;Password=kp
    depends_on:
      postgres:
        condition: service_healthy

  bff:
    build:
      context: ..
      dockerfile: src/Bff/KnowledgePlatform.Bff/Dockerfile
    ports:
      - "5000:8080"
    environment:
      <<: *common-env
      Redis__ConnectionString: redis:6379
      Services__RetrievalService: http://retrieval-service:8080
      Services__AiAnalysisService: http://aianalysis-service:8080
      Services__FeedbackService: http://feedback-service:8080
      Services__DashboardService: http://dashboard-service:8080
    depends_on:
      redis:
        condition: service_healthy
      feedback-service:
        condition: service_started
      dashboard-service:
        condition: service_started

volumes:
  postgres-data:
  rabbitmq-data:
  redis-data:
  qdrant-data:
  prometheus-data:
  grafana-data:
