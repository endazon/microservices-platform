# NFR-21, IADR-0709 決定 5: 読みだけ（Pod の get・list・watch）。名前空間 ai-stock-trading の中だけ（ClusterRole を使わない）。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: otel-collector-pod-reader
  namespace: ai-stock-trading
  labels: { app: otel-collector }
rules:
  - apiGroups: [""]
    resources: [pods]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: otel-collector-pod-reader
  namespace: ai-stock-trading
  labels: { app: otel-collector }
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: otel-collector-pod-reader
subjects:
  - kind: ServiceAccount
    name: otel-collector
    namespace: platform-infra
