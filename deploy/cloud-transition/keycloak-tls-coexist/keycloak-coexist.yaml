# NFR-16, IADR-0693: 併存の段の差分（kustomization.yaml の注記）。strategic merge（env・ports はキーで重なる）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: platform-infra
spec:
  template:
    spec:
      containers:
        - name: keycloak
          env:
            - name: KC_HOSTNAME
              $patch: delete
            - name: KC_HOSTNAME_STRICT
              value: "false"
            - name: KC_HTTP_ENABLED
              value: "true"
          ports:
            - name: http
              containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: platform-infra
spec:
  ports:
    - name: http
      port: 8080
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: keycloak-ingress-clients
  namespace: platform-infra
spec:
  podSelector: { matchLabels: { app: keycloak } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: ai-stock-trading } }
          podSelector:
            matchExpressions:
              - key: app
                operator: In
                values:
                  - audit-service
                  - backtest-service
                  - configuration-service
                  - cost-control-service
                  - information-collection-service
                  - market-monitor-service
                  - notification-service
                  - order-execution-service
                  - report-service
                  - risk-management-service
                  - trade-decision-service
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: microservices-platform } }
          podSelector: { matchLabels: { app: llmgateway-service } }
        # IADR-0699: 稼働中の realm へ機密クライアントを足す Job（最終の段の keycloak-ingress-clients と同じ）。
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: platform-infra } }
          podSelector: { matchLabels: { app: keycloak-add-clients } }
      ports:
        - { protocol: TCP, port: 8443 }
        - { protocol: TCP, port: 8080 }
