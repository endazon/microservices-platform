# ADR-0006: OpenTelemetry Collector — receives OTLP, exports to Prometheus/Loki/Tempo
#
# 🔴 SC-10, ADR-0078 決定 3, IADR-0421 (#1245 PR-B): **経路 B（k8s）の 2 つの collector 設定は
#    `prometheus/mail-relay` receiver を持つが、本ファイルは持たない。乖離は意図である。**
#    compose スタックに近接 MTA（mail-relay）は居らず、メールの検証経路は k8s だけである
#    （運用 Runbook が compose 経路の SMTP 手順を退役させた）。**宛先の無い scrape を足すと
#    恒常的に失敗し続ける** ——「配線してあるが届かない」を作らないため、ここには置かない。
#    近接 MTA を compose へ載せるときは、本ファイルにも同じ receiver を足すこと。
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 5s
  memory_limiter:
    check_interval: 1s
    limit_mib: 512

exporters:
  prometheusremotewrite:
    endpoint: http://prometheus:9090/api/v1/write
  otlp/tempo:
    endpoint: tempo:4317
    tls:
      insecure: true
  loki:
    endpoint: http://loki:3100/loki/api/v1/push
  debug:
    verbosity: normal

service:
  # #546: 自己テレメトリの待受を**明示する**（image 既定に頼らない）。
  # Prometheus の唯一の scrape 対象であり、既定任せだと版上げで静かに scrape 不能になる。
  # 経路B（deploy/local/infra/otel-collector.yaml）にも同じ宣言を置く＝パリティを崩さない。
  telemetry:
    metrics:
      address: 0.0.0.0:8888
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/tempo, debug]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [prometheusremotewrite, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [loki, debug]
