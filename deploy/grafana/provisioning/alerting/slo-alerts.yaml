# ADR-0006, NFR-21, #665: SLO アラートの**暫定**の一次検知（Grafana 統合アラート）。
#
# ★ これは暫定である。Alertmanager が配備されたら閉じる（併存させない）。
#   計画 `06_technical/05_observability-ops.md` 決定 42:
#     「SLO の一次検知 = Grafana の内蔵アラートを暫定の通知先とする。欠けているのは
#      検知そのものではなく通知の送り先だけである」
#   **ADR-0006（アラートは Alertmanager を用いる）は改めない。**
#   判断の経緯: .ai-context/adr/IADR-0165_grafana-interim-alerting.md（**閉じる条件は docs/operations/operations.md**）
#
# ★★ 限界を先に書く（#546 / 計画 決定 40。「統制を定めた」と「統制が働いている」を読み分けられるように）
#
#   1. **push 配信の宛先は設定していない。** ここが定めるのは**検知とその可視化**までで、
#      メール / Slack 等の宛先は**実環境の判断**である（Alertmanager の配備と同じ性質）。
#      **contactPoints / policies を本ファイルへ書かないのは意図的である** ——
#      届かない宛先を書くと「配線した」と読めてしまう。
#   2. **したがって暫定期間は「人が Grafana の Alerting 画面を見る」ことで気づく。**
#      **NFR-21「障害検出 5 分以内」を満たすのは評価の側だけ**であり、
#      **人が気づくまでの時間は見に行く間隔に等しい。** 運用仕様書へ同じことを書いてある。
#   3. **本ファイルが Grafana に受理されるかは未検証である**（#665 の作業仕様書 §判断 0）。
#      実装環境で Grafana を起動できなかった（docker daemon へ到達不可）。
#      機械で確かめたのは **`scripts/check-grafana-alerting.js`** の範囲
#      —— ルール数と名前が `deploy/prometheus/alerts.yml` と 1 対 1、参照する
#      `datasourceUid` が実在、compose と k8s が同内容、必須キーが揃っている、まで。
#      **配備時に `/api/v1/provisioning/alert-rules` が 16 件返すことを確かめること。**
#      🔴 **件数は導出値である。ここの数字を信用せず、着手のたびに数え直すこと**（IADR-0383）——
#      本行は #1246 が 2 件足した後も「9 件」のままであり、**2 世代ぶん腐っていた**（#1203 で是正）。
#      現在の内訳: platform-availability 2 ／ platform-slo 4 ／ platform-slo-evaluation-target 5
#      ／ knowledge-health-producers 2 ／ knowledge-health-violations 1 ／ mail-relay-queue 2 ＝ **16**（#1233 で 12 → 13、#1245 PR-B で 13 → 16 へ数え直した）。
#
# 式は `deploy/prometheus/alerts.yml` と**同じもの**を使う（二重管理だが、暫定期間だけである）。
#
# 🔴 **しきい値の置き場所が Prometheus 版と違う**（#1110）。Prometheus 版は `expr` の中に `> 1.5` と書くが、
#   Grafana 版は `expr` に閾値を持たず **`conditions[].evaluator.params`** に持つ。**両方を直すこと。**
#   単位は**秒**である（`http_server_request_duration_seconds_*`）。2026-08-30 まで
#   `params: [1500]` / `[5000]` とミリ秒の数値が残っており、名前も旧規約のままで**永久に発火しなかった。**
#   メトリクス名・ラベル・単位の由来と、式を変えるときの検証手順（**陽性対照を対で置く**）は
#   `deploy/prometheus/alerts.yml` の冒頭が正本である。
apiVersion: 1
groups:
  - orgId: 1
    name: platform-availability
    folder: SLO
    interval: 1m
    rules:
      - uid: slo-otel-collector-down
        title: OtelCollectorDown
        condition: C
        for: 2m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "OTel Collector 到達不可（可観測性パイプライン断）"
          description: "otel-collector の scrape が 2 分間失敗。メトリクス/トレース/ログの収集が停止している可能性。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'up{job="otel-collector"} == 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: slo-service-request-metrics-absent
        title: ServiceRequestMetricsAbsent
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "サービスのリクエストメトリクスが途絶"
          description: "直近まで処理していたサービスの HTTP メトリクスが 5 分間ゼロ。ダウン/到達不可の可能性（要 blackbox 補完）。"
        data:
          - refId: A
            relativeTimeRange: { from: 1800, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |
                sum by (job) (rate(http_server_request_duration_seconds_count[5m])) == 0
                and on (job) (sum by (job) (http_server_request_duration_seconds_count offset 15m) > 0)
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

  - orgId: 1
    name: platform-slo
    folder: SLO
    interval: 1m
    rules:
      - uid: slo-high-http-5xx-rate
        title: HighHttp5xxRate
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "5xx 率が 5% 超"
          description: "直近 5 分の 5xx 率が閾値超過。障害検出 5 分以内（NFR-21）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |
                sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0.05] }

      - uid: slo-search-latency-p95-high
        title: SearchLatencyP95High
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "検索 p95 が 1.5s 超"
          description: "RetrievalService の p95 レイテンシが NFR-01 目標(1.5s)を 10 分継続で超過。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |
                histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.retrieval-service"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 単位は**秒**（1.5s）。ミリ秒の 1500 ではない。
                - evaluator: { type: gt, params: [1.5] }

      - uid: slo-rag-first-token-p95-high
        title: RagFirstTokenP95High
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "RAG 初回応答（初回トークン）p95 が 5s 超"
          description: "AiAnalysisService /analysis/ask/stream の初回トークンまでの p95 が NFR-02 目標(5s)を 10 分継続で超過。**NFR-02 の SLO 判定はこのルールである**（RagLatencyP95High は応答完了であり傾向の観察に留める）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |
                histogram_quantile(0.95, sum by (le) (rate(rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 単位は**秒**（5s）。ミリ秒の 5000 ではない（ADR-0076 決定 1）。
                - evaluator: { type: gt, params: [5] }

      - uid: slo-rag-latency-p95-high
        title: RagLatencyP95High
        condition: C
        for: 10m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "RAG 応答完了 p95 が 5s 超（傾向の観察。NFR-02 の判定ではない）"
          description: "AiAnalysisService /analysis/ask（一括経路）の応答完了 p95 が 5s を 10 分継続で超過。NFR-02 の初回応答 SLO は RagFirstTokenP95High が判定する（ADR-0076 §統制と現在の実現手段）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: |
                histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.aianalysis-service", http_route="/analysis/ask"}[5m])))
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 単位は**秒**（5s）。ミリ秒の 5000 ではない。
                - evaluator: { type: gt, params: [5] }

  # ADR-0076 決定 3 (#1202): SLO の**評価対象そのものの不在**を warning とする。
  #
  # 🔴 **この群だけ `noDataState` が `OK` である。Prometheus 版には無い、Grafana 版だけの落とし穴。**
  #   `absent(m)` は **`m` が存在するとき空ベクタを返す**（＝正常時が「データ無し」）。Grafana の閾値式は
  #   空入力を NoData として扱うため、他の 6 件と同じ `NoData` にすると**正常時に `DatasourceNoData` が
  #   恒常発火する** —— ADR-0076 理由が「警報を無効化する」と名指しした型そのものになる。
  #   **既存 6 件は `NoData` のままでよい**（あちらは正常時に値を返す式であり、空になること自体が異常）。
  #
  # しきい値の置き場所は他と同じく `conditions[].evaluator.params`（`gt 0`）。`absent()` は真のとき 1 を返す。
  # 対象経路の選び方・`for: 5m` の理由・検知が最大およそ 10 分になることは
  # `deploy/prometheus/alerts.yml` の同名の群の冒頭が正本である。
  - orgId: 1
    name: platform-slo-evaluation-target
    folder: SLO
    interval: 1m
    rules:
      - uid: slo-otel-collector-up-series-absent
        title: OtelCollectorUpSeriesAbsent
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: 'SLO の評価対象が無い: up{job="otel-collector"} の系列が存在しない'
          description: "otel-collector の scrape 対象が Prometheus の設定から失われている疑い。OtelCollectorDown は空ベクタになり発火しない（ADR-0076 決定 3）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'absent(up{job="otel-collector"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: slo-http-server-metrics-series-absent
        title: HttpServerMetricsSeriesAbsent
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "SLO の評価対象が無い: http_server_request_duration_seconds_count の系列が 1 つも存在しない"
          description: "全サービスの HTTP メトリクスが Prometheus に無い。転送経路（OTLP → collector → remote write）の断、またはメトリクス名・単位の規約変更の疑い。ServiceRequestMetricsAbsent と HighHttp5xxRate は空ベクタになり発火しない（#1110 の再発。ADR-0076 決定 3）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'absent(http_server_request_duration_seconds_count)'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: slo-search-latency-series-absent
        title: SearchLatencySeriesAbsent
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "SLO の評価対象が無い: retrieval-service のレイテンシ分布が存在しない"
          description: "RetrievalService の http_server_request_duration_seconds_bucket が無い。SearchLatencyP95High は空ベクタになり発火しない（NFR-01 の検索 p95 が無監視になる）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'absent(http_server_request_duration_seconds_bucket{job="microservices-platform.retrieval-service"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # NFR-02, ADR-0076 決定 3, ADR-0079 決定 1 (#1203): RagLatencyP95High の評価対象。
      # 常時トラフィックの源は合成監視のプローブ（60 秒間隔）である。**RagFirstTokenP95High の系列は
      # 依然として対象外**（LLM を呼ばない限り token が出ず計器が記録しない）。理由は Prometheus 版が正本。
      - uid: slo-rag-latency-series-absent
        title: RagLatencySeriesAbsent
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "SLO の評価対象が無い: aianalysis-service /analysis/ask のレイテンシ分布が存在しない"
          description: "AiAnalysisService の http_server_request_duration_seconds_bucket{http_route=\"/analysis/ask\"} が無い。RagLatencyP95High は空ベクタになり発火しない。合成監視のプローブ（60 秒間隔）が止まっているか、AiAnalysisService が /analysis/ask を処理できていない疑い（ADR-0076 決定 3 / ADR-0079 決定 1）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'absent(http_server_request_duration_seconds_bucket{job="microservices-platform.aianalysis-service", http_route="/analysis/ask"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      # SC-10 / SC-15, ADR-0078 決定 3, IADR-0421 (#1245 PR-B): 下の mail-relay-queue 群の評価対象。
      # 🔴 **0 は「滞留なし」・不在は「測っていない」である。** exporter は読めなかったキューに
      #   0 を出さず系列ごと欠かす（#1110 / #1246 の「沈黙が正常に見える」形を作らないため）。
      - uid: slo-mail-relay-queue-series-absent
        title: MailRelayQueueSeriesAbsent
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "SLO の評価対象が無い: 近接 MTA のキュー長の系列が存在しない"
          description: "mail-relay の postfix_queue_size{queue=\"deferred\"} が無い。MailRelayDeferredBacklog / MailRelayDeferredMessageNearExpiry は空ベクタになり発火せず、上流停止が無監視になる（ADR-0078 決定 3 の観測点が消えた状態）。exporter サイドカーの不在・spool の読み取り失敗・otel-collector の prometheus receiver の欠落・NetworkPolicy による遮断を疑う。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'absent(postfix_queue_size{queue="deferred"})'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

  # FR-10, SC-10, ADR-0076 決定 3, IADR-0389 決定 5 (#1246): ナレッジ健全性の生産者の不在。
  #
  # 🔴 **上の群と式が違う（`absent_over_time` である）。** 生産は周期駆動（1 時間）であり、
  #   `absent()` の既定 5 分 lookback では平常時に鳴り続ける。理由の正本は
  #   `deploy/prometheus/alerts.yml` の同名グループの前書きである。
  - orgId: 1
    name: knowledge-health-producers
    folder: SLO
    interval: 1m
    rules:
      - uid: knowledge-health-unresolved-links-producer-absent
        title: KnowledgeHealthUnresolvedLinksProducerAbsent
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "ナレッジ健全性の生産者が居ない: unresolved-links の報告が 2 時間届いていない"
          description: "GraphService の定期収集が unresolved-links を DashboardService へ届けていない（周期は 1 時間）。受け口の件数は最後の値で凍るため、画面は正常に見える。収集の失敗・リースの停滞・受け口への到達不能を疑う（ADR-0076 決定 3）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'absent_over_time(knowledge_health_report_total{knowledge_indicator="unresolved-links"}[2h])'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: knowledge-health-edge-type-usage-producer-absent
        title: KnowledgeHealthEdgeTypeUsageProducerAbsent
        condition: C
        for: 10m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "ナレッジ健全性の生産者が居ない: edge-type-usage の報告が 2 時間届いていない"
          description: "GraphService の定期収集が edge-type-usage を DashboardService へ届けていない（周期は 1 時間）。受け口の件数は最後の値で凍るため、画面は正常に見える。収集の失敗・リースの停滞・受け口への到達不能を疑う（ADR-0076 決定 3）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'absent_over_time(knowledge_health_report_total{knowledge_indicator="edge-type-usage"}[2h])'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

  # FR-05, FR-16, SC-10, SC-12, ADR-0085 決定 4, IADR-0420 (#1233):
  # ユニットの主体が `project` を付けずに保存したこと（**0 が正常**）。
  #
  # 🔴 **`noDataState: OK` である。** 違反が 1 件も無ければカウンタの系列そのものが存在せず
  #   （＝正常時が「データ無し」）、`NoData` にすると平常時に恒常発火する。上の 2 群と同じ理由。
  #   理由の正本は `deploy/prometheus/alerts.yml` の同名グループの前書きである。
  - orgId: 1
    name: knowledge-health-violations
    folder: SLO
    interval: 1m
    rules:
      - uid: unit-documents-missing-project-attribute
        title: UnitDocumentsMissingProjectAttribute
        condition: C
        for: 5m
        noDataState: OK
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "ユニットの主体が project を付けずに文書を保存した（0 が正常）"
          description: "DocumentService の documents_unit_project_missing_total が直近 1 時間で前進した。ユニット（サービスアカウント）の保存経路は project を無条件で付与するため、非ゼロはその経路を通らない書き込みが起きたことを意味する。documents_client_id / documents_operation で書き手と操作を特定する。保存は止まっていない（計器であって統制ではない。ADR-0085 決定 4）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'increase(documents_unit_project_missing_total[1h]) > 0'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

  # SC-10 / SC-15, FR-05, ADR-0045 決定 8 → ADR-0078 決定 3, IADR-0404 / IADR-0421 (#1245 PR-B):
  # **近接 MTA（mail-relay）のキュー** —— 上流の停止を見る唯一の窓である。
  #
  # 🔴 **観測点が移った。** 近接 MTA を挟んだ以後、上流が止まっていても認証基盤から見た送出は成功する
  #   （キューへ入る）。監査ログだけを見ていると上流停止を見逃す。
  # 🔴 **系列は Prometheus の直 scrape ではない。** mail-relay のサイドカー exporter（:9154）を
  #   otel-collector の prometheus receiver が取り、remote write で入る（job は `mail-relay`）。
  # 🔴 **しきい値と for は実測前の暫定値である**（#1245 PR-D で測る）。理由の正本は
  #   `deploy/prometheus/alerts.yml` の同名グループの前書きである。
  # 🔴 **しきい値の置き場所が Prometheus 版と違う**（このファイル冒頭の注意）。expr は閾値を持たず、
  #   `conditions[].evaluator.params` が持つ。**両方を直すこと。**
  - orgId: 1
    name: mail-relay-queue
    folder: SLO
    interval: 1m
    rules:
      - uid: mail-relay-deferred-backlog
        title: MailRelayDeferredBacklog
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: warning
        annotations:
          summary: "近接 MTA の後送が滞留している（deferred > 0 が 5 分継続）"
          description: "mail-relay が上流へ後送できずメールが deferred キューに残っている。上流（組織のメールテナント）の停止・認証失敗・宛先拒否を疑う。🔴 Keycloak 側の応答は 200 のままであり、利用者にも監査ログにも現れない（ADR-0078 決定 3 が観測点をここへ移した理由）。しきい値と for は実測前の暫定値である（#1245 PR-D）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'postfix_queue_size{queue="deferred"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                - evaluator: { type: gt, params: [0] }

      - uid: mail-relay-deferred-message-near-expiry
        title: MailRelayDeferredMessageNearExpiry
        condition: C
        for: 5m
        noDataState: NoData
        execErrState: Error
        labels:
          severity: critical
        annotations:
          summary: "近接 MTA の後送がキュー寿命に達しつつある（最古 20 分超）"
          description: "deferred の最古メッセージが到着から 20 分を超えた。キュー寿命は 30 分であり、これを超えたメールは破棄される（バウンスも溜めない設定）。破棄されたパスワードリセットは利用者からは「メールが来ない」としか見えない。上流を復旧するか、リセットの申請を閉じること。しきい値は実測前の暫定値である（#1245 PR-D）。"
        data:
          - refId: A
            relativeTimeRange: { from: 600, to: 0 }
            datasourceUid: prometheus
            model:
              refId: A
              instant: true
              expr: 'postfix_queue_oldest_message_age_seconds{queue="deferred"}'
          - refId: C
            datasourceUid: __expr__
            model:
              refId: C
              type: threshold
              expression: A
              conditions:
                # 単位は**秒**（1200 = 20 分）。キュー寿命 1800 秒（30 分）の内側で鳴らす。
                - evaluator: { type: gt, params: [1200] }
