apiVersion: 1
datasources:
  - name: Prometheus
    # #665: **uid を固定する。** Grafana のアラートルールは datasource を uid で指すため必須で、
    # 宣言しないと Grafana が uid を生成する。Tempo の jsonData が `datasourceUid: prometheus` /
    # `loki` を参照しているのに宣言が無く、**その参照が解決していなかった**（#665 で実測）。
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    jsonData:
      timeInterval: "15s"

  - name: Loki
    uid: loki
    type: loki
    access: proxy
    url: http://loki:3100
    # NFR-18, ADR-0133, IADR-0526 (#1842): 経路 B の Loki・Tempo の前段が検証する読み取りのトークン。
    # 経路 B（deploy/local/observability/grafana.yaml）と同じ宣言を置く（check-grafana-provisioning-parity.js が 1 対 1 で突き合わせる）。
    # 🔴 compose では env が無く値は空になる。compose の Loki・Tempo に前段は無く（0 段。docs/security/security.md）、
    #    `auth_enabled: false` の製品はこのヘッダを読まない。
    jsonData:
      httpHeaderName1: Authorization
      # NFR-21, ADR-0006 (#2148): ログ行からトレースへ飛ぶ。collector の `loki` exporter は JSON の行に `"traceid":"<16 進>"` を載せる。
      # 🔴 実ログの書式は配備時に確かめる（運用仕様書「ログからトレースへ」。Explore でリンクが Tempo のトレースを開くこと）。
      # `$$` は provisioning の環境変数展開を避ける書き方（Grafana が `${__value.raw}` を受け取る）。
      derivedFields:
        - name: TraceID
          matcherRegex: '"traceid":"(\w+)"'
          url: '$${__value.raw}'
          datasourceUid: tempo
    secureJsonData:
      httpHeaderValue1: Bearer $OBS_GATE_READER_TOKEN

  - name: Tempo
    uid: tempo
    type: tempo
    access: proxy
    url: http://tempo:3200
    jsonData:
      httpHeaderName1: Authorization
      tracesToLogs:
        datasourceUid: loki
        spanStartTimeShift: -5m
        spanEndTimeShift: 5m
      serviceMap:
        datasourceUid: prometheus
      search:
        hide: false
      nodeGraph:
        enabled: true
    secureJsonData:
      httpHeaderValue1: Bearer $OBS_GATE_READER_TOKEN
