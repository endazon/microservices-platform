# NFR-02, ADR-0076 決定 5, ADR-0079 決定 3 (#2334): 警報 RagFirstTokenP95High の窓を `promtool test rules` で固定する。
#
# SLO 評価用の標本は 60 分に 1 回である（ADR-0079 決定 1。LLM を呼ぶ合成のプローブ）。初回トークンの計器は token が
# 出たときだけ記録するので、平常時の系列の増え方は「1 時間に 1 回だけ数が増える」形になる。
# 守るもの:
#   場面 1: 60 分おきの標本がすべて速い（1 秒）→ 鳴らない。式は 5 分の窓のときのように空にならず、p95 が算出される。
#   場面 2: 速い標本の間に 1 回だけ遅い標本（8 秒）が入る → 30 分の継続の後に鳴る（5 分の窓では、標本の無い時間帯に
#           式が空になり、30 分続かず鳴らなかった）。遅い標本が 6 時間の窓から出れば収まる。
#   検知遅延: 範囲 6h ＋ for 30m ＋ 間隔 60m ＝ 7.5h ≤ 8h（ADR-0079 決定 3 の上限）。
#
# 🔴 窓の値は暫定である（稼働環境での実測は #2336）。
#
# 実行: promtool test rules deploy/prometheus/tests/*.test.yml（CI の static-checks-units）
rule_files:
  - ../alerts.yml

evaluation_interval: 1m

tests:
  # 場面 1: 毎時 1 回、速い標本（1 秒。le=1 以上の桶が増える）が 10 回。
  - interval: 1m
    input_series:
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="1"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 10x59'
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="2.5"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 10x59'
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="5"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 10x59'
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="10"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 10x59'
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="+Inf"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 10x59'
    promql_expr_test:
      # 標本と標本の間（5 時間 30 分）でも p95 が算出される（桶 (0,1] の中で 0.95）。
      - expr: histogram_quantile(0.95, sum by (le) (rate(rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service"}[6h])))
        eval_time: 5h30m
        exp_samples:
          - labels: '{}'
            value: 0.95
    alert_rule_test:
      - eval_time: 5h30m
        alertname: RagFirstTokenP95High
        exp_alerts: []
      - eval_time: 10h30m
        alertname: RagFirstTokenP95High
        exp_alerts: []

  # 場面 2: 1〜3 時間目は速く、4 時間目（240 分）だけ遅い（8 秒。le=10 と +Inf の桶だけが増える）。以降は速い。
  - interval: 1m
    input_series:
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="1"}'
        values: '0x59 1x59 2x59 3x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59'
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="2.5"}'
        values: '0x59 1x59 2x59 3x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59'
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="5"}'
        values: '0x59 1x59 2x59 3x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59'
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="10"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 10x59'
      - series: 'rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service", le="+Inf"}'
        values: '0x59 1x59 2x59 3x59 4x59 5x59 6x59 7x59 8x59 9x59 10x59'
    alert_rule_test:
      # 遅い標本の前は鳴らない。
      - eval_time: 3h50m
        alertname: RagFirstTokenP95High
        exp_alerts: []
      # 240 分から条件が立つ（4 標本のうち 1 つが遅い: p95 = 5 + 5 × 0.8 = 9 秒）。for 30m を満たす前は鳴らない。
      - eval_time: 4h25m
        alertname: RagFirstTokenP95High
        exp_alerts: []
      # 標本の無い時間帯（4 時間 35 分）でも条件は続き、鳴る。
      - eval_time: 4h35m
        alertname: RagFirstTokenP95High
        exp_alerts:
          - exp_labels:
              severity: warning
            exp_annotations:
              summary: 'RAG 初回応答（初回トークン）p95 が 5s 超'
              description: 'AiAnalysisService /analysis/ask/stream の初回トークンまでの p95（直近 6 時間）が NFR-02 目標(5s)を 30 分継続で超過。'
      # 遅い標本が 6 時間の窓から出れば（240 分 ＋ 6 時間 ＝ 600 分の後）収まる。
      - eval_time: 10h30m
        alertname: RagFirstTokenP95High
        exp_alerts: []
