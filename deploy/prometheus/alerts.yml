# ADR-0006, NFR (#198): Prometheus アラートルール（SLO ベース）。
# 目標: 障害検出 5 分以内・MTTR 30 分以内。通知は Alertmanager（deploy/prometheus.yml の alerting 参照）。
#
# メトリクス経路: アプリ → OTLP → otel-collector → prometheusremotewrite → Prometheus（push モデル）。
# 使用メトリクス名は既存 Grafana ダッシュボード（microservices-platform-overview.json）と一致させている
# （`http_server_request_duration_seconds_{count,bucket}`、ラベル job / http_response_status_code / http_route / le）。
#
# 🔴 名前・ラベル・単位は「稼働 Prometheus に実在するもの」である。推測で書き換えないこと（#1110）。
#   2026-08-30 まで、この 4 ルール（OtelCollectorDown 以外）は **一度も存在したことのない**
#   `http_server_duration_milliseconds_*` を見ており、**どれだけ障害が起きても永久に発火しなかった。**
#   式は構文として正当なので Prometheus はエラーを出さない（health: "ok" / state: "inactive"）。
#   **「評価されている」と「評価対象がある」は別である。**
#
#   由来: `AddAspNetCoreInstrumentation()` が出すのは現行の安定 HTTP セマンティック規約
#   （`http.server.request.duration`・**単位は秒**）である。旧規約の `http.server.duration`（ミリ秒）ではない。
#   さらに prometheusremotewrite はリソース属性 `service.namespace`+`service.name` を **`job`** へ写すため、
#   アプリのメトリクスに `service_name` ラベルは**付かない**（付くのは collector 自己テレメトリだけ）。
#
#   ★ 式を変えるときの検証手順（機械検査は無い。人が守る）:
#     1. 転送構成を有効にする（deploy/local/observability を apply → collector を rollout restart）。
#        既定は debug exporter だけの fail-safe であり、**アプリのメトリクスは 1 件も届かない。**
#     2. `kubectl -n platform-infra exec deploy/prometheus -- wget -qO- \
#          --post-data='match[]=<メトリクス名>' http://localhost:9090/api/v1/series`
#     3. 🔴 **「0 件だった」を「無い」と読む前に、陽性対照を対で置く** ——
#        実在すると分かっているもの（例: `otelcol_receiver_accepted_metric_points`）で
#        **同じ問い合わせ方**をして非ゼロが返ることを示す。
#        （`--post-data` は form 符号化であり **式中の `+` が空白へ復号される**。
#         `{__name__=~"otelcol_.+"}` が 0 件で返り、実際に読み違えかけた。`+` は `%2B` で送る。）
#
# 🔵 「評価対象があること」を見るルールを別の群（platform-slo-evaluation-target）に置いてある（#1202 /
#   ADR-0076 決定 3）。**上の #1110 の注意書きが人手の規律として書いていることを、稼働環境の側から拾う器**である。
#   静的検査（CI で全ルールの非空ベクタを確かめる）は IADR-0345 決定 5 の繰り延べのままで、
#   ADR-0076 はその判断を覆していない。**稼働側と変更時では、検知できる時点が違う。**
#
# 注意（要検証）: RabbitMQ キュー滞留・デッドレター・構成ドリフトのアラートは、それぞれ RabbitMQ Prometheus
# プラグインの exporter メトリクスと、ドリフト検出のカスタムメトリクス（現状は監査ログ/警告ログで表出）が
# 必要。exporter/メトリクスを配線後に下記コメントアウト例を有効化する（follow-up）。
groups:
  - name: platform-availability
    rules:
      # 可観測性パイプライン断（唯一の scrape ターゲット。push モデルのため他は絶対値検知が難しい）。
      - alert: OtelCollectorDown
        expr: up{job="otel-collector"} == 0
        for: 2m
        labels: { severity: critical }
        annotations:
          summary: "OTel Collector 到達不可（可観測性パイプライン断）"
          description: "otel-collector の scrape が 2 分間失敗。メトリクス/トレース/ログの収集が停止している可能性。"

      # サービスの応答断（push モデルでは絶対的な down 判定が困難なため、直近まで受信していた
      # リクエストメトリクスが途絶したことを近似シグナルとする。アイドルサービスでは誤検知し得るため for を長めに。）
      - alert: ServiceRequestMetricsAbsent
        expr: |
          sum by (job) (rate(http_server_request_duration_seconds_count[5m])) == 0
          and on (job) (sum by (job) (http_server_request_duration_seconds_count offset 15m) > 0)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "サービス {{ $labels.job }} のリクエストメトリクスが途絶"
          description: "直近まで処理していたサービスの HTTP メトリクスが 5 分間ゼロ。ダウン/到達不可の可能性（要 blackbox 補完）。"

  - name: platform-slo
    rules:
      # HTTP 5xx 率（サービス別）。NFR 可用性 99.9% の逸脱検知。
      - alert: HighHttp5xxRate
        expr: |
          sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
          / sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
        for: 5m
        labels: { severity: critical }
        annotations:
          summary: "{{ $labels.job }} の 5xx 率が 5% 超"
          description: "直近 5 分の 5xx 率が閾値超過。障害検出 5 分以内（NFR）。"

      # 検索 p95 レイテンシ（NFR: 検索 p95 1.5s）。retrieval-service。
      # 🔴 しきい値の単位は**秒**である（メトリクスが秒。1500 と書くと 25 分の意味になり永久に真にならない）。
      - alert: SearchLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.retrieval-service"}[5m]))) > 1.5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "検索 p95 が 1.5s 超"
          description: "RetrievalService の p95 レイテンシが NFR 目標(1.5s)を 10 分継続で超過。"

      # NFR-02, ADR-0076 決定 5 (#1204): RAG 回答の**初回応答** p95 ＝ 初回トークンまでの時間（TTFT）。
      # 🔴 **NFR-02 の SLO 判定はこのルールで行う。** 下の RagLatencyP95High（応答完了 p95）ではない。
      #   計器は AiAnalysisService の `rag.answer.first_token.duration`（**単位は秒**。ADR-0076 決定 1）で、
      #   要求受領から最初の `token` イベントを書き出すまでを測る。**token が 1 件も出なければ記録されない**
      #   （初回トークンが無かったことを「速かった」として積まない）。
      #   経路は SC-01 が実際に使う **/analysis/ask/stream** であり、一括経路 /analysis/ask ではない。
      # 🔴 **この計器は呼ばれない限り系列を持たない。** 無風でいられる時間が検知要件（5 分）を超えるため、
      #   ADR-0076 決定 3 の `absent` 併設の対象外である（決定 4 の合成監視が入るまで）。
      - alert: RagFirstTokenP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service"}[5m]))) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "RAG 初回応答（初回トークン）p95 が 5s 超"
          description: "AiAnalysisService /analysis/ask/stream の初回トークンまでの p95 が NFR-02 目標(5s)を 10 分継続で超過。"

      # RAG **応答完了** p95。aianalysis-service /analysis/ask（一括経路）。
      # 🔴 **これは NFR-02 の SLI ではない**（#1204 で注釈を是正した。それまで「初回応答」と称していた）。
      #   ADR-0076 §統制と現在の実現手段 が「応答完了 p95 は代理値として読む。ただし**長い回答ほど悪化する**ため
      #   **SLO 判定には用いない（傾向の観察に留める）**」と定めている。SLO 判定は上の RagFirstTokenP95High。
      #   式・しきい値・severity は据え置く —— 一括経路が極端に遅いことは運用上の異常として拾う価値がある。
      - alert: RagLatencyP95High
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.aianalysis-service", http_route="/analysis/ask"}[5m]))) > 5
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "RAG 応答完了 p95 が 5s 超（傾向の観察。NFR-02 の判定ではない）"
          description: "AiAnalysisService /analysis/ask（一括経路）の応答完了 p95 が 5s を 10 分継続で超過。NFR-02 の初回応答 SLO は RagFirstTokenP95High が判定する。"

  # ADR-0076 決定 3 (#1202): **SLO の評価対象そのものが無いこと**を warning とする。
  #
  # 🔴 **上の ServiceRequestMetricsAbsent とは拾うものが違う。名前が似ているので読み分けること。**
  #   - `ServiceRequestMetricsAbsent` = **直近まで受信していたのに途絶した**（`== 0` かつ `offset 15m > 0`）。
  #     系列そのものが消えると `rate()` が空になり、**式全体が空になって発火しない。**
  #   - 本群の `…SeriesAbsent` = **系列が存在しない**（`absent()`）。一度も存在しなかった場合も拾う。
  #     2026-08-30 まで 4 ルールが存在しないメトリクス名を見ていた事故（#1110）は、**この形でしか検知できない。**
  #
  # 🔴 **対象は「無風でいられる時間が検知要件（5 分）より短い経路」だけである**（ADR-0076 決定 3 の判定基準）。
  #   全 SLO へ対で置くと低頻度経路で恒常発火し、警報を無視する習慣を作る（同 §検討した選択肢 ② 案 B は却下）。
  #   **`/analysis/ask` 系（RagFirstTokenP95High / RagLatencyP95High）は対象外**である ——
  #   呼ばれない限り系列を持たないため、無風が 5 分を超え得る。決定 4 の合成監視が着地してから入れる。
  #
  # 🔴 **検知までは最大およそ 10 分である。NFR-21 の「5 分以内」ではない。**
  #   `absent()` は瞬間ベクタ選択子の既定 5 分 lookback が空になって初めて真になり、そこへ `for: 5m` が積まる。
  #   本群が拾うのは**サービス障害ではなく統制の欠落**であり、障害の 5 分検知は
  #   OtelCollectorDown（2m）と HighHttp5xxRate（5m）が担う。**速さより恒常発火の回避を採っている。**
  #
  # 系列ごとに 1 件だけ置く（ルールごとに対を置かない）。ServiceRequestMetricsAbsent と HighHttp5xxRate は
  # 同じ系列を見ており、対で置くと**同じ不在で 2 通鳴る**。
  - name: platform-slo-evaluation-target
    rules:
      # OtelCollectorDown の評価対象。scrape 設定から otel-collector が消えると `up` 系列ごと無くなり、
      # `up == 0` は**空になって発火しない**（「落ちた」ではなく「見ていない」）。
      - alert: OtelCollectorUpSeriesAbsent
        expr: absent(up{job="otel-collector"})
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: 'SLO の評価対象が無い: up{job="otel-collector"} の系列が存在しない'
          description: "otel-collector の scrape 対象が Prometheus の設定から失われている疑い。OtelCollectorDown は空ベクタになり発火しない（ADR-0076 決定 3）。"

      # ServiceRequestMetricsAbsent と HighHttp5xxRate の評価対象。全 job の HTTP サーバーメトリクス。
      # 常時トラフィックの源は kubelet の liveness/readiness プローブであり、無風になり得ない（§実測）。
      - alert: HttpServerMetricsSeriesAbsent
        expr: absent(http_server_request_duration_seconds_count)
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "SLO の評価対象が無い: http_server_request_duration_seconds_count の系列が 1 つも存在しない"
          description: "全サービスの HTTP メトリクスが Prometheus に無い。転送経路（OTLP → collector → remote write）の断、またはメトリクス名・単位の規約変更の疑い。ServiceRequestMetricsAbsent と HighHttp5xxRate は空ベクタになり発火しない（#1110 の再発。ADR-0076 決定 3）。"

      # SearchLatencyP95High の評価対象。job ラベルまで絞る（全体はあるのに retrieval-service だけ無い、を拾う）。
      - alert: SearchLatencySeriesAbsent
        expr: absent(http_server_request_duration_seconds_bucket{job="microservices-platform.retrieval-service"})
        for: 5m
        labels: { severity: warning }
        annotations:
          summary: "SLO の評価対象が無い: retrieval-service のレイテンシ分布が存在しない"
          description: "RetrievalService の http_server_request_duration_seconds_bucket が無い。SearchLatencyP95High は空ベクタになり発火しない（NFR-01 の検索 p95 が無監視になる）。"

  # FR-10, SC-10, ADR-0076 決定 3, IADR-0389 決定 5 (#1246):
  # **ナレッジ健全性の生産者が居なくなったこと**を warning とする。
  #
  # 🔴 **受け口の数字は生産者が止まっても 0 にならない。** 観測値は指標 1 つ分の全量スナップショット
  #   置換であり、報告が来なくなると**最後に届いた値のまま凍る**。画面上は「安定している」に見え、
  #   **沈黙が正常と読める** —— これが #1246 が名指しした「生産者が居ない指標」の見え方そのものである。
  #   だから件数ではなく**届けた回数の系列の不在**を鳴らす。
  #
  # 🔴 **`absent()` ではなく `absent_over_time(...[2h])` である。上の群と式が違う。**
  #   上の群が見ているのはトラフィック駆動の系列であり、無風時間が 5 分より短いことを稼働クラスタで
  #   実測して対象を決めている（IADR-0370 決定 1）。こちらは**周期駆動**で、周期は構成から確定する
  #   （KnowledgeHealthHostedService.Interval = 1 時間）。`absent()` の既定 5 分 lookback では
  #   **平常時のほとんどの時間で真になり、鳴り続ける。** 2 周期ぶんの窓で見る。
  #
  # 🔴 **検知までは最大およそ 2 時間 10 分である。** 指標は運用の棚卸しに使うもので分単位の鮮度を
  #   要さない（生産側が周期を 1 時間に決めたのと同じ理由）。速さより恒常発火の回避を採っている。
  #
  # 指標ごとに 1 件置く。**同じ生産者（GraphService の 1 つの定期処理）が 4 指標すべてを送るが、
  # 指標ごとに収集の実装が別**であり、片方だけが例外で落ちても他方は届く。
  # 本 issue（#1246）が生産者を置いた 2 指標に対で置く。
  - name: knowledge-health-producers
    rules:
      - alert: KnowledgeHealthUnresolvedLinksProducerAbsent
        expr: absent_over_time(knowledge_health_report_total{knowledge_indicator="unresolved-links"}[2h])
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "ナレッジ健全性の生産者が居ない: unresolved-links の報告が 2 時間届いていない"
          description: "GraphService の定期収集が unresolved-links を DashboardService へ届けていない（周期は 1 時間）。受け口の件数は最後の値で凍るため、画面は正常に見える。収集の失敗・リースの停滞・受け口への到達不能を疑う（ADR-0076 決定 3）。"

      - alert: KnowledgeHealthEdgeTypeUsageProducerAbsent
        expr: absent_over_time(knowledge_health_report_total{knowledge_indicator="edge-type-usage"}[2h])
        for: 10m
        labels: { severity: warning }
        annotations:
          summary: "ナレッジ健全性の生産者が居ない: edge-type-usage の報告が 2 時間届いていない"
          description: "GraphService の定期収集が edge-type-usage を DashboardService へ届けていない（周期は 1 時間）。受け口の件数は最後の値で凍るため、画面は正常に見える。収集の失敗・リースの停滞・受け口への到達不能を疑う（ADR-0076 決定 3）。"

