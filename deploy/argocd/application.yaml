# ADR-0007: CI/CD・GitOps（ArgoCD + Helm + Harbor）
# Application — 本リポジトリの Helm チャート（deploy/helm/microservices-platform）を
# microservices-platform Namespace へ宣言的に同期する。Git の状態が単一の真実源であり、
# 手動 kubectl 適用に依存しない（受け入れ基準: ArgoCD 経由のデプロイが Git と同期）。
#
# 独立デプロイ・ロールバック（NFR-20）:
#   - 版の固定は下の helm.parameters の global.image.tag（自製イメージの不変のタグ＝ビルドした git の sha）で行う。
#     chart はタグが無いと描画を落とす（latest へ倒さない。IADR-0605 / #2132）。
#   - サービス単位のデプロイは services.<name>.tag を同じ parameters へ足して行う（そのサービスだけ別の sha）。
#   - ロールバックは前の sha へ値を戻す（Git で値を戻して適用）。手順は docs/operations/operations.md
#     §イメージのタグの固定とロールバック。
#
# IADR-0088 (#320) → IADR-0605 (#2132): タグは不変（git の sha）だけを渡す。同じタグの中身を差し替えない。
#   不変のタグなら pod template が毎回変わり、`IfNotPresent` でも新しいタグは取りに行く（`Always` は不要）。
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: microservices-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: microservices-platform
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: microservices-platform
  source:
    repoURL: https://github.com/endazon/microservices-platform.git
    # GitOps の配備対象リビジョン（安定版）。運用ポリシーに応じて変更する。
    targetRevision: main
    path: deploy/helm/microservices-platform
    helm:
      releaseName: microservices-platform
      # FR-15, IADR-0029 フォローアップ 3 (#144): 構成バージョンの GitOps 注入。
      # appliedBy は argocd 固定。gitCommit / appliedAt は「実適用リビジョン」を CD パイプラインが
      # 同期時に上書きする（`argocd app set microservices-platform --helm-set config.gitCommit=<sha>
      # --helm-set config.appliedAt=<iso8601>`、または release automation が values-<env>.yaml を更新）。
      # ArgoCD ネイティブ Helm は build 変数をパラメータへ自動展開しないため、SHA 供給は CD 側で行う。
      # 手順は docs/operations/operations.md「構成バージョンの注入」を参照。
      # FR-15, IADR-0046, IADR-0069 (#192): 構成バージョン**履歴**（config.history[i].*）も同じ経路で供給する。
      # 各適用リビジョンを新しい順の要素として CD が --helm-set config.history[i].{gitCommit,appliedAt,appliedBy,hadDrift}
      # で上書きする（または values-<env>.yaml の config.history を更新）。既定 config.history: [] は現在バージョン単一へ縮退。
      parameters:
        - name: config.appliedBy
          value: argocd
        # NFR-20, ADR-0007, IADR-0605 (#2132): 自製イメージの不変のタグ（ビルドした git の sha）。**配備する人／CD が Git で更新する。**
        #   空のままでは chart の描画が落ち、同期は ComparisonError で止まる（latest で配らない）。forceString は数字だけの sha を
        #   数として読ませないため（chart は文字列でない値を拒む）。更新・ロールバックの手順は docs/operations/operations.md
        #   §イメージのタグの固定とロールバック。🔴 `argocd app set` だけで変えると、この Application を kubectl apply し直したときに
        #   値が空へ戻る —— 値の正はこのファイルである。
        - name: global.image.tag
          value: ""
          forceString: true
      # 環境別の上書きは values-<env>.yaml を valueFiles に追加する。
      # valueFiles:
      #   - values-production.yaml
  destination:
    server: https://kubernetes.default.svc
    namespace: microservices-platform
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
    retry:
      limit: 5
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 3m
