# ADR-0007: CI/CD・GitOps（ArgoCD + Helm + Harbor）
# AppProject — microservices-platform の配備を、許可したソース Git・配備先 Namespace・リソース種別に制約する。
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: microservices-platform
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  description: マイクロサービス基盤プラットフォーム（platform 基盤 ＋ knowledge 可変機能：8サービス + BFF + Wiki.js）
  # 許可するソースリポジトリ（Git を単一の真実源とする）。
  sourceRepos:
    - https://github.com/endazon/microservices-platform.git
  # 配備先クラスタ・Namespace。
  destinations:
    - server: https://kubernetes.default.svc
      namespace: microservices-platform
    # Istio リソース（PeerAuthentication/DestinationRule）は同 Namespace に閉じる。
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  # 配備先 Namespace 内で許可するリソース種別を、本プラットフォームが実際に配備する
  # 種別に限定する（最小権限）。恒久フェーズで新種別を追加する場合はここへ明示追加する。
  namespaceResourceWhitelist:
    # 🔴 **この一覧は「チャートが実際にレンダリングする種別」と一致していなければならない。**
    #   足りない種別があると ArgoCD の同期がその時点で拒否される（配備が止まる）。
    #
    # ★ 引き方（記憶で挙げない）: 本番像の values でレンダリングして種別を数える。
    #     helm template msp deploy/helm/microservices-platform |     #       yq -r 'select(.kind) | (.apiVersion | split("/") | .[0]) + " " + .kind' | sort -u
    #   Namespace だけは cluster スコープなので clusterResourceWhitelist 側に居る。
    #
    # ［2026-08-30 / #782］上の手順で引き直したところ **6 種別が欠けていた**
    #   （ConfigMap / HorizontalPodAutoscaler / Job / Gateway / VirtualService / PodDisruptionBudget）。
    #   いずれも本番 values でレンダリングされる。**Istio の Gateway / VirtualService が
    #   欠けていたのは、edge.yaml が経路B では無効（edge.enabled: false）で、
    #   誰も本番像で同期を試していなかったため**である。
    - group: "apps"
      kind: Deployment
    - group: ""
      kind: Service
    - group: ""
      kind: ConfigMap
    - group: ""
      kind: PersistentVolumeClaim
    - group: "networking.k8s.io"
      kind: Ingress
    - group: "networking.k8s.io"
      kind: NetworkPolicy
    - group: "autoscaling"
      kind: HorizontalPodAutoscaler
    - group: "policy"
      kind: PodDisruptionBudget
    - group: "batch"
      kind: Job
    - group: "security.istio.io"
      kind: PeerAuthentication
    - group: "networking.istio.io"
      kind: DestinationRule
    # #1115 → #1159: mesh.backchannelLogout.fromOutsideMesh=true の配備で
    #   istio-mtls.yaml が AuthorizationPolicy（平文を 1 URI に限る DENY）を描画する。
    #   許可種別に無いと ArgoCD の同期はその時点で止まる（IADR-0307 が直した 6 種別の欠落と同型）。
    #   ここは**列挙**なので、テンプレートが種別を増やしたら足す。追随は
    #   scripts/k8s-local-up.test.js の「ArgoCD の許可種別」が固定する。
    - group: "security.istio.io"
      kind: AuthorizationPolicy
    # #782: エッジ（ADR-0021 の Istio Ingress Gateway）。edge.enabled=true の本番像でレンダリングされる。
    - group: "networking.istio.io"
      kind: Gateway
    - group: "networking.istio.io"
      kind: VirtualService
