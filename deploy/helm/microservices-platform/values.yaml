# ADR-0007: Helm values — overrideable per environment
# ADR-0008: Kubernetes k3s runtime

global:
  image:
    registry: harbor.internal
    pullPolicy: IfNotPresent
  otel:
    endpoint: http://otel-collector:4317
  auth:
    authority: http://keycloak:8080/realms/platform
    # Issue #314, IADR-0076 手順B, IADR-0086: 単一エッジ host OIDC を CoreDNS/hosts 改変なしに成立させる任意配線。
    # 既定は空（未描画）＝手順A のまま authority 一本で metadata 取得＋issuer 検証を兼ねる（現行バイト等価・fail-safe）。
    # 手順B（edge.oidc.enabled=true で SPA/`/bff`/`/realms` を同一エッジ host に集約）では token の iss がエッジ host に
    # なるため、以下を設定して backend の metadata 取得先（in-cluster）と issuer 検証値（エッジ host）を分離する:
    #   metadataAddress: in-cluster から到達できる OIDC well-known（JWKS 取得先）。例:
    #     http://keycloak:8080/realms/platform/.well-known/openid-configuration
    #   validIssuers: token の iss として追加で受理する issuer（エッジ host）。カンマ/空白区切りで複数可。例:
    #     https://edge.example/realms/platform
    # issuer 検証は弱めない（ValidateIssuer=true・JWKS は in-cluster metadata 由来）。metadata 由来 issuer は常に受理
    # されるため、in-cluster issuer（手順A token）と併存する。
    metadataAddress: ""
    validIssuers: ""
  # NFR, ADR-0002, #1012: サービス DB（DB per Service）の接続。**資格情報をイメージへ焼かない。**
  # 各サービスの `appsettings.json` は接続文字列を持たず（#1012 で撤去）、未注入なら起動時に落ちる。
  # パスワードは Secret（existingSecret）から `$(DB_PASSWORD)` で補間する（値を chart に書かない）。
  db:
    host: postgres
    port: 5432
    user: kp
    # DB パスワードを保持する Secret（key=password）。scripts/k8s-local-up.sh が dev 既定で作成する。
    existingSecret: postgres-app
    passwordKey: password

  # NFR, ADR-0003（Superseded by ADR-0027・注記は #580）, ADR-0027, #1022: メッセージブローカ
  # （RabbitMQ）の接続。**資格情報をイメージへ焼かない**（DB と同型・#1012 の global.db に倣う）。
  # 各サービスの `appsettings.json` は `RabbitMq:ConnectionString` を持たず（#1022 で撤去）、
  # 未注入なら起動時に落ちる（注入漏れが「既定の資格情報で接続成功」へ倒れない）。
  # パスワードは Secret（existingSecret）から `$(RABBITMQ_PASSWORD)` で補間する（値を chart に書かない）。
  # ⚠️ `user` はブローカ側の Secret `rabbitmq`（platform-infra ns・key=username）と**一致させること**。
  #    ローカルは `k8s-local-up.sh` が env `RABBITMQ_USER` から両方を作る（既定 guest）。
  messaging:
    host: rabbitmq
    port: 5672
    user: guest
    # ブローカのパスワードを保持する Secret（key=password）。scripts/k8s-local-up.sh が dev 既定で作成する。
    existingSecret: rabbitmq-app
    passwordKey: password

  # FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: S3 互換オブジェクトストレージ（MinIO）接続。
  # 資格情報は Secret（existingSecret）経由で注入する（コミットしない。docs/security）。
  objectStorage:
    endpoint: http://minio:9000
    bucket: knowledge-normalized
    existingSecret: minio-credentials
    accessKeyKey: accessKey
    secretKeyKey: secretKey

# ADR-0008: k3s 実行基盤 — 配備先 Namespace。
# istio-injection: enabled により、この Namespace の Pod へサイドカーが自動注入される（段階2の前提）。
namespace:
  # チャート適用時に Namespace を作成するか（ArgoCD の CreateNamespace=true を使う場合は false でよい）。
  create: true
  name: microservices-platform
  # Istio サイドカー自動注入ラベル。mesh.enabled=true のとき有効化する。
  istioInjection: true

# ADR-0005: サービスメッシュ（Istio / mTLS）— サービス間通信を STRICT mTLS で暗号化・相互認証する。
# これをもって暫定運用（IADR-0017: ネットワーク分離を第一防御）を解消する（後継 IADR-0026）。
mesh:
  enabled: true
  # PeerAuthentication の mTLS モード。恒久像は STRICT（平文フォールバック無し）。
  # 実クラスタへの初回導入時は PERMISSIVE で移行を確認してから STRICT へ切り替える運用を推奨。
  mtlsMode: STRICT
  # NFR, SC-13, ADR-0026/ADR-0032, IADR-0273 (#1115): メッシュ**外**に居る認可サーバ（Keycloak）から
  # バックチャネルログアウトの 1 本だけを通す。STRICT のままでは要求が BFF に一度も届かず、
  # 「即時失効」がアクセストークンの寿命ぶん遅れる失効に縮退する（詳細は templates/istio-mtls.yaml）。
  # 🔴 **既定は false。** 認可サーバがメッシュ内に居る、またはエッジ経由で入る配備では不要であり、
  # 不要な平文の口を既定で開けない（開ける範囲は「principal 無し × 下記 path 以外は DENY」に絞られる）。
  backchannelLogout:
    fromOutsideMesh: false
    # 口を開けるワークロード（Pod ラベル `app`）と受信ポート、平文を許す唯一の URI。
    workload: bff-service
    port: 8080
    path: /bff/auth/backchannel-logout

# Issue #284, IADR-0076 / ADR-0005 / IADR-0017: エッジ /bff/* ルーティング（Istio Gateway/VirtualService）。
# 外部からの入口を BFF に一本化し、エッジ host の /bff/* を bff-service へ通す（rewrite 無し＝BFF は /bff プレフィックス前提）。
# mesh(Istio) 前提のため本番は enabled。ローカル（経路B, Istio 未導入）は values-local が false で無効化する。
edge:
  enabled: true
  # istioctl install 既定の ingressgateway。実運用のラベルに合わせて上書きする。
  gateway:
    selector:
      istio: ingressgateway
    # ingressgateway が居る Namespace（既定 istio-system）。networkPolicy 有効時、この Namespace から
    # bff-service への ingress を許可するため参照する（別 Namespace の gateway→bff が既定拒否で塞がれるのを防ぐ）。
    namespace: istio-system
  # エッジで受ける外部ホスト（Host ヘッダ）と待受ポート。実運用は "*" を FQDN に絞り、外部 TLS 終端
  # （HTTPS: Gateway の tls server or 前段 LB/ingressgateway 証明書）を別途追加する（本 chart のスコープ外）。
  hosts:
    - "*"
  port: 80
  # /bff/* の転送先（Service 名とポート）。既定は本チャートの bff-service:8080。
  bff:
    service: bff-service
    port: 8080
  # Issue #313, IADR-0078: SPA(frontend) の転送先。VirtualService の catch-all（/bff・/realms の後）で
  # 非 /bff の全パスを frontend-service へ流す。ルートは frontend.enabled のときのみ描画する（下記 frontend ブロック）。
  frontend:
    service: frontend-service
    port: 8080
  # ブラウザ OIDC issuer 統一の任意機構（既定 off）。有効化すると同一エッジ host の /realms・/resources を
  # Keycloak へ通し、ブラウザとサービス間で同一 issuer URL を共有できる（別ホスト運用時は不要。IADR-0076 決定3）。
  # Issue #314, IADR-0086: これを有効化して単一エッジ host に集約する場合、in-cluster のサービスは同エッジ host を
  # 解決できないため、CoreDNS 追記に代えて global.auth.metadataAddress / global.auth.validIssuers を設定すると
  # backend の metadata 取得先（in-cluster）と issuer 検証値（エッジ host）を分離でき、CoreDNS 無しで成立する。
  oidc:
    enabled: false
    host: keycloak
    port: 8080
  # FR-20, UC-11, ADR-0037 課題 2, IADR-0338 決定 4, IADR-0348 (#1154): Obsidian プラグインの
  # 同期プロトコル（/private-notes/sync/*）をエッジから DocumentService へ直接通す任意配線。
  #
  # 🔴 **既定は false（opt-in）。** どちら向きに壊れるかで決めている ——
  #   経路が無い側の失敗は**利用者に見える**（プラグインが即座に失敗する。#1154 そのものの形）。
  #   経路が余分にある側の失敗は**誰にも気付かれないまま**内部サービスの端点群が外に面する。
  #   egress 統制は default-deny（08_data-egress-policy）であり、見えない方向へは倒さない。
  #   露出面そのものは狭い（端点は同期トークンを自前検証し、所有者の個人資料に閉じる）が、
  #   fail-safe は「露出しても平気か」ではなく「間違いに気付けるか」で決める。
  #
  # 有効化すると、エッジ host の /private-notes/sync/* が下記 Service へ **rewrite 無しで**流れる
  # （公開パス ＝ 契約パス。プラグインの設定は基底 URL だけで済む）。前置文字列は templates/edge.yaml に
  # 直書きで、ここでは knob にしない（打ち間違いで露出面が広がる経路を作らないため）。
  # networkPolicy.enabled と併用するときは templates/networkpolicy.yaml が gateway → document-service の
  # 穴を同じ条件で開ける。
  privateNotesSync:
    enabled: false
    service: document-service
    port: 8080

# IADR-0017 フォローアップ: ClusterIP + NetworkPolicy（デフォルト拒否）を実体化。
# mesh(mTLS) 配下でも多層防御（defense-in-depth）として維持する（IADR-0026）。
networkPolicy:
  enabled: true

# ADR-0007: Harbor レジストリからの Pull に用いる imagePullSecrets（docker-registry 型 Secret 名）。
# Secret 本体はコミットしない。deploy/secrets/README.md の手順で事前作成する。
imagePullSecrets: []
  # - name: harbor-pull

# FR-14, ADR-0018, IADR-0028: 宣言的パイプライン構成（files/pipeline.json が正、CI スキーマ検証済み）。
# 段の有効/無効・購読の組み替えは pipeline.json の変更＋GitOps 適用のみで行う（コア改修なし）。
pipeline:
  enabled: true

# FR-15, IADR-0029 フォローアップ 3 (#144): 構成バージョン（適用中の構成定義の Git コミット ID・適用日時・
# 適用者）。BFF が構成情報 API（/bff/admin/config）の Version として返す。実値は GitOps（ArgoCD Application
# の helm.parameters / CD パイプラインの --set）から適用リビジョンで上書きする（deploy/argocd/application.yaml）。
# 既定は空（未注入）＝ appliedBy のみ argocd。手順は docs/operations/operations.md を参照。
config:
  gitCommit: ""
  appliedAt: ""
  appliedBy: "argocd"
  # FR-15, IADR-0046, IADR-0069 (#192): 構成バージョン履歴（新しい順）の GitOps 注入スライス。
  # 現在バージョンと同じ注入経路で BFF へ Config__History__<i>__{GitCommit,AppliedAt,AppliedBy,HadDrift} として
  # 供給する。正データ源は GitOps 層（Git ログ／ArgoCD リビジョン）で API は永続化しない（IADR-0046）。
  # 実値は CD 自動化が --helm-set config.history[i].* もしくは values-<env>.yaml で供給する（手順は
  # docs/operations/operations.md「構成バージョンの注入」）。既定は空＝未注入で、現在バージョン単一へ縮退する。
  history: []
  #   - gitCommit: ""       # 適用リビジョンの Git コミット SHA
  #     appliedAt: ""       # ISO 8601（UTC）
  #     appliedBy: "argocd"
  #     hadDrift: false     # その時点のドリフト有無（判明時のみ。省略=不明）

# FR-15, IADR-0029 フォローアップ 4 (#145): 適用直後のドリフト即時検出。
# 定期検出（既定 5 分）に加え、ArgoCD PostSync フック Job が毎同期後に BFF の
# POST /internal/config/drift-run を叩き、適用直後のドリフトを即時に検出・警告する。
# （宣言=pipeline.json の変更時は BFF がロールアウトし起動時検出でも捕捉されるが、本フックは
#  任意の同期後に一律で即時検出を起動する belt-and-suspenders。）
drift:
  postSyncHook:
    enabled: true
    # curl を含む軽量イメージ。mesh 有効時はサイドカーを注入し、curl 実行後に /quitquitquit で
    # Envoy を終了させて Job を完了させる（drift-postsync-job.yaml 参照）。起動待ちは --retry で吸収する。
    image: curlimages/curl:8.11.1

# NFR (#197): 水平スケール（HPA）と可用性（PDB）。計画 NFR「HPA で水平スケール」「可用性 99.9%」の実現手段。
# metrics-server が必要（k3s は既定同梱）。対象はステートレスな要求処理サービス（下記 services リスト）。
# 段階適用: まず要求処理系を minReplicas:2 + PDB とする。キュー駆動ワーカー（conversion/ingestion=worker:true）は
# 競合コンシューマで水平化可能だが CPU HPA が不適なため対象外とし、負荷実測（#196）後に個別方針で順次追加する。
# HPA 対象サービスは Deployment に静的 replicas を持たず HPA が所有する（deployment.yaml 参照）。
scaling:
  enabled: true
  # HPA/PDB を適用するサービス（Deployment 名 = <key>-service）。ワーカー（conversion/ingestion）は含めない。
  services:
    - bff
    - retrieval
    - authorization
    - aianalysis
    - document
    - datasource
    - dashboard
    - feedback
    - wiki
    - llmgateway
  hpa:
    minReplicas: 2
    maxReplicas: 4
    # requests.cpu に対する平均使用率の目標。超過でスケールアウトする。
    targetCPUUtilizationPercentage: 70
  pdb:
    # 自発的中断時に維持する最小可用レプリカ数（minReplicas:2 なら 1 台までの同時退避を許容）。
    minAvailable: 1

services:
  document:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    database: document_svc
    enabled: true
    replicas: 1
    image: microservices-platform/document-service
    tag: latest
    # NFR, #1022: ブローカへ接続する。設定した分だけ RabbitMq__ConnectionString が描画される。
    messaging: true
    # FR-14, IADR-0028: パイプライン段（catalog 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    # FR-21, ADR-0014/ADR-0015, IADR-0264, IADR-0284 決定 5 (#992): 本文の直接受け入れ経路が
    # 正規化 Markdown を格納する先（MinIO）。**これが無いと本文が永続化されない** ——
    # `AddPlatformObjectStorage` は未設定時に `NullObjectStorageClient` へ縮退し、
    # 決定的な `storage://` URI を返すだけで実体を書かない。`MarkdownUri` は立つので
    # 取り込みの早期 return は通過するが、IngestionService が本文を読めない
    # （`GetTextAsync` が不在オブジェクトで失敗する）。**「入口は通ったのに索引されない」**という
    # 最も分かりにくい壊れ方になるため、実装（Program.cs）に合わせてここで配線する。
    # バケットの作成は ConversionService の bootstrap が担う（同じバケットを 2 か所から作らない）。
    objectStorage: true
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  datasource:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    database: datasource_svc
    enabled: true
    replicas: 1
    image: microservices-platform/datasource-service
    tag: latest
    # NFR, #1022: ブローカへ接続する。設定した分だけ RabbitMq__ConnectionString が描画される。
    messaging: true
    port: 8080
    # FR-01, IADR-0051: 実コネクタが取得した原本を MinIO へ格納する（書き込み側）。未設定時は縮退。
    # 実 filesystem 同期は対象ファイル共有（SMB/NFS）を PVC 等でマウントする必要がある（ops 手順・operations.md）。
    objectStorage: true
    # FR-01, UC-04, NFR(15分以内反映), IADR-0051, IADR-0074 (#299): 定期同期ワーカーの本番有効化。
    # 反映総遅延 = 検出遅延(≤間隔) + 下流パイプライン遅延。間隔 300 秒(5 分)で検出 ≤5 分・下流に ≥10 分の
    # 予算を残し NFR「15 分以内反映」を余裕充足する（下流実測 #196 後に調整可）。実効間隔はワーカーが最短
    # 30 秒へ丸める（過負荷防止）。fail-safe: watermark は完全成功時のみ前進・失敗は縮退・継続失敗は Alert=true。
    # 無効化(ロールバック)は services.datasource.dataSourceSync.enabled=false（手動 /sync は不変）。
    dataSourceSync:
      enabled: true
      intervalSeconds: 300
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  conversion:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    database: conversion_svc
    enabled: true
    replicas: 1
    image: microservices-platform/conversion-service
    tag: latest
    # NFR, #1022: ブローカへ接続する。設定した分だけ RabbitMq__ConnectionString が描画される。
    messaging: true
    # FR-14, IADR-0028: パイプライン段（convert 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    # FR-12, ADR-0015: 正規化本文・資産を MinIO へ保管する（書き込み側）。
    objectStorage: true
    # FR-15, IADR-0029 (#142): 自己申告（/internal/introspection）用の最小 HTTP サーフェス。
    # port を持つと Service が生成され BFF が到達できる。worker=true は HTTP ヘルスプローブを抑止する
    # （バックグラウンドワーカーは /health/* を持たず、可用性判定に HTTP プローブが不適なため）。
    port: 8080
    worker: true
    # FR-02, FR-03, ADR-0016, #995: 埋め込みゲートウェイの宛先。
    # 🔴 **k8s の Service 名は `llmgateway-service` である**（chart のキー `llmgateway` ＋ `-service`）。
    # コード既定・appsettings の `http://llm-gateway:...` は **compose のサービス名**であり、
    # k8s には同名の Service も ExternalName エイリアスも無い。上書きが無いと名前解決に失敗する。
    extraEnv:
      - name: Services__LlmGateway
        value: "http://llmgateway-service:8080"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  ingestion:
    enabled: true
    replicas: 1
    image: microservices-platform/ingestion-service
    tag: latest
    # NFR, #1022: ブローカへ接続する。設定した分だけ RabbitMq__ConnectionString が描画される。
    messaging: true
    # FR-14, IADR-0028: パイプライン段（ingest 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    # FR-06: storage:// 本文を MinIO から実取得する（読み取り側）。
    objectStorage: true
    # FR-15, IADR-0029 (#142): 自己申告（/internal/introspection）用の最小 HTTP サーフェス。
    # port を持つと Service が生成され BFF が到達できる。worker=true は HTTP ヘルスプローブを抑止する
    # （バックグラウンドワーカーは /health/* を持たず、可用性判定に HTTP プローブが不適なため）。
    port: 8080
    worker: true
    # FR-02, FR-03, ADR-0016, #995: 埋め込みゲートウェイの宛先。
    # 🔴 **k8s の Service 名は `llmgateway-service` である**（chart のキー `llmgateway` ＋ `-service`）。
    # コード既定・appsettings の `http://llm-gateway:...` は **compose のサービス名**であり、
    # k8s には同名の Service も ExternalName エイリアスも無い。上書きが無いと名前解決に失敗する。
    extraEnv:
      - name: Services__LlmGateway
        value: "http://llmgateway-service:8080"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  retrieval:
    enabled: true
    replicas: 1
    image: microservices-platform/retrieval-service
    tag: latest
    # FR-14, IADR-0028 / #1016: パイプライン段（retrieval-delete 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    # NFR, #1022: ブローカへ接続する。設定した分だけ RabbitMq__ConnectionString が描画される。
    messaging: true
    port: 8080
    # FR-02, FR-03, ADR-0016, #995: 埋め込みゲートウェイの宛先。
    # 🔴 **k8s の Service 名は `llmgateway-service` である**（chart のキー `llmgateway` ＋ `-service`）。
    # コード既定・appsettings の `http://llm-gateway:...` は **compose のサービス名**であり、
    # k8s には同名の Service も ExternalName エイリアスも無い。上書きが無いと名前解決に失敗する。
    extraEnv:
      - name: Services__LlmGateway
        value: "http://llmgateway-service:8080"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  aianalysis:
    enabled: true
    replicas: 1
    image: microservices-platform/aianalysis-service
    tag: latest
    port: 8080
    # FR-04, UC-01: 下流サービスの接続先（HTTP クライアント・readiness の UriHealthCheck）。
    # appsettings 既定はローカル用ポート（5003/5007）のため、k8s Service の実 DNS（:8080）へ上書きする。
    # llm-gateway の Service 名は llmgateway-service（chart のキー llmgateway 由来）である点に注意。
    extraEnv:
      # FR-13 / IADR-0089 / #958: ABAC の許可スコープ解決の宛先。コード既定 :5005 は開いていない。
      - name: Services__AuthorizationService
        value: "http://authorization-service:8080"
      - name: Services__RetrievalService
        value: "http://retrieval-service:8080"
      - name: Services__LlmGateway
        value: "http://llmgateway-service:8080"
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }

  authorization:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    database: authz_svc
    enabled: true
    replicas: 1
    image: microservices-platform/authorization-service
    tag: latest
    port: 8080
    # SC-17, IADR-0301 決定 3 (#452) / IADR-0329 (#1101): 利用者アカウント管理の反映先。
    # **既定は無く、宣言が必須**（未設定なら Pod が起動時に落ちる）。
    #
    # 🔴 **[#1101] 暫定は解消した。実 IdP（Keycloak Admin REST）へ反映する。**
    #    `in-memory` だった間、SC-17 の無効化・ロール変更・属性変更は Pod のプロセス内にしか残らず、
    #    画面は成功を返し続けた（**反映したつもりで消える**静かな縮退）。realm へ機密クライアント
    #    `identity-admin`（`realm-management` の view-users / manage-users / view-realm のみ）を
    #    登録し、ここを `keycloak` へ移した。
    #    **`in-memory` は Development 以外では起動失敗になる**（IdentityAdminRegistration）ので、
    #    ここを戻すと Pod が起動しない —— 静かな縮退へは二度と落ちない。
    #
    # 🔴 **ClientSecret は Secret 由来で、既定値を持たない**（global.db / global.messaging と同型）。
    #    secretKeyRef は **非 optional** なので、Secret が無ければ Pod は起動しない
    #    （供給は deploy/local/vault/eso/externalsecret-identity-admin-oidc.yaml、または
    #    ESO 未使用時は scripts/k8s-local-up.sh の手動 apply）。
    extraEnv:
      - name: IdentityAdmin__Provider
        value: "keycloak"
      # in-cluster の正準名（MSP ns の ExternalName エイリアス `keycloak` → platform-infra）。
      # **issuer 用の Auth__Authority とは別物**である —— こちらは Admin REST の基底 URL であり、
      # `/admin/realms/...` と `/realms/<realm>/protocol/openid-connect/token` を後置する。
      - name: IdentityAdmin__Keycloak__BaseUrl
        value: "http://keycloak:8080"
      - name: IdentityAdmin__Keycloak__Realm
        value: "platform"
      - name: IdentityAdmin__Keycloak__ClientId
        value: "identity-admin"
      - name: IdentityAdmin__Keycloak__ClientSecret
        secretKeyRef:
          name: identity-admin-oidc
          key: client-secret
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-13, UC-07, ADR-0011, IADR-0020: WikiService は「同期・統合・ABAC ゲートウェイ」責務。
  # 閲覧・編集の実体は Wiki.js（下記 wikijs ブロック）へ委譲。ABAC は本サービスが前段で強制する。
  wiki:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    database: wiki_svc
    enabled: true
    replicas: 1
    image: microservices-platform/wiki-service
    tag: latest
    # NFR, #1022: ブローカへ接続する。設定した分だけ RabbitMq__ConnectionString が描画される。
    messaging: true
    # FR-14, IADR-0028: パイプライン段（wiki-sync / wiki-delete 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    port: 8080
    # FR-06: storage:// 本文を MinIO から実取得し Wiki.js へ push する（読み取り側）。
    objectStorage: true
    # IADR-0021: Wiki.js への同期（GraphQL push）先とサービスアカウント API キー。
    # API キーは Secret 経由で注入（コミットしない。事前に kubectl/ArgoCD で作成する。docs/security）。
    extraEnv:
      # FR-05 / IADR-0089 / #958: ABAC の許可スコープ解決の宛先。コード既定 :5005 は開いていない。
      - name: Services__AuthorizationService
        value: "http://authorization-service:8080"
      - name: WikiJs__GraphQlEndpoint
        value: "http://wiki-js:3000/graphql"
      - name: WikiJs__ApiKey
        secretKeyRef:
          name: wikijs-sync
          key: apiKey
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  llmgateway:
    enabled: true
    replicas: 1
    image: microservices-platform/llm-gateway
    tag: latest
    port: 8080
    # FR-02, ADR-0017, IADR-0025, IADR-0085 (#303): セルフホスト埋め込み（Ruri v3）の配線対象。
    # embedding.enabled=true のとき deployment.yaml が Embedding__SelfHosted__BaseUrl と
    # Embedding__Routing__Endpoints__1__Enabled=true を注入する。既定は embedding.enabled=false で非描画＝現状維持。
    selfHostedEmbedding: true
    # FR-11, ADR-0010 (#308): 外部マネージド LLM（Anthropic）の API キーを LlmGateway へ配線する。
    # 鍵は MSP 側で集中管理する（ADR-0010）。API キーは Secret 経由で注入し、リポジトリにコミットしない
    # （wiki の WikiJs__ApiKey と同型）。本 Secret は秘匿管理（Vault / External Secrets）で本番環境へ供給する
    # （事前に kubectl/ArgoCD/ESO で作成。docs/security・#310 の一元追跡）。実キー投入・実 LLM 疎通は go-live 側。
    extraEnv:
      - name: Llm__ApiKey
        secretKeyRef:
          name: llm-provider-credentials
          key: anthropic-api-key
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-10, UC-05, IADR-0011: 利用状況・検索傾向・回答品質ダッシュボード集計サービス
  dashboard:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    database: dashboard_svc
    enabled: true
    replicas: 1
    image: microservices-platform/dashboard-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-17, UC-10, ADR-0033/ADR-0034 (#908/#957): 知識グラフ（ノード・辺・辺の型辞書）。
  # 🔴 chart のキーは `graph` である（Service 名は deployment.yaml が {{ $name }}-service を組むため
  # graph-service になり、BFF の Services__GraphService（http://graph-service:8080）と一致する）。
  graph:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    database: graph_svc
    enabled: true
    replicas: 1
    image: microservices-platform/graph-service
    tag: latest
    # NFR, #1022: ブローカへ接続する。設定した分だけ RabbitMq__ConnectionString が描画される。
    messaging: true
    # FR-14, IADR-0028 / #1016: パイプライン段（graph-delete 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    port: 8080
    # FR-17, ADR-0033 決定 8 / #912: リンク抽出のため storage:// 本文を MinIO から実取得する
    # （読み取り側。バケット作成は書き込み側の ConversionService が担う）。
    objectStorage: true
    # FR-17, FR-05, IADR-0089 (#342) / #958: ABAC スコープ解決先。appsettings 既定は :5005（ローカル用）で、
    # ここで上書きしないと不達 → GraphAccessResolver が Granted=false へ縮退し、**グラフが常に空になる**。
    # 状態コードにも出ないため live で気付けない（#958 に同型 2 件の記録）。
    extraEnv:
      - name: Services__AuthorizationService
        value: "http://authorization-service:8080"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-22, ADR-0045, IADR-0215, IADR-0288 (#1025): 利用者本人への通知の送出主体。
  # 🔴 **chart のキーは `notification` である**（deployment.yaml / service.yaml が {{ $name }}-service を
  # 組むため Service 名は notification-service になり、送出側 DocumentService のコード既定
  # `http://notification-service:8080` と文字列一致する）。キーを変えると
  # services.document.extraEnv へ Services__NotificationService の上書きが要る ——
  # **送出は fail-open のため、上書きを落としても 502 にすらならず静かに落ちる**（IADR-0288 決定 1）。
  # ⚠️ AST chart も同名 `notification` を持つ。到達経路は namespace で分離済みで
  #    （MSP ns に notification-service の ExternalName alias は無い）、
  #    check-unit-service-ownership.js の NAME_COLLISION_EXEMPT で通す（IADR-0288 決定 2）。
  notification:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    # DB 実体は deploy/local/infra/postgres.yaml の init が作る（compose 側は create-multiple-dbs.sh）。
    database: notification_svc
    enabled: true
    # 🔴 **1 から増やさない。** NotificationMaintenanceHostedService が保持期限切れの削除と
    # メール outbox の送出を 5 分周期で回す。レプリカを増やすと同じ outbox を複数レプリカが同時に
    # 処理し、送信上限（ADR-0045 決定 3。テナント全体で 1 つの資源）の数え方が割れる。
    # 同じ理由で scaling.services にも入れない（conversion / ingestion / graph と同じ扱い）。
    replicas: 1
    image: microservices-platform/notification-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-16, UC-09, SC-12, ADR-0021/ADR-0024 (#452): MCP サーバー。外部 AI エージェント向けの
  # エッジ集約（/mcp）と、管理 REST（/mcp-clients*。SC-12 の後段）を持つ。
  # 🔴 **chart のキーは `mcp` である**（deployment.yaml / service.yaml が {{ $name }}-service を
  # 組むため Service 名は mcp-service になり、BFF のコード既定 `http://mcp-service:8080` と
  # 文字列一致する）。キーを `mcp-server` にすると Service 名は mcp-server-service になり不達になる。
  # キーを変えるなら services.bff.extraEnv へ Services__McpServer の上書きが要る
  # （check-bff-downstreams.js が実効ポートを、この一致は人が守る）。
  mcp:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    # DB 実体は deploy/local/infra/postgres.yaml の init が作る（compose 側は create-multiple-dbs.sh）。
    database: mcp_svc
    enabled: true
    replicas: 1
    image: microservices-platform/mcp-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-08: 回答へのフィードバック（👍/👎・コメント）収集サービス
  feedback:
    # NFR, #1012: サービス DB 名。設定した分だけ ConnectionStrings__DefaultConnection が描画される。
    database: feedback_svc
    enabled: true
    replicas: 1
    image: microservices-platform/feedback-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # Issue #283, AST/FR-17, AST/UC-06, IADR-0070: AST 設定画面（全体前提条件）の BFF 先＝ConfigurationService。
  # 既定 disabled（fail-safe）— 実行時依存（専用 DB configuration_svc・trading-owner realm・実イメージ）は稼働
  # クラスタ前提のため、稼働導入（enabled: true＋DB プロビジョニング＋Secret）は後続 issue で行う。
  # イメージは k8s-local-images.sh が AST 単一 Dockerfile＋build args でビルド供給する（MAPPING・#275 整合済み）。
  # 有効化時: helm template/CD で services.configuration.enabled=true を渡すと Deployment/Service が描画される。
  configuration:
    enabled: false
    replicas: 1
    image: microservices-platform/configuration-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # Issue #287, FR-14, IADR-0071: AST リスク設定（AST/SC-02）・統制状態参照（AST/SC-03）の BFF 先＝RiskManagementService。
  # 既定 disabled（fail-safe）— 実行時依存（専用 DB risk_management_svc・RabbitMQ・trading-owner realm・実イメージ）は
  # 稼働クラスタ前提のため、稼働導入（enabled: true＋DB/RabbitMQ プロビジョニング＋Secret）は後続 live issue #284 で行う。
  # イメージは k8s-local-images.sh が AST 単一 Dockerfile＋build args でビルド供給する（MAPPING・#275 整合済み）。
  # 有効化時: helm template/CD で services.risk-management.enabled=true を渡すと Deployment/Service が描画される。
  # キーは risk-management（テンプレートが {name}-service を付す）＝Service 名 risk-management-service を
  # compose のサービス名・BFF 既定（http://risk-management-service:8080）と一致させる。
  risk-management:
    enabled: false
    replicas: 1
    image: microservices-platform/risk-management-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # Issue #288, FR-14, IADR-0072: AST 監視銘柄（AST/SC-02 watchlist）の BFF 先＝MarketMonitorService。
  # 既定 disabled（fail-safe）— 実行時依存（専用 DB market_monitor_svc・RabbitMQ・trading-owner realm・実イメージ）は
  # 稼働クラスタ前提のため、稼働導入（enabled: true＋DB/RabbitMQ プロビジョニング＋Secret）は後続 live issue #284 で行う。
  # イメージは k8s-local-images.sh が AST 単一 Dockerfile＋build args でビルド供給する（MAPPING・#275 整合済み）。
  # 有効化時: helm template/CD で services.market-monitor.enabled=true を渡すと Deployment/Service が描画される。
  # キーは market-monitor（テンプレートが {name}-service を付す）＝Service 名 market-monitor-service を
  # compose のサービス名・BFF 既定（http://market-monitor-service:8080）と一致させる。
  market-monitor:
    enabled: false
    replicas: 1
    image: microservices-platform/market-monitor-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  bff:
    enabled: true
    replicas: 1
    image: microservices-platform/bff
    tag: latest
    port: 8080
    # FR-15, IADR-0029, #146: BFF は段をホストしないが、ドリフト検出の突合基準として宣言（pipeline.json）を
    # 必要とする。pipelineDeclaration=true で pipeline-config ConfigMap をマウントし Pipeline__ConfigPath を注入する。
    # これが無いと BFF の宣言が空になり、実効の全購読が UndeclaredSubscription と誤判定される。
    pipelineDeclaration: true
    # FR-15, IADR-0029 (#144): BFF へ構成バージョン（config.*）を注入する（Config__GitCommit 等）。
    configVersion: true
    # NFR, SC-13, ADR-0026/ADR-0032, IADR-0251/IADR-0273, #1107: BFF セッション（Token Handler 方式）。
    # ADR-0032 は「BFF がコンフィデンシャルクライアントとして Keycloak と通信する」ことを決めており、
    # **client secret の注入は任意配線ではなく前提**である。注入が無いと login が 500 で落ちる。
    # 資格情報は Secret（existingSecret, key=clientSecretKey）経由で注入する（値をチャートに書かない。
    # minio.oidc / global.db / global.messaging と同じ形）。Secret はローカルでは scripts/k8s-local-up.sh が
    # 作り、ESO=1 では Vault→ExternalSecret（deploy/local/vault/eso/externalsecret-bff-oidc.yaml）が供給する。
    # ⚠️ 値は realm の `bff` クライアントの secret と**一致させること**（ズレると PAR 端点が 401 を返す）。
    # このブロックの有無が、client secret の注入と転送ヘッダの解釈（ASPNETCORE_FORWARDEDHEADERS_ENABLED）を
    # まとめて切り替える —— **ブラウザ向けの OIDC 往復を行うのは BFF だけ**だからである。
    session:
      clientId: bff
      existingSecret: bff-oidc
      clientSecretKey: client-secret
    # FR-15, IADR-0029, Issue #118 監査: 構成情報 API の自己申告収集先。appsettings 既定は
    # ローカル実行用ポート（5001/5006）のため、k8s Service の実ポート（8080）を上書き注入する。
    extraEnv:
      - name: Introspection__Services__document-service
        value: "http://document-service:8080"
      - name: Introspection__Services__wiki-service
        value: "http://wiki-service:8080"
      # FR-15, IADR-0029 フォローアップ 1 (#142): conversion/ingestion ワーカーの自己申告収集先。
      # これで convert/ingest 段が Unverifiable でなくなり、適用漏れ検出が実効化する。
      - name: Introspection__Services__conversion-service
        value: "http://conversion-service:8080"
      - name: Introspection__Services__ingestion-service
        value: "http://ingestion-service:8080"
      # FR-15, IADR-0029 フォローアップ 2 (#143): 全 HTTP サービスへ introspection を横展開したため
      # 収集先へ追加。値は k8s Service の DNS 名（llm-gateway の Service 名は llmgateway-service）。
      - name: Introspection__Services__retrieval-service
        value: "http://retrieval-service:8080"
      - name: Introspection__Services__aianalysis-service
        value: "http://aianalysis-service:8080"
      - name: Introspection__Services__authorization-service
        value: "http://authorization-service:8080"
      - name: Introspection__Services__dashboard-service
        value: "http://dashboard-service:8080"
      - name: Introspection__Services__datasource-service
        value: "http://datasource-service:8080"
      - name: Introspection__Services__feedback-service
        value: "http://feedback-service:8080"
      # FR-15/FR-17: グラフ同期・削除伝播の段を担う graph-service を収集先へ追加（宣言実効性テストが検出）。
      - name: Introspection__Services__graph-service
        value: "http://graph-service:8080"
      - name: Introspection__Services__llm-gateway
        value: "http://llmgateway-service:8080"
      # FR-22, IADR-0288 決定 5 (#1025): NotificationService は段を持たないが
      # AddPlatformIntrospection("notification-service", …) で**到達可能性を申告する**。
      # 申告する側が居るのに収集側に無いと、その申告は永久に読まれない。
      # 🔴 **下記の Services__* への上書きは不要である**（#600 で /bff/notifications* が入り BFF は
      # 通知の下流を持つようになったが、named client のコード既定が既に :8080 のため上書きが要らない）。
      # **readiness の UriHealthCheck へは足さない** —— 通知は Should であり、後段の不調で
      # BFF 全体を not-ready にするのは fail-safe の後退である（IADR-0346 決定 6）。
      - name: Introspection__Services__notification-service
        value: "http://notification-service:8080"
      # FR-04/FR-08/FR-10, UC-01: BFF の下流集約先（Refit クライアント・readiness の UriHealthCheck）。
      # appsettings 既定はローカル用ポート（5001-5009）のため、k8s Service の実 DNS（:8080）へ上書きする。
      - name: Services__RetrievalService
        value: "http://retrieval-service:8080"
      - name: Services__AiAnalysisService
        value: "http://aianalysis-service:8080"
      - name: Services__DocumentService
        value: "http://document-service:8080"
      - name: Services__AuthorizationService
        value: "http://authorization-service:8080"
      - name: Services__WikiService
        value: "http://wiki-service:8080"
      - name: Services__FeedbackService
        value: "http://feedback-service:8080"
      - name: Services__DashboardService
        value: "http://dashboard-service:8080"
      # FR-01/FR-02, UC-04, SC-06, IADR-0089 (#342): データソース管理の下流集約先。appsettings/コード既定は
      # ローカル用ポート（5002）のため k8s Service の実 DNS（:8080）へ上書きする。この上書きが無いと BFF は
      # datasource-service:5002 を叩き、ClusterIP に該当ポートが無く SYN がブラックホール化して ≈21 秒で
      # タイムアウト → /bff/datasources が 502 になる（他 6 downstream と同型の上書き漏れが live で顕在化）。
      - name: Services__DataSourceService
        value: "http://datasource-service:8080"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

# FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: S3 互換オブジェクトストレージ（MinIO）。
# 本文・資産の実体を保管する。資格情報は Secret（existingSecret, key=accessKey/secretKey）経由で注入する
# （コミットしない。事前に kubectl/ArgoCD で作成する。docs/security/security.md）。
# IADR-0017/IADR-0024: API は ClusterIP のみで Ingress を張らず、直接公開しない（ABAC 強制サービス経由）。
minio:
  enabled: true
  replicas: 1
  registry: docker.io
  image: minio/minio
  tag: "RELEASE.2025-04-08T15-41-24Z"
  port: 9000
  consolePort: 9001
  existingSecret: minio-credentials
  accessKeyKey: accessKey
  secretKeyKey: secretKey
  # IADR-0093 (#353): MinIO Console の Keycloak OIDC(SSO)。既定 disabled ＝本番 values は byte 等価（env 未描画）。
  # 経路B は values-local で enabled にする。root(minio-credentials) は break-glass として残る（fail-safe）。
  oidc:
    enabled: false
    configUrl: ""            # 例: http://keycloak:8080/realms/platform/.well-known/openid-configuration
    clientId: minio
    existingSecret: minio-oidc
    clientSecretKey: client-secret
    scopes: "openid,profile,email"
    claimName: policy        # MinIO はこのクレーム値に一致する MinIO ポリシーを適用（未一致は deny＝fail-safe）
    browserRedirectUrl: ""   # 例: https://minio.localhost:50000（Console 公開 URL・OIDC redirect の基準）
  persistence:
    enabled: true
    size: 20Gi
    # storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# FR-02, FR-03, ADR-0017, IADR-0025, IADR-0085 (#303): セルフホスト埋め込み推論基盤（Ruri v3 / 768 次元）。
# 高機密（confidential/restricted）はティアA=セルフホスト固定。本ブロックは案 A のインフラを opt-in で用意する。
# 既定 enabled=false ＝現行 fail-closed 維持（後方互換）。有効化すると templates/embedding.yaml が TEI（OpenAI 互換
# /v1/embeddings）を配備し、deployment.yaml が llmgateway へ BaseUrl と selfhosted エンドポイント有効化を注入する。
# 第三者 pull イメージ（build 無し）＝#275 ドリフト検査の対象外。
# ⚠️ 実モデル取得・GPU/CPU リソース・実埋め込み疎通・nDCG@10 実測は稼働環境依存＝分離（IADR-0085 / #303）。
# 既定 tag / modelId はプレースホルダ。実運用前に稼働環境で固定する。
embedding:
  enabled: false
  replicas: 1
  registry: ghcr.io
  image: huggingface/text-embeddings-inference
  # 実運用前に固定するプレースホルダ（CPU 版の例。GPU 版は cuda-* タグへ差し替える）。
  tag: "cpu-1.5"
  # ADR-0017: Ruri v3（768 次元）。実モデル取得は稼働環境依存。
  modelId: "cl-nagoya/ruri-v3-310m"
  # TEI 追加起動引数（例: ["--dtype", "float16"]）。既定なし。
  extraArgs: []
  # コンテナ待受ポート（TEI 既定は 80）。Service port と分離し targetPort で束ねる。
  containerPort: 80
  # llmgateway が参照する Service ポート（Embedding__SelfHosted__BaseUrl=http://embedding-service:<port>）。
  # 8080 は本プラットフォームの Service ポート慣習（各アプリサービスの Service と同値・DNS 名で分離）に合わせた意図的な採番。
  port: 8080
  resources:
    requests: { cpu: 500m, memory: 1Gi }
    limits: { cpu: 2000m, memory: 4Gi }

  # FR-02, FR-03, ADR-0016, IADR-0284, IADR-0313 (#992 案 2): **決定的ローカル埋め込み**（ティアA）。
  #
  # 🔴 **使い捨ての検証スタック専用である。** 有効にすると、取り込みと検索クエリの埋め込みが
  # LlmGateway のプロセス内計算（文字 3-gram のハッシング）へ切り替わる。表層の重なりしか見ないため
  # **意味的な近さは無く、検索品質を評価する用途には使えない**。実モデルは ADR-0017 が定める。
  #
  # なぜ在るのか: 統合スタックには埋め込みの鍵が無く、取り込みは Embedded=false のチャンクを
  # 索引しない（fail-closed）。索引に 1 点も入らないので `POST /bff/search` は
  # 「検索が壊れている」ときと同じ `200 ＋ 空` を返し、**壊れていても緑になる**（#992）。
  #
  # 🔴 **越境判定（機密区分 × ティア）は 1 バイトも緩めていない。** 本経路は HTTP を行わず
  # プロセス内で計算するため、ティアA（社外送信なし）の定義をそのまま満たす。
  #
  # 既定 enabled=false ＝ 非描画（本ブロックは現行 manifest とバイト等価）。
  deterministicLocal:
    enabled: false
    # 🔴 値は LlmGateway の appsettings.json（Embedding:Routing:Endpoints の deterministic-local）と
    # **一致していなければならない**。ここが取り込み側のコレクション作成・検索側の参照先を決めるため、
    # ずれると「索引はされるが検索が別のコレクションを見る」＝ 0 件で静かに落ちる。
    # 整合は scripts/k8s-local-up.test.js が静的に固定する。
    collection: knowledge_chunks_deterministic_v1
    dimensions: 1024

# FR-13, UC-07, ADR-0011, IADR-0020: Wiki.js（閲覧・編集 UI の実体）。専用 DB `wikijs`（Postgres）。
# 認証は Keycloak(OIDC)。ABAC は WikiService ゲートウェイが前段で強制するため、Wiki.js への直接到達は
# 塞ぐ（Ingress は既定で無効。公開する場合も WikiService ゲートウェイ経由に限定する。IADR-0017/IADR-0020）。
# DB パスワードは Secret 経由（コミットしない。docs/security/security.md）。
wikijs:
  enabled: true
  replicas: 1
  registry: ghcr.io
  image: requarks/wiki
  # IADR-0088 (#320): 再現性のため浮動 major タグ `2` を実運用版 `2.5` へ固定する（再デプロイ安全性）。
  tag: "2.5"
  port: 3000
  db:
    type: postgres
    host: postgres
    port: 5432
    user: kp
    name: wikijs
    # DB パスワードを保持する Secret（key=password）。事前に kubectl/ArgoCD で作成する。
    existingSecret: wikijs-db
    passwordKey: password
  persistence:
    enabled: true
    size: 5Gi
    # storageClass: ""
  ingress:
    enabled: false
    className: nginx
    host: wiki.microservices-platform.local
    tls: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# FR-14, IADR-0056, IADR-0078 (#313): SPA(frontend)。platform/frontend の nginx イメージ（静的配信＋/bff
# プロキシ＋実行時 config.js 注入）を k8s で配信する。汎用 services ループに載せず専用 template
# (templates/frontend.yaml) で描画する（wikijs/minio と同じ非 .NET パターン）。イメージは
# global.image.registry を接頭辞に使う（本番=harbor、経路B=k3d-local）。#275 MAPPING に登録済み。
# 外部からの入口はエッジ（edge ブロックの VirtualService catch-all → frontend-service）。
frontend:
  enabled: true
  replicas: 1
  image: microservices-platform/frontend
  tag: latest
  # nginx 待受ポート（src/platform/frontend/Dockerfile の EXPOSE 8080）。
  port: 8080
  # nginx /bff プロキシの上流（in-cluster BFF）。edge.frontend/edge.bff と同じ bff-service を指す。
  bffUpstream: http://bff-service:8080
  # ブラウザから見た BFF ベース URL（同一オリジンの nginx プロキシ）。compose と同値。
  bffBaseUrl: /bff
  oidc:
    # ブラウザが到達する OIDC issuer。本番は外部公開する Keycloak の URL（エッジ host 経由なら IADR-0076
    # 決定3 の /realms パススルー）を per-env で上書きする。既定はサービス間と同じ in-cluster 値だが、
    # ブラウザ到達性のため実運用では必ず外部到達可能な URL へ上書きすること（config.gitCommit 等と同じ placeholder）。
    authority: http://keycloak:8080/realms/platform
    clientId: platform-spa
  # 任意の追加 env（config.js の GRAFANA_URL / JAEGER_URL / KIALI_URL / WIKI_BASE_URL 等）。既定は空で、
  # 40-render-config.sh が未設定を空文字にフォールバックし SC-10 の外部ツール導線を画面に出さない。compose は
  # dev の Grafana(3000) を直挿しするが、k8s は可観測性/外部 UI を経路B の opt-in オーバーレイ（ADR-0006・
  # IADR-0077）に委ねる方針のため既定で未配線とする（配線したい環境は extraEnv で URL を供給する。IADR-0078）。
  extraEnv: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
