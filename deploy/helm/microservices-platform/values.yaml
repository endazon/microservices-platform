# ADR-0007: Helm values — overrideable per environment
# ADR-0008: Kubernetes k3s runtime

global:
  image:
    registry: harbor.internal
    pullPolicy: IfNotPresent
  otel:
    endpoint: http://otel-collector:4317
  auth:
    authority: http://keycloak:8080/realms/microservices-platform
  # FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: S3 互換オブジェクトストレージ（MinIO）接続。
  # 資格情報は Secret（existingSecret）経由で注入する（コミットしない。docs/security）。
  objectStorage:
    endpoint: http://minio:9000
    bucket: knowledge-normalized
    existingSecret: minio-credentials
    accessKeyKey: accessKey
    secretKeyKey: secretKey

# ADR-0008: k3s 実行基盤 — 配備先 Namespace。
# istio-injection: enabled により、この Namespace の Pod へサイドカーが自動注入される（段階2の前提）。
namespace:
  # チャート適用時に Namespace を作成するか（ArgoCD の CreateNamespace=true を使う場合は false でよい）。
  create: true
  name: microservices-platform
  # Istio サイドカー自動注入ラベル。mesh.enabled=true のとき有効化する。
  istioInjection: true

# ADR-0005: サービスメッシュ（Istio / mTLS）— サービス間通信を STRICT mTLS で暗号化・相互認証する。
# これをもって暫定運用（IADR-0017: ネットワーク分離を第一防御）を解消する（後継 IADR-0026）。
mesh:
  enabled: true
  # PeerAuthentication の mTLS モード。恒久像は STRICT（平文フォールバック無し）。
  # 実クラスタへの初回導入時は PERMISSIVE で移行を確認してから STRICT へ切り替える運用を推奨。
  mtlsMode: STRICT

# Issue #284, IADR-0076 / ADR-0005 / IADR-0017: エッジ /bff/* ルーティング（Istio Gateway/VirtualService）。
# 外部からの入口を BFF に一本化し、エッジ host の /bff/* を bff-service へ通す（rewrite 無し＝BFF は /bff プレフィックス前提）。
# mesh(Istio) 前提のため本番は enabled。ローカル（経路B, Istio 未導入）は values-local が false で無効化する。
edge:
  enabled: true
  # istioctl install 既定の ingressgateway。実運用のラベルに合わせて上書きする。
  gateway:
    selector:
      istio: ingressgateway
    # ingressgateway が居る Namespace（既定 istio-system）。networkPolicy 有効時、この Namespace から
    # bff-service への ingress を許可するため参照する（別 Namespace の gateway→bff が既定拒否で塞がれるのを防ぐ）。
    namespace: istio-system
  # エッジで受ける外部ホスト（Host ヘッダ）と待受ポート。実運用は "*" を FQDN に絞り、外部 TLS 終端
  # （HTTPS: Gateway の tls server or 前段 LB/ingressgateway 証明書）を別途追加する（本 chart のスコープ外）。
  hosts:
    - "*"
  port: 80
  # /bff/* の転送先（Service 名とポート）。既定は本チャートの bff-service:8080。
  bff:
    service: bff-service
    port: 8080
  # Issue #313, IADR-0078: SPA(frontend) の転送先。VirtualService の catch-all（/bff・/realms の後）で
  # 非 /bff の全パスを frontend-service へ流す。ルートは frontend.enabled のときのみ描画する（下記 frontend ブロック）。
  frontend:
    service: frontend-service
    port: 8080
  # ブラウザ OIDC issuer 統一の任意機構（既定 off）。有効化すると同一エッジ host の /realms・/resources を
  # Keycloak へ通し、ブラウザとサービス間で同一 issuer URL を共有できる（別ホスト運用時は不要。IADR-0076 決定3）。
  oidc:
    enabled: false
    host: keycloak
    port: 8080

# IADR-0017 フォローアップ: ClusterIP + NetworkPolicy（デフォルト拒否）を実体化。
# mesh(mTLS) 配下でも多層防御（defense-in-depth）として維持する（IADR-0026）。
networkPolicy:
  enabled: true

# ADR-0007: Harbor レジストリからの Pull に用いる imagePullSecrets（docker-registry 型 Secret 名）。
# Secret 本体はコミットしない。deploy/secrets/README.md の手順で事前作成する。
imagePullSecrets: []
  # - name: harbor-pull

# FR-14, ADR-0018, IADR-0028: 宣言的パイプライン構成（files/pipeline.json が正、CI スキーマ検証済み）。
# 段の有効/無効・購読の組み替えは pipeline.json の変更＋GitOps 適用のみで行う（コア改修なし）。
pipeline:
  enabled: true

# FR-15, IADR-0029 フォローアップ 3 (#144): 構成バージョン（適用中の構成定義の Git コミット ID・適用日時・
# 適用者）。BFF が構成情報 API（/bff/admin/config）の Version として返す。実値は GitOps（ArgoCD Application
# の helm.parameters / CD パイプラインの --set）から適用リビジョンで上書きする（deploy/argocd/application.yaml）。
# 既定は空（未注入）＝ appliedBy のみ argocd。手順は docs/operations/operations.md を参照。
config:
  gitCommit: ""
  appliedAt: ""
  appliedBy: "argocd"
  # FR-15, IADR-0046, IADR-0069 (#192): 構成バージョン履歴（新しい順）の GitOps 注入スライス。
  # 現在バージョンと同じ注入経路で BFF へ Config__History__<i>__{GitCommit,AppliedAt,AppliedBy,HadDrift} として
  # 供給する。正データ源は GitOps 層（Git ログ／ArgoCD リビジョン）で API は永続化しない（IADR-0046）。
  # 実値は CD 自動化が --helm-set config.history[i].* もしくは values-<env>.yaml で供給する（手順は
  # docs/operations/operations.md「構成バージョンの注入」）。既定は空＝未注入で、現在バージョン単一へ縮退する。
  history: []
  #   - gitCommit: ""       # 適用リビジョンの Git コミット SHA
  #     appliedAt: ""       # ISO 8601（UTC）
  #     appliedBy: "argocd"
  #     hadDrift: false     # その時点のドリフト有無（判明時のみ。省略=不明）

# FR-15, IADR-0029 フォローアップ 4 (#145): 適用直後のドリフト即時検出。
# 定期検出（既定 5 分）に加え、ArgoCD PostSync フック Job が毎同期後に BFF の
# POST /internal/config/drift-run を叩き、適用直後のドリフトを即時に検出・警告する。
# （宣言=pipeline.json の変更時は BFF がロールアウトし起動時検出でも捕捉されるが、本フックは
#  任意の同期後に一律で即時検出を起動する belt-and-suspenders。）
drift:
  postSyncHook:
    enabled: true
    # curl を含む軽量イメージ。mesh 有効時はサイドカーを注入し、curl 実行後に /quitquitquit で
    # Envoy を終了させて Job を完了させる（drift-postsync-job.yaml 参照）。起動待ちは --retry で吸収する。
    image: curlimages/curl:8.11.1

# NFR (#197): 水平スケール（HPA）と可用性（PDB）。計画 NFR「HPA で水平スケール」「可用性 99.9%」の実現手段。
# metrics-server が必要（k3s は既定同梱）。対象はステートレスな要求処理サービス（下記 services リスト）。
# 段階適用: まず要求処理系を minReplicas:2 + PDB とする。キュー駆動ワーカー（conversion/ingestion=worker:true）は
# 競合コンシューマで水平化可能だが CPU HPA が不適なため対象外とし、負荷実測（#196）後に個別方針で順次追加する。
# HPA 対象サービスは Deployment に静的 replicas を持たず HPA が所有する（deployment.yaml 参照）。
scaling:
  enabled: true
  # HPA/PDB を適用するサービス（Deployment 名 = <key>-service）。ワーカー（conversion/ingestion）は含めない。
  services:
    - bff
    - retrieval
    - authorization
    - aianalysis
    - document
    - datasource
    - dashboard
    - feedback
    - wiki
    - llmgateway
  hpa:
    minReplicas: 2
    maxReplicas: 4
    # requests.cpu に対する平均使用率の目標。超過でスケールアウトする。
    targetCPUUtilizationPercentage: 70
  pdb:
    # 自発的中断時に維持する最小可用レプリカ数（minReplicas:2 なら 1 台までの同時退避を許容）。
    minAvailable: 1

services:
  document:
    enabled: true
    replicas: 1
    image: microservices-platform/document-service
    tag: latest
    # FR-14, IADR-0028: パイプライン段（catalog 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  datasource:
    enabled: true
    replicas: 1
    image: microservices-platform/datasource-service
    tag: latest
    port: 8080
    # FR-01, IADR-0051: 実コネクタが取得した原本を MinIO へ格納する（書き込み側）。未設定時は縮退。
    # 実 filesystem 同期は対象ファイル共有（SMB/NFS）を PVC 等でマウントする必要がある（ops 手順・operations.md）。
    objectStorage: true
    # FR-01, UC-04, NFR(15分以内反映), IADR-0051, IADR-0074 (#299): 定期同期ワーカーの本番有効化。
    # 反映総遅延 = 検出遅延(≤間隔) + 下流パイプライン遅延。間隔 300 秒(5 分)で検出 ≤5 分・下流に ≥10 分の
    # 予算を残し NFR「15 分以内反映」を余裕充足する（下流実測 #196 後に調整可）。実効間隔はワーカーが最短
    # 30 秒へ丸める（過負荷防止）。fail-safe: watermark は完全成功時のみ前進・失敗は縮退・継続失敗は Alert=true。
    # 無効化(ロールバック)は services.datasource.dataSourceSync.enabled=false（手動 /sync は不変）。
    dataSourceSync:
      enabled: true
      intervalSeconds: 300
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  conversion:
    enabled: true
    replicas: 1
    image: microservices-platform/conversion-service
    tag: latest
    # FR-14, IADR-0028: パイプライン段（convert 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    # FR-12, ADR-0015: 正規化本文・資産を MinIO へ保管する（書き込み側）。
    objectStorage: true
    # FR-15, IADR-0029 (#142): 自己申告（/internal/introspection）用の最小 HTTP サーフェス。
    # port を持つと Service が生成され BFF が到達できる。worker=true は HTTP ヘルスプローブを抑止する
    # （バックグラウンドワーカーは /health/* を持たず、可用性判定に HTTP プローブが不適なため）。
    port: 8080
    worker: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  ingestion:
    enabled: true
    replicas: 1
    image: microservices-platform/ingestion-service
    tag: latest
    # FR-14, IADR-0028: パイプライン段（ingest 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    # FR-06: storage:// 本文を MinIO から実取得する（読み取り側）。
    objectStorage: true
    # FR-15, IADR-0029 (#142): 自己申告（/internal/introspection）用の最小 HTTP サーフェス。
    # port を持つと Service が生成され BFF が到達できる。worker=true は HTTP ヘルスプローブを抑止する
    # （バックグラウンドワーカーは /health/* を持たず、可用性判定に HTTP プローブが不適なため）。
    port: 8080
    worker: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  retrieval:
    enabled: true
    replicas: 1
    image: microservices-platform/retrieval-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  aianalysis:
    enabled: true
    replicas: 1
    image: microservices-platform/aianalysis-service
    tag: latest
    port: 8080
    # FR-04, UC-01: 下流サービスの接続先（HTTP クライアント・readiness の UriHealthCheck）。
    # appsettings 既定はローカル用ポート（5003/5007）のため、k8s Service の実 DNS（:8080）へ上書きする。
    # llm-gateway の Service 名は llmgateway-service（chart のキー llmgateway 由来）である点に注意。
    extraEnv:
      - name: Services__RetrievalService
        value: "http://retrieval-service:8080"
      - name: Services__LlmGateway
        value: "http://llmgateway-service:8080"
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }

  authorization:
    enabled: true
    replicas: 1
    image: microservices-platform/authorization-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-13, UC-07, ADR-0011, IADR-0020: WikiService は「同期・統合・ABAC ゲートウェイ」責務。
  # 閲覧・編集の実体は Wiki.js（下記 wikijs ブロック）へ委譲。ABAC は本サービスが前段で強制する。
  wiki:
    enabled: true
    replicas: 1
    image: microservices-platform/wiki-service
    tag: latest
    # FR-14, IADR-0028: パイプライン段（wiki-sync / wiki-delete 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    port: 8080
    # FR-06: storage:// 本文を MinIO から実取得し Wiki.js へ push する（読み取り側）。
    objectStorage: true
    # IADR-0021: Wiki.js への同期（GraphQL push）先とサービスアカウント API キー。
    # API キーは Secret 経由で注入（コミットしない。事前に kubectl/ArgoCD で作成する。docs/security）。
    extraEnv:
      - name: WikiJs__GraphQlEndpoint
        value: "http://wiki-js:3000/graphql"
      - name: WikiJs__ApiKey
        secretKeyRef:
          name: wikijs-sync
          key: apiKey
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  llmgateway:
    enabled: true
    replicas: 1
    image: microservices-platform/llm-gateway
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-10, UC-05, IADR-0011: 利用状況・検索傾向・回答品質ダッシュボード集計サービス
  dashboard:
    enabled: true
    replicas: 1
    image: microservices-platform/dashboard-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-08: 回答へのフィードバック（👍/👎・コメント）収集サービス
  feedback:
    enabled: true
    replicas: 1
    image: microservices-platform/feedback-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # Issue #283, FR-17, UC-06, IADR-0070: AST 設定画面（全体前提条件）の BFF 先＝ConfigurationService。
  # 既定 disabled（fail-safe）— 実行時依存（専用 DB configuration_svc・trading-owner realm・実イメージ）は稼働
  # クラスタ前提のため、稼働導入（enabled: true＋DB プロビジョニング＋Secret）は後続 issue で行う。
  # イメージは k8s-local-images.sh が AST 単一 Dockerfile＋build args でビルド供給する（MAPPING・#275 整合済み）。
  # 有効化時: helm template/CD で services.configuration.enabled=true を渡すと Deployment/Service が描画される。
  configuration:
    enabled: false
    replicas: 1
    image: microservices-platform/configuration-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # Issue #287, FR-14, IADR-0071: AST リスク設定（SC-02）・統制状態参照（SC-03）の BFF 先＝RiskManagementService。
  # 既定 disabled（fail-safe）— 実行時依存（専用 DB risk_management_svc・RabbitMQ・trading-owner realm・実イメージ）は
  # 稼働クラスタ前提のため、稼働導入（enabled: true＋DB/RabbitMQ プロビジョニング＋Secret）は後続 live issue #284 で行う。
  # イメージは k8s-local-images.sh が AST 単一 Dockerfile＋build args でビルド供給する（MAPPING・#275 整合済み）。
  # 有効化時: helm template/CD で services.risk-management.enabled=true を渡すと Deployment/Service が描画される。
  # キーは risk-management（テンプレートが {name}-service を付す）＝Service 名 risk-management-service を
  # compose のサービス名・BFF 既定（http://risk-management-service:8080）と一致させる。
  risk-management:
    enabled: false
    replicas: 1
    image: microservices-platform/risk-management-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # Issue #288, FR-14, IADR-0072: AST 監視銘柄（SC-02 watchlist）の BFF 先＝MarketMonitorService。
  # 既定 disabled（fail-safe）— 実行時依存（専用 DB market_monitor_svc・RabbitMQ・trading-owner realm・実イメージ）は
  # 稼働クラスタ前提のため、稼働導入（enabled: true＋DB/RabbitMQ プロビジョニング＋Secret）は後続 live issue #284 で行う。
  # イメージは k8s-local-images.sh が AST 単一 Dockerfile＋build args でビルド供給する（MAPPING・#275 整合済み）。
  # 有効化時: helm template/CD で services.market-monitor.enabled=true を渡すと Deployment/Service が描画される。
  # キーは market-monitor（テンプレートが {name}-service を付す）＝Service 名 market-monitor-service を
  # compose のサービス名・BFF 既定（http://market-monitor-service:8080）と一致させる。
  market-monitor:
    enabled: false
    replicas: 1
    image: microservices-platform/market-monitor-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  bff:
    enabled: true
    replicas: 1
    image: microservices-platform/bff
    tag: latest
    port: 8080
    # FR-15, IADR-0029, #146: BFF は段をホストしないが、ドリフト検出の突合基準として宣言（pipeline.json）を
    # 必要とする。pipelineDeclaration=true で pipeline-config ConfigMap をマウントし Pipeline__ConfigPath を注入する。
    # これが無いと BFF の宣言が空になり、実効の全購読が UndeclaredSubscription と誤判定される。
    pipelineDeclaration: true
    # FR-15, IADR-0029 (#144): BFF へ構成バージョン（config.*）を注入する（Config__GitCommit 等）。
    configVersion: true
    # FR-15, IADR-0029, Issue #118 監査: 構成情報 API の自己申告収集先。appsettings 既定は
    # ローカル実行用ポート（5001/5006）のため、k8s Service の実ポート（8080）を上書き注入する。
    extraEnv:
      - name: Introspection__Services__document-service
        value: "http://document-service:8080"
      - name: Introspection__Services__wiki-service
        value: "http://wiki-service:8080"
      # FR-15, IADR-0029 フォローアップ 1 (#142): conversion/ingestion ワーカーの自己申告収集先。
      # これで convert/ingest 段が Unverifiable でなくなり、適用漏れ検出が実効化する。
      - name: Introspection__Services__conversion-service
        value: "http://conversion-service:8080"
      - name: Introspection__Services__ingestion-service
        value: "http://ingestion-service:8080"
      # FR-15, IADR-0029 フォローアップ 2 (#143): 全 HTTP サービスへ introspection を横展開したため
      # 収集先へ追加。値は k8s Service の DNS 名（llm-gateway の Service 名は llmgateway-service）。
      - name: Introspection__Services__retrieval-service
        value: "http://retrieval-service:8080"
      - name: Introspection__Services__aianalysis-service
        value: "http://aianalysis-service:8080"
      - name: Introspection__Services__authorization-service
        value: "http://authorization-service:8080"
      - name: Introspection__Services__dashboard-service
        value: "http://dashboard-service:8080"
      - name: Introspection__Services__datasource-service
        value: "http://datasource-service:8080"
      - name: Introspection__Services__feedback-service
        value: "http://feedback-service:8080"
      - name: Introspection__Services__llm-gateway
        value: "http://llmgateway-service:8080"
      # FR-04/FR-08/FR-10, UC-01: BFF の下流集約先（Refit クライアント・readiness の UriHealthCheck）。
      # appsettings 既定はローカル用ポート（5001-5009）のため、k8s Service の実 DNS（:8080）へ上書きする。
      - name: Services__RetrievalService
        value: "http://retrieval-service:8080"
      - name: Services__AiAnalysisService
        value: "http://aianalysis-service:8080"
      - name: Services__DocumentService
        value: "http://document-service:8080"
      - name: Services__AuthorizationService
        value: "http://authorization-service:8080"
      - name: Services__WikiService
        value: "http://wiki-service:8080"
      - name: Services__FeedbackService
        value: "http://feedback-service:8080"
      - name: Services__DashboardService
        value: "http://dashboard-service:8080"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

# FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: S3 互換オブジェクトストレージ（MinIO）。
# 本文・資産の実体を保管する。資格情報は Secret（existingSecret, key=accessKey/secretKey）経由で注入する
# （コミットしない。事前に kubectl/ArgoCD で作成する。docs/security/security.md）。
# IADR-0017/IADR-0024: API は ClusterIP のみで Ingress を張らず、直接公開しない（ABAC 強制サービス経由）。
minio:
  enabled: true
  replicas: 1
  registry: docker.io
  image: minio/minio
  tag: "RELEASE.2025-04-08T15-41-24Z"
  port: 9000
  consolePort: 9001
  existingSecret: minio-credentials
  accessKeyKey: accessKey
  secretKeyKey: secretKey
  persistence:
    enabled: true
    size: 20Gi
    # storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# FR-13, UC-07, ADR-0011, IADR-0020: Wiki.js（閲覧・編集 UI の実体）。専用 DB `wikijs`（Postgres）。
# 認証は Keycloak(OIDC)。ABAC は WikiService ゲートウェイが前段で強制するため、Wiki.js への直接到達は
# 塞ぐ（Ingress は既定で無効。公開する場合も WikiService ゲートウェイ経由に限定する。IADR-0017/IADR-0020）。
# DB パスワードは Secret 経由（コミットしない。docs/security/security.md）。
wikijs:
  enabled: true
  replicas: 1
  registry: ghcr.io
  image: requarks/wiki
  tag: "2"
  port: 3000
  db:
    type: postgres
    host: postgres
    port: 5432
    user: kp
    name: wikijs
    # DB パスワードを保持する Secret（key=password）。事前に kubectl/ArgoCD で作成する。
    existingSecret: wikijs-db
    passwordKey: password
  persistence:
    enabled: true
    size: 5Gi
    # storageClass: ""
  ingress:
    enabled: false
    className: nginx
    host: wiki.microservices-platform.local
    tls: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# FR-14, IADR-0056, IADR-0078 (#313): SPA(frontend)。platform/frontend の nginx イメージ（静的配信＋/bff
# プロキシ＋実行時 config.js 注入）を k8s で配信する。汎用 services ループに載せず専用 template
# (templates/frontend.yaml) で描画する（wikijs/minio と同じ非 .NET パターン）。イメージは
# global.image.registry を接頭辞に使う（本番=harbor、経路B=k3d-local）。#275 MAPPING に登録済み。
# 外部からの入口はエッジ（edge ブロックの VirtualService catch-all → frontend-service）。
frontend:
  enabled: true
  replicas: 1
  image: microservices-platform/frontend
  tag: latest
  # nginx 待受ポート（src/platform/frontend/Dockerfile の EXPOSE 8080）。
  port: 8080
  # nginx /bff プロキシの上流（in-cluster BFF）。edge.frontend/edge.bff と同じ bff-service を指す。
  bffUpstream: http://bff-service:8080
  # ブラウザから見た BFF ベース URL（同一オリジンの nginx プロキシ）。compose と同値。
  bffBaseUrl: /bff
  oidc:
    # ブラウザが到達する OIDC issuer。本番は外部公開する Keycloak の URL（エッジ host 経由なら IADR-0076
    # 決定3 の /realms パススルー）を per-env で上書きする。既定はサービス間と同じ in-cluster 値だが、
    # ブラウザ到達性のため実運用では必ず外部到達可能な URL へ上書きすること（config.gitCommit 等と同じ placeholder）。
    authority: http://keycloak:8080/realms/microservices-platform
    clientId: spa-web
  # 任意の追加 env（config.js の GRAFANA_URL / JAEGER_URL / KIALI_URL / WIKI_BASE_URL 等）。既定は空で、
  # 40-render-config.sh が未設定を空文字にフォールバックし SC-10 の外部ツール導線を画面に出さない。compose は
  # dev の Grafana(3000) を直挿しするが、k8s は可観測性/外部 UI を経路B の opt-in オーバーレイ（ADR-0006・
  # IADR-0077）に委ねる方針のため既定で未配線とする（配線したい環境は extraEnv で URL を供給する。IADR-0078）。
  extraEnv: []
  resources:
    requests: { cpu: 50m, memory: 64Mi }
    limits: { cpu: 200m, memory: 128Mi }
