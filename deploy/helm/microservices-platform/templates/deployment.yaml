# Generic Deployment template — rendered once per enabled service
# ADR-0007: k8s Deployment skeleton for microservices-platform services
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- /* FR-14/FR-15 (#146): pipeline.json をマウントする条件。段ホスト（pipelineSteps）に加え、
       宣言突合のため宣言を必要とする BFF（pipelineDeclaration）も同じ ConfigMap をマウントする。 */}}
{{- $pipelineMount := and (or $svc.pipelineSteps $svc.pipelineDeclaration) $.Values.pipeline.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app: {{ $name }}-service
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  {{- /* NFR (#197): HPA 対象サービスは replicas を宣言しない（HPA が所有し値の綱引きを避ける）。
         非対象サービスは従来どおり静的 replicas を用いる。 */}}
  {{- if not (and $.Values.scaling.enabled (has $name $.Values.scaling.services)) }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
      {{- if $pipelineMount }}
      # FR-14, IADR-0028: 宣言的パイプライン構成の変更（Git → ArgoCD 同期）でロールアウトさせる。
      annotations:
        checksum/pipeline-config: {{ $.Files.Get "files/pipeline.json" | sha256sum | quote }}
      {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      # ADR-0007: Harbor レジストリからの Pull 認証（Secret は deploy/secrets で事前作成）。
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}-service
          image: "{{ $.Values.global.image.registry }}/{{ $svc.image }}:{{ $svc.tag | default "latest" }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          {{- if $svc.port }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- end }}
          env:
            - name: Otlp__Endpoint
              value: {{ $.Values.global.otel.endpoint }}
            - name: Auth__Authority
              value: {{ $.Values.global.auth.authority }}
          {{- if $.Values.global.auth.metadataAddress }}
            # Issue #314, IADR-0076 手順B, IADR-0086: OIDC metadata 取得先（in-cluster）を issuer 検証値と分離する。
            # 設定時のみ描画＝既定（空）は現行 manifest とバイト等価。分離時 backend は Authority に代えてこれを使う。
            - name: Auth__MetadataAddress
              value: {{ $.Values.global.auth.metadataAddress | quote }}
          {{- end }}
          {{- if $.Values.global.auth.validIssuers }}
            # Issue #314, IADR-0086: token の iss として追加で受理する issuer（エッジ host）。カンマ/空白区切り。
            # issuer 検証は弱めない（許可リストを足すのみ・metadata 由来 issuer と併存）。設定時のみ描画。
            - name: Auth__ValidIssuers
              value: {{ $.Values.global.auth.validIssuers | quote }}
          {{- end }}
          {{- if $svc.session }}
            # NFR, SC-13, ADR-0026/ADR-0032, IADR-0251/IADR-0273, #1107: BFF セッション（Token Handler）の構成。
            #
            # 🔴 **これが無いと `BffSessionOptions.ClientSecret` が空のままになり、BFF は
            # コンフィデンシャルクライアントとして認証できず、`GET /bff/auth/login` が 500 で落ちる**
            # （PAR 端点が 401 を返す。PAR を切っても認可コード交換で同じ 401 になるので、逃げ道は無い）。
            #
            # Authority / MetadataAddress / ValidIssuers は上の `Auth__*` と**同じ global.auth から描く**。
            # 片方だけがエッジ host へ動くと（#780）、サービス間検証とブラウザ経路が静かに食い違う。
            # RequireHttpsMetadata / RedisConnectionString / CookieName / SessionLifetimeSeconds は
            # **コード既定を使う**（既定が配備の実態および realm と一致することを実測済み。理由は
            # .ai-context/adr/IADR-0318 と作業仕様書）。ここへ書くと 2 つ目の真実ができる。
            # 🔴 **エッジが TLS を終端するので、転送ヘッダを解釈させないとログインが完了しない。**
            # 実測（#1107）: これが無いと ASP.NET は受信リクエストの scheme（エッジ→BFF は平文 http）から
            # `redirect_uri` を組み、`http://<edge>/bff/auth/callback` を認可サーバへ送る。realm に登録が
            # あるのは **https** の方なので、Keycloak が `invalid_request: Invalid parameter: redirect_uri`
            # （400）を返し、`GET /bff/auth/login` は 500 のままになる。
            # **client secret を入れただけでは往復は通らない**（401 → 400 へ変わるだけである）。
            # ASP.NET Core が用意している既定の口を使う（`X-Forwarded-Proto` / `-For` を解釈し、
            # 既定の loopback 限定 KnownProxies を外す）。BFF だけに与える —— 絶対 URL を組んで
            # ブラウザへ返すのは BFF だけで、他サービスへ広げると転送ヘッダの信頼範囲を無用に広げる。
            - name: ASPNETCORE_FORWARDEDHEADERS_ENABLED
              value: "true"
            - name: BffSession__ClientId
              value: {{ $svc.session.clientId | quote }}
            # 🔴 実値はチャートに書かない。Secret（Vault→ExternalSecret→Secret）から環境変数で注入する。
            # realm 側の置き場（`*-dev-secret-change-me`）と**同値でなければ PAR が 401 を返す**。
            - name: BffSession__ClientSecret
              valueFrom:
                secretKeyRef:
                  name: {{ $svc.session.existingSecret }}
                  key: {{ $svc.session.clientSecretKey }}
            - name: BffSession__Authority
              value: {{ $.Values.global.auth.authority | quote }}
          {{- if $.Values.global.auth.metadataAddress }}
            - name: BffSession__MetadataAddress
              value: {{ $.Values.global.auth.metadataAddress | quote }}
          {{- end }}
          {{- if $.Values.global.auth.validIssuers }}
            - name: BffSession__ValidIssuers
              value: {{ $.Values.global.auth.validIssuers | quote }}
          {{- end }}
          {{- end }}
          {{- if $pipelineMount }}
            # FR-14, ADR-0018, IADR-0028: 宣言的パイプライン構成（ConfigMap マウント）の読み込み先。
            - name: Pipeline__ConfigPath
              value: /etc/microservices-platform/pipeline/pipeline.appsettings.json
          {{- end }}
          {{- if $svc.objectStorage }}
            # FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: MinIO 接続。資格情報は Secret 経由。
            - name: ObjectStorage__Endpoint
              value: {{ $.Values.global.objectStorage.endpoint | quote }}
            - name: ObjectStorage__Bucket
              value: {{ $.Values.global.objectStorage.bucket | quote }}
            - name: ObjectStorage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.objectStorage.existingSecret }}
                  key: {{ $.Values.global.objectStorage.accessKeyKey }}
            - name: ObjectStorage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.objectStorage.existingSecret }}
                  key: {{ $.Values.global.objectStorage.secretKeyKey }}
          {{- end }}
          {{- if $svc.dataSourceSync }}
            # FR-01, UC-04, IADR-0051, IADR-0074 (#299): 定期同期ワーカーの配線。既定無効のワーカーを
            # 本番/経路B で有効化する（env は ASP.NET の __→: 規約で DataSourceSyncOptions へバインドする）。
            # 未設定サービスは本ブロックを描画せず従来どおり（後方互換）。実効間隔はワーカーが最短 30 秒へ丸める。
            - name: DataSourceSync__Enabled
              value: {{ $svc.dataSourceSync.enabled | default false | quote }}
            - name: DataSourceSync__IntervalSeconds
              value: {{ $svc.dataSourceSync.intervalSeconds | default 300 | quote }}
          {{- end }}
          {{- if $svc.database }}
            # NFR, ADR-0002, #1012: DB 接続。**資格情報をイメージへ焼かない** —— appsettings.json は
            # 接続文字列を持たず（#1012 で撤去）、ここで注入しなければサービスは起動時に落ちる
            # （注入漏れが「既定の資格情報で接続成功」へ倒れない）。
            # パスワードは Secret から DB_PASSWORD として入れ、接続文字列は k8s の $(VAR) 補間で組む
            # （env の値に平文パスワードを描画しない。同一 container 内で先に定義した env のみ参照できる）。
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.db.existingSecret }}
                  key: {{ $.Values.global.db.passwordKey }}
            - name: ConnectionStrings__DefaultConnection
              value: "Host={{ $.Values.global.db.host }};Port={{ $.Values.global.db.port }};Database={{ $svc.database }};Username={{ $.Values.global.db.user }};Password=$(DB_PASSWORD)"
          {{- end }}
          {{- if $svc.messaging }}
            # NFR, ADR-0027, #1022: ブローカ接続。**資格情報をイメージへ焼かない** —— appsettings.json は
            # RabbitMq:ConnectionString を持たず（#1022 で撤去）、ここで注入しなければサービスは起動時に
            # 落ちる（注入漏れが「既定の資格情報で接続成功」へ倒れない）。
            # パスワードは Secret から RABBITMQ_PASSWORD として入れ、接続文字列は k8s の $(VAR) 補間で
            # 組む（env の値に平文パスワードを描画しない。同一 container 内で先に定義した env のみ
            # 参照できるので順序を崩さないこと）。#1012 の global.db ブロックと同型である。
            - name: RABBITMQ_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.messaging.existingSecret }}
                  key: {{ $.Values.global.messaging.passwordKey }}
            - name: RabbitMq__ConnectionString
              value: "amqp://{{ $.Values.global.messaging.user }}:$(RABBITMQ_PASSWORD)@{{ $.Values.global.messaging.host }}:{{ $.Values.global.messaging.port }}"
          {{- end }}
          {{- range $svc.extraEnv }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .secretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretKeyRef.name }}
                  key: {{ .secretKeyRef.key }}
              {{- end }}
          {{- end }}
          {{- if and $svc.selfHostedEmbedding $.Values.embedding.enabled }}
            # FR-02, FR-03, ADR-0017, IADR-0025, IADR-0085 (#303): セルフホスト埋め込み（Ruri v3）の配線。
            # embedding.enabled=true のときのみ描画し、llmgateway を templates/embedding.yaml（TEI・OpenAI 互換
            # /v1/embeddings）へ向ける。BaseUrl は base のみ（SelfHostedEmbeddingProvider が /v1/embeddings を後置）。
            # ⚠️ Issue #98: Endpoints__1 は appsettings.json の Embedding:Routing:Endpoints 配列で selfhosted が
            # index 1（voyage=index 0）である前提。取り違えは起動時 EmbeddingRoutingOptionsValidator が fail-fast 検知。
            # 既定 embedding.enabled=false では本ブロック非描画＝現状維持（後方互換・高機密は fail-closed）。
            - name: Embedding__SelfHosted__BaseUrl
              value: "http://embedding-service:{{ $.Values.embedding.port }}"
            - name: Embedding__Routing__Endpoints__1__Enabled
              value: "true"
          {{- end }}
          {{- /* FR-02, FR-03, ADR-0016, IADR-0284, IADR-0313 (#992 案 2): 決定的ローカル埋め込み。
                 🔴 **使い捨ての検証スタック専用**（意味は values.yaml の embedding.deterministicLocal）。
                 埋め込みの鍵が無いスタックでも索引に点が入り「検索が実際に効くこと」を観測できる。
                 越境判定（機密区分 × ティア）は緩めていない —— 本経路は HTTP を行わない（ティアA）。
                 3 サービスは**必ず同時に**配線する。1 つでも欠けると索引先と検索先が食い違い、
                 検索が静かに 0 件になる（「壊れている」と「該当が無い」がまた区別できなくなる）。 */}}
          {{- $det := $.Values.embedding.deterministicLocal | default dict }}
          {{- if and $det.enabled (has $name (list "llmgateway" "ingestion" "retrieval")) }}
            # IADR-0313 (#992): 決定的ローカル埋め込み（ティアA・プロセス内計算）。使い捨てスタック専用。
          {{- if eq $name "llmgateway" }}
            # ⚠️ Endpoints__2 は LlmGateway の appsettings.json の Embedding:Routing:Endpoints 配列で
            # deterministic-local が index 2（voyage=0 / selfhosted=1）である前提。取り違えは起動時の
            # EmbeddingRoutingOptionsValidator が fail-fast 検知する（ティア↔プロバイダ整合）。
            # 同エンドポイントは Priority=5（最優先）なので、有効化した時点で取り込み・クエリの両方が
            # ここへ寄る。**片方だけ寄ると索引と問い合わせが別空間になり、静かに 0 件になる。**
            - name: Embedding__Routing__Endpoints__2__Enabled
              value: "true"
          {{- end }}
          {{- if eq $name "ingestion" }}
            # 取り込みは起動時に Embedding:Collections の全コレクションを作る。ここに無いと
            # コレクションが存在せず、Upsert も残存防止削除（DeleteByDocumentFromAllAsync）も届かない。
            # index 2 は appsettings.json の 2 件（voyage=0 / ruri=1）の後ろへ足す位置である。
            - name: Embedding__Collections__2__Name
              value: {{ $det.collection | quote }}
            - name: Embedding__Collections__2__VectorSize
              value: {{ $det.dimensions | quote }}
          {{- end }}
          {{- if eq $name "retrieval" }}
            # 検索は単一コレクションしか見ない（Qdrant:CollectionName）。取り込み先と揃えないと
            # 「索引はされているのに検索は別のコレクションを見る」＝ 0 件で静かに落ちる。
            - name: Qdrant__CollectionName
              value: {{ $det.collection | quote }}
          {{- end }}
          {{- end }}
          {{- if $svc.configVersion }}
            # FR-15, IADR-0029 (#144): 構成バージョン（GitOps 注入）。ArgoCD Application の
            # helm.parameters / CD の --set が config.* を適用リビジョンで上書きする。
            - name: Config__GitCommit
              value: {{ $.Values.config.gitCommit | quote }}
            - name: Config__AppliedAt
              value: {{ $.Values.config.appliedAt | quote }}
            - name: Config__AppliedBy
              value: {{ $.Values.config.appliedBy | quote }}
            {{- /* FR-15, IADR-0046, IADR-0069 (#192): 構成バージョン履歴（複数エントリ）の GitOps 注入。
                   現在バージョン注入（#144）の拡張として同一経路で供給する。ASP.NET の構成配列規約
                   Config__History__<i>__<Prop> に合わせて描画し ConfigVersionOptions.History へバインドする。
                   実値の並びは供給側（--helm-set config.history[i].* / values-<env>.yaml）が決める。
                   既定 config.history: [] は env を出さず、現在バージョン単一へ縮退する（後方互換）。 */}}
            {{- range $i, $entry := $.Values.config.history }}
            - name: Config__History__{{ $i }}__GitCommit
              value: {{ $entry.gitCommit | quote }}
            - name: Config__History__{{ $i }}__AppliedAt
              value: {{ $entry.appliedAt | quote }}
            - name: Config__History__{{ $i }}__AppliedBy
              value: {{ $entry.appliedBy | quote }}
            {{- /* hadDrift は bool?。真偽値が注入された場合のみ出し、未設定・null・非 bool（誤入力の
                   空文字等）は出さず null（不明）を保つ。非 bool を env 化すると bool? バインドで実行時
                   例外になり得るため、kindIs "bool" で厳密に判定する。 */}}
            {{- if kindIs "bool" $entry.hadDrift }}
            - name: Config__History__{{ $i }}__HadDrift
              value: {{ $entry.hadDrift | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if and $svc.port (not $svc.worker) }}
          # FR-15, IADR-0029 (#142): worker（conversion/ingestion）は /internal/introspection のみの
          # 最小 HTTP サーフェスで /health/* を持たないため、HTTP ヘルスプローブを付与しない。
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if $pipelineMount }}
          volumeMounts:
            - name: pipeline-config
              mountPath: /etc/microservices-platform/pipeline
              readOnly: true
          {{- end }}
      {{- if $pipelineMount }}
      volumes:
        - name: pipeline-config
          configMap:
            name: pipeline-config
      {{- end }}
{{- end }}
{{- end }}
