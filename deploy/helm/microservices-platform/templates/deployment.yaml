# Generic Deployment template — rendered once per enabled service
# ADR-0007: k8s Deployment skeleton for microservices-platform services
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
{{- /* FR-14/FR-15 (#146): pipeline.json をマウントする条件。段ホスト（pipelineSteps）に加え、
       宣言突合のため宣言を必要とする BFF（pipelineDeclaration）も同じ ConfigMap をマウントする。 */}}
{{- $pipelineMount := and (or $svc.pipelineSteps $svc.pipelineDeclaration) $.Values.pipeline.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app: {{ $name }}-service
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  {{- /* NFR (#197): HPA 対象サービスは replicas を宣言しない（HPA が所有し値の綱引きを避ける）。
         非対象サービスは従来どおり静的 replicas を用いる。 */}}
  {{- if not (and $.Values.scaling.enabled (has $name $.Values.scaling.services)) }}
  replicas: {{ $svc.replicas | default 1 }}
  {{- end }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
      {{- if $pipelineMount }}
      # FR-14, IADR-0028: 宣言的パイプライン構成の変更（Git → ArgoCD 同期）でロールアウトさせる。
      annotations:
        checksum/pipeline-config: {{ $.Files.Get "files/pipeline.json" | sha256sum | quote }}
      {{- end }}
    spec:
      {{- with $.Values.imagePullSecrets }}
      # ADR-0007: Harbor レジストリからの Pull 認証（Secret は deploy/secrets で事前作成）。
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}-service
          image: "{{ $.Values.global.image.registry }}/{{ $svc.image }}:{{ $svc.tag | default "latest" }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          {{- if $svc.port }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- end }}
          env:
            - name: Otlp__Endpoint
              value: {{ $.Values.global.otel.endpoint }}
            - name: Auth__Authority
              value: {{ $.Values.global.auth.authority }}
          {{- if $.Values.global.auth.metadataAddress }}
            # Issue #314, IADR-0076 手順B, IADR-0086: OIDC metadata 取得先（in-cluster）を issuer 検証値と分離する。
            # 設定時のみ描画＝既定（空）は現行 manifest とバイト等価。分離時 backend は Authority に代えてこれを使う。
            - name: Auth__MetadataAddress
              value: {{ $.Values.global.auth.metadataAddress | quote }}
          {{- end }}
          {{- if $.Values.global.auth.validIssuers }}
            # Issue #314, IADR-0086: token の iss として追加で受理する issuer（エッジ host）。カンマ/空白区切り。
            # issuer 検証は弱めない（許可リストを足すのみ・metadata 由来 issuer と併存）。設定時のみ描画。
            - name: Auth__ValidIssuers
              value: {{ $.Values.global.auth.validIssuers | quote }}
          {{- end }}
          {{- if $pipelineMount }}
            # FR-14, ADR-0018, IADR-0028: 宣言的パイプライン構成（ConfigMap マウント）の読み込み先。
            - name: Pipeline__ConfigPath
              value: /etc/microservices-platform/pipeline/pipeline.appsettings.json
          {{- end }}
          {{- if $svc.objectStorage }}
            # FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: MinIO 接続。資格情報は Secret 経由。
            - name: ObjectStorage__Endpoint
              value: {{ $.Values.global.objectStorage.endpoint | quote }}
            - name: ObjectStorage__Bucket
              value: {{ $.Values.global.objectStorage.bucket | quote }}
            - name: ObjectStorage__AccessKey
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.objectStorage.existingSecret }}
                  key: {{ $.Values.global.objectStorage.accessKeyKey }}
            - name: ObjectStorage__SecretKey
              valueFrom:
                secretKeyRef:
                  name: {{ $.Values.global.objectStorage.existingSecret }}
                  key: {{ $.Values.global.objectStorage.secretKeyKey }}
          {{- end }}
          {{- if $svc.dataSourceSync }}
            # FR-01, UC-04, IADR-0051, IADR-0074 (#299): 定期同期ワーカーの配線。既定無効のワーカーを
            # 本番/経路B で有効化する（env は ASP.NET の __→: 規約で DataSourceSyncOptions へバインドする）。
            # 未設定サービスは本ブロックを描画せず従来どおり（後方互換）。実効間隔はワーカーが最短 30 秒へ丸める。
            - name: DataSourceSync__Enabled
              value: {{ $svc.dataSourceSync.enabled | default false | quote }}
            - name: DataSourceSync__IntervalSeconds
              value: {{ $svc.dataSourceSync.intervalSeconds | default 300 | quote }}
          {{- end }}
          {{- range $svc.extraEnv }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .secretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretKeyRef.name }}
                  key: {{ .secretKeyRef.key }}
              {{- end }}
          {{- end }}
          {{- if and $svc.selfHostedEmbedding $.Values.embedding.enabled }}
            # FR-02, FR-03, ADR-0017, IADR-0025, IADR-0085 (#303): セルフホスト埋め込み（Ruri v3）の配線。
            # embedding.enabled=true のときのみ描画し、llmgateway を templates/embedding.yaml（TEI・OpenAI 互換
            # /v1/embeddings）へ向ける。BaseUrl は base のみ（SelfHostedEmbeddingProvider が /v1/embeddings を後置）。
            # ⚠️ Issue #98: Endpoints__1 は appsettings.json の Embedding:Routing:Endpoints 配列で selfhosted が
            # index 1（voyage=index 0）である前提。取り違えは起動時 EmbeddingRoutingOptionsValidator が fail-fast 検知。
            # 既定 embedding.enabled=false では本ブロック非描画＝現状維持（後方互換・高機密は fail-closed）。
            - name: Embedding__SelfHosted__BaseUrl
              value: "http://embedding-service:{{ $.Values.embedding.port }}"
            - name: Embedding__Routing__Endpoints__1__Enabled
              value: "true"
          {{- end }}
          {{- if $svc.configVersion }}
            # FR-15, IADR-0029 (#144): 構成バージョン（GitOps 注入）。ArgoCD Application の
            # helm.parameters / CD の --set が config.* を適用リビジョンで上書きする。
            - name: Config__GitCommit
              value: {{ $.Values.config.gitCommit | quote }}
            - name: Config__AppliedAt
              value: {{ $.Values.config.appliedAt | quote }}
            - name: Config__AppliedBy
              value: {{ $.Values.config.appliedBy | quote }}
            {{- /* FR-15, IADR-0046, IADR-0069 (#192): 構成バージョン履歴（複数エントリ）の GitOps 注入。
                   現在バージョン注入（#144）の拡張として同一経路で供給する。ASP.NET の構成配列規約
                   Config__History__<i>__<Prop> に合わせて描画し ConfigVersionOptions.History へバインドする。
                   実値の並びは供給側（--helm-set config.history[i].* / values-<env>.yaml）が決める。
                   既定 config.history: [] は env を出さず、現在バージョン単一へ縮退する（後方互換）。 */}}
            {{- range $i, $entry := $.Values.config.history }}
            - name: Config__History__{{ $i }}__GitCommit
              value: {{ $entry.gitCommit | quote }}
            - name: Config__History__{{ $i }}__AppliedAt
              value: {{ $entry.appliedAt | quote }}
            - name: Config__History__{{ $i }}__AppliedBy
              value: {{ $entry.appliedBy | quote }}
            {{- /* hadDrift は bool?。真偽値が注入された場合のみ出し、未設定・null・非 bool（誤入力の
                   空文字等）は出さず null（不明）を保つ。非 bool を env 化すると bool? バインドで実行時
                   例外になり得るため、kindIs "bool" で厳密に判定する。 */}}
            {{- if kindIs "bool" $entry.hadDrift }}
            - name: Config__History__{{ $i }}__HadDrift
              value: {{ $entry.hadDrift | quote }}
            {{- end }}
            {{- end }}
          {{- end }}
          {{- if and $svc.port (not $svc.worker) }}
          # FR-15, IADR-0029 (#142): worker（conversion/ingestion）は /internal/introspection のみの
          # 最小 HTTP サーフェスで /health/* を持たないため、HTTP ヘルスプローブを付与しない。
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          {{- if $pipelineMount }}
          volumeMounts:
            - name: pipeline-config
              mountPath: /etc/microservices-platform/pipeline
              readOnly: true
          {{- end }}
      {{- if $pipelineMount }}
      volumes:
        - name: pipeline-config
          configMap:
            name: pipeline-config
      {{- end }}
{{- end }}
{{- end }}
