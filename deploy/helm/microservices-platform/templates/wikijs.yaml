# FR-13, UC-07, ADR-0011, IADR-0020: Wiki.js（閲覧・編集 UI の実体）の Deployment/Service/PVC/Ingress。
# ABAC は WikiService ゲートウェイが前段で強制する。Wiki.js への直接到達は既定で塞ぐ（Ingress 既定 disabled）。
{{- if .Values.wikijs.enabled }}
{{- $w := .Values.wikijs }}
{{- /* NFR-16, IADR-0673: DB の TLS（opt-in）。CA は global.infraCa（deployment.yaml の .NET サービスと同じ ConfigMap・キー）。 */}}
{{- $dbTls := and $w.db.tls $w.db.tls.enabled }}
{{- $ca := .Values.global.infraCa | default dict }}
{{- if and $dbTls (or (not $ca.configMap) (not $ca.caKey)) }}
{{- fail "wikijs.db.tls.enabled には global.infraCa.configMap / caKey が要ります（CA の無いまま検証つきの接続を描かない）" }}
{{- end }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: wiki-js
  labels:
    app: wiki-js
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: {{ $w.replicas | default 1 }}
  # IADR-0210 決定 7 / #1435: PVC（ReadWriteOnce）を掴む Deployment は Recreate にする。
  # RollingUpdate だと新旧 2 つの Pod が同時に起動し、空の DB へ Wiki.js（knex 0.21）の migration を
  # 同時に走らせる。knex はロック表の行を「無ければ入れる」を排他なしで行うため、行が 2 つになり、
  # 以後 `update ... where is_locked=0` が 2 行を更新して「Migration table is already locked」で
  # **毎回**落ちる（どの Pod も二度と起動しない）。実測: integration-stack の run 36188276324 /
  # 35277541043 / 34748189616（ISTIO=1 の注入 rollout restart が helm install 直後に 2 つ目の Pod を作る）。
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: wiki-js
  template:
    metadata:
      labels:
        app: wiki-js
    spec:
      # NFR, IADR-0583（Refs 非公開の指摘（MSP））: k8s API を呼ばないのでトークンを置かない。
      # 外部のイメージなので利用者 ID とデータの所有者は変えない（seccomp・権限昇格なしまで）。
      automountServiceAccountToken: false
      {{- include "msp.podSecurityContext.thirdParty" . | nindent 6 }}
      containers:
        - name: wiki-js
          # ADR-0107 決定 3, IADR-0514 (#1787): digest で固定する（タグは読みやすさのために残す。seaweedfs と同型）。
          image: "{{ $w.registry }}/{{ $w.image }}:{{ $w.tag }}{{ if $w.digest }}@{{ $w.digest }}{{ end }}"
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- include "msp.containerSecurityContext.thirdParty" . | nindent 10 }}
          ports:
            - containerPort: {{ $w.port }}
          env:
            - name: DB_TYPE
              value: {{ $w.db.type | quote }}
            - name: DB_HOST
              value: {{ $w.db.host | quote }}
            - name: DB_PORT
              value: {{ $w.db.port | quote }}
            - name: DB_USER
              value: {{ $w.db.user | quote }}
            - name: DB_NAME
              value: {{ $w.db.name | quote }}
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ $w.db.existingSecret }}
                  key: {{ $w.db.passwordKey }}
            {{- if $dbTls }}
            # NFR-16, NFR-18, IADR-0673（#2403）: Wiki.js 2.5 は DB_SSL=true で ssl: { rejectUnauthorized: true } を pg へ渡し、
            # 名前は DB_HOST で照合する。CA は Node の既定の信頼ストアへ足す（置き換えない）。
            - name: DB_SSL
              value: "true"
            - name: NODE_EXTRA_CA_CERTS
              value: "/etc/platform-infra-ca/{{ $ca.caKey }}"
            {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ $w.port }}
            initialDelaySeconds: 30
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: {{ $w.port }}
            initialDelaySeconds: 20
            periodSeconds: 15
          {{- if or $w.persistence.enabled $dbTls }}
          volumeMounts:
            {{- if $w.persistence.enabled }}
            - name: wiki-data
              mountPath: /wiki/data
            {{- end }}
            {{- if $dbTls }}
            - name: platform-infra-ca
              mountPath: /etc/platform-infra-ca
              readOnly: true
            {{- end }}
          {{- end }}
          resources:
            {{- toYaml $w.resources | nindent 12 }}
      {{- if or $w.persistence.enabled $dbTls }}
      volumes:
        {{- if $w.persistence.enabled }}
        - name: wiki-data
          persistentVolumeClaim:
            claimName: wiki-js-data
        {{- end }}
        {{- if $dbTls }}
        # IADR-0673: 基盤の CA（公開の証明書だけ）。非 optional（無ければ Pod は立たない＝検証なしへ倒れない）。
        - name: platform-infra-ca
          configMap:
            name: {{ $ca.configMap }}
            items:
              - key: {{ $ca.caKey }}
                path: {{ $ca.caKey }}
        {{- end }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: wiki-js
  labels:
    app: wiki-js
spec:
  selector:
    app: wiki-js
  ports:
    - port: {{ $w.port }}
      targetPort: {{ $w.port }}
      protocol: TCP
{{- if $w.persistence.enabled }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: wiki-js-data
spec:
  accessModes:
    - ReadWriteOnce
  {{- if $w.persistence.storageClass }}
  storageClassName: {{ $w.persistence.storageClass | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ $w.persistence.size }}
{{- end }}
{{- if $w.ingress.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wiki-js
  labels:
    app: wiki-js
spec:
  ingressClassName: {{ $w.ingress.className }}
  rules:
    - host: {{ $w.ingress.host }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wiki-js
                port:
                  number: {{ $w.port }}
  {{- if $w.ingress.tls }}
  tls:
    - hosts:
        - {{ $w.ingress.host }}
      secretName: wiki-js-tls
  {{- end }}
{{- end }}
{{- end }}
