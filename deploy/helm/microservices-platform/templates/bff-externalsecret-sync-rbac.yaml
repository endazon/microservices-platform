{{- /* SC-22, NFR-18, ADR-0095 決定 3, IADR-0456 決定 4 (#1477): BFF が書き込み後に ExternalSecret へ force-sync の注釈を付ける権限。
       🔴 **resourceNames で名前を限る。** この名前空間で SC-22 の items[] が同期先とする ExternalSecret だけ
       （deploy/bootstrap/sc22-secret-items.json の externalSecret のうち namespace が microservices-platform のもの）。
       名前の集合の一致は Platform.Bff.Tests の SecretItemExternalSecretRbacTests が固定する（足しても抜いても落ちる）。
       🔴 **verbs は get / patch だけ。** Secret には触れない（値を読む権限を BFF に渡さない。同期するのは ESO 自身）。
       🔴 **束縛先は BFF 専用の SA だけ**（名前空間の `default` に束縛しない。IADR-0433 決定 4 と同じ理由）。
       他の名前空間（platform-infra / ai-stock-trading）の Role はチャートの外（deploy/local/vault/eso/rbac-bff-externalsecret-sync.yaml）。 */}}
{{- $bff := .Values.services.bff | default dict }}
{{- $sync := $bff.externalSecretSync | default dict }}
{{- if and $bff.enabled $sync.enabled }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bff-externalsecret-sync
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "patch"]
    resourceNames:
      - llm-provider-credentials
      - wikijs-sync
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bff-externalsecret-sync
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bff-externalsecret-sync
subjects:
  - kind: ServiceAccount
    name: {{ $bff.serviceAccount.name }}
    namespace: {{ .Values.namespace.name }}
{{- end }}
