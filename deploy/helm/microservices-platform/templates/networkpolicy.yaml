# IADR-0017 フォローアップ / IADR-0026: ClusterIP + NetworkPolicy（デフォルト拒否）。
# mesh(mTLS) は第一防御だが、NetworkPolicy を多層防御（defense-in-depth）として維持する。
# 既定でこの Namespace への ingress を拒否し、同 Namespace 内通信・DNS・Istio 制御面のみ許可する。
{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  podSelector: {}
  policyTypes:
    - Ingress
  # ingress ルール無し = すべての ingress を拒否（明示許可は下記ポリシーで加える）。
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-intra-namespace
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  # 同 Namespace 内のワークロード間通信を許可（サービス間 RAG/取り込みフロー）。
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    # 同 Namespace 内の全 Pod からの ingress のみ許可する。k8s 仕様上 `podSelector: {}` は
    # 「この NetworkPolicy と同じ Namespace の全 Pod」を意味するため、これ単独で意図を満たす。
    # 以前は `namespaceSelector`（汎用 Helm ラベル一致）を別エントリ(OR)で併記していたが、
    # 同ラベルを持つ任意の別 Namespace からの ingress を意図せず許可し得るため削除した。
    - from:
        - podSelector: {}
  egress:
    # 同 Namespace 内。
    - to:
        - podSelector: {}
    # DNS（kube-dns / CoreDNS）。
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- /* Issue #284, IADR-0076: エッジ（Istio ingressgateway）は通常別 Namespace（istio-system）に居るため、
       default-deny 下では gateway→bff-service の ingress が L3/L4 で塞がれる（VirtualService が描画されても
       実到達しない）。edge 有効時のみ、その Namespace から bff-service への ingress を明示許可する
       （多層防御は維持したまま必要最小の穴を開ける）。 */}}
{{- if .Values.edge.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-ingress-to-bff
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  # bff-service Pod（deployment.yaml のラベル app: <name>-service）宛のみに限定する。
  podSelector:
    matchLabels:
      app: {{ .Values.edge.bff.service }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.edge.gateway.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.edge.bff.port }}
{{- /* Issue #313, IADR-0078: エッジ SPA ルート（edge.yaml の catch-all → frontend-service）も default-deny 下では
       gateway→frontend-service の ingress が L3/L4 で塞がれる。allow-edge-ingress-to-bff と同型で、frontend
       有効時のみ istio-system → frontend-service:port への ingress を明示許可する（必要最小の穴・多層防御は維持）。 */}}
{{- if .Values.frontend.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-ingress-to-frontend
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  # frontend Pod 宛のみに限定する。frontend.yaml の Pod ラベル app も edge.frontend.service を単一情報源に
  # 描画するため、この podSelector と必ず一致する（knob 変更時のドリフト無し）。
  podSelector:
    matchLabels:
      app: {{ .Values.edge.frontend.service }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.edge.gateway.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.edge.frontend.port }}
{{- end }}
{{- /* FR-20, UC-11, IADR-0338 決定 4, IADR-0348 (#1154): エッジ → DocumentService（同期プロトコル）も
       default-deny 下では L3/L4 で塞がれる。VirtualService が描画されても実到達しないという壊れ方は
       allow-edge-ingress-to-bff / -to-frontend と同型なので、同じ型で 3 本目を開ける。
       **edge.privateNotesSync.enabled が立っているときだけ**（既定 false）＝ルートが無い配備では穴も開かない。 */}}
{{- if .Values.edge.privateNotesSync.enabled }}
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-edge-ingress-to-document-service
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  # DocumentService の Pod 宛のみに限定する（deployment.yaml のラベル app: <name>-service）。
  # 行き先は edge.privateNotesSync.service を単一情報源に描画するため、VirtualService の
  # destination と必ず一致する（knob 変更時のドリフト無し）。
  podSelector:
    matchLabels:
      app: {{ .Values.edge.privateNotesSync.service }}
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ .Values.edge.gateway.namespace }}
      ports:
        - protocol: TCP
          port: {{ .Values.edge.privateNotesSync.port }}
{{- end }}
{{- end }}
{{- end }}
