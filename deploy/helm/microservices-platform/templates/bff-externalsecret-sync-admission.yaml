{{- /* SC-22, NFR-18, ADR-0095 決定 3, IADR-0456 決定 4, IADR-0588（Refs GHSA-j4qv-2w99-xg5p）:
       BFF の SA が ExternalSecret に対して持つ更新権限を、force-sync の注釈の変更だけに限る（多層防御・最小権限）。
       RBAC（同じ条件で描く bff-externalsecret-sync-rbac.yaml と deploy/local/vault/eso/rbac-bff-externalsecret-sync.yaml）は
       名前と動詞までしか限れない。どのフィールドを変えたかはここで見る。
       🔴 **クラスタ全体の資源である。** 利用者名（SA）で当てるので、チャートの外の名前空間（platform-infra / ai-stock-trading）の
          Role で得た権限にも同じく効く。BFF 以外の主体には当たらない（matchConditions）。
       🔴 **許すのは UPDATE（patch）で、注釈 force-sync を数字の値にする変更だけ。** spec・status・labels・他の注釈・finalizers・
          ownerReferences・generateName が変わる要求、CREATE・DELETE・サブリソースへの要求は拒否する。
       🔴 **failurePolicy: Fail・validationActions: [Deny]。** 評価できなければ拒否する。
       注釈のキーは BFF の ExternalSecretSyncRequester.ForceSyncAnnotation と一致させる（scripts/helm-bff-externalsecret-admission.test.js が固定）。 */}}
{{- $bff := .Values.services.bff | default dict }}
{{- $sync := $bff.externalSecretSync | default dict }}
{{- if and $bff.enabled $sync.enabled }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: bff-externalsecret-force-sync-only
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: ["external-secrets.io"]
        apiVersions: ["*"]
        operations: ["CREATE", "UPDATE", "DELETE"]
        resources: ["externalsecrets", "externalsecrets/*"]
  matchConditions:
    - name: bff-service-account
      expression: >-
        request.userInfo.username == 'system:serviceaccount:{{ .Values.namespace.name }}:{{ $bff.serviceAccount.name }}'
  variables:
    - name: isUpdate
      # 主資源への要求では request に subResource の鍵が無い（空文字ではない。実測）。
      expression: "request.operation == 'UPDATE' && (!has(request.subResource) || request.subResource == '')"
    - name: oldAnnotations
      expression: "has(oldObject.metadata.annotations) ? oldObject.metadata.annotations : {}"
    - name: newAnnotations
      expression: "has(object.metadata.annotations) ? object.metadata.annotations : {}"
  validations:
    - expression: "variables.isUpdate"
      message: "BFF の SA は ExternalSecret の作成・削除・サブリソースの更新をしない"
    - expression: >-
        !variables.isUpdate ||
        (has(object.spec) == has(oldObject.spec) && (!has(object.spec) || object.spec == oldObject.spec)) &&
        (has(object.status) == has(oldObject.status) && (!has(object.status) || object.status == oldObject.status))
      message: "BFF の SA は ExternalSecret の spec・status を変えない"
    - expression: >-
        !variables.isUpdate ||
        (has(object.metadata.labels) ? object.metadata.labels : {}) == (has(oldObject.metadata.labels) ? oldObject.metadata.labels : {}) &&
        (has(object.metadata.finalizers) ? object.metadata.finalizers : []) == (has(oldObject.metadata.finalizers) ? oldObject.metadata.finalizers : []) &&
        (has(object.metadata.ownerReferences) ? object.metadata.ownerReferences : []) == (has(oldObject.metadata.ownerReferences) ? oldObject.metadata.ownerReferences : []) &&
        (has(object.metadata.generateName) ? object.metadata.generateName : '') == (has(oldObject.metadata.generateName) ? oldObject.metadata.generateName : '')
      message: "BFF の SA は ExternalSecret の labels・finalizers・ownerReferences・generateName を変えない"
    - expression: >-
        !variables.isUpdate ||
        variables.oldAnnotations.all(k, k == 'force-sync' || (k in variables.newAnnotations && variables.newAnnotations[k] == variables.oldAnnotations[k])) &&
        variables.newAnnotations.all(k, k == 'force-sync' || k in variables.oldAnnotations)
      message: "BFF の SA は ExternalSecret の force-sync 以外の注釈を変えない"
    - expression: >-
        !variables.isUpdate ||
        'force-sync' in variables.newAnnotations && variables.newAnnotations['force-sync'].matches('^[0-9]{1,19}$')
      message: "BFF の SA が付ける force-sync の注釈は数字（unix 秒）だけ"
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: bff-externalsecret-force-sync-only
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  policyName: bff-externalsecret-force-sync-only
  validationActions: [Deny]
{{- end }}
