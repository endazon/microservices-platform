# NFR (#197): HorizontalPodAutoscaler — 水平スケールで可用性 99.9% とスパイク吸収を実現する。
# 対象は .Values.scaling.services（ステートレスな要求処理サービス）。CPU 使用率で min〜max にスケールする。
# metrics-server が必要（k3s は既定同梱）。HPA 有効サービスは Deployment の静的 replicas を持たず HPA が所有する。
{{- if .Values.scaling.enabled }}
{{- $hpa := .Values.scaling.hpa }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (has $name $.Values.scaling.services) }}
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ $name }}-service
  labels:
    app: {{ $name }}-service
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ $name }}-service
  minReplicas: {{ $hpa.minReplicas }}
  maxReplicas: {{ $hpa.maxReplicas }}
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: {{ $hpa.targetCPUUtilizationPercentage }}
{{- end }}
{{- end }}
{{- end }}
