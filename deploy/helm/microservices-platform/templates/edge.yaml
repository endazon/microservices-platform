# Issue #284, IADR-0076 / ADR-0005 / IADR-0017: エッジ /bff/* ルーティング。
# 外部からの入口を BFF に一本化する（IADR-0017）ため、Istio Gateway/VirtualService で
# エッジ host の /bff/* を bff-service へ通す。BFF は /bff プレフィックスを剥がさず受ける契約のため
# rewrite は張らない（フロント Caddy の reverse_proxy と同契約＝compose 経路とバイト等価。#1135 で
# nginx から Caddy へ移送したが、**元 URI 無改変という契約は同じ**である。handle_path を使わないのがその担保）。
#
# mesh(Istio) 前提。ローカル（経路B, Istio 未導入）は values-local が edge.enabled=false で無効化し、
# 別経路（README「エッジ経路」手順）へ委ねる。edge.enabled=false では何も描画しない（後方互換）。
{{- if .Values.edge.enabled }}
apiVersion: networking.istio.io/v1
kind: Gateway
metadata:
  name: microservices-platform-edge
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  # istioctl install 既定の ingressgateway を選択（実運用のラベルに合わせて上書き可）。
  selector:
    {{- toYaml .Values.edge.gateway.selector | nindent 4 }}
  servers:
    - port:
        number: {{ .Values.edge.port }}
        name: http
        protocol: HTTP
      hosts:
        {{- range .Values.edge.hosts }}
        - {{ . | quote }}
        {{- end }}
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: microservices-platform-edge
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  hosts:
    {{- range .Values.edge.hosts }}
    - {{ . | quote }}
    {{- end }}
  gateways:
    - microservices-platform-edge
  http:
    {{- if .Values.edge.oidc.enabled }}
    # ブラウザ OIDC issuer 統一（任意）: SPA と同一エッジ host から Keycloak の OIDC パスへ到達させ、
    # ブラウザが受け取る iss とサービス間検証（Auth__Authority）を同一 URL にそろえる（IADR-0076 決定3）。
    # /bff より先に評価させる（プレフィックスの取り違えを避ける）。
    - match:
        - uri: { prefix: /realms/ }
        - uri: { prefix: /resources/ }
      route:
        - destination:
            host: {{ .Values.edge.oidc.host | quote }}
            port:
              number: {{ .Values.edge.oidc.port }}
    {{- end }}
    # 外部からの /bff/* を BFF へ（rewrite 無し。BFF は /bff プレフィックス前提）。
    - match:
        - uri: { exact: /bff }
        - uri: { prefix: /bff/ }
      route:
        - destination:
            host: {{ .Values.edge.bff.service | quote }}
            port:
              number: {{ .Values.edge.bff.port }}
    {{- if .Values.edge.privateNotesSync.enabled }}
    # FR-20, UC-11, ADR-0037 課題 2, IADR-0270 決定 3, IADR-0338 決定 4, IADR-0348 (#1154):
    # Obsidian プラグインの同期プロトコルを DocumentService へ直接通す（BFF は経由しない）。
    #
    # - **rewrite は張らない。** 公開パスと契約パス（/private-notes/sync/*）を同一にすることで、
    #   プラグインの設定値は基底 URL だけで済む（/bff と同じ規律）。
    # - **前置は末尾スラッシュ込みで直書きする。** これは環境ごとに変える値ではなくサーバ契約そのもの
    #   であり、values の knob にすると打ち間違いで露出面が広がる経路を作るだけである。
    #   /private-notes（sync 以外）・/private-notes/devices・/documents は当たらず、下の catch-all
    #   （SPA）へ落ちる。**そこは 404 ではなく SPA の index.html（200 text/html）である** ——
    #   frontend の Caddy が history fallback を返すためで、「API に届いていない」ことは同じ端点を
    #   port-forward で直に叩くと 401（JSON）になるのと対で確かめる（IADR-0348 §実測）。
    # - **エッジで JWT 検証を要求しない。** 資格情報は不透明な同期トークン（Bearer）で、DocumentService が
    #   ハッシュ照合で自前検証する（IADR-0270 決定 3）。RequestAuthentication を置くと正当な要求が落ちる。
    # - catch-all より**前**に置くこと（Istio のルートは先勝ち）。
    - match:
        - uri: { prefix: /private-notes/sync/ }
      route:
        - destination:
            host: {{ .Values.edge.privateNotesSync.service | quote }}
            port:
              number: {{ .Values.edge.privateNotesSync.port }}
    {{- end }}
    {{- if .Values.frontend.enabled }}
    # Issue #313, IADR-0078: SPA(frontend) の catch-all。/bff（と任意の /realms・/resources）を先に評価した後、
    # 残る全パス（/・/settings・/assets/*・/config.js 等）を frontend の Service（edge.frontend.service）へ流す。
    # Istio は先勝ちのため本ルートを末尾に置くことで API/OIDC パスと衝突しない。SPA の history fallback は
    # frontend pod の Caddy (try_files {path} /index.html) が担うため、エッジは非 /bff を frontend へ委譲するだけでよい。
    # frontend.enabled=false では描画しない（後方互換。行き先の Service が無い状態でルートを張らない）。
    - match:
        - uri: { prefix: / }
      route:
        - destination:
            host: {{ .Values.edge.frontend.service | quote }}
            port:
              number: {{ .Values.edge.frontend.port }}
    {{- end }}
{{- if .Values.edge.privateNotesSync.enabled }}
---
# NFR-09, FR-20, ADR-0084, IADR-0348 追記（#1606）: **エッジの主体には DocumentService の /private-notes/sync/* だけを許す。**
#
# 上の VirtualService は /private-notes/sync/ だけを振り分けるが、それは「振り分け」であって「認可」ではない。
# NetworkPolicy（allow-edge-ingress-to-document-service）は gateway の Namespace から 8080 番全体を開けるので、
# 共有のゲートウェイへ別の VirtualService が付けば、JWT で守られた別の端点（/documents 等）へ届き得る。
# ここで L7 の門を置き、**経路の制限を VirtualService 1 枚に頼らない**（多層防御）。
#
# ## ALLOW ではなく DENY にした理由（選んだのは安全側）
#
# ワークロードを選ぶ ALLOW が 1 枚でもあると、**当たらない要求はすべて拒否**に変わる。DocumentService の
# 呼び出し元は名前空間の中（BFF / GraphService / McpServer）だけではない —— 別名前空間の AST
# （サイドカー無し＝平文で principal を持たない）と kubelet のプローブも居る。ALLOW で「名前空間の主体」と
# 「ゲートウェイ × sync」を列挙すると、それらが黙って 403 になり、呼び出し元が増えるたびに列挙を直す義務が生じる。
# DENY は**当たった要求だけ**を落とすので、**当たる範囲（下の from × to）以外の呼び出しは 1 本も変わらない。**
#
# - from: gateway の Namespace（edge.gateway.namespace）。NetworkPolicy が開けた L3 の穴と**同じ単一情報源**であり、
#   穴の範囲をそのまま L7 で絞る。service account 名（istioctl と helm の gateway chart で違う）と trust domain に
#   依存しないため、principal を名指しするより取りこぼしが無い。source.namespace は mTLS の主体から採るので、
#   ゲートウェイの Envoy → サイドカーの mTLS（auto mTLS ／ DestinationRule ISTIO_MUTUAL）では必ず当たる。
# - to: notPaths /private-notes/sync/*（**末尾スラッシュ込み。上の route の前置と同じ字面で直書き**。knob にしない）。
#   /private-notes/sync-settings/・/private-notes/sync（スラッシュ無し）・gRPC（8081）の面も当たる＝拒否される。
#   メソッドは絞らない —— route もメソッドを絞っておらず、許すメソッドの正は端点側の契約にある。
# - mTLS: STRICT（既定）では平文は PeerAuthentication が先に落とす。PERMISSIVE では principal を持たない平文の
#   要求に source.namespace が無いので本 DENY は当たらない（＝平文の呼び出し元を巻き込まない）。代わりに、
#   gateway の Namespace に居る**サイドカー無しの Pod**からの平文は本門を素通りする —— これは PERMISSIVE の既知の限界で、
#   閉じるのは STRICT である（IADR-0348 追記 #1606）。
apiVersion: security.istio.io/v1
kind: AuthorizationPolicy
metadata:
  name: {{ .Values.edge.privateNotesSync.service }}-edge-sync-only
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  # 行き先は route の destination・NetworkPolicy の podSelector と同じ単一情報源（ドリフト無し）。
  selector:
    matchLabels:
      app: {{ .Values.edge.privateNotesSync.service }}
  action: DENY
  rules:
    - from:
        - source:
            namespaces:
              - {{ .Values.edge.gateway.namespace | quote }}
      to:
        - operation:
            notPaths:
              - /private-notes/sync/*
{{- end }}
{{- end }}
