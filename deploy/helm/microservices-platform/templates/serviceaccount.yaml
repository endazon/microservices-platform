# SC-22, ADR-0095 決定 3, IADR-0433 決定 4, IADR-0453 決定 9 (#1411): サービス専用の ServiceAccount。
# `services.<name>.serviceAccount.create: true` のサービスにだけ描画する（宣言の無いサービスは `default` のまま）。
# 🔴 BFF の SA `bff` は Vault の k8s auth ロール `bff-secret-writer` に束縛される（deploy/local/vault/eso/bootstrap.sh）。
#    **名前空間の `default` を Vault に束縛しない** —— 束縛すると名前空間の全 Pod が秘密を書けるようになる。
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled $svc.serviceAccount $svc.serviceAccount.create }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $svc.serviceAccount.name }}
  namespace: {{ $.Values.namespace.name }}
  labels:
    app: {{ $name }}-service
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
{{- end }}
{{- end }}
