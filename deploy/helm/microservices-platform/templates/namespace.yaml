# ADR-0008: k3s 実行基盤 — 配備先 Namespace。
# ADR-0005: mesh.enabled のとき istio-injection ラベルでサイドカーを自動注入する（STRICT mTLS の前提）。
{{- if .Values.namespace.create }}
apiVersion: v1
kind: Namespace
metadata:
  name: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
    {{- if and .Values.mesh.enabled .Values.namespace.istioInjection }}
    # Istio: この Namespace の Pod へ Envoy サイドカーを自動注入する。
    istio-injection: enabled
    {{- end }}
    {{- /* NFR, IADR-0582（Refs GHSA-j4qv-2w99-xg5p）: Pod Security Admission。enforce は注入が有効なら描かない（values.yaml の podSecurity）。 */}}
    {{- $psa := .Values.podSecurity.admission }}
    {{- range $lv := list $psa.enforce $psa.warn $psa.audit }}
    {{- if not (has $lv (list "privileged" "baseline" "restricted")) }}
    {{- fail (printf "podSecurity.admission の水準は privileged / baseline / restricted のどれかです（受け取った値: %v。IADR-0582）" $lv) }}
    {{- end }}
    {{- end }}
    {{- if not (and .Values.mesh.enabled .Values.namespace.istioInjection) }}
    pod-security.kubernetes.io/enforce: {{ $psa.enforce | quote }}
    {{- end }}
    pod-security.kubernetes.io/warn: {{ $psa.warn | quote }}
    pod-security.kubernetes.io/audit: {{ $psa.audit | quote }}
{{- end }}
