# FR-15, IADR-0029 フォローアップ 4 (#145): 適用直後のドリフト即時検出（ArgoCD PostSync フック）。
# 各同期の完了後に BFF の POST /internal/config/drift-run（メッシュ内部限定）を叩き、宣言と実効構成の
# ドリフトを即時に検出・警告する（不一致は BFF ログ ConfigDrift=true → 運用アラート経路）。
# 定期検出（既定 5 分）を補完し、適用直後の取りこぼしを無くす。
{{- if and .Values.services.bff.enabled .Values.drift.postSyncHook.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: config-drift-postsync
  labels:
    app: config-drift-postsync
    app.kubernetes.io/part-of: microservices-platform
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
  annotations:
    # ArgoCD PostSync: 同期完了後にフックとして実行する。前回のフックは作成前に削除し、成功後も削除する。
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation,HookSucceeded
spec:
  backoffLimit: 3
  # 完了後は自動削除（フックの delete-policy と二重の後始末）。
  ttlSecondsAfterFinished: 300
  template:
    metadata:
      labels:
        app: config-drift-postsync
      annotations:
        {{- if .Values.mesh.enabled }}
        # STRICT mTLS 下（PeerAuthentication STRICT・IADR-0026）ではサイドカー未注入 Pod からの
        # bff-service への到達が Envoy に拒否されるため、本 Job にはサイドカーを注入する。
        # holdApplicationUntilProxyStarts で curl 前に Envoy 起動を待ち、処理後に /quitquitquit で
        # サイドカーを終了させて Job を完了させる（native sidecar 非対応の Istio でも Job が完了する）。
        sidecar.istio.io/inject: "true"
        proxy.istio.io/config: '{"holdApplicationUntilProxyStarts": true}'
        {{- else }}
        # mesh 無効時（mTLS 非適用）はサイドカー不要。
        sidecar.istio.io/inject: "false"
        {{- end }}
    spec:
      restartPolicy: Never
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: drift-trigger
          image: {{ .Values.drift.postSyncHook.image | quote }}
          # BFF の起動待ち。応答は 202（本文なし）。
          #
          # 🔴 **待ち予算を決めているのは `--retry` × `--retry-delay` だけである**（#1219 / IADR-0377）。
          # `--max-time` は **1 試行あたりの上限**であって、リトライ総時間の上限ではない
          # （curl 8.19.0 で実測: `--retry 3 --retry-delay 2 --max-time 3` は 3 秒ではなく **14 秒**掛かり、
          #  `--max-time` 無しと同じだった）。以前の注記はここを取り違えていた。
          #
          # 🔴 **`--connect-timeout` も効かない。** Ready な endpoint が 1 つも無い Service は
          # kube-proxy が即座に REJECT するので、各試行は **0 ms** で終わる
          # （実測 run 33869773915 の Job ログ: `Failed to connect ... after 0 ms`）。
          #
          # したがって予算は **30 × 6 秒 = 180 秒**。実測した BFF の time-to-ready は
          # Job Pod 起動から **51〜82 秒**（run 33869773915）で、旧予算 60 秒はこの区間の内側に在ったため
          # **間欠的に 1 本目の attempt が落ちていた**。180 秒は実測上限の約 2.2 倍である。
          # 段 9 の readiness 待ち（`--timeout=600s`）より十分短いので、BFF が本当に起きない場合は
          # **段 9 が先に落ちる** —— 予算を伸ばして検知能力を捨ててはいない。
          #
          # 処理後、注入されていれば Envoy サイドカーを /quitquitquit で終了させ Job を完了させる
          # （未注入なら接続失敗を無視）。BFF へ到達できない場合は非ゼロ終了し、PostSync の失敗として顕在化する。
          command:
            - /bin/sh
            - -c
            - |
              set -u
              curl -fsS -X POST \
                --connect-timeout 5 --max-time 240 \
                --retry 30 --retry-delay 6 --retry-connrefused --retry-all-errors \
                http://bff-service:8080/internal/config/drift-run
              code=$?
              curl -fsS -X POST http://127.0.0.1:15020/quitquitquit >/dev/null 2>&1 || true
              exit $code
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
{{- end }}
