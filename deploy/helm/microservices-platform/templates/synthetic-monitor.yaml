{{- /*
NFR-02, NFR-21, ADR-0044, ADR-0076 決定 3・4, ADR-0079 決定 1・2, IADR-0378, IADR-0469 (#1287):
合成監視（synthetic）の常駐プローブ —— 60 秒間隔・LLM を呼ばない（ADR-0079 決定 1 の常時トラフィック側）。

🔴 **syntheticMonitor.enabled（既定 false）のときだけ描く。** 無効では本ファイルは空になり、描画に 1 バイトも足さない
   （注記を YAML のコメントで書くと無効時にも出てしまうので、Go テンプレートのコメントに置いている）。

🔴 **標識と除外は同じ描画で入れる**（ADR-0076 決定 4）。3 サービスへの env は deployment.yaml が同じ条件で描く。
   ここでは「除外できない構成」を**描画の段階で止める**:
     1. 集合（_synthetic-monitor.tpl）のサービスが 1 つでも無効 → fail（その面では標識が読まれない）
     2. aianalysis に SyntheticMonitoring__AllowLlmEgress が false 以外で立っている → fail
        （60 秒のプローブが LLM を呼ぶ ＝ 月 43,200 回・概算 月約 264,000 円。ADR-0079 実測 2。
         LLM を呼ぶのは 60 分側であり、**別の配備単位で、課金の承認が先**である。決定 2・フォローアップ 2）
        ［2026-10-30 / #2335・IADR-0654］60 分側は本ファイルの末尾の `slo`（既定は無効）。許可は要求ごと（主体で分ける）なので、
        サービス全体の AllowLlmEgress は引き続き止める。
   🔴 **チャートはイメージの中身を確かめられない。** 「除外規則が入ったイメージであること」（ADR-0079 §フォローアップ 1）は
   有効化する人が確かめる前提である（README の手順）。

中身は overlay（deploy/local/synthetic-monitor/synthetic-monitor.yaml）と同じにする。env・イメージ・probe.js のバイト列の
一致は scripts/helm-synthetic-monitor.test.js が突き合わせる。資源名も同じにしてある（運用手順の kubectl がそのまま通る）ので、
ローカルの SYNTHETIC=1 と併用しない。

★ Job（CronJob）ではなく Deployment のループにしてある理由は overlay と同じ（CronJob の刻みは 1 分が下限で、
   pod 起動の揺らぎが乗ると 5 分境界の近くで不安定になる／メッシュ内の Job はサイドカーのせいで完了しない）。
*/ -}}
{{- $sm := .Values.syntheticMonitor | default dict }}
{{- $slo := $sm.slo | default dict }}
{{- /* NFR-02, ADR-0079 決定 1・2, IADR-0654 (#2335): SLO 評価用（60 分・LLM を呼ぶ）の合成は、除外の標識と同じ描画でしか置けない。 */}}
{{- if and $slo.enabled (not $sm.enabled) }}
{{- fail "syntheticMonitor.slo.enabled=true だが syntheticMonitor.enabled が偽である。SLO 評価の合成も合成であり、除外の標識（3 サービスの SyntheticMonitoring__Subjects）が無い構成では配備しない（ADR-0076 決定 4）。" }}
{{- end }}
{{- if $sm.enabled }}
{{- $services := include "msp.syntheticMonitor.exclusionServices" . | splitList "," }}
{{- range $services }}
{{- $svc := index $.Values.services . | default dict }}
{{- if not $svc.enabled }}
{{- fail (printf "syntheticMonitor.enabled=true だが services.%s が無効である。標識を読む面が欠けると、その面では合成が実利用として数えられる。除外できない構成では合成監視を配備しない（ADR-0076 決定 4）。" .) }}
{{- end }}
{{- end }}
{{- $ai := $.Values.services.aianalysis | default dict }}
{{- /* 🔴 名前は .NET の構成が同じ鍵として読む綴りをすべて同じものとして比べる（#1287 監査）:
       大文字小文字を区別しない / `:` と `__` は同じ区切り / WebApplication.CreateBuilder は `DOTNET_`・`ASPNETCORE_`
       接頭辞の環境変数も接頭辞を外して読む。完全一致で比べると SYNTHETICMONITORING__ALLOWLLMEGRESS や
       DOTNET_SyntheticMonitoring__AllowLlmEgress が素通りする。
       値は**リテラルの false（前後の空白・大文字小文字は無視）だけを許す**。それ以外はすべて止める ——
       Secret 参照（secretKeyRef / valueFrom）は描画時に中身を確かめられず、値の無い項目は何が入るか決まらない。
       ★ 判定は「リテラルの false か」の 1 条件だけにしてある。以前は `or .secretKeyRef (...)` の枝を並べていたが、
         Secret 参照の項目は `value` を持たないので値の条件だけで既に止まり、その枝は効いていなかった
         （監査の変異 M5 が生き残った理由）。deployment.yaml は `value` があればそれを描いて Secret 参照を無視するので、
         「value: false と secretKeyRef を両方書いた項目」は実際に false が入り、通してよい。 */}}
{{- range (concat ($ai.extraEnv | default list) ($ai.extraEnvAppend | default list)) }}
{{- $key := .name | toString | lower | trimPrefix "dotnet_" | trimPrefix "aspnetcore_" | replace ":" "__" }}
{{- if eq $key "syntheticmonitoring__allowllmegress" }}
{{- $literalFalse := eq (lower (trim (toString .value))) "false" }}
{{- if not $literalFalse }}
{{- fail "syntheticMonitor.enabled=true のまま aianalysis に SyntheticMonitoring__AllowLlmEgress が立っている。60 秒のプローブは LLM を呼ばない（ADR-0079 決定 1）。LLM を呼ぶ 60 分側は別の配備単位であり、課金の承認が先である（決定 2）。" }}
{{- end }}
{{- end }}
{{- end }}
apiVersion: v1
kind: ConfigMap
metadata:
  name: synthetic-monitor-probe
  labels:
    app: synthetic-monitor
    app.kubernetes.io/part-of: microservices-platform
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
# 写しの正本は deploy/local/synthetic-monitor/probe.js（バイト一致は試験が固定する）。
data:
  probe.js: |
{{ .Files.Get "files/synthetic-monitor/probe.js" | trimSuffix "\n" | indent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-monitor
  labels:
    app: synthetic-monitor
    app.kubernetes.io/part-of: microservices-platform
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synthetic-monitor
  template:
    metadata:
      labels:
        app: synthetic-monitor
      annotations:
        # スクリプトを差し替えたら Pod を作り直す（overlay では手で rollout restart が要った）。
        checksum/probe: {{ .Files.Get "files/synthetic-monitor/probe.js" | sha256sum | quote }}
    spec:
      # NFR, IADR-0583（Refs GHSA-j4qv-2w99-xg5p）: k8s API を呼ばないのでトークンを置かない。
      # 非 root（node イメージの node ユーザー）・seccomp RuntimeDefault。overlay（deploy/local/synthetic-monitor）と同じ値。
      automountServiceAccountToken: false
      {{- include "msp.podSecurityContext.restricted" $sm.runAsUser | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: probe
          image: {{ $sm.image | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- include "msp.containerSecurityContext.restricted" . | nindent 10 }}
          command: ["node", "/probe/probe.js"]
          env:
            - name: KC_URL
              value: {{ $sm.keycloak.url | quote }}
            - name: KC_REALM
              value: {{ $sm.keycloak.realm | quote }}
            # 🔴 この clientId が標識そのものである。3 サービスの SyntheticMonitoring__Subjects__0 と同じ値から描く。
            - name: SYNTHETIC_CLIENT_ID
              value: {{ $sm.clientId | quote }}
            # 🔴 実値はチャートに書かない（Vault → ExternalSecret → Secret。チャートの外）。
            - name: SYNTHETIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $sm.existingSecret }}
                  key: {{ $sm.clientSecretKey }}
            - name: BFF_BASE_URL
              value: {{ $sm.bffBaseUrl | quote }}
            # ADR-0079 決定 1 の確定値。probe.js は既定値を持たない（未設定なら起動しない）。
            - name: PROBE_INTERVAL_SECONDS
              value: {{ $sm.intervalSeconds | quote }}
            # 費用の出ない 2 経路のみ。LLM を呼ぶのは 60 分側（別の配備単位）である。
            {{- /* IADR-0654 (#2335): 60 分側は本ファイル末尾の slo の Deployment。60 秒だけの有効の描画に SLO の名前を出さないため、
                   この注記は Helm のテンプレートコメントに置く（描画されない）。 */}}
            - name: PROBE_PATHS
              value: {{ $sm.paths | quote }}
          volumeMounts:
            - name: probe
              mountPath: /probe
              readOnly: true
          resources:
            {{- toYaml $sm.resources | nindent 12 }}
      volumes:
        - name: probe
          configMap:
            name: synthetic-monitor-probe
{{- if $slo.enabled }}
{{- /* NFR-02, ADR-0079 決定 1・2, IADR-0654 (#2335): 区別と費用の上限が崩れる構成を描画の段階で止める。
       1. 主体が常時側と同じ → 要求ごとに区別できない（60 秒のプローブまで LLM を呼ぶ）
       2. 間隔が 3600 秒より短い → 費用の上限（月 720 回）が崩れる（決定 2 は間隔で上限を固定する）
       3. 経路が /bff/analysis/ask/stream 以外を含む → 初回トークンの標本を作らない経路で LLM の費用だけが出る */}}
{{- if eq (lower (trim (toString $slo.clientId))) (lower (trim (toString $sm.clientId))) }}
{{- fail "syntheticMonitor.slo.clientId が syntheticMonitor.clientId と同じである。SLO 評価の合成は別の主体でなければ要求ごとに区別できない（60 秒のプローブまで LLM を呼ぶ。ADR-0079 決定 1）。" }}
{{- end }}
{{- if lt (int $slo.intervalSeconds) 3600 }}
{{- fail "syntheticMonitor.slo.intervalSeconds が 3600 より短い。LLM を呼ぶ合成の費用の上限は 60 分の間隔で固定する（ADR-0079 決定 2）。" }}
{{- end }}
{{- if ne (trim (toString $slo.paths)) "/bff/analysis/ask/stream" }}
{{- fail "syntheticMonitor.slo.paths は /bff/analysis/ask/stream だけにする。初回トークンの標本を作るのはこの経路だけであり、他の経路では LLM の費用だけが出る（ADR-0079 決定 1）。" }}
{{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: synthetic-monitor-slo
  labels:
    app: synthetic-monitor-slo
    app.kubernetes.io/part-of: microservices-platform
    chart: {{ .Chart.Name }}-{{ .Chart.Version }}
spec:
  replicas: 1
  selector:
    matchLabels:
      app: synthetic-monitor-slo
  template:
    metadata:
      labels:
        app: synthetic-monitor-slo
      annotations:
        checksum/probe: {{ .Files.Get "files/synthetic-monitor/probe.js" | sha256sum | quote }}
    spec:
      # 60 秒のプローブと同じ器（probe.js・イメージ・非 root）。違うのは主体・間隔・経路だけである。
      automountServiceAccountToken: false
      {{- include "msp.podSecurityContext.restricted" $sm.runAsUser | nindent 6 }}
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: probe
          image: {{ $sm.image | quote }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          {{- include "msp.containerSecurityContext.restricted" . | nindent 10 }}
          command: ["node", "/probe/probe.js"]
          env:
            - name: KC_URL
              value: {{ $sm.keycloak.url | quote }}
            - name: KC_REALM
              value: {{ $sm.keycloak.realm | quote }}
            # 🔴 この clientId が「SLO 評価の合成」の標識である。BFF の SyntheticMonitoring__LlmSubjects__0 と同じ値から描く。
            - name: SYNTHETIC_CLIENT_ID
              value: {{ $slo.clientId | quote }}
            - name: SYNTHETIC_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ $slo.existingSecret }}
                  key: {{ $slo.clientSecretKey }}
            - name: BFF_BASE_URL
              value: {{ $sm.bffBaseUrl | quote }}
            # ADR-0079 決定 1・2 の確定値（60 分）。3600 秒より短いと描画が止まる（上）。
            - name: PROBE_INTERVAL_SECONDS
              value: {{ $slo.intervalSeconds | quote }}
            # LLM を呼ぶ経路は 1 本だけ（初回トークンの標本を作る SSE）。
            - name: PROBE_PATHS
              value: {{ $slo.paths | quote }}
          volumeMounts:
            - name: probe
              mountPath: /probe
              readOnly: true
          resources:
            {{- toYaml $sm.resources | nindent 12 }}
      volumes:
        - name: probe
          configMap:
            name: synthetic-monitor-probe
{{- if .Values.networkPolicy.enabled }}
---
# SLO 評価のプローブの Pod から Keycloak（token 端点）へ 1 本だけ開ける（60 秒側と同じ型）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-synthetic-monitor-slo-egress-to-keycloak
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  podSelector:
    matchLabels:
      app: synthetic-monitor-slo
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $sm.keycloak.namespace }}
          podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: {{ $sm.keycloak.port }}
{{- end }}
{{- end }}
{{- if .Values.networkPolicy.enabled }}
---
# egress の既定拒否（networkpolicy-egress.yaml）は egress を「同 Namespace ＋ DNS」に絞るため、
# 別 Namespace の Keycloak（token 端点）へは L3/L4 で届かない（届かなければ 1 度も BFF へ到達せず、
# RagLatencySeriesAbsent が「評価対象が無い」の顔で鳴る）。プローブの Pod から Keycloak の Pod・ポートへ 1 本だけ開ける。
# BFF → Vault（allow-bff-egress-to-vault）と同じ型。プローブ → BFF は同 Namespace なので既存の許可で足りる。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-synthetic-monitor-egress-to-keycloak
  namespace: {{ .Values.namespace.name }}
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  podSelector:
    matchLabels:
      app: synthetic-monitor
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: {{ $sm.keycloak.namespace }}
          podSelector:
            matchLabels:
              app: keycloak
      ports:
        - protocol: TCP
          port: {{ $sm.keycloak.port }}
{{- end }}
{{- end }}
