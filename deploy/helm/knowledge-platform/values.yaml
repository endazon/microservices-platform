# ADR-0007: Helm values — overrideable per environment
# ADR-0008: Kubernetes k3s runtime

global:
  image:
    registry: harbor.internal
    pullPolicy: IfNotPresent
  otel:
    endpoint: http://otel-collector:4317
  auth:
    authority: http://keycloak:8080/realms/knowledge-platform

# ADR-0008: k3s 実行基盤 — 配備先 Namespace。
# istio-injection: enabled により、この Namespace の Pod へサイドカーが自動注入される（段階2の前提）。
namespace:
  # チャート適用時に Namespace を作成するか（ArgoCD の CreateNamespace=true を使う場合は false でよい）。
  create: true
  name: knowledge-platform
  # Istio サイドカー自動注入ラベル。mesh.enabled=true のとき有効化する。
  istioInjection: true

# ADR-0005: サービスメッシュ（Istio / mTLS）— サービス間通信を STRICT mTLS で暗号化・相互認証する。
# これをもって暫定運用（IADR-0017: ネットワーク分離を第一防御）を解消する（後継 IADR-0024）。
mesh:
  enabled: true
  # PeerAuthentication の mTLS モード。恒久像は STRICT（平文フォールバック無し）。
  # 実クラスタへの初回導入時は PERMISSIVE で移行を確認してから STRICT へ切り替える運用を推奨。
  mtlsMode: STRICT

# IADR-0017 フォローアップ: ClusterIP + NetworkPolicy（デフォルト拒否）を実体化。
# mesh(mTLS) 配下でも多層防御（defense-in-depth）として維持する（IADR-0024）。
networkPolicy:
  enabled: true

# ADR-0007: Harbor レジストリからの Pull に用いる imagePullSecrets（docker-registry 型 Secret 名）。
# Secret 本体はコミットしない。deploy/secrets/README.md の手順で事前作成する。
imagePullSecrets: []
  # - name: harbor-pull

services:
  document:
    enabled: true
    replicas: 1
    image: knowledge-platform/document-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  datasource:
    enabled: true
    replicas: 1
    image: knowledge-platform/datasource-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  conversion:
    enabled: true
    replicas: 1
    image: knowledge-platform/conversion-service
    tag: latest
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  ingestion:
    enabled: true
    replicas: 1
    image: knowledge-platform/ingestion-service
    tag: latest
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  retrieval:
    enabled: true
    replicas: 1
    image: knowledge-platform/retrieval-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  aianalysis:
    enabled: true
    replicas: 1
    image: knowledge-platform/aianalysis-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }

  authorization:
    enabled: true
    replicas: 1
    image: knowledge-platform/authorization-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-13, UC-07, ADR-0011, IADR-0020: WikiService は「同期・統合・ABAC ゲートウェイ」責務。
  # 閲覧・編集の実体は Wiki.js（下記 wikijs ブロック）へ委譲。ABAC は本サービスが前段で強制する。
  wiki:
    enabled: true
    replicas: 1
    image: knowledge-platform/wiki-service
    tag: latest
    port: 8080
    # IADR-0021: Wiki.js への同期（GraphQL push）先とサービスアカウント API キー。
    # API キーは Secret 経由で注入（コミットしない。事前に kubectl/ArgoCD で作成する。docs/security）。
    extraEnv:
      - name: WikiJs__GraphQlEndpoint
        value: "http://wiki-js:3000/graphql"
      - name: WikiJs__ApiKey
        secretKeyRef:
          name: wikijs-sync
          key: apiKey
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  llmgateway:
    enabled: true
    replicas: 1
    image: knowledge-platform/llm-gateway
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-10, UC-05, IADR-0011: 利用状況・検索傾向・回答品質ダッシュボード集計サービス
  dashboard:
    enabled: true
    replicas: 1
    image: knowledge-platform/dashboard-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-08: 回答へのフィードバック（👍/👎・コメント）収集サービス
  feedback:
    enabled: true
    replicas: 1
    image: knowledge-platform/feedback-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  bff:
    enabled: true
    replicas: 1
    image: knowledge-platform/bff
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

# FR-13, UC-07, ADR-0011, IADR-0020: Wiki.js（閲覧・編集 UI の実体）。専用 DB `wikijs`（Postgres）。
# 認証は Keycloak(OIDC)。ABAC は WikiService ゲートウェイが前段で強制するため、Wiki.js への直接到達は
# 塞ぐ（Ingress は既定で無効。公開する場合も WikiService ゲートウェイ経由に限定する。IADR-0017/IADR-0020）。
# DB パスワードは Secret 経由（コミットしない。docs/security/security.md）。
wikijs:
  enabled: true
  replicas: 1
  registry: ghcr.io
  image: requarks/wiki
  tag: "2"
  port: 3000
  db:
    type: postgres
    host: postgres
    port: 5432
    user: kp
    name: wikijs
    # DB パスワードを保持する Secret（key=password）。事前に kubectl/ArgoCD で作成する。
    existingSecret: wikijs-db
    passwordKey: password
  persistence:
    enabled: true
    size: 5Gi
    # storageClass: ""
  ingress:
    enabled: false
    className: nginx
    host: wiki.knowledge-platform.local
    tls: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
