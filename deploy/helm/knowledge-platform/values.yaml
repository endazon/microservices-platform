# ADR-0007: Helm values — overrideable per environment
# ADR-0008: Kubernetes k3s runtime

global:
  image:
    registry: harbor.internal
    pullPolicy: IfNotPresent
  otel:
    endpoint: http://otel-collector:4317
  auth:
    authority: http://keycloak:8080/realms/knowledge-platform
  # FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: S3 互換オブジェクトストレージ（MinIO）接続。
  # 資格情報は Secret（existingSecret）経由で注入する（コミットしない。docs/security）。
  objectStorage:
    endpoint: http://minio:9000
    bucket: knowledge-normalized
    existingSecret: minio-credentials
    accessKeyKey: accessKey
    secretKeyKey: secretKey

# ADR-0008: k3s 実行基盤 — 配備先 Namespace。
# istio-injection: enabled により、この Namespace の Pod へサイドカーが自動注入される（段階2の前提）。
namespace:
  # チャート適用時に Namespace を作成するか（ArgoCD の CreateNamespace=true を使う場合は false でよい）。
  create: true
  name: knowledge-platform
  # Istio サイドカー自動注入ラベル。mesh.enabled=true のとき有効化する。
  istioInjection: true

# ADR-0005: サービスメッシュ（Istio / mTLS）— サービス間通信を STRICT mTLS で暗号化・相互認証する。
# これをもって暫定運用（IADR-0017: ネットワーク分離を第一防御）を解消する（後継 IADR-0026）。
mesh:
  enabled: true
  # PeerAuthentication の mTLS モード。恒久像は STRICT（平文フォールバック無し）。
  # 実クラスタへの初回導入時は PERMISSIVE で移行を確認してから STRICT へ切り替える運用を推奨。
  mtlsMode: STRICT

# IADR-0017 フォローアップ: ClusterIP + NetworkPolicy（デフォルト拒否）を実体化。
# mesh(mTLS) 配下でも多層防御（defense-in-depth）として維持する（IADR-0026）。
networkPolicy:
  enabled: true

# ADR-0007: Harbor レジストリからの Pull に用いる imagePullSecrets（docker-registry 型 Secret 名）。
# Secret 本体はコミットしない。deploy/secrets/README.md の手順で事前作成する。
imagePullSecrets: []
  # - name: harbor-pull

# FR-14, ADR-0018, IADR-0028: 宣言的パイプライン構成（files/pipeline.json が正、CI スキーマ検証済み）。
# 段の有効/無効・購読の組み替えは pipeline.json の変更＋GitOps 適用のみで行う（コア改修なし）。
pipeline:
  enabled: true

# FR-15, IADR-0029 フォローアップ 3 (#144): 構成バージョン（適用中の構成定義の Git コミット ID・適用日時・
# 適用者）。BFF が構成情報 API（/bff/admin/config）の Version として返す。実値は GitOps（ArgoCD Application
# の helm.parameters / CD パイプラインの --set）から適用リビジョンで上書きする（deploy/argocd/application.yaml）。
# 既定は空（未注入）＝ appliedBy のみ argocd。手順は docs/operations/operations.md を参照。
config:
  gitCommit: ""
  appliedAt: ""
  appliedBy: "argocd"

services:
  document:
    enabled: true
    replicas: 1
    image: knowledge-platform/document-service
    tag: latest
    # FR-14, IADR-0028: パイプライン段（catalog 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  datasource:
    enabled: true
    replicas: 1
    image: knowledge-platform/datasource-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  conversion:
    enabled: true
    replicas: 1
    image: knowledge-platform/conversion-service
    tag: latest
    # FR-14, IADR-0028: パイプライン段（convert 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    # FR-12, ADR-0015: 正規化本文・資産を MinIO へ保管する（書き込み側）。
    objectStorage: true
    # FR-15, IADR-0029 (#142): 自己申告（/internal/introspection）用の最小 HTTP サーフェス。
    # port を持つと Service が生成され BFF が到達できる。worker=true は HTTP ヘルスプローブを抑止する
    # （バックグラウンドワーカーは /health/* を持たず、可用性判定に HTTP プローブが不適なため）。
    port: 8080
    worker: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  ingestion:
    enabled: true
    replicas: 1
    image: knowledge-platform/ingestion-service
    tag: latest
    # FR-14, IADR-0028: パイプライン段（ingest 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    # FR-06: storage:// 本文を MinIO から実取得する（読み取り側）。
    objectStorage: true
    # FR-15, IADR-0029 (#142): 自己申告（/internal/introspection）用の最小 HTTP サーフェス。
    # port を持つと Service が生成され BFF が到達できる。worker=true は HTTP ヘルスプローブを抑止する
    # （バックグラウンドワーカーは /health/* を持たず、可用性判定に HTTP プローブが不適なため）。
    port: 8080
    worker: true
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  retrieval:
    enabled: true
    replicas: 1
    image: knowledge-platform/retrieval-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  aianalysis:
    enabled: true
    replicas: 1
    image: knowledge-platform/aianalysis-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 200m, memory: 256Mi }
      limits: { cpu: 1000m, memory: 1Gi }

  authorization:
    enabled: true
    replicas: 1
    image: knowledge-platform/authorization-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-13, UC-07, ADR-0011, IADR-0020: WikiService は「同期・統合・ABAC ゲートウェイ」責務。
  # 閲覧・編集の実体は Wiki.js（下記 wikijs ブロック）へ委譲。ABAC は本サービスが前段で強制する。
  wiki:
    enabled: true
    replicas: 1
    image: knowledge-platform/wiki-service
    tag: latest
    # FR-14, IADR-0028: パイプライン段（wiki-sync / wiki-delete 段）をホストする — pipeline-config をマウントする。
    pipelineSteps: true
    port: 8080
    # FR-06: storage:// 本文を MinIO から実取得し Wiki.js へ push する（読み取り側）。
    objectStorage: true
    # IADR-0021: Wiki.js への同期（GraphQL push）先とサービスアカウント API キー。
    # API キーは Secret 経由で注入（コミットしない。事前に kubectl/ArgoCD で作成する。docs/security）。
    extraEnv:
      - name: WikiJs__GraphQlEndpoint
        value: "http://wiki-js:3000/graphql"
      - name: WikiJs__ApiKey
        secretKeyRef:
          name: wikijs-sync
          key: apiKey
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  llmgateway:
    enabled: true
    replicas: 1
    image: knowledge-platform/llm-gateway
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-10, UC-05, IADR-0011: 利用状況・検索傾向・回答品質ダッシュボード集計サービス
  dashboard:
    enabled: true
    replicas: 1
    image: knowledge-platform/dashboard-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  # FR-08: 回答へのフィードバック（👍/👎・コメント）収集サービス
  feedback:
    enabled: true
    replicas: 1
    image: knowledge-platform/feedback-service
    tag: latest
    port: 8080
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

  bff:
    enabled: true
    replicas: 1
    image: knowledge-platform/bff
    tag: latest
    port: 8080
    # FR-15, IADR-0029, #146: BFF は段をホストしないが、ドリフト検出の突合基準として宣言（pipeline.json）を
    # 必要とする。pipelineDeclaration=true で pipeline-config ConfigMap をマウントし Pipeline__ConfigPath を注入する。
    # これが無いと BFF の宣言が空になり、実効の全購読が UndeclaredSubscription と誤判定される。
    pipelineDeclaration: true
    # FR-15, IADR-0029 (#144): BFF へ構成バージョン（config.*）を注入する（Config__GitCommit 等）。
    configVersion: true
    # FR-15, IADR-0029, Issue #118 監査: 構成情報 API の自己申告収集先。appsettings 既定は
    # ローカル実行用ポート（5001/5006）のため、k8s Service の実ポート（8080）を上書き注入する。
    extraEnv:
      - name: Introspection__Services__document-service
        value: "http://document-service:8080"
      - name: Introspection__Services__wiki-service
        value: "http://wiki-service:8080"
      # FR-15, IADR-0029 フォローアップ 1 (#142): conversion/ingestion ワーカーの自己申告収集先。
      # これで convert/ingest 段が Unverifiable でなくなり、適用漏れ検出が実効化する。
      - name: Introspection__Services__conversion-service
        value: "http://conversion-service:8080"
      - name: Introspection__Services__ingestion-service
        value: "http://ingestion-service:8080"
      # FR-15, IADR-0029 フォローアップ 2 (#143): 全 HTTP サービスへ introspection を横展開したため
      # 収集先へ追加。値は k8s Service の DNS 名（llm-gateway の Service 名は llmgateway-service）。
      - name: Introspection__Services__retrieval-service
        value: "http://retrieval-service:8080"
      - name: Introspection__Services__aianalysis-service
        value: "http://aianalysis-service:8080"
      - name: Introspection__Services__authorization-service
        value: "http://authorization-service:8080"
      - name: Introspection__Services__dashboard-service
        value: "http://dashboard-service:8080"
      - name: Introspection__Services__datasource-service
        value: "http://datasource-service:8080"
      - name: Introspection__Services__feedback-service
        value: "http://feedback-service:8080"
      - name: Introspection__Services__llm-gateway
        value: "http://llmgateway-service:8080"
    resources:
      requests: { cpu: 100m, memory: 128Mi }
      limits: { cpu: 500m, memory: 512Mi }

# FR-06, FR-12, ADR-0014/ADR-0015, IADR-0024: S3 互換オブジェクトストレージ（MinIO）。
# 本文・資産の実体を保管する。資格情報は Secret（existingSecret, key=accessKey/secretKey）経由で注入する
# （コミットしない。事前に kubectl/ArgoCD で作成する。docs/security/security.md）。
# IADR-0017/IADR-0024: API は ClusterIP のみで Ingress を張らず、直接公開しない（ABAC 強制サービス経由）。
minio:
  enabled: true
  replicas: 1
  registry: docker.io
  image: minio/minio
  tag: "RELEASE.2025-04-08T15-41-24Z"
  port: 9000
  consolePort: 9001
  existingSecret: minio-credentials
  accessKeyKey: accessKey
  secretKeyKey: secretKey
  persistence:
    enabled: true
    size: 20Gi
    # storageClass: ""
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }

# FR-13, UC-07, ADR-0011, IADR-0020: Wiki.js（閲覧・編集 UI の実体）。専用 DB `wikijs`（Postgres）。
# 認証は Keycloak(OIDC)。ABAC は WikiService ゲートウェイが前段で強制するため、Wiki.js への直接到達は
# 塞ぐ（Ingress は既定で無効。公開する場合も WikiService ゲートウェイ経由に限定する。IADR-0017/IADR-0020）。
# DB パスワードは Secret 経由（コミットしない。docs/security/security.md）。
wikijs:
  enabled: true
  replicas: 1
  registry: ghcr.io
  image: requarks/wiki
  tag: "2"
  port: 3000
  db:
    type: postgres
    host: postgres
    port: 5432
    user: kp
    name: wikijs
    # DB パスワードを保持する Secret（key=password）。事前に kubectl/ArgoCD で作成する。
    existingSecret: wikijs-db
    passwordKey: password
  persistence:
    enabled: true
    size: 5Gi
    # storageClass: ""
  ingress:
    enabled: false
    className: nginx
    host: wiki.knowledge-platform.local
    tls: false
  resources:
    requests: { cpu: 100m, memory: 256Mi }
    limits: { cpu: 1000m, memory: 1Gi }
