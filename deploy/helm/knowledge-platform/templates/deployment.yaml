# Generic Deployment template — rendered once per enabled service
# ADR-0007: k8s Deployment skeleton for knowledge-platform services
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}-service
  labels:
    app: {{ $name }}-service
    chart: {{ $.Chart.Name }}-{{ $.Chart.Version }}
spec:
  replicas: {{ $svc.replicas | default 1 }}
  selector:
    matchLabels:
      app: {{ $name }}-service
  template:
    metadata:
      labels:
        app: {{ $name }}-service
    spec:
      {{- with $.Values.imagePullSecrets }}
      # ADR-0007: Harbor レジストリからの Pull 認証（Secret は deploy/secrets で事前作成）。
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ $name }}-service
          image: "{{ $.Values.global.image.registry }}/{{ $svc.image }}:{{ $svc.tag | default "latest" }}"
          imagePullPolicy: {{ $.Values.global.image.pullPolicy }}
          {{- if $svc.port }}
          ports:
            - containerPort: {{ $svc.port }}
          {{- end }}
          env:
            - name: Otlp__Endpoint
              value: {{ $.Values.global.otel.endpoint }}
            - name: Auth__Authority
              value: {{ $.Values.global.auth.authority }}
          {{- range $svc.extraEnv }}
            - name: {{ .name }}
              {{- if .value }}
              value: {{ .value | quote }}
              {{- else if .secretKeyRef }}
              valueFrom:
                secretKeyRef:
                  name: {{ .secretKeyRef.name }}
                  key: {{ .secretKeyRef.key }}
              {{- end }}
          {{- end }}
          {{- if $svc.port }}
          livenessProbe:
            httpGet:
              path: /health/live
              port: {{ $svc.port }}
            initialDelaySeconds: 10
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /health/ready
              port: {{ $svc.port }}
            initialDelaySeconds: 15
            periodSeconds: 15
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
{{- end }}
{{- end }}
