# NFR, 計画 ADR-0135 決定 2 / ADR-0107 決定 3, ADR-0095, IADR-0547 (#1858): External Secrets Operator の chart の values。
#
# chart の内側のイメージを digest で固定する（tag は chart の版 2.8.0 の appVersion と同じ v2.8.0）。
#   chart は `<repository>:<tag>` で描くので、tag に `@sha256:<index digest>` を続けて `tag@digest` の形で描かせる
#   （本リポジトリの表記。IADR-0514 決定 1）。本体・webhook・cert-controller の 3 Deployment が同じ参照を使い、
#   3 か所に同じ repo:tag を書くので、片側だけの更新は scripts/check-image-digests.js の [digest-mismatch] が止める。
# 🔴 chart の版（k8s-local-up.sh の ESO_CHART_VERSION）を上げるときは、3 つの tag と digest を対で改める
#   （版と tag の一致は scripts/scripts.repo.test.js が見る。digest の解決は運用仕様書 §インフラ製品の点検）。
image:
  repository: ghcr.io/external-secrets/external-secrets
  tag: v2.8.0@sha256:24c0dd3699e0988520afd2218612758cd97d1f702757b5b4fcf89adaa33ef679
webhook:
  image:
    repository: ghcr.io/external-secrets/external-secrets
    tag: v2.8.0@sha256:24c0dd3699e0988520afd2218612758cd97d1f702757b5b4fcf89adaa33ef679
certController:
  image:
    repository: ghcr.io/external-secrets/external-secrets
    tag: v2.8.0@sha256:24c0dd3699e0988520afd2218612758cd97d1f702757b5b4fcf89adaa33ef679
