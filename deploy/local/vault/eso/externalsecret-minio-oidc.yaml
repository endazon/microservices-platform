# IADR-0098 (#310) PR-3: Vault secret/msp/minio-oidc（KV v2）→ 既存 Secret `minio-oidc`（同一キー client-secret）へ
# ESO が自動同期。消費側（minio.yaml の optional secretKeyRef=minio-oidc/client-secret）は無改変。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は手動 apply_secret をスキップ済み＝二重所有回避）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-oidc
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/minio-oidc
        property: client-secret
