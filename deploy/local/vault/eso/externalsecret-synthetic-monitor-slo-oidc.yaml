# NFR-02, ADR-0079 決定 1・2, IADR-0654 (#2335):
# SLO 評価用（60 分・LLM を呼ぶ）の合成プローブが client_credentials で名乗るための client secret を
# Vault `secret/msp/synthetic-monitor-slo-oidc`（KV v2）→ k8s Secret `synthetic-monitor-slo-oidc` へ同期する。
# 形は 60 秒側（externalsecret-synthetic-monitor-oidc.yaml）と同じである。
#
# 🔴 **値は realm の `synthetic-monitor-slo` client secret と一致させること。** ズレるとプローブは token 端点から
# `invalid_client` を受けて 1 度も BFF へ到達せず、初回トークンの系列は立たないままになる。
# 🔴 **この Secret は env(secretKeyRef) で読まれる。** 同期より先にプローブ Pod が起動すると空の値を掴んだまま固定される
# （IADR-0103）。helm の syntheticMonitor.slo.enabled を立てる前に SecretSynced を確かめること。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synthetic-monitor-slo-oidc
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: synthetic-monitor-slo-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/synthetic-monitor-slo-oidc
        property: client-secret
