# IADR-0097 (#310) PR-2: Vault secret/msp/minio-credentials（KV v2）→ 既存 Secret `minio-credentials`（同一キー
# accessKey/secretKey）へ ESO が自動同期。消費側（minio.yaml の existingSecret=minio-credentials）は無改変。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は手動 apply_secret をスキップ済み＝二重所有回避）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: minio-credentials
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef:
        key: msp/minio-credentials
        property: accessKey
    - secretKey: secretKey
      remoteRef:
        key: msp/minio-credentials
        property: secretKey
