# IADR-0098 (#310) PR-3: Vault secret/msp/vault-oidc（KV v2）→ 既存 Secret `vault-oidc`（同一キー client-secret）へ
# ESO が自動同期。namespace は platform-infra。消費側（Vault OIDC の runtime bootstrap
# deploy/local/vault/oidc/bootstrap.sh が本 Secret を読んで `vault write auth/oidc/config` へ渡す）は無改変。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は手動 apply_secret をスキップ済み＝二重所有回避）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: vault-oidc
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: vault-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/vault-oidc
        property: client-secret
