# #438, ADR-0045 決定 2-b/6: SMTP リレー資格情報を Vault secret/msp/keycloak-smtp から k8s Secret へ同期する。
# 値そのものは bootstrap.sh が seed する（既定は空＝実環境の値が供給されるまで機能しない。fail-safe）。
#
# ［2026-09-06 / #1245 / ADR-0078 決定 2・IADR-0404］**消費側が人間から Pod へ変わった。**
# 旧: 運用者が kcadm でこの Secret を読み、稼働 realm の smtpServer へ反映する（runbook §3）。
# 現: **近接 MTA（deploy/mail-relay/）が env(secretKeyRef) で読む**。realm には実値が一切入らず、
#     `smtpServer` は近接 MTA の Service を指す宣言固定になった（runbook §3 は退役）。
# 🔴 したがって `creationPolicy: Merge` にする —— 起動器（scripts/k8s-local-up.sh の [3/7]）が
#    **ESO の有無によらず** dev 既定でこの Secret を作る（無いと relay が起動しない）ので、
#    ESO 側は所有を奪わず**同じ Secret へ Vault の値をマージする**（keycloak-admin と同じ形）。
# 🔴 値を差し替えたら **relay を rollout し直す**こと（secretKeyRef の env は Pod 起動時に 1 度だけ解決される。
#    IADR-0103）。起動器はそれを ESO 供給後の rollout で行う。手順は
#    docs/operations/keycloak-smtp-relay-setup-runbook.md を参照。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-smtp
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-smtp
    creationPolicy: Merge
  data:
    - secretKey: host
      remoteRef:
        key: msp/keycloak-smtp
        property: host
    - secretKey: port
      remoteRef:
        key: msp/keycloak-smtp
        property: port
    - secretKey: starttls
      remoteRef:
        key: msp/keycloak-smtp
        property: starttls
    - secretKey: from
      remoteRef:
        key: msp/keycloak-smtp
        property: from
    - secretKey: user
      remoteRef:
        key: msp/keycloak-smtp
        property: user
    - secretKey: password
      remoteRef:
        key: msp/keycloak-smtp
        property: password
