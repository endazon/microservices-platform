# #438, ADR-0045 決定 2-b/6: SMTP リレー資格情報を Vault secret/msp/keycloak-smtp から k8s Secret へ同期する。
# 値そのものは bootstrap.sh が seed する（既定は空＝実環境の値が供給されるまで機能しない。fail-safe）。
# 消費側（kcadm でこの Secret を読み、稼働中の realm へ smtpServer を反映する手順）は
# docs/operations/keycloak-smtp-relay-setup-runbook.md を参照。realm.json への直接投入はしない
# （host/port/starttls は非秘匿の書式のみ realm.json 側で持たせる余地があるが、from/user/password は
# 秘匿値のため Secret 経由に閉じる。IADR-0261 決定 2）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: keycloak-smtp
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-smtp
  data:
    - secretKey: host
      remoteRef:
        key: msp/keycloak-smtp
        property: host
    - secretKey: port
      remoteRef:
        key: msp/keycloak-smtp
        property: port
    - secretKey: starttls
      remoteRef:
        key: msp/keycloak-smtp
        property: starttls
    - secretKey: from
      remoteRef:
        key: msp/keycloak-smtp
        property: from
    - secretKey: user
      remoteRef:
        key: msp/keycloak-smtp
        property: user
    - secretKey: password
      remoteRef:
        key: msp/keycloak-smtp
        property: password
