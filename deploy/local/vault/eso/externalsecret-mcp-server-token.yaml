# FR-16, FR-05, UC-09, SC-12, NFR-09, NFR-16, ADR-0029/ADR-0075, IADR-0316/IADR-0379/IADR-0401 (#1255):
# Vault secret/msp/mcp-server-token（KV v2）→ k8s Secret `mcp-server-token`
# （同一キー client-secret）へ ESO が自動同期する。`graph-service-token`（#1295）と同型で、
# 消費側は helm chart（services.mcp.serviceToken → env ServiceToken__ClientSecret）である。
#
# 🔴 この Secret が無いと McpServer は realm の `mcp-server` クライアントとして認証できず、
# east-west gRPC の登録者属性の解決が 1 件も通らない。**任意配線ではない** ——
# helm は **非 optional** な secretKeyRef で参照するので、欠けたら Pod が起動しない
# （注入漏れが「匿名で呼んで UNAUTHENTICATED を食い続ける」静かな縮退へ倒れない）。
#
# 🔴 この資格情報は**利用者トークンの転送をやめる**ためのものである（IADR-0401 決定 2）。
# 呼び出し先の読み口が「この 1 人の属性は何か」へ狭めてあるので、この主体は名簿を引けない。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は k8s-local-up.sh の手動 apply をスキップ済み）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-server-token
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-server-token
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/mcp-server-token
        property: client-secret
