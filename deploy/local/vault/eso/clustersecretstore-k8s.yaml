# IADR-0096 (#310): `ESO=1` のときにのみ適用する ClusterSecretStore `vault-backend` の **kubernetes 認証版**。
# 既定（`VAULT=1` 単独）の store（../clustersecretstore.yaml）は **token 認証のまま**で、既存フロー（AST の
# ExternalSecret 等）を壊さない（byte 等価）。`ESO=1` ブロックは bootstrap.sh で k8s auth backend／policy／role `eso` を
# 設定した「後に」本ファイルを apply して store を kubernetes 認証へ上書きする（同名 `vault-backend`＝store 一元化）。
# これにより「k8s auth backend が未設定なのに store が k8s auth」という不整合（VAULT=1 単独破壊）を避ける。
apiVersion: external-secrets.io/v1beta1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/part-of: platform-observability
spec:
  provider:
    vault:
      server: "http://vault.platform-infra:8200"
      path: "secret"
      version: "v2"
      auth:
        # 本番同等の kubernetes 認証。静的 root トークンを store に持たず、ESO の SA
        # （external-secrets/external-secrets）のトークンを Vault の k8s auth role `eso` で検証する
        # （role/policy・k8s auth の enable/config は bootstrap.sh が入れる）。
        kubernetes:
          mountPath: kubernetes
          role: eso
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
