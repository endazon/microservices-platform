# NFR-02, NFR-21, ADR-0076 決定 4, ADR-0079 決定 1, IADR-0096 / IADR-0378 (#1287):
# 合成監視（synthetic）のプローブが client_credentials で名乗るための client secret を
# Vault `secret/msp/synthetic-monitor-oidc`（KV v2）→ k8s Secret `synthetic-monitor-oidc` へ同期する。
#
# creationPolicy: Owner ＝ ESO が Secret を作成/所有する（ESO=1 のとき起動器は手動 apply_secret を
# スキップする＝二重所有回避。bff-oidc / wikijs-oidc と同じ形）。
#
# 🔴 **値は realm の `synthetic-monitor` client secret と一致させること。** ズレるとプローブは
# token 端点から `invalid_client` を受けて 1 度も BFF へ到達せず、**`/analysis/ask` の HTTP 系列は
# 立たないまま**になる —— `RagLatencySeriesAbsent` は鳴るが、原因は「評価対象が本当に無い」ではなく
# 資格情報のズレである（同じ表示で別の原因になる）。
#
# 🔴 **この Secret は env(secretKeyRef) で読まれる。** ESO の供給より先にプローブ Pod が起動すると、
# その Pod は空の値を掴んだまま固定される（IADR-0103）。起動器は SYNTHETIC=1 のとき本 ExternalSecret の
# SecretSynced を待ってからプローブを配備する。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: synthetic-monitor-oidc
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: synthetic-monitor-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/synthetic-monitor-oidc
        property: client-secret
