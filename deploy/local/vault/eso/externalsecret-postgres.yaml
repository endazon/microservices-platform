# IADR-0099 (#310) PR-4: Vault secret/msp/postgres（KV v2）→ 既存 Secret `postgres`（キー password）へ ESO が同期。
# namespace は platform-infra。消費側（deploy/local/infra/postgres.yaml の非 optional secretKeyRef=postgres/password）は無改変。
#
# ★基盤 secret は PR-1〜3 と扱いが異なる（creationPolicy: Merge）:
#   postgres/rabbitmq/keycloak-admin は step [4/7] の infra rollout（ブロッキング）で **非 optional** に消費されるため、
#   ESO ブロック（step 後半）より前に Secret が存在していなければ Pod が起動しない。よって手動 apply（step 3）は
#   ESO=1 でも **スキップしない**（bootstrap 必須）。本 ExternalSecret は `creationPolicy: Merge` で、既に手動作成された
#   Secret に **同一値を上書き（マージ）するだけ**で所有・再作成しない。seed 値は現行既定と完全一致（値不変＝Pod 再起動や
#   PVC 初期化済み DB のパスワード不整合を起こさない）。本番同等の Vault→ESO 供給経路を配線しつつローカル bootstrap を壊さない。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: postgres
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres
    # Merge: 既存 Secret（手動 apply が作成）にキーをマージするのみ。ESO は Secret を所有・再作成しない。
    creationPolicy: Merge
  data:
    - secretKey: password
      remoteRef:
        key: msp/postgres
        property: password
