# IADR-0096 (#310): Vault の kubernetes 認証は、提示された SA トークンを Kubernetes の TokenReview API で
# 検証する。Vault は「自分自身の SA トークン」を reviewer として使う（in-cluster local mode）ため、
# vault の ServiceAccount に system:auth-delegator（TokenReview/SubjectAccessReview）を付与する。
# dev 専用・opt-in（ESO=1 のときのみ apply）。本番の Vault は別途 unseal/HA/監査（Tier 3）。
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: vault-auth-delegator
  labels:
    app: vault
    app.kubernetes.io/part-of: platform-observability
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: system:auth-delegator
subjects:
  - kind: ServiceAccount
    name: default
    namespace: platform-infra
