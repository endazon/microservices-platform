# FR-05, FR-09, SC-17, ADR-0004/ADR-0026, IADR-0301/IADR-0321 (#1101): Vault secret/msp/identity-admin-oidc
# （KV v2）→ k8s Secret `identity-admin-oidc`（同一キー client-secret）へ ESO が自動同期する。
# `bff-oidc`（#1107）と同型で、消費側は helm chart（services.authorization.extraEnv →
# env IdentityAdmin__Keycloak__ClientSecret）である。
#
# 🔴 この Secret が無いと authorization-service は realm の `identity-admin` クライアントとして
# 認証できず、SC-17 の変更が Keycloak へ 1 件も届かない。**任意配線ではない** —— helm は
# **非 optional** な secretKeyRef で参照するので、欠けたら Pod が起動しない
# （注入漏れが「偽の身元プロバイダで起動して静かに縮退」へ倒れない。#1101 が潰した穴）。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は k8s-local-up.sh の手動 apply をスキップ済み）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: identity-admin-oidc
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: identity-admin-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/identity-admin-oidc
        property: client-secret
