# NFR-21, ADR-0045 決定 2-b/6, IADR-0571 (#2044): 警報メールの宛先を OpenBao secret/msp/alertmanager-mail（KV v2・
# プロパティ `to`）から Secret `alertmanager-mail`（キー `to`）へ同期する。消費側は可観測性オーバーレイの Alertmanager
# （deploy/local/observability/alertmanager.yaml の initContainer。secretKeyRef は optional）。
#
# 🔴 **宛先の実値はリポジトリに置かない。** 値は運用者が OpenBao へ入れる（docs/operations/alertmanager-mail-receiver-runbook.md）。
#    bootstrap.sh は seed しない —— 宛先は「空の既定」に意味が無く（空なら default-null へ落ちる）、dev の既定値を置くと
#    「配線したつもり」になる（IADR-0304 決定 2 と同じ理由）。
# 🔴 **起動器（scripts/k8s-local-up.sh）は OBSERVABILITY=1 のとき本ファイルを apply するが、同期は待たない。**
#    OpenBao に KV が無いあいだ ExternalSecret は SecretSyncedError のまま Secret を作らず、Alertmanager は default-null で
#    起動する（壊れはしない。「宛先が未供給」が ExternalSecret の状態に見える）。KV を入れたら force-sync して
#    Alertmanager を作り直す（Runbook §1・§2）。
# creationPolicy: Owner ＝ ESO が Secret を作成・所有する（ESO を使わない環境は kubectl create secret で同名・同キーを作ればよい）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: alertmanager-mail
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: alertmanager-mail
    creationPolicy: Owner
  data:
    - secretKey: to
      remoteRef:
        key: msp/alertmanager-mail
        property: to
