# NFR, ADR-0002 (#1012): Vault secret/msp/postgres-app（KV v2）→ Secret `postgres-app`（キー password）へ ESO が同期。
# namespace は microservices-platform。消費側は helm の deployment.yaml
# （global.db.existingSecret=postgres-app の **非 optional** な secretKeyRef → DB_PASSWORD →
# ConnectionStrings__DefaultConnection の $(DB_PASSWORD) 展開）。
#
# ★これが無いと ESO=1 で DB を持つ全サービスが起動できない（#1012 のレビュー指摘）。
# k8s-local-up.sh は postgres-app を minio-credentials/wikijs-db/wikijs-sync と同じ
# `ESO != 1` ブロックで手動 apply しており、ESO=1 では手動 apply をスキップする。
# 対応する ExternalSecret を置き忘れると **供給元が 1 つも無くなる**。
# 既存の externalsecret-postgres.yaml は別物である —— あちらは platform-infra ns の
# `postgres`（DB 管理者パスワード。deploy/local/infra/postgres.yaml が消費）を指す。
#
# creationPolicy は PR-2 の 3 兄弟と同じ Owner（手動 apply をスキップするので ESO が唯一の所有者）。
# 基盤 secret（postgres/rabbitmq/keycloak-admin）の Merge とは扱いが違う —— あちらは
# step [4/7] の infra rollout より前に実在が要るため手動 apply を ESO=1 でもスキップしない。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: postgres-app
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: postgres-app
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: msp/postgres-app
        property: password
