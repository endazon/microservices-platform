# NFR-18, ADR-0124 決定 1, IADR-0576 (GHSA-rh44-px44-p48q):
# 投入器の主体（realm の機密クライアント `abac-seeder`。既定で無効・実行の間だけ有効）の client secret を
# Vault `secret/msp/abac-seeder-oidc`（KV v2）→ k8s Secret `platform-infra/abac-seeder-oidc` へ同期する。
#
# 読み手は Pod ではなく、ホストで走る投入器（scripts/seed-*.js）と運用スクリプト（republish・archive）である。
# 実行時に `kubectl get secret` でこの Secret を読む（scripts/lib/abac-seeder-session.js。realm の宣言の値へは落ちない）。
# 回すときは認証基盤と Vault を対で書く（docs/operations/paired-secret-rotation-runbook.md）。同期の後はスクリプトも新しい値で動く。
#
# 🔴 `creationPolicy: Merge` にする —— 起動器（scripts/k8s-local-up.sh の [3/7]）が **ESO の有無によらず** この Secret を作る
#    （ESO の無い起動でも投入器が読めるように）ので、ESO 側は所有を奪わず同じ Secret へ Vault の値をマージする
#    （reset-gate-oidc / keycloak-admin と同じ形）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: abac-seeder-oidc
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: abac-seeder-oidc
    creationPolicy: Merge
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/abac-seeder-oidc
        property: client-secret
