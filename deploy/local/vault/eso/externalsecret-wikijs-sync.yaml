# IADR-0097 (#310) PR-2: Vault secret/msp/wikijs-sync（KV v2）→ 既存 Secret `wikijs-sync`（同一キー apiKey）へ
# ESO が自動同期。消費側（WikiJs__ApiKey secretKeyRef=wikijs-sync/apiKey）は無改変。creationPolicy: Owner。
# fail-safe: 空 apiKey は現行 apply_secret の空既定と同値（Wiki 同期の API 鍵は明示設定時のみ）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikijs-sync
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: wikijs-sync
    creationPolicy: Owner
  data:
    - secretKey: apiKey
      remoteRef:
        key: msp/wikijs-sync
        property: apiKey
