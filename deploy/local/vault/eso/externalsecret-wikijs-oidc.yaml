# NFR-09, IADR-0095/IADR-0098/IADR-0342 (#1127): Wiki.js の Keycloak OIDC ストラテジが使う client secret。
# Vault secret/msp/wikijs-oidc（KV v2）→ Secret `wikijs-oidc`（key `client-secret`）へ ESO が同期する。
#
# 🔴 **この Secret を env で読む Pod は 1 つも無い。** 読むのは
# `deploy/local/wikijs-setup/bootstrap.sh` の段 8 であり、反映先は Wiki.js の DB（`authentication`
# テーブル）である ——「manifest では復元できない runtime 状態」を冪等に再適用するための入力である。
# したがって k8s-local-up.sh の ESO 後段 rollout の対象にも入れない（作るところまでが本ファイルの責務）。
# keycloak-smtp（IADR-0332）と同じ性質で、違いは読み手が人ではなく bootstrap である点だけ。
#
# creationPolicy: Owner ＝ ESO が Secret を作成/所有する（ESO=1 時は手動 apply_secret をスキップ済み
# ＝二重所有回避）。値は realm import の `wiki-js` client secret と一致させること（ズレると
# Keycloak の token 端点が `invalid_client` を返し、認可までは進むのに callback で落ちる）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: wikijs-oidc
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: wikijs-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/wikijs-oidc
        property: client-secret
