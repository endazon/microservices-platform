# FR-02, NFR-09, NFR-16, ADR-0029/ADR-0075, IADR-0316/IADR-0379/IADR-0397 (#1255):
# Vault secret/msp/ingestion-service-token（KV v2）→ k8s Secret `ingestion-service-token`
# （同一キー client-secret）へ ESO が自動同期する。消費側は helm chart
# （services.ingestion.serviceToken → env ServiceToken__ClientSecret）である。
#
# 🔴 この Secret が無いと IngestionService は realm の `ingestion-service` クライアントとして
# 認証できず、east-west gRPC の取り込み埋め込みが 1 件も通らない。**任意配線ではない** ——
# helm は **非 optional** な secretKeyRef で参照するので、欠けたら Pod が起動しない。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は k8s-local-up.sh の手動 apply をスキップ済み）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: ingestion-service-token
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: ingestion-service-token
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/ingestion-service-token
        property: client-secret
