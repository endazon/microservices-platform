# FR-16, SC-12, ADR-0123 決定 2, ADR-0124 決定 1, IADR-0516 決定 2 (#1817): Vault secret/msp/mcp-client-admin-oidc
# （KV v2）→ k8s Secret `mcp-client-admin-oidc`（同一キー client-secret）へ ESO が自動同期する。
# `identity-admin-oidc`（#1101）と同型で、消費側は helm chart（services.mcp.extraEnv →
# env McpClientProvisioning__Keycloak__ClientSecret）である。
#
# 🔴 この Secret が無いと mcp-service は realm の `mcp-client-admin` クライアントとして認証できず、
# SC-12 の無人の登録・属性の差し替えが Keycloak へ 1 件も届かない。**任意配線ではない** —— helm は
# **非 optional** な secretKeyRef で参照するので、欠けたら Pod が起動しない
# （注入漏れが「書き込み口の無いまま起動して 503 を返し続ける」静かな縮退へ倒れない）。
#
# 🔴 この資格情報は realm の**全クライアント**（secret の読み取りを含む）と**全利用者**の属性・ロールを書き換えられる
# （manage-clients / manage-users。Keycloak 24 では絞れない）。漏えい時の影響範囲とローテーションは
# docs/security/security.md と docs/operations/paired-secret-rotation-runbook.md。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は k8s-local-up.sh の手動 apply をスキップ済み）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: mcp-client-admin-oidc
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: mcp-client-admin-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/mcp-client-admin-oidc
        property: client-secret
