# IADR-0096 (#310): PR-1 疎通対象。Vault の secret/msp/llm-provider-credentials（KV v2）を、既存の k8s Secret
# `llm-provider-credentials`（同一キー anthropic-api-key/openai-api-key）へ ESO が自動同期する。消費側
# （llmgateway の secretKeyRef・ADR-0010）は無改変。creationPolicy: Owner ＝ ESO が Secret を作成/所有する
# （ESO=1 時は手動 apply_secret をスキップ済み＝二重所有回避）。fail-safe: 未 seed/未同期時は Secret が空/未作成で
# 外部 LLM を呼ばない（現行の空既定と同値）。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: llm-provider-credentials
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: llm-provider-credentials
    creationPolicy: Owner
  data:
    - secretKey: anthropic-api-key
      remoteRef:
        key: msp/llm-provider-credentials
        property: anthropic-api-key
    - secretKey: openai-api-key
      remoteRef:
        key: msp/llm-provider-credentials
        property: openai-api-key
