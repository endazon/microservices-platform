# IADR-0098 (#310) PR-3: Vault secret/msp/grafana-oidc（KV v2）→ 既存 Secret `grafana-oidc`（同一キー client-secret）へ
# ESO が自動同期。namespace は platform-infra（grafana と同居）。消費側（grafana.yaml の optional secretKeyRef=
# grafana-oidc/client-secret）は無改変。creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は手動 apply_secret
# をスキップ済み＝二重所有回避）。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: grafana-oidc
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: grafana-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/grafana-oidc
        property: client-secret
