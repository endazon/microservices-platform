# SC-15, FR-05, ADR-0026 / ADR-0078 決定 4, IADR-0329 / IADR-0404 (#1245 PR-C):
# 門（reset-gate）が Keycloak Admin REST を叩くための機密クライアントの secret を
# Vault `secret/msp/reset-gate-oidc`（KV v2）→ k8s Secret `reset-gate-oidc` へ同期する。
#
# 門は近接 MTA へ投函できない状態を検知すると `resetPasswordAllowed` を false へ倒す。
# 権限は `realm-management` の **view-realm ＋ manage-realm だけ**（利用者が 2026-09-05 に承諾）。
#
# 🔴 `creationPolicy: Merge` にする —— 起動器（scripts/k8s-local-up.sh の [3/7]）が
#    **ESO の有無によらず** dev 既定でこの Secret を作る（無いと門が起動せず [4/7] で止まる）ので、
#    ESO 側は所有を奪わず同じ Secret へ Vault の値をマージする（keycloak-smtp / keycloak-admin と同じ形）。
# 🔴 **資格情報が無い／古い門は 401 を打ち続けるだけで、窓（実在利用者だけ 500）は開いたまま**になる。
#    値を差し替えたら**門を rollout し直す**こと（secretKeyRef の env は Pod 起動時に 1 度だけ解決される。
#    IADR-0103）。起動器はそれを ESO 供給後の rollout で行う。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: reset-gate-oidc
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: reset-gate-oidc
    creationPolicy: Merge
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/reset-gate-oidc
        property: client-secret
