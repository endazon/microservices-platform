# IADR-0097 (#310) PR-2: Vault secret/msp/object-storage-credentials（KV v2）→ Secret `object-storage-credentials`
# （キー accessKey/secretKey）へ ESO が自動同期。消費側は seaweedfs.yaml と各サービスの ObjectStorage__* env
# （existingSecret=object-storage-credentials）。
# IADR-0461 決定 3 (#1499): 旧名 object-storage-credentials（Vault も msp/object-storage-credentials）から製品名を外した。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は手動 apply_secret をスキップ済み＝二重所有回避）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: object-storage-credentials
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: object-storage-credentials
    creationPolicy: Owner
  data:
    - secretKey: accessKey
      remoteRef:
        key: msp/object-storage-credentials
        property: accessKey
    - secretKey: secretKey
      remoteRef:
        key: msp/object-storage-credentials
        property: secretKey
