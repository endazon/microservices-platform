# IADR-0097 (#310) PR-2: Vault secret/msp/wikijs-db（KV v2）→ 既存 Secret `wikijs-db`（同一キー password）へ
# ESO が自動同期。消費側（wikijs.yaml の DB_PASS secretKeyRef=wikijs-db/password）は無改変。creationPolicy: Owner。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: wikijs-db
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: wikijs-db
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: msp/wikijs-db
        property: password
