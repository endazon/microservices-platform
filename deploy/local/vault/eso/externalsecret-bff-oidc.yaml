# NFR, SC-13, ADR-0026/ADR-0032, IADR-0251/IADR-0273/IADR-0318 (#1107): Vault secret/msp/bff-oidc（KV v2）→
# k8s Secret `bff-oidc`（同一キー client-secret）へ ESO が自動同期する。IADR-0098 の `*-oidc` 群と同型で、
# 消費側は helm chart（services.bff.session.existingSecret → env BffSession__ClientSecret）である。
#
# 🔴 この Secret が無いと BFF は realm の `bff` クライアントとして認証できず、`GET /bff/auth/login` が
# 500 で落ちる（Keycloak の PAR 端点が 401 を返す）。**任意配線ではない。**
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は k8s-local-up.sh の手動 apply をスキップ済み）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: bff-oidc
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: bff-oidc
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/bff-oidc
        property: client-secret
