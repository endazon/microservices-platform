# NFR, ADR-0027 (#1022): Vault secret/msp/rabbitmq-app（KV v2）→ Secret `rabbitmq-app`（キー password）へ
# ESO が同期。namespace は microservices-platform。消費側は helm の deployment.yaml
# （global.messaging.existingSecret=rabbitmq-app の **非 optional** な secretKeyRef → RABBITMQ_PASSWORD →
# RabbitMq__ConnectionString の $(RABBITMQ_PASSWORD) 展開）。
#
# ★これが無いと ESO=1 で RabbitMQ を使う 7 サービス（document / datasource / conversion / ingestion /
# retrieval / wiki / graph）が起動できない。k8s-local-up.sh は rabbitmq-app を postgres-app と同じ
# `ESO != 1` ブロックで手動 apply しており、ESO=1 では手動 apply をスキップする。
# **手動 apply を止めたなら、代わりの供給元を必ず置く**（#1012 が事後に踏んだ欠陥。IADR-0286 の
# 2026-08-28 追記／IADR-0291 決定 4）。
#
# 既存の externalsecret-rabbitmq.yaml は別物である —— あちらは platform-infra ns の `rabbitmq`
# （ブローカ自身の資格情報。deploy/local/infra/rabbitmq.yaml が消費）を指し、creationPolicy は Merge。
# こちらは手動 apply をスキップするので ESO が唯一の所有者＝Owner（postgres-app と同じ）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-app
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rabbitmq-app
    creationPolicy: Owner
  data:
    - secretKey: password
      remoteRef:
        key: msp/rabbitmq-app
        property: password
