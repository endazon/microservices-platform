# NFR, IADR-0573（Refs GHSA-pvmh-cvmf-pvcp）: ブローカのサービスごとのユーザーのパスワード（ブローカ側の写し）。
# Vault secret/msp/rabbitmq-users と secret/ai-stock-trading/rabbitmq-users（KV v2。プロパティ名 = ユーザー名）→
# platform-infra の Secret `rabbitmq-users`（キー = ユーザー名）。読み手は deploy/local/rabbitmq-setup/reconcile-users.sh だけ
# （ブローカへユーザーを作る・合わせる）。消費側（各サービス）は自分の名前空間の ExternalSecret で同じ KV を読む
# （AST は AST の chart、MSP は後の段）。値の種は bootstrap.sh が無いときだけ乱数で入れる（平文は非コミット）。
# creationPolicy: Owner ＝ ESO が唯一の所有者（ESO=1 のときだけ apply する）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: rabbitmq-users
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: rabbitmq-users
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: msp/rabbitmq-users
    - extract:
        key: ai-stock-trading/rabbitmq-users
