# FR-22, NFR-09, NFR-16, ADR-0004/ADR-0029/ADR-0075, IADR-0316/IADR-0379/IADR-0419 (#1255):
# Vault secret/msp/document-service-token（KV v2）→ k8s Secret `document-service-token`
# （同一キー client-secret）へ ESO が自動同期する。`retrieval-service-token` と同型で、
# 消費側は helm chart（services.document.serviceToken → env ServiceToken__ClientSecret）である。
#
# 🔴 この Secret が無いと DocumentService は realm の `document-service` クライアントとして
# 認証できず、個人資料の通知が 1 件も届かない。**任意配線ではない** ——
# helm は **非 optional** な secretKeyRef で参照するので、欠けたら Pod が起動しない。
# 🔴 これは fail-open の経路なので、**起動を止める設計そのものが安全側である** ——
# 資格情報だけが欠けた状態で起動すると、送出は UNAUTHENTICATED を食い続け、
# エラーログと計器（notification.dispatch.total の結末 rejected）にしか出ない。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は k8s-local-up.sh の手動 apply をスキップ済み）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: document-service-token
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: document-service-token
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/document-service-token
        property: client-secret
