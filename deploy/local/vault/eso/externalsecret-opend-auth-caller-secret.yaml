# NFR, AST/SC-04, AST/IADR-0566（Refs GHSA-57gc-27c7-gvwm）: AST の OpenD 認証サイドカーへ BFF が名乗る共有シークレット。
# Vault secret/ai-stock-trading/opend-auth（KV v2・プロパティ caller-secret）→ 基盤の名前空間の Secret `opend-auth-caller-secret`。
# AST の chart も同じ Vault のキーを AST の名前空間へ同期する（サイドカーが読む）。**両側が同じキーを読む**ので値は 1 か所で回せる。
#
# 消費側は BFF の env `OpendAuth__CallerSecret`（deploy/local/values-local.yaml の services.bff.extraEnvAppend。optional）。
# 値が Vault に無いあいだは Secret が作られず、BFF は上流を呼ばずに SC-04 へ「接続資格が構成されていません」と示す（BFF は起動する）。
# 値を回したら Reloader（同じ values-local の deploymentAnnotations）が BFF を作り直す。
# creationPolicy: Owner ＝ ESO が唯一の所有者（ESO=1 のときだけ apply する。ESO が無い経路は手で同名の Secret を作る）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: opend-auth-caller-secret
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: opend-auth-caller-secret
    creationPolicy: Owner
  data:
    - secretKey: caller-secret
      remoteRef:
        key: ai-stock-trading/opend-auth
        property: caller-secret
