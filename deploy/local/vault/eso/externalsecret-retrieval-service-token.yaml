# FR-03, NFR-09, NFR-16, ADR-0029/ADR-0075, IADR-0316/IADR-0379/IADR-0397 (#1255):
# Vault secret/msp/retrieval-service-token（KV v2）→ k8s Secret `retrieval-service-token`
# （同一キー client-secret）へ ESO が自動同期する。`bff-oidc`（#1107）と同型で、消費側は
# helm chart（services.retrieval.serviceToken → env ServiceToken__ClientSecret）である。
#
# 🔴 この Secret が無いと RetrievalService は realm の `retrieval-service` クライアントとして
# 認証できず、east-west gRPC のクエリ埋め込みが 1 件も通らない。**任意配線ではない** ——
# helm は **非 optional** な secretKeyRef で参照するので、欠けたら Pod が起動しない
# （注入漏れが「空の secret で起動して検索だけが静かに落ちる」へ倒れない）。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は k8s-local-up.sh の手動 apply をスキップ済み）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: retrieval-service-token
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: retrieval-service-token
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/retrieval-service-token
        property: client-secret
