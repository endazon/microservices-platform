# NFR-10, NFR-18, ADR-0026 / ADR-0124, IADR-0570 (#2024): 試験アカウント e2e-* の資格情報を
# OpenBao `secret/msp/e2e-accounts`（KV v2）→ k8s Secret `e2e-accounts`（platform-infra）へ同期する。
#
# 読み手は 2 つで、どちらも platform-infra に居る（Secret は読み手の namespace に置く）:
#   - realm の後追い Job（deploy/local/keycloak-setup/realm-reconcile-job.yaml の envFrom・optional）
#   - Keycloak の取り込み元を作る scripts/k8s-local-up.sh の [3/7]（kubectl で読み、reconcile-realm.js --render-import へ env で渡す）
# E2E の runner も同じ Secret を読む（`kubectl -n platform-infra get secret e2e-accounts`）。
#
# 🔴 値はリポジトリに置かない。KV へ入れるのは deploy/local/README.md の「試験アカウント（e2e-*）」の手順
#    （scripts/gen-e2e-accounts.js が生成して `vault kv put … -` へ流す。端末に出さない）。Vault の種（bootstrap.sh）は入れない。
# 🔴 KV が無い間は同期に失敗し Secret は作られない。そのとき e2e 利用者は作られない（fail-closed。他の機能には影響しない）。
# Secret のキーは realm JSON のプレースホルダの名前（E2E_<ROLE>_PASSWORD / E2E_<ROLE>_TOTP_SECRET）。KV のプロパティは
# その小文字・`_`→`-`（e2e-<role>-password / e2e-<role>-totp-secret）。3 つの集合の一致は scripts/keycloak-realm-reconcile.test.js が固定する。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有する（手動で作る経路は持たない）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: e2e-accounts
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: e2e-accounts
    creationPolicy: Owner
  data:
    - secretKey: E2E_USER_PASSWORD
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-user-password
    - secretKey: E2E_USER_TOTP_SECRET
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-user-totp-secret
    - secretKey: E2E_OPERATOR_PASSWORD
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-operator-password
    - secretKey: E2E_OPERATOR_TOTP_SECRET
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-operator-totp-secret
    - secretKey: E2E_ADMIN_PASSWORD
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-admin-password
    - secretKey: E2E_ADMIN_TOTP_SECRET
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-admin-totp-secret
    - secretKey: E2E_NOACCESS_PASSWORD
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-noaccess-password
    - secretKey: E2E_NOACCESS_TOTP_SECRET
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-noaccess-totp-secret
    - secretKey: E2E_REVOCABLE_PASSWORD
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-revocable-password
    - secretKey: E2E_REVOCABLE_TOTP_SECRET
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-revocable-totp-secret
    - secretKey: E2E_TRADING_OWNER_PASSWORD
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-trading-owner-password
    - secretKey: E2E_TRADING_OWNER_TOTP_SECRET
      remoteRef:
        key: msp/e2e-accounts
        property: e2e-trading-owner-totp-secret
