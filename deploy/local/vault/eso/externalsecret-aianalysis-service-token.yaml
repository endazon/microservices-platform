# FR-04, NFR-09, NFR-16, ADR-0029/ADR-0075, IADR-0316/IADR-0379/IADR-0398 (#1255):
# Vault secret/msp/aianalysis-service-token（KV v2）→ k8s Secret `aianalysis-service-token`
# （同一キー client-secret）へ ESO が自動同期する。`retrieval-service-token`（#1290）と同型で、
# 消費側は helm chart（services.aianalysis.serviceToken → env ServiceToken__ClientSecret）である。
#
# 🔴 この Secret が無いと AiAnalysisService は realm の `aianalysis-service` クライアントとして
# 認証できず、east-west gRPC のテキスト生成（一括・逐次）が 1 件も通らない。**任意配線ではない** ——
# helm は **非 optional** な secretKeyRef で参照するので、欠けたら Pod が起動しない
# （注入漏れが「匿名で呼んで UNAUTHENTICATED を食い続ける」静かな縮退へ倒れない）。
# creationPolicy: Owner ＝ ESO が Secret を作成/所有（ESO=1 時は k8s-local-up.sh の手動 apply をスキップ済み）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: aianalysis-service-token
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: aianalysis-service-token
    creationPolicy: Owner
  data:
    - secretKey: client-secret
      remoteRef:
        key: msp/aianalysis-service-token
        property: client-secret
