# SC-22, NFR-18, ADR-0095 決定 3, IADR-0456 決定 4 (#1477): BFF（SA microservices-platform/bff）が書き込み後に
# **チャートの外の名前空間**の ExternalSecret へ force-sync の注釈を付ける権限。scripts/k8s-local-up.sh が ESO=1 のとき apply する。
# MSP の名前空間の Role はチャート（deploy/helm/microservices-platform/templates/bff-externalsecret-sync-rbac.yaml）が描く。
#
# 🔴 **resourceNames で名前を限る。** deploy/bootstrap/sc22-secret-items.json の items[] の externalSecret だけ。
#    名前空間ごとの名前の集合が items[] と完全一致することを Platform.Bff.Tests の SecretItemExternalSecretRbacTests が固定する。
# 🔴 **verbs は get / patch だけ。** Secret には触れない（値を読む権限を BFF に渡さない。同期するのは ESO 自身）。
# 🔴 **束縛先は BFF 専用の SA だけ**（`default` に束縛しない。IADR-0433 決定 4 と同じ理由）。
# ai-stock-trading の ExternalSecret（ast-secrets / moomoo-credentials / moomoo-rsa）は AST のチャートが作る（AST#795）。
# 名前空間 ai-stock-trading は k8s-local-up.sh がこの apply の前に冪等に作る。
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bff-externalsecret-sync
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "patch"]
    resourceNames:
      - keycloak-smtp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bff-externalsecret-sync
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bff-externalsecret-sync
subjects:
  - kind: ServiceAccount
    name: bff
    namespace: microservices-platform
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: bff-externalsecret-sync
  namespace: ai-stock-trading
  labels:
    app.kubernetes.io/part-of: microservices-platform
rules:
  - apiGroups: ["external-secrets.io"]
    resources: ["externalsecrets"]
    verbs: ["get", "patch"]
    resourceNames:
      - ast-secrets
      - moomoo-credentials
      - moomoo-rsa
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: bff-externalsecret-sync
  namespace: ai-stock-trading
  labels:
    app.kubernetes.io/part-of: microservices-platform
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: bff-externalsecret-sync
subjects:
  - kind: ServiceAccount
    name: bff
    namespace: microservices-platform
