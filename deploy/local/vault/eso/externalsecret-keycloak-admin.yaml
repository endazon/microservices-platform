# IADR-0099 (#310) PR-4: Vault secret/msp/keycloak-admin（KV v2）→ 既存 Secret `keycloak-admin`（キー password）へ ESO が同期。
# namespace は platform-infra。消費側（deploy/local/infra/keycloak.yaml の非 optional secretKeyRef=keycloak-admin/password）は無改変。
# 基盤 secret のため creationPolicy: Merge（手動 apply=bootstrap 必須・ESO は同一値を上書きするのみ・所有/再作成しない）。
# 詳細は externalsecret-postgres.yaml のヘッダコメント参照。
apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: keycloak-admin
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: keycloak-admin
    creationPolicy: Merge
  data:
    - secretKey: password
      remoteRef:
        key: msp/keycloak-admin
        property: password
