# NFR-18, IADR-0577（Refs GHSA-rh44-px44-p48q）: 基盤の 7 サービスがブローカへ名乗るサービスごとの資格情報（消費側の写し）。
# Vault secret/msp/rabbitmq-users（KV v2。プロパティ名 = ユーザー名 msp-<name>）→ microservices-platform の
# Secret `msp-rabbitmq-users`（キー = ユーザー名）。消費側は helm の deployment.yaml（global.messaging.credentialsSecretName。
# 各サービスは自分のキーだけを非 optional な secretKeyRef で読む）。ブローカ側の写しは platform-infra の rabbitmq-users
# （IADR-0573）で、同じ KV を読むので値は揃う。種は bootstrap.sh が無いときだけ乱数で入れる（平文は非コミット）。
# 旧 rabbitmq-app（全サービス共通の 1 組・#1022）の後継である。
# creationPolicy: Owner ＝ ESO が唯一の所有者（ESO=1 のときだけ apply する。手動の作成は `ESO != 1` の経路だけ）。
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: msp-rabbitmq-users
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: vault-backend
    kind: ClusterSecretStore
  target:
    name: msp-rabbitmq-users
    creationPolicy: Owner
  dataFrom:
    - extract:
        key: msp/rabbitmq-users
