# ADR-0006, IADR-0077 (AST#24): External Secrets Operator の ClusterSecretStore（opt-in）。
# ⚠️ external-secrets.io CRD が前提（ESO 本体 install は k8s-local-up.sh の VAULT ゲート／README の URL 適用）。
#    CRD 未導入のクラスタでは apply が失敗する。
# 名前は `vault-backend`＝AST chart の既定 externalSecrets.secretStoreRef.name と一致させる
#    （ai-stock-trading の ExternalSecret がこのストアを参照して Vault dev から同期する）。
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: vault-backend
  labels:
    app.kubernetes.io/part-of: platform-observability
spec:
  provider:
    vault:
      server: "http://vault.platform-infra:8200"
      # dev モードは KV v2 を secret/ にマウントする。remoteRef の key はこのパス配下で解決する
      #   （例: AST の "ai-stock-trading/app-secrets" → secret/ai-stock-trading/app-secrets）。
      path: "secret"
      version: "v2"
      auth:
        # dev root トークンで認証する（dev 専用・平文コミットしない・Secret 経由）。
        tokenSecretRef:
          name: vault-dev-token
          key: token
          namespace: platform-infra
