# IADR-0076 / #780: `platform-infra` 名前空間の `edge-tls`。
#
# ★ なぜ 2 本目が要るのか: **Ingress の `spec.tls.secretName` は同じ名前空間の Secret しか参照できない。**
#   #779（IADR-0206）が発行した `edge-tls` は `microservices-platform` にあり、
#   Keycloak の実体（Service / Deployment）は `platform-infra` にある。
#   `edge-certificate.yaml` の注記（同 ADR）が既にこの制約を明示している。
#
# ★ 証明書を「共有」しない理由: Secret を名前空間へコピーする運用（reflector 等）は追加の常駐物を要し、
#   コピー元が更新されたときの追随が別の壊れ方を生む。**同じ ClusterIssuer から 2 本目を発行する**方が、
#   cert-manager が更新も自動で面倒を見るぶん壊れにくい。ClusterIssuer は名前空間を跨げる。
#
# ★ `secretName` と `dnsNames` は 1 本目と**同じにする**（計画 ADR-0023 の設計要件＝安定させる）。
#   CA を Let's Encrypt や Vault PKI へ差し替えるときも、変えるのは `issuerRef` だけで済む。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-tls
  namespace: platform-infra
spec:
  secretName: edge-tls
  # 1 本目と同一。keycloak.localhost は *.localhost が覆う。
  commonName: localhost
  dnsNames:
    - localhost
    - "*.localhost"
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: local-edge-ca
    kind: ClusterIssuer
    group: cert-manager.io
