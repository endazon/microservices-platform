# IADR-0206 (#779): エッジの葉証明書。CA ClusterIssuer（local-edge-ca）が発行する。
#
# secretName / dnsNames は計画 ADR-0023 の設計要件どおり**安定させる**（CA を Let's Encrypt や
# Vault PKI へ差し替えても Secret 名とドメインは変えない＝切り替えは issuerRef の差し替えのみ）。
#
# 名前空間: Ingress の spec.tls.secretName は**同じ名前空間の Secret しか参照できない**ため、証明書は
#   「TLS を張る Ingress が居る名前空間」ごとに要る。
#
#   IADR-0220 (#841): admin(50000) entrypoint も TLS 終端になった（NFR-11 の適用範囲が経路B にも及ぶ
#   ことが利用者裁定 2026-08-16 で確定したため）。管理ツール 7 件は 3 つの名前空間に散っている:
#     - microservices-platform … minio / wiki（＋ 443 の platform-frontend-edge）→ 本ファイル 1 つ目
#     - platform-infra         … grafana / headlamp / vault / qdrant        → 本ファイル 2 つ目
#     - argocd                 … argocd                                     → argocd-certificate.yaml
#   argocd namespace は ARGOCD=1 の別 opt-in でのみ作られるため、そこだけ kustomization に含めず
#   k8s-local-up.sh が「ns 存在時のみ」apply する（argocd-ingress.yaml と同じ fail-safe）。
#
# 🔴 [2026-08-30 / #781] **`*.localhost` だけでは足りない。** 標準的な TLS クライアントは
#   「ワイルドカードの右に 1 ラベルしか無い」証明書を拒否する（`*.com` を防ぐための制限で、
#   `*.localhost` も同じ形に当たる）。実測:
#
#     curl --cacert <root CA> https://localhost/          -> HTTP 200      （明示 SAN）
#     curl --cacert <root CA> https://keycloak.localhost/ -> curl: (60)    （ワイルドカード）
#       SSL: no alternative certificate subject name matches target hostname 'keycloak.localhost'
#
#   これまで露見しなかったのは、**エッジを叩く経路が例外なく検証を切っていた**ためである
#   （`verify-oidc-edge-flow.sh` は `-k`、ブラウザは手動例外）。**検証する利用者が現れて初めて壊れる。**
#   apiserver の OIDC 検証（#781）はまさにその利用者であり、`oidc-ca-file` を渡しても
#   ホスト名照合で落ちる。
#
#   したがって**エッジ host を明示的に列挙する**。`*.localhost` は、これを受け付ける
#   クライアント向けの保険として残す（消す理由が無い）。
#   ADR-0023 の「dnsNames を安定させる」要件は、**列挙を安定させる**ことで満たす ——
#   新しいエッジ host を足すときは、Ingress とこの一覧の両方を触る。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-tls
  namespace: microservices-platform
  labels:
    app.kubernetes.io/part-of: microservices-platform
    tier: local-edge
spec:
  secretName: edge-tls
  commonName: localhost
  dnsNames:
    - localhost
    # 🔴 明示列挙（上のコメント参照）。母集合は `deploy/local/` の Ingress が使う host を
    #   走査して引いた（2026-08-30 実測で 8 件。稼働クラスタの Ingress とも一致）。
    - argocd.localhost
    - grafana.localhost
    - headlamp.localhost
    - keycloak.localhost
    - minio.localhost
    - qdrant.localhost
    - vault.localhost
    - wiki.localhost
    # 受け付けるクライアント向けの保険として残す（単体では効かない）。
    - "*.localhost"
  duration: 8760h # 1 年
  renewBefore: 720h # 30 日
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: local-edge-ca
    kind: ClusterIssuer
    group: cert-manager.io
---
# IADR-0220 (#841): platform-infra の管理ツール（grafana / headlamp / vault / qdrant）が admin(50000) で
# TLS 終端するための葉証明書。名前・dnsNames・issuerRef は上と同一である（CA 固有設定は ClusterIssuer に
# 閉じたまま＝計画 ADR-0047 決定 2 の設計要件 3 点を崩さない）。Secret 名を namespace ごとに変えないのは、
# 消費側（Ingress）が secretName しか知らない形を保つためである。
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: edge-tls
  namespace: platform-infra
  labels:
    app.kubernetes.io/part-of: microservices-platform
    tier: local-edge
spec:
  secretName: edge-tls
  commonName: localhost
  dnsNames:
    - localhost
    # 🔴 明示列挙（上のコメント参照）。母集合は `deploy/local/` の Ingress が使う host を
    #   走査して引いた（2026-08-30 実測で 8 件。稼働クラスタの Ingress とも一致）。
    - argocd.localhost
    - grafana.localhost
    - headlamp.localhost
    - keycloak.localhost
    - minio.localhost
    - qdrant.localhost
    - vault.localhost
    - wiki.localhost
    # 受け付けるクライアント向けの保険として残す（単体では効かない）。
    - "*.localhost"
  duration: 8760h # 1 年
  renewBefore: 720h # 30 日
  privateKey:
    algorithm: ECDSA
    size: 256
  issuerRef:
    name: local-edge-ca
    kind: ClusterIssuer
    group: cert-manager.io
