# Qdrant は認証/OIDC 非対応（SSO 非適用）。素通し公開＝ネットワーク閉域前提の便宜（dashboard は /dashboard）。
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: qdrant-admin-edge
  namespace: platform-infra
  labels: { app: qdrant, tier: local-edge }
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: admin
spec:
  # IADR-0220 (#841): admin(50000) entrypoint の TLS 終端に使う証明書。secretName は IADR-0206 が
  # 安定させた `edge-tls`（同 namespace の Secret）をそのまま使う（計画 ADR-0047 決定 2「名前の安定」）。
  # hosts は葉証明書の dnsNames と一致させる（`*.localhost` は 1 段のサブドメインを覆う）。
  tls:
    - hosts:
        - "*.localhost"
      secretName: edge-tls
  rules:
    - host: qdrant.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: qdrant
                port:
                  number: 6333
