# IADR-0091 (#356): platform-infra の管理ツールを 50000（Traefik 追加 entrypoint admin）へ
# ホスト名ベースで集約する。各ツールはサブドメインのルートで配信する（パスベースは Vault UI / Qdrant
# dashboard がサブパス非対応のため採らない）。これらのツールは各 opt-in（OBSERVABILITY / VAULT / HEADLAMP）
# で作成されるため、未作成でも Ingress は無害（バックエンド不在時は 503・ツール有効化で解決）。
# ホスト名解決・OIDC redirect の追記（#355 マージ後の PR-2）は deploy/local/edge/README.md 参照。
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana-admin-edge
  namespace: platform-infra
  labels: { app: grafana, tier: local-edge }
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: admin
spec:
  # IADR-0220 (#841): admin(50000) entrypoint の TLS 終端に使う証明書。secretName は IADR-0206 が
  # 安定させた `edge-tls`（同 namespace の Secret）をそのまま使う（計画 ADR-0047 決定 2「名前の安定」）。
  # hosts は葉証明書の dnsNames と一致させる（`*.localhost` は 1 段のサブドメインを覆う）。
  tls:
    - hosts:
        - "*.localhost"
      secretName: edge-tls
  rules:
    - host: grafana.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: grafana
                port:
                  number: 3000
---
