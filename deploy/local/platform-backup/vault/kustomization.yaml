# NFR-21, NFR-18, ADR-0008, IADR-0471 (#1560): platform-infra の秘匿管理（/vault/data。IADR-0525 / #1840 で OpenBao の raft）を
# 日次で age 暗号化し、クラスタ外の 2 か所へ置く CronJob。
# Vault の永続化 overlay（deploy/local/vault-persistence）が取り込む —— PVC vault-data が在る配備でだけ描く
# （無い配備で描くと、Pod が PVC を待って Pending のまま残り、失敗としても見えない）。
# 🔴 deploy/local 専用（ローカル開発・PoC 環境）。本番のバックアップ設計ではない。手順は docs/operations/platform-infra-backup-runbook.md。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# ［2026-10-16 / #1868］IADR-0548: raft の整合したスナップショットを k8s auth（専用の SA）で取る。role とポリシーは
# 同じディレクトリの bootstrap.sh（runtime。kustomize の外）が秘匿管理へ入れる。
resources:
  - ../script
  - serviceaccount.yaml
  - cronjob.yaml
