# NFR-21, NFR-18, IADR-0548 (#1868): 秘匿管理の日次バックアップ（CronJob platform-backup-vault）の名乗り。
# k8s auth の role platform-backup-vault がこの SA（platform-infra）にだけ束縛される（deploy/local/platform-backup/vault/bootstrap.sh）。
# k8s の API への権限は何も付けない（RoleBinding を作らない）。トークンは自動で載せず、CronJob の projected token だけを使う。
# 🔴 deploy/local 専用（ローカル開発・PoC 環境）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: platform-backup-vault
  namespace: platform-infra
  labels:
    app: platform-backup
    app.kubernetes.io/component: vault
automountServiceAccountToken: false
