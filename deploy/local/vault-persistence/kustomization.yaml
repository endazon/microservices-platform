# IADR-0457 (#1479): 経路B の Vault を永続化するオーバーレイ（**既定**。scripts/k8s-local-up.sh は PERSIST=0 で
# base の deploy/local/vault（-dev・インメモリ）へ戻す。IADR-0369 の「永続化は既定オン」と同じ形）。
#
# base（deploy/local/vault）の Deployment を次のように差し替える:
#   - command を Pod 内ラッパー（vault-entrypoint.sh）へ。`vault server -config=local.hcl`（raft ストレージ。
#     NFR-18, ADR-0132, IADR-0525 / #1840: 製品は OpenBao で、file ストレージを持たない）を起動し、
#     init（初回のみ）・unseal・固定 root トークン・kv-v2 mount・collector への audit device を自動で行う
#   - PVC vault-data を /vault/data に（raft は /vault/data/raft）、ConfigMap を /vault/config と /vault/bin に、
#     emptyDir を /vault/audit.d にマウント
#   - readinessProbe は `vault status`（unseal 済みで 0）。k8s-local-up.sh はこれを rollout status で待ってから bootstrap する
# ClusterSecretStore（token 認証版）は base のまま。固定トークンをラッパーが作るので無改変で動く。
# ［2026-09-26 / #1560］IADR-0471: /vault/data の日次バックアップ CronJob（deploy/local/platform-backup/vault）も取り込む。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../vault
  - pvc.yaml
  # NFR-21, IADR-0471 (#1560): 永続化した Vault（/vault/data）の日次バックアップ（age 暗号化・クラスタ外 2 か所）。
  # PVC vault-data が在るこの overlay でだけ描く。手順は docs/operations/platform-infra-backup-runbook.md。
  - ../platform-backup/vault

generatorOptions:
  disableNameSuffixHash: true

configMapGenerator:
  - name: vault-local-config
    namespace: platform-infra
    files:
      - local.hcl
  - name: vault-local-entrypoint
    namespace: platform-infra
    files:
      - vault-entrypoint.sh

patches:
  - target:
      kind: Deployment
      name: vault
      namespace: platform-infra
    path: deployment-patch.yaml
