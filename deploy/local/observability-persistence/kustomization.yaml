# IADR-0210 / Issue #787: 経路B 可観測性スタックの永続化オーバーレイ（opt-in）。
# base（deploy/local/observability）に PVC を足し、prometheus/loki/tempo/grafana の Deployment へ
# データ用 volume と volumeMount を **append** する。
# 適用: kubectl apply -k deploy/local/observability-persistence
#   （scripts/k8s-local-up.sh は PERSIST=1 **かつ** OBSERVABILITY=1 で本ディレクトリを選ぶ）
# 既定（PERSIST 未設定）は base が適用され、本オーバーレイは一切効かない（後方互換・fail-safe）。
#
# ★ base にはデータ用 volume が 1 本も無いため、infra-persistence の postgres（replace）ではなく
#   keycloak と同型の **add（append）** を使う。config ボリュームの index に依存しない書き方である。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - ../observability
  - pvcs.yaml

patches:
  # prometheus: TSDB の既定パス /prometheus（compose の prometheus-data:/prometheus と同一）へ PVC を当てる。
  # ★ securityContext は付けない（4 種とも。下の loki の注記に実測を書いた）。
  - target:
      kind: Deployment
      name: prometheus
      namespace: platform-infra
    patch: |
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: data
          persistentVolumeClaim:
            claimName: prometheus-data
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: data
          mountPath: /prometheus
  # loki: ConfigMap loki-config の common.path_prefix（/tmp/loki）へ当てる。config は書き換えない。
  # ★ securityContext（root 実行）は **付けない**。compose の user: "0:0"（IADR-0079 §3）は
  #   **docker の named volume が root:root 0755 で生成される**ことへの対処であり、**k8s へは転用できない**。
  #   local-path provisioner の setup は `mkdir -m 0777` でボリュームディレクトリを作る
  #   （`kube-system/local-path-config` を実読）。実測（2026-08-16・稼働中の k3s）:
  #   loki は **uid 10001 のまま** `/tmp/loki`（drwxrwxrwx）へ 4.7M を書き、**再起動 0 回**で Ready。
  #   tempo（uid 10001・5.0M）/ grafana（uid 472・grafana.db）も同じ。推測ではなく実測に従う。
  - target:
      kind: Deployment
      name: loki
      namespace: platform-infra
    patch: |
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: data
          persistentVolumeClaim:
            claimName: loki-data
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: data
          mountPath: /tmp/loki
  # tempo: storage.trace.local.path(/tmp/tempo/blocks) と wal.path(/tmp/tempo/wal) の親へ当てる。
  # loki と同じ理由で root 実行にしない（上の実測）。
  - target:
      kind: Deployment
      name: tempo
      namespace: platform-infra
    patch: |
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: data
          persistentVolumeClaim:
            claimName: tempo-data
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: data
          mountPath: /tmp/tempo
  # grafana: /var/lib/grafana（compose の grafana-data:/var/lib/grafana と同一）。
  # ★ securityContext は付けない（実測で uid 472 のまま grafana.db を書けている）。
  - target:
      kind: Deployment
      name: grafana
      namespace: platform-infra
    patch: |
      - op: add
        path: /spec/template/spec/volumes/-
        value:
          name: data
          persistentVolumeClaim:
            claimName: grafana-data
      - op: add
        path: /spec/template/spec/containers/0/volumeMounts/-
        value:
          name: data
          mountPath: /var/lib/grafana
  # ★ PVC を掴む Deployment は Recreate にする（IADR-0210 決定 7）。
  #   ReadWriteOnce と RollingUpdate は両立しない。local-path は単一ノードの hostPath なので
  #   **スケジューリングでは詰まらず、アプリのロックで詰まる** —— Prometheus は
  #   storage.tsdb.no-lockfile=false を実測（/api/v1/status/flags）し、再起動後の
  #   /prometheus/data に lock ファイルが実在した。Grafana は SQLite。
  #   base（emptyDir）側は RollingUpdate のままでよい（奪い合うボリュームが無い）。
  - target:
      kind: Deployment
      namespace: platform-infra
      labelSelector: "app in (prometheus,loki,tempo,grafana)"
    patch: |
      - op: add
        path: /spec/strategy
        value:
          type: Recreate
