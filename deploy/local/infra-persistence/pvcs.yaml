# IADR-0082 / Issue #324: 経路B（ローカル k8s dev）基盤インフラの永続化 PVC。
# クラスタの local-path provisioner（k3s/Rancher Desktop 同梱・RWO）で動的プロビジョニングする。
# 適用は opt-in（scripts/k8s-local-up.sh の PERSIST=1）。既定は base の emptyDir のまま（後方互換・fail-safe）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: platform-infra
  labels: { app: postgres }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 2Gi
---
# Keycloak の file H2（start-dev の既定 DB＝/opt/keycloak/data/h2）を永続化し、realm + runtime state
# （追加ユーザー・シークレット・セッション）を Pod 再起動でも保持する（IADR-0082 §2）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: keycloak-data
  namespace: platform-infra
  labels: { app: keycloak }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
# IADR-0210 / Issue #787: Qdrant のベクトルインデックス（/qdrant/storage）を永続化する。
# IADR-0082 は「再生成可能な派生データ」として対象外にしていたが、**再生成の費用が無視できない**
# （埋め込み生成は LLM/TEI 呼び出しを伴い、コーパス規模に比例して時間と API 費用がかかる）。
# 加えて Pod は日次規模で再起動しており、そのたびに索引が消える（実測: コレクション 0 件）。
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: qdrant-storage
  namespace: platform-infra
  labels: { app: qdrant }
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: local-path
  resources:
    requests:
      storage: 5Gi
