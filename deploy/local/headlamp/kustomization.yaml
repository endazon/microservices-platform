# IADR-0080 (#271): Headlamp（k8s 管理 UI・Keycloak OIDC）を dev クラスタへ導入する opt-in オーバーレイ。
# ⚠️ deploy/local/infra/kustomization.yaml には**含めない**。既定の経路B 起動には出てこない（fail-safe）。
# 適用（opt-in）: kubectl apply -k deploy/local/headlamp
#   → 事前に OIDC client secret を Secret headlamp-oidc（platform-infra）へ入れる（k8s-local-up.sh の HEADLAMP=1 が実施）。
# 実ブラウザからのログイン・リソース閲覧は稼働クラスタ依存（README の「Headlamp」手順）。ローカルの正式手順は
# **token 方式**であり、apiserver へ OIDC フラグは付けない（IADR-0105 / #399 で配線を除去済み。OIDC 化は #388）。
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - headlamp.yaml
  # IADR-0108 (#398): token ログイン用 SA `headlamp-viewer` ＋閲覧専用 RBAC。これにより HEADLAMP=1 だけで
  # `kubectl -n platform-infra create token headlamp-viewer` → UI の Token ログインが手動作成なしに成立する。
  - headlamp-viewer-rbac.yaml
