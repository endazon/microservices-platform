# ADR-0021, #782: アプリ面（80/443）のルーティング。Traefik の
# deploy/local/edge/platform-frontend-ingress.yaml と deploy/local/edge/keycloak-ingress.yaml を写したもの。
#
# 🔴 契約は 1 バイトも変えない。 経路が Traefik から Envoy へ替わっただけで、
#   /bff は rewrite せず bff-service へ、残り全部は frontend-service へ、が本番チャートの
#   templates/edge.yaml とも一致する（IADR-0076 / IADR-0078）。
#
# VirtualService は Gateway と同じ namespace（istio-system）に置く。行き先は FQDN なので
# namespace を跨いでよい。**アプリ側 namespace に置かない**のは、argocd のように
# opt-in でしか存在しない namespace があり、置き場所を条件分岐させたくないためである
# （Traefik 経路では argocd-ingress.yaml だけ条件付き apply になっていた）。
---
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: msp-platform-frontend
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: microservices-platform
    tier: local-edge
spec:
  # host を絞らない catch-all（Traefik 側の Ingress も host 無し＝任意 host にマッチ）。
  # keycloak.localhost は下の VirtualService が **完全一致で先取りする**
  # （Envoy の virtual host は exact domain がワイルドカードより先に照合される）。
  hosts:
    - "*"
  gateways:
    - istio-system/msp-edge
  http:
    # /bff, /bff/* → BFF（rewrite 無し。BFF は /bff プレフィックス前提）。先に評価する。
    - match:
        - uri: { exact: /bff }
        - uri: { prefix: /bff/ }
      route:
        - destination:
            host: bff-service.microservices-platform.svc.cluster.local
            port:
              number: 8080
    # FR-20, UC-11, ADR-0037 課題 2, IADR-0270 決定 3, IADR-0338 決定 4, IADR-0348 (#1154):
    # Obsidian プラグインの同期プロトコルを DocumentService へ直接通す（BFF は経由しない）。
    # **catch-all より前**に置くこと（Istio のルートは先勝ち。後ろに置くと SPA に吸われて API に届かない）。
    #
    # 公開するのは **/private-notes/sync/ 配下だけ**である。前置は末尾スラッシュ込みなので
    # /private-notes（一覧）・/private-notes/devices（端末登録）・/private-notes/quotas/*・/documents は
    # 当たらず、catch-all → SPA へ落ちる（**404 ではなく index.html の 200 text/html** である。frontend の
    # nginx が history fallback を返すためで、「API に届いていない」ことは port-forward 直叩きの 401 と
    # 対で確かめる）。08_data-egress-policy 許容条件 2「資格情報のスコープ限定」を経路の側でも守る形である。
    #
    # エッジで JWT 検証は要求しない。資格情報は不透明な同期トークン（Bearer）で、DocumentService が
    # ハッシュ照合して自前で検証する（IADR-0270 決定 3）。欠落・不正・期限切れ・失効はすべて同じ 401。
    # 本番チャート（templates/edge.yaml）側は edge.privateNotesSync.enabled の opt-in（既定 false）だが、
    # この overlay 自体が opt-in（ISTIO=1 かつ LOCALEDGE=1）であり、FR-20 を実測する環境なので無条件に持つ。
    - match:
        - uri: { prefix: /private-notes/sync/ }
      route:
        - destination:
            host: document-service.microservices-platform.svc.cluster.local
            port:
              number: 8080
    # catch-all → SPA(frontend)。history fallback は frontend pod の nginx が担う。
    - match:
        - uri: { prefix: / }
      route:
        - destination:
            host: frontend-service.microservices-platform.svc.cluster.local
            port:
              number: 8080
---
# IADR-0227 / #780: Keycloak は admin(50000) ではなく websecure(443) の keycloak.localhost へ出す。
# 7 つの OIDC クライアントと SPA がブラウザ経由で叩くため、パスは絞らない（/login-actions/* や
# /resources/* を落とすとログイン画面が壊れる）。
apiVersion: networking.istio.io/v1
kind: VirtualService
metadata:
  name: msp-keycloak-edge
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: platform-edge
    tier: local-edge
spec:
  hosts:
    - keycloak.localhost
  gateways:
    - istio-system/msp-edge
  http:
    - match:
        - uri: { prefix: / }
      route:
        - destination:
            # platform-infra はメッシュ外（サイドカー無し）。PeerAuthentication も掛かっていないので
            # Gateway からは平文で入る。STRICT は microservices-platform namespace だけの話である。
            host: keycloak.platform-infra.svc.cluster.local
            port:
              number: 8080
