# ADR-0006, IADR-0077 (AST#24): 経路B（k8s）の Prometheus（opt-in・platform-infra）。
# ⚠️ config は compose（deploy/prometheus.yml + deploy/prometheus/alerts.yml）と同内容を inline する
#    （kustomize の root 外参照制約に従う。経路B の otel-collector.yaml と同じ方針＝二重管理を許容）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: platform-infra
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector:8888']
  # compose（deploy/prometheus/alerts.yml）のルールを inline する（follow-up のコメントアウト例＝
  # exporter 依存は compose 同様に除く）。
  # 🔴 ［2026-09-05 / #1203］**件数は導出値であり、ここは実際に乖離していた。**
  #   本注記は長らく「全 9 ルール」と称していたが、compose 側は #1246 の
  #   knowledge-health-producers 2 件を足して 11 件になっており、**この inline は追随していなかった**
  #   （バイト一致を強制する検査器が無い。Grafana 側の inline だけが check-grafana-alerting.js の対象である）。
  #   #1203 は RagLatencySeriesAbsent を足して 10 / 12 件にしたが、**2 件は #1246 の射程だとして
  #   足さず、受容として記録した。**
  # 🔴 ［2026-09-05 追記 / #1246 の取りこぼし］**その受容を解除した。** 上の 2 件を足して 12 / 12 件にし、
  #   **乖離を止める門を新設した**（scripts/check-prometheus-alerts-parity.js）。
  #   突合するのは **群名 ＋ ルール名 ＋ expr ＋ for ＋ severity の 1 対 1** だけである ——
  #   🔴 **summary / description は突合しない。** この inline は意図的に凝縮した文面を持ち
  #   （生のメトリクス名を言い換え、末尾の ADR 引用を落としている）、バイト一致を課すと常に赤になる。
  #   門を置いた根拠は「**同型の事故が 2 回**」である: 1 回目は経路 B の Grafana に dashboards/ が
  #   丸ごと無かった件（#674 / check-grafana-provisioning-parity.js が生まれた）、2 回目が本件。
  #   **1 回目が門を生んだのに、その門の射程外で 2 回目が起きた。**
  # 🔴 メトリクス名・ラベル・単位を変えるときは compose 側と**同時に**直す。式の検証手順と
  #    「陽性対照を対で置く」規律は deploy/prometheus/alerts.yml の冒頭に書いてある（#1110）。
  alerts.yml: |
    groups:
      - name: platform-availability
        rules:
          - alert: OtelCollectorDown
            expr: up{job="otel-collector"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "OTel Collector 到達不可（可観測性パイプライン断）"
              description: "otel-collector の scrape が 2 分間失敗。収集が停止している可能性。"
          - alert: ServiceRequestMetricsAbsent
            expr: |
              sum by (job) (rate(http_server_request_duration_seconds_count[5m])) == 0
              and on (job) (sum by (job) (http_server_request_duration_seconds_count offset 15m) > 0)
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "サービス {{ $labels.job }} のリクエストメトリクスが途絶"
              description: "直近まで処理していたサービスの HTTP メトリクスが 5 分間ゼロ。ダウン/到達不可の可能性。"
      - name: platform-slo
        rules:
          - alert: HighHttp5xxRate
            expr: |
              sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
              / sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.job }} の 5xx 率が 5% 超"
              description: "直近 5 分の 5xx 率が閾値超過（NFR 障害検出 5 分以内）。"
          - alert: SearchLatencyP95High
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.retrieval-service"}[5m]))) > 1.5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "検索 p95 が 1.5s 超"
              description: "RetrievalService の p95 レイテンシが NFR 目標(1.5s)を 10 分継続で超過。"
          # NFR-02, ADR-0076 決定 5 (#1204): 初回トークンまでの時間（TTFT）。**NFR-02 の SLO 判定はこれで行う。**
          - alert: RagFirstTokenP95High
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service"}[5m]))) > 5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "RAG 初回応答（初回トークン）p95 が 5s 超"
              description: "AiAnalysisService /analysis/ask/stream の初回トークンまでの p95 が NFR-02 目標(5s)を 10 分継続で超過。"
          # 応答完了 p95（一括経路）。**NFR-02 の SLI ではない** —— 傾向の観察に留める（ADR-0076）。
          - alert: RagLatencyP95High
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.aianalysis-service", http_route="/analysis/ask"}[5m]))) > 5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "RAG 応答完了 p95 が 5s 超（傾向の観察。NFR-02 の判定ではない）"
              description: "AiAnalysisService /analysis/ask（一括経路）の応答完了 p95 が 5s を 10 分継続で超過。NFR-02 の初回応答 SLO は RagFirstTokenP95High が判定する。"
      # ADR-0076 決定 3 (#1202): **評価対象そのものの不在**。上の ServiceRequestMetricsAbsent は
      # 「直近まで受信していたのに途絶した」だけを拾い、**系列が消えると式が空になって発火しない**。
      # 対象は無風が 5 分より短い経路だけ。検知までは最大およそ 10 分（absent の 5 分 lookback ＋ for: 5m）。
      # 🔵 ［2026-09-05 更新 / #1203・ADR-0079］従前は「/analysis/ask 系は対象外。決定 4 の合成監視待ち」
      #   と書いていた。**合成監視は着地し ADR-0079 決定 1 が間隔を確定させたので、繰り延べは失効した。**
      #   ただし対象へ入るのは **RagLatencyP95High の系列だけ**である —— 60 秒側の合成は LLM を呼ばず、
      #   RagFirstTokenP95High の計器は token が出なければ記録しないため、そちらは依然として系列を持たない。
      #   理由の正本は compose 側（deploy/prometheus/alerts.yml）の同名グループの前書きである。
      - name: platform-slo-evaluation-target
        rules:
          - alert: OtelCollectorUpSeriesAbsent
            expr: absent(up{job="otel-collector"})
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: 'SLO の評価対象が無い: up{job="otel-collector"} の系列が存在しない'
              description: "otel-collector の scrape 対象が設定から失われている疑い。OtelCollectorDown は空ベクタになり発火しない。"
          - alert: HttpServerMetricsSeriesAbsent
            expr: absent(http_server_request_duration_seconds_count)
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "SLO の評価対象が無い: http_server_request_duration_seconds_count の系列が 1 つも存在しない"
              description: "全サービスの HTTP メトリクスが無い。転送経路の断、またはメトリクス名・単位の規約変更の疑い（#1110 の再発）。"
          - alert: SearchLatencySeriesAbsent
            expr: absent(http_server_request_duration_seconds_bucket{job="microservices-platform.retrieval-service"})
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "SLO の評価対象が無い: retrieval-service のレイテンシ分布が存在しない"
              description: "RetrievalService のレイテンシ分布が無い。SearchLatencyP95High は空ベクタになり発火しない。"
          # NFR-02, ADR-0079 決定 1 (#1203): 常時トラフィックの源は合成監視のプローブ（60 秒間隔）。
          - alert: RagLatencySeriesAbsent
            expr: absent(http_server_request_duration_seconds_bucket{job="microservices-platform.aianalysis-service", http_route="/analysis/ask"})
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "SLO の評価対象が無い: aianalysis-service /analysis/ask のレイテンシ分布が存在しない"
              description: "AiAnalysisService の /analysis/ask のレイテンシ分布が無い。RagLatencyP95High は空ベクタになり発火しない。合成監視のプローブ（60 秒間隔）が止まっている疑い。"
      # FR-10, SC-10, ADR-0006, ADR-0076 決定 3 (#1246): ナレッジ健全性の**生産者**が居ないことを見る。
      # 🔴 上の群と式が違う（`absent()` ではなく `absent_over_time(...[2h])`）。生産は周期駆動で
      #   周期は 1 時間であり、`absent()` の既定 5 分 lookback では平常時も鳴り続ける。2 周期ぶんで見る。
      #   検知は最大およそ 2 時間 10 分。指標は棚卸しに使うもので分単位の鮮度を要さない。
      - name: knowledge-health-producers
        rules:
          - alert: KnowledgeHealthUnresolvedLinksProducerAbsent
            expr: absent_over_time(knowledge_health_report_total{knowledge_indicator="unresolved-links"}[2h])
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "ナレッジ健全性の生産者が居ない: unresolved-links の報告が 2 時間届いていない"
              description: "GraphService の定期収集が unresolved-links を DashboardService へ届けていない（周期は 1 時間）。受け口の件数は最後の値で凍るため画面は正常に見える。収集の失敗・リースの停滞・受け口への到達不能を疑う。"
          - alert: KnowledgeHealthEdgeTypeUsageProducerAbsent
            expr: absent_over_time(knowledge_health_report_total{knowledge_indicator="edge-type-usage"}[2h])
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "ナレッジ健全性の生産者が居ない: edge-type-usage の報告が 2 時間届いていない"
              description: "GraphService の定期収集が edge-type-usage を DashboardService へ届けていない（周期は 1 時間）。受け口の件数は最後の値で凍るため画面は正常に見える。収集の失敗・リースの停滞・受け口への到達不能を疑う。"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: platform-infra
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          # push（remote-write）モデル。collector が /api/v1/write へ送るため receiver を有効化する。
          # IADR-0210 (#787): 保持期間を **args で明示**する（既定任せにしない）。compose
          # （deploy/docker-compose.yml の prometheus.command）にも同じ 2 引数を置く＝パリティを崩さない。
          #   - time=7d: dev ローカル用途。本番像（deploy/helm）に prometheus は存在しない（射程は経路B に閉じる）。
          #   - size=4GB: time だけでは remote-write の流入量次第で PVC が満杯になり **書き込み不能**になる。
          #     size(4.0e9 B) < PVC 容量(5Gi=5.37e9 B) にしておけば **構造的に溢れない**
          #     （deploy/local/observability-persistence/pvcs.yaml と対。設定ではなく形で塞ぐ）。
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--web.enable-remote-write-receiver"
            - "--storage.tsdb.retention.time=7d"
            - "--storage.tsdb.retention.size=4GB"
          ports:
            - { containerPort: 9090, name: http }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: platform-infra
  labels: { app: prometheus }
spec:
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
