# ADR-0006, IADR-0077 (AST#24): 経路B（k8s）の Prometheus（opt-in・platform-infra）。
# ⚠️ config は compose（deploy/prometheus.yml + deploy/prometheus/alerts.yml）と同内容を inline する
#    （kustomize の root 外参照制約に従う。経路B の otel-collector.yaml と同じ方針＝二重管理を許容）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: platform-infra
data:
  prometheus.yml: |
    global:
      scrape_interval: 15s
      evaluation_interval: 15s
    rule_files:
      - /etc/prometheus/alerts.yml
    alerting:
      alertmanagers:
        - static_configs:
            - targets: ['alertmanager:9093']
    scrape_configs:
      - job_name: otel-collector
        static_configs:
          - targets: ['otel-collector:8888']
  # compose（deploy/prometheus/alerts.yml）と同一の全 6 ルールを inline する（follow-up の
  # コメントアウト例＝exporter 依存は compose 同様に除く）。
  # 🔴 メトリクス名・ラベル・単位を変えるときは compose 側と**同時に**直す。式の検証手順と
  #    「陽性対照を対で置く」規律は deploy/prometheus/alerts.yml の冒頭に書いてある（#1110）。
  alerts.yml: |
    groups:
      - name: platform-availability
        rules:
          - alert: OtelCollectorDown
            expr: up{job="otel-collector"} == 0
            for: 2m
            labels: { severity: critical }
            annotations:
              summary: "OTel Collector 到達不可（可観測性パイプライン断）"
              description: "otel-collector の scrape が 2 分間失敗。収集が停止している可能性。"
          - alert: ServiceRequestMetricsAbsent
            expr: |
              sum by (job) (rate(http_server_request_duration_seconds_count[5m])) == 0
              and on (job) (sum by (job) (http_server_request_duration_seconds_count offset 15m) > 0)
            for: 5m
            labels: { severity: warning }
            annotations:
              summary: "サービス {{ $labels.job }} のリクエストメトリクスが途絶"
              description: "直近まで処理していたサービスの HTTP メトリクスが 5 分間ゼロ。ダウン/到達不可の可能性。"
      - name: platform-slo
        rules:
          - alert: HighHttp5xxRate
            expr: |
              sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
              / sum by (job) (rate(http_server_request_duration_seconds_count[5m])) > 0.05
            for: 5m
            labels: { severity: critical }
            annotations:
              summary: "{{ $labels.job }} の 5xx 率が 5% 超"
              description: "直近 5 分の 5xx 率が閾値超過（NFR 障害検出 5 分以内）。"
          - alert: SearchLatencyP95High
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.retrieval-service"}[5m]))) > 1.5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "検索 p95 が 1.5s 超"
              description: "RetrievalService の p95 レイテンシが NFR 目標(1.5s)を 10 分継続で超過。"
          # NFR-02, ADR-0076 決定 5 (#1204): 初回トークンまでの時間（TTFT）。**NFR-02 の SLO 判定はこれで行う。**
          - alert: RagFirstTokenP95High
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service"}[5m]))) > 5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "RAG 初回応答（初回トークン）p95 が 5s 超"
              description: "AiAnalysisService /analysis/ask/stream の初回トークンまでの p95 が NFR-02 目標(5s)を 10 分継続で超過。"
          # 応答完了 p95（一括経路）。**NFR-02 の SLI ではない** —— 傾向の観察に留める（ADR-0076）。
          - alert: RagLatencyP95High
            expr: |
              histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.aianalysis-service", http_route="/analysis/ask"}[5m]))) > 5
            for: 10m
            labels: { severity: warning }
            annotations:
              summary: "RAG 応答完了 p95 が 5s 超（傾向の観察。NFR-02 の判定ではない）"
              description: "AiAnalysisService /analysis/ask（一括経路）の応答完了 p95 が 5s を 10 分継続で超過。NFR-02 の初回応答 SLO は RagFirstTokenP95High が判定する。"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: prometheus
  namespace: platform-infra
  labels: { app: prometheus }
spec:
  replicas: 1
  selector:
    matchLabels: { app: prometheus }
  template:
    metadata:
      labels: { app: prometheus }
    spec:
      containers:
        - name: prometheus
          image: prom/prometheus:v2.52.0
          # push（remote-write）モデル。collector が /api/v1/write へ送るため receiver を有効化する。
          # IADR-0210 (#787): 保持期間を **args で明示**する（既定任せにしない）。compose
          # （deploy/docker-compose.yml の prometheus.command）にも同じ 2 引数を置く＝パリティを崩さない。
          #   - time=7d: dev ローカル用途。本番像（deploy/helm）に prometheus は存在しない（射程は経路B に閉じる）。
          #   - size=4GB: time だけでは remote-write の流入量次第で PVC が満杯になり **書き込み不能**になる。
          #     size(4.0e9 B) < PVC 容量(5Gi=5.37e9 B) にしておけば **構造的に溢れない**
          #     （deploy/local/observability-persistence/pvcs.yaml と対。設定ではなく形で塞ぐ）。
          args:
            - "--config.file=/etc/prometheus/prometheus.yml"
            - "--web.enable-remote-write-receiver"
            - "--storage.tsdb.retention.time=7d"
            - "--storage.tsdb.retention.size=4GB"
          ports:
            - { containerPort: 9090, name: http }
          volumeMounts:
            - name: config
              mountPath: /etc/prometheus
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: prometheus-config
---
apiVersion: v1
kind: Service
metadata:
  name: prometheus
  namespace: platform-infra
  labels: { app: prometheus }
spec:
  selector: { app: prometheus }
  ports:
    - { name: http, port: 9090, targetPort: 9090 }
