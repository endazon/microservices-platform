# NFR-18, ADR-0133 決定 1 の条件 1, IADR-0526 (#1842): Loki・Tempo の前段（認証付きのリバースプロキシ）。
#
# Loki・Tempo は製品単体で認証を掛けられない（`auth_enabled: false`。運用の口 `/flush`・`/config`・削除 API 等が
# 読み書きの口と同じ HTTP の口にある）。そこで両製品は **Pod の loopback（127.0.0.1）だけで待ち**、Service の口は
# 同じ Pod のサイドカー（Caddy）が持つ。前段は 2 つの身元をトークン（Bearer）で検証し、身元ごとに通す道を限る:
#   - 書き込み（otel-collector）: Loki の `POST /loki/api/v1/push` だけ。
#   - 読み取り（Grafana の datasource）: Loki・Tempo の `GET` の読み取り API だけ（下の列挙）。
#   - 運用の口（/flush・/config・/ingester/shutdown・/status/*・ring 系・/metrics）・削除 API・ルーラー・/api/overrides・
#     旧 push は、**どちらのトークンでも 403**。トークンが無い・違うときは 401。
# 運用者が運用の口を使うときは `kubectl port-forward` で Pod の loopback へ届く（k8s の認証・認可を通る break-glass）。
#
# 🔴 到達の制限（ADR-0133 条件 2）は**別の段**の observability-networkpolicy.yaml が持つ。本 ConfigMap と兼ねない。
# 🔴 トークンは Secret `observability-gate`（`writer` / `reader`）。scripts/k8s-local-up.sh が OBSERVABILITY=1 で
#    乱数から作り、再実行では既存の値を引き継ぐ。**dev の既定値（固定の文字列）は置かない。**
# 道の列挙と判定の実測（道の抜け `..`・`%2F` を含む）は IADR-0526 と作業仕様書 20261009_1842_loki-tempo-front-auth。
# 一致（製品の loopback の口・前段の口・Service・NetworkPolicy）は scripts/scripts.repo.test.js（#1842）が突き合わせる。
apiVersion: v1
kind: ConfigMap
metadata:
  name: observability-gate
  namespace: platform-infra
  labels: { app: observability-gate }
data:
  # fail-closed: トークンが無い・16 進以外を含む・32 文字未満・2 つが同じ、のいずれでも起動しない（値は表示しない）。
  # 16 進に限るのは、Caddyfile の `{$VAR}` が読み込み時の文字列の置換であり、引用符や波括弧を含む値が設定の構文を壊すため。
  gate.sh: |
    #!/bin/sh
    set -eu
    for name in OBS_GATE_WRITER_TOKEN OBS_GATE_READER_TOKEN; do
      eval "v=\${$name:-}"
      case "$v" in *[!0-9a-f]*) echo "obs-gate: $name に 16 進以外の文字がある（値は表示しない）" >&2; exit 1 ;; esac
      if [ "${#v}" -lt 32 ]; then echo "obs-gate: $name が無いか短すぎる（32 文字以上の 16 進）" >&2; exit 1; fi
    done
    if [ "$OBS_GATE_WRITER_TOKEN" = "$OBS_GATE_READER_TOKEN" ]; then
      echo "obs-gate: 書き込みと読み取りのトークンが同じ" >&2; exit 1
    fi
    exec caddy run --config "$1" --adapter caddyfile
  # Caddy の管理 API（既定 localhost:2019）も閉じる（前段そのものに管理用の口を作らない）。
  loki.Caddyfile: |
    {
        admin off
        auto_https off
        persist_config off
    }

    :3100 {
        @writer {
            header Authorization "Bearer {$OBS_GATE_WRITER_TOKEN}"
            method POST
            path /loki/api/v1/push
        }
        @reader {
            header Authorization "Bearer {$OBS_GATE_READER_TOKEN}"
            method GET
            path /loki/api/v1/query /loki/api/v1/query_range /loki/api/v1/labels /loki/api/v1/label/*/values /loki/api/v1/series /loki/api/v1/index/stats /loki/api/v1/index/volume /loki/api/v1/index/volume_range /loki/api/v1/detected_fields /loki/api/v1/detected_labels /loki/api/v1/patterns /loki/api/v1/tail /loki/api/v1/format_query /loki/api/v1/status/buildinfo
        }
        @known {
            header Authorization "Bearer {$OBS_GATE_WRITER_TOKEN}"
            header Authorization "Bearer {$OBS_GATE_READER_TOKEN}"
        }
        route {
            reverse_proxy @writer 127.0.0.1:3101
            reverse_proxy @reader 127.0.0.1:3101
            respond @known 403
            respond 401
        }
    }
  # Tempo の書き込み（OTLP 4317）は前段を通さない（管理用の口ではない。NetworkPolicy で collector だけに絞る）。
  # 書き込みのトークンは Tempo の HTTP では通す道が無い（403）。
  tempo.Caddyfile: |
    {
        admin off
        auto_https off
        persist_config off
    }

    :3200 {
        @reader {
            header Authorization "Bearer {$OBS_GATE_READER_TOKEN}"
            method GET
            path /api/echo /api/status/buildinfo /api/traces/* /api/v2/traces/* /api/search /api/search/tags /api/search/tag/*/values /api/v2/search/tags /api/v2/search/tag/*/values /api/metrics/query /api/metrics/query_range
        }
        @known {
            header Authorization "Bearer {$OBS_GATE_WRITER_TOKEN}"
            header Authorization "Bearer {$OBS_GATE_READER_TOKEN}"
        }
        route {
            reverse_proxy @reader 127.0.0.1:3201
            respond @known 403
            respond 401
        }
    }
