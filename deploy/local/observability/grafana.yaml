# ADR-0006, IADR-0077 (AST#24): 経路B の Grafana（opt-in・platform-infra）。
# datasource は compose（deploy/grafana/provisioning/datasources/datasources.yaml）と同内容を inline。
# ダッシュボードは UI から import する（MSP overview・AST overview=ai-stock-trading deploy/observability/dashboards）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: platform-infra
data:
  datasources.yaml: |
    apiVersion: 1
    datasources:
      - name: Prometheus
        # #665: uid は compose 側（deploy/grafana/provisioning/datasources/datasources.yaml）と揃える。
        # アラートルールが datasource を uid で指すため必須で、宣言しないと Grafana が生成する。
        uid: prometheus
        type: prometheus
        access: proxy
        url: http://prometheus:9090
        isDefault: true
        jsonData:
          timeInterval: "15s"
      - name: Loki
        uid: loki
        type: loki
        access: proxy
        url: http://loki:3100
      - name: Tempo
        uid: tempo
        type: tempo
        access: proxy
        url: http://tempo:3200
        jsonData:
          tracesToLogs:
            datasourceUid: loki
            spanStartTimeShift: -5m
            spanEndTimeShift: 5m
          serviceMap:
            datasourceUid: prometheus
          search:
            hide: false
          nodeGraph:
            enabled: true
---
# #674: ダッシュボード provisioning。**compose 側の deploy/grafana/provisioning/dashboards/ を
# そのまま inline する**（datasources / alerting と同じ二重管理の方針）。
# ★ 経路 B にはダッシュボードが 1 枚も無く、#546 の月次 LLM 費用確認の Runbook が指す
#   llm-usage.json へ辿り着けなかった（IADR-0168 軸 3）。
# 乖離は scripts/check-grafana-provisioning-parity.js が止める。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards
  namespace: platform-infra
  labels: { app: grafana }
data:
  dashboards.yaml: |
    apiVersion: 1
    providers:
      - name: Platform
        type: file
        disableDeletion: false
        editable: true
        updateIntervalSeconds: 30
        options:
          path: /etc/grafana/provisioning/dashboards
  llm-usage.json: |
    {
      "title": "LLM Usage & Cost",
      "uid": "llm-usage",
      "schemaVersion": 38,
      "version": 2,
      "refresh": false,
      "tags": [
        "microservices-platform",
        "llm",
        "cost"
      ],
      "time": {
        "from": "now-30d",
        "to": "now"
      },
      "panels": [
        {
          "id": 1,
          "title": "READ ME FIRST — 金額の読み方 / How to read the cost",
          "type": "text",
          "gridPos": {
            "x": 0,
            "y": 0,
            "w": 24,
            "h": 7
          },
          "options": {
            "mode": "markdown",
            "content": "**このダッシュボードは費用（金額）を表示する。** 用途別・モデル別のトークン消費量と金額換算は **単価表を読むゲートウェイ側**で計算している（`llm_cost_total` / `llm_tokens_total`。#443）。**Grafana のクエリに単価を書かない** —— 式に単価が散ると有効期間を判定する主体が居なくなり、期限切れの警告を出せる場所が無くなるためである。\n\n**🔴 「単価を解決できなかった呼び出し」パネルを最初に見ること。** そこが 0 でない間、**金額は過小である**（該当する単価が無い呼び出しは金額に計上されない）。原因は単価表の期限切れか、モデルの登録漏れである。`Llm:Pricing:Models` を直すこと。\n\n**使い方**（#546 / 計画 決定 39・41）: 毎月 1 回、`docs/operations/llm-cost-monthly-review-runbook.md` の手順に従って**前月比の増減**と**月内累計の推移**を見る。**絶対額のしきい値は持たない**（月次予算の金額は実測後に確定する）。\n\n**自動検知は無い。** ［2026-08-30 / #546］Alertmanager は**配備済み**になったが、**月次予算のしきい値が計画側で未確定**であるため上限アラートを置いていない（実測を待って確定する。実装側で数字を決めない）。したがって超過してもアラートは飛ばない。**検知の遅れは最大 1 か月である。**"
          }
        },
        {
          "id": 20,
          "title": "単価を解決できなかった呼び出し / Unpriced completions (MUST be 0)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 7,
            "w": 24,
            "h": 6
          },
          "description": "**0 でなければ金額は過小である。** `out_of_period` = 単価表の期限切れ（導入価格の終了日を反映し忘れ）、`no_entry` = そのモデルの単価が未登録。**無音で 0 円として扱わないための警報である**（ADR-0044 決定 3）。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (llm_pricing_status, llm_model) (increase(llm_pricing_unpriced_total[$__range]))",
              "legendFormat": "{{llm_pricing_status}} / {{llm_model}}"
            }
          ]
        },
        {
          "id": 21,
          "title": "費用（選択期間の累計・用途別） / Cost by purpose (selected range)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 13,
            "w": 12,
            "h": 9
          },
          "description": "**選択した時間範囲の累計**（`$__range` に追随する）。Runbook の手順どおり範囲を前月 1 か月へ合わせてから読む。単位は単価表の通貨（既定 USD）。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (llm_purpose) (increase(llm_cost_total[$__range]))",
              "legendFormat": "{{llm_purpose}}"
            }
          ]
        },
        {
          "id": 22,
          "title": "費用（選択期間の累計・モデル別） / Cost by model (selected range)",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 13,
            "w": 12,
            "h": 9
          },
          "description": "モデル振り分けの効果を金額で見る（用途別モデル振り分けの前後を同じ軸で比較する）。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (llm_model) (increase(llm_cost_total[$__range]))",
              "legendFormat": "{{llm_model}}"
            }
          ]
        },
        {
          "id": 23,
          "title": "トークン消費量（用途別・入出力別） / Tokens by purpose and type",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 22,
            "w": 12,
            "h": 9
          },
          "description": "費用の分子。入力と出力は単価が異なるため分けて見る（出力の**分布**は max_tokens の妥当性を見る別の面であり、`llm.completion.output_tokens` のヒストグラムが持つ）。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (llm_purpose, llm_token_type) (increase(llm_tokens_total[$__range]))",
              "legendFormat": "{{llm_purpose}} / {{llm_token_type}}"
            }
          ]
        },
        {
          "id": 24,
          "title": "費用の前月比（用途別） / Cost month-over-month by purpose",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 22,
            "w": 12,
            "h": 9
          },
          "description": "直近 30 日と、その 30 日前との比。1 を超えていれば増加している（計画 決定 41 の「前月比の増減」）。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (llm_purpose) (increase(llm_cost_total[30d])) / clamp_min(sum by (llm_purpose) (increase(llm_cost_total[30d] offset 30d)), 1e-9)",
              "legendFormat": "{{llm_purpose}}"
            }
          ]
        },
        {
          "id": 2,
          "title": "呼び出し回数（選択期間の累計・用途別） / Cumulative by purpose (selected range)",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 31,
            "w": 12,
            "h": 9
          },
          "description": "**選択した時間範囲の累計**（`$__range` に追随する）。Runbook の手順どおり範囲を前月 1 か月へ合わせてから読む（決定 41 の「月内累計の推移」）。既定は直近 30 日。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (llm_purpose) (increase(llm_completion_total[$__range]))",
              "legendFormat": "{{llm_purpose}}"
            }
          ]
        },
        {
          "id": 3,
          "title": "呼び出し回数（選択期間の累計・モデル別） / Cumulative by model (selected range)",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 31,
            "w": 12,
            "h": 9
          },
          "description": "モデル振り分けの効果を見る。上位モデルの比率が上がっていれば費用は回数以上に増える。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (llm_model) (increase(llm_completion_total[$__range]))",
              "legendFormat": "{{llm_model}}"
            }
          ]
        },
        {
          "id": 4,
          "title": "前月比（用途別） / Month-over-month by purpose",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 40,
            "w": 12,
            "h": 9
          },
          "description": "直近 30 日と、その 30 日前との比。1 を超えていれば増加している（決定 41 の「前月比の増減」）。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (llm_purpose) (increase(llm_completion_total[30d])) / clamp_min(sum by (llm_purpose) (increase(llm_completion_total[30d] offset 30d)), 1)",
              "legendFormat": "{{llm_purpose}}"
            }
          ]
        },
        {
          "id": 5,
          "title": "送信可否の内訳（選択期間） / Egress result breakdown (selected range)",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 40,
            "w": 12,
            "h": 9
          },
          "description": "sent が費用の発生する経路である。egress_denied は機密区分により送信していない（費用は発生しない）。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum by (llm_result) (increase(llm_completion_total[$__range]))",
              "legendFormat": "{{llm_result}}"
            }
          ]
        },
        {
          "id": 6,
          "title": "拒否率 / Refusal rate",
          "type": "timeseries",
          "gridPos": {
            "x": 0,
            "y": 49,
            "w": 12,
            "h": 8
          },
          "description": "送ったがモデルが拒否した割合。費用は発生しているのに成果が無い分である（IADR-0104 / IADR-0110）。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(rate(llm_completion_total{llm_stop_reason=\"refusal\"}[30m])) / clamp_min(sum(rate(llm_completion_total{llm_result=\"sent\"}[30m])), 1e-9)",
              "legendFormat": "refusal rate"
            }
          ]
        },
        {
          "id": 7,
          "title": "max_tokens 打ち切り率 / Truncation rate",
          "type": "timeseries",
          "gridPos": {
            "x": 12,
            "y": 49,
            "w": 12,
            "h": 8
          },
          "description": "打ち切りは再試行を招きやすく、費用の押し上げ要因になる。",
          "targets": [
            {
              "datasource": "Prometheus",
              "expr": "sum(rate(llm_completion_total{llm_stop_reason=\"max_tokens\"}[30m])) / clamp_min(sum(rate(llm_completion_total{llm_result=\"sent\"}[30m])), 1e-9)",
              "legendFormat": "max_tokens rate"
            }
          ]
        }
      ]
    }
  microservices-platform-overview.json: |
    {
      "title": "Platform Overview",
      "uid": "microservices-platform-overview",
      "schemaVersion": 38,
      "version": 4,
      "refresh": "30s",
      "tags": ["microservices-platform"],
      "panels": [
        {
          "id": 1,
          "title": "HTTP Request Rate (RPS)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum by (job) (rate(http_server_request_duration_seconds_count[1m]))",
            "legendFormat": "{{job}}"
          }]
        },
        {
          "id": 2,
          "title": "HTTP Error Rate (%)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 0, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~'5..'}[1m])) / sum by (job) (rate(http_server_request_duration_seconds_count[1m])) * 100",
            "legendFormat": "{{job}}"
          }]
        },
        {
          "id": 3,
          "title": "HTTP P99 Latency (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "histogram_quantile(0.99, sum by (le, job) (rate(http_server_request_duration_seconds_bucket[5m])))",
            "legendFormat": "p99 {{job}}"
          }]
        },
        {
          "id": 4,
          "title": "RAG Ask Latency P99 (s)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 8, "w": 12, "h": 8 },
          "targets": [{
            "datasource": "Prometheus",
            "expr": "histogram_quantile(0.99, sum by (le) (rate(http_server_request_duration_seconds_bucket{job='microservices-platform.aianalysis-service', http_route='/analysis/ask'}[5m])))",
            "legendFormat": "p99 /analysis/ask"
          }]
        },
        {
          "id": 5,
          "title": "未定義の辺の型のフォールバック / Undefined edge-type fallbacks (MUST be 0)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 16, "w": 12, "h": 8 },
          "description": "**ナレッジ健全性の指標（#443）。0 が正常である。** リンク抽出で辞書に無い辺の型が現れ `related` へ丸められた件数（ADR-0033 決定 3）。0 でない間は**型定義が不足している**。`explicit` = フロントマターの明示指定、`contextual` = 構文の文脈既定。**型名はここに出ない** —— 書き手が自由に書けるキー名で基数が無界なため、型名はログ（graph-service）へ回している。\n\n**この指標は SC-10 の画面に出していない。** 出さない根拠が「Grafana で観測できれば成立する」であり、**このパネルがその根拠の実体である**（#443 まで描くパネルが存在せず、根拠が成立していなかった）。",
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum by (graph_fallback_layer) (increase(graph_edge_type_fallback_total[$__range]))",
            "legendFormat": "{{graph_fallback_layer}}"
          }]
        },
        {
          "id": 6,
          "title": "取り込み経路で辞書に無いタグ / Ingest unknown tags (MUST be 0)",
          "type": "timeseries",
          "gridPos": { "x": 12, "y": 16, "w": 12, "h": 8 },
          "description": "**ナレッジ健全性の指標（#443）。0 が正常である —— しかも他の指標と読み方が違う。** 他は「発生してよい事象の量」だが、**取り込み経路はタグを生成しないと計画が確定している**（利用者裁定 2026-08-09）。よって 0 でない値は「量が多い」ではなく**規定違反の検出**である。`ingest_source` は現れた経路。\n\n**この指標も SC-10 の画面に出していない。**「Grafana で観測できれば成立する」が根拠であり、**このパネルがその実体である**。",
          "targets": [{
            "datasource": "Prometheus",
            "expr": "sum by (ingest_source) (increase(ingest_unknown_tag_total[$__range]))",
            "legendFormat": "{{ingest_source}}"
          }]
        },
        {
          "id": 7,
          "title": "RAG 初回応答 P95 / RAG first-token (TTFT) P95 (s)",
          "type": "timeseries",
          "gridPos": { "x": 0, "y": 24, "w": 12, "h": 8 },
          "description": "**NFR-02 の SLI そのものである（初回応答 p95 5 秒以下）。** `/analysis/ask/stream` の要求受領から最初の `token` イベントを書き出すまでの秒数（ADR-0076 決定 5 / #1204）。\n\n🔴 **上のパネル 4（RAG Ask Latency P99）と混同しない** —— あちらは一括経路 `/analysis/ask` の**応答完了**であり、長い回答ほど悪化する。**SLO の判定はこのパネルの指標で行う。**\n\n🔴 **空なら「速い」ではなく「呼ばれていない」である。** 本計器は `/analysis/ask/stream` が呼ばれた分しか系列を持たない。",
          "targets": [{
            "datasource": "Prometheus",
            "expr": "histogram_quantile(0.95, sum by (le) (rate(rag_answer_first_token_duration_seconds_bucket{job='microservices-platform.aianalysis-service'}[5m])))",
            "legendFormat": "p95 TTFT /analysis/ask/stream"
          }]
        }
      ]
    }
---
# #665: SLO アラートの暫定の一次検知。**compose 側の
# deploy/grafana/provisioning/alerting/slo-alerts.yaml と同内容を inline する**
# （datasources と同じ二重管理の方針）。乖離は scripts/check-grafana-alerting.js が止める。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-alerting
  namespace: platform-infra
data:
  slo-alerts.yaml: |
    # ADR-0006, NFR-21, #665: SLO アラートの**暫定**の一次検知（Grafana 統合アラート）。
    #
    # ★ これは暫定である。Alertmanager が配備されたら閉じる（併存させない）。
    #   計画 `06_technical/05_observability-ops.md` 決定 42:
    #     「SLO の一次検知 = Grafana の内蔵アラートを暫定の通知先とする。欠けているのは
    #      検知そのものではなく通知の送り先だけである」
    #   **ADR-0006（アラートは Alertmanager を用いる）は改めない。**
    #   判断の経緯: .ai-context/adr/IADR-0165_grafana-interim-alerting.md（**閉じる条件は docs/operations/operations.md**）
    #
    # ★★ 限界を先に書く（#546 / 計画 決定 40。「統制を定めた」と「統制が働いている」を読み分けられるように）
    #
    #   1. **push 配信の宛先は設定していない。** ここが定めるのは**検知とその可視化**までで、
    #      メール / Slack 等の宛先は**実環境の判断**である（Alertmanager の配備と同じ性質）。
    #      **contactPoints / policies を本ファイルへ書かないのは意図的である** ——
    #      届かない宛先を書くと「配線した」と読めてしまう。
    #   2. **したがって暫定期間は「人が Grafana の Alerting 画面を見る」ことで気づく。**
    #      **NFR-21「障害検出 5 分以内」を満たすのは評価の側だけ**であり、
    #      **人が気づくまでの時間は見に行く間隔に等しい。** 運用仕様書へ同じことを書いてある。
    #   3. **本ファイルが Grafana に受理されるかは未検証である**（#665 の作業仕様書 §判断 0）。
    #      実装環境で Grafana を起動できなかった（docker daemon へ到達不可）。
    #      機械で確かめたのは **`scripts/check-grafana-alerting.js`** の範囲
    #      —— ルール数と名前が `deploy/prometheus/alerts.yml` と 1 対 1、参照する
    #      `datasourceUid` が実在、compose と k8s が同内容、必須キーが揃っている、まで。
    #      **配備時に `/api/v1/provisioning/alert-rules` が 9 件返すことを確かめること。**
    #
    # 式は `deploy/prometheus/alerts.yml` と**同じもの**を使う（二重管理だが、暫定期間だけである）。
    #
    # 🔴 **しきい値の置き場所が Prometheus 版と違う**（#1110）。Prometheus 版は `expr` の中に `> 1.5` と書くが、
    #   Grafana 版は `expr` に閾値を持たず **`conditions[].evaluator.params`** に持つ。**両方を直すこと。**
    #   単位は**秒**である（`http_server_request_duration_seconds_*`）。2026-08-30 まで
    #   `params: [1500]` / `[5000]` とミリ秒の数値が残っており、名前も旧規約のままで**永久に発火しなかった。**
    #   メトリクス名・ラベル・単位の由来と、式を変えるときの検証手順（**陽性対照を対で置く**）は
    #   `deploy/prometheus/alerts.yml` の冒頭が正本である。
    apiVersion: 1
    groups:
      - orgId: 1
        name: platform-availability
        folder: SLO
        interval: 1m
        rules:
          - uid: slo-otel-collector-down
            title: OtelCollectorDown
            condition: C
            for: 2m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: critical
            annotations:
              summary: "OTel Collector 到達不可（可観測性パイプライン断）"
              description: "otel-collector の scrape が 2 分間失敗。メトリクス/トレース/ログの収集が停止している可能性。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: 'up{job="otel-collector"} == 0'
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }

          - uid: slo-service-request-metrics-absent
            title: ServiceRequestMetricsAbsent
            condition: C
            for: 5m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "サービスのリクエストメトリクスが途絶"
              description: "直近まで処理していたサービスの HTTP メトリクスが 5 分間ゼロ。ダウン/到達不可の可能性（要 blackbox 補完）。"
            data:
              - refId: A
                relativeTimeRange: { from: 1800, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: |
                    sum by (job) (rate(http_server_request_duration_seconds_count[5m])) == 0
                    and on (job) (sum by (job) (http_server_request_duration_seconds_count offset 15m) > 0)
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }

      - orgId: 1
        name: platform-slo
        folder: SLO
        interval: 1m
        rules:
          - uid: slo-high-http-5xx-rate
            title: HighHttp5xxRate
            condition: C
            for: 5m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: critical
            annotations:
              summary: "5xx 率が 5% 超"
              description: "直近 5 分の 5xx 率が閾値超過。障害検出 5 分以内（NFR-21）。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: |
                    sum by (job) (rate(http_server_request_duration_seconds_count{http_response_status_code=~"5.."}[5m]))
                    / sum by (job) (rate(http_server_request_duration_seconds_count[5m]))
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0.05] }

          - uid: slo-search-latency-p95-high
            title: SearchLatencyP95High
            condition: C
            for: 10m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "検索 p95 が 1.5s 超"
              description: "RetrievalService の p95 レイテンシが NFR-01 目標(1.5s)を 10 分継続で超過。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: |
                    histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.retrieval-service"}[5m])))
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    # 単位は**秒**（1.5s）。ミリ秒の 1500 ではない。
                    - evaluator: { type: gt, params: [1.5] }

          - uid: slo-rag-first-token-p95-high
            title: RagFirstTokenP95High
            condition: C
            for: 10m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "RAG 初回応答（初回トークン）p95 が 5s 超"
              description: "AiAnalysisService /analysis/ask/stream の初回トークンまでの p95 が NFR-02 目標(5s)を 10 分継続で超過。**NFR-02 の SLO 判定はこのルールである**（RagLatencyP95High は応答完了であり傾向の観察に留める）。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: |
                    histogram_quantile(0.95, sum by (le) (rate(rag_answer_first_token_duration_seconds_bucket{job="microservices-platform.aianalysis-service"}[5m])))
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    # 単位は**秒**（5s）。ミリ秒の 5000 ではない（ADR-0076 決定 1）。
                    - evaluator: { type: gt, params: [5] }

          - uid: slo-rag-latency-p95-high
            title: RagLatencyP95High
            condition: C
            for: 10m
            noDataState: NoData
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "RAG 応答完了 p95 が 5s 超（傾向の観察。NFR-02 の判定ではない）"
              description: "AiAnalysisService /analysis/ask（一括経路）の応答完了 p95 が 5s を 10 分継続で超過。NFR-02 の初回応答 SLO は RagFirstTokenP95High が判定する（ADR-0076 §統制と現在の実現手段）。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: |
                    histogram_quantile(0.95, sum by (le) (rate(http_server_request_duration_seconds_bucket{job="microservices-platform.aianalysis-service", http_route="/analysis/ask"}[5m])))
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    # 単位は**秒**（5s）。ミリ秒の 5000 ではない。
                    - evaluator: { type: gt, params: [5] }

      # ADR-0076 決定 3 (#1202): SLO の**評価対象そのものの不在**を warning とする。
      #
      # 🔴 **この群だけ `noDataState` が `OK` である。Prometheus 版には無い、Grafana 版だけの落とし穴。**
      #   `absent(m)` は **`m` が存在するとき空ベクタを返す**（＝正常時が「データ無し」）。Grafana の閾値式は
      #   空入力を NoData として扱うため、他の 6 件と同じ `NoData` にすると**正常時に `DatasourceNoData` が
      #   恒常発火する** —— ADR-0076 理由が「警報を無効化する」と名指しした型そのものになる。
      #   **既存 6 件は `NoData` のままでよい**（あちらは正常時に値を返す式であり、空になること自体が異常）。
      #
      # しきい値の置き場所は他と同じく `conditions[].evaluator.params`（`gt 0`）。`absent()` は真のとき 1 を返す。
      # 対象経路の選び方・`for: 5m` の理由・検知が最大およそ 10 分になることは
      # `deploy/prometheus/alerts.yml` の同名の群の冒頭が正本である。
      - orgId: 1
        name: platform-slo-evaluation-target
        folder: SLO
        interval: 1m
        rules:
          - uid: slo-otel-collector-up-series-absent
            title: OtelCollectorUpSeriesAbsent
            condition: C
            for: 5m
            noDataState: OK
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: 'SLO の評価対象が無い: up{job="otel-collector"} の系列が存在しない'
              description: "otel-collector の scrape 対象が Prometheus の設定から失われている疑い。OtelCollectorDown は空ベクタになり発火しない（ADR-0076 決定 3）。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: 'absent(up{job="otel-collector"})'
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }

          - uid: slo-http-server-metrics-series-absent
            title: HttpServerMetricsSeriesAbsent
            condition: C
            for: 5m
            noDataState: OK
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "SLO の評価対象が無い: http_server_request_duration_seconds_count の系列が 1 つも存在しない"
              description: "全サービスの HTTP メトリクスが Prometheus に無い。転送経路（OTLP → collector → remote write）の断、またはメトリクス名・単位の規約変更の疑い。ServiceRequestMetricsAbsent と HighHttp5xxRate は空ベクタになり発火しない（#1110 の再発。ADR-0076 決定 3）。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: 'absent(http_server_request_duration_seconds_count)'
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }

          - uid: slo-search-latency-series-absent
            title: SearchLatencySeriesAbsent
            condition: C
            for: 5m
            noDataState: OK
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "SLO の評価対象が無い: retrieval-service のレイテンシ分布が存在しない"
              description: "RetrievalService の http_server_request_duration_seconds_bucket が無い。SearchLatencyP95High は空ベクタになり発火しない（NFR-01 の検索 p95 が無監視になる）。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: 'absent(http_server_request_duration_seconds_bucket{job="microservices-platform.retrieval-service"})'
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }

      # FR-10, SC-10, ADR-0076 決定 3, IADR-0389 決定 5 (#1246): ナレッジ健全性の生産者の不在。
      #
      # 🔴 **上の群と式が違う（`absent_over_time` である）。** 生産は周期駆動（1 時間）であり、
      #   `absent()` の既定 5 分 lookback では平常時に鳴り続ける。理由の正本は
      #   `deploy/prometheus/alerts.yml` の同名グループの前書きである。
      - orgId: 1
        name: knowledge-health-producers
        folder: SLO
        interval: 1m
        rules:
          - uid: knowledge-health-unresolved-links-producer-absent
            title: KnowledgeHealthUnresolvedLinksProducerAbsent
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "ナレッジ健全性の生産者が居ない: unresolved-links の報告が 2 時間届いていない"
              description: "GraphService の定期収集が unresolved-links を DashboardService へ届けていない（周期は 1 時間）。受け口の件数は最後の値で凍るため、画面は正常に見える。収集の失敗・リースの停滞・受け口への到達不能を疑う（ADR-0076 決定 3）。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: 'absent_over_time(knowledge_health_report_total{knowledge_indicator="unresolved-links"}[2h])'
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }

          - uid: knowledge-health-edge-type-usage-producer-absent
            title: KnowledgeHealthEdgeTypeUsageProducerAbsent
            condition: C
            for: 10m
            noDataState: OK
            execErrState: Error
            labels:
              severity: warning
            annotations:
              summary: "ナレッジ健全性の生産者が居ない: edge-type-usage の報告が 2 時間届いていない"
              description: "GraphService の定期収集が edge-type-usage を DashboardService へ届けていない（周期は 1 時間）。受け口の件数は最後の値で凍るため、画面は正常に見える。収集の失敗・リースの停滞・受け口への到達不能を疑う（ADR-0076 決定 3）。"
            data:
              - refId: A
                relativeTimeRange: { from: 600, to: 0 }
                datasourceUid: prometheus
                model:
                  refId: A
                  instant: true
                  expr: 'absent_over_time(knowledge_health_report_total{knowledge_indicator="edge-type-usage"}[2h])'
              - refId: C
                datasourceUid: __expr__
                model:
                  refId: C
                  type: threshold
                  expression: A
                  conditions:
                    - evaluator: { type: gt, params: [0] }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: grafana
  namespace: platform-infra
  labels: { app: grafana }
spec:
  replicas: 1
  selector:
    matchLabels: { app: grafana }
  template:
    metadata:
      labels: { app: grafana }
    spec:
      containers:
        - name: grafana
          image: grafana/grafana:11.0.0
          # IADR-0090 (#353): Keycloak OIDC(generic OAuth) 認証。匿名 Admin は廃止（fail-safe: 認証未設定/失敗時は
          # 匿名フルアクセスへ倒さず、Grafana 組み込み local admin=admin/admin へフォールバックする）。
          # issuer は https://keycloak.localhost/realms/platform（IADR-0243・#780。手順A の
          # hosts 追記＋port-forward は不要になった）。URL の使い分けは下の env のコメントを見ること。
          env:
            # fail-safe: 匿名アクセスを無効化。ロックアウト回避の break-glass は local admin（dev 既定 admin/admin）。
            - { name: GF_AUTH_ANONYMOUS_ENABLED, value: "false" }
            # IADR-0091 (#356) PR-2: redirect_uri 構築の基準を集約後 URL（ホスト名ベース・edge admin:50000）へ。
            # Grafana は root_url から redirect_uri=<root_url>login/generic_oauth を「一意に」生成するため、OIDC の
            # 実効ログイン経路は edge（https://grafana.localhost:50000・LOCALEDGE=1 前提）になる。ホスト名ベース＝
            # ルート配信のため serve_from_sub_path は使わない。集約 Ingress は deploy/local/edge（#357）。
            # ※ LOCALEDGE 未使用の port-forward(3000) 単独では redirect が edge URL を指すため OIDC は完了せず、
            #   fail-safe の local admin へ落ちる（realm には旧 redirect も残すが実効は root_url が決める。
            #   port-forward で OIDC したい場合は本値を http://localhost:3000/ に戻す）。deploy/local/edge/README.md 参照。
            - { name: GF_SERVER_ROOT_URL, value: "https://grafana.localhost:50000/" }
            - { name: GF_AUTH_GENERIC_OAUTH_ENABLED, value: "true" }
            - { name: GF_AUTH_GENERIC_OAUTH_NAME, value: "Keycloak" }
            - { name: GF_AUTH_GENERIC_OAUTH_CLIENT_ID, value: "grafana" }
            # client secret は Secret 経由（平文コミットしない）。optional=true: 未設定でも Pod は起動し local admin へ落ちる。
            - name: GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET
              valueFrom:
                secretKeyRef:
                  name: grafana-oidc
                  key: client-secret
                  optional: true
            - { name: GF_AUTH_GENERIC_OAUTH_SCOPES, value: "openid profile email" }
            # NFR-09 / IADR-0243 決定 3（#780）: issuer をエッジ host へ移したので **ブラウザが開く URL** を
            # エッジへ向ける。3 つの URL は役割が違うので、揃えずに分ける。
            #
            #   AUTH_URL  … ブラウザが開く。**エッジでなければ解決できない**（利用者の PC は
            #               in-cluster 名 keycloak:8080 を引けない）。
            #   TOKEN_URL … Grafana pod がサーバ側で叩く。**in-cluster のまま**にする。
            #   API_URL   … 同上（userinfo）。
            #
            # 🔴 **in-cluster を残すのは手抜きではなく、ローカル CA の配布を避けるためである。**
            # エッジ証明書はローカル CA（cert-manager の local-edge-ca）が署名しており、Grafana
            # コンテナの既定ルートには入っていない。TOKEN/API までエッジへ向けると CA を配る必要が出る。
            # これは IADR-0086 が .NET に入れた metadata(in-cluster) / issuer(エッジ) の分離と同じ形であり、
            # Grafana の generic_oauth が 3 URL を別々に取る設計をそのまま使っている。
            #
            # 認可コードは Keycloak 側のセッションに紐づくので、**受け口が違っても交換できる**
            # （hostname-v2 の KC_HOSTNAME_URL 固定により、どの経路から叩いても広告値は同じエッジ URL）。
            - { name: GF_AUTH_GENERIC_OAUTH_AUTH_URL, value: "https://keycloak.localhost/realms/platform/protocol/openid-connect/auth" }
            - { name: GF_AUTH_GENERIC_OAUTH_TOKEN_URL, value: "http://keycloak:8080/realms/platform/protocol/openid-connect/token" }
            - { name: GF_AUTH_GENERIC_OAUTH_API_URL, value: "http://keycloak:8080/realms/platform/protocol/openid-connect/userinfo" }
            - { name: GF_AUTH_GENERIC_OAUTH_LOGIN_ATTRIBUTE_PATH, value: "preferred_username" }
            - { name: GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH, value: "email" }
            # role マッピング: platform-admin→Admin / platform-operator→Editor / それ以外→Viewer（最小権限・未知は Viewer）。
            # roles クレームは grafana client の protocolMapper が id_token/userinfo へ発行する（realm.json）。
            - { name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH, value: "contains(roles[*], 'platform-admin') && 'Admin' || contains(roles[*], 'platform-operator') && 'Editor' || 'Viewer'" }
            # strict=false: role_attribute_path が空でも既定 org ロール（Viewer）で受け入れる（Admin へ昇格させない）。
            - { name: GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_STRICT, value: "false" }
          ports:
            - { containerPort: 3000, name: http }
          volumeMounts:
            - name: datasources
              mountPath: /etc/grafana/provisioning/datasources
              readOnly: true
            - name: alerting
              mountPath: /etc/grafana/provisioning/alerting
              readOnly: true
            - name: dashboards
              mountPath: /etc/grafana/provisioning/dashboards
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: datasources
          configMap:
            name: grafana-datasources
        - name: alerting
          configMap:
            name: grafana-alerting
        - name: dashboards
          configMap:
            name: grafana-dashboards
---
apiVersion: v1
kind: Service
metadata:
  name: grafana
  namespace: platform-infra
  labels: { app: grafana }
spec:
  selector: { app: grafana }
  ports:
    - { name: http, port: 3000, targetPort: 3000 }
