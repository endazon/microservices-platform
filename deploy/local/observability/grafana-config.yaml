# ADR-0006, ADR-0107 決定 4, #1841: 経路 B の Grafana の既定の外部通信を止める ini（opt-in・platform-infra）。
# 中身は compose の deploy/grafana/grafana.ini と同じ（各行の理由はそちらのコメント）。grafana.yaml の Deployment が
# /etc/grafana/grafana.ini へ subPath でマウントする。
# grafana.yaml に置かないのは、check-grafana-provisioning-parity.js が grafana.yaml の ConfigMap の鍵を
# compose の provisioning/ と 1 対 1 で突き合わせるため（grafana.ini は provisioning ではない）。
# 🔴 1 行も消さないこと。scripts/lib/product-egress-defaults.js（check-deploy-manifests が呼ぶ）が描画結果を検査する。
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-config
  namespace: platform-infra
data:
  grafana.ini: |
    ; ADR-0107 決定 4, #1841: Grafana の既定の外部通信を止める設定だけを置く（データ外部送信方針・08_data-egress-policy）。
    ; 経路 A（compose）はこのファイルを /etc/grafana/grafana.ini へ読み取り専用でマウントし、
    ; 経路 B（deploy/local/observability/grafana.yaml）は同じ内容を ConfigMap grafana-config に inline で持つ。
    ; 🔴 1 行も消さないこと。scripts/lib/product-egress-defaults.js（check-deploy-manifests が呼ぶ）が両経路を検査する。
    ; 各行の送信先と既定値は Grafana 11.0.0 の conf/defaults.ini と、捕捉プロキシでの実測（#1841 の作業仕様書）による。
    ; ここに認証などの他の設定を足さない（環境変数 GF_* で与える。このファイルは「外へ出さない」の単一の置き場）。

    [analytics]
    ; 利用統計の送信（stats.grafana.org。24 時間ごと）
    reporting_enabled = false
    ; Grafana の更新確認（grafana.com/api/grafana/versions/stable）
    check_for_updates = false
    ; プラグインの更新確認（grafana.com）
    check_for_plugin_updates = false

    [news]
    ; ニュースフィードの取得（grafana.com）
    news_feed_enabled = false

    [security]
    ; 利用者のアバター画像の取得（ブラウザが secure.gravatar.com へ取りに行く）
    disable_gravatar = true

    [plugins]
    ; プラグイン署名の公開鍵の取得（grafana.com/api/plugins/ci/keys。起動時と 60 秒ごとに実測）
    public_key_retrieval_disabled = true

    [feature_toggles]
    ; Angular 検出パターンの取得（grafana.com/api/plugins/angular_patterns。起動時に実測）。
    ; 機能トグルは環境変数で個別に切れない（GF_* は ini に在る鍵しか上書きしない）ため、このファイルが要る。
    pluginsDynamicAngularDetectionPatterns = false
