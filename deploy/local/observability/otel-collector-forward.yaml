# ADR-0006, IADR-0077 (AST#24): opt-in 時のみ otel-collector を **forwarding 構成**へ差し替える。
# 既定（deploy/local/infra のみ適用）は otel-collector.yaml の **debug exporter のみ**＝外部送信なし（fail-safe）。
# 本 ConfigMap は同名（otel-collector-config・platform-infra）で、apply で上書きする。適用後は collector を
# rollout restart すること（k8s-local-up.sh の OBSERVABILITY ゲートが実施）。config は compose の
# deploy/otel-collector-config.yaml と同経路（prometheusremotewrite / otlp tempo / loki push）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: platform-infra
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # SC-10, ADR-0078 決定 3, IADR-0421 (#1245 PR-B): 近接 MTA のキュー（キュー長・滞留時間）。
      # 🔴 **既定構成（deploy/local/infra/otel-collector.yaml）と同じ宣言を持つ。** 本 ConfigMap は
      #    同名で既定を**上書きする**ので、ここに無いと転送を有効にした瞬間に観測が消える（#1090 の形）。
      # 🔴 Prometheus の scrape 対象は増やさない（唯一の scrape 対象は otel-collector:8888 のまま）。
      #    ここで受けた系列は下の prometheusremotewrite で Prometheus へ入る。
      prometheus/mail-relay:
        config:
          scrape_configs:
            - job_name: mail-relay
              scrape_interval: 30s
              static_configs:
                - targets: ['mail-relay:9154']
      # SC-15, NFR-21, ADR-0111 フォローアップ 3, IADR-0432 (#1544): リセット申請の床の器の Service に
      # ready な endpoint が残っているか（器自身の `/metrics` が答えるか）。receiver が出す `up{job="reset-floor"}` を
      # ResetFloorNoReadyEndpoint（== 0）と ResetFloorUpSeriesAbsent（系列の不在）が見る。
      # 🔴 **既定構成（deploy/local/infra/otel-collector.yaml）と同じ宣言を持つ**（上の mail-relay と同じ理由）。
      prometheus/reset-floor:
        config:
          scrape_configs:
            - job_name: reset-floor
              scrape_interval: 30s
              metrics_path: /metrics
              static_configs:
                - targets: ['reset-floor:8080']
      # NFR-18, ADR-0124 決定 2, IADR-0486 (#1683): Vault の audit（socket device・tcp・1 行 1 JSON）の受け口。
      # 🔴 **既定構成と転送構成の両方に同じ宣言を置く。** Vault は audit device を有効にするときに試験の 1 行を書くので、
      #    ここに受け口が無いと有効化そのものが失敗する。転送構成は本 ConfigMap を同名で上書きする（#1090 の形）。
      # 🔴 **compose の設定（deploy/otel-collector-config.yaml）には置かない** —— compose に Vault は居ない。
      # 宛先の単一情報源は deploy/local/vault-persistence/vault-entrypoint.sh の VAULT_AUDIT_SOCKET_ADDRESS。
      # 値は Vault 側で HMAC 化済み（log_raw=false）。一致は scripts/scripts.repo.test.js（#1683）が突き合わせる。
      tcplog/vault-audit:
        listen_address: 0.0.0.0:9514
    processors:
      batch:
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
      # NFR-18, ADR-0124 決定 2, IADR-0486 (#1683): Vault の audit を Loki の `{job="vault-audit"}` に置き、
      # 本文（Vault の JSON 1 行）をそのまま 1 行として送る。🔴 **値で落とす段（filter）を置かない** ——
      # 抽出は Loki の側で行う（抽出の条件は docs/security/security.md「監査ログ」）。
      resource/vault-audit:
        attributes:
          - key: service.name
            value: vault-audit
            action: upsert
      attributes/vault-audit:
        actions:
          - key: loki.format
            value: raw
            action: insert
    exporters:
      prometheusremotewrite:
        endpoint: http://prometheus:9090/api/v1/write
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
        # NFR-18, ADR-0133, IADR-0526 (#1842): Loki の前段は書き込みの身元をトークンで検証する（push の道だけを通す）。
        # 値は Secret `observability-gate` の `writer`（otel-collector.yaml の env。任意の参照）。無ければ空の Bearer になり、前段が 401 で拒む。
        # 🔴 compose の deploy/otel-collector-config.yaml には置かない —— compose の Loki に前段は無い（0 段。security.md）。
        headers:
          Authorization: "Bearer ${env:OBS_GATE_WRITER_TOKEN}"
      debug:
        verbosity: normal
    service:
      # #546 / #1090: 自己テレメトリの待受を**明示する**（image 既定に頼らない —— collector は版によって
      # 既定が localhost:8888 と :8888 の間で変わっており、既定任せだと版上げで静かに scrape 不能になる）。
      # ここが Prometheus の**唯一の scrape 対象**である（prometheus.yaml の job_name: otel-collector）。
      # 🔴 本 ConfigMap は fail-safe 側（deploy/local/infra/otel-collector.yaml）を**同名で上書きする**。
      #    宣言を落とすと、転送を有効にした瞬間に唯一の scrape 対象が消える。3 つの collector 設定が
      #    同じ宣言を持つことは scripts/check-collector-self-telemetry.js が突合する。
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, debug]
        metrics:
          # 🔴 近接 MTA のキューはここから Prometheus（remote write）へ入る。job ラベルは
          #   `mail-relay`（receiver の job_name 由来）になる ——アラートの式はこの名前を使う。
          # 🔴 床の器の `up` も同じ経路で入る（job ラベルは `reset-floor`）。
          receivers: [otlp, prometheus/mail-relay, prometheus/reset-floor]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [loki, debug]
        # NFR-18, ADR-0124 決定 2, IADR-0486 (#1683): Vault の audit 専用（アプリの OTLP のログと混ぜない）。
        logs/vault-audit:
          receivers: [tcplog/vault-audit]
          processors: [memory_limiter, resource/vault-audit, attributes/vault-audit, batch]
          exporters: [loki]
