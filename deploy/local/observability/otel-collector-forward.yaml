# ADR-0006, IADR-0077 (AST#24): opt-in 時のみ otel-collector を **forwarding 構成**へ差し替える。
# 既定（deploy/local/infra のみ適用）は otel-collector.yaml の **debug exporter のみ**＝外部送信なし（fail-safe）。
# 本 ConfigMap は同名（otel-collector-config・platform-infra）で、apply で上書きする。適用後は collector を
# rollout restart すること（k8s-local-up.sh の OBSERVABILITY ゲートが実施）。config は compose の
# deploy/otel-collector-config.yaml と同経路（prometheusremotewrite / otlp tempo / loki push）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: platform-infra
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # SC-10, ADR-0078 決定 3, IADR-0421 (#1245 PR-B): 近接 MTA のキュー（キュー長・滞留時間）。
      # 🔴 **既定構成（deploy/local/infra/otel-collector.yaml）と同じ宣言を持つ。** 本 ConfigMap は
      #    同名で既定を**上書きする**ので、ここに無いと転送を有効にした瞬間に観測が消える（#1090 の形）。
      # 🔴 Prometheus の scrape 対象は増やさない（唯一の scrape 対象は otel-collector:8888 のまま）。
      #    ここで受けた系列は下の prometheusremotewrite で Prometheus へ入る。
      prometheus/mail-relay:
        config:
          scrape_configs:
            - job_name: mail-relay
              scrape_interval: 30s
              static_configs:
                - targets: ['mail-relay:9154']
    processors:
      batch:
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_mib: 512
    exporters:
      prometheusremotewrite:
        endpoint: http://prometheus:9090/api/v1/write
      otlp/tempo:
        endpoint: tempo:4317
        tls:
          insecure: true
      loki:
        endpoint: http://loki:3100/loki/api/v1/push
      debug:
        verbosity: normal
    service:
      # #546 / #1090: 自己テレメトリの待受を**明示する**（image 既定に頼らない —— collector は版によって
      # 既定が localhost:8888 と :8888 の間で変わっており、既定任せだと版上げで静かに scrape 不能になる）。
      # ここが Prometheus の**唯一の scrape 対象**である（prometheus.yaml の job_name: otel-collector）。
      # 🔴 本 ConfigMap は fail-safe 側（deploy/local/infra/otel-collector.yaml）を**同名で上書きする**。
      #    宣言を落とすと、転送を有効にした瞬間に唯一の scrape 対象が消える。3 つの collector 設定が
      #    同じ宣言を持つことは scripts/check-collector-self-telemetry.js が突合する。
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [otlp/tempo, debug]
        metrics:
          # 🔴 近接 MTA のキューはここから Prometheus（remote write）へ入る。job ラベルは
          #   `mail-relay`（receiver の job_name 由来）になる ——アラートの式はこの名前を使う。
          receivers: [otlp, prometheus/mail-relay]
          processors: [memory_limiter, batch]
          exporters: [prometheusremotewrite, debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [loki, debug]
