# IADR-0066 / ADR-0003(MassTransit/RabbitMQ。Superseded by ADR-0027): 共有 RabbitMQ（dev）。
# MSP/AST サービスは appsettings 既定でホスト `rabbitmq`（guest/guest）へ接続する。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: rabbitmq
  namespace: platform-infra
  labels: { app: rabbitmq }
spec:
  replicas: 1
  selector:
    matchLabels: { app: rabbitmq }
  template:
    metadata:
      labels: { app: rabbitmq }
    spec:
      containers:
        - name: rabbitmq
          image: rabbitmq:3.13-management-alpine
          env:
            - name: RABBITMQ_DEFAULT_USER
              value: guest
            - name: RABBITMQ_DEFAULT_PASS
              valueFrom:
                secretKeyRef:
                  name: rabbitmq
                  key: password
          ports:
            - { containerPort: 5672, name: amqp }
            - { containerPort: 15672, name: management }
          readinessProbe:
            exec:
              command: ["rabbitmq-diagnostics", "-q", "ping"]
            initialDelaySeconds: 15
            periodSeconds: 10
            timeoutSeconds: 10
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: platform-infra
  labels: { app: rabbitmq }
spec:
  selector: { app: rabbitmq }
  ports:
    - { name: amqp, port: 5672, targetPort: 5672 }
    - { name: management, port: 15672, targetPort: 15672 }
