# IADR-0066 / ADR-0004: 認証（Keycloak, dev）。realm `platform` を import。
# 取り込み元の realm JSON は kustomize の外で `scripts/k8s-local-up.sh` の [3/7] が実ファイル（deploy/keycloak/…）から
# **Secret `keycloak-realm-import`** として作り、/opt/keycloak/data/import へマウントする（単一情報源＝既存 realm ファイル）。
# NFR-18, ADR-0124 決定 1, IADR-0518 (#1834): ConfigMap ではなく Secret なのは、レルム管理のロールを持つ 3 クライアント
# （identity-admin / reset-gate / mcp-client-admin）の secret を、env を与えたときは宣言の dev の値ではなく env の値で渡すため
# （dev 以外のクラスタの初回の取り込みで公知の値のクライアントを作らない・消費側の Secret と食い違わない）。
# 宣言のままの ConfigMap `keycloak-realms` は realm の後追い Job と申請の門が読む（こちらは変えない）。
#
# IADR-0261 (#438): realm.json に loginTheme/accountTheme=platform を投入済み。テーマの実体
# （deploy/keycloak/themes/platform/）は下記 ConfigMap `keycloak-theme-platform` としてマウントする。
# ★ この ConfigMap は kustomize の外（root 外ファイル参照はセキュリティ上不可。上記 realm と同型の制約）
# のため、`scripts/k8s-local-up.sh` の [3/7] ブロック（realm の ConfigMap・取り込み元の Secret の直後）が生成する
# （#438 残作業。realm の ConfigMap と同型の `--from-file` + `--dry-run=client | kubectl apply` で冪等）。
# `optional: true` のため、未作成（スクリプトを経ない手動 kubectl apply -k 等）でも Pod は起動する
# （fail-safe）が、その場合 loginTheme=platform を解決できずログイン画面が 500 になる。
#
# NFR-09 / ADR-0023 / IADR-0076 決定3・IADR-0227・IADR-0243（#780 第2段）: 発行者(issuer)はエッジ host
# `https://keycloak.localhost` に固定する（KC_HOSTNAME がその単一情報源。#1859 / IADR-0524 で KC_HOSTNAME_URL から移した）。
# サービス間 JWT 検証（.NET）は in-cluster から到達できる `http://keycloak:8080/.../well-known/...` を
# `Auth__MetadataAddress` で引き、`Auth__ValidIssuers` にエッジ issuer を許可リストとして足す
# （IADR-0086 の分離。values-local.yaml global.auth 参照）。非 .NET の OIDC クライアント
# （Grafana/ArgoCD/Vault/Headlamp/Wiki.js）は pod からエッジ issuer へ直接到達する
# （coredns-custom。IADR-0227・deploy/local/aliases/coredns-edge-hosts.yaml）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: platform-infra
  labels: { app: keycloak }
spec:
  replicas: 1
  selector:
    matchLabels: { app: keycloak }
  template:
    metadata:
      labels: { app: keycloak }
    spec:
      containers:
        - name: keycloak
          # FR-16, NFR-09, ADR-0107, IADR-0524 (#1859): 24.0 → 26.7.4（CVE-2024-8883 の修正を含む 26 系。index の digest で固定）。
          # 26 で変わった起動の前提（下の各 env の注記）: hostname v2・ヘルスは管理用のポート 9000・取り込みのファイル名は
          # `<realm>-realm.json`（k8s-local-up.sh の取り込み元の Secret のキー）・dev-file（H2）の既定の資格が無くなった。
          image: quay.io/keycloak/keycloak:26.7.4@sha256:82a77884f3af238beab1e7afd63b5f530e1b5c0590bd7aa60b40a40463e29b2c
          args: ["start-dev", "--import-realm"]
          env:
            # IADR-0369 (#1088): 管理者名も Secret から読む。26 では KEYCLOAK_ADMIN* は非推奨（KC_BOOTSTRAP_ADMIN_* が後継）だが
            # 警告だけで有効である。名前を変えると Pod の env を読む検査器（check-password-reset-mail.js）と手順書に波及するので
            # 本件では変えない（IADR-0524 の残余）。realm の後追い Job
            # （deploy/local/keycloak-setup/realm-reconcile-job.yaml）が同じ Secret の同じキーを読むので、
            # 管理者名の単一情報源が Secret keycloak-admin になる（scripts/k8s-local-up.sh [3/7] が作る）。
            - name: KEYCLOAK_ADMIN
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KEYCLOAK_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
            # エッジ issuer（#780 第2段）。単一情報源はこの1行。.NET は Auth__MetadataAddress で
            # in-cluster well-known を引くため無停止で追随する（IADR-0086）。
            # 🔴 IADR-0524 (#1859): 26 は hostname v1 の KC_HOSTNAME_URL を**警告だけ出して無視する**（issuer が要求の host に
            # 揺れる。実測）。v2 の KC_HOSTNAME に完全な URL を与える。KC_HOSTNAME_URL を戻さない（k8s-local-up.test.js が止める）。
            - name: KC_HOSTNAME
              value: https://keycloak.localhost
            # IADR-0524: バックチャネル（token・jwks・userinfo・introspection）の URL は要求の host で描く（24 の v1 の既定と同じ）。
            # .NET は in-cluster の well-known から jwks_uri を引くので、これが無いとエッジの URL（ローカル CA）を引きに行く。
            - name: KC_HOSTNAME_BACKCHANNEL_DYNAMIC
              value: "true"
            # 🔴 IADR-0524 (#1859・integration-stack の初回の実行): KC_PROXY_HEADERS（転送ヘッダを読ませる設定）は**置かない**。
            #   メッシュの送り手側のサイドカー（Envoy）は X-Forwarded-Proto を付けるが X-Forwarded-Port は付けない。転送ヘッダを読ませると
            #   Keycloak は port を落とし、in-cluster の well-known が jwks_uri を http://keycloak/…（80 番）で返して、全サービスの
            #   JWT 検証が「署名の鍵が無い」（IDX10500）で 401 になった（手元でも X-Forwarded-Proto だけを付けて再現）。
            #   エッジ越しの要求（Host が KC_HOSTNAME の host）は、転送ヘッダが無くても https の公開 URL で安全な文脈と判定され、
            #   クッキーは 24 と同じ Secure; SameSite=None になる（手元で実測）。
            # IADR-0524: start-dev の dev-file（H2）。24 は資格を sa / password に差し替えていたが 26 は差し替えない。
            # 永続化（PVC。既定）された 24 の H2 を開くために同じ値を明示する（H2 のファイルの外へ出ない値で、秘密ではない）。
            # 新しい PVC もこの資格で作られる。
            - name: KC_DB_USERNAME
              value: sa
            - name: KC_DB_PASSWORD
              value: password
            # 26: ヘルスは管理用のポート 9000 に出る（8080 の /health/ready は 404）。下の readinessProbe が 9000 を見る。
            - name: KC_HEALTH_ENABLED
              value: "true"
            # #438: dev ではテーマファイルを編集しながら確認できるよう、キャッシュを無効化する
            # （docker-compose 側と揃える。本番では効かせるため values-local 限定の設定）。
            - name: KC_SPI_THEME_CACHE_THEMES
              value: "false"
            - name: KC_SPI_THEME_CACHE_TEMPLATES
              value: "false"
            - name: KC_SPI_THEME_STATIC_MAX_AGE
              value: "-1"
            # #1399: JVM ヒープの上限。Keycloak 24 の既定 -XX:MaxRAMPercentage=70 は limit 2Gi で約 1.4GiB の
            # ヒープになり、metaspace / off-heap と合わせて 2Gi を超えて OOMKilled(137) を繰り返した（7 日で 11 回。
            # 再起動中は全サービスのトークン検証が一時的に 401 になる）。50% ≒ 1GiB に抑える。JAVA_OPTS 全体は
            # 置き換えない（Keycloak が用意した上書き点だけを使う）。
            - name: JAVA_OPTS_KC_HEAP
              value: "-XX:MaxRAMPercentage=50"
          ports:
            - containerPort: 8080
            # IADR-0524: 管理用のポート（ヘルス）。kubelet だけが見る。Service には出さない。
            - name: management
              containerPort: 9000
          readinessProbe:
            httpGet:
              path: /health/ready
              port: 9000
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 30
          volumeMounts:
            - name: realms
              mountPath: /opt/keycloak/data/import
              readOnly: true
            - name: theme-platform
              mountPath: /opt/keycloak/themes/platform
              readOnly: true
          # Keycloak(Quarkus) の初回 augmentation ビルドはメモリを食う。1Gi では OOMKilled(137) に
          # なるため 2Gi へ引き上げる（起動後は 1Gi 未満で安定するので requests は据え置き）。
          resources:
            requests: { cpu: 200m, memory: 512Mi }
            limits: { cpu: "1", memory: 2Gi }
      volumes:
        # IADR-0518 (#1834): 取り込み元は Secret（env の値を含み得る）。k8s-local-up.sh の [3/7] が作る。
        # 非 optional —— 無ければ Pod は起動しない（取り込み元の無い Keycloak を空の realm で立てない）。
        - name: realms
          secret:
            secretName: keycloak-realm-import
        - name: theme-platform
          configMap:
            name: keycloak-theme-platform
            optional: true # #438: k8s-local-up.sh が [3/7] で自動生成する。fail-safe のため未作成でも Pod は起動する
            items:
              - key: login-theme-properties
                path: login/theme.properties
              - key: login-css
                path: login/resources/css/platform.css
              - key: account-theme-properties
                path: account/theme.properties
              - key: account-css
                path: account/resources/css/platform.css
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: platform-infra
  labels: { app: keycloak }
spec:
  selector: { app: keycloak }
  ports:
    - port: 8080
      targetPort: 8080
