# IADR-0066 / ADR-0002(DB per service): 共有 Postgres（dev）。
# MSP（user kp）と AST（user ai）双方の専有 DB を初回起動時に作成する（compose の
# deploy/create-multiple-dbs.sh と src/ai-stock-trading/infra/postgres/init を k8s へ写像）。
# dev のため emptyDir（Pod 再起動で再 init）。恒久化が要るなら PVC(local-path) へ差し替える。
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: platform-infra
data:
  01-create-databases.sh: |
    #!/bin/bash
    set -e
    psql -v ON_ERROR_STOP=1 --username "$POSTGRES_USER" --dbname "$POSTGRES_DB" <<-'EOSQL'
      -- MSP（knowledge/platform）専有 DB。owner=kp（appsettings.json 既定と一致）。
      CREATE DATABASE document_svc;
      CREATE DATABASE datasource_svc;
      CREATE DATABASE conversion_svc;
      CREATE DATABASE retrieval_svc;
      CREATE DATABASE aianalysis_svc;
      CREATE DATABASE authz_svc;
      CREATE DATABASE wiki_svc;
      CREATE DATABASE feedback_svc;
      CREATE DATABASE dashboard_svc;
      -- FR-17, UC-10 (#908/#957): 知識グラフ GraphService 専用 DB。
      CREATE DATABASE graph_svc;
      -- FR-22, ADR-0045, IADR-0288 (#1025): 利用者通知の NotificationService 専用 DB。
      -- 起動時に MigrateAsync が走るため、未作成だと Pod がクラッシュループする。
      -- compose 側の deploy/create-multiple-dbs.sh と対で追随させる（片方だけだと片方の環境が壊れる）。
      CREATE DATABASE notification_svc;
      -- FR-16, UC-09, SC-12, ADR-0024 (#452): MCP クライアント登録簿の McpServer 専用 DB。
      -- 起動時に MigrateAsync が走るため、未作成だと Pod がクラッシュループする。
      -- compose 側の deploy/create-multiple-dbs.sh と対で追随させる。
      CREATE DATABASE mcp_svc;
      CREATE DATABASE wikijs;
      CREATE USER kp WITH PASSWORD 'kp';
      ALTER DATABASE document_svc OWNER TO kp;
      ALTER DATABASE datasource_svc OWNER TO kp;
      ALTER DATABASE conversion_svc OWNER TO kp;
      ALTER DATABASE retrieval_svc OWNER TO kp;
      ALTER DATABASE aianalysis_svc OWNER TO kp;
      ALTER DATABASE authz_svc OWNER TO kp;
      ALTER DATABASE wiki_svc OWNER TO kp;
      ALTER DATABASE feedback_svc OWNER TO kp;
      ALTER DATABASE dashboard_svc OWNER TO kp;
      ALTER DATABASE graph_svc OWNER TO kp;
      ALTER DATABASE notification_svc OWNER TO kp;
      ALTER DATABASE mcp_svc OWNER TO kp;
      ALTER DATABASE wikijs OWNER TO kp;

      -- AST（ai-stock-trading）専有 DB。owner=ai（AST compose 既定 POSTGRES_USER と一致）。
      CREATE USER ai WITH PASSWORD 'ai';
      CREATE DATABASE audit_svc OWNER ai;
      CREATE DATABASE configuration_svc OWNER ai;
      CREATE DATABASE cost_control_svc OWNER ai;
      CREATE DATABASE market_monitor_svc OWNER ai;
      CREATE DATABASE order_execution_svc OWNER ai;
      CREATE DATABASE report_svc OWNER ai;
      CREATE DATABASE risk_management_svc OWNER ai;
    EOSQL
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: platform-infra
  labels: { app: postgres }
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      # NFR-16, NFR-18, IADR-0591（Refs GHSA-j4qv-2w99-xg5p）: サーバ証明書（cert-manager の Secret postgres-tls。deploy/local/infra-tls）を
      #   postgres の利用者（uid 70）だけが読める形へ写す。postgres は鍵が自分の所有で 0600（または root の所有で 0640 以下）で
      #   なければ起動しない。Secret のボリュームは root の所有になるので、そのままでは渡せない（fsGroup はデータの
      #   ボリュームの権限まで変えるので使わない）。
      initContainers:
        - name: tls-files
          image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          command:
            - sh
            - -c
            - |
              set -e
              cp /tls-src/tls.crt /tls/tls.crt
              cp /tls-src/tls.key /tls/tls.key
              chown 70:70 /tls/tls.crt /tls/tls.key
              chmod 0644 /tls/tls.crt
              chmod 0600 /tls/tls.key
          volumeMounts:
            - { name: tls-src, mountPath: /tls-src, readOnly: true }
            - { name: tls, mountPath: /tls }
          resources:
            requests: { cpu: 10m, memory: 16Mi }
            limits: { cpu: 100m, memory: 64Mi }
      containers:
        - name: postgres
          image: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
          # NFR-16, IADR-0591: TLS を受ける（TLS 1.2 以上）。段 1 は平文の接続も受ける（pg_hba は既定の host のまま）——
          #   取引ユニット（AST）と基盤の他のクライアント（Keycloak・Wiki.js・バックアップ）が TLS へ切り替えるまでの併存である。
          #   平文を閉じる（hostssl だけにする）のは全クライアントの切り替えを確かめた後の段（IADR-0591 の段の表）。
          args:
            - -c
            - ssl=on
            - -c
            - ssl_cert_file=/etc/postgres-tls/tls.crt
            - -c
            - ssl_key_file=/etc/postgres-tls/tls.key
            - -c
            - ssl_min_protocol_version=TLSv1.2
          env:
            - name: POSTGRES_USER
              value: postgres
            - name: POSTGRES_DB
              value: postgres
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres
                  key: password
          ports:
            - containerPort: 5432
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            - name: init
              mountPath: /docker-entrypoint-initdb.d
            - name: tls
              mountPath: /etc/postgres-tls
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 5
            periodSeconds: 5
          resources:
            requests: { cpu: 100m, memory: 256Mi }
            limits: { cpu: "1", memory: 1Gi }
      volumes:
        - name: data
          emptyDir: {}
        - name: init
          configMap:
            name: postgres-init
            defaultMode: 0755
        # IADR-0591: 証明書の Secret（非 optional。無ければ Pod は立たない＝平文だけで黙って立たない）と、その写し。
        #   🔴 data（volumes[0]）と init（volumes[1]）の位置を変えない（deploy/local/infra-persistence が添字で差し替える）。
        - name: tls-src
          secret:
            secretName: postgres-tls
            defaultMode: 0400
        - name: tls
          emptyDir:
            medium: Memory
            sizeLimit: 1Mi
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: platform-infra
  labels: { app: postgres }
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
