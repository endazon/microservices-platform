# IADR-0066 / ADR-0006: OpenTelemetry Collector（dev）。
# dev は観測 UI（Prometheus/Tempo/Loki/Grafana）を必須にせず、debug エクスポータのみで受信を成立させる
# （telemetry を受けても外部バックエンドへ転送しない）。観測 UI が要るなら compose もしくは別途導入する。
apiVersion: v1
kind: ConfigMap
metadata:
  name: otel-collector-config
  namespace: platform-infra
data:
  config.yaml: |
    receivers:
      otlp:
        protocols:
          grpc:
            endpoint: 0.0.0.0:4317
          http:
            endpoint: 0.0.0.0:4318
      # SC-10, ADR-0078 決定 3, IADR-0421 (#1245 PR-B): 近接 MTA のキューを collector が取りに行く。
      # 🔴 **Prometheus の scrape 対象を増やさない。** 「otel-collector が唯一の scrape 対象」は
      #    #546 / #1090 が守っている不変条件であり、直 scrape を足すとそれが崩れる。
      #    取り手を collector 側に置けば、既存の経路（remote write / debug）へそのまま乗る。
      # 🔴 **転送構成（deploy/local/observability/otel-collector-forward.yaml）にも同じ宣言を置く。**
      #    片方だけに置くと、opt-in の apply で collector を差し替えた瞬間に観測が消える（#1090 の形）。
      # 🔴 **compose の設定（deploy/otel-collector-config.yaml）には置かない** —— compose スタックに
      #    近接 MTA は居ない（メールの検証経路は k8s だけである。運用 Runbook が compose 経路を退役させた）。
      #    **宛先の無い scrape を足すと恒常的に失敗し続ける。** 乖離は受容であり、同ファイルにも明記した。
      prometheus/mail-relay:
        config:
          scrape_configs:
            - job_name: mail-relay
              scrape_interval: 30s
              static_configs:
                - targets: ['mail-relay:9154']
    processors:
      batch:
        timeout: 5s
      memory_limiter:
        check_interval: 1s
        limit_mib: 256
    exporters:
      debug:
        verbosity: normal
    service:
      # #546: 自己テレメトリの待受を**明示する**（image 既定に頼らない —— collector は版によって
      # 既定が localhost:8888 と :8888 の間で変わっており、既定任せだと版上げで静かに
      # scrape 不能になる）。ここが Prometheus の唯一の scrape 対象である。
      telemetry:
        metrics:
          address: 0.0.0.0:8888
      pipelines:
        traces:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
        metrics:
          # 🔴 近接 MTA のキューは**既定構成でも受ける**（転送構成と同じ受け口を持たせる）。
          #   既定は debug エクスポータだけなので外へは出ない —— 見えるのは collector のログである。
          receivers: [otlp, prometheus/mail-relay]
          processors: [memory_limiter, batch]
          exporters: [debug]
        logs:
          receivers: [otlp]
          processors: [memory_limiter, batch]
          exporters: [debug]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-collector
  namespace: platform-infra
  labels: { app: otel-collector }
spec:
  replicas: 1
  selector:
    matchLabels: { app: otel-collector }
  template:
    metadata:
      labels: { app: otel-collector }
    spec:
      containers:
        - name: otel-collector
          image: otel/opentelemetry-collector-contrib:0.102.0
          args: ["--config=/etc/otelcol-contrib/config.yaml"]
          ports:
            - { containerPort: 4317, name: otlp-grpc }
            - { containerPort: 4318, name: otlp-http }
            # #546: collector 自身のテレメトリ（Prometheus の**唯一の scrape 対象**）。
            # ここを開けないと up{job="otel-collector"} が恒常的に 0 になり、
            # OtelCollectorDown が鳴り続ける。Alertmanager 配備前は誰も見ていなかったので
            # 気付かれなかった（実測 2026-08-30）。
            - { containerPort: 8888, name: self-metrics }
          volumeMounts:
            - name: config
              mountPath: /etc/otelcol-contrib
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 128Mi }
            limits: { cpu: 500m, memory: 512Mi }
      volumes:
        - name: config
          configMap:
            name: otel-collector-config
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: platform-infra
  labels: { app: otel-collector }
spec:
  selector: { app: otel-collector }
  ports:
    - { name: otlp-grpc, port: 4317, targetPort: 4317 }
    - { name: otlp-http, port: 4318, targetPort: 4318 }
    # #546: Prometheus はこのポートを scrape する（deploy/prometheus.yml / 経路B の
    # prometheus.yaml の job_name: otel-collector）。**Service に載せないと到達できない。**
    - { name: self-metrics, port: 8888, targetPort: 8888 }
