# IADR-0066: dev 専用 in-cluster インフラ（platform-infra namespace）。
# 適用: kubectl apply -k deploy/local/infra
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - 00-namespace.yaml
  - inotify-sysctl.yaml
  - postgres.yaml
  - rabbitmq.yaml
  - redis.yaml
  - keycloak.yaml
  - qdrant.yaml
  - otel-collector.yaml
  # ADR-0045 決定 9 (#1144): 開発環境の捕捉用 MTA。**opt-in にしない**（決定 9 は無条件で、
  # ゲートに載せるとゲートを立てない人の既定が外を向いたままになる）。
  # 🔴 ADR-0078 決定 2 (#1245) 以後、mailpit は Keycloak の送出先ではなく**近接 MTA の上流**である。
  - mailpit.yaml
  # SC-15, ADR-0078 決定 2 / IADR-0403 (#1245): Keycloak の**近接 MTA（キュー付き Postfix）**。
  # **環境非依存の base**であり、dev と go-live が同じ宣言を使う（違うのは上流だけ）。
  # ここは dev の overlay としてそれを取り込むだけである。**opt-in にしない**（決定 2 は無条件）。
  - ../../mail-relay

# NOTE: Keycloak realm import 用 ConfigMap `keycloak-realms` は kustomize の外
# （scripts/k8s-local-up.sh）で実 realm ファイル（単一情報源）から生成する。
# kustomize の configMapGenerator は root 外ファイル（deploy/keycloak/…, submodule 側 AST realm）を
# セキュリティ上参照できないため。手動適用時は README「手動でステップ実行」の手順で先に作成する。
