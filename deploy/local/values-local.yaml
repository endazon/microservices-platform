# IADR-0066: ローカル k8s(k3d) dev 用 Helm values 上書き。
# 適用: helm upgrade --install msp deploy/helm/microservices-platform \
#         -n microservices-platform --create-namespace -f deploy/local/values-local.yaml
#
# 本番像（deploy/helm/microservices-platform/values.yaml）は不変。ここでは dev 差分のみ上書きする。

global:
  image:
    # k3d へ import するローカルイメージの接頭辞（実レジストリではない。IfNotPresent で pull しない）。
    # ビルド/インポートは scripts/k8s-local-images.sh が同じ接頭辞・タグで行う。
    registry: k3d-local
    pullPolicy: IfNotPresent

# Istio 未導入のローカルでは mTLS/サイドカー注入を無効化する（本番像 STRICT は不変）。
namespace:
  # namespace は up-script が先に作成し（Secret 投入のため）、Helm には所有させない。
  # chart が Namespace を template すると、既存 ns に Helm 所有メタデータが無く install が衝突するため。
  create: false
  istioInjection: false
mesh:
  enabled: false

# Issue #284, IADR-0076: エッジ /bff/* ルーティングは Istio Gateway/VirtualService 前提。ローカル（経路B）は
# Istio を導入しないため無効化する（本番像 values.yaml は enabled のまま不変）。経路B のエッジ疎通は
# deploy/local/README.md「エッジ経路（/bff・ブラウザ OIDC）」の手順（port-forward / Traefik）に委ねる。
edge:
  enabled: false

# metrics-server 依存の HPA と NetworkPolicy を dev では無効化（本番像は不変）。
networkPolicy:
  enabled: false
scaling:
  enabled: false

# imagePullSecrets はローカル import のため不要（空のまま）。
imagePullSecrets: []

services:
  # FR-01, UC-04, NFR, IADR-0074 (#299): 経路B(ローカル k8s / k3d) は監査の検証環境。定期同期を明示的に
  # 有効化し「15 分以内反映」が成立する形にする。反映を素早く確認できるよう間隔を 60 秒へ短縮する
  # （本番像 values.yaml は 300 秒のまま不変）。scaling.enabled=false ＝ replicas 1 で多重実行は起きない。
  # active データソース／実ファイル共有が無い環境では sync 対象ゼロで安全に空回りする（fail-safe。実データ
  # 疎通の live 部分は別手順）。base の datasource ブロック（image/objectStorage 等）へ deep-merge される。
  datasource:
    dataSourceSync:
      enabled: true
      intervalSeconds: 60

  # Issue #284, IADR-0076 (#283/#287/#288): AST の 3 画面系サービスを経路B で有効化する（本番像は fail-safe の
  # disabled のまま不変）。接続情報は AST の appsettings.json が持たず env 注入が必須で、deployment.yaml は
  # Auth__Authority/Otlp のみ自動注入するため、ConnectionStrings（全 3）と RabbitMq（risk/market）を extraEnv で
  # 補う。資格情報は経路B postgres.yaml の owner=ai に合わせ ai/ai（postgres.yaml は無改変）。RabbitMQ は guest/guest
  # （k8s-local-up.sh 既定）。※ `RABBITMQ_PASSWORD` を上書きして up した場合は下記 amqp URL のパスワードも追随させること。
  # DB（configuration_svc/risk_management_svc/market_monitor_svc）・イメージ（MAPPING）・trading-owner realm・
  # trading-owner 付与済み developer は既存で充足。実 Pod 起動/ヘルス緑・OIDC 実ログイン・E2E は live（#284 手順）。
  configuration:
    enabled: true
    extraEnv:
      - name: ConnectionStrings__DefaultConnection
        value: "Host=postgres;Port=5432;Database=configuration_svc;Username=ai;Password=ai"

  risk-management:
    enabled: true
    extraEnv:
      - name: ConnectionStrings__DefaultConnection
        value: "Host=postgres;Port=5432;Database=risk_management_svc;Username=ai;Password=ai"
      # RiskManagementService は MassTransit（RabbitMQ）を使う（compose の *rabbit-env と同値）。
      - name: RabbitMq__ConnectionString
        value: "amqp://guest:guest@rabbitmq:5672"

  market-monitor:
    enabled: true
    extraEnv:
      - name: ConnectionStrings__DefaultConnection
        value: "Host=postgres;Port=5432;Database=market_monitor_svc;Username=ai;Password=ai"
      # MarketMonitorService も MassTransit（RabbitMQ）を使う。
      - name: RabbitMq__ConnectionString
        value: "amqp://guest:guest@rabbitmq:5672"

  llmgateway:
    # k8s-local-up.sh が作成する Secret llm-provider-credentials を LlmGateway の
    # Llm__ApiKey（Anthropic）へ配線する。fail-safe: 未設定なら空文字 = 外部 LLM を呼ばない
    # （compose の `Llm__ApiKey: ${ANTHROPIC_API_KEY:-}` と同じ挙動）。
    # 本番 chart（values.yaml）は本 Secret を未参照のまま（既存ギャップ・別課題）。
    extraEnv:
      - name: Llm__ApiKey
        secretKeyRef:
          name: llm-provider-credentials
          key: anthropic-api-key

# Issue #313, IADR-0078: SPA(frontend) を経路B(ローカル k8s / k3d) で配信する。image は
# global.image.registry=k3d-local を接頭辞に使う（k8s-local-images.sh が同接頭辞・タグで build/import）。
# 経路B は edge.enabled=false（Istio 未導入）のため SPA へのブラウザ到達は frontend-service の port-forward
# で行う（deploy/local/README.md「SPA(/settings) 到達」）。OIDC issuer は base 既定 http://keycloak:8080/... の
# ままにする（#284 手順A: hosts+port-forward で browser にも in-cluster 名 keycloak:8080 を解決させ、backend の
# Auth__Authority と iss を一致させる。localhost へ上書きすると iss 不一致でトークン検証が失敗するため上書きしない）。
# bffUpstream も base の bff-service:8080（nginx が /bff を in-cluster BFF へプロキシ）で正しく上書き不要。
# base は既定 enabled だが経路B での有効化を明示する。実 Pod 起動/ヘルス緑・実ログインは live（#284 手順）。
#
# Issue #344, SC-04/UC-07/FR-13, IADR-0020/IADR-0078: 「Wiki 閲覧」(SC-04) はブラウザ向け実行時 config
# `wikiBaseUrl`（config.js の WIKI_BASE_URL）から Wiki.js を直接開く導線。base の frontend.extraEnv は空で
# WIKI_BASE_URL が空文字→「Wiki の接続先が未設定です」になるため、経路B では extraEnv で公開 URL を供給する。
# 到達は他コンポーネント（keycloak/bff/frontend）と同じく wiki-js の port-forward に整合させる
# （edge.enabled=false＝Istio 未導入のため直 port-forward が既定手順。deploy/local/README.md「Wiki 閲覧の到達」）:
#   kubectl -n microservices-platform port-forward svc/wiki-js 3300:3000  → http://localhost:3300
# ※ Wiki.js→Keycloak の SSO issuer 整合は #284 手順A（browser も keycloak:8080 を issuer 共有）に従う。
#   Wiki.js 側の realm redirectUris 追記・実ブラウザ SSO ログイン疎通は live（realm.json/稼働 k3d 依存・分離）。
# 本番像 values.yaml の frontend.extraEnv は空のまま不変（実 Wiki URL は per-env で extraEnv 供給・opt-in・後方互換）。
frontend:
  enabled: true
  extraEnv:
    - name: WIKI_BASE_URL
      value: "http://localhost:3300"

# Issue #353, IADR-0093: 経路B の MinIO Console を Keycloak OIDC(SSO) 連携する（本番像 values.yaml は
# oidc.enabled=false のまま不変・byte 等価）。config_url は MSP ns の ExternalName alias `keycloak` 経由で
# in-cluster の Keycloak well-known を指す（browser は #284 手順A）。集約後 URL（minio.localhost:50000・#357/edge）を
# Console 公開 URL に。client secret は Secret `minio-oidc`（k8s-local-up.sh 作成）。root は break-glass として残る。
# ※ 実ログインには MinIO ポリシー（platform-admin/operator）の適用が必要（deploy/local/minio-oidc/README.md の mc 手順）。
minio:
  oidc:
    enabled: true
    configUrl: "http://keycloak:8080/realms/microservices-platform/.well-known/openid-configuration"
    browserRedirectUrl: "http://minio.localhost:50000"
