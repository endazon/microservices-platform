# IADR-0066: ローカル k8s(k3d) dev 用 Helm values 上書き。
# 適用: helm upgrade --install msp deploy/helm/microservices-platform \
#         -n microservices-platform --create-namespace -f deploy/local/values-local.yaml \
#         --set-string global.image.tag=<不変のタグ>
#   （NFR-20 / IADR-0605 / #2132: 自製イメージのタグはここに書かない。scripts/k8s-local-up.sh が作業ツリーの git の sha で
#    ビルドし、同じ値を渡す。タグが無いと chart の描画が落ちる。値は bash scripts/lib/local-image-tag.sh で確かめられる）
#
# 本番像（deploy/helm/microservices-platform/values.yaml）は不変。ここでは dev 差分のみ上書きする。

global:
  image:
    # k3d へ import するローカルイメージの接頭辞（実レジストリではない。IfNotPresent で pull しない）。
    # ビルド/インポートは scripts/k8s-local-images.sh が同じ接頭辞で行う。タグ（global.image.tag）は起動器が --set-string で渡す
    #   （IADR-0605。不変のタグが変われば Pod の template が変わるので、IfNotPresent のままで新しいイメージへ入れ替わる）。
    registry: k3d-local
    pullPolicy: IfNotPresent
  # #780 第2段 / IADR-0086 / IADR-0243: Keycloak の issuer をエッジ host（https://keycloak.localhost）へ
  # 移した後も、.NET の OIDC metadata 取得は in-cluster から到達できる well-known を使う（エッジの
  # 自己署名/ローカル CA を .NET 側で信頼させる必要が無い）。ValidIssuers でエッジ issuer を追加受理する
  # （IADR-0086 決定3: ValidateIssuer は弱めない。署名鍵は常に in-cluster metadata 由来）。
  auth:
    metadataAddress: http://keycloak:8080/realms/platform/.well-known/openid-configuration
    validIssuers: https://keycloak.localhost/realms/platform

# Istio 未導入のローカルでは mTLS/サイドカー注入を無効化する（本番像 STRICT は不変）。
namespace:
  # namespace は up-script が先に作成し（Secret 投入のため）、Helm には所有させない。
  # chart が Namespace を template すると、既存 ns に Helm 所有メタデータが無く install が衝突するため。
  create: false
  istioInjection: false
mesh:
  enabled: false

# Issue #284, IADR-0076: エッジ /bff/* ルーティングは Istio Gateway/VirtualService 前提。ローカル（経路B）は
# Istio を導入しないため無効化する（本番像 values.yaml は enabled のまま不変）。経路B のエッジ疎通は
# deploy/local/README.md「エッジ経路（/bff・ブラウザ OIDC）」の手順（port-forward / Traefik）に委ねる。
#
# 🔴 **ここが false である以上、chart の edge.* は 1 バイトも描画されない。** ローカルの実エッジは
# ADR-0021 / #782 の overlay `deploy/local/edge-istio/`（ISTIO=1 かつ LOCALEDGE=1）であり、ルートの正本は
# そちらの VirtualService である。**edge 配下の knob をここへ書き足さないこと** —— 不活性な設定になり、
# overlay 側と静かに食い違う（例: FR-20 の /private-notes/sync/ 公開は overlay が無条件に持ち、
# 本番像の edge.privateNotesSync.enabled は既定 false の opt-in である。IADR-0348 / #1154）。
edge:
  enabled: false

# metrics-server 依存の HPA と NetworkPolicy を dev では無効化（本番像は不変）。
# NFR-18, IADR-0589（Refs GHSA-j4qv-2w99-xg5p）: ただし egress の既定拒否は当てる（ingress の NetworkPolicy は無効のまま）。
#   段 1（本変更）は**クラスタの外へ出ない Pod** だけ。基盤（platform-infra）への宛先は下の destinations で 1 件ずつ開ける。
#   段 2 で足す（それまで egress は従前どおり制限なし）: bff-service（AST の名前空間・Valkey・Vault・API サーバ・opend）、
#   llmgateway-service（LLM・埋め込みの提供元）、datasource-service（SaaS コネクタ・Vault）、wiki-js（エッジの issuer）、
#   config-drift-postsync・embedding・synthetic-monitor。段の一覧の正は作業仕様書 20261022_j4qv_egress-default-deny。
#   🔴 送り元（from）を足すときは、サービスの宣言（database / messaging / Qdrant の利用）と一緒にそろえる
#      （scripts/helm-egress-network-policy.test.js が values の宣言と突き合わせる）。
networkPolicy:
  enabled: false
  egress:
    enabled: true
    workloads:
      - aianalysis-service
      - authorization-service
      - conversion-service
      - dashboard-service
      - document-service
      - feedback-service
      - graph-service
      - ingestion-service
      - mcp-service
      - notification-service
      - retrieval-service
      - wiki-service
      - frontend-service
      - seaweedfs
      # 確かめ用の使い捨ての Pod（Service を持たない。統合スタックの門と運用の確認手順が `kubectl run --labels=app=egress-probe` で立てる）。
      # 宛先の許可を 1 つも持たないので、名前解決と同じ名前空間だけに届くことを稼働のクラスタで測れる。
      - egress-probe
    # 基盤は platform-infra に居る（deploy/local/infra。名前は aliases の ExternalName で引く）。
    destinations:
      # サービス DB（services.<名>.database を持つもの）。
      - name: postgres
        namespace: platform-infra
        podLabels: { app: postgres }
        ports: [5432]
        from: [authorization-service, conversion-service, dashboard-service, document-service, feedback-service, graph-service, mcp-service, notification-service, wiki-service]
      # ブローカ（services.<名>.messaging: true のもの。rabbitmq-ingress-clients と同じ集合）。
      # NFR-16, IADR-0591: MSP のサービスは TLS の口（5671・global.messaging.tls.port）だけで繋ぐ。平文の 5672 は開けない
      #   （global.messaging.tls.enabled=false へ切り戻すときは、ここも 5672 へ戻す）。
      - name: rabbitmq
        namespace: platform-infra
        podLabels: { app: rabbitmq }
        ports: [5671]
        from: [conversion-service, document-service, graph-service, ingestion-service, retrieval-service, wiki-service]
      # 認可サーバ（OIDC の metadata・JWKS・サービスの token・管理 API）。.NET のサービスすべて。
      - name: keycloak
        namespace: platform-infra
        podLabels: { app: keycloak }
        ports: [8080]
        from: [aianalysis-service, authorization-service, conversion-service, dashboard-service, document-service, feedback-service, graph-service, ingestion-service, mcp-service, notification-service, retrieval-service, wiki-service]
      # テレメトリ（global.otel.endpoint の OTLP gRPC）。.NET のサービスすべて。
      - name: otel-collector
        namespace: platform-infra
        podLabels: { app: otel-collector }
        ports: [4317]
        from: [aianalysis-service, authorization-service, conversion-service, dashboard-service, document-service, feedback-service, graph-service, ingestion-service, mcp-service, notification-service, retrieval-service, wiki-service]
      # ベクトル索引（gRPC 6334・検索の health は REST 6333 の /healthz）。
      - name: qdrant
        namespace: platform-infra
        podLabels: { app: qdrant }
        ports: [6333, 6334]
        from: [ingestion-service, retrieval-service]
scaling:
  enabled: false

# imagePullSecrets はローカル import のため不要（空のまま）。
imagePullSecrets: []

services:
  # FR-01, UC-04, NFR, IADR-0074 (#299): 経路B(ローカル k8s / k3d) は監査の検証環境。定期同期を明示的に
  # 有効化し「15 分以内反映」が成立する形にする。反映を素早く確認できるよう間隔を 60 秒へ短縮する
  # （本番像 values.yaml は 300 秒のまま不変）。scaling.enabled=false ＝ replicas 1 で多重実行は起きない。
  # active データソース／実ファイル共有が無い環境では sync 対象ゼロで安全に空回りする（fail-safe。実データ
  # 疎通の live 部分は別手順）。base の datasource ブロック（image/objectStorage 等）へ deep-merge される。
  datasource:
    dataSourceSync:
      enabled: true
      intervalSeconds: 60

  # Issue #407, IADR-0107: AST の 3 画面系サービス（configuration / risk-management / market-monitor）は
  # **AST chart（ai-stock-trading namespace）が単一の所有者**であり、MSP 側には実体を置かない。
  # 本番像 values.yaml の fail-safe 既定（enabled: false）と一致させる＝ここでは上書きしない。
  #
  # 経緯: Issue #284 / IADR-0076 (#283/#287/#288) は BFF の pass-through 先を満たすため、ここで同 3 サービスを
  # enabled: true ＋ ConnectionStrings / RabbitMq の extraEnv 注入で有効化していた。しかし AST chart は同じ
  # 3 サービスを ai-stock-trading namespace へ常時デプロイし、両 namespace の rabbitmq / postgres は
  # ExternalName で**同一の platform-infra 実体**を指すため、同一 broker・同一 vhost・同一 DB を共有する
  # 2 つの writer が並走していた。実測（取引フェーズ2 検証）では risk-management / market-monitor の
  # 計 4 Pod が RabbitMQ の同一キュー `TradeDecisionMade` を consumers=4 で奪い合い、取引判断
  # （OrderApproved / OrderRejected）を無言で取りこぼした（Issue #407 原因A）。
  #
  # BFF からの到達: deploy/local/aliases/microservices-platform-externalnames.yaml の ExternalName alias が
  # `<svc>-service` を `<svc>-service.ai-stock-trading.svc.cluster.local` へ解決させる。BFF のコード既定
  # （Platform.Bff/Program.cs の http://<svc>-service:8080）が無改修のまま AST ns の単一実体へ届く。
  # DB / RabbitMQ の接続情報は AST chart 側（deploy/helm/ai-stock-trading/）が所有するため、ここでは持たない。
  #
  # fail-safe: AST chart 未適用時は alias の解決先に Service が無く、BFF は不達→502 へ縮退する
  # （IADR-0071 / IADR-0072 が明記した既存設計。readiness の UriHealthCheck には含めない）。
  # 前提と到達手順は deploy/local/README.md「AST 3 画面系（AST/SC-01・AST/SC-02・AST/SC-03）の到達」を参照。
  # 再発防止は scripts/check-unit-service-ownership.js（CI 必須チェック）。

  llmgateway:
    # SC-22, IADR-0456 決定 5 (#1477): 画面（/admin/secrets）で差し替えた API キーを Pod へ届ける。
    # Secret は ESO が force-sync で即時に更新するが、env は Pod 起動時に 1 度だけ解決される（IADR-0103）。
    # ESO=1 で入る Stakater Reloader がこの注釈を見て Deployment を作り直す（Reloader が無ければ何も起きない）。
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: "llm-provider-credentials"
    # k8s-local-up.sh が作成する Secret llm-provider-credentials を LlmGateway の
    # Llm__ApiKey（Anthropic）へ配線する。
    # 🔴 FR-11, IADR-0641 (#2136): **鍵が空なら LLM ゲートウェイは起動時に止まる**（Claude のエンドポイントが有効なとき）。
    #   このファイルは PoC の配備も使うので、鍵なしで起動させる opt-out（Llm__AllowMissingApiKey）は**ここに置かない**。
    #   鍵なしで動かす CI の使い捨てスタックは、起動器の LLM_KEYLESS=1 が extraEnvAppend で足す（scripts/k8s-local-up.sh）。
    #   compose は compose ファイルの側で opt-out を持つ（`Llm__ApiKey: ${ANTHROPIC_API_KEY:-}` と並べて置いている）。
    # 本番 chart（values.yaml）も同じ Secret の同じキーを参照する（#308）。
    # FR-02, ADR-0016, IADR-0504 (#1764): Embedding__Voyage__ApiKey（埋め込み・Voyage AI）も同じ Secret の voyage-api-key から渡す。
    # 🔴 extraEnv はリストの置換なので、本番既定（values.yaml）と同じ 2 件をここにも書く（片方を落とすと鍵が届かない）。
    # optional の理由と鍵が無いときの挙動は values.yaml の同じ行。鍵の入れ方は docs/operations/voyage-embedding-key-runbook.md。
    extraEnv:
      - name: Llm__ApiKey
        secretKeyRef:
          name: llm-provider-credentials
          key: anthropic-api-key
      - name: Embedding__Voyage__ApiKey
        secretKeyRef:
          name: llm-provider-credentials
          key: voyage-api-key
          optional: true

  # #1376, AST/SC-04, AST/IADR-0321 決定 6: OpenD 認証ゲートウェイ（AST の opend Pod のサイドカー）の上流。
  # BaseUrl の既定は空＝「未構成 → 供給が無い」（fail-safe）なので、MSP 連結ローカルではここで所在を与える。
  # 到達は aliases/microservices-platform-externalnames.yaml の ExternalName `opend`（AST ns の Service opend:8080）。
  # DeviceTrustPersisted は PVC opend-persist を持つ配備構成の事実（配備構成から静的に決まる）。EgressStable は
  # ローカルが固定 NAT ではないため与えない（未設定＝供給なし）。本番 chart は触らない。
  # 🔴 #1389: ここは extraEnv ではなく **extraEnvAppend**。extraEnv だと Helm のリスト置換で本番既定の
  # Services__* 23 件が消え、BFF の下流 4 サービスへの経路が既定ポートへ外れる（当時は readiness の URL 検査が落ちて
  # integration-stack で実測した。#2105 / IADR-0602 以後は readiness に下流を含めないので、症状は各画面の 502 になる）。
  bff:
    # NFR, AST/IADR-0566（Refs GHSA-57gc-27c7-gvwm）: 共有シークレットを回したら Reloader が BFF を作り直す（env は起動時に 1 度だけ解決される）。
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: "opend-auth-caller-secret"
    extraEnvAppend:
      - name: OpendAuth__BaseUrl
        value: "http://opend:8080"
      - name: OpendAuth__DeviceTrustPersisted
        value: "true"
      # NFR, AST/IADR-0566（Refs GHSA-57gc-27c7-gvwm）: AST の OpenD 認証サイドカーへ名乗る共有シークレット（呼び出し元の検証）。
      # Secret は ESO=1 で deploy/local/vault/eso/externalsecret-opend-auth-caller-secret.yaml が同期する（AST の chart と同じ Vault のキー）。
      # optional: Secret が無くても BFF は起動する（上流を呼ばず、SC-04 に「接続資格が構成されていません」と示す）。
      - name: OpendAuth__CallerSecret
        secretKeyRef:
          name: opend-auth-caller-secret
          key: caller-secret
          optional: true
    # SC-22, IADR-0433, IADR-0453 決定 5 (#1411): 秘密情報の投入先はローカルの dev Vault（VAULT=1）。
    # **VAULT=1 ESO=1（または VAULT=1 VAULT_BFF_WRITER=1）でなければ Vault も policy も無く、/admin/secrets は 503（接続できない）を出す** —— 静かに成功しない。
    # policy と role は deploy/local/vault/eso/bootstrap.sh が入れる（ESO=1 のとき）。BFF の役だけなら deploy/local/vault/bff-writer/bootstrap.sh
    # （VAULT_BFF_WRITER=1。使い捨ての CI 用。#2230 / IADR-0658）。
    vault:
      address: "http://vault.platform-infra.svc.cluster.local:8200"
    # SC-22, IADR-0456 決定 4 (#1477): 書き込み後に ExternalSecret へ即時同期を依頼する（ESO の 1 時間の同期間隔を待たない）。
    # MSP の名前空間の Role はチャートが描き、platform-infra / ai-stock-trading の Role は k8s-local-up.sh（ESO=1）が apply する。
    # ローカルは networkPolicy.enabled=false のため apiServerEgress は不要。**ESO=1 でなければ ExternalSecret が無く、
    # 依頼は 404 で失敗し syncRequested=false になる**（書き込み自体は成立する）。
    externalSecretSync:
      enabled: true

  # SC-22, IADR-0456 決定 5 (#1477): wiki-service は wikijs-sync の apiKey を env で読む。画面で差し替えたら Reloader が作り直す。
  wiki:
    deploymentAnnotations:
      secret.reloader.stakater.com/reload: "wikijs-sync"

# Issue #313, IADR-0078: SPA(frontend) を経路B(ローカル k8s / k3d) で配信する。image は
# global.image.registry=k3d-local を接頭辞に使う（k8s-local-images.sh が同接頭辞・同じ不変のタグで build/import。IADR-0605）。
# 経路B は edge.enabled=false（Istio 未導入）のため SPA へのブラウザ到達は frontend-service の port-forward
# で行う（deploy/local/README.md「SPA(/settings) 到達」）。OIDC issuer は base 既定 http://keycloak:8080/... の
# ままにする（#284 手順A: hosts+port-forward で browser にも in-cluster 名 keycloak:8080 を解決させ、backend の
# Auth__Authority と iss を一致させる。localhost へ上書きすると iss 不一致でトークン検証が失敗するため上書きしない）。
# bffUpstream も base の bff-service:8080（Caddy が /bff を in-cluster BFF へプロキシ）で正しく上書き不要。
# base は既定 enabled だが経路B での有効化を明示する。実 Pod 起動/ヘルス緑・実ログインは live（#284 手順）。
#
# Issue #344 → #1200, SC-04/UC-07/FR-13, ADR-0073 決定 1・5, IADR-0020/IADR-0078/IADR-0365:
# 🔴 **「Wiki 閲覧」(SC-04) はもう WIKI_BASE_URL を読まない**（#1200。画面は /bff/wiki/* 経由でページツリー・本文・検索を
# 描く）。この値は dev の Wiki.js **管理 UI** の到達先を示す手引きとして残してある（決定 5。dev では ABAC の統制が働かない
# —— deploy/local/README.md §Wiki 閲覧の到達）。**本番像 values.yaml では設定しないことが統制**（決定 1）。
# 従前の記述「Wiki.js を直接開く導線。空文字だと『接続先が未設定です』」は失効した。
# Issue #344 追補（IADR-0091 edge 集約フォローアップ・.ai-context/specs/20260725_issue-344_wiki-base-url-edge-alignment.md）:
# 到達は他の管理ツール（grafana/vault 等）と同じく edge 集約後の正規 URL に整合させる。IADR-0091 の
# ローカル edge overlay `deploy/local/edge`（LOCALEDGE=1）で Wiki.js は wiki.localhost:50000 に公開され、realm
# `wiki-js` client も同 URL を登録済み。集約後 URL は deploy/local/edge/README.md「アクセス／OIDC（集約後 URL）」参照:
#   https://wiki.localhost:50000  （LOCALEDGE=1 で edge overlay 適用時＝ローカルの正規アクセス）
# ※ 非 edge（LOCALEDGE 未使用・port-forward svc/wiki-js 3300:3000）で使う場合は本値を http://localhost:3300 へ
#   override する（deploy/local/README.md「Wiki 閲覧の到達」の override 手順）。
# ※ Wiki.js→Keycloak の SSO issuer 整合は #284 手順A（browser も keycloak:8080 を issuer 共有）に従う。
#   実ブラウザ SSO ログイン疎通は live（稼働 k3d/edge 依存・分離）。
# 本番像 values.yaml の frontend.extraEnv は空のまま不変（実 Wiki URL は per-env で extraEnv 供給・opt-in・後方互換）。
frontend:
  enabled: true
  # #780 第2段 / IADR-0243: ブラウザが到達する OIDC issuer をエッジ host（https://keycloak.localhost）へ。
  # config.js の authority はここから描画される（base values.yaml のコメントが per-env 上書きを指示している）。
  oidc:
    authority: "https://keycloak.localhost/realms/platform"
  extraEnv:
    - name: WIKI_BASE_URL
      value: "https://wiki.localhost:50000"

# ［IADR-0461 決定 5 / #1499］経路B の MinIO Console SSO（IADR-0093）の上書きはここにあったが撤去した。
# オブジェクトストレージは SeaweedFS へ差し替え、管理 Console を持たない（ADR-0106 決定 6）。
