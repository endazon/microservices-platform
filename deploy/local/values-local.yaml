# IADR-0066: ローカル k8s(k3d) dev 用 Helm values 上書き。
# 適用: helm upgrade --install msp deploy/helm/microservices-platform \
#         -n microservices-platform --create-namespace -f deploy/local/values-local.yaml
#
# 本番像（deploy/helm/microservices-platform/values.yaml）は不変。ここでは dev 差分のみ上書きする。

global:
  image:
    # k3d へ import するローカルイメージの接頭辞（実レジストリではない。IfNotPresent で pull しない）。
    # ビルド/インポートは scripts/k8s-local-images.sh が同じ接頭辞・タグで行う。
    registry: k3d-local
    pullPolicy: IfNotPresent
  # #780 第2段 / IADR-0086 / IADR-0243: Keycloak の issuer をエッジ host（https://keycloak.localhost）へ
  # 移した後も、.NET の OIDC metadata 取得は in-cluster から到達できる well-known を使う（エッジの
  # 自己署名/ローカル CA を .NET 側で信頼させる必要が無い）。ValidIssuers でエッジ issuer を追加受理する
  # （IADR-0086 決定3: ValidateIssuer は弱めない。署名鍵は常に in-cluster metadata 由来）。
  auth:
    metadataAddress: http://keycloak:8080/realms/platform/.well-known/openid-configuration
    validIssuers: https://keycloak.localhost/realms/platform

# Istio 未導入のローカルでは mTLS/サイドカー注入を無効化する（本番像 STRICT は不変）。
namespace:
  # namespace は up-script が先に作成し（Secret 投入のため）、Helm には所有させない。
  # chart が Namespace を template すると、既存 ns に Helm 所有メタデータが無く install が衝突するため。
  create: false
  istioInjection: false
mesh:
  enabled: false

# Issue #284, IADR-0076: エッジ /bff/* ルーティングは Istio Gateway/VirtualService 前提。ローカル（経路B）は
# Istio を導入しないため無効化する（本番像 values.yaml は enabled のまま不変）。経路B のエッジ疎通は
# deploy/local/README.md「エッジ経路（/bff・ブラウザ OIDC）」の手順（port-forward / Traefik）に委ねる。
#
# 🔴 **ここが false である以上、chart の edge.* は 1 バイトも描画されない。** ローカルの実エッジは
# ADR-0021 / #782 の overlay `deploy/local/edge-istio/`（ISTIO=1 かつ LOCALEDGE=1）であり、ルートの正本は
# そちらの VirtualService である。**edge 配下の knob をここへ書き足さないこと** —— 不活性な設定になり、
# overlay 側と静かに食い違う（例: FR-20 の /private-notes/sync/ 公開は overlay が無条件に持ち、
# 本番像の edge.privateNotesSync.enabled は既定 false の opt-in である。IADR-0348 / #1154）。
edge:
  enabled: false

# metrics-server 依存の HPA と NetworkPolicy を dev では無効化（本番像は不変）。
networkPolicy:
  enabled: false
scaling:
  enabled: false

# imagePullSecrets はローカル import のため不要（空のまま）。
imagePullSecrets: []

services:
  # FR-01, UC-04, NFR, IADR-0074 (#299): 経路B(ローカル k8s / k3d) は監査の検証環境。定期同期を明示的に
  # 有効化し「15 分以内反映」が成立する形にする。反映を素早く確認できるよう間隔を 60 秒へ短縮する
  # （本番像 values.yaml は 300 秒のまま不変）。scaling.enabled=false ＝ replicas 1 で多重実行は起きない。
  # active データソース／実ファイル共有が無い環境では sync 対象ゼロで安全に空回りする（fail-safe。実データ
  # 疎通の live 部分は別手順）。base の datasource ブロック（image/objectStorage 等）へ deep-merge される。
  datasource:
    dataSourceSync:
      enabled: true
      intervalSeconds: 60

  # Issue #407, IADR-0107: AST の 3 画面系サービス（configuration / risk-management / market-monitor）は
  # **AST chart（ai-stock-trading namespace）が単一の所有者**であり、MSP 側には実体を置かない。
  # 本番像 values.yaml の fail-safe 既定（enabled: false）と一致させる＝ここでは上書きしない。
  #
  # 経緯: Issue #284 / IADR-0076 (#283/#287/#288) は BFF の pass-through 先を満たすため、ここで同 3 サービスを
  # enabled: true ＋ ConnectionStrings / RabbitMq の extraEnv 注入で有効化していた。しかし AST chart は同じ
  # 3 サービスを ai-stock-trading namespace へ常時デプロイし、両 namespace の rabbitmq / postgres は
  # ExternalName で**同一の platform-infra 実体**を指すため、同一 broker・同一 vhost・同一 DB を共有する
  # 2 つの writer が並走していた。実測（取引フェーズ2 検証）では risk-management / market-monitor の
  # 計 4 Pod が RabbitMQ の同一キュー `TradeDecisionMade` を consumers=4 で奪い合い、取引判断
  # （OrderApproved / OrderRejected）を無言で取りこぼした（Issue #407 原因A）。
  #
  # BFF からの到達: deploy/local/aliases/microservices-platform-externalnames.yaml の ExternalName alias が
  # `<svc>-service` を `<svc>-service.ai-stock-trading.svc.cluster.local` へ解決させる。BFF のコード既定
  # （Platform.Bff/Program.cs の http://<svc>-service:8080）が無改修のまま AST ns の単一実体へ届く。
  # DB / RabbitMQ の接続情報は AST chart 側（deploy/helm/ai-stock-trading/）が所有するため、ここでは持たない。
  #
  # fail-safe: AST chart 未適用時は alias の解決先に Service が無く、BFF は不達→502 へ縮退する
  # （IADR-0071 / IADR-0072 が明記した既存設計。readiness の UriHealthCheck には含めない）。
  # 前提と到達手順は deploy/local/README.md「AST 3 画面系（AST/SC-01・AST/SC-02・AST/SC-03）の到達」を参照。
  # 再発防止は scripts/check-unit-service-ownership.js（CI 必須チェック）。

  llmgateway:
    # k8s-local-up.sh が作成する Secret llm-provider-credentials を LlmGateway の
    # Llm__ApiKey（Anthropic）へ配線する。fail-safe: 未設定なら空文字 = 外部 LLM を呼ばない
    # （compose の `Llm__ApiKey: ${ANTHROPIC_API_KEY:-}` と同じ挙動）。
    # 本番 chart（values.yaml）は本 Secret を未参照のまま（既存ギャップ・別課題）。
    extraEnv:
      - name: Llm__ApiKey
        secretKeyRef:
          name: llm-provider-credentials
          key: anthropic-api-key

# Issue #313, IADR-0078: SPA(frontend) を経路B(ローカル k8s / k3d) で配信する。image は
# global.image.registry=k3d-local を接頭辞に使う（k8s-local-images.sh が同接頭辞・タグで build/import）。
# 経路B は edge.enabled=false（Istio 未導入）のため SPA へのブラウザ到達は frontend-service の port-forward
# で行う（deploy/local/README.md「SPA(/settings) 到達」）。OIDC issuer は base 既定 http://keycloak:8080/... の
# ままにする（#284 手順A: hosts+port-forward で browser にも in-cluster 名 keycloak:8080 を解決させ、backend の
# Auth__Authority と iss を一致させる。localhost へ上書きすると iss 不一致でトークン検証が失敗するため上書きしない）。
# bffUpstream も base の bff-service:8080（nginx が /bff を in-cluster BFF へプロキシ）で正しく上書き不要。
# base は既定 enabled だが経路B での有効化を明示する。実 Pod 起動/ヘルス緑・実ログインは live（#284 手順）。
#
# Issue #344 → #1200, SC-04/UC-07/FR-13, ADR-0073 決定 1・5, IADR-0020/IADR-0078/IADR-0367:
# 🔴 **「Wiki 閲覧」(SC-04) はもう WIKI_BASE_URL を読まない**（#1200。画面は /bff/wiki/* 経由でページツリー・本文・検索を
# 描く）。この値は dev の Wiki.js **管理 UI** の到達先を示す手引きとして残してある（決定 5。dev では ABAC の統制が働かない
# —— deploy/local/README.md §Wiki 閲覧の到達）。**本番像 values.yaml では設定しないことが統制**（決定 1）。
# 従前の記述「Wiki.js を直接開く導線。空文字だと『接続先が未設定です』」は失効した。
# Issue #344 追補（IADR-0091 edge 集約フォローアップ・.ai-context/specs/20260725_issue-344_wiki-base-url-edge-alignment.md）:
# 到達は他の管理ツール（grafana/minio/vault 等）と同じく edge 集約後の正規 URL に整合させる。IADR-0091 の
# ローカル edge overlay `deploy/local/edge`（LOCALEDGE=1）で Wiki.js は wiki.localhost:50000 に公開され、realm
# `wiki-js` client も同 URL を登録済み。集約後 URL は deploy/local/edge/README.md「アクセス／OIDC（集約後 URL）」参照:
#   https://wiki.localhost:50000  （LOCALEDGE=1 で edge overlay 適用時＝ローカルの正規アクセス）
# ※ 非 edge（LOCALEDGE 未使用・port-forward svc/wiki-js 3300:3000）で使う場合は本値を http://localhost:3300 へ
#   override する（deploy/local/README.md「Wiki 閲覧の到達」の override 手順）。
# ※ Wiki.js→Keycloak の SSO issuer 整合は #284 手順A（browser も keycloak:8080 を issuer 共有）に従う。
#   実ブラウザ SSO ログイン疎通は live（稼働 k3d/edge 依存・分離）。
# 本番像 values.yaml の frontend.extraEnv は空のまま不変（実 Wiki URL は per-env で extraEnv 供給・opt-in・後方互換）。
frontend:
  enabled: true
  # #780 第2段 / IADR-0243: ブラウザが到達する OIDC issuer をエッジ host（https://keycloak.localhost）へ。
  # config.js の authority はここから描画される（base values.yaml のコメントが per-env 上書きを指示している）。
  oidc:
    authority: "https://keycloak.localhost/realms/platform"
  extraEnv:
    - name: WIKI_BASE_URL
      value: "https://wiki.localhost:50000"

# Issue #353, IADR-0093: 経路B の MinIO Console を Keycloak OIDC(SSO) 連携する（本番像 values.yaml は
# oidc.enabled=false のまま不変・byte 等価）。config_url は MSP ns の ExternalName alias `keycloak` 経由で
# in-cluster の Keycloak well-known を指す（browser は #284 手順A）。集約後 URL（minio.localhost:50000・#357/edge）を
# Console 公開 URL に。client secret は Secret `minio-oidc`（k8s-local-up.sh 作成）。root は break-glass として残る。
# ※ 実ログインには MinIO ポリシー（platform-admin/operator）の適用が必要（deploy/local/minio-oidc/README.md の mc 手順）。
minio:
  oidc:
    enabled: true
    configUrl: "http://keycloak:8080/realms/platform/.well-known/openid-configuration"
    browserRedirectUrl: "https://minio.localhost:50000"
