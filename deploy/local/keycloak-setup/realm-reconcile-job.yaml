# FR-05, NFR-09, ADR-0004 / ADR-0026, IADR-0369 (#1088 / #324):
# realm JSON（ConfigMap keycloak-realms＝単一情報源）と稼働 realm の差分を Admin REST API で当てる Job。
#
# ★ kustomize には入れない。Job は immutable（spec を変えて apply できない）ため、起動器
#   （deploy/local/keycloak-setup/reconcile-realm.sh）が毎回 delete → apply する。スクリプト本体
#   （reconcile-realm.js）は ConfigMap keycloak-realm-reconcile として同じ起動器が --from-file で作る
#   （テーマ ConfigMap keycloak-theme-platform と同型。root 外ファイルは kustomize が参照できない）。
# ★ platform-infra に置く。keycloak と同じ namespace なので **エッジ・TLS・メッシュのどれにも依存しない**
#   （メッシュ内に置くとサイドカー付き Job が完了しない）。
# ★ Keycloak pod で kcadm.sh を exec しない。別 JVM が本体を OOMKilled にする（2026-09-02 実測）。
# ★ RECONCILE_MODE は起動器が apply / check / check-dev-secrets へ書き換える（check-stack-ready.js の G9 は check で走らせる）。
apiVersion: batch/v1
kind: Job
metadata:
  name: keycloak-realm-reconcile
  namespace: platform-infra
  labels:
    app: keycloak-realm-reconcile
spec:
  backoffLimit: 0
  ttlSecondsAfterFinished: 3600
  template:
    metadata:
      labels:
        app: keycloak-realm-reconcile
    spec:
      restartPolicy: Never
      containers:
        - name: reconcile
          # CI（Node 22）と同じメジャー版。外部依存ゼロ（Node 標準の fetch / fs のみ）。
          image: node:22-alpine@sha256:0a7108bf6c7bf5de370ffb1a3ed6be93d405b43ff159f681a8d18c0e2bc2e402
          command: ["node", "/reconcile/reconcile-realm.js"]
          # NFR-10, NFR-18, IADR-0570 (#2024): 試験アカウント e2e-* の資格情報（キーは E2E_<ROLE>_PASSWORD / E2E_<ROLE>_TOTP_SECRET）。
          # OpenBao → ESO が作る（deploy/local/vault/eso/externalsecret-e2e-accounts.yaml）。**optional** —— 無ければ e2e 利用者を作らない
          # （reconcile-realm.js が宣言から外す。プレースホルダのまま作らない）。
          envFrom:
            - secretRef:
                name: e2e-accounts
                optional: true
          env:
            - name: KC_URL
              value: http://keycloak:8080
            - name: REALM_DIR
              value: /import
            - name: RECONCILE_MODE
              value: "apply"
            # NFR-18, IADR-0517 (#1830) / IADR-0572: 無い機密クライアント（サービスアカウントを持つもの。宣言から導出する）を宣言の dev の値で
            # 作ってよいか。起動器が kube context から決めて allow へ書き換える。**既定は deny**（直接 apply しても安全側）。
            - name: DEV_CLIENT_SECRETS_ALLOWED
              value: "deny"
            # NFR-18, IADR-0685 (#2431): 消された seed 利用者のうち作り直してよい名前（カンマ区切り）。既定は空（作り直さない）。
            #   起動器の reconcile-realm.sh が env RECONCILE_RECREATE_USERS から差し替える（名前の形は reconcile-realm.sh と Job が検める）。
            - name: RECONCILE_RECREATE_USERS
              value: ""
            # NFR-18, IADR-0686: サービスアカウントの余剰のロールを apply で外すか（`1` だけ）。既定は "0"（報告だけ・段 1）。
            #   起動器の reconcile-realm.sh が env RECONCILE_REMOVE_SURPLUS（0 / 1）から差し替える。
            - name: RECONCILE_REMOVE_SURPLUS
              value: "0"
            # 管理者名・パスワードの単一情報源は Secret keycloak-admin（deploy/local/infra/keycloak.yaml も同じ Secret を読む）。
            - name: KC_ADMIN_USER
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: username
            - name: KC_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keycloak-admin
                  key: password
          volumeMounts:
            - name: reconcile
              mountPath: /reconcile
              readOnly: true
            - name: realms
              mountPath: /import
              readOnly: true
          resources:
            requests: { cpu: 50m, memory: 64Mi }
            limits: { cpu: 500m, memory: 256Mi }
      volumes:
        - name: reconcile
          configMap:
            name: keycloak-realm-reconcile
        - name: realms
          configMap:
            name: keycloak-realms
