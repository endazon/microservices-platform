# IADR-0066: AST の 10 Worker も共有 infra を素のサービス名（postgres/rabbitmq/keycloak/otel-collector）で
# 参照する（AST compose の既定と一致）。ai-stock-trading namespace に ExternalName エイリアスを置く。
# 適用: kubectl apply -f deploy/local/aliases/ai-stock-trading-externalnames.yaml
#      （ai-stock-trading namespace は AST chart(#122) が作成する）
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: ai-stock-trading
spec:
  type: ExternalName
  externalName: postgres.platform-infra.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: rabbitmq
  namespace: ai-stock-trading
spec:
  type: ExternalName
  externalName: rabbitmq.platform-infra.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: ai-stock-trading
spec:
  type: ExternalName
  externalName: keycloak.platform-infra.svc.cluster.local
---
apiVersion: v1
kind: Service
metadata:
  name: otel-collector
  namespace: ai-stock-trading
spec:
  type: ExternalName
  externalName: otel-collector.platform-infra.svc.cluster.local
