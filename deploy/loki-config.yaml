# ADR-0006: Loki — log aggregation backend
auth_enabled: false

server:
  http_listen_port: 3100
  # NFR-18, ADR-0133, IADR-0553 (#1965): gRPC の受信・送信の上限を既定 4 MiB から 16 MiB へ上げる。
  # querier が frontend へ返す 1 応答（query_range の 1 ページ）が 4 MiB を超えると ResourceExhausted で捨てられ、
  # frontend は応答を待ち続ける（AST の長い行・limit 5000 で 4.6 MiB を実測）。querier 側の送信
  # （frontend_worker.grpc_client_config.max_send_msg_size）は 3.0.0 の既定で 100 MiB あり、詰まるのは受け手のこの上限だけである。
  # 経路 B の inline（deploy/local/observability/loki.yaml）にも同じ値がある。
  grpc_server_max_recv_msg_size: 16777216
  grpc_server_max_send_msg_size: 16777216

common:
  ring:
    instance_addr: 127.0.0.1
    kvstore:
      store: inmemory
  replication_factor: 1
  path_prefix: /tmp/loki

schema_config:
  configs:
    - from: 2024-01-01
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h

# NFR, IADR-0539 (#1927): 書き出す前のチャンクをメモリに持つ時間を縮める（既定 chunk_idle_period 30m / max_chunk_age 2h）。
# 保持（ディスク）は変えない。経路 B の inline（deploy/local/observability/loki.yaml）にも同じ値がある。
ingester:
  chunk_idle_period: 5m
  max_chunk_age: 30m

storage_config:
  tsdb_shipper:
    active_index_directory: /tmp/loki/index
    cache_location: /tmp/loki/index_cache
  filesystem:
    directory: /tmp/loki/chunks

# ADR-0107 決定 4, #1841: 利用統計の送信を止める（既定で有効。送信先 stats.grafana.org/loki-usage-report・4 時間ごと。
# 上流 pkg/analytics/reporter.go v3.0.0）。データ外部送信方針（08_data-egress-policy）の製品別の行の統制である。
# 🔴 消さないこと。経路 B の inline（deploy/local/observability/loki.yaml）にも同じ行があり、
#    scripts/lib/product-egress-defaults.js（check-deploy-manifests が呼ぶ）が両方を検査する。
analytics:
  reporting_enabled: false
